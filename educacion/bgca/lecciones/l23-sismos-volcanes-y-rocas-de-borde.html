<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>L23 · Laboratorio · Roca, sismo y magma</title>
<style>
:root{--bg:#FAF7F0;--ink:#2A2620;--muted:#5C564C;--card:#fff;--gold:#C4A15A;--gold-soft:#F5EDD8;--gold-deep:#8A6B2F;--green:#3D6B4F;--green-soft:#E4F0E8;--blue:#2F5D7A;--blue-soft:#E3EEF4;--rose:#9B3A4A;--rose-soft:#F8E8EB;--line:#E0D0A8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;line-height:1.45}
body{padding:14px 12px 32px}
.wrap{max-width:860px;margin:0 auto}
.badge{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--gold-deep);background:var(--gold-soft);padding:4px 10px;border-radius:999px}
h1{font-size:1.45rem;line-height:1.25;margin:.4rem 0 .3rem}
.lead{color:var(--muted);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.q{font-weight:750;margin:0 0 8px}
.opts{display:grid;gap:8px}
button.opt,button.chip{font:inherit;text-align:left;background:#fff;border:2px solid #D9D0C0;border-radius:12px;padding:10px 12px;cursor:pointer;font-weight:650}
button.opt:hover,button.chip:hover{border-color:var(--gold)}
button.opt.ok,button.chip.ok{border-color:var(--green);background:var(--green-soft)}
button.opt.bad{border-color:var(--rose);background:var(--rose-soft)}
button.opt:disabled{cursor:default}
.why{margin:8px 0 0;font-size:.95rem}
.why strong{color:var(--gold-deep)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.slot{min-height:42px;border:2px dashed #C4B8A0;border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;background:#FFFcf5}
.bar{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:8px 0}
.score{font-weight:800;color:var(--gold-deep)}
button.action{font:inherit;font-weight:800;border:0;border-radius:999px;background:var(--gold);color:#1A160E;padding:8px 14px;cursor:pointer}
footer{color:var(--muted);font-size:.8rem;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="badge">Lección 23 · bloque D · sin red</div>
  <h1>Roca, sismo y magma</h1>
  <p class="lead">La andesita es frecuente, no única. El granito no tiene un solo borde. Magnitud no es intensidad.</p>
  <div class="bar"><span class="score" id="score">0</span><button type="button" class="action" id="reset">Reiniciar</button></div>
  <div id="lab"></div>
  <footer>Les vencimos · laboratorio autónomo · sin red · corrección inmediata</footer>
</div>
<script>

function boot(ITEMS){
  var root=document.getElementById("lab");
  var score=0, done=0;
  var sc=document.getElementById("score");
  function paint(){ sc.textContent=score+" / "+ITEMS.length; }
  ITEMS.forEach(function(it,i){
    var card=document.createElement("section");
    card.className="card";
    var h=document.createElement("p");
    h.className="q";
    h.textContent=(i+1)+". "+it.q;
    card.appendChild(h);
    if(it.tipo==="orden"){
      var slot=document.createElement("div");
      slot.className="slot";
      var pool=document.createElement("div");
      pool.className="row";
      var picked=[];
      function judge(){
        var ok=picked.length===it.correcto.length && picked.every(function(p,k){return p===it.correcto[k];});
        done++; if(ok) score++;
        paint();
        var w=document.createElement("p");
        w.className="why";
        w.innerHTML=(ok?"<strong>Correcto.</strong> ":"<strong>No es esa secuencia.</strong> Orden: "+it.correcto.join(" → ")+". ")+it.porque;
        card.appendChild(w);
        pool.querySelectorAll("button").forEach(function(b){b.disabled=true;});
      }
      it.piezas.forEach(function(txt){
        var b=document.createElement("button");
        b.type="button"; b.className="chip"; b.textContent=txt;
        b.addEventListener("click", function(){
          if(b.disabled) return;
          b.disabled=true; b.className="chip ok";
          picked.push(txt); slot.appendChild(b);
          if(picked.length===it.correcto.length) judge();
        });
        pool.appendChild(b);
      });
      var hint=document.createElement("p");
      hint.className="why";
      hint.textContent="Pulsa en orden, del primero al último.";
      card.appendChild(hint); card.appendChild(slot); card.appendChild(pool);
    } else {
      var opts=document.createElement("div");
      opts.className="opts";
      it.opciones.forEach(function(op){
        var b=document.createElement("button");
        b.type="button"; b.className="opt"; b.textContent=op.t;
        b.addEventListener("click", function(){
          if(card.dataset.done) return;
          card.dataset.done="1"; done++;
          opts.querySelectorAll("button").forEach(function(x){x.disabled=true;});
          if(op.ok){ b.classList.add("ok"); score++; }
          else {
            b.classList.add("bad");
            opts.querySelectorAll("button").forEach(function(x,idx){ if(it.opciones[idx].ok) x.classList.add("ok"); });
          }
          paint();
          var w=document.createElement("p");
          w.className="why";
          w.innerHTML=(op.ok?"<strong>Correcto.</strong> ":"<strong>No.</strong> ")+it.porque;
          card.appendChild(w);
        });
        opts.appendChild(b);
      });
      card.appendChild(opts);
    }
    root.appendChild(card);
  });
  paint();
  document.getElementById("reset").addEventListener("click", function(){ location.reload(); });
  window.addEventListener("message", function(ev){
    var d=ev.data||{};
    if(d.type==="maestro:reset") location.reload();
    if(d.type==="maestro:highlight"){
      var c=root.querySelector(".card"); if(c) c.style.outline="3px solid #C4A15A";
    }
  });
}

boot([{"tipo": "test", "q": "En una dorsal oceánica esperas…", "opciones": [{"t": "Sismos superficiales, volcanismo basáltico por descompresión, gabro en profundidad.", "ok": true}, {"t": "Granito como roca típica y sismos a 600 km.", "ok": false}, {"t": "Andesita exclusiva y una fosa en el eje.", "ok": false}, {"t": "Ningún sismo, porque las placas se separan con calma.", "ok": false}], "porque": "Descompresión de manto, no fusión de corteza continental. Los sismos son someros."}, {"tipo": "test", "q": "La andesita se asocia sobre todo a…", "opciones": [{"t": "Arcos de subducción, sin ser la única roca que el arco puede dar.", "ok": true}, {"t": "Cualquier borde transformante.", "ok": false}, {"t": "El núcleo externo.", "ok": false}, {"t": "Una dorsal, como sinónimo de basalto.", "ok": false}], "porque": "El agua de la losa favorece magmas de arco. Basalto, dacita o riolita también pueden aparecer."}, {"tipo": "test", "q": "Asignar el granito a un solo tipo de borde falla porque…", "opciones": [{"t": "Aparece en varios contextos continentales: arco continental, colisión, a veces intraplaca.", "ok": true}, {"t": "En realidad es la roca de todas las dorsales.", "ok": false}, {"t": "Es una roca sedimentaria de la fosa.", "ok": false}, {"t": "Solo se forma en el aire, como lava.", "ok": false}], "porque": "Hace falta corteza continental que funda o un magma que evolucione dentro de ella. La dorsal oceánica no cumple eso."}, {"tipo": "test", "q": "Un borde transformante, en general,…", "opciones": [{"t": "Tiene sismos superficiales y no tiene una serie volcánica propia.", "ok": true}, {"t": "Tiene un plano de Benioff hasta 600 km.", "ok": false}, {"t": "Produce basalto de descompresión en toda la falla.", "ok": false}, {"t": "Es el único sitio donde hay granito.", "ok": false}], "porque": "Ni descompresión de rift ni volátiles de losa. La sismicidad puede ser importante igualmente."}, {"tipo": "test", "q": "El rebote elástico significa que…", "opciones": [{"t": "La falla trabada acumula deformación y, al romper, los labios se recuperan y radian ondas.", "ok": true}, {"t": "El suelo se funde por el roce y eso es el magma de la dorsal.", "ok": false}, {"t": "El epicentro está siempre a 600 km.", "ok": false}, {"t": "La intensidad es la energía total del planeta.", "ok": false}], "porque": "Hipocentro en la rotura; epicentro en la superficie, encima. Réplicas: reajustes, no otro mecanismo."}, {"tipo": "test", "q": "Fundir la cuña de manto en una subducción se debe sobre todo a…", "opciones": [{"t": "El agua que libera la losa, que baja la temperatura de inicio de la fusión.", "ok": true}, {"t": "La descompresión de una dorsal en la fosa.", "ok": false}, {"t": "Que el granito ya estuviera líquido en el núcleo.", "ok": false}, {"t": "El viento solar.", "ok": false}], "porque": "Es fusión por volátiles. La descompresión es el otro camino, el de la dorsal. El calentamiento de corteza es el tercero."}, {"tipo": "test", "q": "Magnitud e intensidad…", "opciones": [{"t": "La magnitud es una, del tamaño de la fuente; la intensidad cambia de un lugar a otro.", "ok": true}, {"t": "Son la misma escala con números romanos o arábigos, a elegir.", "ok": false}, {"t": "Las dos multiplican la energía por treinta en cada pueblo.", "ok": false}, {"t": "La intensidad no depende del terreno ni de los edificios.", "ok": false}], "porque": "Mw es logarítmica, del orden de treinta veces más energía por grado. EMS-98 describe efectos locales."}, {"tipo": "test", "q": "La cuenca del Duero…", "opciones": [{"t": "Tiene menos sismicidad que el sur peninsular o los Pirineos, y eso no significa sismicidad nula ni una zona de Benioff.", "ok": true}, {"t": "Es un arco volcánico andesítico activo.", "ok": false}, {"t": "Tiene el hipocentro fijo de todos los sismos de Iberia.", "ok": false}, {"t": "Produce el basalto de la dorsal atlántica en sus páramos.", "ok": false}], "porque": "Interior de placa, lejos del contacto principal. No inventamos la magnitud del mayor sismo histórico."}]);
</script>
</body>
</html>
