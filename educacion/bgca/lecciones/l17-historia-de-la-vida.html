<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>L17 · Laboratorio · Árbol, no escalera</title>
<style>
:root{--bg:#FAF7F0;--ink:#2A2620;--muted:#5C564C;--card:#fff;--gold:#C4A15A;--gold-soft:#F5EDD8;--gold-deep:#8A6B2F;--green:#3D6B4F;--green-soft:#E4F0E8;--blue:#2F5D7A;--blue-soft:#E3EEF4;--rose:#9B3A4A;--rose-soft:#F8E8EB;--line:#E0D0A8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;line-height:1.45}
body{padding:14px 12px 32px}
.wrap{max-width:860px;margin:0 auto}
.badge{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--gold-deep);background:var(--gold-soft);padding:4px 10px;border-radius:999px}
h1{font-size:1.45rem;line-height:1.25;margin:.4rem 0 .3rem}
.lead{color:var(--muted);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.q{font-weight:750;margin:0 0 8px}
.opts{display:grid;gap:8px}
button.opt,button.chip{font:inherit;text-align:left;background:#fff;border:2px solid #D9D0C0;border-radius:12px;padding:10px 12px;cursor:pointer;font-weight:650}
button.opt:hover,button.chip:hover{border-color:var(--gold)}
button.opt.ok,button.chip.ok{border-color:var(--green);background:var(--green-soft)}
button.opt.bad{border-color:var(--rose);background:var(--rose-soft)}
button.opt:disabled{cursor:default}
.why{margin:8px 0 0;font-size:.95rem}
.why strong{color:var(--gold-deep)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.slot{min-height:42px;border:2px dashed #C4B8A0;border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;background:#FFFcf5}
.bar{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:8px 0}
.score{font-weight:800;color:var(--gold-deep)}
button.action{font:inherit;font-weight:800;border:0;border-radius:999px;background:var(--gold);color:#1A160E;padding:8px 14px;cursor:pointer}
footer{color:var(--muted);font-size:.8rem;text-align:center}
</style>
<link rel="stylesheet" href="../_maestro/maestro-puntero.css"/>
<script src="../_maestro/maestro-runtime.js" defer></script>
</head>
<body data-maestro-json="maestro-17.json">
<a class="atajo atajo-maestro" href="?maestro=1">Modo maestro</a>
<div class="wrap">
  <div class="badge">Lección 17 · bloque C · sin red</div>
  <h1>Árbol, no escalera</h1>
  <p class="lead">Hipótesis de origen, pruebas de endosimbiosis y orden de faunas. No hay protocolo para fabricar vida.</p>
  <div class="bar"><span class="score" id="score">0</span><button type="button" class="action" id="reset">Reiniciar</button></div>
  <div id="lab"></div>
  <footer>Les vencimos · laboratorio autónomo · sin red · corrección inmediata</footer>
</div>
<script>

function boot(ITEMS){
  var root=document.getElementById("lab");
  var score=0, done=0;
  var sc=document.getElementById("score");
  function paint(){ sc.textContent=score+" / "+ITEMS.length; }
  ITEMS.forEach(function(it,i){
    var card=document.createElement("section");
    card.className="card";
    var h=document.createElement("p");
    h.className="q";
    h.textContent=(i+1)+". "+it.q;
    card.appendChild(h);
    if(it.tipo==="orden"){
      var slot=document.createElement("div");
      slot.className="slot";
      var pool=document.createElement("div");
      pool.className="row";
      var picked=[];
      function judge(){
        var ok=picked.length===it.correcto.length && picked.every(function(p,k){return p===it.correcto[k];});
        done++; if(ok) score++;
        paint();
        var w=document.createElement("p");
        w.className="why";
        w.innerHTML=(ok?"<strong>Correcto.</strong> ":"<strong>No es esa secuencia.</strong> Orden: "+it.correcto.join(" → ")+". ")+it.porque;
        card.appendChild(w);
        pool.querySelectorAll("button").forEach(function(b){b.disabled=true;});
      }
      it.piezas.forEach(function(txt){
        var b=document.createElement("button");
        b.type="button"; b.className="chip"; b.textContent=txt;
        b.addEventListener("click", function(){
          if(b.disabled) return;
          b.disabled=true; b.className="chip ok";
          picked.push(txt); slot.appendChild(b);
          if(picked.length===it.correcto.length) judge();
        });
        pool.appendChild(b);
      });
      var hint=document.createElement("p");
      hint.className="why";
      hint.textContent="Pulsa en orden, del primero al último.";
      card.appendChild(hint); card.appendChild(slot); card.appendChild(pool);
    } else {
      var opts=document.createElement("div");
      opts.className="opts";
      it.opciones.forEach(function(op){
        var b=document.createElement("button");
        b.type="button"; b.className="opt"; b.textContent=op.t;
        b.addEventListener("click", function(){
          if(card.dataset.done) return;
          card.dataset.done="1"; done++;
          opts.querySelectorAll("button").forEach(function(x){x.disabled=true;});
          if(op.ok){ b.classList.add("ok"); score++; }
          else {
            b.classList.add("bad");
            opts.querySelectorAll("button").forEach(function(x,idx){ if(it.opciones[idx].ok) x.classList.add("ok"); });
          }
          paint();
          var w=document.createElement("p");
          w.className="why";
          w.innerHTML=(op.ok?"<strong>Correcto.</strong> ":"<strong>No.</strong> ")+it.porque;
          card.appendChild(w);
        });
        opts.appendChild(b);
      });
      card.appendChild(opts);
    }
    root.appendChild(card);
  });
  paint();
  document.getElementById("reset").addEventListener("click", function(){ location.reload(); });
  window.addEventListener("message", function(ev){
    var d=ev.data||{};
    if(d.type==="maestro:reset") location.reload();
    if(d.type==="maestro:highlight"){
      var c=root.querySelector(".card"); if(c) c.style.outline="3px solid #C4A15A";
    }
  });
}

: false}], "porque": "Hace del orden de 540 Ma. Antes ya hay microbios y hay biotas del Ediacárico. Las causas siguen siendo varias hipótesis."}, {"tipo": "test", "q": "La salida a tierra firme…", "opciones": [{"t": "Ocurre en grupos distintos (plantas, artrópodos, vertebrados) y no es el paso de una sola especie heroica.", "ok": true}, {"t": "Es el mismo suceso que la endosimbiosis de la mitocondria.", "ok": false}, {"t": "Se fecha en esta lección con el año del primer pie.", "ok": false}, {"t": "Demuestra la escalera hacia el ser humano.", "ok": false}], "porque": "Ordovícico a Devónico según el grupo, dicho por periodos, no por un instante. Las plantas además cambian el ambiente."}, {"tipo": "test", "q": "Tras la extinción de hace unos 66 Ma…", "opciones": [{"t": "Los dinosaurios no avianos desaparecen; las aves siguen; los mamíferos se diversifican en huecos.", "ok": true}, {"t": "Nacen los mamíferos y se apaga todo lo demás, bacterias incluidas.", "ok": false}, {"t": "Queda refutada la endosimbiosis.", "ok": false}, {"t": "Empieza el Arcaico.", "ok": false}], "porque": "El impacto de Chicxulub está bien apoyado. El Decán se discute como añadido. La crisis cambia faunas, no inventa el grupo mamífero."}, {"tipo": "test", "q": "Decir que una bacteria actual es «menos evolucionada» que una persona falla porque…", "opciones": [{"t": "Su linaje es igual de largo y está adaptado a otro modo de vida; no es un peldaño inferior.", "ok": true}, {"t": "Las bacterias aparecieron en el Cuaternario.", "ok": false}, {"t": "La evolución solo actúa en vertebrados.", "ok": false}, {"t": "LUCA era ya un mamífero.", "ok": false}], "porque": "Descendencia con modificación: las puntas del árbol son contemporáneas. «Primitivo» como insulto de progreso no describe el árbol."}, {"tipo": "orden", "q": "Ordena de más antiguo a más moderno, a la escala de esta lección.", "piezas": ["Extinción de finales del Cretácico", "Explosión cámbrica", "Indicios de vida microbiana en el Arcaico", "Bosques y tetrápodos en el Devónico"], "correcto": ["Indicios de vida microbiana en el Arcaico", "Explosión cámbrica", "Bosques y tetrápodos en el Devónico", "Extinción de finales del Cretácico"], "porque": "Microbios mucho antes del Fanerozoico; Cámbrico al inicio de este; Devónico ya dentro del Paleozoico; la crisis de los dinosaurios no avianos cierra el Mesozoico."}]);
</script>
