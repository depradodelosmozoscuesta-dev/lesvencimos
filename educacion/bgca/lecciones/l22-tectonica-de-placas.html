<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>L22 · Laboratorio · Borde y relieve</title>
<style>
:root{--bg:#FAF7F0;--ink:#2A2620;--muted:#5C564C;--card:#fff;--gold:#C4A15A;--gold-soft:#F5EDD8;--gold-deep:#8A6B2F;--green:#3D6B4F;--green-soft:#E4F0E8;--blue:#2F5D7A;--blue-soft:#E3EEF4;--rose:#9B3A4A;--rose-soft:#F8E8EB;--line:#E0D0A8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;line-height:1.45}
body{padding:14px 12px 32px}
.wrap{max-width:860px;margin:0 auto}
.badge{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--gold-deep);background:var(--gold-soft);padding:4px 10px;border-radius:999px}
h1{font-size:1.45rem;line-height:1.25;margin:.4rem 0 .3rem}
.lead{color:var(--muted);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.q{font-weight:750;margin:0 0 8px}
.opts{display:grid;gap:8px}
button.opt,button.chip{font:inherit;text-align:left;background:#fff;border:2px solid #D9D0C0;border-radius:12px;padding:10px 12px;cursor:pointer;font-weight:650}
button.opt:hover,button.chip:hover{border-color:var(--gold)}
button.opt.ok,button.chip.ok{border-color:var(--green);background:var(--green-soft)}
button.opt.bad{border-color:var(--rose);background:var(--rose-soft)}
button.opt:disabled{cursor:default}
.why{margin:8px 0 0;font-size:.95rem}
.why strong{color:var(--gold-deep)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.slot{min-height:42px;border:2px dashed #C4B8A0;border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;background:#FFFcf5}
.bar{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:8px 0}
.score{font-weight:800;color:var(--gold-deep)}
button.action{font:inherit;font-weight:800;border:0;border-radius:999px;background:var(--gold);color:#1A160E;padding:8px 14px;cursor:pointer}
footer{color:var(--muted);font-size:.8rem;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="badge">Lección 22 · bloque D · sin red</div>
  <h1>Borde y relieve</h1>
  <p class="lead">Sin velocidades de Iberia. El Sistema Central no es un borde.</p>
  <div class="bar"><span class="score" id="score">0</span><button type="button" class="action" id="reset">Reiniciar</button></div>
  <div id="lab"></div>
  <footer>Les vencimos · laboratorio autónomo · sin red · corrección inmediata</footer>
</div>
<script>

function boot(ITEMS){
  var root=document.getElementById("lab");
  var score=0, done=0;
  var sc=document.getElementById("score");
  function paint(){ sc.textContent=score+" / "+ITEMS.length; }
  ITEMS.forEach(function(it,i){
    var card=document.createElement("section");
    card.className="card";
    var h=document.createElement("p");
    h.className="q";
    h.textContent=(i+1)+". "+it.q;
    card.appendChild(h);
    if(it.tipo==="orden"){
      var slot=document.createElement("div");
      slot.className="slot";
      var pool=document.createElement("div");
      pool.className="row";
      var picked=[];
      function judge(){
        var ok=picked.length===it.correcto.length && picked.every(function(p,k){return p===it.correcto[k];});
        done++; if(ok) score++;
        paint();
        var w=document.createElement("p");
        w.className="why";
        w.innerHTML=(ok?"<strong>Correcto.</strong> ":"<strong>No es esa secuencia.</strong> Orden: "+it.correcto.join(" → ")+". ")+it.porque;
        card.appendChild(w);
        pool.querySelectorAll("button").forEach(function(b){b.disabled=true;});
      }
      it.piezas.forEach(function(txt){
        var b=document.createElement("button");
        b.type="button"; b.className="chip"; b.textContent=txt;
        b.addEventListener("click", function(){
          if(b.disabled) return;
          b.disabled=true; b.className="chip ok";
          picked.push(txt); slot.appendChild(b);
          if(picked.length===it.correcto.length) judge();
        });
        pool.appendChild(b);
      });
      var hint=document.createElement("p");
      hint.className="why";
      hint.textContent="Pulsa en orden, del primero al último.";
      card.appendChild(hint); card.appendChild(slot); card.appendChild(pool);
    } else {
      var opts=document.createElement("div");
      opts.className="opts";
      it.opciones.forEach(function(op){
        var b=document.createElement("button");
        b.type="button"; b.className="opt"; b.textContent=op.t;
        b.addEventListener("click", function(){
          if(card.dataset.done) return;
          card.dataset.done="1"; done++;
          opts.querySelectorAll("button").forEach(function(x){x.disabled=true;});
          if(op.ok){ b.classList.add("ok"); score++; }
          else {
            b.classList.add("bad");
            opts.querySelectorAll("button").forEach(function(x,idx){ if(it.opciones[idx].ok) x.classList.add("ok"); });
          }
          paint();
          var w=document.createElement("p");
          w.className="why";
          w.innerHTML=(op.ok?"<strong>Correcto.</strong> ":"<strong>No.</strong> ")+it.porque;
          card.appendChild(w);
        });
        opts.appendChild(b);
      });
      card.appendChild(opts);
    }
    root.appendChild(card);
  });
  paint();
  document.getElementById("reset").addEventListener("click", function(){ location.reload(); });
  window.addEventListener("message", function(ev){
    var d=ev.data||{};
    if(d.type==="maestro:reset") location.reload();
    if(d.type==="maestro:highlight"){
      var c=root.querySelector(".card"); if(c) c.style.outline="3px solid #C4A15A";
    }
  });
}

boot([{"tipo": "test", "q": "La placa tectónica es…", "opciones": [{"t": "Litosfera: corteza más la parte rígida del manto superior.", "ok": true}, {"t": "Solo la corteza continental, flotando en magma.", "ok": false}, {"t": "El núcleo externo.", "ok": false}, {"t": "La astenosfera líquida.", "ok": false}], "porque": "La astenosfera es sólida y débil. Llamar lava al manto impide entender el tirón de la losa."}, {"tipo": "test", "q": "El motor que hoy se considera principal es…", "opciones": [{"t": "El tirón de la losa que subduce, con ayuda del empuje de la dorsal.", "ok": true}, {"t": "Un río de magma que arrastra las tapas.", "ok": false}, {"t": "El viento, como en los giros oceánicos.", "ok": false}, {"t": "La isostasia del Sistema Central, a 25 mm al año.", "ok": false}], "porque": "Convección y placas van juntas, pero la caricatura del río líquido es falsa. La cifra de Iberia no se usa."}, {"tipo": "test", "q": "En un borde divergente oceánico el relieve alto se explica porque…", "opciones": [{"t": "La litosfera joven está caliente y es menos densa.", "ok": true}, {"t": "Chocan dos continentes.", "ok": false}, {"t": "Hay una fosa en el eje.", "ok": false}, {"t": "La falla es transformante y por eso se levanta una meseta.", "ok": false}], "porque": "Al enfriarse, esa litosfera se hunde. Divergencia no es un agujero vacío."}, {"tipo": "test", "q": "En una subducción, fosa y arco…", "opciones": [{"t": "No coinciden en el mismo sitio: la fosa es el surco; el arco está desplazado, sobre la cuña.", "ok": true}, {"t": "Son el mismo relieve, en el eje de la dorsal.", "ok": false}, {"t": "Solo aparecen en una transformante.", "ok": false}, {"t": "Exigen dos cortezas continentales que no pueden hundirse.", "ok": false}], "porque": "El agua de la losa funde más atrás. Por eso el volcán no está en el fondo de la fosa."}, {"tipo": "test", "q": "Una colisión continental produce…", "opciones": [{"t": "Cordillera y raíz cortical, con poco o ningún arco volcánico de subducción oceánica.", "ok": true}, {"t": "Una dorsal nueva en el centro de la cordillera.", "ok": false}, {"t": "Corteza oceánica joven en el pico.", "ok": false}, {"t": "Solo una falla en dirección, sin engrosamiento.", "ok": false}], "porque": "La corteza continental es poco densa y se apila. Los Pirineos se leen así, como colisión, no como dorsal."}, {"tipo": "test", "q": "Un borde transformante…", "opciones": [{"t": "Desliza las placas en lateral, sin crear ni destruir litosfera, y en general sin volcanismo propio.", "ok": true}, {"t": "Abre una dorsal en San Andrés.", "ok": false}, {"t": "Hunde siempre corteza continental.", "ok": false}, {"t": "Es el nombre del Sistema Central.", "ok": false}], "porque": "Puede haber terremotos grandes y poco relieve volcánico. No es una fábrica de corteza."}, {"tipo": "test", "q": "El Sistema Central…", "opciones": [{"t": "Es relieve intraplaca. No le asignamos borde ni velocidad.", "ok": true}, {"t": "Es la dorsal que abre el Duero.", "ok": false}, {"t": "Es el arco de islas de una fosa bajo la meseta.", "ok": false}, {"t": "Se mueve a 25 mm al año respecto a África, según esta lección.", "ok": false}], "porque": "Altura no es límite de placa. El contacto con África es otra zona, y es compleja."}, {"tipo": "orden", "q": "Ordena estos relieves según el borde que los explica: dorsal, fosa, cordillera de colisión. El orden pedido es divergente, luego subducción, luego colisión.", "piezas": ["Cordillera con raíz", "Fosa", "Dorsal"], "correcto": ["Dorsal", "Fosa", "Cordillera con raíz"], "porque": "Separación, hundimiento de litosfera oceánica, y choque de continentes cuando ese océano ya no está. La transformante no entra en esta secuencia porque no crea ese trío de relieves."}]);
</script>
</body>
</html>
