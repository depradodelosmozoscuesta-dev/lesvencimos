<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>L24 · Laboratorio · Forma y agente</title>
<style>
:root{--bg:#FAF7F0;--ink:#2A2620;--muted:#5C564C;--card:#fff;--gold:#C4A15A;--gold-soft:#F5EDD8;--gold-deep:#8A6B2F;--green:#3D6B4F;--green-soft:#E4F0E8;--blue:#2F5D7A;--blue-soft:#E3EEF4;--rose:#9B3A4A;--rose-soft:#F8E8EB;--line:#E0D0A8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;line-height:1.45}
body{padding:14px 12px 32px}
.wrap{max-width:860px;margin:0 auto}
.badge{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--gold-deep);background:var(--gold-soft);padding:4px 10px;border-radius:999px}
h1{font-size:1.45rem;line-height:1.25;margin:.4rem 0 .3rem}
.lead{color:var(--muted);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.q{font-weight:750;margin:0 0 8px}
.opts{display:grid;gap:8px}
button.opt,button.chip{font:inherit;text-align:left;background:#fff;border:2px solid #D9D0C0;border-radius:12px;padding:10px 12px;cursor:pointer;font-weight:650}
button.opt:hover,button.chip:hover{border-color:var(--gold)}
button.opt.ok,button.chip.ok{border-color:var(--green);background:var(--green-soft)}
button.opt.bad{border-color:var(--rose);background:var(--rose-soft)}
button.opt:disabled{cursor:default}
.why{margin:8px 0 0;font-size:.95rem}
.why strong{color:var(--gold-deep)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.slot{min-height:42px;border:2px dashed #C4B8A0;border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;background:#FFFcf5}
.bar{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:8px 0}
.score{font-weight:800;color:var(--gold-deep)}
button.action{font:inherit;font-weight:800;border:0;border-radius:999px;background:var(--gold);color:#1A160E;padding:8px 14px;cursor:pointer}
footer{color:var(--muted);font-size:.8rem;text-align:center}
</style>
<link rel="stylesheet" href="../_maestro/maestro-puntero.css"/>
<script src="../_maestro/maestro-runtime.js" defer></script>
</head>
<body data-maestro-json="maestro-24.json">
<a class="atajo atajo-maestro" href="?maestro=1">Modo maestro</a>
<div class="wrap">
  <div class="badge">Lección 24 · bloque D · sin red</div>
  <h1>Forma y agente</h1>
  <p class="lead">Arribes: río. Sistema Central: hielo. Dolina: disolución. Sin edades locales inventadas.</p>
  <div class="bar"><span class="score" id="score">0</span><button type="button" class="action" id="reset">Reiniciar</button></div>
  <div id="lab"></div>
  <footer>Les vencimos · laboratorio autónomo · sin red · corrección inmediata</footer>
</div>
<script>

function boot(ITEMS){
  var root=document.getElementById("lab");
  var score=0, done=0;
  var sc=document.getElementById("score");
  function paint(){ sc.textContent=score+" / "+ITEMS.length; }
  ITEMS.forEach(function(it,i){
    var card=document.createElement("section");
    card.className="card";
    var h=document.createElement("p");
    h.className="q";
    h.textContent=(i+1)+". "+it.q;
    card.appendChild(h);
    if(it.tipo==="orden"){
      var slot=document.createElement("div");
      slot.className="slot";
      var pool=document.createElement("div");
      pool.className="row";
      var picked=[];
      function judge(){
        var ok=picked.length===it.correcto.length && picked.every(function(p,k){return p===it.correcto[k];});
        done++; if(ok) score++;
        paint();
        var w=document.createElement("p");
        w.className="why";
        w.innerHTML=(ok?"<strong>Correcto.</strong> ":"<strong>No es esa secuencia.</strong> Orden: "+it.correcto.join(" → ")+". ")+it.porque;
        card.appendChild(w);
        pool.querySelectorAll("button").forEach(function(b){b.disabled=true;});
      }
      it.piezas.forEach(function(txt){
        var b=document.createElement("button");
        b.type="button"; b.className="chip"; b.textContent=txt;
        b.addEventListener("click", function(){
          if(b.disabled) return;
          b.disabled=true; b.className="chip ok";
          picked.push(txt); slot.appendChild(b);
          if(picked.length===it.correcto.length) judge();
        });
        pool.appendChild(b);
      });
      var hint=document.createElement("p");
      hint.className="why";
      hint.textContent="Pulsa en orden, del primero al último.";
      card.appendChild(hint); card.appendChild(slot); card.appendChild(pool);
    } else {
      var opts=document.createElement("div");
      opts.className="opts";
      it.opciones.forEach(function(op){
        var b=document.createElement("button");
        b.type="button"; b.className="opt"; b.textContent=op.t;
        b.addEventListener("click", function(){
          if(card.dataset.done) return;
          card.dataset.done="1"; done++;
          opts.querySelectorAll("button").forEach(function(x){x.disabled=true;});
          if(op.ok){ b.classList.add("ok"); score++; }
          else {
            b.classList.add("bad");
            opts.querySelectorAll("button").forEach(function(x,idx){ if(it.opciones[idx].ok) x.classList.add("ok"); });
          }
          paint();
          var w=document.createElement("p");
          w.className="why";
          w.innerHTML=(op.ok?"<strong>Correcto.</strong> ":"<strong>No.</strong> ")+it.porque;
          card.appendChild(w);
        });
        opts.appendChild(b);
      });
      card.appendChild(opts);
    }
    root.appendChild(card);
  });
  paint();
  document.getElementById("reset").addEventListener("click", function(){ location.reload(); });
  window.addEventListener("message", function(ev){
    var d=ev.data||{};
    if(d.type==="maestro:reset") location.reload();
    if(d.type==="maestro:highlight"){
      var c=root.querySelector(".card"); if(c) c.style.outline="3px solid #C4A15A";
    }
  });
}

boot([{"tipo": "test", "q": "La meteorización se distingue de la erosión en que…", "opciones": [{"t": "Ocurre in situ. La erosión arranca y permite el transporte.", "ok": true}, {"t": "Siempre la hace el viento.", "ok": false}, {"t": "Solo ocurre en el núcleo externo.", "ok": false}, {"t": "Es el depósito de una barra de meandro.", "ok": false}], "porque": "Sin movimiento no hay erosión. La sedimentación es el cuarto paso, cuando el agente ya no puede con la carga."}, {"tipo": "test", "q": "La gelifracción necesita…", "opciones": [{"t": "Agua en grietas y ciclos de congelación. El hielo ocupa cerca de un 9 % más.", "ok": true}, {"t": "Un desierto seco sin nunca hielo, solo sol.", "ok": false}, {"t": "Disolución de caliza con CO2.", "ok": false}, {"t": "Un glaciar que deje morrenas, obligatoriamente.", "ok": false}], "porque": "Es meteorización física. El glaciar es erosión y transporte por hielo en masa, otro proceso."}, {"tipo": "test", "q": "Una dolina la explica…", "opciones": [{"t": "La disolución de carbonatos, a veces con hundimiento.", "ok": true}, {"t": "El viento, como si fuera una duna invertida.", "ok": false}, {"t": "Un glaciar de valle.", "ok": false}, {"t": "La subducción.", "ok": false}], "porque": "Karst. La ecuación de la carbonatación es el mecanismo químico. El viento no disuelve el páramo."}, {"tipo": "test", "q": "En un meandro…", "opciones": [{"t": "Erosión en la orilla cóncava y sedimentación en la convexa.", "ok": true}, {"t": "Solo erosión en las dos orillas.", "ok": false}, {"t": "Solo sedimentación, porque la pendiente es baja.", "ok": false}, {"t": "Gelifracción del hielo del río.", "ok": false}], "porque": "Los dos procesos conviven. La barra de meandro es el depósito de la orilla interna."}, {"tipo": "test", "q": "Un valle en U con morrenas en el Sistema Central lo abrió…", "opciones": [{"t": "El hielo cuaternario. El río actual no es la causa de esa forma.", "ok": true}, {"t": "El mismo proceso que los Arribes.", "ok": false}, {"t": "El viento de Tierra de Pinares.", "ok": false}, {"t": "Una dolina alargada.", "ok": false}], "porque": "Circo, U y morrena identifican al glaciar. No fechamos cada morrena."}, {"tipo": "test", "q": "Los Arribes del Duero se leen como…", "opciones": [{"t": "Incisión fluvial en el zócalo, con gravedad en las paredes. No como valle glaciar.", "ok": true}, {"t": "Un circo glaciar en calizas.", "ok": false}, {"t": "Una duna eólica fijada por pinos.", "ok": false}, {"t": "El plano de Benioff.", "ok": false}], "porque": "Roca cristalina, tajo bajo una superficie alta, río en el fondo. La apertura de la cuenca al Atlántico es reconstrucción, sin un millón de años nuevo."}, {"tipo": "test", "q": "Una cárcava en un campo desnudo es…", "opciones": [{"t": "Arroyada concentrada. Agua sobre material blando poco protegido.", "ok": true}, {"t": "Gelifracción.", "ok": false}, {"t": "Sedimentación eólica en la cara de avalancha.", "ok": false}, {"t": "Karst profundo.", "ok": false}], "porque": "Quitar la vegetación acelera ese agente. No hace falta hielo ni caliza."}, {"tipo": "orden", "q": "Ordena el camino de un grano de granito ya alterado que acaba en una barra fluvial.", "piezas": ["Sedimentación en la barra", "Transporte por el río", "Erosión que lo arranca", "Meteorización in situ"], "correcto": ["Meteorización in situ", "Erosión que lo arranca", "Transporte por el río", "Sedimentación en la barra"], "porque": "Primero se altera donde está. Luego se arranca, viaja y se deposita cuando el río pierde competencia, por ejemplo en la orilla convexa."}]);
</script>
</body>
</html>
