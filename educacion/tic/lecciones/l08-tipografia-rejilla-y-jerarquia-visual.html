<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Laboratorio L08 · Tipografía, rejilla y jerarquía visual</title>
<style>
:root{--ink:#0E0E0C;--amber:#C4A15A;--paper:#FAF7F0;--line:rgba(14,14,12,.14);--blue:#2F5D7A;--green:#3D6B4F;--bad:#A85A3C}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.45}
header{padding:.7rem 1rem;border-bottom:2px solid var(--amber);background:#fff}
header h1{margin:0;font-size:1.05rem;font-family:Palatino,Georgia,serif}
header p{margin:.2rem 0 0;font-size:.8rem;color:#5C564C}
main{padding:.75rem 1rem 2rem;max-width:62rem}
label{display:block;font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#5C564C;margin:.55rem 0 .2rem}
textarea,input[type=text],input[type=number],select{width:100%;font:14px/1.4 ui-monospace,monospace;border:1px solid var(--line);border-radius:6px;padding:.4rem .5rem;background:#fff;color:var(--ink)}
textarea{min-height:11rem;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0}
button{background:var(--amber);color:#1A160E;border:0;border-radius:4px;padding:.45rem .75rem;font-weight:700;cursor:pointer}
button.sec{background:#fff;border:1px solid var(--line)}
.grid{display:grid;gap:.75rem}
@media(min-width:800px){.grid.dos{grid-template-columns:1fr 1fr}}
iframe.pv,.pv{width:100%;min-height:280px;border:1px solid var(--line);border-radius:8px;background:#fff}
.out{font-size:.9rem;background:#fff;border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem}
.ok{color:var(--green);font-weight:700}.bad{color:var(--bad);font-weight:700}
canvas{width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
.nota{font-size:.82rem;color:#5C564C}
.lab-row{display:flex;flex-wrap:wrap;gap:.4rem;margin:.45rem 0}
.lab-out{font-size:.9rem;background:#fff;border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem;margin-top:.35rem}
.lab-canvas{width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;display:block}
.lab-preview{width:100%;min-height:260px;border:1px solid var(--line);border-radius:8px;background:#fff}
h2{font-family:Palatino,Georgia,serif;font-size:1.05rem}
</style>
</head>
<body>
<header>
  <h1>Laboratorio · L08 · Tipografía, rejilla y jerarquía visual</h1>
  <p>Offline, en esta página. No se envía nada a un servidor. Carbón + ámbar.</p>
</header>
<main>

<p class="nota">Rejilla, tipo y contraste. La muestra se pinta aquí.</p>
<label for="cols">Columnas</label>
<select id="cols"><option>2</option><option selected>3</option><option>4</option></select>
<label for="fam">Familia</label>
<select id="fam"><option value="Georgia, serif">Serifa (títulos)</option><option value="Segoe UI, sans-serif">Palo seco (texto de interfaz)</option></select>
<label for="px">Cuerpo (px)</label>
<input id="px" type="number" min="14" max="28" value="18"/>
<label for="fg">Texto</label><input id="fg" type="text" value="#0E0E0C"/>
<label for="bg">Fondo</label><input id="bg" type="text" value="#FAF7F0"/>
<div class="lab-row"><button type="button" id="bApp">Aplicar rejilla</button><button type="button" id="bCon" class="sec">Contraste</button></div>
<div id="grid"></div>
<pre id="cssout" style="white-space:pre-wrap;background:#0E0E0C;color:#FAF7F0;padding:.7rem;border-radius:8px;font-size:.8rem"></pre>
<div id="out" class="lab-out"></div>

</main>
<script>

function byId(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function say(html){var o=byId("out"); if(o) o.innerHTML=html;}


var CARDS=["Programa","Laboratorio","Aforo","Horario","Lugar","Contacto"];
function lin(c){c=c/255; return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4);}
function lum(hex){
  hex=String(hex).replace("#","").trim();
  if(hex.length===3) hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  if(!/^[0-9a-fA-F]{6}$/.test(hex)) return null;
  return 0.2126*lin(parseInt(hex.slice(0,2),16))+0.7152*lin(parseInt(hex.slice(2,4),16))+0.0722*lin(parseInt(hex.slice(4,6),16));
}
function apply(){
  var n=parseInt(byId("cols").value,10), fam=byId("fam").value, px=byId("px").value;
  var fg=byId("fg").value, bg=byId("bg").value;
  var css="display:grid;grid-template-columns:repeat("+n+",1fr);gap:.6rem;margin:.6rem 0";
  byId("grid").setAttribute("style", css);
  byId("grid").innerHTML=CARDS.map(function(c){
    return "<article style='background:"+bg+";color:"+fg+";border:1px solid rgba(14,14,12,.15);border-top:3px solid #C4A15A;padding:.6rem;font-family:"+fam+";font-size:"+px+"px'><strong>"+esc(c)+"</strong><p style='margin:.3rem 0 0'>Ficha del IES Duero. Máximo de línea cómodo si la columna no se estrecha demasiado.</p></article>";
  }).join("");
  byId("cssout").textContent=".rejilla{display:grid;grid-template-columns:repeat("+n+",1fr);gap:.6rem}\\n.ficha{font-family:"+fam+";font-size:"+px+"px;color:"+fg+";background:"+bg+"}";
}
function contrast(){
  var L1=lum(byId("fg").value), L2=lum(byId("bg").value);
  if(L1===null||L2===null){ say("<span class='bad'>Hex no válido.</span>"); return; }
  var ratio=(Math.max(L1,L2)+0.05)/(Math.min(L1,L2)+0.05);
  var ok=ratio>=4.5;
  say("<div>Contraste <strong>"+ratio.toFixed(2)+":1</strong></div><div class='"+(ok?"ok":"bad")+"'>Texto normal: "+(ok?"cumple 4,5:1":"por debajo de 4,5:1")+"</div>");
}
byId("bApp").onclick=function(){ apply(); contrast(); };
byId("bCon").onclick=contrast;
apply(); contrast();

</script>
</body>
</html>
