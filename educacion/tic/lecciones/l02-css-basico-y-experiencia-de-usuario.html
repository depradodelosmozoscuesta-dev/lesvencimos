<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Laboratorio L02 · CSS básico y experiencia de usuario</title>
<style>
:root{--ink:#0E0E0C;--amber:#C4A15A;--paper:#FAF7F0;--line:rgba(14,14,12,.14);--blue:#2F5D7A;--green:#3D6B4F;--bad:#A85A3C}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.45}
header{padding:.7rem 1rem;border-bottom:2px solid var(--amber);background:#fff}
header h1{margin:0;font-size:1.05rem;font-family:Palatino,Georgia,serif}
header p{margin:.2rem 0 0;font-size:.8rem;color:#5C564C}
main{padding:.75rem 1rem 2rem;max-width:62rem}
label{display:block;font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#5C564C;margin:.55rem 0 .2rem}
textarea,input[type=text],input[type=number],select{width:100%;font:14px/1.4 ui-monospace,monospace;border:1px solid var(--line);border-radius:6px;padding:.4rem .5rem;background:#fff;color:var(--ink)}
textarea{min-height:11rem;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0}
button{background:var(--amber);color:#1A160E;border:0;border-radius:4px;padding:.45rem .75rem;font-weight:700;cursor:pointer}
button.sec{background:#fff;border:1px solid var(--line)}
.grid{display:grid;gap:.75rem}
@media(min-width:800px){.grid.dos{grid-template-columns:1fr 1fr}}
iframe.pv,.pv{width:100%;min-height:280px;border:1px solid var(--line);border-radius:8px;background:#fff}
.out{font-size:.9rem;background:#fff;border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem}
.ok{color:var(--green);font-weight:700}.bad{color:var(--bad);font-weight:700}
canvas{width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
.nota{font-size:.82rem;color:#5C564C}
.lab-row{display:flex;flex-wrap:wrap;gap:.4rem;margin:.45rem 0}
.lab-out{font-size:.9rem;background:#fff;border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem;margin-top:.35rem}
.lab-canvas{width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;display:block}
.lab-preview{width:100%;min-height:260px;border:1px solid var(--line);border-radius:8px;background:#fff}
h2{font-family:Palatino,Georgia,serif;font-size:1.05rem}
</style>
</head>
<body>
<header>
  <h1>Laboratorio · L02 · CSS básico y experiencia de usuario</h1>
  <p>Offline, en esta página. No se envía nada a un servidor. Carbón + ámbar.</p>
</header>
<main>

<p class="nota">Dos capas: HTML (estructura) y CSS (presentación). El contraste se calcula aquí, sin salir de la página.</p>
<div class="grid dos">
<div>
<label for="html">HTML</label>
<textarea id="html" spellcheck="false"></textarea>
<label for="css">CSS</label>
<textarea id="css" spellcheck="false"></textarea>
</div>
<div>
<label for="fg">Color de texto</label>
<input id="fg" type="text" value="#0E0E0C"/>
<label for="bg">Color de fondo</label>
<input id="bg" type="text" value="#FAF7F0"/>
<div class="lab-row">
  <button type="button" id="bPrev">Vista previa</button>
  <button type="button" id="bCon" class="sec">Calcular contraste</button>
</div>
<iframe id="pv" class="lab-preview" title="Vista previa con CSS" sandbox="allow-same-origin"></iframe>
<div id="out" class="lab-out">El contraste WCAG para texto normal es 4,5:1.</div>
</div>
</div>

</main>
<script>

function byId(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function say(html){var o=byId("out"); if(o) o.innerHTML=html;}


byId("html").value = "<!DOCTYPE html>\n<html lang=\"es\">\n<head><meta charset=\"utf-8\"/><title>Semana de la Ciencia</title></head>\n<body>\n<header><h1>Semana de la Ciencia</h1><p>IES Duero · Aranda de Duero</p></header>\n<main><p>El jueves, taller de sensores en el laboratorio de física.</p></main>\n</body></html>";
byId("css").value = "body{margin:0;font-family:Georgia,serif;background:#FAF7F0;color:#0E0E0C;line-height:1.5}\nheader{background:#0E0E0C;color:#FAF7F0;padding:1rem 1.2rem}\nh1{font-size:1.8rem;margin:0 0 .3rem}\nmain{padding:1rem 1.2rem;max-width:38rem}";
function lin(c){c=c/255; return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4);}
function lum(hex){
  hex=hex.trim().replace("#","");
  if(hex.length===3) hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  if(!/^[0-9a-fA-F]{6}$/.test(hex)) return null;
  var r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
  return 0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b);
}
function preview(){
  var doc=byId("html").value;
  var css=byId("css").value;
  if(doc.indexOf("</head>")>=0) doc=doc.replace("</head>", "<style>"+css+"</style></head>");
  else doc="<!DOCTYPE html><html><head><style>"+css+"</style></head><body>"+doc+"</body></html>";
  byId("pv").srcdoc=doc;
}
function contrast(){
  var L1=lum(byId("fg").value), L2=lum(byId("bg").value);
  if(L1===null||L2===null){ say("<span class='bad'>Usa un hex de 3 o 6 cifras, por ejemplo #0E0E0C.</span>"); return; }
  var hi=Math.max(L1,L2), lo=Math.min(L1,L2);
  var ratio=(hi+0.05)/(lo+0.05);
  var txt=ratio.toFixed(2)+":1";
  var ok=ratio>=4.5, big=ratio>=3;
  say("<div>Relación <strong>"+txt+"</strong></div>"
    +"<div class='"+(ok?"ok":"bad")+"'>Texto normal (4,5:1): "+(ok?"cumple":"no cumple")+"</div>"
    +"<div class='"+(big?"ok":"bad")+"'>Texto grande (3:1): "+(big?"cumple":"no cumple")+"</div>"
    +"<div class='nota'>Pinta un recuadro en el CSS con estos colores y vuelve a la vista previa.</div>");
}
byId("bPrev").onclick=preview;
byId("bCon").onclick=contrast;
preview();

</script>
</body>
</html>
