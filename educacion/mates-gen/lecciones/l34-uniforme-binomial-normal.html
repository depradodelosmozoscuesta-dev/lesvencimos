<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Lab L34 · Binomial n=4 y la barra del ejemplo</title>
<link rel="stylesheet" href="../leccion-shell.css"/>
<style>body{margin:0;padding:1rem;background:#0E0E0C;color:#E6E1D6;font-family:system-ui,sans-serif}
h1{font-size:1.15rem;color:#C4A15A} .panel{background:#161512;border:1px solid #C4A15A;border-radius:10px;padding:.8rem;margin:.6rem 0}
button{font:inherit;font-weight:700;padding:.35rem .75rem;border-radius:999px;border:1px solid #C4A15A;background:transparent;color:#E6E1D6;cursor:pointer;margin:.2rem}
canvas{display:block;width:100%;max-width:640px;background:#12100e;border:1px solid #9A9488;border-radius:8px}
input,select{background:#161512;color:#E6E1D6;border:1px solid #C4A15A;border-radius:6px;padding:.3rem .5rem}
.out{min-height:2rem;color:#8F9A72;margin-top:.5rem}</style></head>
<body>
<p><a href="leccion-34-uniforme-binomial-normal.html" style="color:#C4A15A">← Volver a la lección 34</a></p>
<h1>Laboratorio · L34 · Binomial n=4 y la barra del ejemplo</h1>

<div class="panel">
<p>Cuatro pruebas justas, como el ejemplo. P(X=k) = C(4,k) / 16. El caso marcado en la lección es k=3.</p>
<label>k
<select id="k"><option>0</option><option>1</option><option>2</option><option selected>3</option><option>4</option></select>
</label>
<div class="out" id="out"></div>
<canvas id="c" width="640" height="200"></canvas>
</div>
<script>
function C(n,k){var r=1; for(var i=0;i<k;i++) r=r*(n-i)/(i+1); return r;}
function pintar(){
  var k=+document.getElementById('k').value;
  var probs=[1,4,6,4,1];
  document.getElementById('out').textContent='C(4,'+k+') = '+C(4,k)+' · P(X='+k+') = '+probs[k]+'/16 = '+(probs[k]/16).toFixed(4).replace('.',',')+'. La barra ámbar es la que has elegido.';
  var cv=document.getElementById('c'), ctx=cv.getContext('2d');
  ctx.fillStyle='#12100e'; ctx.fillRect(0,0,640,200);
  ctx.strokeStyle='#9A9488'; ctx.beginPath(); ctx.moveTo(40,170); ctx.lineTo(600,170); ctx.stroke();
  for(var i=0;i<5;i++){
    var h=probs[i]*18;
    ctx.fillStyle = (i===k) ? '#C4A15A' : '#3a3428';
    ctx.fillRect(70+i*90, 170-h, 50, h);
    ctx.fillStyle='#E6E1D6'; ctx.font='13px sans-serif';
    ctx.fillText(String(i), 90+i*90, 188);
  }
}
document.getElementById('k').onchange=pintar; pintar();
</script>

</body></html>
