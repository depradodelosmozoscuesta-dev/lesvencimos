<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Lab L04 · Árbol de posibilidades</title>
<link rel="stylesheet" href="../leccion-shell.css"/>
<style>body{margin:0;padding:1rem;background:#0E0E0C;color:#E6E1D6;font-family:system-ui,sans-serif}
h1{font-size:1.15rem;color:#C4A15A} .panel{background:#161512;border:1px solid #C4A15A;border-radius:10px;padding:.8rem;margin:.6rem 0}
button{font:inherit;font-weight:700;padding:.35rem .75rem;border-radius:999px;border:1px solid #C4A15A;background:transparent;color:#E6E1D6;cursor:pointer;margin:.2rem}
canvas{display:block;width:100%;max-width:640px;background:#12100e;border:1px solid #9A9488;border-radius:8px}
input,select{background:#161512;color:#E6E1D6;border:1px solid #C4A15A;border-radius:6px;padding:.3rem .5rem}
.out{min-height:2rem;color:#8F9A72;margin-top:.5rem}</style></head>
<body>
<p><a href="leccion-04-arboles-y-combinatoria.html" style="color:#C4A15A">← Volver a la lección 04</a></p>
<h1>Laboratorio · L04 · Árbol de posibilidades</h1>

  <div class="panel"><p>Elige opciones por nivel y calcula el producto.</p>
  <label>Nivel 1 <input id="n1" type="number" value="2" min="1" max="9"/></label>
  <label>Nivel 2 <input id="n2" type="number" value="3" min="1" max="9"/></label>
  <label>Nivel 3 <input id="n3" type="number" value="2" min="1" max="9"/></label>
  <button id="go">Calcular</button>
  <div class="out" id="out"></div>
  <canvas id="c" width="600" height="220"></canvas></div>
  <script>
  function dibuja(a,b,c){var cv=document.getElementById('c');var ctx=cv.getContext('2d');ctx.fillStyle='#12100e';ctx.fillRect(0,0,600,220);ctx.strokeStyle='#C4A15A';ctx.fillStyle='#E6E1D6';
  ctx.beginPath();ctx.arc(300,30,10,0,6.28);ctx.stroke();
  var y=100;for(var i=0;i<a;i++){var x=100+i*(400/(a||1));ctx.beginPath();ctx.moveTo(300,40);ctx.lineTo(x,y);ctx.stroke();ctx.beginPath();ctx.arc(x,y,8,0,6.28);ctx.stroke();}
  document.getElementById('out').textContent='Total de ramas (producto)= '+(a*b*c);}
  document.getElementById('go').onclick=function(){dibuja(+n1.value,+n2.value,+n3.value);};dibuja(2,3,2);
  </script>
</body></html>
