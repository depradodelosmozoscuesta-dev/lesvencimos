<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Lab L20 · Recta y = mx + n</title>
<link rel="stylesheet" href="../leccion-shell.css"/>
<style>body{margin:0;padding:1rem;background:#0E0E0C;color:#E6E1D6;font-family:system-ui,sans-serif}
h1{font-size:1.15rem;color:#C4A15A} .panel{background:#161512;border:1px solid #C4A15A;border-radius:10px;padding:.8rem;margin:.6rem 0}
button{font:inherit;font-weight:700;padding:.35rem .75rem;border-radius:999px;border:1px solid #C4A15A;background:transparent;color:#E6E1D6;cursor:pointer;margin:.2rem}
canvas{display:block;width:100%;max-width:640px;background:#12100e;border:1px solid #9A9488;border-radius:8px}
input,select{background:#161512;color:#E6E1D6;border:1px solid #C4A15A;border-radius:6px;padding:.3rem .5rem}
.out{min-height:2rem;color:#8F9A72;margin-top:.5rem}</style></head>
<body>
<p><a href="leccion-20-funciones-afines.html" style="color:#C4A15A">← Volver a la lección 20</a></p>
<h1>Laboratorio · L20 · Recta y = mx + n</h1>

<div class="panel">
<p>La recta de la lección es y = 2x + 1. Cambia m o n y mira los puntos.</p>
<label>m <input id="m" type="number" value="2" step="0.5"/></label>
<label>n <input id="n" type="number" value="1" step="0.5"/></label>
<button id="go" type="button">Dibujar</button>
<div class="out" id="out"></div>
<canvas id="c" width="640" height="220"></canvas>
</div>
<script>
function dib(){
  var m=parseFloat(document.getElementById('m').value), n=parseFloat(document.getElementById('n').value);
  var cv=document.getElementById('c'), ctx=cv.getContext('2d');
  ctx.fillStyle='#12100e'; ctx.fillRect(0,0,640,220);
  ctx.strokeStyle='#9A9488'; ctx.beginPath(); ctx.moveTo(40,180); ctx.lineTo(600,180); ctx.moveTo(80,20); ctx.lineTo(80,200); ctx.stroke();
  ctx.strokeStyle='#C4A15A'; ctx.beginPath();
  for(var x=0;x<=5.01;x+=0.1){var px=80+x*80, py=180-(m*x+n)*18; if(x===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);} ctx.stroke();
  ctx.fillStyle='#E6E1D6';
  [0,1,2].forEach(function(x){var y=m*x+n; ctx.beginPath(); ctx.arc(80+x*80,180-y*18,4,0,6.3); ctx.fill();});
  document.getElementById('out').textContent='Puntos: (0, '+n+'), (1, '+(m+n)+'), (2, '+(2*m+n)+')';
}
document.getElementById('go').onclick=dib; dib();
</script>

</body></html>
