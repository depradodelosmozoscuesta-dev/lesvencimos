<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tinta escritura — Les vencimos</title>
<style>
/* Paleta propia: nada se pide a una red de fuentes ni de iconos. */
:root {
  --fondo: #efe8dc;
  --papel: #f7f1e6;
  --tinta: #1c1916;
  --suave: #6a6258;
  --linea: #d7cfc2;
  --acento: #8b3a2f;
  --acento-texto: #f7f1e6;
  --sombra: 0 10px 28px rgba(28, 25, 22, 0.12);
  --radio: 12px;
  --ui: "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
  --libro: Georgia, "Times New Roman", serif;
}
html[data-tema="noche"] {
  --fondo: #161410;
  --papel: #1e1a16;
  --tinta: #ebe4d6;
  --suave: #a39888;
  --linea: #3a342c;
  --acento: #c45c4c;
  --acento-texto: #1c1916;
  --sombra: 0 10px 28px rgba(0, 0, 0, 0.45);
}
* { box-sizing: border-box; }
html, body {
  height: 100%;
  margin: 0;
  /* El chrome cabe en la pantalla; solo los paneles internos hacen scroll. */
  overflow: hidden;
  background: var(--fondo);
  color: var(--tinta);
  font-family: var(--ui);
}
button, [role="button"] { cursor: pointer; font-family: inherit; }
button:disabled { opacity: 0.45; cursor: default; }
#app {
  height: 100dvh;
  display: flex;
  flex-direction: column;
}
.cabecera, .pie {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 56px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--linea);
  background: var(--papel);
}
.pie { border-bottom: 0; border-top: 1px solid var(--linea); justify-content: space-between; }
.marca {
  font-family: var(--libro);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.04em;
}
.hueco { flex: 1; min-width: 8px; }
.boton {
  min-height: 44px;
  min-width: 44px;
  padding: 0 14px;
  border: 1px solid var(--linea);
  border-radius: 10px;
  background: var(--papel);
  color: var(--tinta);
  font-size: 14px;
}
.boton:hover { background: var(--fondo); }
.boton.principal {
  background: var(--acento);
  color: var(--acento-texto);
  border-color: transparent;
}
.boton.fantasma { border-color: transparent; background: transparent; }
.boton.peligro { color: var(--acento); }
.cuerpo { flex: 1; min-height: 0; display: flex; }
.lista {
  overflow: auto;
  padding: 16px;
}
.tarjeta {
  display: block;
  width: 100%;
  text-align: left;
  border: 1px solid var(--linea);
  border-radius: var(--radio);
  background: var(--papel);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--sombra);
  color: inherit;
  min-height: 44px;
}
.tarjeta h2 { margin: 0 0 6px; font-family: var(--libro); font-size: 22px; }
.tarjeta p { margin: 0; color: var(--suave); font-size: 14px; }
.lateral {
  width: 240px;
  flex: 0 0 240px;
  border-right: 1px solid var(--linea);
  background: var(--papel);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.lateral h3 {
  margin: 0;
  padding: 12px 12px 4px;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--suave);
}
.cap-item {
  display: flex;
  width: 100%;
  min-height: 44px;
  border: 0;
  background: transparent;
  color: inherit;
  text-align: left;
  padding: 8px 12px;
  gap: 8px;
}
.cap-item.activo { background: var(--fondo); }
.escena { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.manuscrito {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 18px 16px 40px;
}
.hoja {
  max-width: 720px;
  margin: 0 auto;
}
.titulo-cap {
  width: 100%;
  border: 0;
  background: transparent;
  color: inherit;
  font-family: var(--libro);
  font-size: 28px;
  padding: 4px 0 12px;
  outline: none;
}
.texto-cap {
  width: 100%;
  border: 0;
  background: transparent;
  color: inherit;
  font-family: var(--libro);
  font-size: 18px;
  line-height: 1.7;
  resize: none;
  outline: none;
  min-height: 180px;
}
.figura {
  margin: 12px 0;
  padding: 10px;
  border-radius: 10px;
  background: var(--fondo);
  text-align: center;
}
.figura svg { width: 100%; max-width: 420px; height: 160px; }
.pie-fig {
  width: 100%;
  border: 0;
  background: transparent;
  color: var(--suave);
  text-align: center;
  font-size: 13px;
  min-height: 44px;
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 44px;
  padding: 0 14px;
  border: 0;
  border-radius: 999px;
  background: var(--fondo);
  color: var(--tinta);
}
.chip.activo { background: var(--acento); color: var(--acento-texto); }
.campo, select, textarea.notas {
  width: 100%;
  min-height: 44px;
  border: 1px solid var(--linea);
  border-radius: 10px;
  background: var(--papel);
  color: inherit;
  padding: 10px 12px;
  font: inherit;
}
.dialogo {
  position: fixed;
  inset: 0;
  background: rgba(28, 25, 22, 0.45);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 20;
  padding: 12px;
}
.dialogo > form, .dialogo > .caja {
  width: min(720px, 100%);
  max-height: 92dvh;
  overflow: auto;
  background: var(--papel);
  color: var(--tinta);
  border-radius: 16px 16px 12px 12px;
  padding: 16px;
  box-shadow: var(--sombra);
}
.rejilla {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.ficha {
  min-height: 88px;
  border: 0;
  border-radius: 10px;
  background: var(--fondo);
  color: inherit;
  padding: 8px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.ficha svg { width: 100%; height: 52px; }
.ficha span { font-size: 12px; color: var(--suave); }
.aviso { color: var(--suave); font-size: 13px; }
.oculto { display: none !important; }
.lienzo-caja { background: #fff; border-radius: 10px; overflow: hidden; }
.barra-dictado {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: 64px;
  z-index: 25;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 8px 12px;
  border: 1px solid var(--linea);
  border-radius: 10px;
  background: var(--papel);
  box-shadow: var(--sombra);
  font-size: 13px;
  color: var(--suave);
  font-style: italic;
}
.punto-vivo {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--acento);
  flex: 0 0 auto;
}
@media (max-width: 720px) {
  .lateral { display: none; }
  .lateral.abierto {
    display: flex;
    position: absolute;
    inset: 56px 0 56px 0;
    width: auto;
    z-index: 8;
    border-right: 0;
  }
  .titulo-cap { font-size: 22px; }
  .texto-cap { font-size: 16px; }
}
@media (min-width: 721px) {
  .solo-movil { display: none !important; }
  .dialogo { align-items: center; }
  .dialogo > form, .dialogo > .caja { border-radius: 16px; }
  .rejilla { grid-template-columns: repeat(5, 1fr); }
}
</style>
</head>

  function trozos(cuerpo) {
    var re = /\{\{fig:([a-zA-Z0-9-]+)\}\}/g;
    var out = [];
    var last = 0;
    var m;
    while ((m = re.exec(cuerpo))) {
      if (m.index > last) out.push({ tipo: "texto", texto: cuerpo.slice(last, m.index) });
      out.push({ tipo: "fig", id: m[1] });
      last = m.index + m[0].length;
    }
    out.push({ tipo: "texto", texto: cuerpo.slice(last) });
    if (!out.length) out.push({ tipo: "texto", texto: "" });
    return out;
  }

  function unirTrozos(lista) {
    var s = "";
    lista.forEach(function (t, i) {
      if (t.tipo === "fig") {

        s += "{{fig:" + t.id + "}}";
        if (i < lista.length - 1) s += "\n\n";
      } else {
        s += t.texto;
      }
    });
    return s;
  }

  function arrancarDictado() {
    var Ctor = ctorVoz();
    if (!Ctor) {
      dictado.vivo = false;
      pintar();
      alert("Este navegador no sabe dictar. Prueba Chrome o Edge.");
      return;
    }
    dictado.finales = "";
    dictado.segundos = 0;
    var rec = new Ctor();
    rec.lang = "es-ES";
    rec.continuous = true;
    rec.interimResults = true;
    rec.onresult = function (ev) {
      var i;
      var temp = "";
      for (i = ev.resultIndex; i < ev.results.length; i += 1) {
        var pieza = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) dictado.finales = juntarVoz(dictado.finales, pieza);
        else temp += pieza;
      }
      var el = document.getElementById("preview-dictado");
      if (el) el.textContent = juntarVoz(dictado.finales, temp) || "Habla. Aún no se escribe. Pulsa Parar al terminar.";
    };
    rec.onerror = function (ev) {
      if (!dictado.vivo) return;
      if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
        pararDictado(true);
        alert("No hay permiso para el micrófono.");
      } else if (ev.error === "network") {
        var el = document.getElementById("preview-dictado");
        if (el) el.textContent = "Sin red no hay dictado.";
      }
    };
    rec.onend = function () {
      if (dictado.vivo && dictado.rec === rec) {
        try { rec.start(); } catch (e) { dictado.rec = null; }
      }
    };
    dictado.rec = rec;
    try {
      rec.start();
    } catch (e) {
      dictado.vivo = false;
      pintar();
      alert("No se pudo arrancar el dictado.");
      return;
    }
    if (dictado.timer) clearInterval(dictado.timer);
    dictado.timer = setInterval(function () {
      dictado.segundos += 1;
      var s = document.getElementById("seg-dictado");
      if (s) s.textContent = dictado.segundos + "s";
      if (dictado.segundos >= 90) pararDictado(false);
    }, 1000);
  }

  function pararDictado(silencio) {
    dictado.vivo = false;
    if (dictado.timer) { clearInterval(dictado.timer); dictado.timer = null; }
    try { if (dictado.rec) dictado.rec.stop(); } catch (e) {}
    dictado.rec = null;
    var limpio = limpiarVoz(dictado.finales);
    dictado.finales = "";
    if (!silencio) {
      if (limpio) insertarDictado(limpio);
      else alert("No se oyó nada. Habla y luego pulsa Parar.");
    }
    pintar();
  }

  function exportar() {
    var obra = obraActual();
    if (!obra) return;
    var lineas = [obra.titulo, obra.genero, "", obra.sinopsis || "", ""];
    capsDe(obra.id).forEach(function (c, i) {
      lineas.push("");
      lineas.push((i + 1) + ". " + c.titulo);
      lineas.push("");
      lineas.push(c.cuerpo.replace(/\{\{fig:[a-zA-Z0-9-]+\}\}/g, "[ilustración]"));
    });
    var blob = new Blob([lineas.join("\n")], { type: "text/plain;charset=utf-8" });
    var a = document.createElement("a");
    var objeto = URL.createObjectURL(blob);
    a.href = objeto;
    a.download = (obra.titulo || "manuscrito").replace(/[\\/:*?"<>|]/g, "") + ".txt";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(objeto); }, 500);
  }

  function arrancarLienzo() {
    var cv = document.getElementById("lienzo");
    if (!cv) return;
    var ctx = cv.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.strokeStyle = "#1c1916";
    ctx.lineWidth = 3.2;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    dibujo = { cv: cv, ctx: ctx, trazando: false };
    function pos(ev) {
      var r = cv.getBoundingClientRect();
      var x = (ev.clientX - r.left) * (cv.width / r.width);
      var y = (ev.clientY - r.top) * (cv.height / r.height);
      return { x: x, y: y };
    }
    function start(ev) {
      ev.preventDefault();
      var p = pos(ev.touches ? ev.touches[0] : ev);
      dibujo.trazando = true;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    }
    function move(ev) {
      if (!dibujo.trazando) return;
      ev.preventDefault();
      var p = pos(ev.touches ? ev.touches[0] : ev);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }
    function end() { dibujo.trazando = false; }
    cv.addEventListener("pointerdown", start);
    cv.addEventListener("pointermove", move);
    cv.addEventListener("pointerup", end);
    cv.addEventListener("pointerleave", end);
  }

  document.getElementById("app").addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-act]");
    if (!t) return;
    var act = t.getAttribute("data-act");
    var id = t.getAttribute("data-id");
    if (dictado.vivo && act !== "parar-dictado") return;
    if (act === "nada") { ev.stopPropagation(); return; }
    if (act === "cerrar-fondo" && ev.target !== t) return;
    if (act === "tema") {
      estado.tema = estado.tema === "noche" ? "papel" : "noche";
      pintar();
      return;
    }
    if (act === "nueva") { dialogo = "nueva"; pintar(); return; }
    if (act === "cerrar" || act === "cerrar-fondo") { dialogo = null; dibujo = null; pintar(); return; }
    if (act === "abrir") { abrirObra(id); return; }
    if (act === "volver") { estado.vista = "biblioteca"; estado.obraActiva = null; pintar(); return; }
    if (act === "caps") { lateralAbierto = !lateralAbierto; pintar(); return; }
    if (act === "cap") { estado.capActivo[estado.obraActiva] = id; lateralAbierto = false; pintar(); return; }
    if (act === "tab") { estado.pestaña = id; pintar(); return; }
    if (act === "nuevo-cap") {
      var obra = obraActual();
      var n = capsDe(obra.id).length;
      var cap = { id: uid(), obraId: obra.id, orden: n, titulo: "Capítulo " + (n + 1), cuerpo: "", actualizado: ahora() };
      estado.capitulos.push(cap);
      estado.capActivo[obra.id] = cap.id;
      estado.pestaña = "escribir";
      obra.actualizada = ahora();
      pintar();
      return;
    }
    if (act === "nuevo-per") {
      var o = obraActual();
      estado.personajes.push({ id: uid(), obraId: o.id, nombre: "Sin nombre", rol: "Secundario", notas: "" });
      o.actualizada = ahora();
      pintar();
      return;
    }
    if (act === "borrar-per") {
      estado.personajes = estado.personajes.filter(function (p) { return p.id !== id; });
      pintar();
      return;
    }
    if (act === "ajustes") { dialogo = "ajustes"; pintar(); return; }
    if (act === "ilustrar") { dialogo = "ilustrar"; busquedaFicha = ""; grupoFicha = "persona"; pintar(); return; }
    if (act === "dictar") {
      if (!ctorVoz()) {
        alert("Este navegador no sabe dictar. Prueba Chrome o Edge.");
        return;
      }
      dialogo = "aviso-dictar";
      pintar();
      return;
    }
    if (act === "conectar-dictar") {
      dialogo = null;
      dictado.vivo = true;
      pintar();
      arrancarDictado();
      return;
    }
    if (act === "parar-dictado") { pararDictado(false); return; }
    if (act === "grupo") { grupoFicha = id; pintar(); return; }
    if (act === "poner-ficha") {
      var ficha = FICHA_DE[id];
      var il = { id: uid(), obraId: estado.obraActiva, tipo: "ficha", fichaId: id, pie: ficha ? ficha.etiqueta : "" };
      estado.ilustraciones.push(il);
      insertarFigura(il.id);
      return;
    }
    if (act === "quitar-fig") {
      var capq = capActual();
      if (!capq) return;
      capq.cuerpo = capq.cuerpo.replace(new RegExp("\\n*\\{\\{fig:" + id + "\\}\\}\\n*", "g"), "\n\n").replace(/\n{3,}/g, "\n\n");
      pintar();
      return;
    }
    if (act === "dibujar") { dialogo = "dibujar"; pintar(); arrancarLienzo(); return; }
    if (act === "borrar-lienzo") {
      if (dibujo) {
        dibujo.ctx.fillStyle = "#ffffff";
        dibujo.ctx.fillRect(0, 0, dibujo.cv.width, dibujo.cv.height);
      }
      return;
    }
    if (act === "usar-dibujo") {
      if (!dibujo) return;
      var datos = dibujo.cv.toDataURL("image/png");
      var ild = { id: uid(), obraId: estado.obraActiva, tipo: "dibujo", datos: datos, pie: "Lámina" };
      estado.ilustraciones.push(ild);
      insertarFigura(ild.id);
      dibujo = null;
      return;
    }
    if (act === "exportar") { exportar(); return; }
    if (act === "fmt") { obraActual().formato = id; obraActual().actualizada = ahora(); pintar(); return; }
    if (act === "mar") { obraActual().margen = id; obraActual().actualizada = ahora(); pintar(); return; }
    if (act === "int") { obraActual().interlineado = Number(id); obraActual().actualizada = ahora(); pintar(); return; }
    if (act === "letra") { estado.tamanoLetra = Number(id); pintar(); return; }
    if (act === "borrar-obra") {
      if (!confirm("¿Borrar esta obra y sus capítulos?")) return;
      var oid = estado.obraActiva;
      estado.obras = estado.obras.filter(function (o) { return o.id !== oid; });
      estado.capitulos = estado.capitulos.filter(function (c) { return c.obraId !== oid; });
      estado.personajes = estado.personajes.filter(function (p) { return p.obraId !== oid; });
      estado.ilustraciones = estado.ilustraciones.filter(function (i) { return i.obraId !== oid; });
      estado.vista = "biblioteca";
      estado.obraActiva = null;
      pintar();
    }
  });

  document.getElementById("app").addEventListener("submit", function (ev) {
    var form = ev.target;
    if (!form.matches("form")) return;
    ev.preventDefault();
    var titulo = (form.titulo.value || "").trim() || "Sin título";
    var genero = (form.querySelector('input[name="genero"]:checked') || {}).value || "Novela";
    var preId = (form.querySelector('input[name="pre"]:checked') || {}).value || "novel";
    var pre = PREAJUSTES.filter(function (p) { return p.id === preId; })[0] || PREAJUSTES[0];
    var id = uid();
    var capId = uid();
    estado.obras.unshift({
      id: id, titulo: titulo, genero: genero, sinopsis: "",
      formato: pre.formato, interlineado: pre.interlineado, margen: pre.margen,
      creada: ahora(), actualizada: ahora()
    });
    estado.capitulos.push({ id: capId, obraId: id, orden: 0, titulo: "Capítulo 1", cuerpo: "", actualizado: ahora() });
    estado.capActivo[id] = capId;
    dialogo = null;
    abrirObra(id);
  });

  document.getElementById("app").addEventListener("input", function (ev) {
    var el = ev.target;
    var cap = capActual();
    if (el.getAttribute("data-campo") === "titulo-cap" && cap) {
      cap.titulo = el.value;
      cap.actualizado = ahora();
      guardar();
      return;
    }
    if (el.hasAttribute("data-bloque") && cap) {
      var bloques = trozos(cap.cuerpo);
      var i = Number(el.getAttribute("data-bloque"));
      if (bloques[i] && bloques[i].tipo === "texto") bloques[i].texto = el.value;
      cap.cuerpo = unirTrozos(bloques);
      cap.actualizado = ahora();
      if (obraActual()) obraActual().actualizada = ahora();
      el.style.height = "auto";
      el.style.height = Math.max(180, el.scrollHeight) + "px";
      var pie = document.querySelector(".pie span");
      if (pie && obraActual()) {
        pie.textContent = fmt(contarPalabras(cap.cuerpo)) + " pal. capítulo · " +
          fmt(palabrasObra(obraActual().id)) + " pal. obra · " +
          estimarPaginas(palabrasObra(obraActual().id), obraActual()) + " pág.";
      }
      guardar();
      return;
    }
    if (el.hasAttribute("data-fig")) {
      var fig = ilustracionDe(el.getAttribute("data-fig"));
      if (fig) { fig.pie = el.value; guardar(); }
      return;
    }
    if (el.getAttribute("data-campo") === "buscar-ficha") {
      busquedaFicha = el.value;
      var keep = el.selectionStart;
      pintar();
      var n = document.querySelector("[data-campo='buscar-ficha']");
      if (n) { n.focus(); n.setSelectionRange(keep, keep); }
      return;
    }
    if (el.hasAttribute("data-per")) {
      var pid = el.getAttribute("data-per");
      var campo = el.getAttribute("data-campo");
      estado.personajes.forEach(function (p) {
        if (p.id === pid) p[campo] = el.value;
      });
      guardar();
      return;
    }
    if (el.hasAttribute("data-obra")) {
      var obra = obraActual();
      if (obra) { obra[el.getAttribute("data-obra")] = el.value; obra.actualizada = ahora(); guardar(); }
    }
  });

  pintar();
})();
</script>
