<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Gimnasio Les vencimos — movimiento suave offline, como en el Asistente.">
  <title>Gimnasio — Les vencimos</title>
  <style>

:root {
  --fondo: #f4efe6; --tinta: #2a2118; --suave: #7a6a58; --acento: #c45c26;
  --acento-texto: #fff8f0; --linea: rgba(42,33,24,.14);
  --font-display: "Iowan Old Style", Palatino, Georgia, serif;
  --font-sans: "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--tinta);
  font-family: var(--font-sans); }
.wrap { min-height: 100%; display: flex; flex-direction: column; max-width: 28rem; margin: 0 auto; }
header.app {
  display: flex; align-items: center; gap: .6rem; padding: .65rem .85rem;
  border-bottom: 1px solid var(--linea); background: #efe8dc;
}
header.app h1 { margin: 0; font-family: var(--font-display); font-size: 1.25rem; flex: 1; }
header.app .brand { font-size: .72rem; letter-spacing: .04em; color: var(--suave); text-transform: uppercase; }
.cab-extra { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
button, .btn {
  font: 700 .9rem var(--font-sans); min-height: 44px; padding: .45rem .8rem;
  border-radius: 999px; border: 1px solid color-mix(in srgb, var(--acento) 45%, transparent);
  background: #fffaf3; color: var(--tinta); cursor: pointer;
}
button.sexo, .sexo { min-width: 5.5rem; }
button.btn-acento, .btn-acento { background: var(--acento); color: var(--acento-texto); border-color: var(--acento); }
main { flex: 1; padding: .85rem; display: flex; flex-direction: column; gap: .75rem; }
.gym-modos { display: flex; gap: 8px; flex-shrink: 0; }
.gym-modos .btn { flex: 1; }
.grid-2.gym-hub { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hub-tile {
  appearance: none; border: 1px solid var(--linea); border-radius: 18px;
  background: linear-gradient(165deg, #fffaf2, #f0e6d6); min-height: 6.2rem;
  padding: 1rem; text-align: left; display: flex; flex-direction: column; justify-content: flex-end;
  cursor: pointer; color: inherit;
}
.hub-tile:last-child { grid-column: 1 / -1; }
.hub-tile strong { font-family: var(--font-display); font-size: 1.25rem; display: block; }
.hub-tile em { font-style: normal; color: var(--suave); font-size: .9rem; }
.gim-escena { display: flex; flex-direction: column; gap: .65rem; flex: 1; }
.gim-lienzo {
  position: relative; background: #ebe3d4; border-radius: 22px; overflow: hidden;
  aspect-ratio: 1; width: 100%; max-width: 360px; margin: 0 auto;
}
.gim-lienzo canvas { display: block; width: 100%; height: 100%; }
.gim-hud { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; }
.gim-rep { color: #5a4334; margin: 0; font-size: 3rem; font-weight: 800; line-height: .9; }
.gim-de { letter-spacing: .06em; text-transform: uppercase; color: #9a8468; margin: 0; font-size: .72rem; font-weight: 800; }
.gim-cue { text-align: center; color: var(--acento); min-height: 2.4em; margin: 0; font-weight: 800; }
.gim-mandos { display: flex; gap: 8px; flex-wrap: wrap; }
.gim-mandos .btn, .gim-mandos button { flex: 1; min-width: 5rem; }
.aviso {
  margin: 0; padding: .65rem .75rem; border-radius: 12px; background: #efe6d8;
  color: var(--suave); font-size: .82rem; line-height: 1.35;
}
.hidden { display: none !important; }
footer { padding: .75rem; text-align: center; color: var(--suave); font-size: .78rem; }

.gym-modos{flex-shrink:0;gap:8px;display:flex}
.gym-modos .btn{flex:1;min-height:48px}
.gym-cab-extra{align-items:center;gap:6px;display:flex}
.gim-escena{flex-direction:column;flex:1;gap:8px;min-height:0;display:flex}
.gim-lienzo{min-height:0;box-shadow:var(--luz), var(--sombra);background:#efe4d4;border-radius:22px;flex:1;position:relative;overflow:hidden}
.gim-lienzo canvas{width:100%;height:100%;display:block}
.gim-hud{text-align:center;pointer-events:none;position:absolute;bottom:10px;left:50%;transform:translate(-50%)}
.gim-rep{color:#5a4334;margin:0;font-size:3rem;font-weight:800;line-height:.9}
.gim-de{letter-spacing:.06em;text-transform:uppercase;color:#9a8468;margin:0;font-size:.72rem;font-weight:800}
.gim-cue{text-align:center;color:var(--acento);min-height:2.4em;margin:0;font-weight:800}
.gim-mandos{gap:8px;display:flex}
.gim-mandos .pastilla{flex:1;justify-content:center;align-items:center;gap:8px;width:auto;display:flex}
.gym-hub .hub-tile:last-child{grid-column:1/-1}
.gim-mandos{flex-wrap:wrap}
.gim-mandos .btn{flex:30%}
.icono,.btn,.fila,.esq,.mini,.flecha,.pastilla,.sexo,.tecla,.dia-cal,.swatch,.chat-campo,.chat-mic,.chip-vivo,.tecla-aho,.domo-chip,.panel-aviso,.panel-obra,.domo-luz{appearance:none;background:var(--panel);color:var(--tinta);box-shadow:var(--luz), var(--sombra);border:none}
.btn-acento{background:var(--acento);color:var(--acento2)}
.btn:active:not(:disabled),.icono:active,.fila:active,.esq:active,.mini:active,.tecla:active,.dia-cal:active,.pastilla:active,.hub-tile:active,.franja-card:active,.radio-card:active{box-shadow:var(--hundida);transform:scale(.97)}
.lista:has(.hub-tile){grid-template-rows:1fr 1fr;grid-template-columns:1fr 1fr;height:100%;display:grid}
.lista:has(.hub-tile) .hub-tile{height:100%;min-height:0}
.hogar-hub .hub-tile:last-child{grid-column:1/-1}
.sexo{border-radius:999px;min-height:44px;padding:0 14px;font-weight:800}
.gym-hub .hub-tile:last-child{grid-column:1/-1}
.grid-2{flex:1;grid-template-columns:1fr 1fr;gap:14px;min-height:0;display:grid}
.grid-2 .fila{height:100%}
.hub-tile{height:100%;min-height:0;box-shadow:var(--luz), var(--sombra);color:#faf6ef;text-align:left;border:none;border-radius:22px;padding:0;position:relative;overflow:hidden}
.hub-tile img{object-fit:cover;width:100%;height:100%;display:block}
.hub-tile .lab{background:linear-gradient(#0000,#12100ec7);padding:16px 16px 14px;position:absolute;bottom:0;left:0;right:0}
.hub-tile .lab strong{font-size:1.2rem;font-weight:800;display:block}
.hub-tile .lab em{opacity:.85;font-style:normal}
.hogar-hub .hub-tile .lab strong{font-family:var(--font-display);letter-spacing:-.03em;font-size:clamp(1.5rem,3.8vh,2.05rem);font-weight:600}
.hogar-hub .hub-tile .lab em{font-size:1.05rem}
.hogar-hub .hub-tile .lab{padding:22px 20px 20px}
html[data-pantalla=movil] .escena-movil .hub-tile,html[data-pantalla=movil] .escena-movil .fila{flex:none}
html[data-pantalla=movil] .escena-movil .hub-tile{height:7.4rem;min-height:7.4rem}
html[data-pantalla=movil] .hogar-hub .hub-tile:last-child,html[data-pantalla=movil] .salud-hub .esq:last-child{grid-column:1/-1}

/*$vite$:1*/
.hub-tile img,.esq img,.centro-casa img{display:none!important}
.hub-tile,.esq{background:linear-gradient(165deg,#2a3348,#1a2234)!important}
.hub-tile .lab,.esq span{position:relative;z-index:2}
  
/* LV: hub Cultura/gimnasio — no recortar subtítulos; contraste sobre crema */
.gym-hub .hub-tile {
  height: auto !important;
  min-height: 6.2rem !important;
  overflow: visible !important;
  background: linear-gradient(165deg, #fffaf2, #f0e6d6) !important;
  color: var(--tinta) !important;
  padding: 1rem !important;
  display: flex !important;
  flex-direction: column;
  justify-content: flex-end;
  position: relative;
  border: 1px solid var(--linea) !important;
  border-radius: 18px !important;
}
.gym-hub .hub-tile strong {
  color: var(--tinta) !important;
  font-size: 1.2rem;
  line-height: 1.2;
}
.gym-hub .hub-tile em {
  color: #4a3f34 !important; /* ≥4.5:1 sobre crema */
  font-style: normal;
  font-size: .9rem;
  line-height: 1.3;
  white-space: normal !important;
  opacity: 1 !important;
  margin-top: .35rem;
}
html[data-pantalla=movil] .gym-hub .hub-tile {
  height: auto !important;
  min-height: 6.2rem !important;
}

</style>

      </div>
    </main>
    <footer>lesvencimos.com · gimnasio (como el Asistente)</footer>

      showHub();
      if (state.grupo) {
        $('hub-tiles').classList.add('hidden');
        $('lista-wrap').classList.remove('hidden');
        $('btnBack').classList.remove('hidden');
        $('title').textContent = Wi[state.grupo] || 'Gimnasio';
        renderLista();
      }
      return;
    }
    // from lista to hub tiles
    state.grupo = null;
    $('lista-wrap').classList.add('hidden');
    $('hub-tiles').classList.remove('hidden');
    $('btnBack').classList.add('hidden');
    $('title').textContent = 'Gimnasio';
  }

  function buildHub() {
    var box = $('hub-tiles');
    box.innerHTML = '';
    Ui.forEach(function (g) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'hub-tile';
      b.innerHTML = '<strong></strong><em></em>';
      b.querySelector('strong').textContent = g.nom;
      b.querySelector('em').textContent = g.meta;
      b.addEventListener('click', function () { openGrupo(g.id); });
      box.appendChild(b);
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    buildHub();
    setFigura(state.figura);
    $('btnFigura').addEventListener('click', function () {
      setFigura(state.figura === 'chica' ? 'chico' : 'chica');
    });
    $('btnBack').addEventListener('click', back);
    $('btnPlay').addEventListener('click', togglePlay);
    $('btnVoz').addEventListener('click', function () {
      anim.voz = !anim.voz;
      $('btnVoz').textContent = anim.voz ? 'Voz sí' : 'Voz no';
      $('btnVoz').classList.toggle('btn-acento', anim.voz);
    });
    $('btnLento').addEventListener('click', function () {
      anim.lento = !anim.lento;
      $('btnLento').textContent = anim.lento ? 'Despacio' : 'Ritmo';
      $('btnLento').classList.toggle('btn-acento', anim.lento);
    });
    window.addEventListener('resize', resize);
  });
})();

  </script>
</body>
</html>
