<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0E0C">
<meta name="description" content="Calculadora offline Les vencimos: operaciones, memoria, raíz, historial. Sin nube.">
<title>Calculadora — Les vencimos</title>
<style>
.lv-brandbar{display:flex;align-items:baseline;justify-content:space-between;gap:.75rem;padding:0 0 .7rem;margin:0 0 .85rem;border-bottom:1px solid rgba(230,225,214,.14)}
.lv-brandbar .brand{color:inherit;text-decoration:none;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:600;font-size:1rem}
.lv-brandbar .lv-off{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;opacity:.65;font-weight:600}
:root{
  --fondo:#0E0E0C; --fondo-2:#161512; --fondo-3:#1C1A16;
  --tinta:#E6E1D6; --suave:#9A9488;
  --acento:#C4A15A; --acento-texto:#1A160E;
  --linea:rgba(230,225,214,0.14);
  --peligro:#C46A4A; --ok:#8F9A72;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",Georgia,serif;
  --sans:"Segoe UI",system-ui,-apple-system,sans-serif;
  --radio:2px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--fondo);color:var(--tinta);font-family:var(--sans)}
body{display:flex;flex-direction:column;align-items:center;padding:1.25rem 1rem 2.5rem}
header{width:100%;max-width:22rem;margin-bottom:1rem;border-bottom:1px solid var(--linea);padding-bottom:.75rem}
header h1{margin:0;font-family:var(--serif);font-size:1.35rem;font-weight:600;letter-spacing:-.01em}
header p{margin:.35rem 0 0;color:var(--suave);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase}
.wrap{width:100%;max-width:22rem;display:flex;flex-direction:column;gap:.85rem}
.calc{background:var(--fondo-2);border:1px solid var(--linea);border-radius:var(--radio);padding:1rem;display:flex;flex-direction:column;gap:.55rem}
.display{background:var(--fondo-3);border:1px solid var(--linea);border-radius:var(--radio);padding:.75rem 1rem;text-align:right;min-height:4.4rem;display:flex;flex-direction:column;justify-content:flex-end;gap:.15rem}
.display .mem{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--acento);min-height:1em;text-align:left}
.display .expr{font-size:.85rem;color:var(--suave);min-height:1.2em;word-break:break-all}
.display .val{font-family:var(--serif);font-size:2.05rem;font-weight:600;letter-spacing:-.02em;line-height:1.15;word-break:break-all}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}
button.key{min-height:50px;font:600 1.1rem var(--sans);border:1px solid var(--linea);border-radius:var(--radio);background:var(--fondo-3);color:var(--tinta);cursor:pointer}
button.key:hover{border-color:rgba(196,161,90,.55)}
button.key:active{transform:scale(.97)}
button.key.op{color:var(--acento)}
button.key.eq{background:var(--acento);color:var(--acento-texto);border-color:var(--acento)}
button.key.fn{color:var(--suave);font-size:.88rem}
button.key.mem{font-size:.78rem;letter-spacing:.04em}
button.key.zero{grid-column:span 2}
.hist{background:var(--fondo-2);border:1px solid var(--linea);border-radius:var(--radio);padding:.75rem .9rem}
.hist h2{margin:0 0 .45rem;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--suave);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.hist h2 button{min-height:36px;padding:0 .55rem;font:600 .72rem var(--sans);letter-spacing:.06em;text-transform:uppercase;background:var(--fondo-3);color:var(--suave);border:1px solid var(--linea);border-radius:var(--radio);cursor:pointer}
.hist ul{list-style:none;margin:0;padding:0;max-height:9rem;overflow:auto}
.hist li{border-top:1px solid var(--linea);padding:.4rem 0;font-size:.88rem;font-variant-numeric:tabular-nums;cursor:pointer}
.hist li:first-child{border-top:0}
.hist li .e{color:var(--suave);font-size:.78rem;display:block}
.hist li .r{font-family:var(--serif);font-weight:600}
.hist .empty{color:var(--suave);font-size:.85rem;margin:0}
.hint{margin:0;color:var(--suave);font-size:.78rem;line-height:1.45}
.foot{margin-top:.5rem;color:var(--suave);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;text-align:center}
</style>
</head>
<body>
<div class="lv-brandbar"><a class="brand" href="../index.html">Les vencimos</a><span class="lv-off">Offline</span></div>

<header>
  <h1>Calculadora</h1>
  <p>Les vencimos · offline</p>
</header>
<div class="wrap">
<div class="calc" role="application" aria-label="Calculadora">
  <div class="display" aria-live="polite">
    <div class="mem" id="memFlag"></div>
    <div class="expr" id="expr"></div>
    <div class="val" id="val">0</div>
  </div>
  <div class="keys">
    <button type="button" class="key mem" data-act="mc" title="Borrar memoria">MC</button>
    <button type="button" class="key mem" data-act="mr" title="Recuperar memoria">MR</button>
    <button type="button" class="key mem" data-act="mplus" title="Sumar a memoria">M+</button>
    <button type="button" class="key mem" data-act="mminus" title="Restar de memoria">M−</button>

    <button type="button" class="key fn" data-act="clear" title="Borrar todo">C</button>
    <button type="button" class="key fn" data-act="back" title="Borrar último dígito">⌫</button>
    <button type="button" class="key fn" data-act="pct">%</button>
    <button type="button" class="key op" data-act="op" data-op="/">÷</button>

    <button type="button" class="key fn" data-act="sqrt" title="Raíz cuadrada">√</button>
    <button type="button" class="key fn" data-act="square" title="Al cuadrado">x²</button>
    <button type="button" class="key fn" data-act="inv" title="Inverso">1/x</button>
    <button type="button" class="key op" data-act="op" data-op="*">×</button>

    <button type="button" class="key" data-act="digit" data-d="7">7</button>
    <button type="button" class="key" data-act="digit" data-d="8">8</button>
    <button type="button" class="key" data-act="digit" data-d="9">9</button>
    <button type="button" class="key op" data-act="op" data-op="-">−</button>

    <button type="button" class="key" data-act="digit" data-d="4">4</button>
    <button type="button" class="key" data-act="digit" data-d="5">5</button>
    <button type="button" class="key" data-act="digit" data-d="6">6</button>
    <button type="button" class="key op" data-act="op" data-op="+">+</button>

    <button type="button" class="key" data-act="digit" data-d="1">1</button>
    <button type="button" class="key" data-act="digit" data-d="2">2</button>
    <button type="button" class="key" data-act="digit" data-d="3">3</button>
    <button type="button" class="key eq" data-act="eq" style="grid-row:span 2">=</button>

    <button type="button" class="key fn" data-act="sign">±</button>
    <button type="button" class="key" data-act="digit" data-d="0">0</button>
    <button type="button" class="key" data-act="dot">.</button>
  </div>
</div>

<section class="hist" aria-labelledby="hist-h">
  <h2 id="hist-h">Historial <button type="button" id="histClear">Vaciar</button></h2>
  <ul id="histList"></ul>
  <p class="empty" id="histEmpty">Aún no hay operaciones. Se guardan solo en este aparato.</p>
</section>
<p class="hint">Teclado: dígitos, + − * /, Enter, Escape (C), Backspace. Memoria y historial en este origen (localStorage).</p>
</div>
<p class="foot">Archivo local · sin nube · v20261002</p>
<script>
(function(){
  var valEl=document.getElementById('val');
  var exprEl=document.getElementById('expr');
  var memFlag=document.getElementById('memFlag');
  var histList=document.getElementById('histList');
  var histEmpty=document.getElementById('histEmpty');
  var HIST_KEY='lv-calc-hist-v1';
  var MEM_KEY='lv-calc-mem-v1';
  var cur='0', prev=null, op=null, fresh=false, memory=0;
  var sym={'+':'+','-':'−','*':'×','/':'÷'};

  try{
    var ms=localStorage.getItem(MEM_KEY);
    if(ms!=null && ms!==''){ memory=Number(ms); if(!isFinite(memory)) memory=0; }
  }catch(e){}

  function showMem(){
    memFlag.textContent = (memory!==0) ? ('M = '+fmt(memory)) : '';
    try{ localStorage.setItem(MEM_KEY, String(memory)); }catch(e){}
  }
  function show(){
    valEl.textContent=cur;
    exprEl.textContent=(prev!=null && op)? (fmt(prev)+' '+(sym[op]||op)) : '';
    showMem();
  }
  function fmt(n){
    if(n===null || n===undefined) return '';
    if(typeof n==='number'){
      if(!isFinite(n)) return 'Error';
      if(Math.abs(n)>=1e12 || (Math.abs(n)>0 && Math.abs(n)<1e-8)) return n.toExponential(8).replace(/\.?0+e/,'e');
      var s=String(Number(n.toPrecision(12)));
      return s;
    }
    var s=String(n);
    if(s.length>16){
      var num=Number(n);
      if(!isFinite(num)) return 'Error';
      return String(Number(num.toPrecision(12)));
    }
    return s;
  }
  function err(){ cur='Error'; prev=null; op=null; fresh=true; show(); }
  function digit(d){
    if(cur==='Error'){ cur='0'; }
    if(fresh){ cur=d; fresh=false; }
    else if(cur==='0' && d!=='0') cur=d;
    else if(cur==='0' && d==='0') cur='0';
    else if(cur.length<18) cur+=d;
    show();
  }
  function dot(){
    if(cur==='Error'){ cur='0'; }
    if(fresh){ cur='0.'; fresh=false; }
    else if(cur.indexOf('.')<0) cur+='.';
    show();
  }
  function clearAll(){ cur='0'; prev=null; op=null; fresh=false; show(); }
  function back(){
    if(fresh || cur==='Error'){ clearAll(); return; }
    if(cur.length<=1 || (cur.length===2 && cur.charAt(0)==='-')) cur='0';
    else cur=cur.slice(0,-1);
    show();
  }
  function sign(){
    if(cur==='Error' || cur==='0') return;
    cur=cur.charAt(0)==='-'?cur.slice(1):('-'+cur);
    show();
  }
  function pct(){
    var n=parseFloat(cur); if(!isFinite(n)) return;
    if(prev!=null && op){
      /* porcentaje relativo al operando previo (estilo calculadora de bolsillo) */
      cur=String((prev * n)/100);
    } else {
      cur=String(n/100);
    }
    show();
  }
  function compute(a,b,o){
    a=Number(a); b=Number(b);
    if(o==='+') return a+b;
    if(o==='-') return a-b;
    if(o==='*') return a*b;
    if(o==='/') return b===0?NaN:a/b;
    return b;
  }
  function setOp(o){
    if(cur==='Error'){ clearAll(); }
    if(op && !fresh){
      var r=compute(prev,cur,op);
      if(!isFinite(r)){ err(); return; }
      cur=fmt(r); prev=Number(cur);
    } else {
      prev=Number(cur);
    }
    op=o; fresh=true; show();
  }
  function pushHist(line, result){
    var list=[];
    try{ list=JSON.parse(localStorage.getItem(HIST_KEY)||'[]'); }catch(e){ list=[]; }
    if(!Array.isArray(list)) list=[];
    list.unshift({e:line, r:result, t:Date.now()});
    if(list.length>30) list=list.slice(0,30);
    try{ localStorage.setItem(HIST_KEY, JSON.stringify(list)); }catch(e){}
    renderHist();
  }
  function renderHist(){
    var list=[];
    try{ list=JSON.parse(localStorage.getItem(HIST_KEY)||'[]'); }catch(e){ list=[]; }
    if(!Array.isArray(list) || !list.length){
      histList.innerHTML='';
      histEmpty.hidden=false;
      return;
    }
    histEmpty.hidden=true;
    histList.innerHTML=list.map(function(it,i){
      return '<li data-i="'+i+'" title="Usar este resultado"><span class="e">'+esc(it.e)+'</span><span class="r">'+esc(String(it.r))+'</span></li>';
    }).join('');
  }
  function esc(s){ return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
  function eq(){
    if(op==null||prev==null) return;
    var a=prev, b=cur, o=op;
    var r=compute(a,b,o);
    if(!isFinite(r)){ err(); return; }
    var line=fmt(a)+' '+(sym[o]||o)+' '+b;
    exprEl.textContent=line+' =';
    cur=fmt(r); prev=null; op=null; fresh=true;
    valEl.textContent=cur;
    pushHist(line, cur);
    showMem();
  }
  function unary(kind){
    var n=parseFloat(cur);
    if(!isFinite(n)){ err(); return; }
    var r, line;
    if(kind==='sqrt'){
      if(n<0){ err(); return; }
      r=Math.sqrt(n); line='√('+fmt(n)+')';
    } else if(kind==='square'){
      r=n*n; line='('+fmt(n)+')²';
    } else if(kind==='inv'){
      if(n===0){ err(); return; }
      r=1/n; line='1/('+fmt(n)+')';
    } else return;
    if(!isFinite(r)){ err(); return; }
    cur=fmt(r); fresh=true; prev=null; op=null;
    exprEl.textContent=line+' =';
    valEl.textContent=cur;
    pushHist(line, cur);
    showMem();
  }
  function memAdd(sign){
    var n=parseFloat(cur);
    if(!isFinite(n)) return;
    memory = memory + sign*n;
    fresh=true;
    showMem();
  }
  document.querySelector('.keys').addEventListener('click',function(e){
    var b=e.target.closest('button.key'); if(!b) return;
    var a=b.getAttribute('data-act');
    if(a==='digit') digit(b.getAttribute('data-d'));
    else if(a==='dot') dot();
    else if(a==='clear') clearAll();
    else if(a==='back') back();
    else if(a==='sign') sign();
    else if(a==='pct') pct();
    else if(a==='op') setOp(b.getAttribute('data-op'));
    else if(a==='eq') eq();
    else if(a==='sqrt') unary('sqrt');
    else if(a==='square') unary('square');
    else if(a==='inv') unary('inv');
    else if(a==='mc'){ memory=0; showMem(); }
    else if(a==='mr'){ cur=fmt(memory); fresh=true; show(); }
    else if(a==='mplus') memAdd(1);
    else if(a==='mminus') memAdd(-1);
  });
  document.addEventListener('keydown',function(e){
    if(e.key>='0'&&e.key<='9'){ digit(e.key); e.preventDefault(); }
    else if(e.key==='.'){ dot(); e.preventDefault(); }
    else if(e.key==='Escape'||e.key==='c'||e.key==='C'){ clearAll(); e.preventDefault(); }
    else if(e.key==='Backspace'){ back(); e.preventDefault(); }
    else if(e.key==='%'){ pct(); e.preventDefault(); }
    else if(e.key==='Enter'||e.key==='='){ eq(); e.preventDefault(); }
    else if(e.key==='+'||e.key==='-'||e.key==='*'||e.key==='/'){ setOp(e.key); e.preventDefault(); }
  });
  histList.addEventListener('click',function(e){
    var li=e.target.closest('li[data-i]'); if(!li) return;
    var list=[];
    try{ list=JSON.parse(localStorage.getItem(HIST_KEY)||'[]'); }catch(err){ list=[]; }
    var it=list[+li.getAttribute('data-i')];
    if(!it) return;
    cur=String(it.r); fresh=true; prev=null; op=null; show();
  });
  document.getElementById('histClear').onclick=function(){
    try{ localStorage.removeItem(HIST_KEY); }catch(e){}
    renderHist();
  };
  renderHist();
  show();
})();
</script>
</body>
</html>
