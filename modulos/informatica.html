tus permisos: por eso se instala solo de fuentes oficiales, se actualiza sin demora y se revisan los permisos concedidos. Los navegadores son el frente principal: extensiones mínimas, y cuidado con lo que se ejecuta (JavaScript malicioso, descargas).","El malware tiene su catálogo: virus, gusanos, troyanos, ransomware, spyware, rootkits (que se esconden en el propio sistema). La defensa es la de siempre y funciona: capas, parches, copias desconectadas y escepticismo sano ante lo inesperado.","Reto: revisa en tu móvil qué apps tienen permiso de micrófono y ubicación, y retira las que no lo justifiquen. Estás aplicando el mínimo privilegio a tu vida."],"quiz":[{"pregunta":"¿Qué verifica Secure Boot?","opciones":["Que el sistema que arranca esté firmado y no manipulado","La temperatura","La contraseña del wifi"],"correcta":0,"porque":"Cadena de confianza desde el encendido: solo arranca software firmado."},{"pregunta":"¿Por qué no conectar USB encontrados?","opciones":["Porque son un cebo clásico para introducir malware","Porque gastan batería","Porque son lentos"],"correcta":0,"porque":"El 'USB del parking' es un ataque real documentado: la curiosidad es el vector."},{"pregunta":"¿Qué es un rootkit?","opciones":["Malware que se oculta en lo profundo del sistema","Un kit de raíces de plantas","Un antivirus"],"correcta":0,"porque":"Modifica el sistema para volverse invisible: por eso importan el arranque seguro y la integridad."}]},{"titulo":"Disponibilidad: copias de seguridad (020-023.4)","contenido":["La disponibilidad es la tercera pata de la seguridad: los datos que no se pueden recuperar están perdidos igual que robados. La regla clásica es 3-2-1: tres copias, en dos soportes distintos, una fuera de casa. Contra el ransomware y contra el incendio, la copia remota o desconectada es la que salva.","En Linux la herramienta madre es rsync: copia solo lo que cambió, conserva permisos y puede hacerlo por ssh a otra máquina. tar empaqueta, cron programa la copia de madrugada, y las instantáneas (snapshots) permiten volver a ayer en segundos.","La verdad incómoda: una copia nunca probada no es una copia, es una esperanza. Los procedimientos serios incluyen ensayos de restauración: recuperar un archivo de verdad, de vez en cuando, para saber que el paracaídas abre.","Reto: escribe tu plan 3-2-1 personal en una nota: qué datos, dónde vive cada copia, cada cuánto se hace y cuándo fue la última restauración de prueba."],"quiz":[{"pregunta":"¿Qué dice la regla 3-2-1?","opciones":["Tres copias, dos soportes distintos, una fuera de casa","Tres contraseñas y dos claves","Copiar cada 3 horas"],"correcta":0,"porque":"Es el estándar de las copias domésticas y profesionales: cubre robo, avería y desastre."},{"pregunta":"¿Qué hace rsync?","opciones":["Copia solo lo que cambió, conservando permisos, también por red","Borra duplicados","Cifra el disco"],"correcta":0,"porque":"Incremental y eficiente: la navaja suiza de las copias en Linux."},{"pregunta":"¿Por qué ensayar las restauraciones?","opciones":["Porque una copia no probada puede fallar el día del desastre","Para gastar tiempo","No hace falta"],"correcta":0,"porque":"La copia que no restaura no existe: los ensayos son la prueba real."}]},{"titulo":"Redes, firewalls y anonimato (020-024)","contenido":["La red se entiende por capas: IP lleva paquetes entre máquinas, TCP los ordena y confirma, UDP los suelta sin garantías, y encima viven los servicios en sus puertos (web en 80/443, ssh en 22, correo en 25/587). Un puerto abierto es un servicio escuchando: cada uno es una puerta a vigilar.","El firewall decide qué paquetes pasan: la política sana es 'todo cerrado salvo lo necesario'. En Linux se configura con nftables o frontales como ufw (ufw allow 22 abre ssh y poco más). Un servidor expuesto a internet sin firewall es una casa sin puerta.","Para la privacidad en tránsito: la VPN cifra todo tu tráfico hasta el servidor de salida (útil en wifi ajenas), y Tor encamina por tres relevos cifrados para el anonimato real. El DNS también se puede cifrar (DoH/DoT) para que ni el proveedor vea qué dominios visitas.","Reto: lista los puertos en escucha de tu equipo y justifica cada uno. Lo que no puedas justificar, ciérralo: ese es el ejercicio de firewall más honesto."],"quiz":[{"pregunta":"¿Qué política de firewall es la sana?","opciones":["Todo cerrado salvo lo estrictamente necesario","Todo abierto","Solo cerrar el 80"],"correcta":0,"porque":"Denegar por defecto y abrir a propósito: cada puerto abierto es una superficie de ataque."},{"pregunta":"¿Qué diferencia hay entre VPN y Tor?","opciones":["La VPN cifra hasta su servidor; Tor anonimiza con tres relevos","Son lo mismo","Tor es más rápido"],"correcta":0,"porque":"La VPN protege la conexión; Tor protege la identidad. Objetivos distintos."},{"pregunta":"¿Qué es ufw?","opciones":["Un frontal sencillo para configurar el firewall de Linux","Un antivirus","Una VPN"],"correcta":0,"porque":"Uncomplicated Firewall: ufw allow 22 y ufw enable y ya tienes política."}]},{"titulo":"Identidad, autenticación y privacidad (020-025)","contenido":["Autenticar es demostrar quién eres con tres factores posibles: algo que sabes (contraseña), algo que tienes (móvil, llave), algo que eres (huella). Combinar dos de familias distintas es la autenticación fuerte: dos contraseñas no son 2FA, son la misma debilidad dos veces.","Las contraseñas robustas viven en gestores, las llaves de hardware (FIDO2) resisten el phishing porque la llave verifica el sitio antes de responder, y los sistemas centralizados (LDAP, Kerberos) gestionan identidades en las empresas con un solo punto de verdad.","La privacidad es el otro frente: minimizar datos (no des lo que no hace falta), revisar permisos, conocer tus derechos (el RGPD europeo da acceso, rectificación y borrado) y recordar que la mejor protección de un dato es que no exista.","Reto: migra tu cuenta más importante a una llave de paso (passkey) o a un segundo factor fuerte, y revisa qué datos personales has dado en tus cinco apps más usadas."],"quiz":[{"pregunta":"¿Cuáles son las tres familias de factores de autenticación?","opciones":["Lo que sabes, lo que tienes, lo que eres","Nombre, apellido, edad","Email, web, teléfono"],"correcta":0,"porque":"Combinar familias distintas es lo fuerte: robar una no basta."},{"pregunta":"¿Por qué las llaves FIDO2 resisten el phishing?","opciones":["Porque verifican el sitio real antes de responder","Porque son caras","Porque son metálicas"],"correcta":0,"porque":"La llave no responde a un dominio falso: el engaño visual deja de funcionar."},{"pregunta":"¿Qué principio de privacidad es el más efectivo?","opciones":["La minimización: el dato que no existe no se puede filtrar","Publicar todo","Confiar en la suerte"],"correcta":0,"porque":"No recoger datos innecesarios es la defensa definitiva contra su robo."}]}],"nivel":"avanzado"},{"id":"lpi-web","titulo":"LPI Web Development (030)","icono":"🌐","lecciones":[{"titulo":"HTML: el esqueleto de la web (030-032.1/032.2)","contenido":["Toda página web es un documento HTML: texto marcado con etiquetas. La estructura mínima: <!DOCTYPE html>, luego <html>, con <head> (metadatos: título, codificación) y <body> (lo visible). Las etiquetas se anidan como cajas: <p> párrafos, <h1> a <h6> títulos, <ul>/<li> listas.","El HTML moderno es semántico: las etiquetas dicen qué ES cada cosa, no cómo se ve. <header>, <nav>, <main>, <article>, <footer> estructuran el documento para buscadores, lectores de pantalla y humanos. La apariencia es trabajo de CSS; el significado, de HTML.","Los atributos dan detalles: <a href='https://...'> enlaza, <img src='...' alt='descripción'> incrusta imágenes (el alt describe para quien no puede ver: accesibilidad desde el primer día). Los enlaces relativos navegan dentro del sitio; los absolutos, fuera.","Reto: escribe una página mínima con un h1, un párrafo, una lista de tres cosas y un enlace. Ábrela en el navegador con doble clic: ya eres autor de la web."],"quiz":[{"pregunta":"¿Qué diferencia hay entre <head> y <body>?","opciones":["head guarda metadatos; body, el contenido visible","Ninguna","body va primero"],"correcta":0,"porque":"La cabecera informa al navegador; el cuerpo es lo que ve la gente."},{"pregunta":"¿Por qué usar etiquetas semánticas como <nav> o <article>?","opciones":["Porque declaran el significado: accesibilidad y buscadores","Porque cargan más rápido","Porque son más bonitas"],"correcta":0,"porque":"El significado estructurado sirve a lectores de pantalla, buscadores y mantenimiento."},{"pregunta":"¿Para qué sirve el atributo alt en las imágenes?","opciones":["Para describir la imagen a quien no puede verla","Para decorar","Para cargar dos imágenes"],"correcta":0,"porque":"El texto alternativo es accesibilidad obligatoria y buena práctica profesional."}]},{"titulo":"Formularios y recursos (030-032.3/032.4)","contenido":["El formulario es como la web habla contigo: <form> agrupa, <input> recoge (texto, contraseña, número, fecha, casillas), <select> despliega opciones, <textarea> acepta párrafos y <button> envía. Cada campo lleva su <label> asociada: clicar la etiqueta enfoca el campo, y los lectores de pantalla la leen.","Los atributos clave: name es el nombre con que viaja el dato, required lo hace obligatorio, y el type del input trae validación gratis: type='email' exige formato de correo, type='number' solo números. El navegador valida antes de enviar.","El envío viaja por HTTP con GET (datos visibles en la URL, para búsquedas) o POST (datos en el cuerpo, para todo lo demás). Y los recursos incrustados (imágenes, vídeo con <video>, audio, iframes) convierten el documento en aplicación.","Reto: crea un formulario con nombre (required), email (type email) y un botón de envío. Prueba a enviarlo vacío y mira al navegador defender la validación por ti."],"quiz":[{"pregunta":"¿Para qué sirve la etiqueta <label>?","opciones":["Asocia el texto al campo: accesibilidad y mejor uso","Para poner negrita","Para nada"],"correcta":0,"porque":"Clic en la etiqueta enfoca el campo; el lector de pantalla la anuncia: siempre con label."},{"pregunta":"¿Qué validación gratuita da type='email'?","opciones":["El navegador exige formato de correo antes de enviar","Envía correos solos","Ninguna"],"correcta":0,"porque":"Los tipos de input traen validación y teclados adecuados en móvil sin escribir código."},{"pregunta":"¿Cuándo usar POST en vez de GET?","opciones":["Cuando los datos no deben ir visibles en la URL","Siempre","Nunca"],"correcta":0,"porque":"GET es para consultas inocuas y compartibles; POST para envíos con efectos."}]},{"titulo":"CSS: el estilo de la web (030-033)","contenido":["CSS separa la apariencia del contenido: el HTML dice qué es cada cosa y el CSS cómo se ve. La sintaxis es selector { propiedad: valor; }: p { color: darkgreen; } tiñe todos los párrafos. Se puede escribir en el <head>, en el atributo style, o (lo correcto) en un archivo .css enlazado.","Los selectores son el arte de apuntar: por etiqueta (p), por clase (.aviso, reutilizable), por id (#unico), y combinados (nav ul li). La cascada decide conflictos: lo más específico gana, y a igualdad, lo último escrito.","El modelo de caja gobierna el espacio: todo elemento es contenido + padding (aire interior) + border + margin (aire exterior). Y para colocar: flexbox (display: flex) alinea filas y columnas con justify-content y align-items, y grid hace cuadrículas. El 90% del diseño moderno es flexbox bien entendido.","Reto: dale estilo a tu página del reto anterior: fuente del sistema, un color de fondo crema, los títulos en verde oscuro y las listas sin viñetas. Guárdalo en un archivo .css aparte y enlázalo."],"quiz":[{"pregunta":"¿Qué selector es reutilizable en muchos elementos?","opciones":["La clase (.aviso)","El id (#unico)","Ninguno"],"correcta":0,"porque":"El id es único por página; la clase se repite donde haga falta."},{"pregunta":"¿Qué es el modelo de caja?","opciones":["Contenido + padding + border + margin","Una caja de zapatos","El borde solamente"],"correcta":0,"porque":"Todo elemento ocupa esas cuatro capas: maquetar es gobernarlas."},{"pregunta":"¿Qué hace display: flex?","opciones":["Alinea elementos en fila o columna con control de su reparto","Hace letras flexibles","Oculta elementos"],"correcta":0,"porque":"Flexbox resolvió el centrado y la distribución: el caballo de batalla del diseño actual."}]},{"titulo":"JavaScript: la web cobra vida (030-034.1/034.2)","contenido":["JavaScript es el único lenguaje que habla el navegador: se incrusta con <script> y convierte documentos en aplicaciones. Variables con let y const, tipos básicos (número, texto, booleano), y console.log() como ventana de depuración (F12 abre la consola: tu nuevo laboratorio).","Las estructuras de datos: arrays ordenados (let lista = ['pan', 'leche']) con métodos como push, map y filter, y objetos con claves (let persona = {nombre: 'Ana', edad: 30}). Casi todo en JS es objeto, y JSON es su forma de texto: el idioma de los datos en la web.","El mismo programa que en Python se escribe casi igual: las ideas (variables, bucles, funciones) son las mismas en todo lenguaje; solo cambia la ropa. Aprender el segundo lenguaje cuesta la mitad que el primero.","Reto: abre la consola del navegador (F12) y ejecuta [1,2,3,4].map(n => n*n). Acabas de transformar una lista con una función flecha: programación real en tu navegador."],"quiz":[{"pregunta":"¿Dónde se ejecuta JavaScript clásicamente?","opciones":["En el navegador","En el servidor solamente","En la impresora"],"correcta":0,"porque":"Es el lenguaje nativo del navegador; con Node.js también corre en servidores."},{"pregunta":"¿Qué diferencia hay entre let y const?","opciones":["const no se puede reasignar; let sí","Ninguna","const es más rápido"],"correcta":0,"porque":"const por defecto, let cuando de verdad cambia: intención clara en el código."},{"pregunta":"¿Qué hace [1,2,3].map(n => n*2)?","opciones":["Devuelve [2,4,6]: transforma cada elemento","Suma todo","Ordena"],"correcta":0,"porque":"map aplica una función a cada elemento y devuelve la lista transformada."}]},{"titulo":"Control, funciones y el DOM (030-034.3/034.4)","contenido":["Las decisiones y bucles de JavaScript heredan la sintaxis de C: if (edad >= 18) { ... }, for (let i = 0; i < 10; i++), while. Las funciones se declaran con function o como flechas: const doble = n => n * 2. Y son valores: se guardan en variables y se pasan como argumentos.","El DOM es la página vista como árbol de objetos que JavaScript puede tocar: document.querySelector('.aviso') agarra un elemento, .textContent cambia su texto, .style lo restiliza. La página deja de ser papel y se vuelve arcilla.","Los eventos conectan con el usuario: boton.addEventListener('click', funcion) ejecuta código al pulsar. Leer lo que escribió (input.value), validarlo y responder: ese ciclo es toda la interacción web, desde un botón de me gusta hasta un banco en línea.","Reto: añade a tu página un botón y un párrafo vacío; con addEventListener, haz que al pulsar el botón el párrafo diga la hora actual (new Date().toLocaleTimeString()). Tu primera página interactiva."],"quiz":[{"pregunta":"¿Qué es el DOM?","opciones":["La página como árbol de objetos manipulable por JavaScript","Un servidor","Un tipo de CSS"],"correcta":0,"porque":"document.querySelector y compañía convierten el documento en material programable."},{"pregunta":"¿Qué hace addEventListener('click', f)?","opciones":["Ejecuta la función f cuando el usuario pulsa ese elemento","Crea un botón","Cierra la página"],"correcta":0,"porque":"Los eventos son el sistema nervioso de la web: la página reacciona al usuario."},{"pregunta":"¿Qué son las funciones flecha (=>)?","opciones":["Funciones anónimas compactas, también usables como valores","Flechas del teclado","Comentarios"],"correcta":0,"porque":"n => n*2 es una función completa: en JS las funciones viajan como datos."}]},{"titulo":"Node.js y Express: JavaScript en el servidor (030-035.1/035.2)","contenido":["Node.js sacó a JavaScript del navegador: el mismo lenguaje corre en el servidor con acceso a archivos y red. Un programa se ejecuta con node app.js, y npm gestiona sus paquetes: el almacén más grande de bibliotecas que existe.","Express es el marco mínimo para servidores web: app.get('/saludo', (req, res) => res.send('Hola')) crea una ruta que responde a las visitas. El servidor escucha peticiones (req) y devuelve respuestas (res): ese diálogo es la web entera.","El flujo completo de una app web: el navegador pide, el servidor enruta, consulta datos, y responde JSON o HTML. Las rutas con parámetros ('/usuarios/:id') y los verbos HTTP (GET lee, POST crea, PUT/PATCH actualiza, DELETE borra) forman el vocabulario de las APIs.","Reto conceptual: dibuja en papel el viaje de una compra en línea: qué pide el navegador, qué consulta el servidor, qué responde. Entender ese diagrama es entender la web profesional."],"quiz":[{"pregunta":"¿Qué permitió Node.js?","opciones":["Ejecutar JavaScript fuera del navegador, en servidores","Navegar más rápido","Editar fotos"],"correcta":0,"porque":"Mismo lenguaje en cliente y servidor: una sola cabeza para toda la aplicación."},{"pregunta":"¿Qué hace app.get('/saludo', ...)?","opciones":["Define qué responde el servidor cuando alguien visita /saludo","Crea una carpeta","Descarga archivos"],"correcta":0,"porque":"Las rutas asocian URLs con funciones: el mapa de carreteras del servidor."},{"pregunta":"¿Qué verbo HTTP se usa para crear algo nuevo?","opciones":["POST","GET","DELETE"],"correcta":0,"porque":"GET lee, POST crea, PUT/PATCH actualiza, DELETE borra: el CRUD de la web."}]},{"titulo":"SQL: preguntar a los datos (030-035.3)","contenido":["Las bases de datos relacionales guardan datos en tablas con filas y columnas, y SQL es el idioma universal para preguntarles. SELECT nombre, precio FROM productos WHERE precio < 10 ORDER BY precio; — se lee casi como se piensa: qué columnas, de qué tabla, con qué filtro, en qué orden.","Escribir datos: INSERT INTO productos VALUES (...), UPDATE productos SET precio = 12 WHERE id = 3, DELETE FROM productos WHERE id = 3. El WHERE es el guardián: un UPDATE o DELETE sin WHERE toca TODA la tabla. Regla de supervivencia: primero prueba el WHERE con un SELECT.","Las tablas se relacionan por claves: la tabla pedidos guarda el id del cliente, y JOIN las reúne en la consulta. Las bases relacionales llevan cincuenta años mandando porque su modelo (tablas + relaciones + SQL) es sencillo, riguroso y durable.","Reto: escribe en papel la consulta que devuelva los nombres de los alumnos aprobados (nota >= 5) ordenados de mayor a menor nota. SQL se aprende escribiéndolo."],"quiz":[{"pregunta":"¿Qué hace SELECT ... WHERE ...?","opciones":["Filtra las filas que cumplen la condición","Borra la tabla","Crea usuarios"],"correcta":0,"porque":"SELECT elige columnas, FROM la tabla, WHERE filtra filas, ORDER BY ordena."},{"pregunta":"¿Por qué probar el WHERE con SELECT antes de un DELETE?","opciones":["Porque sin WHERE el DELETE toca toda la tabla","Porque es más rápido","Por costumbre solamente"],"correcta":0,"porque":"Ver primero qué filas caen en tu condición evita el borrado masivo accidental."},{"pregunta":"¿Para qué sirve JOIN?","opciones":["Para reunir datos de tablas relacionadas por sus claves","Para unir cables","Para duplicar datos"],"correcta":0,"porque":"Las relaciones entre tablas son la esencia del modelo relacional."}]}],"nivel":"avanzado"},{"id":"lpi-opensource","titulo":"LPI Open Source (050)","icono":"📖","lecciones":[{"titulo":"Licencias de software: copyleft y permisivas (050-052)","contenido":["Una licencia es el contrato que dice qué puedes hacer con un programa. Las de copyleft fuerte (GPL) exigen que quien distribuya una versión modificada publique también el código con la misma licencia: la libertad es hereditaria. Linux es GPL: por eso nadie puede cerrarlo.","Las permisivas (MIT, BSD, Apache) permiten casi todo: usar, modificar, cerrar, vender, con solo mantener el aviso de autoría. Apache 2.0 añade una protección explícita de patentes. Gran parte de internet (el servidor web, las bibliotecas) corre bajo estas licencias.","Elegir licencia es una decisión de estrategia y valores: ¿quieres máxima adopción aunque te integren en productos cerrados (permisiva) o que toda mejora vuelva a la comunidad (copyleft)? No hay respuesta única: hay intención.","Reto: busca la licencia de tres proyectos que uses (por ejemplo, el núcleo Linux, el navegador y alguna biblioteca) y clasifícalas: copyleft o permisiva. Interpretar licencias es una competencia profesional real."],"quiz":[{"pregunta":"¿Qué exige el copyleft?","opciones":["Que las obras derivadas distribuidas mantengan la misma licencia libre","Pagar una cuota","No modificar nada"],"correcta":0,"porque":"La GPL hace la libertad hereditaria: quien se beneficia, devuelve."},{"pregunta":"¿Qué permite una licencia MIT?","opciones":["Usar, modificar y cerrar el código, manteniendo el aviso de autoría","Solo leer","Solo estudiar"],"correcta":0,"porque":"Las permisivas maximizan la adopción con mínimas condiciones."},{"pregunta":"¿Qué añade Apache 2.0 respecto a MIT?","opciones":["Una concesión explícita de patentes","Más colores","Una cuota"],"correcta":0,"porque":"La cláusula de patentes protege a usuarios y contribuidores de demandas."}]},{"titulo":"Contenido abierto y Creative Commons (050-053)","contenido":["El contenido (textos, fotos, música, datos) tiene sus propias licencias abiertas: Creative Commons. Se componen de piezas: BY (citar autoría, siempre), SA (compartir igual), NC (sin uso comercial), ND (sin obras derivadas). CC-BY es la más abierta; CC-BY-NC-ND, la más restrictiva de la familia.","Leer las siglas es leer el contrato: una foto CC-BY-SA puede usarse incluso comercialmente citando al autor y compartiendo la derivada con la misma licencia. Wikipedia es CC-BY-SA: por eso se puede reutilizar citando.","Hay mundos vecinos: dominio público (CC0, sin derechos), licencias de datos abiertas para gobiernos, y la documentación libre (GFDL). Este mismo proyecto, por cierto, es un ejemplo del espíritu: conocimiento hecho para regalar.","Reto: encuentra una imagen CC-BY en Wikimedia Commons para ilustrar algo tuyo, y escribe la atribución correcta con autor, título y licencia. Citar bien es usar bien."],"quiz":[{"pregunta":"¿Qué significa NC en una licencia Creative Commons?","opciones":["Sin uso comercial","Nombre del creador","No copiar"],"correcta":0,"porque":"NonCommercial: puedes usarla, pero no para ganar dinero con ella."},{"pregunta":"¿Qué obligación tiene SIEMPRE toda licencia CC?","opciones":["Citar la autoría (BY)","Pagar","Registrarse"],"correcta":0,"porque":"La atribución es la pieza común de toda la familia Creative Commons."},{"pregunta":"¿Bajo qué licencia está Wikipedia?","opciones":["CC-BY-SA","Es privada","Dominio público"],"correcta":0,"porque":"Por eso se puede reutilizar: citando y compartiendo igual las derivadas."}]},{"titulo":"Modelos de negocio del código abierto (050-054)","contenido":["Regalar el código no impide el negocio: Red Hat vale miles de millones vendiendo soporte, certificación y tranquilidad empresarial sobre Linux, que es gratis. El software libre se vende como servicio: la garantía, las actualizaciones probadas y el teléfono al que llamar a las 3 de la madrugada.","Otros modelos probados: open core (núcleo libre, extras de pago), hosting (el código es libre, pero el servicio gestionado se cobra: así viven muchas empresas de WordPress o GitLab), doble licencia (libre para unos, comercial para otros) y consultoría a medida.","El cumplimiento (compliance) es la otra cara: usar código libre exige respetar sus licencias — publicar las derivadas si es copyleft, mantener avisos, auditar dependencias. Las empresas serias llevan inventario de su software (SBOM) para saber qué licencias arrastran.","Reto: piensa en un programa libre que usas y diseña en tres líneas cómo ganarías dinero con él sin cerrarlo: soporte, hosting, formación... Hay más modelos de los que parece."],"quiz":[{"pregunta":"¿Cómo gana dinero Red Hat con software gratuito?","opciones":["Vendiendo soporte, certificación y servicio empresarial","Vendiendo el código","Con publicidad"],"correcta":0,"porque":"El código es libre; el valor está en la garantía y el servicio."},{"pregunta":"¿Qué es el modelo open core?","opciones":["Núcleo libre con funciones extra de pago","Cerrar todo","Regalar servidores"],"correcta":0,"porque":"Libre lo esencial, comercial lo avanzado: el equilibrio que usan GitLab y otros."},{"pregunta":"¿Qué es un SBOM?","opciones":["El inventario de componentes de software y sus licencias","Un tipo de bomba","Una red social"],"correcta":0,"porque":"Saber qué llevas dentro es requisito de cumplimiento y de seguridad."}]},{"titulo":"Gestión de proyectos libres (050-055)","contenido":["Un proyecto de software libre es una comunidad con reglas: el README explica qué es y cómo empezar, el CONTRIBUTING cómo colaborar, el código de conducta cómo tratarse, y las issues y pull requests organizan el trabajo a la vista de todos.","Los roles se ganan por mérito: usuario, colaborador ocasional, mantenedor. La transparencia lo gobierna todo: decisiones en público, discusiones archivadas, y el 'fork' como derecho de último recurso: si el rumbo no te gusta, puedes copiar el proyecto y seguir por tu cuenta.","Las herramientas de gestión: tableros (kanban), hitos (milestones), versiones semánticas (1.4.2: mayor.menor.parche) y la regla no escrita más importante: comunicar pronto y con amabilidad. El software libre lo escriben personas, y las personas se cuidan.","Reto: lee el README y las últimas issues de un proyecto libre que te guste. Entender cómo se organiza una comunidad es la lección que no sale en los manuales de código."],"quiz":[{"pregunta":"¿Qué archivo explica cómo colaborar en un proyecto?","opciones":["CONTRIBUTING","LICENSE","README únicamente"],"correcta":0,"porque":"Cada archivo tiene su oficio: README presenta, CONTRIBUTING enseña a ayudar, LICENSE da permiso."},{"pregunta":"¿Qué es el versionado semántico 1.4.2?","opciones":["Mayor.menor.parche: ruptura, función nueva, corrección","Año.mes.día","Un código secreto"],"correcta":0,"porque":"Leer la versión te dice qué tipo de cambio trae: el idioma común de las releases."},{"pregunta":"¿Qué derecho último protege a la comunidad?","opciones":["El fork: copiar el proyecto y continuarlo aparte","El veto","El copyright cerrado"],"correcta":0,"porque":"La libertad de bifurcar disciplina a los mantenedores: el poder está repartido."}]}],"nivel":"avanzado"},{"id":"lpi-lpic1","titulo":"LPIC-1 Administrador (101-102)","icono":"🖥️","lecciones":[{"titulo":"Arquitectura del sistema y arranque (LPIC-101)","contenido":["El administrador LPIC-1 empieza entendiendo la máquina: la BIOS/UEFI arranca el gestor de arranque (GRUB), que carga el núcleo Linux, que a su vez lanza el primer proceso (systemd), que levanta todos los demás servicios. Esa cadena, paso a paso, es lo que se repara cuando un sistema no arranca.","El hardware se declara en archivos virtuales: /proc y /sys muestran procesadores, memoria y dispositivos; lsmod lista los módulos del núcleo cargados; lspci y lsusb enumeran las tarjetas. El sistema se conoce leyendo sus propios archivos.","systemd gobierna el arranque con unidades: systemctl list-units muestra lo activo, systemctl enable/disable decide qué arranca solo, y journalctl lee los registros completos del arranque y los servicios. El administrador moderno habla systemctl con fluidez.","Reto: corre journalctl -b y mira el registro de tu último arranque. Encontrar ahí una línea de error es el primer diagnóstico real."],"quiz":[{"pregunta":"¿Cuál es la cadena de arranque de un PC con Linux?","opciones":["BIOS/UEFI → GRUB → núcleo → systemd → servicios","Núcleo → BIOS → GRUB","GRUB → pantalla"],"correcta":0,"porque":"Cada eslabón carga al siguiente: saber la cadena es saber dónde mirar cuando falla."},{"pregunta":"¿Qué muestra journalctl?","opciones":["Los registros completos del sistema y los servicios","Las fotos","El calendario"],"correcta":0,"porque":"El diario del sistema: la primera parada de cualquier diagnóstico."},{"pregunta":"¿Qué hace systemctl enable sshd?","opciones":["Hace que el servicio arranque solo en cada inicio","Instala ssh","Borra el servicio"],"correcta":0,"porque":"enable marca el arranque automático; start lo arranca ahora: dos gestos distintos."}]},{"titulo":"Instalación y particionado (LPIC-101)","contenido":["Diseñar un disco es decidir particiones: la raíz / con el sistema, /home separada para que reinstalar no borre los datos, swap para memoria de apoyo, y en equipos UEFI una pequeña partición EFI. Las particiones separadas contienen desastres y llenados de disco.","Los sistemas de archivos tienen carácter: ext4 es el estándar fiable, XFS escala a volúmenes enormes, Btrfs y ZFS traen instantáneas y autorreparación. Formatear es mkfs, montar es mount, y /etc/fstab decide qué se monta solo en cada arranque.","El gestor de arranque GRUB vive en los primeros sectores o en la partición EFI, y su menú permite arrancar núcleos antiguos si el nuevo falla. Instalar Linux es, en el fondo: particionar, formatear, copiar sistema, instalar GRUB.","Reto: dibuja el particionado de un portátil de 512 GB para uso diario con datos protegidos. Justifica cada partición en una línea: ese es el ejercicio del examen y de la vida real."],"quiz":[{"pregunta":"¿Por qué separar /home en su propia partición?","opciones":["Para que reinstalar el sistema no borre los datos de los usuarios","Para que vaya más rápido","Por decoración"],"correcta":0,"porque":"Separar contiene los desastres: el sistema se reinstala, los datos sobreviven."},{"pregunta":"¿Qué decide /etc/fstab?","opciones":["Qué se monta automáticamente en cada arranque y dónde","Los usuarios","La hora"],"correcta":0,"porque":"El fstab es la tabla de montaje permanente: un error ahí impide arrancar."},{"pregunta":"¿Para qué sirve la partición EFI?","opciones":["Para guardar los cargadores de arranque en sistemas UEFI","Para fotos","Para swap"],"correcta":0,"porque":"Pequeña pero crítica: sin ella, el arranque UEFI no encuentra a GRUB."}]},{"titulo":"Gestión de paquetes a fondo (LPIC-101)","contenido":["El administrador domina los dos mundos: el .deb (dpkg instala el paquete suelto; apt resuelve dependencias, busca con apt search, muestra con apt show, actualiza todo con apt update && apt upgrade) y el .rpm (rpm para el paquete suelto, dnf para la gestión inteligente).","Los repositorios se declaran en archivos de configuración (/etc/apt/sources.list y similares) y se firman criptográficamente: el sistema verifica que el paquete viene de quien dice. Añadir un repositorio es un acto de confianza que se hace a sabiendas.","Más allá: apt-file encuentra qué paquete trae un archivo, dpkg -L lista lo que instaló un paquete, y los formatos universales (Flatpak, Snap) empaquetan aplicaciones con sus dependencias para cualquier distribución.","Reto: averigua con tu gestor de paquetes qué paquete instaló la orden ls, y lista todos los archivos que trae. La trazabilidad del software empieza ahí."],"quiz":[{"pregunta":"¿Qué diferencia hay entre dpkg y apt?","opciones":["dpkg maneja el paquete suelto; apt resuelve dependencias y repositorios","Son rivales","dpkg es más nuevo"],"correcta":0,"porque":"apt trabaja sobre dpkg: uno instala, el otro piensa."},{"pregunta":"¿Por qué los repositorios van firmados?","opciones":["Para verificar que el paquete viene de la fuente legítima","Por estética","Para ocupar más"],"correcta":0,"porque":"La firma de paquetes es la cadena de custodia del software que instalas."},{"pregunta":"¿Qué hace dpkg -L paquete?","opciones":["Lista todos los archivos que instaló ese paquete","Lo borra","Lo actualiza"],"correcta":0,"porque":"Saber qué puso cada paquete y dónde: la base de la administración limpia."}]},{"titulo":"Comandos GNU y Unix: fluidez total (LPIC-101)","contenido":["El nivel LPIC-1 pide soltura: redirecciones (>, >>, 2> para errores, < para entrada), tuberías en cadena, y el trio de procesadores de texto que todo lo puede: grep filtra líneas, sed las transforma sobre la marcha (sed 's/viejo/nuevo/g'), y awk procesa por columnas.","Los flujos estándar son tres: stdin (entrada), stdout (salida) y stderr (errores). Redirigirlos por separado (orden > resultado.txt 2> errores.txt) separa el trigo de la paja. Y xargs convierte listas en órdenes: find . -name '*.tmp' | xargs rm limpia todo lo encontrado.","El entorno se configura con variables (export EDITOR=nano), los procesos se controlan (jobs, fg, bg, kill, nice, nohup para que sobreviva al cierre de sesión) y los archivos se examinan a fondo: file dice qué son de verdad, wc cuenta, diff compara, tar empaqueta con compresión gzip.","Reto: encuentra todos los archivos .log de tu carpeta personal, cuenta las líneas de cada uno con wc, y guarda el resultado en un informe. Tres órdenes encadenadas: eso es fluidez."],"quiz":[{"pregunta":"¿Qué hace 2> errores.txt?","opciones":["Redirige solo los errores al archivo","Borra los errores","Duplica la salida"],"correcta":0,"porque":"stdout y stderr viajan por canales separados: se pueden separar a voluntad."},{"pregunta":"¿Qué hace sed 's/viejo/nuevo/g'?","opciones":["Sustituye 'viejo' por 'nuevo' en cada línea","Borra archivos viejos","Ordena"],"correcta":0,"porque":"El editor de flujo: transforma texto sin abrirlo, dentro de la tubería."},{"pregunta":"¿Para qué sirve xargs?","opciones":["Para convertir una lista en argumentos de otra orden","Para argumentar","Para cerrar procesos"],"correcta":0,"porque":"find produce nombres; xargs los entrega a rm, cp o lo que necesites."}]},{"titulo":"Shell, scripting y datos (LPIC-102)","contenido":["El scripting LPIC-1 sube el nivel: variables y comillas (dobles expanden $variable, simples no), condiciones con test ([ -f archivo ] ¿existe?, [ $a -gt 5 ] ¿mayor?), bucles for y while, y funciones. Un script serio empieza con #!/bin/bash y valida sus entradas.","La personalización del entorno vive en archivos leídos al entrar: ~/.bashrc para tu shell, ~/.profile para la sesión. Los alias (alias ll='ls -al') ahorran años de tecleo, y el historial (history, Ctrl+R para buscar) es memoria externa gratis.","SQL entra también en el temario: consultas SELECT con WHERE y ORDER BY, INSERT, UPDATE y la prudencia del WHERE en los borrados. El administrador moderno consulta bases de datos casi tan a menudo como archivos.","Reto: escribe un script que reciba un nombre de carpeta y falle con mensaje claro si no existe ([ -d ]). Los scripts que validan son los scripts en los que se confía."],"quiz":[{"pregunta":"¿Qué diferencia hay entre comillas simples y dobles en bash?","opciones":["Las dobles expanden variables; las simples, no","Ninguna","Las simples son más rápidas"],"correcta":0,"porque":"'$HOME' imprime literalmente $HOME; las dobles imprimen tu carpeta: detalle que salva scripts."},{"pregunta":"¿Qué comprueba [ -f archivo ]?","opciones":["Que existe y es un archivo regular","Que está vacío","Que es ejecutable"],"correcta":0,"porque":"Los tests de archivo (-f, -d, -r, -x) son el pan de los condicionales en scripts."},{"pregunta":"¿Para qué sirve Ctrl+R en la terminal?","opciones":["Para buscar hacia atrás en tu historial de órdenes","Para reiniciar","Para copiar"],"correcta":0,"porque":"El historial buscado es el truco que más tiempo ahorra a los administradores."}]},{"titulo":"Administración: usuarios, tiempo y servicios (LPIC-102)","contenido":["La administración diaria: crear y gobernar usuarios (useradd, usermod, /etc/skel con la plantilla de cada cuenta nueva), programar tareas con cron (su sintaxis de cinco campos: minuto hora día mes día-de-semana) y con los temporizadores de systemd.","El tiempo importa: la zona horaria (timedatectl), la sincronización por NTP (los relojes desviados rompen registros, certificados y confianza), y la localización (idioma, formatos) vía variables de locale.","Los servicios esenciales: los registros del sistema (rsyslog y journald: saber leerlos es saber diagnosticar), el correo del sistema, la impresión con CUPS, y los protocolos de red fundamentales: DHCP da direcciones automáticas, DNS traduce nombres (se consulta con dig o host).","Reto: escribe la línea de cron que ejecuta un script de copia cada día a las 3:30 de la madrugada (30 3 * * *). Cron es el mayordomo que nunca duerme."],"quiz":[{"pregunta":"¿Qué significa la línea cron '30 3 * * *'?","opciones":["A las 3:30 de la madrugada, todos los días","Cada 30 minutos","El día 30 a las 3"],"correcta":0,"porque":"Cinco campos: minuto, hora, día del mes, mes, día de la semana."},{"pregunta":"¿Por qué es crítica la sincronización NTP?","opciones":["Porque los relojes desviados rompen registros, certificados y correlación de eventos","Por estética","No lo es"],"correcta":0,"porque":"En seguridad y diagnóstico, la hora exacta es infraestructura."},{"pregunta":"¿Qué hace dig ejemplo.com?","opciones":["Consulta al DNS la traducción del nombre a direcciones","Cava agujeros","Mide la velocidad"],"correcta":0,"porque":"Diagnosticar nombres es el primer paso cuando 'internet no va'."}]},{"titulo":"Redes y seguridad del administrador (LPIC-102)","contenido":["La configuración de red: interfaces con ip, rutas, resolución de nombres (/etc/resolv.conf, /etc/hosts) y diagnóstico escalonado: ¿hay IP? ¿hay puerta de enlace (ip r)? ¿responde (ping)? ¿resuelve el nombre (dig)? Ese orden encuentra cualquier fallo.","La seguridad del sistema se apoya en hábitos: conocer qué escucha (ss -tuln), cerrar lo innecesario, revisar los logs de acceso, y endurecer ssh: claves en lugar de contraseñas, root sin entrada directa, y fail2ban baneando a quien fuerza la puerta.","GPG para cifrar archivos y ssh con su ecosistema (ssh-keygen crea el par, ssh-copy-id lo instala, ~/.ssh/config guarda atajos) son las herramientas diarias. El examen y el puesto de trabajo piden lo mismo: sistemas que funcionen y estén cerrados.","Reto final LPIC-1: monta el flujo completo en tu máquina o virtual: clave ssh generada, acceso por clave funcionando, contraseña de root deshabilitada en ssh y fail2ban activo. Eso es un servidor serio."],"quiz":[{"pregunta":"¿Cuál es el orden sano de diagnóstico de red?","opciones":["IP propia → puerta de enlace → ping externo → DNS","DNS primero","Reiniciar el router siempre"],"correcta":0,"porque":"Diagnosticar por capas, de cerca a lejos, localiza el fallo en minutos."},{"pregunta":"¿Qué endurece el acceso ssh?","opciones":["Claves en vez de contraseñas, root sin acceso directo y fail2ban","Cambiarlo de puerto solamente","Quitar el firewall"],"correcta":0,"porque":"La tríada práctica: claves, no root y castigo al que prueba mil veces."},{"pregunta":"¿Qué hace ssh-copy-id?","opciones":["Instala tu clave pública en el servidor para entrar sin contraseña","Copia archivos","Crea usuarios"],"correcta":0,"porque":"La clave pública viaja al servidor; la privada nunca sale de tu máquina."}]}],"nivel":"avanzado"},{"id":"lpi-devops","titulo":"LPI DevOps Tools (701)","icono":"🚀","lecciones":[{"titulo":"Contenedores: la caja universal (701)","contenido":["El contenedor empaqueta una aplicación con todo lo que necesita (bibliotecas, configuración) compartiendo el núcleo del anfitrión: arranca en milisegundos, pesa megas y funciona igual en el portátil del desarrollador y en producción. 'En mi máquina funcionaba' dejó de ser excusa.","Docker es la herramienta: el Dockerfile describe la imagen paso a paso (FROM una base, COPY tus archivos, RUN instala, CMD define el arranque), docker build la construye y docker run la ejecuta. Las imágenes son inmutables: se versionan y se comparten en registros.","Los contenedores se orquestan: Docker Compose levanta varios servicios juntos con un archivo YAML (web + base de datos + caché), y Kubernetes dirige flotas enteras con autorreparación y escalado. La idea madre: declara el estado deseado y el sistema lo mantiene.","Reto: escribe el Dockerfile mental de una app web sencilla: de qué base parte, qué copia, qué instala, qué orden arranca. Declarar infraestructura como texto es DevOps."],"quiz":[{"pregunta":"¿Qué comparte un contenedor con el anfitrión?","opciones":["El núcleo del sistema operativo","Los archivos personales","La pantalla"],"correcta":0,"porque":"Por eso es ligero: no virtualiza hardware, aísla procesos sobre el mismo kernel."},{"pregunta":"¿Qué es un Dockerfile?","opciones":["La receta en texto que describe cómo construir la imagen","Un pez de Docker","Un archivo comprimido"],"correcta":0,"porque":"Infraestructura como código: la imagen se construye igual mil veces."},{"pregunta":"¿Qué aporta Kubernetes?","opciones":["Orquestar muchos contenedores con autorreparación y escalado","Más velocidad de red","Editar código"],"correcta":0,"porque":"Declaras cuántas copias quieres y el sistema las mantiene vivas."}]},{"titulo":"Nube y despliegue de máquinas (701)","contenido":["La nube se sirve por niveles: IaaS te da máquinas virtuales y redes (tú gestionas lo de dentro), PaaS te da la plataforma lista (tú subes tu código), SaaS es la aplicación entera (solo la usas). Elegir nivel es elegir cuánto quieres administrar.","El almacenamiento de objetos (S3 y similares) guarda archivos como objetos direccionables con metadatos, sin árbol de carpetas: la base de fotos, copias y datos masivos. Las bases de datos se dividen en relacionales (SQL, transacciones) y NoSQL (documentos, clave-valor) según la forma del dato, y las colas de mensajes (RabbitMQ, Kafka) desacoplan servicios que hablan sin esperarse.","Las máquinas se despliegan por imagen y plantilla: en vez de instalar a mano, se clona una imagen probada. La infraestructura se vuelve ganado, no mascota: si una máquina falla, se reemplaza, no se llora.","Reto: clasifica tres servicios que uses a diario (correo web, un hosting, una máquina virtual alquilada) en SaaS, PaaS o IaaS. Ver los niveles es ver el negocio de la nube."],"quiz":[{"pregunta":"¿Qué te da IaaS que no te da SaaS?","opciones":["La máquina virtual: tú gestionas sistema y aplicación","La aplicación terminada","El correo"],"correcta":0,"porque":"IaaS = infraestructura; PaaS = plataforma; SaaS = aplicación. Cada nivel cede más control."},{"pregunta":"¿Qué es el almacenamiento de objetos?","opciones":["Archivos como objetos direccionables con metadatos, sin carpetas","Un armario","Una base relacional"],"correcta":0,"porque":"Escalable y sencillo: el estándar de facto para datos masivos en la nube."},{"pregunta":"¿Para qué sirven las colas de mensajes?","opciones":["Para que servicios hablen sin esperarse: desacoplo y resistencia","Para hacer cola en el banco","Para enviar SMS"],"correcta":0,"porque":"El productor deja el mensaje y sigue; el consumidor lo recoge cuando puede."}]},{"titulo":"Integración y entrega continuas: CI/CD (701)","contenido":["CI/CD es la fábrica automática del software: cada cambio empujado al repositorio dispara una cadena — se compila, se ejecutan las pruebas, se analiza la calidad, se construye el artefacto (imagen o paquete) y, si todo pasa, se despliega. Lo que antes era un ritual mensual aterrador pasa varias veces al día sin dolor.","La confianza viene de las pruebas automáticas: unitarias (cada función), de integración (las piezas juntas) y de aceptación (lo que el usuario ve). Una cadena con buenas pruebas permite desplegar un viernes sin sudar; sin ellas, cada entrega es un salto al vacío.","Las prácticas asociadas: ramas cortas que se integran pronto (trunk-based), despliegues graduales (a un 5% de usuarios primero: canary), y la capacidad de volver atrás en minutos. La velocidad segura es el producto de la automatización.","Reto: dibuja la cadena CI/CD de un proyecto tuyo: qué pasa desde que escribes código hasta que lo usa alguien. Detectar los pasos manuales es detectar el trabajo del mañana."],"quiz":[{"pregunta":"¿Qué dispara una cadena de CI/CD?","opciones":["Cada cambio empujado al repositorio","La luna llena","Una llamada telefónica"],"correcta":0,"porque":"Automatizar desde el commit: integrar pronto y a menudo evita el infierno de fusiones."},{"pregunta":"¿Qué son los despliegues canary?","opciones":["Soltar la versión nueva a un pequeño porcentaje de usuarios primero","Desplegar con canarios","No desplegar"],"correcta":0,"porque":"Si algo falla, falla para pocos: riesgo acotado, aprendizaje rápido."},{"pregunta":"¿Qué permite volver atrás en minutos?","opciones":["Los artefactos versionados y despliegues reproducibles","La suerte","Los lunes"],"correcta":0,"porque":"El rollback rápido convierte errores en anécdotas: es diseño, no heroísmo."}]},{"titulo":"Gestión de configuración y monitorización (701)","contenido":["Configurar servidores a mano no escala: la gestión de configuración (Ansible es el favorito por no necesitar agentes) describe el estado deseado en playbooks YAML ('este paquete instalado, este archivo así, este servicio activo') y lo aplica a cientos de máquinas de una vez, de forma idempotente: aplicarlo dos veces deja el mismo estado.","La infraestructura como código (Terraform y amigos) declara también la nube: redes, máquinas y permisos en archivos versionados. La infraestructura pasa a tener historia de git, revisiones y rollbacks, como el software que es.","Monitorizar es preguntar al sistema cómo está: métricas (Prometheus las recolecta, Grafana las dibuja), registros centralizados, y alertas que avisan antes de que el usuario llame. La regla de oro: monitoriza lo que le duele al usuario, no todo lo medible.","Reto final de la materia: escribe en YAML imaginario el estado deseado de un servidor tuyo: paquetes, archivos de configuración y servicios. Pensar en estados deseados en vez de pasos es el salto DevOps."],"quiz":[{"pregunta":"¿Qué significa que Ansible es idempotente?","opciones":["Que aplicarlo dos veces deja el mismo estado","Que es muy lento","Que no falla nunca"],"correcta":0,"porque":"Describes el destino, no el camino: la herramienta solo cambia lo que difiere."},{"pregunta":"¿Qué aporta la infraestructura como código?","opciones":["Historia de cambios, revisión y reproducción exacta","Más reuniones","Servidores gratis"],"correcta":0,"porque":"La infraestructura en git se audita, se revisa y se reconstruye como el software."},{"pregunta":"¿Qué regla sigue una buena monitorización?","opciones":["Medir lo que afecta al usuario, no todo lo medible","Medirlo todo siempre","No medir nada"],"correcta":0,"porque":"Las alertas deben exigir acción: si una alerta no pide actuar, es ruido."}]}],"nivel":"avanzado"}];

/* ═══════════════════════════════════════════════════════════
   INFORMÁTICA — el programa

   Se expone como window.Profesor para poder montarlo dentro de otro
   asistente sin tocar nada:

       Profesor.montar(document.getElementById("mi-hueco"), {
         quien: "ana",            // con quién va el avance
         rol: "peque",            // "peque" filtra materias (ver abajo)
         guardar: async (avance) => { ... },   // opcional
         leer:    async ()       => ({ ... }), // opcional
       });

   Si no se le pasan `guardar` y `leer`, usa el almacén del navegador.
   Así funciona solo, y encaja con un servidor el día que haga falta.
   ═══════════════════════════════════════════════════════════ */
(function (global) {
  "use strict";

  const NIVELES = { basico: "Básico", medio: "Medio", avanzado: "Avanzado" };
  const LLAVE = "informatica:avance:";

  // ——— dónde se guarda el avance ———
  // El almacén del navegador puede fallar (ventana privada, permisos,
  // datos borrados). Si falla no se pierde la lección: se sigue en
  // memoria y ya está. Perder el avance es molesto; que reviente la
  // pantalla a media lección es peor.
  const enMemoria = {};
  function leerLocal(quien) {
    try {
      const t = localStorage.getItem(LLAVE + quien);
      return t ? JSON.parse(t) : (enMemoria[quien] || {});
    } catch (e) { return enMemoria[quien] || {}; }
  }
  function guardarLocal(quien, datos) {
    enMemoria[quien] = datos;
    try { localStorage.setItem(LLAVE + quien, JSON.stringify(datos)); }
    catch (e) { /* en memoria se queda, y la lección no se pierde */ }
  }

  function quienesHay() {
    const fuera = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(LLAVE)) fuera.push(k.slice(LLAVE.length));
      }
    } catch (e) { /* sin almacén, se empieza de cero */ }
    for (const k of Object.keys(enMemoria)) if (!fuera.includes(k)) fuera.push(k);
    return fuera.sort();
  }

  /* ——— qué materias ve cada cual ———
     A un peque no le salen LPIC-1 ni Ciberseguridad avanzada: se ahoga
     la lista y no encuentra lo suyo. Y tampoco las materias marcadas
     como de adultos, que es una cosa DISTINTA del nivel: «Sexualidad y
     bienestar» está escrita con lenguaje sencillo, pero no va en la
     pantalla de un niño de ocho años. Mezclar las dos cosas es lo que
     la dejaba ahí. */
  function materiasDe(rol, temario) {
    if (rol === "peque") {
      return temario.filter(m => m.nivel === "basico" && !m.adultos);
    }
    return temario;
  }

  // El orden en que se enseñan los niveles. Sin esto salen como estén
  // escritos en el temario, y «avanzado» aparece antes que «básico».
  const ORDEN = { basico: 0, medio: 1, avanzado: 2 };

  function crear(etiqueta, clase, texto) {
    const e = document.createElement(etiqueta);
    if (clase) e.className = clase;
    if (texto != null) e.textContent = texto;
    return e;
  }

  function Profesor(hueco, opciones) {
    const op = opciones || {};
    // Ojo con esto: el temario se declara con `const TEMARIO = [...]`, y
    // un const del ámbito global NO se cuelga de window. Buscarlo como
    // global.TEMARIO daba una lista vacía y la pantalla salía con el
    // aviso de «no encuentro el temario» aunque estuviera dos líneas
    // más arriba en el mismo archivo. Con typeof se ve de las dos
    // formas: como const y como propiedad de window.
    const temario = op.temario ||
      (typeof TEMARIO !== "undefined" ? TEMARIO : (global.TEMARIO || []));
    let quien = op.quien || "yo";
    let rol = op.rol || "adulto";
    let avance = {};

    const leerAvance = op.leer || (async () => leerLocal(quien));
    const guardarAvance = op.guardar || (async (d) => guardarLocal(quien, d));

    // Los tres trozos de pantalla que este módulo gobierna. Cuando va
    // suelto son los de la página; incrustado, se los fabrica.
    const cuerpo = op.cuerpo || document.getElementById("cuerpo") || hueco;
    const elTitulo = op.titulo || document.getElementById("titulo");
    const elAvance = op.avance || document.getElementById("avance");
    const elAtras = op.atras || document.getElementById("atras");

    let volverA = null;              // qué hace el botón de atrás ahora

    function ponerAtras(fn, texto) {
      volverA = fn;
      if (!elAtras) return;
      elAtras.hidden = !fn;
      elAtras.title = texto || "Atrás";
    }
    if (elAtras) elAtras.addEventListener("click", () => { if (volverA) volverA(); });

    function ponerTitulo(t) { if (elTitulo) elTitulo.textContent = t; }
    function ponerAvance(t) { if (elAvance) elAvance.textContent = t || ""; }

    function hecha(materiaId, i) {
      const v = avance[materiaId + ":" + i];
      return !!(v && v.hecha);
    }

    /* ——————————————————— quién estudia ——————————————————— */
    function pintarQuien() {
      cuerpo.replaceChildren();
      ponerTitulo("Cultura general");
      ponerAvance("");
      ponerAtras(null);

      const caja = crear("div", "tarjeta");
      caja.appendChild(crear("div", "tarjeta-titulo", "¿Quién estudia?"));
      caja.appendChild(crear("p", "parrafo",
        "Lo que aprende cada uno es suyo: el avance se guarda por " +
        "persona y no se mezcla."));

      const fila = crear("div", "quien");
      const sel = crear("select");
      const hay = quienesHay();
      for (const n of hay) {
        const o = crear("option", null, n); o.value = n; sel.appendChild(o);
      }
      const nuevo = crear("option", null, "— alguien nuevo —");
      nuevo.value = "\u0000nuevo";
      sel.appendChild(nuevo);
      sel.value = hay.includes(quien) ? quien : (hay[0] || "\u0000nuevo");

      const nombre = crear("input");
      nombre.placeholder = "Nombre";
      nombre.hidden = sel.value !== "\u0000nuevo";
      sel.addEventListener("change", () => { nombre.hidden = sel.value !== "\u0000nuevo"; });

      const rolSel = crear("select");
      for (const [v, t] of [["adulto", "Adulto: todo el temario"],
                            ["peque", "Peque: solo lo básico"]]) {
        const o = crear("option", null, t); o.value = v; rolSel.appendChild(o);
      }
      rolSel.value = rol;

      const entrar = crear("button", "btn principal", "Empezar");
      entrar.type = "button";
      entrar.addEventListener("click", async () => {
        const n = sel.value === "\u0000nuevo"
          ? (nombre.value.trim() || "yo") : sel.value;
        quien = n; rol = rolSel.value;
        avance = (await leerAvance(quien)) || {};
        pintarMaterias();
      });

      fila.appendChild(sel); fila.appendChild(nombre);
      fila.appendChild(rolSel); fila.appendChild(entrar);
      caja.appendChild(fila);
      cuerpo.appendChild(caja);
    }

    /* ——————————————————— las materias ——————————————————— */
    function pintarMaterias() {
      cuerpo.replaceChildren();
      cuerpo.scrollTop = 0;
      ponerTitulo("🎓 " + quien);
      ponerAtras(op.quien ? null : pintarQuien, "Cambiar de persona");

      const lista = materiasDe(rol, temario).slice()
        .sort((a, b) => (ORDEN[a.nivel] ?? 9) - (ORDEN[b.nivel] ?? 9));

      let hechas = 0, total = 0;
      for (const m of lista) {
        m.lecciones.forEach((_, i) => { total++; if (hecha(m.id, i)) hechas++; });
      }
      ponerAvance(hechas + " de " + total + " lecciones");

      let nivelActual = "";
      for (const m of lista) {
        if (m.nivel !== nivelActual) {
          nivelActual = m.nivel;
          cuerpo.appendChild(crear("div", "sub", NIVELES[m.nivel] || m.nivel));
        }
        const n = m.lecciones.filter((_, i) => hecha(m.id, i)).length;

        const tarjeta = crear("button", "fila");
        tarjeta.type = "button";
        const izq = crear("div");
        izq.style.flex = "1";
        izq.appendChild(crear("div", "fila-titulo",
          (m.icono ? m.icono + " " : "") + m.titulo));
        const barra = crear("div", "barra-avance");
        const relleno = crear("i");
        relleno.style.width = Math.round(100 * n / m.lecciones.length) + "%";
        barra.appendChild(relleno);
        izq.appendChild(barra);

        const cuenta = crear("div", "fila-sub", n + "/" + m.lecciones.length);
        if (n === m.lecciones.length) cuenta.style.color = "var(--verde)";

        tarjeta.appendChild(izq); tarjeta.appendChild(cuenta);
        tarjeta.addEventListener("click", () => pintarLecciones(m));
        cuerpo.appendChild(tarjeta);
      }
    }

    /* ——————————————————— las lecciones ——————————————————— */
    function pintarLecciones(materia) {
      cuerpo.replaceChildren();
      cuerpo.scrollTop = 0;
      ponerTitulo((materia.icono ? materia.icono + " " : "") + materia.titulo);
      ponerAtras(pintarMaterias, "Materias");
      const n = materia.lecciones.filter((_, i) => hecha(materia.id, i)).length;
      ponerAvance(n + " de " + materia.lecciones.length);

      materia.lecciones.forEach((l, i) => {
        const f = crear("button", "fila");
        f.type = "button";
        const marca = crear("span", null, hecha(materia.id, i) ? "✓" : "•");
        marca.style.cssText = "width:18px;flex:0 0 18px;color:" +
          (hecha(materia.id, i) ? "var(--verde)" : "var(--tinta-suave)");
        const t = crear("div", "fila-titulo", l.titulo);
        t.style.flex = "1";
        f.appendChild(marca); f.appendChild(t);
        const v = avance[materia.id + ":" + i];
        if (v && v.total) f.appendChild(crear("div", "fila-sub", v.aciertos + "/" + v.total));
        f.addEventListener("click", () => pintarLeccion(materia, i));
        cuerpo.appendChild(f);
      });
    }

    /* ——————————————————— una lección ——————————————————— */
    function pintarLeccion(materia, indice) {
      const l = materia.lecciones[indice];
      cuerpo.replaceChildren();
      cuerpo.scrollTop = 0;
      ponerTitulo(l.titulo);
      ponerAtras(() => pintarLecciones(materia), materia.titulo);
      ponerAvance("Lección " + (indice + 1) + " de " + materia.lecciones.length);

      const caja = crear("div", "tarjeta");
      caja.appendChild(crear("div", "tarjeta-titulo", l.titulo));
      for (const parrafo of (l.contenido || [])) {
        // textContent y no innerHTML: el temario es texto, no HTML. Si
        // una lección lleva un < o un &, así se lee como se escribió y
        // no se cuela nada raro en la página.
        caja.appendChild(crear("p", "parrafo", parrafo));
      }
      cuerpo.appendChild(caja);

      const pie = crear("div", "fin");
      const imprimir = crear("button", "btn", "🖨 Imprimir");
      imprimir.type = "button";
      imprimir.addEventListener("click", () => global.print());
      pie.appendChild(imprimir);

      if (!(l.quiz || []).length) {
        const b = crear("button", "btn principal", "✓ Leída");
        b.type = "button";
        b.addEventListener("click", () => terminar(materia, indice, 0, 0));
        pie.appendChild(b);
        cuerpo.appendChild(pie);
        return;
      }
      cuerpo.appendChild(pie);
      pintarPregunta(materia, indice, 0, 0);
    }

    /* ——————————————————— el quiz ——————————————————— */
    function pintarPregunta(materia, indice, numero, aciertos) {
      const l = materia.lecciones[indice];
      const q = l.quiz[numero];

      const viejo = document.getElementById("quiz");
      if (viejo) viejo.remove();
      const caja = crear("div", "tarjeta");
      caja.id = "quiz";
      caja.style.marginTop = "12px";

      caja.appendChild(crear("div", "fila-sub",
        "Pregunta " + (numero + 1) + " de " + l.quiz.length));
      const t = crear("div", "fila-titulo", q.pregunta);
      t.style.margin = "8px 0 12px";
      caja.appendChild(t);

      q.opciones.forEach((texto, i) => {
        const b = crear("button", "opcion", texto);
        b.type = "button";
        b.addEventListener("click", () => {
          // Al responder se bloquean todas: sin esto se puede pulsar la
          // siguiente antes de leer por qué falló, que es justo lo
          // único que enseña de una respuesta mal.
          for (const otra of caja.querySelectorAll(".opcion")) otra.disabled = true;
          const bien = i === q.correcta;
          b.classList.add(bien ? "bien" : "mal");
          if (!bien) caja.querySelectorAll(".opcion")[q.correcta].classList.add("bien");

          caja.appendChild(crear("div", "porque",
            (bien ? "✓ " : "✗ ") + (q.porque || "")));

          const ultima = numero + 1 >= l.quiz.length;
          const seguir = crear("button", "btn principal",
            ultima ? "Terminar" : "Siguiente →");
          seguir.type = "button";
          seguir.style.marginTop = "12px";
          seguir.addEventListener("click", () => {
            const suma = aciertos + (bien ? 1 : 0);
            if (ultima) terminar(materia, indice, suma, l.quiz.length);
            else pintarPregunta(materia, indice, numero + 1, suma);
          });
          caja.appendChild(seguir);
          seguir.scrollIntoView({ block: "nearest", behavior: "smooth" });
        });
        caja.appendChild(b);
      });
      cuerpo.appendChild(caja);
    }

    /* ——————————————————— apuntar lo hecho ——————————————————— */
    async function terminar(materia, indice, aciertos, total) {
      const clave = materia.id + ":" + indice;
      const antes = avance[clave] || {};
      // Se queda el MEJOR resultado, no el último: repasar una lección
      // y fallar no debería borrar que la aprobaste.
      avance[clave] = {
        hecha: true,
        aciertos: Math.max(Number(antes.aciertos) || 0, aciertos),
        total: total,
        veces: (Number(antes.veces) || 0) + 1,
        fecha: new Date().toISOString().slice(0, 10),
      };
      try { await guardarAvance(avance, { materia: materia.id, indice, aciertos, total }); }
      catch (e) { /* la lección ya está contada en memoria: no se pierde */ }

      cuerpo.replaceChildren();
      cuerpo.scrollTop = 0;
      ponerAtras(() => pintarLecciones(materia), materia.titulo);

      const caja = crear("div", "tarjeta");
      caja.appendChild(crear("div", "tarjeta-titulo",
        total ? "Lección terminada" : "Lección leída"));
      if (total) {
        const r = crear("div", "numerote", aciertos + " de " + total);
        r.style.color = aciertos === total ? "var(--verde)" : "var(--ambar)";
        caja.appendChild(r);
        caja.appendChild(crear("div", "fila-sub",
          aciertos === total ? "Entera. A la siguiente."
            : aciertos * 2 >= total ? "Bien. Repásala y sale redonda."
              : "Léela otra vez sin prisa; luego se ve clara."));
      }
      cuerpo.appendChild(caja);

      const pie = crear("div", "fin");
      const hay = indice + 1 < materia.lecciones.length;
      if (hay) {
        const sig = crear("button", "btn principal", "Siguiente lección →");
        sig.type = "button";
        sig.addEventListener("click", () => pintarLeccion(materia, indice + 1));
        pie.appendChild(sig);
      }
      const rep = crear("button", "btn", "Repetir");
      rep.type = "button";
      rep.addEventListener("click", () => pintarLeccion(materia, indice));
      pie.appendChild(rep);
      const lista = crear("button", "btn", "← " + materia.titulo);
      lista.type = "button";
      lista.addEventListener("click", () => pintarLecciones(materia));
      pie.appendChild(lista);
      cuerpo.appendChild(pie);
    }

    /* ——————————————————— arrancar ——————————————————— */
    (async function () {
      if (!temario.length) {
        cuerpo.replaceChildren();
        cuerpo.appendChild(crear("div", "aviso",
          "No encuentro el temario. Si lo has separado en otro archivo, " +
          "cárgalo antes que este."));
        return;
      }
      // Si el que llama ya sabe quién estudia (porque lo eligió en su
      // propia pantalla de familia), no se le vuelve a preguntar.
      if (op.quien) {
        avance = (await leerAvance(quien)) || {};
        pintarMaterias();
      } else {
        pintarQuien();
      }
    })();

    return {
      materias: pintarMaterias,
      leccion: pintarLeccion,
      get quien() { return quien; },
      get avance() { return avance; },
    };
  }

  global.Profesor = {
    montar: Profesor,
    // Para contar sin abrir nada: cuántas materias, lecciones y
    // preguntas hay. Útil para enseñarlo en la pantalla de inicio.
    resumen: function (temario) {
      const t = temario ||
        (typeof TEMARIO !== "undefined" ? TEMARIO : (global.TEMARIO || []));
      let lecciones = 0, preguntas = 0;
      for (const m of t) {
        lecciones += m.lecciones.length;
        for (const l of m.lecciones) preguntas += (l.quiz || []).length;
      }
      return { materias: t.length, lecciones, preguntas };
    },
  };
})(window);

/* ——— arrancarlo cuando va suelto ———

   de otro asistente, eres tú quien decide cuándo montarlo y con quién.
   Por eso la llamada está aquí abajo y no dentro de Profesor. */
Profesor.montar(document.getElementById("cuerpo"));
