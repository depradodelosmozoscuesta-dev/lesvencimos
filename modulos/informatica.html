<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1017">
<title>Asistente Informática — Les vencimos</title>
<style>
/* ═══════════════════════════════════════════════════════════
   INFORMÁTICA — 14 materias · 108 lecciones · 324 preguntas

   Un archivo y nada más. Se abre con doble clic, funciona sin
   internet y sin servidor, y el avance se guarda en el propio
   navegador. Para meterlo en otro asistente hay dos maneras, las
   dos explicadas al final del archivo:
     · un <iframe src="Profesor.html">  — cero integración,
     · o copiar el <script> y llamar a Profesor.montar(...).

   El temario va INCRUSTADO aquí dentro, no en un archivo aparte.
   Es medio mega y tiene su precio, pero Chrome en Android bloquea
   la carga de guiones entre archivos cuando se abre con file://:
   si el temario fuera aparte, en la tablet no cargaría NADA y la
   pantalla saldría vacía sin decir por qué.
   ═══════════════════════════════════════════════════════════ */

:root{
  --fondo:#0E0E0C; --fondo-2:#161512; --panel:#1C1A16; --panel-claro:#2a2620;
  --tinta:#E6E1D6; --tinta-suave:#C9C2B4;
  --acento:#C4A15A; --ambar:#C4A15A; --verde:#8F9A72; --rojo:#C46A4A;
  --sombra:0 10px 26px rgba(0,0,0,.35);
}
/* Modo claro: se respeta lo que tenga puesto el aparato. El asistente
   de Morgan lleva el suyo en un atributo, y aquí se acepta el mismo
   nombre para que herede solo si se incrusta. */
@media (prefers-color-scheme: light){
  :root:not([data-tema="oscuro"]){
    --fondo:#dde3ea; --fondo-2:#d3dae2; --panel:#fff; --panel-claro:#c3ccd6;
    --tinta:#12212e; --tinta-suave:#55697c;
    --acento:#0e7490; --ambar:#b45309; --verde:#047857; --rojo:#be123c;
    --sombra:0 8px 20px rgba(60,75,90,.18);
  }
}
:root[data-tema="claro"]{
  --fondo:#dde3ea; --fondo-2:#d3dae2; --panel:#fff; --panel-claro:#c3ccd6;
  --tinta:#12212e; --tinta-suave:#55697c;
  --acento:#0e7490; --ambar:#b45309; --verde:#047857; --rojo:#be123c;
  --sombra:0 8px 20px rgba(60,75,90,.18);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--fondo); color:var(--tinta);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.5;
  display:flex; flex-direction:column;
}

/* ——— la barra de arriba ——— */
.barra{
  flex:0 0 auto; display:flex; align-items:center; gap:10px;
  padding:10px 14px; background:var(--fondo-2);
  border-bottom:1px solid var(--panel-claro);
}
.barra h1{
  font-size:1.05rem; margin:0; font-weight:700; flex:1 1 auto;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.avance{ font-size:.8rem; color:var(--tinta-suave); white-space:nowrap }

.btn{
  font:inherit; font-size:.86rem; font-weight:600; cursor:pointer;
  min-height:40px; padding:0 14px; border-radius:11px;
  border:1px solid var(--panel-claro); background:var(--panel);
  color:var(--tinta); white-space:nowrap;
}
.btn:hover{ border-color:var(--acento) }
.btn.principal{ background:var(--acento); border-color:var(--acento); color:#1A160E }
.btn.suave{ background:transparent; color:var(--tinta-suave) }

/* ——— el cuerpo ——— */
.cuerpo{
  flex:1 1 auto; overflow-y:auto; padding:14px;
  max-width:760px; width:100%; margin:0 auto;
}
.sub{
  font-size:.74rem; color:var(--tinta-suave); font-weight:700;
  letter-spacing:.06em; text-transform:uppercase; margin:18px 0 8px;
}
.sub:first-child{ margin-top:0 }

.fila{
  display:flex; align-items:center; gap:12px;
  padding:12px 14px; margin-bottom:8px;
  background:var(--panel); border:1px solid var(--panel-claro);
  border-radius:14px; cursor:pointer; text-align:left; width:100%;
  font:inherit; color:var(--tinta);
}
.fila:hover{ border-color:var(--acento) }
.fila-titulo{ font-weight:600; font-size:.95rem }
.fila-sub{ font-size:.8rem; color:var(--tinta-suave) }

.barra-avance{
  height:5px; margin-top:6px; border-radius:3px;
  background:rgba(128,128,128,.22); overflow:hidden;
}
.barra-avance > i{
  display:block; height:100%; border-radius:3px;
  background:var(--verde); transition:width .3s ease;
}

.tarjeta{
  background:var(--panel); border:1px solid var(--panel-claro);
  border-radius:16px; padding:16px; box-shadow:var(--sombra);
}
.tarjeta-titulo{ font-size:1.1rem; font-weight:700; margin:0 0 4px; color:var(--tinta) }
.parrafo{ margin:10px 0; line-height:1.65; font-size:.95rem; color:var(--tinta) }
.numerote{ font-size:2.2rem; font-weight:800; margin:8px 0; line-height:1 }

/* Las opciones del quiz: de dedo, y anchas para que se lean de un
   vistazo. En una tablet de cocina se responde con el pulgar. */
.opcion{
  display:block; width:100%; text-align:left;
  min-height:48px; padding:12px 14px; margin-top:8px;
  border:1px solid var(--panel-claro); border-radius:12px;
  background:rgba(128,128,128,.07); color:var(--tinta);
  font:inherit; font-size:.95rem; cursor:pointer;
  transition:background .15s ease, border-color .15s ease;
}
.opcion:hover:not(:disabled){ background:rgba(128,128,128,.16) }
.opcion:disabled{ cursor:default; opacity:.75 }
/* La correcta SIEMPRE se marca en verde, se acierte o no: hay que ver
   cuál era, no solo que fallaste. */
.opcion.bien{
  border-color:var(--verde); opacity:1; color:var(--verde); font-weight:600;
  background:color-mix(in srgb, var(--verde) 16%, transparent);
}
.opcion.mal{
  border-color:var(--rojo); color:var(--rojo);
  background:color-mix(in srgb, var(--rojo) 14%, transparent);
}
@supports not (color: color-mix(in srgb, red 10%, transparent)){
  .opcion.bien, .opcion.mal{ background:rgba(128,128,128,.16) }
}

/* El porqué de la respuesta: esto es lo que enseña. */
.porque{
  margin-top:12px; padding:10px 12px; border-radius:10px;
  background:rgba(128,128,128,.10); border-left:3px solid var(--acento);
  font-size:.9rem; line-height:1.55; color:var(--tinta-suave);
}

.fin{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px }
.aviso{
  font-size:.82rem; color:var(--tinta-suave); margin-top:14px;
  padding:10px 12px; border-radius:10px; background:rgba(128,128,128,.08);
}

/* ——— quién estudia ——— */
.quien{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:6px }
.quien select, .quien input{
  font:inherit; font-size:.9rem; min-height:40px; padding:0 10px;
  border-radius:11px; border:1px solid var(--panel-claro);
  background:var(--panel); color:var(--tinta);
}

/* ——— imprimir una lección ——— */
@media print{
  .barra, .btn, .opcion, .fin, .aviso, .quien{ display:none !important }
  body, .cuerpo, .tarjeta{
    background:#fff !important; color:#000 !important;
    box-shadow:none !important; border:0 !important;
    max-width:none; overflow:visible; height:auto;
  }
  .porque{ border-left:3px solid #999; color:#333 }
}

@media (prefers-reduced-motion: reduce){
  .barra-avance > i, .opcion{ transition:none }
}
</style>
</head>
<body>
  <div class="barra">
    <button type="button" class="btn suave" id="atras" hidden>←</button>
    <h1 id="titulo">Informática</h1>
    <span class="avance" id="avance"></span>
  </div>
  <div class="cuerpo" id="cuerpo"></div>

<script>
// ============================================================
//  EL TEMARIO — 37 materias, 269 lecciones, 807 preguntas.
//
//  Va en archivo APARTE a propósito: son cientos de KB y meterlos dentro
//  de index.html los haría descargar en CADA carga de página, mirases la
//  agenda o la compra. Aquí se carga solo al abrir Enseñanza, y una vez.
//
//  Formato de cada materia:
//    { id, titulo, icono, nivel, adultos?, lecciones: [...] }
//  Y de cada lección:
//    { titulo, contenido: [párrafos], quiz: [{pregunta, opciones, correcta, porque}] }
//
//  `nivel` dice cuánta BASE hace falta: basico / medio / avanzado.
//  `adultos` es otra cosa: materias que NO deben salir en el perfil de
//  un menor aunque el texto sea sencillo. Mezclar las dos cosas dejaba
//  «Sexualidad y bienestar» en la lista de un niño de ocho años.
//
//  El 'porque' de cada respuesta es lo que separa enseñar de examinar:
//  no basta con decir que está mal, hay que decir por qué.
//
//  Para añadir lecciones se edita ESTE archivo y nada más.
// ============================================================
const TEMARIO = [{"id":"cuba-central","titulo":"Central de la casa (Cuba)","icono":"🏠","lecciones":[{"titulo":"Bienvenida a la central","contenido":["Este ordenador es la central de la casa. Funciona sin internet y con la batería de la alarma, así que puedes estudiar aunque se vaya la luz.","Desde la página de inicio llegas a todo: Profesor (ejercicios con pistas), Cursos (lecciones ordenadas), Biblioteca (Wikipedia, Vikidia, libros y diccionario), Khan Academy (vídeos y ejercicios), Preguntar (una inteligencia artificial paciente) y Alarma del barrio (qué casas están armadas y si ha pasado algo).","Para seguir un curso: entra en Cursos, elige uno, lee con calma y, si hay comandos, escríbelos tú en vez de copiar y pegar. Al terminar pulsa Marcar como hecha y verás una marca en el índice; luego pulsa Siguiente.","Consejo práctico: una lección al día aprovecha más que cinco de golpe. La central está pensada para avanzar despacio y seguro, sin depender de la red."],"quiz":[{"pregunta":"¿Qué pasa si se va la luz mientras usas la central?","opciones":["Se apaga todo y no puedes estudiar","Puedes seguir estudiando gracias a la batería de la alarma","Solo funciona si hay internet"],"correcta":1,"porque":"La central usa la batería de la alarma y no necesita internet para las lecciones locales."},{"pregunta":"Si un curso pide comandos, ¿qué conviene hacer?","opciones":["Copiarlos y pegarlos para ir más rápido","Escribirlos tú mismo para aprenderlos","Saltarte esa parte"],"correcta":1,"porque":"Escribir las órdenes a mano fija el aprendizaje; copiar y pegar no enseña igual."},{"pregunta":"¿Dónde encuentras Wikipedia y libros sin salir de la casa?","opciones":["En Biblioteca","Solo en internet externo","En la alarma del barrio"],"correcta":0,"porque":"La Biblioteca reúne Wikipedia, Vikidia, libros y diccionario en la propia central."}]},{"titulo":"Cuentas y energía","contenido":["Hay dos tipos de cuenta. La cuenta estudiante es la de todos los días: puedes estudiar y practicar, pero no puedes romper el sistema. La cuenta de administrador es solo para quien cuida la central: sirve para instalar cosas y arreglar problemas.","Si cada persona usa su propia cuenta, cada una guarda su propio progreso en los cursos y no se mezclan los avances.","La batería se comparte con la alarma. La central gasta bastante más que la alarma, así que conviene apagarla cuando termines (menú → Apagar). No la desenchufes a lo bruto: se pueden estropear los archivos.","Cuando haya corriente o sol, aprovecha para usarla más. La alarma sigue funcionando aunque la central esté apagada: son aparatos distintos."],"quiz":[{"pregunta":"¿Para qué sirve la cuenta estudiante?","opciones":["Para instalar programas del sistema","Para estudiar y practicar sin poder romper el sistema","Solo para apagar la central"],"correcta":1,"porque":"Estudiante es la cuenta diaria: permite aprender con límites de seguridad."},{"pregunta":"¿Cómo debes apagar la central al terminar?","opciones":["Desenchufarla de golpe","Usar menú → Apagar","Dejarla encendida siempre"],"correcta":1,"porque":"Apagar bien desde el menú protege los archivos; arrancar el cable puede dañarlos."},{"pregunta":"Si apagas la central, ¿la alarma deja de funcionar?","opciones":["Sí, todo se para","No: la alarma sigue, son aparatos distintos","Solo si no hay sol"],"correcta":1,"porque":"Central y alarma son equipos distintos; la alarma puede seguir armada con la central apagada."}]},{"titulo":"Normas de la casa digital","contenido":["Tu contraseña es tuya. No la digas, ni siquiera a amigos. Quien conoce tu clave puede entrar en tu cuenta y en tu progreso.","La inteligencia artificial puede equivocarse. Si algo es importante —salud, dinero o un examen—, compruébalo en la Biblioteca o pregunta a una persona que sepa. La IA no da dosis de medicinas: eso lo decide un médico o un farmacéutico.","La ciberseguridad se practica solo en casa. Todo lo que aprendas de redes y seguridad pruébalo únicamente en esta central o en equipos tuyos. Entrar o escanear equipos o redes de otros es un delito.","Si algo falla, no pasa nada. Apunta qué estabas haciendo y avisa a quien cuida la central. Equivocarse forma parte de aprender; esconder el fallo lo empeora."],"quiz":[{"pregunta":"¿Puedes compartir tu contraseña con un amigo de confianza?","opciones":["Sí, si es de la casa","No: la contraseña es solo tuya","Solo la de administrador"],"correcta":1,"porque":"La norma es clara: la contraseña no se dice a nadie, ni a amigos."},{"pregunta":"Si la IA te sugiere una dosis de medicina, ¿qué haces?","opciones":["La tomas tal cual","No: dosis las decide un médico o farmacéutico","La duplicas por si acaso"],"correcta":1,"porque":"La IA no prescribe medicinas; la dosis es decisión sanitaria profesional."},{"pregunta":"¿Dónde puedes practicar lo aprendido de redes y seguridad?","opciones":["En cualquier red del barrio","Solo en esta central o en equipos tuyos","En el móvil de un vecino sin avisar"],"correcta":1,"porque":"Probar en equipos ajenos sin permiso es delito; la práctica queda en casa."}]}]},{"id":"algoritmos","titulo":"Algoritmos","icono":"⚙️","lecciones":[{"titulo":"Qué es un algoritmo","contenido":["Un algoritmo es una receta exacta: una lista de pasos tan claros que hasta una máquina tonta puede seguirlos, y que siempre terminan. Hacer tortilla es un algoritmo; «cocinar rico» no lo es.","La palabra viene de Al-Juarismi, el sabio de Bagdad del siglo IX que nos dio también el álgebra. Su nombre, deformado al latín («Algoritmi»), pasó a significar «hacer cuentas con reglas».","El algoritmo más antiguo famoso es el de Euclides (300 a.C.) para el máximo común divisor: divide y quédate con el resto, repite hasta resto cero. Dos mil trescientos años después sigue usándose en cada cifrado.","Un buen algoritmo tiene tres virtudes: es correcto (siempre da lo bueno), termina (no se eterniza) y es claro (cualquiera puede ejecutarlo).","Hoy los algoritmos deciden qué vídeo te toca, qué ruta toma tu envío, qué precio ves en la tienda. Entenderlos es entender quién cocina tu mundo digital."],"quiz":[{"pregunta":"¿Qué es un algoritmo?","opciones":["Un ordenador","Una receta de pasos exactos que siempre termina","Un programa de televisión"],"correcta":1,"porque":"Pasos claros, finitos, ejecutables por cualquiera… o por cualquier máquina."},{"pregunta":"¿De quién viene la palabra «algoritmo»?","opciones":["De un griego","De Al-Juarismi","De un ingeniero americano"],"correcta":1,"porque":"Del mismo sabio de Bagdad que dio nombre al álgebra: doble regalo."},{"pregunta":"¿Cuáles son las tres virtudes de un buen algoritmo?","opciones":["Rápido, bonito, caro","Correcto, termina y es claro","Largo, secreto, moderno"],"correcta":1,"porque":"Sin corrección no sirve; sin final no acaba; sin claridad no se ejecuta."}]},{"titulo":"Buscar: del barrido a la búsqueda binaria","contenido":["Buscar una palabra en el diccionario: puedes leer desde la primera página (barrido) o puedes abrir por la mitad, ver si tu palabra va antes o después, y descartar media obra de golpe.","Eso es la búsqueda binaria: cada paso parte el problema por la mitad. Entre 1.000 palabras, 10 pasos. Entre un millón, 20 pasos. Entre mil millones, 30.","La cuenta es un logaritmo al revés: 2 elevado a 20 ya supera el millón. Por eso los buscadores encuentran tu página entre billones en milisegundos.","Condición fundamental: solo funciona si los datos están ORDENADOS. Por eso los ordenadores pasan tanto tiempo ordenando cosas: ordenar una vez permite buscar rápido mil veces.","Practica el juego: piensa un número del 1 al 100 y deja que alguien lo adivine preguntando solo «¿es mayor que…?». Con binaria, 7 preguntas bastan siempre. Hazlo y parecerás mago."],"quiz":[{"pregunta":"¿Cuántos pasos hacen falta con búsqueda binaria entre un millón de datos?","opciones":["Un millón","Unos 20","Unos 500"],"correcta":1,"porque":"Cada paso descarta la mitad: 2²⁰ ya supera el millón."},{"pregunta":"¿Qué condición necesita la búsqueda binaria?","opciones":["Datos ordenados","Datos grandes","Muchos ordenadores"],"correcta":0,"porque":"Sin orden no hay manera de saber qué mitad descartar."},{"pregunta":"Número del 1 al 100, preguntas de «¿mayor que?». ¿Cuántas bastan?","opciones":["50","7","100"],"correcta":1,"porque":"2⁷ = 128 > 100: siete cortes a la mitad cubren todo el rango."}]},{"titulo":"Ordenar: el trabajo invisible","contenido":["Ordenar parece tonto y es la mitad de la informática: tus contactos, los precios de menor a mayor, los resultados del buscador. Todo está ordenado por algo.","El método ingenuo (burbuja): recorre la lista comparando parejas vecinas e intercambiando las mal ordenadas, una y otra vez. Con n datos, unos n² pasos. Para 1.000 datos, un millón de pasos.","El método listo (quicksort, Hoare 1959): elige un pivote, separa los menores a la izquierda y los mayores a la derecha, y repite en cada mitad. Divide y vencerás: unos n·log n pasos. Para 1.000 datos, unos 10.000: cien veces menos.","Ese salto — de n² a n·log n — es la diferencia entre «imposible» y «instantáneo» cuando los datos crecen. Google ordena la web entera con estas ideas.","La lección va más allá de las listas: los problemas grandes se resuelven partiéndolos en problemas pequeños idénticos. Es la estrategia más poderosa de la computación y de la vida organizada."],"quiz":[{"pregunta":"¿Cuántos pasos cuesta la burbuja con 1.000 datos?","opciones":["1.000","Un millón","Diez"],"correcta":1,"porque":"n² = 1.000 × 1.000: crece fatal al crecer la lista."},{"pregunta":"¿Cuál es la idea del quicksort?","opciones":["Comparar todo con todo","Separar con un pivote y repetir en cada mitad","Barajar hasta que salga"],"correcta":1,"porque":"Divide y vencerás: cada paso parte el trabajo por dos."},{"pregunta":"¿Por qué importa pasar de n² a n·log n?","opciones":["No importa","Con datos grandes es la diferencia entre imposible e instantáneo","Solo por estética"],"correcta":1,"porque":"Para un millón de datos: un billón de pasos contra veinte millones. No hay ordenador que compense un mal algoritmo."}]},{"titulo":"Eficiencia: por qué importa el algoritmo y no el ordenador","contenido":["Pongamos dos algoritmos a competir: uno tarda n² pasos en un superordenador, otro tarda n·log n en un móvil. Con pocos datos gana el superordenador. Con muchos, gana el móvil. Siempre.","La notación «O grande» describe cómo crece el coste: O(n) lineal, O(n²) cuadrático, O(log n) logarítmico. No dice los segundos; dice cómo empeora al crecer el problema.","Hay problemas para los que no se conoce algoritmo rápido: son los «NP». El viajante que debe visitar 100 ciudades tiene más rutas posibles que átomos hay en el universo. Nadie sabe si existe atajo general; es el problema del millón de dólares (P vs NP).","Tu seguridad digital depende de esa dificultad: el cifrado funciona porque romperlo es un problema de coste astronómico, no porque sea imposible en teoría.","Lección de ingeniero: antes de comprar más máquina, pregunta si existe mejor algoritmo. El cerebro gana a los vatios casi siempre."],"quiz":[{"pregunta":"¿Qué describe la notación O grande?","opciones":["Los segundos exactos","Cómo crece el coste al crecer el problema","El precio"],"correcta":1,"porque":"No mide tiempo, mide crecimiento: O(n²) envejece fatal, O(log n) apenas envejece."},{"pregunta":"¿Qué es el problema P vs NP?","opciones":["Una marca de ordenadores","La pregunta abierta de si todo problema comprobable rápido es resoluble rápido","Una ecuación"],"correcta":1,"porque":"Vale un millón de dólares y nadie lo ha resuelto: es la frontera de la computación."},{"pregunta":"¿En qué se apoya el cifrado moderno?","opciones":["En el secreto del método","En que romperlo costaría más que la vida del universo","En la suerte"],"correcta":1,"porque":"El algoritmo es público; lo imposible es la cuenta de revertirlo sin la clave."}]},{"titulo":"Las máquinas que aprenden","contenido":["Un programa clásico sigue reglas que un humano escribió. Una máquina que aprende hace otra cosa: le enseñas miles de ejemplos y ella sola ajusta sus números hasta acertar.","Por dentro es estadística de las que ya conoces: la máquina multiplica matrices, mide su error y lo corrige paso a paso bajando por la pendiente del error — sí, con derivadas. Se llama «descenso de gradiente».","Así reconoce tu cara, traduce idiomas o sugiere el siguiente vídeo. No «entiende»: ha ajustado millones de números para minimizar fallos en los ejemplos.","De ahí sus dos grandes peligros: si los ejemplos tenían prejuicios, la máquina los aprende (basura entra, basura sale); y si solo premia tu atención, aprenderá a engancharte, no a servirte.","Saber esto te vuelve inmune al truco: la IA no es un oráculo ni un mago. Es un algoritmo de optimización con muchos datos. Poderosa, sí; infalible, jamás."],"quiz":[{"pregunta":"¿Cómo aprende una máquina?","opciones":["Leyendo reglas","Ajustando sus números con miles de ejemplos","Por magia"],"correcta":1,"porque":"Mide el error en los ejemplos y lo corrige paso a paso: descenso de gradiente."},{"pregunta":"¿Qué es el «descenso de gradiente»?","opciones":["Bajar una montaña","Corregir el error siguiendo la pendiente… con derivadas","Una app"],"correcta":1,"porque":"Es literalmente la derivada de la lección de optimización, aplicada millones de veces."},{"pregunta":"Si los datos de entrenamiento tienen prejuicios, la máquina…","opciones":["Los corrige sola","Los aprende","Los ignora"],"correcta":1,"porque":"Basura entra, basura sale: solo aprende lo que los ejemplos enseñan."}]},{"titulo":"Pensar como un programador","contenido":["No hace falta ordenador para pensar computacionalmente. Son cuatro hábitos que sirven para cualquier problema de la vida.","Descomposición: todo problema grande se parte en problemas pequeños. Organizar una boda es catering + invitados + lugar + música. Cada parte, por separado, es manejable.","Patrones: si ya resolviste algo parecido, reutiliza la solución. La regla de tres que usaste en la receta sirve para el presupuesto.","Abstracción: quédate con lo esencial y olvida el resto. El mapa del metro no dibuja las calles: solo estaciones y conexiones. Por eso es útil.","Algoritmo: escribe los pasos tan claros que los pueda seguir otra persona sin preguntarte nada. Si tu abuela puede seguir la receta sin llamarte, es un buen algoritmo. Enséñalo: enseñar es la prueba final de entender."],"quiz":[{"pregunta":"¿Qué es la descomposición?","opciones":["Romper cosas","Partir el problema grande en problemas pequeños","Tirar la toalla"],"correcta":1,"porque":"Cada subproblema pequeño es manejable; juntos resuelven el grande."},{"pregunta":"El mapa del metro es un ejemplo de…","opciones":["Descomposición","Abstracción","Burbuja"],"correcta":1,"porque":"Se queda con lo esencial (estaciones y conexiones) y olvida el resto."},{"pregunta":"¿Cuál es la prueba final de que un algoritmo está bien explicado?","opciones":["Que sea largo","Que otro pueda seguirlo sin preguntar nada","Que use siglas"],"correcta":1,"porque":"La claridad total es la meta: si hay que llamarte, el algoritmo falló."}]}],"nivel":"avanzado"},{"id":"linux","titulo":"Linux: domina el sistema","icono":"🐧","lecciones":[{"titulo":"Qué es Linux y por qué gobierna el mundo","contenido":["Linux es un sistema operativo libre: el corazón (el núcleo o kernel) que reparte la memoria, el procesador y los dispositivos entre los programas. Es libre en dos sentidos: gratis y con código abierto que cualquiera puede leer, modificar y compartir. Lo que hoy es Windows en los PC, es Linux en casi todo lo demás.","Aunque no lo veas, Linux te rodea: todos los móviles Android llevan Linux dentro, la enorme mayoría de los servidores de internet, los superordenadores más potentes (los 500 primeros de la lista, todos), los routers, las teles y hasta el cajero del banco. Cuando navegas, tus peticiones cruzan decenas de máquinas Linux.","La idea revolucionaria no fue técnica sino social: miles de programadores de todo el mundo, muchos voluntarios, construyendo juntos algo que pertenece a todos. Ninguna empresa puede apagarlo, porque el código vive en millones de copias.","Reto: averigua qué sistema operativo lleva tu móvil, tu router y tu tele. Suma cuántos Linux tienes en casa sin saberlo."],"quiz":[{"pregunta":"¿Qué es Linux?","opciones":["Un sistema operativo libre y de código abierto","Un navegador","Una marca de ordenadores"],"correcta":0,"porque":"Es el software base que gestiona el hardware, y su código pertenece a todos."},{"pregunta":"¿Dónde NO se usa Linux habitualmente?","opciones":["Es difícil decirlo: está en móviles, servidores, teles y superordenadores","En los móviles","En los servidores"],"correcta":0,"porque":"Android es Linux, internet corre sobre Linux y el 100% del top 500 de supercomputación lo usa."},{"pregunta":"¿Qué significa 'código abierto'?","opciones":["Que cualquiera puede leer, modificar y compartir el código","Que no tiene contraseña","Que es un virus"],"correcta":0,"porque":"La apertura permite auditarlo, mejorarlo y que nadie pueda apagarlo."}]},{"titulo":"El árbol de directorios: tu casa ordenada","contenido":["En Linux todo cuelga de una raíz única, /, como las ramas de un árbol: /home guarda las carpetas personales de cada usuario, /etc la configuración del sistema, /var los registros y datos cambiantes, /bin los programas esenciales. No hay 'C:' ni 'D:': los discos se 'montan' como ramas más del mismo árbol.","La ruta absoluta empieza siempre en la raíz: /home/maria/fotos. La relativa parte de donde estás: si estás en /home/maria, escribir fotos basta. Los atajos . (aquí) y .. (la carpeta de arriba) mueven por el árbol sin escribir de más.","En Linux, 'todo es un archivo': hasta los discos, la memoria y los procesos aparecen como archivos especiales (/dev, /proc). Leer el estado del sistema es leer archivos; configurar es editar archivos de texto. Nada de registros ocultos: todo está a la vista.","Reto: dibuja en un papel el árbol de tus carpetas personales (documentos, fotos, música) colgando de tu nombre. Ese dibujo ya es pensar en Linux."],"quiz":[{"pregunta":"¿Dónde empieza todo en Linux?","opciones":["En la raíz, /","En C:","En el escritorio"],"correcta":0,"porque":"Un solo árbol desde /; los discos se montan como ramas."},{"pregunta":"¿Qué guarda /home?","opciones":["Las carpetas personales de los usuarios","Los virus","La papelera del sistema"],"correcta":0,"porque":"Cada usuario tiene su espacio en /home/su-nombre."},{"pregunta":"¿Qué significa 'todo es un archivo'?","opciones":["Que dispositivos y procesos se ven y manejan como archivos","Que no hay carpetas","Que todo es texto plano sin más"],"correcta":0,"porque":"Esa uniformidad hace el sistema transparente: inspeccionar y configurar es leer y editar archivos."}]},{"titulo":"La terminal: hablar con el ordenador en serio","contenido":["La terminal es una conversación de texto con el sistema: escribes una orden, el ordenador responde. Parece antigua, pero es la herramienta más rápida y precisa que existe: lo que con el ratón son veinte clics, en la terminal es una línea. Y funciona igual en tu PC que en un servidor a 10.000 km.","Las primeras órdenes: pwd (¿dónde estoy?), ls (¿qué hay aquí?), cd (cambiar de carpeta), mkdir (crear carpeta), cp y mv (copiar y mover), rm (borrar: ¡con cuidado, no hay papelera!). cat muestra un archivo; man abre el manual de cualquier orden.","Los superpoderes llegan combinando: la tubería | encadena órdenes (la salida de una es la entrada de la siguiente), grep busca texto, y > guarda el resultado en un archivo. Ejemplo real: cat registro.txt | grep error | wc -l cuenta cuántos errores hay en un registro.","Reto: abre una terminal (en Linux, Mac o con WSL en Windows) y ejecuta pwd, ls, mkdir prueba, cd prueba, pwd. Cinco órdenes y ya eres usuaria de terminal."],"quiz":[{"pregunta":"¿Para qué sirve la terminal si hay ratón?","opciones":["Es más rápida, precisa y funciona igual a distancia","Para nada, es decorativa","Solo para hackers de cine"],"correcta":0,"porque":"Una línea hace lo de veinte clics, y es la única vía en servidores remotos."},{"pregunta":"¿Qué hace rm?","opciones":["Borra archivos directamente, sin papelera","Crea carpetas","Muestra texto"],"correcta":0,"porque":"rm es definitivo: en la terminal no hay 'deshacer'."},{"pregunta":"¿Qué hace la tubería | ?","opciones":["Encadena órdenes: la salida de una alimenta a la siguiente","Divide la pantalla","Borra el disco"],"correcta":0,"porque":"Combinar herramientas pequeñas es la filosofía Unix: grep, wc, sort... como piezas de Lego."}]},{"titulo":"Usuarios y permisos: quién puede qué","contenido":["Linux es multiusuario desde su nacimiento: cada persona tiene su cuenta, y el sistema sabe quién hace qué. El usuario root es el administrador supremo: puede todo, incluido destrozarlo todo. Por eso la regla de oro es trabajar como usuario normal y usar sudo solo cuando haga falta.","Cada archivo tiene permisos de lectura, escritura y ejecución (r, w, x) para tres públicos: el dueño, su grupo y el resto del mundo. El famoso chmod 755 dice: el dueño puede todo, los demás leer y ejecutar. ls -l te lo muestra: -rwxr-xr-x.","Este modelo simple es un pilar de la seguridad: un programa que se ejecuta como usuario normal no puede tocar los archivos del sistema ni los de otros usuarios. Muchos virus que arrasan Windows en Linux chocan contra el muro de los permisos.","Reto: ejecuta ls -l en una carpeta y descifra la primera columna de cada línea: tipo de archivo y sus nueve letras de permiso. Ya sabes leer el DNI de un archivo."],"quiz":[{"pregunta":"¿Qué es root?","opciones":["El administrador con poder absoluto sobre el sistema","Una carpeta de fotos","Un antivirus"],"correcta":0,"porque":"Root puede todo: por eso se usa con cuentagotas, mediante sudo."},{"pregunta":"¿Qué significan r, w y x?","opciones":["Lectura, escritura y ejecución","Rojo, blanco y xilófono","Root, web y extras"],"correcta":0,"porque":"Tres permisos para tres públicos (dueño, grupo, otros) forman las nueve letras."},{"pregunta":"¿Por qué los permisos frenan a los virus?","opciones":["Porque un programa de usuario normal no toca el sistema ni a otros usuarios","Porque Linux es caro","Porque los virus tienen miedo"],"correcta":0,"porque":"El compartimentado es estructural: sin permisos de root, el daño queda acotado."}]},{"titulo":"Paquetes y repositorios: la tienda libre","contenido":["Instalar programas en Linux no es buscar un .exe por internet: es pedirlo al repositorio oficial de tu distribución, un almacén de software revisado y firmado. Con apt install gimp (Debian, Ubuntu) o dnf install (Fedora) se descarga, se instala y se actualiza solo. Seguro, rápido y sin anuncios.","El gestor de paquetes resuelve las dependencias: si un programa necesita una biblioteca, la instala él. Y apt update && apt upgrade actualiza TODO el sistema de una vez: sistema, navegador, todo. Es la tienda de aplicaciones, inventada quince años antes del smartphone.","Las distribuciones son 'sabores' de Linux: mismo núcleo, distinta selección de programas y escritorio. Ubuntu para empezar, Debian para estabilidad rocosa, Fedora para lo último, y cientos más. Elegir distro es elegir comunidad y filosofía, no solo software.","Reto: busca qué distribución usan los proyectos que admiras (la ISS usa Debian, muchas nubes usan Ubuntu). Cada elección cuenta una prioridad."],"quiz":[{"pregunta":"¿Cómo se instala software en Linux?","opciones":["Desde repositorios oficiales con el gestor de paquetes","Descargando .exe de webs raras","Por correo postal"],"correcta":0,"porque":"Software revisado, firmado y con actualizaciones automáticas: la tienda antes de las tiendas."},{"pregunta":"¿Qué son las dependencias?","opciones":["Bibliotecas que un programa necesita y que el gestor instala solo","Hijos del programa","Errores fatales"],"correcta":0,"porque":"El gestor las resuelve automáticamente: tú pides el programa, él trae todo lo necesario."},{"pregunta":"¿Qué es una distribución?","opciones":["Una variante de Linux con su selección de software y su filosofía","Un virus","Una marca de discos"],"correcta":0,"porque":"Mismo kernel, distinto sabor: Ubuntu, Debian, Fedora y cientos más."}]},{"titulo":"Procesos y servicios: el pulso del sistema","contenido":["Todo lo que se ejecuta es un proceso, con su número (PID), su dueño y su consumo. ps aux los lista todos; top (o htop) los muestra en vivo, ordenados por hambre de procesador. Cuando el ordenador va lento, ahí se mira quién se está comiendo la máquina.","Los procesos se gobiernan: kill envía señales (por favor, ciérrate; o ciérrate ya: kill -9), nice ajusta prioridades, & lanza en segundo plano. Un programa rebelde no obliga a reiniciar: se le retira la palabra y punto.","Los servicios (daemons) son procesos que trabajan en silencio desde el arranque: el servidor web, la red, el reloj. systemctl status sshd cuenta cómo está el servicio de acceso remoto; systemctl restart lo reinicia. Un servidor se administra así, servicio a servicio.","Reto: ejecuta top y observa un minuto. Identifica qué proceso consume más y cuánta memoria libre hay. Estás leyendo el electrocardiograma de tu máquina."],"quiz":[{"pregunta":"¿Qué es un proceso?","opciones":["Un programa en ejecución, con su PID y su dueño","Un archivo de texto","Un tipo de cable"],"correcta":0,"porque":"Todo lo que corre es un proceso listado por ps y visible en top."},{"pregunta":"¿Qué hace kill -9?","opciones":["Termina un proceso de inmediato, sin negociación","Borra el disco","Reinicia el router"],"correcta":0,"porque":"La señal 9 (SIGKILL) no se puede ignorar: es el último recurso."},{"pregunta":"¿Qué es un servicio o daemon?","opciones":["Un proceso de fondo que trabaja desde el arranque","Un demonio mitológico","Una impresora"],"correcta":0,"porque":"Web, red, acceso remoto: servicios gestionados con systemctl."}]},{"titulo":"Redes en Linux: ver y tocar internet","contenido":["Linux habla red en su idioma nativo: internet nació en máquinas Unix. ip a muestra tus direcciones IP, ping comprueba si una máquina responde, y ss -tuln revela qué puertos tiene abiertos tu equipo escuchando conexiones. Con tres órdenes ves tu propia huella en la red.","ssh es la joya: abrir una terminal en otra máquina de forma cifrada. Administrar un servidor en otro continente es escribir ssh usuario@servidor y seguir trabajando como si estuvieras dentro. Con claves en lugar de contraseña, es el estándar de acceso seguro del planeta.","wget y curl descargan y hablan con servidores web desde la terminal; scp copia archivos cifrados entre máquinas. Y con /etc/hosts y las herramientas de red se diagnostica casi cualquier avería: ¿falla internet o falla solo el nombre? ping a la IP y al nombre lo separan en segundos.","Reto: ejecuta ping -c 4 ejemplo.com y mira los milisegundos de ida y vuelta. Ese número es la distancia física de internet hecha visible."],"quiz":[{"pregunta":"¿Qué muestra ss -tuln?","opciones":["Los puertos que tu equipo tiene abiertos escuchando","Las fotos del disco","La hora"],"correcta":0,"porque":"Ver tus puertos abiertos es el primer paso de cualquier auditoría de seguridad."},{"pregunta":"¿Qué permite ssh?","opciones":["Controlar otra máquina con una terminal cifrada","Ver la tele","Imprimir"],"correcta":0,"porque":"Es el estándar mundial de administración remota segura."},{"pregunta":"Si ping a la IP funciona pero al nombre no, ¿qué falla?","opciones":["La resolución de nombres (DNS)","El cable","La pantalla"],"correcta":0,"porque":"Separar fallos por capas es el oficio: con dos pings localizas el problema."}]},{"titulo":"Bash scripting: el ordenador trabajando para ti","contenido":["Un script es una lista de órdenes guardada en un archivo de texto: la terminal las ejecuta sola, una tras otra. Si haces algo dos veces, escribe un script; si lo haces todas las semanas, el script lo hará por ti para siempre. Automatizar es multiplicar tu tiempo.","Un script sencillo de copias de seguridad: tar czf copia-$(date +%F).tar.gz ~/documentos empaqueta y comprime tu carpeta con la fecha en el nombre. Una línea que hoy vale poco y el día del desastre vale oro.","Bash tiene variables, condiciones (if), bucles (for, while): es un lenguaje completo. for f in *.jpg; do mv '$f' 'foto-$f'; done renombra cien fotos en un segundo. Lo repetitivo es para la máquina; lo creativo, para ti.","Reto: escribe un script de tres líneas que cree una carpeta con la fecha de hoy y copie dentro tus documentos. Ejecutarlo cada lunes es tu primer sistema de copias automático."],"quiz":[{"pregunta":"¿Qué es un script de bash?","opciones":["Un archivo de texto con órdenes que se ejecutan en secuencia","Un programa de pago","Un virus legal"],"correcta":0,"porque":"Guardar órdenes para repetirlas sin teclear: el primer paso de la automatización."},{"pregunta":"¿Qué hace un bucle for?","opciones":["Repite una acción para cada elemento de una lista","Suma números pares solamente","Apaga la máquina"],"correcta":0,"porque":"Cien archivos renombrados en un segundo: el bucle es el trabajador incansable."},{"pregunta":"¿Cuál es la filosofía de automatizar?","opciones":["Lo que se repite, que lo haga la máquina","Trabajar más horas","No usar el ordenador"],"correcta":0,"porque":"Un script escrito una vez devuelve su tiempo cada vez que corre."}]},{"titulo":"Linux en la vida real: servidores, nube y software libre","contenido":["Cuando oyes 'la nube', piensa: millones de servidores Linux en naves industriales. Los contenedores (Docker) empaquetan programas con todo lo necesario para que corran igual en cualquier máquina, y Kubernetes los dirige como un director de orquesta. Todo eso es tecnología libre construida sobre Linux.","El software libre tiene una ética práctica: si el programa es libre, puedes auditarlo, arreglarlo y no depender del capricho de un vendedor. Licencias como la GPL garantizan que las mejoras vuelvan a la comunidad: quien usa el código, devuelve el código.","Aprender Linux es una carrera profesional: administrador de sistemas, DevOps, ciberseguridad, computación científica. Los salarios reflejan la escasez de gente que domina la terminal.","Reto final de la materia: instala Linux en un USB arrancable (Ubuntu permite probarlo sin tocar el disco) o en una máquina virtual, y repasa las ocho lecciones anteriores dentro. Leer sobre nadar no sustituye al agua."],"quiz":[{"pregunta":"¿Qué hay detrás de 'la nube'?","opciones":["Servidores Linux en centros de datos","Vapor de agua","Satélites exclusivamente"],"correcta":0,"porque":"La nube es el ordenador de otro, y ese ordenador casi siempre corre Linux."},{"pregunta":"¿Qué garantiza una licencia como la GPL?","opciones":["Que las mejoras del código vuelvan a la comunidad","Que el programa sea caro","Que no haya copias"],"correcta":0,"porque":"Es la regla del 'usa y devuelve': el código libre se protege a sí mismo."},{"pregunta":"¿Por qué aprender Linux profesionalmente?","opciones":["Porque sostiene internet y hay demanda de quien lo domina","Porque es vintage","Porque no hay otra cosa"],"correcta":0,"porque":"Sysadmin, DevOps, seguridad, ciencia: la terminal abre puertas laborales."}]},{"titulo":"Editores de texto: nano y vim","contenido":["Todo en Linux se configura editando texto, así que el editor es la herramienta de supervivencia. nano es el amable: las órdenes aparecen abajo (Ctrl+O guarda, Ctrl+X sale, Ctrl+W busca). Para empezar y para prisas, nano y punto.","vim es el editor de los veteranos: tiene modos. En modo normal las teclas son órdenes (dd borra línea, yy la copia, p pega, / busca); con i pasas a insertar texto; con Esc vuelves; y para salir, :wq guarda y sale, :q! sale sin guardar. El chiste del gremio es cierto: todo el mundo ha estado atrapado en vim alguna vez.","¿Por qué aprender vim si existe nano? Porque está en todas partes (hasta en el servidor más pelado), porque sus órdenes son un idioma que multiplica la velocidad, y porque las ideas de vim viven en todos los editores modernos. Con cinco órdenes basta para sobrevivir; el resto es vicio.","Reto: abre un archivo con nano, edítalo y guárdalo. Luego abre otro con vim, inserta una línea (i), guarda y sal (:wq). Superar el primer contacto con vim es un rito de paso."],"quiz":[{"pregunta":"¿Cómo se guarda y sale en nano?","opciones":["Ctrl+O y Ctrl+X",":wq","Alt+F4"],"correcta":0,"porque":"nano muestra sus atajos abajo: Ctrl+O escribe el archivo, Ctrl+X cierra."},{"pregunta":"¿Qué hace la tecla i en vim?","opciones":["Pasa al modo de inserción de texto","Imprime","Cierra"],"correcta":0,"porque":"En modo normal las teclas son órdenes; i te deja escribir; Esc te devuelve."},{"pregunta":"¿Por qué conviene conocer vim aunque uses otro editor?","opciones":["Porque está instalado en prácticamente cualquier sistema","Porque es más bonito","Porque es obligatorio por ley"],"correcta":0,"porque":"En servidores mínimos y rescates, vim (o vi) es lo único garantizado."}]},{"titulo":"Empaquetar y comprimir: tar, gzip y zip","contenido":["tar empaqueta muchos archivos en uno solo conservando su estructura y permisos (no comprime por sí mismo). Los atajos clásicos: tar czf archivo.tar.gz carpeta/ crea comprimido con gzip, tar xzf archivo.tar.gz lo desempaqueta. c de crear, x de extraer, z de gzip, f de archivo.","Los niveles de compresión: gzip es rápido y universal, bzip2 aprieta más, xz aprieta al máximo pero tarda. Para textos y datos típicos, la compresión reduce a un tercio o menos: la redundancia es el enemigo y estos algoritmos la cazan.","zip es el formato que entiende Windows sin ayuda: zip -r paquete.zip carpeta/ y unzip paquete.zip. Cuando compartes con alguien fuera del mundo Linux, zip evita conversaciones.","Reto: empaqueta tu carpeta de documentos con tar czf, comprueba su tamaño frente al original con ls -lh, y desempaquétala en otra ruta con tar xzf para verificar que la copia está íntegra."],"quiz":[{"pregunta":"¿Qué hace tar czf copia.tar.gz carpeta/?","opciones":["Empaqueta y comprime la carpeta en un archivo","Borra la carpeta","La mueve"],"correcta":0,"porque":"c crea, z comprime con gzip, f nombra el archivo resultante."},{"pregunta":"¿Cuál comprime más, gzip o xz?","opciones":["xz, aunque tarda más","gzip","Comprimen igual"],"correcta":0,"porque":"xz exprime al máximo a costa de tiempo; gzip es el equilibrio universal."},{"pregunta":"¿Qué formato conviene para compartir con Windows?","opciones":["zip","tar.gz","xz"],"correcta":0,"porque":"Windows abre zip de fábrica: la interoperabilidad también es una decisión técnica."}]},{"titulo":"Enlaces duros y simbólicos","contenido":["Un archivo en Linux es, en el fondo, un inodo: la ficha donde el sistema guarda los datos y metadatos. El nombre que tú ves es solo una etiqueta que apunta a ese inodo. Un enlace duro crea otra etiqueta para el mismo inodo: dos nombres, un solo contenido; borrar un nombre no borra los datos mientras quede otro.","El enlace simbólico (ln -s destino atajo) es distinto: un cartel que dice 'mira allí'. Es un archivo pequeño que apunta a una ruta. Si el destino desaparece, el enlace queda roto (colgado). A cambio, puede apuntar a otras particiones y a directorios, cosa que el duro no puede.","¿Para qué sirven? Para tener la misma biblioteca disponible en varias rutas sin duplicarla, para que la versión 'actual' de un programa sea un enlace que se mueve, y para organizar tu trabajo con atajos sin copiar nada. ls -l los muestra con su flecha: atajo -> destino.","Reto: crea un archivo, un enlace duro y uno simbólico al mismo archivo. Edita por un nombre y mira por los otros; luego borra el original y comprueba quién sobrevive: el duro guarda los datos, el simbólico queda roto."],"quiz":[{"pregunta":"¿Qué es un enlace duro?","opciones":["Otro nombre que apunta al mismo inodo: mismos datos","Un atajo con flecha","Una copia comprimida"],"correcta":0,"porque":"Dos nombres, un contenido: los datos viven mientras quede un nombre."},{"pregunta":"¿Qué pasa con un enlace simbólico si borras el destino?","opciones":["Queda roto: apunta a algo que ya no existe","Sigue funcionando","Se borra solo"],"correcta":0,"porque":"El simbólico guarda una ruta, no los datos: sin destino, no hay nada."},{"pregunta":"¿Qué ventaja tiene el simbólico sobre el duro?","opciones":["Puede apuntar a directorios y a otras particiones","Ocupa menos","Es más rápido"],"correcta":0,"porque":"El duro vive dentro de un mismo sistema de archivos; el simbólico cruza fronteras."}]},{"titulo":"El arranque a fondo: UEFI, GRUB y el núcleo","contenido":["Al encender, la UEFI (antes BIOS) despierta el hardware y busca en la partición EFI el gestor de arranque: GRUB. GRUB muestra su menú (mantén Shift o Esc si no aparece), carga el núcleo elegido y el initramfs (un mini-sistema con los controladores justos para leer el disco de verdad).","El núcleo toma el mando, monta la raíz y lanza el proceso número 1: systemd, que levanta en paralelo todos los servicios hasta llegar al objetivo (target): multi-user para servidores, graphical para escritorio. Los targets son los antiguos 'niveles de ejecución' con otro nombre.","Cuando no arranca, la cadena te dice dónde mirar: ¿no aparece GRUB? Problema de UEFI o del disco de arranque. ¿GRUB sí pero el núcleo falla? Prueba el núcleo anterior desde el menú. ¿Falla al montar discos? Revisa /etc/fstab. Cada síntoma señala su eslabón.","Reto: entra en el menú de GRUB en tu próxima instalación o máquina virtual y pulsa 'e' sobre una entrada: verás la línea que carga el núcleo. No cambies nada; solo mira. Saber que existe ya es medio rescate."],"quiz":[{"pregunta":"¿Qué carga la UEFI en primer lugar?","opciones":["El gestor de arranque desde la partición EFI","El escritorio","El navegador"],"correcta":0,"porque":"UEFI → GRUB → núcleo → systemd: la cadena completa."},{"pregunta":"¿Qué es el initramfs?","opciones":["Un mini-sistema temporal con los controladores para montar el disco real","Un virus de arranque","La papelera del núcleo"],"correcta":0,"porque":"El núcleo necesita controladores para leer el disco; el initramfs se los presta al inicio."},{"pregunta":"Si el sistema no arranca tras actualizar el núcleo, ¿qué pruebas primero?","opciones":["Arrancar el núcleo anterior desde el menú de GRUB","Formatear","Cambiar de ordenador"],"correcta":0,"porque":"GRUB guarda las entradas antiguas precisamente para esto: el rescate está en el menú."}]},{"titulo":"systemd en serio: crea tu propio servicio","contenido":["systemd gobierna el sistema con unidades: servicios (.service), puntos de montaje, temporizadores y objetivos. systemctl status sshd muestra el estado; start, stop, restart y reload lo controlan; enable y disable deciden si arranca solo; mask lo inmoviliza por completo.","Un servicio propio es un archivo de texto en /etc/systemd/system/miservicio.service con tres secciones: [Unit] (descripción y dependencias, por ejemplo After=network.target), [Service] (ExecStart con la orden, el usuario, qué hacer si cae: Restart=on-failure) e [Install] (WantedBy=multi-user.target para que arranque con el sistema).","Tras crearlo: systemctl daemon-reload recarga las definiciones, systemctl enable --now miservicio lo activa y lo arranca, y journalctl -u miservicio muestra solo sus mensajes. Con veinte líneas de texto tu programa se convierte en ciudadano de primera clase del sistema.","Reto: convierte tu script de copias en un servicio systemd que se ejecute al arrancar (o mejor: con un temporizador .timer, que es el cron moderno). Verlo subir solo es una pequeña magia de administrador."],"quiz":[{"pregunta":"¿Qué hace systemctl mask unidad?","opciones":["La inmoviliza por completo: no puede arrancar ni manualmente","La oculta del menú","La cifra"],"correcta":0,"porque":"mask apunta la unidad a /dev/null: la forma fuerte de decir 'nunca'."},{"pregunta":"¿Qué va en la sección [Service] de una unidad?","opciones":["La orden a ejecutar, el usuario y la política de reinicio","El color del servicio","La contraseña"],"correcta":0,"porque":"ExecStart define qué corre; Restart=on-failure lo resucita si cae."},{"pregunta":"¿Qué hay que hacer tras editar un archivo .service?","opciones":["systemctl daemon-reload para recargar las definiciones","Reiniciar el ordenador","Nada"],"correcta":0,"porque":"systemd cachea las unidades: daemon-reload le hace releer los cambios."}]},{"titulo":"Diagnóstico con journalctl y amigos","contenido":["El diario del sistema guarda todo lo que cuentan el núcleo y los servicios: journalctl lo lee entero, journalctl -b solo desde el último arranque, journalctl -u sshd solo lo de un servicio, journalctl -f sigue en vivo (como tail -f) y journalctl --since '1 hour ago' filtra por tiempo con palabras humanas.","Los niveles de mensaje van de debug a emerg: journalctl -p err muestra solo errores y peores. Cuando algo falla, la coreografía es: status del servicio, luego journalctl -u del servicio, luego el diario general por si el fallo viene de más abajo (disco, red, memoria).","Más instrumentos: dmesg muestra los mensajes del núcleo (hardware, discos, USB), systemctl --failed lista lo que arrancó mal, y los registros clásicos siguen en /var/log para lo que no usa el diario. Diagnosticar es leer lo que el sistema ya te está contando.","Reto: ejecuta journalctl -p err -b y lee los errores de tu último arranque. Investiga uno que no entiendas buscando su texto exacto: así se aprende el oficio, error a error."],"quiz":[{"pregunta":"¿Qué muestra journalctl -b?","opciones":["Los mensajes desde el último arranque","Los de hace un año","Solo los futuros"],"correcta":0,"porque":"El -b (boot) acota al arranque actual: lo esencial para diagnosticar."},{"pregunta":"¿Cómo sigo los mensajes en vivo de un servicio?","opciones":["journalctl -u servicio -f","cat /var/log","ps aux"],"correcta":0,"porque":"El -f sigue el flujo en tiempo real: ver el fallo mientras ocurre lo explica casi todo."},{"pregunta":"¿Qué muestra dmesg?","opciones":["Los mensajes del núcleo: hardware y dispositivos","El correo","Los usuarios"],"correcta":0,"porque":"Cuando un disco o un USB se comportan raro, el núcleo lo contó en dmesg."}]},{"titulo":"Discos flexibles: LVM y RAID","contenido":["Las particiones fijas tienen un problema: nacen de un tamaño y cambiarlas es doloroso. LVM (Logical Volume Manager) mete una capa inteligente: los discos físicos forman un 'grupo de volúmenes' (una bolsa de espacio) y de ahí se cortan volúmenes lógicos que crecen y encogen en caliente. lvextend -L +10G /dev/grupo/datos y listo: diez gigas más sin apagar nada.","LVM también hace instantáneas (snapshots): una foto congelada del volumen en un momento, perfecta para copias de seguridad consistentes o para probar cambios con red de seguridad.","RAID combina discos para resistencia o velocidad: RAID 1 espeja dos discos (cae uno, no pasa nada), RAID 0 suma velocidad sin protección, RAID 5/6 reparten datos con paridad. Y la advertencia de siempre: RAID no es copia de seguridad — protege del disco roto, no del borrado, el ransomware o el incendio.","Reto: explica en papel la diferencia entre 'a prueba de disco roto' y 'a prueba de desastre'. Luego mira con lsblk y df -h cómo están montados tus discos actuales."],"quiz":[{"pregunta":"¿Qué problema resuelve LVM?","opciones":["Cambiar tamaños de volúmenes en caliente, sin la rigidez de las particiones","El ruido del disco","La velocidad del wifi"],"correcta":0,"porque":"La bolsa de espacio flexible: los volúmenes crecen sin reinstalar ni apagar."},{"pregunta":"¿Qué hace RAID 1?","opciones":["Espeja dos discos: si uno falla, el otro sigue","Suma dos discos sin protección","Cifra los discos"],"correcta":0,"porque":"Redundancia por espejo: la falla de un disco es un trámite, no una tragedia."},{"pregunta":"¿Por qué RAID no es copia de seguridad?","opciones":["Porque no protege de borrados, ransomware ni desastres: solo de disco roto","Porque es lento","Porque es caro"],"correcta":0,"porque":"El RAID replica también los errores y los ataques: la copia vive en otro lugar y otro tiempo."}]},{"titulo":"Programar tareas: cron y temporizadores","contenido":["cron ejecuta órdenes en horarios: crontab -e edita tu tabla personal, y cada línea tiene cinco campos de tiempo más la orden: '15 4 * * * tar czf /copias/home.tar.gz /home' hace la copia a las 4:15 cada madrugada. Los atajos @daily y @reboot cubren los casos comunes.","Los detalles que muerden: cron corre con un entorno mínimo (PATH corto, sin tu terminal), así que en los scripts de cron se usan rutas absolutas para todo. Y su salida se pierde si no la rediriges: manda los errores a un archivo para enterarte de los fallos.","Los temporizadores de systemd (.timer) son la alternativa moderna: se ven con systemctl list-timers, se registran en el diario como todo lo demás, y recuperan las ejecuciones perdidas si el equipo estaba apagado. cron es simple y universal; el timer, visible y robusto.","Reto: programa con crontab -e una tarea que cada día añada la fecha a un archivo diario.txt. Mañana comprueba que funcionó: tu primera tarea autómata."],"quiz":[{"pregunta":"¿Qué significa '0 2 * * 0' en cron?","opciones":["A las 2:00 de cada domingo","Cada 2 minutos","El día 2 del mes"],"correcta":0,"porque":"Minuto 0, hora 2, cualquier día del mes y mes, día de semana 0 (domingo)."},{"pregunta":"¿Por qué usar rutas absolutas en los scripts de cron?","opciones":["Porque cron corre con un entorno mínimo y PATH corto","Porque es más elegante","No hace falta"],"correcta":0,"porque":"El script perfecto que falla solo en cron es un clásico: el entorno es otro."},{"pregunta":"¿Qué ventaja tiene un temporizador de systemd sobre cron?","opciones":["Se registra en el diario y recupera ejecuciones perdidas","Es más viejo","No necesita sistema"],"correcta":0,"porque":"Visibilidad y recuperación: el timer es cron integrado en systemd."}]},{"titulo":"Redes a fondo: del cable al nombre","contenido":["La dirección IP de tu equipo la da casi siempre el DHCP del router; ip a la muestra, ip r muestra la puerta de enlace (la salida a internet) y /etc/resolv.conf dice qué servidores DNS traducen nombres. Esas tres piezas son la red de una máquina vista desde dentro.","El diagnóstico escalonado: ping a la puerta de enlace (¿mi red local va?), ping a 8.8.8.8 (¿salgo a internet?), ping a un nombre (¿el DNS traduce?). Cada escalón descarta una capa. traceroute muestra los saltos del camino, y ss -tulnp revela qué programas escuchan en qué puertos.","El cortafuegos decide qué entra: con ufw, la política sana es ufw default deny incoming, ufw allow ssh si hace falta, y ufw enable. Un servidor expuesto debe enseñar solo los puertos que sirven: todo lo demás, cerrado con llave.","Reto: recorre el diagnóstico completo aunque todo funcione: ip a, ip r, ping a la puerta, ping a internet, dig a un dominio. Conocer el camino en días buenos te salva en días malos."],"quiz":[{"pregunta":"¿Qué te da el DHCP?","opciones":["Tu dirección IP, la puerta de enlace y los DNS, automáticamente","El nombre del equipo","La contraseña del wifi"],"correcta":0,"porque":"Tres datos sin los que no hay red: dirección, salida y traductor de nombres."},{"pregunta":"Si ping a 8.8.8.8 funciona pero ping a un nombre no, ¿qué falla?","opciones":["El DNS","El cable","La puerta de enlace"],"correcta":0,"porque":"Llegas a internet por número pero los nombres no se traducen: el fallo está en la resolución."},{"pregunta":"¿Cuál es la política de firewall recomendada?","opciones":["Denegar todo lo entrante y abrir solo lo necesario","Abrir todo","Cerrar también lo saliente"],"correcta":0,"porque":"default deny incoming: cada puerto abierto se justifica o no existe."}]},{"titulo":"SSH en profundidad: claves, config y túneles","contenido":["ssh usuario@servidor abre la terminal remota, pero el nivel siguiente es la comodidad con seguridad: ssh-keygen crea tu par de claves (ed25519 es el tipo moderno), ssh-copy-id instala la pública en el servidor, y a partir de ahí entras sin teclear contraseña, con más seguridad que con ella.","El archivo ~/.ssh/config convierte comandos largos en palabras: defines Host miweb con su dirección, usuario y puerto, y basta ssh miweb. Los servidores serios se endurecen en sshd_config: PasswordAuthentication no, PermitRootLogin no, y cada acceso queda registrado en el diario.","El superpoder secreto son los túneles: ssh -L 8080:localhost:80 servidor hace que el puerto 80 del servidor aparezca en tu máquina como el 8080, cifrado de camino. Acceder a una base de datos remota o a una web interna sin exponerla a internet es un túnel ssh. Y scp y rsync por ssh mueven archivos con el mismo cifrado.","Reto: genera tu par de claves con ssh-keygen (sin passphrase si es laboratorio, con ella si es real), instálala en una máquina de pruebas y entra. El día que deshabilites la contraseña, habrás cerrado la puerta más golpeada de internet."],"quiz":[{"pregunta":"¿Dónde vive la clave privada de ssh?","opciones":["Solo en tu máquina: nunca viaja ni se comparte","En el servidor","En la nube"],"correcta":0,"porque":"La pública se instala en los servidores; la privada no sale de casa jamás."},{"pregunta":"¿Qué hace PasswordAuthentication no en sshd_config?","opciones":["Cierra la entrada por contraseña: solo claves","Borra las contraseñas","Apaga ssh"],"correcta":0,"porque":"Sin contraseña que probar, los ataques de fuerza bruta se quedan sin puerta."},{"pregunta":"¿Qué consigue un túnel ssh -L?","opciones":["Traer un puerto remoto a tu máquina por un canal cifrado","Más velocidad","Cambiar la IP pública"],"correcta":0,"porque":"El túnel local publica en tu localhost servicios remotos sin exponerlos a internet."}]},{"titulo":"Monitorización: el pulso de la máquina","contenido":["Saber cómo está la máquina es leer cuatro medidores: procesador (top o htop, con colores y ordenable), memoria (free -h: ojo, la 'disponible' es la que cuenta, no la 'libre', porque Linux usa el sobrante de caché), disco (df -h el espacio, du -sh carpeta lo que ocupa cada una), y actividad de disco y red (iostat, ip -s).","El síntoma 'va lento' se traduce con estos medidores: ¿procesador al 100%? Alguien calcula. ¿Memoria llena y swap subiendo? Falta RAM o hay una fuga. ¿Disco al 100%? Alguien escribe como loco. Cada cuello de botella tiene su medidor y su remedio distinto.","Los procesos se gobiernan en vivo: con top los ordenas por consumo, con renice les bajas la prioridad sin matarlos, y con kill les retiras la palabra. lsof archivo dice qué proceso tiene abierto un archivo (el clásico 'no puedo desmontar el disco porque alguien lo usa').","Reto: abre htop (o top) y deja el ordenador en reposo un minuto. Identifica el proceso más glotón y explica si es normal. Leer el pulso en calma entrena para la emergencia."],"quiz":[{"pregunta":"En free -h, ¿qué columna importa para saber si falta memoria?","opciones":["La disponible (available), no la libre","La total","La de swap únicamente"],"correcta":0,"porque":"Linux usa el sobrante como caché y lo suelta al instante: la memoria disponible es la verdad."},{"pregunta":"¿Qué mide df -h frente a du -sh?","opciones":["df el espacio del disco; du lo que ocupa una carpeta","Son lo mismo","df mide carpetas"],"correcta":0,"porque":"Disco lleno con df, culpable con du: la pareja de diagnóstico de espacio."},{"pregunta":"¿Qué hace lsof?","opciones":["Dice qué procesos tienen abierto un archivo o puerto","Lista el software","Apaga procesos"],"correcta":0,"porque":"El 'archivo ocupado' y el 'puerto en uso' se resuelven preguntando a lsof."}]},{"titulo":"Git: la máquina del tiempo del código","contenido":["Git guarda la historia completa de un proyecto: cada commit es una foto con mensaje, autor y fecha. El ciclo diario: git status (¿qué cambió?), git add (preparar los cambios), git commit -m 'mensaje' (guardar la foto). Con eso ya tienes máquina del tiempo: git log la recorre y git checkout vuelve atrás.","Las ramas son universos paralelos: git switch -c experimento crea uno donde probar sin riesgo, y si sale bien, git merge lo funde con la principal. El miedo a romper desaparece cuando romper es gratis y reversible.","Para compartir: un remoto (GitHub, GitLab o un servidor propio) recibe los commits con git push y los reparte con git pull. Clonar con git clone trae el proyecto entero con toda su historia. Y esta misma app vive en un repositorio git: cada versión que guardamos es un commit.","Reto: crea una carpeta, git init, un archivo de texto, y haz tres commits cambiando el archivo cada vez. Luego recorre la historia con git log y vuelve un paso atrás. Has viajado en el tiempo por primera vez."],"quiz":[{"pregunta":"¿Qué es un commit?","opciones":["Una foto del proyecto con mensaje, autor y fecha","Un comentario","Un archivo comprimido"],"correcta":0,"porque":"La historia es una cadena de fotos: cualquier punto se puede visitar."},{"pregunta":"¿Para qué sirven las ramas?","opciones":["Para experimentar en paralelo sin tocar lo que funciona","Para ocupar más disco","Para nada"],"correcta":0,"porque":"La rama aísla el experimento; el merge lo integra si sale bien."},{"pregunta":"¿Qué hace git push?","opciones":["Envía tus commits al repositorio remoto","Publica una web","Borra el historial"],"correcta":0,"porque":"push empuja tu historia al remoto; pull trae la de los demás: así se colabora."}]},{"titulo":"Copias profesionales: rsync y snapshots","contenido":["rsync es la copia inteligente: compara origen y destino y transfiere solo lo que cambió, conservando permisos y fechas. rsync -avh --delete origen/ destino/ deja el destino como espejo exacto (el --delete borra lo que ya no está: poderoso y peligroso a la vez). Por ssh copia entre máquinas con la misma orden.","Las copias con historia usan enlaces duros: cada día una carpeta nueva que parece completa pero solo ocupa lo que cambió (herramientas como rsnapshot lo automatizan). Un mes de copias diarias que ocupa poco más que una: la magia de los inodos compartidos.","La práctica profesional: automatiza con cron o timer, registra el resultado, vigila el espacio del destino, y ensaya restauraciones. Y la regla que no negocia: al menos una copia fuera del equipo (otro disco que se desconecta, otra máquina, otro lugar).","Reto: haz una copia espejo de una carpeta con rsync -avh, borra un archivo en el origen, repite con --delete y observa el espejo. Luego restaura el archivo desde otra copia: el ciclo completo, ensayado."],"quiz":[{"pregunta":"¿Qué transfiere rsync en la segunda ejecución?","opciones":["Solo lo que cambió desde la primera","Todo otra vez","Nada nunca"],"correcta":0,"porque":"Comparar y copiar solo diferencias es su razón de ser: rápido y ahorrativo."},{"pregunta":"¿Qué hace --delete en rsync?","opciones":["Borra en el destino lo que ya no está en el origen: espejo exacto","Borra el origen","Nada"],"correcta":0,"porque":"Espejo significa espejo: úsalo sabiendo que también replica los borrados."},{"pregunta":"¿Cómo ahorran espacio las copias con historia?","opciones":["Con enlaces duros: lo que no cambió se comparte entre días","Comprimiendo con zip","Borrando lo viejo"],"correcta":0,"porque":"Cada copia parece completa pero solo paga el cambio: inodos compartidos."}]}],"nivel":"avanzado"},{"id":"linux-casa","titulo":"Linux en casa: la terminal (muestra)","icono":"💻","lecciones":[{"titulo":"Órdenes básicas: whoami, pwd y ls","contenido":["Hasta ahora has usado el ordenador con el ratón. La terminal es otra forma: escribes una orden, pulsas Enter y el ordenador responde. Parece antigua, pero es la herramienta que usan administradores de sistemas y expertos en seguridad.","Para abrirla: menú → Sistema → Terminal, o pulsa Ctrl + Alt + T. Verás algo como estudiante@central:~$ — significa usuario estudiante, ordenador central, carpeta personal (~). El símbolo $ dice «escribe aquí».","Tres primeras órdenes: whoami dice con qué usuario estás; pwd dice en qué carpeta estás (print working directory); ls lista lo que hay en la carpeta. Escríbelas una a una y mira la respuesta.","Equivocarse con estas órdenes no rompe nada. Prueba sin miedo: la terminal te contesta y puedes volver a intentarlo."],"quiz":[{"pregunta":"¿Qué hace la orden whoami?","opciones":["Lista los archivos","Dice con qué usuario estás","Cambia de carpeta"],"correcta":1,"porque":"whoami responde con el nombre de la cuenta con la que has entrado."},{"pregunta":"En el aviso estudiante@central:~$, ¿qué significa el símbolo $?","opciones":["Que hay un error","Que puedes escribir una orden ahí","Que hace falta internet"],"correcta":1,"porque":"El $ marca el prompt: el sitio donde el sistema espera tu orden."},{"pregunta":"¿Qué orden lista el contenido de la carpeta actual?","opciones":["pwd","ls","whoami"],"correcta":1,"porque":"ls (list) muestra archivos y carpetas del directorio en el que estás."}]},{"titulo":"Moverse con cd","contenido":["cd significa change directory: cambiar de carpeta. Ejemplo: cd Documentos te mete en esa carpeta; después pwd confirma dónde estás.","Los dos puntos (..) quieren decir «la carpeta de arriba». Si escribes cd .. subes un nivel. Si escribes cd a secas (sin nombre), vuelves siempre a tu carpeta personal.","Ejercicio: averigua en qué carpeta estás con pwd; entra en Descargas (o en otra que te muestre ls); vuelve a tu carpeta personal con una sola orden (cd).","Si te atascas, pregunta a Preguntar: «¿cómo vuelvo a mi carpeta personal en la terminal?». Te dará primero una pista. Con whoami, pwd, ls y cd ya sabes quién eres, dónde estás, qué hay y cómo moverte."],"quiz":[{"pregunta":"¿Qué significa cd .. ?","opciones":["Borrar la carpeta","Subir a la carpeta de arriba","Listar archivos ocultos"],"correcta":1,"porque":".. es el directorio padre; cd .. te sube un nivel."},{"pregunta":"¿Cómo vuelves a tu carpeta personal con una sola orden?","opciones":["ls ~","cd (sin argumentos)","pwd home"],"correcta":1,"porque":"cd solo, sin ruta, te lleva a tu carpeta personal (~)."},{"pregunta":"Antes de entrar en Descargas, ¿qué orden te dice si esa carpeta existe ahí?","opciones":["ls","whoami","Ctrl + Alt + T"],"correcta":0,"porque":"ls muestra lo que hay; así compruebas si Descargas aparece en la lista."}]}]},{"id":"ciberseguridad","titulo":"Ciberseguridad","icono":"🛡️","lecciones":[{"titulo":"Seguridad 101: de qué se protege uno","contenido":["La ciberseguridad protege tres cosas, la tríada CIA: confidencialidad (que solo lo lea quien debe), integridad (que nadie lo altere sin permiso) y disponibilidad (que esté ahí cuando lo necesites). Una copia de seguridad es disponibilidad; una contraseña, confidencialidad; una firma digital, integridad.","El eslabón más débil no es técnico: eres tú. La mayoría de los ataques no rompen criptografía, engañan a personas. Por eso la seguridad empieza con hábitos: desconfiar de lo urgente y de lo demasiado bueno.","El modelo de defensa es como el de un castillo: capas. Contraseñas buenas Y segundo factor Y copias Y actualizaciones. Ninguna capa es perfecta; juntas, el atacante necesita romperlas todas.","Reto: haz inventario de tus tres tesoros digitales (fotos, documentos, cuentas) y escribe para cada uno qué pasaría si hoy desaparecieran. Esa lista es el inicio de tu plan de seguridad."],"quiz":[{"pregunta":"¿Qué es la tríada CIA?","opciones":["Confidencialidad, integridad y disponibilidad","La agencia americana","Tres antivirus"],"correcta":0,"porque":"Los tres pilares que toda medida de seguridad protege."},{"pregunta":"¿Cuál es el eslabón más débil de la seguridad?","opciones":["La persona","El cable","El procesador"],"correcta":0,"porque":"La mayoría de ataques engañan a humanos, no rompen máquinas."},{"pregunta":"¿Qué es la defensa en capas?","opciones":["Varias medidas superpuestas, por si una falla","Poner dos contraseñas iguales","Un tipo de cortafuegos"],"correcta":0,"porque":"Contraseña + segundo factor + copias + actualizaciones: romper una no basta."}]},{"titulo":"Contraseñas y segundo factor: las llaves de tu vida","contenido":["Una contraseña se rompe por fuerza bruta (probar todas) o por diccionario (probar las comunes). '123456' y 'qwerty' caen en microsegundos; una frase larga como 'caballo-verde-come-7-piedras' resistiría siglos. La longitud manda: cada carácter extra multiplica las combinaciones.","Jamás reutilices contraseñas: cuando una web cualquiera es hackeada, los atacantes prueban tu correo y esa clave en el banco, el correo y las redes. Es la reutilización, no la sofisticación, lo que tumba a la gente.","El gestor de contraseñas resuelve la paradoja: una clave maestra fuerte que tú recuerdas, y claves únicas y largas que el gestor recuerda por ti. Y encima, el segundo factor (2FA): aunque roben tu contraseña, sin tu móvil no entran.","Reto: activa hoy el segundo factor en tu correo (es la llave maestra de todas tus cuentas, porque a él llegan los 'olvidé mi contraseña'). Es la media hora mejor invertida en seguridad de tu vida."],"quiz":[{"pregunta":"¿Qué hace fuerte a una contraseña?","opciones":["Sobre todo la longitud: cada carácter multiplica las combinaciones","Poner símbolos raros solo","Cambiarla cada día"],"correcta":0,"porque":"Una frase larga supera a una clave corta complicada: la fuerza bruta crece exponencialmente con la longitud."},{"pregunta":"¿Por qué no reutilizar contraseñas?","opciones":["Porque si una web cae, prueban esa clave en todas tus cuentas","Porque se gasta","Porque se olvida"],"correcta":0,"porque":"Las filtraciones encadenadas son la causa número uno de cuentas robadas."},{"pregunta":"¿Qué aporta el segundo factor?","opciones":["Que ni con la contraseña robada puedan entrar sin tu dispositivo","Doble de velocidad","Mejor wifi"],"correcta":0,"porque":"Algo que sabes + algo que tienes: el robo de uno no basta."}]},{"titulo":"Phishing: el arte del engaño","contenido":["El phishing es la pesca de incautos: un mensaje que parece de tu banco, de Correos o de tu jefe, con urgencia ('su cuenta será bloqueada') y un enlace que lleva a una copia falsa. Escribes tu clave y se la acabas de regalar al pescador.","Las señales: urgencia artificial, remitente con dominio casi igual (banc0.com), enlaces que no coinciden con lo que dicen (pasa el dedo encima y mira la dirección real), adjuntos inesperados y premios que no pediste. Ningún banco pide tu clave por correo. Nunca.","La variante spear phishing es personalizada: han leído tus redes y el mensaje menciona tu empresa, tu pueblo, tu hija. Cuanta más información pública cuelgas, más creíble es el anzuelo. Lo que publicas es munición.","Reto: abre tu carpeta de spam y analiza tres mensajes con lupa: remitente real, enlace real, gancho emocional. Identificar el patrón es la vacuna."],"quiz":[{"pregunta":"¿Qué es el phishing?","opciones":["Suplantar una entidad de confianza para robar credenciales","Pescar con caña","Un antivirus"],"correcta":0,"porque":"El ataque más común del mundo: ingeniería social con un enlace falso."},{"pregunta":"¿Cuál es la señal más fiable de un correo falso?","opciones":["La urgencia y un enlace cuya dirección real no coincide","Que llegue por la mañana","Que tenga faltas solamente"],"correcta":0,"porque":"La prisa es el anzuelo: quien te apura para que no pienses, quiere engañarte."},{"pregunta":"¿Qué es el spear phishing?","opciones":["Phishing personalizado con tus datos públicos","Pesca submarina","Un virus de red"],"correcta":0,"porque":"Cuanto más publicas en redes, más a medida te fabrican el engaño."}]},{"titulo":"Malware: bichos con nombres de bestiario","contenido":["El malware es software con malas intenciones, y cada familia tiene su oficio: el virus se pega a programas y necesita que lo ejecutes; el gusano se propaga solo por la red; el troyano entra disfrazado de programa útil (como el caballo de Troya: tú abres la puerta).","El ransomware es el secuestro digital: cifra tus archivos y pide rescate. Se defiende antes, no después: copias de seguridad desconectadas (un disco que no esté siempre enchufado), sistema actualizado y no abrir adjuntos inesperados. Con copia buena, el secuestrador se queda sin negocio.","El spyware espía (graba teclas, roba claves), el adware llena de anuncios, y la botnet convierte tu equipo en soldado zombie de un ejército que ataca a otros. La señal común: el equipo va lento, se calienta o hace cosas raras.","Reto: revisa las aplicaciones instaladas en tu móvil y borra las que no uses o no recuerdes instalar. Cada app es una puerta; las que no usas son puertas sin vigilancia."],"quiz":[{"pregunta":"¿Qué diferencia a un gusano de un virus?","opciones":["El gusano se propaga solo; el virus necesita que ejecutes algo","El gusano es verde","Son iguales"],"correcta":0,"porque":"El virus viaja pegado a un archivo que abres; el gusano viaja solo por la red."},{"pregunta":"¿Cuál es la defensa real contra el ransomware?","opciones":["Copias de seguridad desconectadas y actualizaciones","Pagar rápido","Apagar la pantalla"],"correcta":0,"porque":"Con copia reciente, el secuestro pierde su poder: restauras y sigues."},{"pregunta":"¿Qué es una botnet?","opciones":["Un ejército de equipos infectados controlados a distancia","Una red de pesca","Un programa de limpieza"],"correcta":0,"porque":"Tu equipo zombie ataca a otros sin que lo sepas: por eso importa no ser parte."}]},{"titulo":"Cifrado: secretos que se pueden enseñar","contenido":["Cifrar es transformar un mensaje en galimatías que solo la clave correcta deshace. El cifrado simétrico usa la misma clave para cerrar y abrir (rápido, ideal para discos y archivos), y el asimétrico usa un par: la pública cifra, la privada descifra. Así funciona el candadito del navegador.","El https de cada web es criptografía en acción: tu navegador y el servidor acuerdan una clave secreta a la vista de todos (Diffie-Hellman), verifican la identidad del sitio con certificados firmados, y a partir de ahí todo viaja cifrado. Por eso en el wifi de la cafetería nadie lee tu banco.","El hash es el primo sin retorno: de cualquier archivo produce una huella fija y corta, y de la huella no se vuelve atrás. Sirve para guardar contraseñas (se guarda la huella, no la clave) y para comprobar que una descarga no fue manipulada.","Reto: calcula la huella de un archivo con sha256sum (Linux) y vuelve a hacerlo tras cambiar una letra. La huella cambia por completo: así se detecta cualquier manipulación."],"quiz":[{"pregunta":"¿Qué diferencia hay entre cifrado simétrico y asimétrico?","opciones":["El simétrico usa una clave; el asimétrico, un par pública-privada","El color del candado","Ninguna"],"correcta":0,"porque":"La clave pública cifra y solo la privada abre: así se comparten secretos sin verse."},{"pregunta":"¿Qué hace https?","opciones":["Cifra la conversación y verifica la identidad del sitio","Acelera la web","Quita la publicidad"],"correcta":0,"porque":"Candado = canal cifrado + certificado: ni escuchas ni impostores."},{"pregunta":"¿Para qué sirve un hash?","opciones":["Como huella irreversible: verificar integridad y guardar contraseñas","Para cocinar patatas","Para cifrar mensajes largos"],"correcta":0,"porque":"Del archivo a la huella sí; de la huella al archivo, no. Perfecto para detectar cambios."}]},{"titulo":"Redes y ataques: cómo te miran y cómo miras tú","contenido":["Toda red habla por puertos: cada servicio (web, correo, ssh) escucha en el suyo. Un escaneo de puertos (nmap) es llamar puerta a puerta para ver cuáles responden: lo usan los atacantes para buscar huecos y los defensores para cerrarlos. El primer mandamiento: todo puerto abierto que no necesitas es una ventana sin cerrar.","El ataque de denegación de servicio (DDoS) no roba nada: satura. Miles de equipos zombie piden a la vez hasta que el servidor no puede atender a nadie legítimo. Es un atasco provocado en la puerta de tu tienda.","El hombre en el medio (MITM) se interpone en la conversación: el clásico es el wifi falso de la cafetería con nombre tentador. Defensas: https en todo, no instalar certificados que te ofrezcan, y VPN cuando uses redes ajenas.","Reto: lista los servicios que escuchan en tu equipo (ss -tuln en Linux). ¿Los reconoces todos? Cada línea desconocida merece una búsqueda."],"quiz":[{"pregunta":"¿Qué es un escaneo de puertos?","opciones":["Probar qué puertos responden en una máquina","Limpiar el teclado","Cambiar la IP cada hora"],"correcta":0,"porque":"nmap llama puerta a puerta: herramienta de atacantes y defensores por igual."},{"pregunta":"¿Qué hace un ataque DDoS?","opciones":["Satura el servicio con peticiones masivas de equipos zombie","Roba contraseñas","Cifra archivos"],"correcta":0,"porque":"No entra en casa: bloquea la puerta con una multitud."},{"pregunta":"¿Cómo te defiendes en un wifi público?","opciones":["Https, nada de certificados extraños, y VPN","Hablar bajito","Apagar la pantalla"],"correcta":0,"porque":"El wifi falso te convierte en víctima de un hombre en el medio; el cifrado lo deja ciego."}]},{"titulo":"Seguridad del sistema: parches y mínimos","contenido":["Casi todos los hackeos famosos explotan fallos que ya tenían parche publicado. Actualizar no es estética: es cerrar las puertas que los atacantes ya conocen. El equipo desactualizado es una casa con la cerradura rota anunciada en internet.","El principio de mínimo privilegio ordena conceder solo los permisos imprescindibles: la app de linterna no necesita tus contactos, el empleado de almacén no necesita la contabilidad. Si cada uno solo puede lo justo, un error o un robo acotan el daño.","Los registros (logs) son la caja negra: quién entró, cuándo, qué hizo. Revisarlos descubre intrusiones que pasarían invisibles. En Linux viven en /var/log; saber leerlos es saber escuchar a tu máquina.","Reto: comprueba cuándo fue la última actualización de tu móvil y de tu ordenador. Si hace más de un mes, programa la actualización hoy. Es la medida de seguridad con mejor relación esfuerzo/protección que existe."],"quiz":[{"pregunta":"¿Por qué actualizar es la medida número uno?","opciones":["Porque la mayoría de at
