aques usan fallos ya parcheados","Porque va más rápido","Por las nuevas funciones"],"correcta":0,"porque":"El parche cierra la puerta que el atacante ya conoce: no actualizar es dejarla abierta."},{"pregunta":"¿Qué es el principio de mínimo privilegio?","opciones":["Conceder solo los permisos estrictamente necesarios","Pagar lo mínimo","Usar poco el ordenador"],"correcta":0,"porque":"Menos permisos = menos daño posible si algo o alguien se compromete."},{"pregunta":"¿Para qué sirven los registros?","opciones":["Para saber quién hizo qué y cuándo, y detectar intrusiones","Para gastar disco","Para nada"],"correcta":0,"porque":"La caja negra del sistema: sin logs, un intruso es invisible."}]},{"titulo":"Privacidad y huella digital: lo que cuentas sin saberlo","contenido":["Cada servicio gratis se paga con datos: tus búsquedas, tu ubicación, tus contactos, cuánto tardas en leer cada pantalla. La huella digital es todo eso sumado, y con poco se sabe mucho: cuatro ubicaciones bastan para identificar a casi cualquier persona en un registro 'anónimo'.","Los metadatos cuentan la historia sin abrir el sobre: a quién llamas, cuándo, desde dónde, cuánto. La foto inocente lleva la hora y las coordenadas GPS de tu casa. Antes de compartir, la pregunta es: ¿quiero que esto sea público para siempre? Porque internet no olvida.","Defensas razonables: revisar permisos de apps, desactivar la ubicación por defecto, navegadores que bloquean rastreadores, y pensar antes de publicar datos de terceros (tus hijos tienen derecho a su propia huella).","Reto: busca tu nombre entre comillas en un buscador y revisa qué aparece. Luego entra en los permisos de tu móvil y quita la ubicación a toda app que no la necesite para funcionar."],"quiz":[{"pregunta":"¿Cómo se pagan los servicios 'gratis'?","opciones":["Con tus datos y tu atención","Con publicidad del ayuntamiento","No se pagan"],"correcta":0,"porque":"Si no pagas por el producto, el producto eres tú: la huella digital es la moneda."},{"pregunta":"¿Qué son los metadatos?","opciones":["Los datos sobre los datos: cuándo, dónde, con quién","Un virus","La letra pequeña solamente"],"correcta":0,"porque":"Sin leer el contenido, los metadatos dibujan tu vida: horarios, lugares, relaciones."},{"pregunta":"¿Por qué pensar antes de publicar fotos con ubicación?","opciones":["Porque revelan dónde vives y cuándo no estás","Porque pesan mucho","Porque salen mal"],"correcta":0,"porque":"Las coordenadas GPS de una foto son una invitación técnica al ladrón y al acosador."}]},{"titulo":"Hacking ético y oficio de defensor","contenido":["El hacking ético es atacar sistemas con permiso para encontrar sus fallos antes que los malos: pentesting. Las empresas pagan por que les rompan la puerta en un ejercicio controlado, y los programas de recompensas (bug bounty) pagan a quien reporta vulnerabilidades en lugar de venderlas.","La línea legal es clara: sin autorización escrita, probar un sistema ajeno es delito, aunque sea 'por curiosidad' o 'por ayudar'. El mismo conocimiento es herramienta o arma según el permiso: el cerrajero y el ladrón saben lo mismo de las cerraduras.","El camino del defensor: aprender redes y Linux, montar un laboratorio en máquinas virtuales propias, practicar en plataformas legales de retos (máquinas vulnerables hechas para practicar), y leer los informes de incidentes reales. Es una de las profesiones con más demanda del mundo.","Reto final: crea una cuenta en una plataforma legal de retos de seguridad para principiantes y resuelve el primer ejercicio. Practicar en tu laboratorio es aprender; practicar en sistemas ajenos sin permiso es delito."],"quiz":[{"pregunta":"¿Qué es el hacking ético?","opciones":["Atacar sistemas con permiso para mejorar su defensa","Hackear solo un poquito","Un programa antivirus"],"correcta":0,"porque":"Mismo conocimiento, con autorización: el pentesting encuentra los fallos antes que el criminal."},{"pregunta":"¿Qué hace legal o ilegal una prueba de seguridad?","opciones":["La autorización escrita del dueño del sistema","La buena intención","Que sea de día"],"correcta":0,"porque":"Sin permiso, 'curiosear' un sistema ajeno es delito en casi todo el mundo."},{"pregunta":"¿Qué es un programa de bug bounty?","opciones":["Recompensas por reportar vulnerabilidades en lugar de explotarlas","Cazar insectos","Un sorteo de apps"],"correcta":0,"porque":"Las empresas convierten a los curiosos en aliados: mejor pagar al que avisa."}]}],"nivel":"avanzado"},{"id":"ciberseguridad-avanzada","titulo":"Ciberseguridad avanzada (máster)","icono":"🎯","lecciones":[{"titulo":"Metodología del pentesting: el ataque ordenado","contenido":["El pentesting profesional no es 'probar cosas': es un método con fases. Reconocimiento (qué hay), escaneo (qué está abierto y qué versión corre), análisis de vulnerabilidades (dónde puede ceder), explotación (entrar de verdad, en el laboratorio o con permiso), post-explotación (qué se alcanza desde dentro) y el informe (traducirlo todo a decisiones para el cliente).","Los marcos ordenan el caos: el MITRE ATT&CK cataloga las tácticas y técnicas reales de los atacantes (de la ejecución inicial a la exfiltración), y el kill chain describe la secuencia típica de una intrusión. Conocer el mapa del adversario es la mitad de defenderse de él.","Todo pentest serio empieza con un contrato: alcance (qué sistemas), horarios, límites (¿se puede hacer denegación de servicio?), contactos de emergencia y la autorización firmada. Ese papel es la diferencia legal entre un consultor y un delincuente: misma técnica, distinto permiso.","Reto: escribe el plan de un pentest ficticio sobre tu propia red doméstica: qué incluirías en el alcance, qué quedaría fuera y por qué. Definir límites es la primera habilidad del profesional."],"quiz":[{"pregunta":"¿Cuál es la primera fase de un pentest?","opciones":["El reconocimiento: saber qué hay antes de tocar nada","Explotar","Escribir el informe"],"correcta":0,"porque":"La información manda: cada fase se apoya en la anterior."},{"pregunta":"¿Qué es MITRE ATT&CK?","opciones":["El catálogo de tácticas y técnicas reales de los atacantes","Un antivirus","Una empresa de software"],"correcta":0,"porque":"Es el idioma común entre atacantes simulados y defensores: cada técnica tiene su ficha."},{"pregunta":"¿Qué separa al pentester del criminal?","opciones":["La autorización escrita y el alcance firmado","La herramienta usada","La hora del día"],"correcta":0,"porque":"Mismo conocimiento, distinto permiso: el contrato es la frontera legal."}]},{"titulo":"OSINT: investigar con fuentes abiertas","contenido":["Antes de tocar una red, el atacante (y el auditor) mira lo público: OSINT es el arte de reconstruir un objetivo solo con lo que ya está publicado. Dominios y subdominios (registros DNS, certificados públicos en crt.sh), metadatos de documentos colgados en la web, perfiles de empleados, fotos con ubicación, filtraciones antiguas.","Las herramientas clásicas: buscadores con operadores (site:, filetype:, inurl: — el llamado Google dorking), theHarvester para recolectar correos y nombres, Shodan (el buscador de dispositivos conectados: cámaras, routers y servidores con la cara al aire) y los archivos de la Wayback Machine para ver lo que se borró.","La lección defensiva es incómoda: casi todo lo que un atacante necesita para un spear phishing creíble lo publicaste tú. Hacer OSINT sobre uno mismo (o sobre la propia empresa) es el ejercicio más revelador de la seguridad: ver lo que el mundo ya sabe de ti.","Reto: haz OSINT sobre tu propio nombre y dominios que controles. Documenta qué encontraste, qué no debería ser público y qué vas a retirar. Ese informe es tu primera auditoría OSINT."],"quiz":[{"pregunta":"¿Qué es OSINT?","opciones":["Investigar un objetivo solo con fuentes públicas","Un sistema operativo","Un tipo de ataque"],"correcta":0,"porque":"Open Source Intelligence: la información ya está ahí; el arte es reunirla."},{"pregunta":"¿Qué encuentra Shodan?","opciones":["Dispositivos conectados a internet y sus servicios expuestos","Recetas","Vuelos baratos"],"correcta":0,"porque":"El buscador de máquinas, no de páginas: revela lo que nadie debería haber expuesto."},{"pregunta":"¿Cuál es la lección defensiva del OSINT?","opciones":["Que gran parte de lo que un atacante usa lo publicamos nosotros mismos","Que hay que borrarse de internet","Que los buscadores mienten"],"correcta":0,"porque":"La huella pública es munición: minimizarla es defensa preventiva."}]},{"titulo":"Escaneo avanzado: nmap en serio","contenido":["nmap es la navaja suiza del reconocimiento, y su modo básico es solo el principio. -sV detecta versiones exactas de los servicios (no 'hay web', sino 'Apache 2.4.49', que ya es una pista de vulnerabilidad), -O adivina el sistema operativo por cómo responde la pila TCP/IP, y -p- recorre los 65.535 puertos, porque lo interesante rara vez está en los primeros mil.","Los scripts NSE (-sC o --script) convierten el escáner en auditor: hay cientos de guiones que comprueban vulnerabilidades conocidas, contraseñas por defecto y configuraciones débiles. Y los escaneos sigilosos (-sS, SYN sin completar la conexión) hacen menos ruido en los registros.","Leer un escaneo es un oficio: un puerto 'filtered' habla de firewall, 'closed' de máquina viva sin servicio, 'open' de una puerta a investigar. La salida de nmap es la lista de la compra del pentester: cada línea es una hipótesis que verificar.","Reto (en tu propia red o laboratorio): escanea tu router con nmap -sV y compara los servicios que aparecen con los que creías tener abiertos. Todo lo inesperado se investiga o se cierra."],"quiz":[{"pregunta":"¿Qué aporta nmap -sV?","opciones":["La versión exacta del servicio que responde","Más velocidad","El nombre del administrador"],"correcta":0,"porque":"Con la versión se consultan las vulnerabilidades conocidas: el escaneo se vuelve hipótesis."},{"pregunta":"¿Qué significa un puerto 'filtered'?","opciones":["Que un firewall está filtrando esa conexión","Que el puerto está roto","Que no hay máquina"],"correcta":0,"porque":"El filtrado delata al guardián: distingo entre puerto cerrado y puerto vigilado."},{"pregunta":"¿Qué son los scripts NSE?","opciones":["Guiones de nmap que auditan vulnerabilidades y configuraciones concretas","Virus","Traductores"],"correcta":0,"porque":"El escáner se convierte en auditor: cientos de comprobaciones listas para usar."}]},{"titulo":"Inyección SQL: la llave maestra de las webs","contenido":["La inyección SQL nace de un error simple: construir consultas pegando texto del usuario. Si el login hace 'WHERE usuario = «$u» AND clave = «$c»' y escribes como usuario admin'-- , el resto de la consulta queda comentada y entras sin clave. Una comilla en el sitio exacto, y la base de datos obedece al visitante.","Las variantes escalan: UNION-based extrae datos de otras tablas en la misma respuesta; la ciega (blind) infiere bit a bit preguntando con verdadero/falso cuando no hay salida visible; sqlmap automatiza todo el proceso y llega a volcar bases de datos enteras. En el laboratorio, ver esto funcionar enseña más que cien lecturas.","La defensa es una sola y absoluta: consultas parametrizadas (prepared statements), donde los datos viajan aparte del código SQL y jamás se interpretan como órdenes. Añade el principio de mínimo privilegio en la base de datos y un WAF como capa extra. La inyección SQL lleva veinticinco años matando webs por una mala costumbre que ya tiene cura.","Reto (solo en laboratorio legal, como DVWA o las máquinas de práctica): explota un login con admin'-- y luego corrige el código con una consulta parametrizada. Romper y reparar lo mismo es la lección completa."],"quiz":[{"pregunta":"¿Cuál es la causa raíz de la inyección SQL?","opciones":["Pegar datos del usuario dentro de la consulta como si fueran código","Bases de datos viejas","Contraseñas cortas"],"correcta":0,"porque":"Cuando el dato se interpreta como orden, el visitante programa tu base de datos."},{"pregunta":"¿Qué hace sqlmap?","opciones":["Automatiza la detección y explotación de inyecciones SQL","Mapea redes wifi","Cifra bases de datos"],"correcta":0,"porque":"La herramienta que convierte el ataque manual en proceso: por eso la defensa debe ser estructural."},{"pregunta":"¿Cuál es la defensa definitiva?","opciones":["Consultas parametrizadas: los datos nunca se ejecutan como código","Ocultar errores","Cambiar de puerto"],"correcta":0,"porque":"Los prepared statements separan código y datos por diseño: la inyección queda imposible."}]},{"titulo":"XSS y el Top 10 de OWASP","contenido":["El Cross-Site Scripting (XSS) inyecta JavaScript en páginas que otros ven: un comentario que guarda un <script> y se ejecuta en el navegador de cada visitante. El reflejado viaja en el enlace, el almacenado vive en la base de datos, y el de DOM nace en el propio JavaScript de la página. Con XSS se roban sesiones y se suplantan usuarios sin tocar el servidor.","El OWASP Top 10 es la lista de los fallos más graves de las aplicaciones web, revisada por la comunidad: inyecciones, control de acceso roto (poder ver lo de otros cambiando un número en la URL), fallos criptográficos, diseño inseguro, configuración débil, componentes vulnerables y desactualizados, fallos de autenticación, integridad de software, registro insuficiente y SSRF (hacer que el servidor pida por ti).","Las defensas del XSS: escapar toda salida según su contexto (nunca imprimir texto de usuario como HTML crudo), Content Security Policy para limitar qué scripts pueden correr, y cookies HttpOnly para que el JavaScript no pueda robar la sesión. La regla madre de la web: jamás confíes en la entrada del usuario, en ninguna dirección.","Reto (laboratorio): en una máquina de práctica, consigue que un campo de comentarios muestre un alert(1). Luego corrígelo escapando la salida. Entenderás el XSS para siempre."],"quiz":[{"pregunta":"¿Qué permite un XSS almacenado?","opciones":["Ejecutar JavaScript en el navegador de todos los que vean esa página","Borrar el servidor directamente","Cifrar la web"],"correcta":0,"porque":"El código malicioso vive en la propia página: cada visitante lo ejecuta confiado."},{"pregunta":"¿Qué es el 'control de acceso roto'?","opciones":["Poder acceder a recursos ajenos, por ejemplo cambiando un id en la URL","Una puerta estropeada","Un error 404"],"correcta":0,"porque":"Si el servidor no verifica permisos en cada petición, la URL es una llave universal."},{"pregunta":"¿Cuál es la defensa base contra XSS?","opciones":["Escapar toda salida según contexto, más CSP y cookies HttpOnly","Pedir a los usuarios que no escriban scripts","Usar http"],"correcta":0,"porque":"El texto del usuario se imprime como texto, nunca como código: la confianza cero también vale dentro."}]},{"titulo":"Desbordamiento de búfer: el fallo fundacional","contenido":["El desbordamiento de búfer es el fallo que enseñó seguridad a la informática: un programa reserva espacio para 64 caracteres y el atacante escribe 200. Lo que sobra pisa la memoria vecina, y si entre lo pisado está la dirección de retorno de la función, el atacante decide a dónde salta el programa: ejecuta su código con los permisos de la víctima.","Las defensas se construyeron capa a capa contra este fallo: el bit NX marca la memoria de datos como no ejecutable, ASLR baraja las direcciones en cada ejecución para que el atacante no sepa dónde saltar, los canarios de pila detectan la pisadura antes de saltar, y los lenguajes con gestión de memoria (Rust, Go) lo hacen imposible por diseño.","Entenderlo de verdad exige verlo: en el laboratorio se compila un programa vulnerable sin protecciones, se calcula el desplazamiento exacto hasta la dirección de retorno y se toma el control del flujo. Es difícil y es revelador: después de un buffer overflow hecho a mano, miras todo el código con otros ojos.","Reto (laboratorio): con un programa vulnerable de práctica, localiza con un depurador cuántos bytes separan el búfer de la dirección de retorno. No hace falta explotarlo: ver la geometría del fallo ya es la lección."],"quiz":[{"pregunta":"¿Qué consigue un desbordamiento de búfer?","opciones":["Pisar memoria vecina y, con suerte del atacante, redirigir la ejecución","Limpiar la memoria","Acelerar el programa"],"correcta":0,"porque":"Escribir más de lo que cabe convierte datos en control del programa."},{"pregunta":"¿Qué hace ASLR?","opciones":["Baraja las direcciones de memoria en cada ejecución","Acelera la CPU","Cifra la pila"],"correcta":0,"porque":"Si el atacante no sabe dónde está nada, su salto calculado falla."},{"pregunta":"¿Por qué Rust previene este fallo?","opciones":["Porque su gestión de memoria lo hace imposible por diseño, en compilación","Porque es nuevo","Porque es más lento"],"correcta":0,"porque":"El compilador de Rust rechaza los accesos fuera de rango: la clase entera de errores desaparece."}]},{"titulo":"Escalada de privilegios: de usuario a root","contenido":["Entrar es el principio: el primer acceso suele ser un usuario sin poder. La escalada de privilegios busca convertirse en administrador aprovechando errores de configuración más que magia. En Linux se mira: qué puede hacer este usuario con sudo (sudo -l), qué binarios tienen el bit SUID (se ejecutan como root), tareas de cron que corren como root con scripts editables, y claves olvidadas en archivos de texto.","En Windows el catálogo es paralelo: servicios con rutas sin comillas o con permisos débiles, credenciales en el registro o en archivos de despliegue, tokens suplantables y la memoria del sistema de autenticación. Herramientas como linpeas y winpeas automatizan el reconocimiento: recorren el sistema señalando cada puerta mal cerrada.","La defensa es higiene: parches al día, sudo mínimo y concreto, sin SUID innecesarios, sin credenciales escritas en archivos, y registros que canten cuando alguien escala. El atacante busca el error del administrador; el administrador se adelanta auditando.","Reto (en tu máquina o laboratorio): ejecuta sudo -l y find / -perm -4000 2>/dev/null y justifica cada línea que aparezca. Lo que no puedas justificar es una vía de escalada en potencia."],"quiz":[{"pregunta":"¿Qué es un binario con bit SUID?","opciones":["Uno que se ejecuta con los permisos de su dueño, a menudo root","Un virus","Un archivo oculto"],"correcta":0,"porque":"Si ese binario permite escapar a una shell, quien lo ejecuta es root: objetivo clásico."},{"pregunta":"¿Qué hacen linpeas y winpeas?","opciones":["Recorren el sistema señalando configuraciones débiles para escalar privilegios","Limpian el disco","Cifran archivos"],"correcta":0,"porque":"Automatizan el reconocimiento local: cada línea marcada es una hipótesis de escalada."},{"pregunta":"¿Cuál es la defensa contra la escalada?","opciones":["Higiene: parches, sudo mínimo, nada de credenciales en texto plano","Apagar de noche","Cambiar los iconos"],"correcta":0,"porque":"La escalada se alimenta de descuidos de configuración: la auditoría regular los seca."}]},{"titulo":"Active Directory: el corazón de la empresa","contenido":["La mayoría de las empresas gobiernan sus máquinas Windows con Active Directory: un directorio central que sabe quién es quién, qué puede hacer cada uno y en qué máquinas puede entrar. Kerberos es su protocolo de autenticación: tickets con caducidad que acreditan identidad sin mandar contraseñas por la red.","Sus ataques clásicos son lección obligada: el pass-the-hash usa el hash robado de una contraseña directamente, sin necesidad de conocerla; el kerberoasting pide tickets de cuentas de servicio y los rompe fuera de línea, a su ritmo; y el abuso de delegaciones y permisos mal dados convierte una cuenta corriente en camino hacia el dominio entero.","La defensa empieza por la arquitectura: modelo de niveles (las cuentas de administrador del dominio jamás inician sesión en estaciones de trabajo), contraseñas de servicio largas y gestionadas, monitorización de peticiones anómalas de tickets, y el principio de mínimo privilegio aplicado con lupa. Caer el dominio es caer todo: por eso es la joya que más se protege.","Reto: dibuja el flujo de Kerberos (usuario, centro de tickets, servicio) y marca en qué punto actúa cada ataque nombrado. Entender el protocolo es entender sus fallos."],"quiz":[{"pregunta":"¿Qué es Active Directory?","opciones":["El directorio central que gobierna usuarios y máquinas en las empresas Windows","Un antivirus","Una red social corporativa"],"correcta":0,"porque":"Quien controla el dominio, controla la empresa: por eso es el objetivo número uno."},{"pregunta":"¿Qué es el pass-the-hash?","opciones":["Usar el hash robado de una contraseña directamente, sin conocerla","Pasarse un hash frito","Un tipo de cifrado"],"correcta":0,"porque":"Si el sistema acepta el hash como credencial, el atacante no necesita más: hay que proteger los hashes como contraseñas."},{"pregunta":"¿Qué protege el modelo de niveles (tiering)?","opciones":["Que las cuentas del dominio no se expongan en máquinas corrientes","Los cables","La impresora"],"correcta":0,"porque":"Si el administrador del dominio nunca toca una estación vulnerable, su hash nunca se roba allí."}]},{"titulo":"Movimiento lateral y pivoting","contenido":["El primer equipo comprometido casi nunca es el objetivo: es la playa de desembarco. El movimiento lateral es el arte de saltar de máquina en máquina por dentro de la red, usando credenciales reutilizadas, confianzas entre sistemas y servicios internos que nadie vigila porque 'están dentro'.","El pivoting convierte la máquina comprometida en trampolín: su tráfico se reencamina (con túneles ssh, proxies SOCKS o herramientas como chisel) para alcanzar segmentos de red invisibles desde fuera. La máquina víctima se convierte en las piernas del atacante.","Las defensas son de arquitectura: segmentar la red (que el puesto de oficina no pueda hablar con el servidor de bases de datos), autenticación fuerte entre servicios, y detección interna, porque el movimiento lateral hace ruido si alguien escucha: conexiones raras entre equipos que nunca hablan, cuentas usadas donde no toca.","Reto: dibuja la red de una empresa imaginaria y marca dónde pondrías los cortafuegos internos para que una máquina caída no arrastre a las demás. La segmentación en papel es gratis; en producción, salva."],"quiz":[{"pregunta":"¿Qué es el movimiento lateral?","opciones":["Saltar de máquina en máquina dentro de la red comprometida","Caminar de lado","Cambiar de wifi"],"correcta":0,"porque":"La primera brecha es rara vez el objetivo: el tesoro está más adentro."},{"pregunta":"¿Qué hace el pivoting?","opciones":["Usar una máquina comprometida como trampolín hacia redes internas","Girar discos","Actualizar sistemas"],"correcta":0,"porque":"El atacante se mueve 'a través' de la víctima: sus piernas dentro de tu red."},{"pregunta":"¿Qué defensa estructural frena el movimiento lateral?","opciones":["La segmentación de red con cortafuegos internos","Contraseñas más largas","Apagar las luces"],"correcta":0,"porque":"Si cada zona solo habla con lo imprescindible, la brecha queda acotada a su celda."}]},{"titulo":"Ataques a wifi: del handshake al evil twin","contenido":["El wifi se ataca en el aire: cualquiera al alcance escucha. En WPA2, el momento débil es el handshake de conexión: capturarlo (airodump) y forzarlo con diccionario fuera de línea (aircrack) revela contraseñas débiles. WPA3 cerró esa vía con un intercambio resistente a ataques offline (SAE): otra razón para actualizar equipos.","El evil twin es el clon: un punto de acceso falso con el nombre del real y más señal. Las víctimas conectan al impostor y todo su tráfico pasa por el atacante, que puede mostrar portales cautivos pidiendo contraseñas. La defensa del usuario: desconfiar de wifi abiertas y duplicadas, y usar VPN en redes ajenas.","También cuentan los descuidos: WPS activado (su PIN se fuerza en horas), contraseñas por defecto en el router, y el router mismo sin actualizar, que es un ordenador olvidado con la puerta a internet. Auditar el propio wifi con las herramientas del atacante, en tu casa y con tu permiso, es el ejercicio estándar.","Reto: entra en la configuración de tu router, comprueba que usa WPA2 o WPA3 (nunca WEP ni WPA1), desactiva WPS, cambia la contraseña de administración por defecto y actualiza su firmware. Cuatro gestos que cierran el frente doméstico."],"quiz":[{"pregunta":"¿Qué se captura en un ataque a WPA2?","opciones":["El handshake de conexión, para forzarlo fuera de línea","La antena","El cable de fibra"],"correcta":0,"porque":"Con el handshake capturado, el diccionario trabaja sin prisa ni testigos."},{"pregunta":"¿Qué es un evil twin?","opciones":["Un punto de acceso falso que imita al legítimo","Un hermano malo","Un router roto"],"correcta":0,"porque":"Más señal, mismo nombre: las víctimas conectan solas al impostor."},{"pregunta":"¿Qué mejora trajo WPA3?","opciones":["El intercambio SAE, resistente a ataques de diccionario offline","Más luces","Mayor alcance"],"correcta":0,"porque":"Aunque capturen el intercambio, ya no sirve para fuerza bruta fuera de línea."}]},{"titulo":"Ingeniería inversa y análisis de malware","contenido":["La ingeniería inversa desmonta un programa sin su código fuente: el desensamblador (Ghidra, libre y de la NSA) traduce el binario a ensamblador, el descompilador lo aproxima a algo legible, y el depurador (x64dbg, gdb) lo ejecuta paso a paso mientras observas registros y memoria. Leer un ejecutable así es autopsia de software.","El análisis de malware se hace en jaula: una máquina virtual aislada, sin red real, con instantáneas para volver atrás. El análisis estático lo mira sin ejecutarlo (cadenas de texto, imports, empaquetadores) y el dinámico lo ejecuta observando todo: qué archivos toca, qué claves de registro crea, a qué servidores llama (con la red simulada por herramientas como INetSim).","El malware se defiende: se empaqueta y ofusca para no ser leído, detecta máquinas virtuales y depuradores para comportarse bien en el laboratorio, y cifra sus comunicaciones. Analista y autor libran un duelo de capas: cada muestra analizada enseña trucos nuevos de ambos lados.","Reto (solo con muestras de práctica y en máquina virtual aislada): analiza estáticamente un ejecutable de entrenamiento con Ghidra y lista sus funciones importadas. Adivinar qué hace un programa por lo que importa es el primer truco del analista."],"quiz":[{"pregunta":"¿Qué hace Ghidra?","opciones":["Desensambla y descompila binarios para estudiarlos sin su fuente","Crea virus","Comprime archivos"],"correcta":0,"porque":"La herramienta libre de referencia para ingeniería inversa, liberada por la NSA en 2019."},{"pregunta":"¿Por qué el análisis dinámico usa máquinas virtuales aisladas?","opciones":["Para observar al malware actuar sin riesgo real y volver atrás con instantáneas","Porque son más rápidas","Por estética"],"correcta":0,"porque":"La jaula con red simulada permite ver al bicho comportarse sin que escape."},{"pregunta":"¿Qué hace el malware cuando detecta un depurador?","opciones":["Se comporta bien o se detiene para no ser analizado","Se borra del disco siempre","Saluda"],"correcta":0,"porque":"El anti-análisis es parte del juego: por eso el analista combina estático y dinámico con engaños."}]},{"titulo":"Forense digital: leer la escena del crimen","contenido":["La informática forense responde qué pasó en una máquina sin destruir la evidencia. Regla primera: jamás trabajar sobre el original. Se crea una imagen bit a bit del disco (dd o herramientas forenses), se calcula su hash y toda la investigación ocurre sobre copias: la cadena de custodia documenta cada paso para que la evidencia valga en un juicio.","El disco cuenta historias aunque lo borren: los archivos eliminados dejan restos recuperables mientras no se sobrescriban, los metadatos del sistema de archivos guardan fechas de creación y acceso, y los artefactos del sistema (historial, registros, prefetch en Windows, journal en Linux) reconstruyen la cronología de lo que ocurrió.","La memoria RAM guarda otro tesoro volátil: procesos, conexiones abiertas y hasta claves en el momento del apagón; herramientas como Volatility la analizan. Y la línea de tiempo (qué archivo se creó, qué programa corrió, qué conexión se abrió, minuto a minuto) es donde el forense arma el relato completo.","Reto: crea un archivo, bórralo y vacía la papelera; luego, en una unidad de pruebas, intenta recuperarlo con una herramienta de recuperación. Entenderás por qué el cifrado de disco es la única papelera real."],"quiz":[{"pregunta":"¿Cuál es la primera regla del forense?","opciones":["Nunca trabajar sobre el original: imagen bit a bit, hash y cadena de custodia","Borrar rápido","Reiniciar la máquina"],"correcta":0,"porque":"La evidencia se contamina al tocarla: la copia verificada y documentada es el campo de trabajo."},{"pregunta":"¿Qué se puede recuperar de un archivo borrado?","opciones":["Sus restos, mientras no se sobrescriba el espacio","Nada jamás","Solo el nombre"],"correcta":0,"porque":"Borrar quita la ficha, no los datos: por eso existen shred y el cifrado."},{"pregunta":"¿Qué aporta el análisis de la memoria RAM?","opciones":["Procesos, conexiones y claves del momento exacto","Nada que no esté en disco","La hora"],"correcta":0,"porque":"Lo volátil desaparece al apagar: capturar la memoria a tiempo es prioridad forense."}]},{"titulo":"Criptoanálisis: cuando la criptografía falla","contenido":["Los algoritmos serios no se rompen: se rompen sus usos. El catálogo de fallos reales es la lección: reutilizar la misma clave de flujo dos veces (los mensajes se combinan y se revelan), el modo ECB que deja ver los patrones (el famoso pingüino cifrado que sigue pareciendo un pingüino), IVs predecibles, y generadores de aleatorios débiles que hacen que las claves 'aleatorias' se repitan.","Los ataques de canal lateral no tocan la matemática: miden el mundo físico. El tiempo que tarda una comparación delata byte a byte el secreto (timing attack), el consumo eléctrico de un chip revela sus operaciones, y hasta el sonido del procesador ha filtrado claves en laboratorios. La constante de defensa: operaciones de tiempo constante y bibliotecas probadas.","La regla de oro del oficio: nunca implementes tu propia criptografía. Usa bibliotecas auditadas (libsodium, las primitivas del sistema), protocolos vivos (TLS 1.3) y modos autenticados (AEAD como AES-GCM o ChaCha20-Poly1305). La criptografía casera es el origen de la mitad de los desastres; la otra mitad es usar bien lo bueno.","Reto: busca la imagen del 'pingüino ECB' y explica con tus palabras por qué el cifrado por bloques sin encadenamiento deja ver la imagen. Es la lección de criptografía más vista del mundo por algo."],"quiz":[{"pregunta":"¿Por qué falla el modo ECB?","opciones":["Porque bloques iguales cifran igual: los patrones del original sobreviven","Porque es lento","Porque es viejo solamente"],"correcta":0,"porque":"El pingüino cifrado que se reconoce: cada bloque por su cuenta delata la estructura."},{"pregunta":"¿Qué es un ataque de canal lateral?","opciones":["Extraer el secreto midiendo tiempo, consumo u otras fugas físicas","Atacar por un canal de TV","Un ataque de red"],"correcta":0,"porque":"La matemática aguanta; la implementación física habla. Por eso existen las operaciones de tiempo constante."},{"pregunta":"¿Cuál es la regla de oro criptográfica?","opciones":["No implementar criptografía propia: usar bibliotecas auditadas y modos autenticados","Cifrar dos veces siempre","Usar claves cortas"],"correcta":0,"porque":"El diseño correcto cae por detalles de implementación: la prudencia es usar lo examinado por miles."}]},{"titulo":"Blue team: detección y caza de amenazas","contenido":["El blue team defiende: su materia prima son los registros y su fábrica es el SOC. El SIEM (Splunk, Wazuh libre, Elastic) centraliza los logs de toda la organización, los correlaciona y dispara alertas: mil inicios de sesión fallidos seguidos de uno exitoso a las 3 de la madrugada es una historia que hay que contar de inmediato.","Las reglas de detección se escriben en lenguajes como Sigma (reglas genéricas traducibles a cada SIEM) y se mapean al MITRE ATT&CK: cada técnica de atacante debería tener su detección. Los honeypots (máquinas cebo que nadie legítimo toca) convierten cualquier contacto en alarma certera: si alguien habla con el cebo, es que está dentro.","El threat hunting es la caza activa: en vez de esperar alertas, el cazador parte de hipótesis ('¿y si hubiera un túnel DNS?') y busca sus señales en los datos. La defensa madura asume la brecha: no 'si nos atacan' sino 'asumiendo que ya están dentro, ¿dónde los vería?'.","Reto: escribe tres reglas de detección en lenguaje natural para tu propia red o equipos (qué registro, qué condición, por qué es sospechoso). Pensar como detector es la mitad del blue team."],"quiz":[{"pregunta":"¿Qué hace un SIEM?","opciones":["Centraliza y correlaciona los registros de toda la organización para alertar","Bloquea virus en el correo","Cifra el disco"],"correcta":0,"porque":"Los logs aislados cuentan poco; correlacionados, cuentan la intrusión entera."},{"pregunta":"¿Qué es un honeypot?","opciones":["Una máquina cebo: cualquier contacto con ella es sospechoso por definición","Un tarro de miel","Un cortafuegos"],"correcta":0,"porque":"Nadie legítimo la toca: la alarma que da es casi siempre verdad."},{"pregunta":"¿Qué es el threat hunting?","opciones":["Buscar activamente señales de atacantes partiendo de hipótesis","Esperar las alertas","Cazar wifi"],"correcta":0,"porque":"Asumir la brecha y salir a buscarla: la defensa pasa de reactiva a activa."}]},{"titulo":"Respuesta a incidentes y el camino profesional","contenido":["Cuando la brecha ocurre, el tiempo vale oro y el método lo es todo: la respuesta a incidentes sigue fases (preparación, detección, contención, erradicación, recuperación y lecciones aprendidas). Contener primero, borrar después: apagar de golpe destruye evidencia volátil; aislar de la red conserva las pruebas y frena al atacante.","El informe posterior es donde se aprende: cronología exacta, causa raíz, qué falló en las defensas y qué cambiará para que no se repita. Los equipos que sobreviven bien a los incidentes son los que ensayan: los ejercicios de simulación (tabletop) convierten el pánico en procedimiento.","El camino profesional de este mundillo es público y exigente: laboratorios legales (máquinas vulnerables de práctica, plataformas de retos), CTF (competiciones de capturar banderas que enseñan cada técnica como un puzle), y certificaciones de referencia como Security+, OSCP (la de 'pruébalo de verdad en 24 horas') o las de blue team. La comunidad comparte write-ups: leer cómo otros resolvieron es la escuela gratuita.","Reto final de la materia: monta tu laboratorio (una máquina virtual atacante y una vulnerable), resuelve tu primera máquina guiada leyendo solo pistas, y escribe tu propio write-up. Ese documento es tu primera credencial real."],"quiz":[{"pregunta":"¿Cuál es el orden correcto tras detectar una brecha?","opciones":["Contener primero, erradicar después, conservando evidencia","Apagar todo ya","Formatear los discos"],"correcta":0,"porque":"Apagar destruye pruebas volátiles y puede empeorar las cosas: aislar de la red frena y conserva."},{"pregunta":"¿Qué es un ejercicio tabletop?","opciones":["Una simulación de incidente hablada, para ensayar el procedimiento sin fuego real","Un juego de mesa","Una mesa de madera"],"correcta":0,"porque":"El día del incidente no es el día de improvisar: los equipos que ensayan responden."},{"pregunta":"¿Qué son los CTF?","opciones":["Competiciones de seguridad donde cada reto enseña una técnica real","Certificados de fábrica","Cortafuegos"],"correcta":0,"porque":"Capture The Flag: puzles de explotación, forense y cripto que son la cantera del sector."}]}],"nivel":"avanzado"},{"id":"python","titulo":"Python desde cero","icono":"🐍","lecciones":[{"titulo":"Primeros pasos: el ordenador como calculadora lista","contenido":["Python es el lenguaje que más se recomienda para empezar: se lee casi como inglés, perdona los formalismos y con tres líneas ya hace algo útil. Se usa en ciencia de datos, inteligencia artificial, la web, la NASA y Netflix. Lo mismo sirve para tu primera cuenta que para entrenar una red neuronal.","El intérprete es una conversación: escribes 2 + 3 * 4 y responde 14. Las variables guardan valores con un nombre: edad = 15, y a partir de ahí edad + 1 vale 16. Los textos van entre comillas y los números sin ellas: '15' no es lo mismo que 15.","print() muestra por pantalla e input() pregunta: nombre = input('¿Cómo te llamas? ') y luego print('Hola', nombre). Con esas dos órdenes ya escribes programas que conversan.","Reto: escribe un programa de tres líneas que pregunte tu año de nacimiento y te diga cuántos años cumples este año. Es tu primer programa con entrada, cálculo y salida."],"quiz":[{"pregunta":"¿Por qué se recomienda Python para empezar?","opciones":["Se lee casi como inglés y hace mucho con poco","Es el más antiguo","Es el único gratis"],"correcta":0,"porque":"Su sintaxis limpia deja pensar en el problema, no en el lenguaje."},{"pregunta":"¿Qué diferencia hay entre '15' y 15?","opciones":["El primero es texto y el segundo número: no se pueden sumar mezclados","Ninguna","Uno es romano"],"correcta":0,"porque":"Las comillas hacen texto; sumar texto con número da error o sorpresas."},{"pregunta":"¿Qué hace input()?","opciones":["Pide un dato al usuario y lo devuelve como texto","Imprime en pantalla","Cierra el programa"],"correcta":0,"porque":"input conversa hacia dentro; print, hacia fuera. Con los dos, tu programa dialoga."}]},{"titulo":"Decidir: if, else y la lógica de las bifurcaciones","contenido":["Un programa sin decisiones es una calculadora. El if le da criterio: si la temperatura es mayor de 38, avisa de fiebre; si no, sigue. En Python la indentación (los espacios al inicio de línea) marca qué pertenece a cada bloque: es la ley, no una costumbre.","Las comparaciones devuelven verdadero o falso (booleanos): edad >= 18, nombre == 'Ana'. Y se combinan con and, or, not: puedes entrar si eres mayor de edad Y tienes entrada.","El else y elif cubren los demás caminos: if lluvia: paraguas, elif nubes: chaqueta, else: gafas de sol. El programa recorre las opciones en orden y toma la primera que se cumple.","Reto: escribe un programa que pregunte la nota de un examen y responda 'suspenso', 'aprobado' o 'notable' según los tramos. Luego pruébalo con 3, 6 y 8."],"quiz":[{"pregunta":"¿Qué marca en Python qué líneas van dentro del if?","opciones":["La indentación: los espacios al inicio","Las llaves","El color"],"correcta":0,"porque":"En Python la sangría es sintaxis: cuatro espacios definen el bloque."},{"pregunta":"¿Qué devuelve una comparación como edad >= 18?","opciones":["Verdadero o falso: un booleano","Un número decimal","Una lista"],"correcta":0,"porque":"Las decisiones se toman sobre booleanos: True o False."},{"pregunta":"¿En qué orden evalúa Python las ramas if-elif-else?","opciones":["De arriba abajo, y toma la primera que se cumple","Al azar","La última siempre"],"correcta":0,"porque":"Por eso el orden de los elif importa: pon antes las condiciones más específicas."}]},{"titulo":"Repetir sin cansarse: bucles for y while","contenido":["El bucle for recorre una colección elemento a elemento: for amigo in amigos: saluda a cada uno. range(10) genera los números del 0 al 9, y for i in range(10) repite algo diez veces sin que escribas diez veces.","El while repite mientras una condición sea cierta: mientras queden intentos, pregunta la contraseña. Ojo con la condición de salida: si nunca cambia, el bucle es infinito y el programa se queda dando vueltas para siempre (Ctrl+C lo rescata).","Dentro de los bucles, break sale de golpe y continue salta a la vuelta siguiente. Y acumular es el patrón estrella: total = 0 antes del bucle, y dentro total = total + gasto. Al salir, total guarda la suma de todo.","Reto: escribe un bucle que sume los números del 1 al 100 y muestre el resultado (debería dar 5050, la anécdota del pequeño Gauss). Luego hazlo que sume solo los pares."],"quiz":[{"pregunta":"¿Qué hace range(10)?","opciones":["Genera los números del 0 al 9","Cuenta hasta 10 inclusive","Da diez ceros"],"correcta":0,"porque":"range empieza en 0 y excluye el final: 10 números, del 0 al 9."},{"pregunta":"¿Cuándo termina un while?","opciones":["Cuando su condición deja de ser cierta","A los diez minutos","Nunca"],"correcta":0,"porque":"Si la condición nunca cambia, el bucle es infinito: asegúrate de que algo la mueva."},{"pregunta":"¿Qué hace break dentro de un bucle?","opciones":["Sale del bucle inmediatamente","Rompe el ordenador","Salta una vuelta"],"correcta":0,"porque":"break termina el bucle; continue solo salta a la siguiente iteración."}]},{"titulo":"Listas y diccionarios: guardar muchas cosas","contenido":["La lista guarda una colección ordenada: compra = ['pan', 'leche', 'huevos']. Cada elemento tiene su posición empezando en cero: compra[0] es 'pan'. Se añade con append, se quita con remove, y len(compra) cuenta cuántos hay.","Recorrer una lista con for es el pan de cada día: for producto in compra: print(producto). Y las listas por comprensión crean listas nuevas en una línea: [n*n for n in range(10)] genera los cuadrados del 0 al 9.","El diccionario guarda parejas clave-valor: agenda = {'Ana': '600111222', 'Luis': '600333444'}. Preguntas por la clave: agenda['Ana'] devuelve su número. Es exactamente una agenda, un diccionario de verdad o un inventario.","Reto: crea una agenda con tres contactos, añade un cuarto, cambia el número de uno y muestra la agenda entera recorriéndola con for. Ya tienes una app de contactos en ciernes."],"quiz":[{"pregunta":"¿Qué posición ocupa el primer elemento de una lista?","opciones":["La 0","La 1","La última"],"correcta":0,"porque":"Python cuenta desde cero: lista[0] es el primero."},{"pregunta":"¿Qué hace append?","opciones":["Añade un elemento al final de la lista","Borra la lista","La ordena"],"correcta":0,"porque":"lista.append(x) suma x al final: así crece la colección."},{"pregunta":"¿Cómo se accede al valor de un diccionario?","opciones":["Por su clave: agenda['Ana']","Por su posición numérica","Por orden alfabético"],"correcta":0,"porque":"Los diccionarios buscan por clave, no por número: acceso directo y rapidísimo."}]},{"titulo":"Funciones: tus propias herramientas","contenido":["Una función empaqueta un trozo de programa con nombre: def saludar(nombre): y debajo lo que hace. A partir de ahí, saludar('Ana') lo ejecuta cuando quieras. Es crear tus propias órdenes, como añadir palabras al idioma.","Los parámetros son la entrada y return la salida: def area(base, altura): return base * altura. La función recibe, calcula y devuelve. Lo que devuelve se puede guardar: a = area(3, 4).","Las funciones son el gran remedio contra el copia-pega: si escribes lo mismo dos veces, hazlo función una vez. Cambiarla en un sitio la mejora en todas partes. Y funciones pequeñas que se llaman entre sí construyen programas grandes sin perderse.","Reto: escribe una función es_mayor(edad) que devuelva True o False, y otra que la use para decidir el precio de la entrada al cine: infantil, adulto o jubilado."],"quiz":[{"pregunta":"¿Para qué sirve def?","opciones":["Para definir una función nueva","Para borrar variables","Para importar librerías"],"correcta":0,"porque":"def nombre(parámetros): crea tu propia orden reutilizable."},{"pregunta":"¿Qué hace return?","opciones":["Devuelve el resultado de la función y la termina","Repite la función","Imprime en pantalla"],"correcta":0,"porque":"Sin return, la función trabaja pero no entrega nada."},{"pregunta":"¿Por qué evitar el copia-pega con funciones?","opciones":["Porque un cambio en la función mejora todos sus usos a la vez","Porque ocupa menos pantalla","Porque queda bonito"],"correcta":0,"porque":"El código duplicado envejece mal: la función es la fuente única de verdad."}]},{"titulo":"Errores y cómo domarlos","contenido":["Todo programador lee errores todos los días; la diferencia entre el novato y el experto es que el experto lee el mensaje. Python te dice el tipo de error y la línea: NameError (usaste un nombre que no existe), TypeError (mezclaste tipos), IndexError (te saliste de la lista). El mensaje es el mapa del tesoro.","Depurar es investigar: imprime valores a mitad de camino, prueba con datos pequeños, cambia una cosa cada vez. El error siempre tiene una causa; encontrarla es un misterio de detectives, no un castigo.","try y except permiten responder con elegancia: intenta convertir el texto a número, y si falla, pide de nuevo en lugar de estrellarse. Un programa robusto no es el que nunca falla, es el que falla con dignidad y sigue.","Reto: escribe un programa que pida un número y siga pidiendo hasta que el usuario escriba un número válido, usando try/except dentro de un while. Nunca más un programa tuyo morirá por un 'abc'."],"quiz":[{"pregunta":"¿Qué indica un NameError?","opciones":["Que usaste un nombre de variable que no existe","Que el nombre es feo","Que falta memoria"],"correcta":0,"porque":"Casi siempre es una errata: revisa cómo escribiste la variable."},{"pregunta":"¿Qué hace el bloque try/except?","opciones":["Intenta algo y, si falla, ejecuta un plan B sin romper el programa","Prueba velocidad","Repite el error"],"correcta":0,"porque":"Capturar el error permite responder con elegancia en vez de estrellarse."},{"pregunta":"¿Cuál es la primera regla para depurar?","opciones":["Leer el mensaje de error completo","Reiniciar el ordenador","Cambiarlo todo a la vez"],"correcta":0,"porque":"El mensaje dice qué tipo de error y en qué línea: la mitad del trabajo está hecha."}]},{"titulo":"Módulos: hombros de gigantes","contenido":["Nadie escribe todo desde cero: los módulos son cajas de herramientas listas. import math te da math.sqrt y math.pi; import random da random.randint(1, 6) para tu dado; import datetime maneja fechas sin sufrir los meses de 28 días.","La biblioteca estándar de Python ('pilas incluidas') cubre archivos, redes, datos, matemáticas, compresión y cientos de cosas más. Y con pip install se suman millones de paquetes de la comunidad: pandas para datos, requests para la web, matplotlib para gráficos.","Leer la documentación es el superpoder silencioso: cada módulo está documentado, y saber buscar 'cómo hago X con el módulo Y' es la mitad del oficio. El buen programador no lo sabe todo: sabe encontrarlo.","Reto: escribe un programa que simule veinte tiradas de un dado con random.randint y cuente cuántas veces salió el seis. ¿Se acerca a la sexta parte? Estás haciendo estadística computacional."],"quiz":[{"pregunta":"¿Qué es un módulo?","opciones":["Una caja de herramientas lista para importar","Un mueble de cocina","Un error grave"],"correcta":0,"porque":"import trae funciones hechas y probadas: no reinventes la rueda."},{"pregunta":"¿Qué hace random.randint(1, 6)?","opciones":["Devuelve un entero aleatorio entre 1 y 6, ambos incluidos","Ordena números","Tira un dado de verdad"],"correcta":0,"porque":"Aquí randint sí incluye los dos extremos, a diferencia de range."},{"pregunta":"¿Cuál es la actitud del buen programador ante lo que no sabe?","opciones":["Buscar en la documentación: saber encontrar es saber","Adivinar","Rendirse"],"correcta":0,"porque":"Nadie memoriza todo: la documentación es la memoria externa del oficio."}]},{"titulo":"Archivos y proyectos: de juguete a herramienta","contenido":["Un programa que olvida todo al cerrarse es de juguete. Los archivos dan memoria: open('notas.txt', 'w') escribe, open('notas.txt') lee, y con with open(...) el archivo se cierra solo aunque haya errores. Guardar y cargar convierte tu script en herramienta.","El formato JSON guarda listas y diccionarios como texto legible: json.dump(datos, archivo) y json.load(archivo). Tu agenda de la lección 4 ahora sobrevive entre ejecuciones: ya es una aplicación.","Un proyecto serio se organiza: un archivo por tema, nombres claros, un cuaderno de decisiones. Y el control de versiones (git) guarda la historia de cada cambio: puedes volver atrás, experimentar sin miedo y colaborar sin pisaros.","Reto final de la materia: convierte tu agenda en un programa completo: cargar al inicio, menú con opciones (ver, añadir, buscar, guardar, salir) y archivo JSON. Ese programa, de unas 40 líneas, ya es software de verdad."],"quiz":[{"pregunta":"¿Qué ventaja da guardar datos en archivos?","opciones":["Que el programa recuerde entre ejecuciones","Que ocupe menos","Que sea más rápido"],"correcta":0,"porque":"La persistencia separa el juguete de la herramienta: los datos sobreviven al cierre."},{"pregunta":"¿Para qué sirve JSON?","opciones":["Para guardar listas y diccionarios como texto legible e intercambiable","Para comprimir vídeo","Para cifrar"],"correcta":0,"porque":"JSON es el idioma común de los datos: lo lee Python, la web y casi todo."},{"pregunta":"¿Qué aporta git a un proyecto?","opciones":["La historia completa de cambios: volver atrás y colaborar sin pisarse","Más velocidad de red","Mejor pantalla"],"correcta":0,"porque":"El control de versiones es la máquina del tiempo del programador."}]}],"nivel":"avanzado"},{"id":"cpp","titulo":"C++: potencia total","icono":"⚙️","lecciones":[{"titulo":"C++: el lenguaje de la potencia","contenido":["C++ es el lenguaje de quien necesita exprimir la máquina: videojuegos, motores gráficos, navegadores, sistemas de trading, el software del coche y del cohete. Donde cada milisegundo cuenta, ahí está C++. Es más exigente que Python, pero te enseña cómo funciona el ordenador de verdad.","La gran diferencia: C++ se compila. Un programa (el compilador) traduce todo tu código a lenguaje de máquina antes de ejecutarlo, y el resultado corre a velocidad nativa. Python se interpreta sobre la marcha; C++ entrena antes de la carrera.","Tu primer programa: #include <iostream> y en el main, std::cout << «Hola» << std::endl;. Cada línea termina en punto y coma, y el tipo de cada variable se declara: int edad = 15;. Es más ceremonia, pero el compilador caza errores antes de ejecutar nada.","Reto: escribe el programa 'Hola mundo' en C++, compílalo con g++ hola.cpp -o hola y ejecútalo. Compilar tu primer programa es un rito de paso."],"quiz":[{"pregunta":"¿Dónde domina C++?","opciones":["En videojuegos, navegadores y sistemas donde la velocidad manda","En hojas de cálculo","En redes sociales solamente"],"correcta":0,"porque":"Cuando el rendimiento es crítico, C++ es la opción estándar de la industria."},{"pregunta":"¿Qué significa que C++ se compila?","opciones":["Que se traduce entero a lenguaje de máquina antes de ejecutarse","Que no tiene errores","Que corre en la nube"],"correcta":0,"porque":"El compilador revisa y traduce todo de antemano: errores cazados pronto y velocidad máxima."},{"pregunta":"¿Cómo se declara una variable en C++?","opciones":["Con su tipo: int edad = 15;","Con var edad","Con edad = '15'"],"correcta":0,"porque":"El tipo es obligatorio: el compilador lo usa para verificar todo."}]},{"titulo":"Tipos y variables: cajas con etiqueta exacta","contenido":["En C++ cada caja tiene su tipo y no cambia: int para enteros, double para decimales, char para un carácter, bool para verdadero/falso, std::string para texto. Elegir el tipo es elegir cuánta memoria ocupa y qué operaciones admite.","Los tipos tienen límites físicos: un int de 32 bits llega hasta unos 2.100 millones; pásate y el número da la vuelta como un cuentakilómetros (desbordamiento). Errores de este tipo han estrellado cohetes: el Ariane 5 explotó en 1996 por convertir un número que no cabía.","Las constantes (const double PI = 3.14159;) no pueden cambiar, y el compilador lo garantiza. Declarar const lo que no debe cambiar es documentar tu intención y dejar que el compilador vigile por ti.","Reto: declara variables de los cinco tipos básicos con datos tuyos (edad, altura en metros, inicial, si te gusta programar, tu nombre) y muéstralas todas con cout."],"quiz":[{"pregunta":"¿Qué tipo usarías para la altura en metros?","opciones":["double","int","bool"],"correcta":0,"porque":"Los decimales viven en double: 1.75 no cabe en un entero."},{"pregunta":"¿Qué es un desbordamiento?","opciones":["Cuando un número supera el límite de su tipo y da la vuelta","Un vaso lleno","Un error de teclado"],"correcta":0,"porque":"El Ariane 5 se perdió por eso: los tipos tienen límites reales y hay que conocerlos."},{"pregunta":"¿Para qué sirve const?","opciones":["Para declarar valores que no deben cambiar, vigilados por el compilador","Para ir más rápido solamente","Para gastar menos papel"],"correcta":0,"porque":"const convierte tu intención en una garantía que la máquina hace cumplir."}]},{"titulo":"Control de flujo y bucles: el C++ de cada día","contenido":["Las decisiones y repeticiones son casi iguales que en Python, pero con llaves: if (edad >= 18) { ... } else { ... }. Las llaves delimitan los bloques donde Python usa la indentación. El switch elige entre muchos casos fijos.","El bucle for clásico cuenta con tres partes: for (int i = 0; i < 10; i++) — desde dónde, hasta cuándo, cómo avanza. El while repite mientras la condición aguante. i++ es el famoso 'incrementa en uno' que da nombre al propio lenguaje.","Los operadores combinan condiciones: && (y), || (o), ! (no). Y los bucles anidados (uno dentro de otro) recorren tablas: el for de filas con el for de columnas pinta cualquier cuadrícula.","Reto: escribe un bucle for que imprima la tabla de multiplicar del 7, y luego dos bucles anidados que impriman un cuadrado de 8x8 asteriscos. Es el 'hola mundo' de los bucles."],"quiz":[{"pregunta":"¿Qué delimita los bloques en C++?","opciones":["Las llaves { }","La indentación","Los paréntesis"],"correcta":0,"porque":"Python usa sangría; C++ usa llaves. Misma idea, distinta señal."},{"pregunta":"¿Qué significa i++?","opciones":["Incrementar i en uno","Dividir i","El nombre del lenguaje solamente"],"correcta":0,"porque":"El ++ es tan icónico que C++ se llama así: 'C incrementado'."},{"pregunta":"¿Qué hacen dos bucles anidados?","opciones":["Recorren estructuras de dos dimensiones, como filas y columnas","Se rompen mutuamente","Van al doble de rápido"],"correcta":0,"porque":"El de fuera recorre filas; el de dentro, columnas: así se pinta cualquier tabla."}]},{"titulo":"Memoria y punteros: la superpotencia de C++","contenido":["Aquí C++ se separa de casi todo: tú gestionas la memoria. Cada variable vive en una dirección de memoria, y un puntero es una variable que guarda esa dirección: int* p = &edad; guarda dónde vive edad, y *p accede al valor que hay allí.","Con new pides memoria y con delete la devuelves. Olvidar el delete es una fuga de memoria: el programa va engordando hasta ahogarse. Usar memoria ya liberada es peor: comportamiento impredecible. Esta libertad es la fuente de la velocidad y de los peores bugs de la historia.","El C++ moderno domesticó al monstruo: los punteros inteligentes (como std::unique_ptr) liberan la memoria solos al salir de escena, y la regla actual es: gestión manual solo cuando haga falta de verdad. La RAII ('los recursos se liberan al destruirse el objeto') es la idea estrella.","Reto: declara una variable, un puntero a ella, imprime el valor a través del puntero con *p y la dirección con p. Cambia *p y mira cómo cambió la variable original: acabas de usar el mecanismo más potente y peligroso de la programación."],"quiz":[{"pregunta":"¿Qué es un puntero?","opciones":["Una variable que guarda la dirección de memoria de otra","Un dedo del ratón","Un error"],"correcta":0,"porque":"& da la dirección; * accede al contenido: con eso se gobierna la memoria."},{"pregunta":"¿Qué es una fuga de memoria?","opciones":["Pedir memoria y nunca devolverla: el programa se ahoga poco a poco","Un disco roto","Un virus"],"correcta":0,"porque":"Cada new sin su delete (o sin puntero inteligente) es una fuga acumulativa."},{"pregunta":"¿Qué solución moderna evita las fugas?","opciones":["Los punteros inteligentes, que liberan la memoria solos","Comprar más RAM","No usar memoria"],"correcta":0,"porque":"unique_ptr y la idea RAII: el recurso se libera al destruirse su dueño."}]},{"titulo":"Funciones y referencias: pasar sin copiar","contenido":["Las funciones en C++ declaran el tipo de lo que devuelven y de cada parámetro: int cuadrado(int n) { return n * n; }. El compilador comprueba que todo encaje: pasarle texto a esa función no llega ni a ejecutarse.","Por defecto, los argumentos se copian: la función trabaja con una fotocopia. Con una referencia (int& n) la función trabaja con el original: puede modificarlo y, además, se ahorra copiar estructuras grandes. La referencia constante (const string& s) da velocidad sin riesgo de cambio.","Sobrecargar funciones es tener varias con el mismo nombre y distintos parámetros: area(lado) y area(base, altura). El compilador elige la correcta según lo que le pases. Es el mismo verbo conjugado para distintos objetos.","Reto: escribe una función void duplicar(int& n) que doble el valor del original, llámala con una variable y comprueba que la variable cambió. Luego prueba sin la & y observa la diferencia: ese experimento vale una lección."],"quiz":[{"pregunta":"¿Qué declara la cabecera de una función en C++?","opciones":["El tipo que devuelve y el tipo de cada parámetro","Solo el nombre","El autor"],"correcta":0,"porque":"int cuadrado(int n): devuelve entero, recibe entero. El compilador lo hace cumplir."},{"pregunta":"¿Qué diferencia hay entre pasar por valor y por referencia?","opciones":["Por valor se copia; por referencia se trabaja con el original","Ninguna","La referencia es más lenta"],"correcta":0,"porque":"Con & la función toca tu variable de verdad: potente y a manejar con cuidado."},{"pregunta":"¿Qué es la sobrecarga de funciones?","opciones":["Varias funciones con el mismo nombre y distintos parámetros","Cansar a la función","Un error de compilación"],"correcta":0,"porque":"El compilador elige la versión según los argumentos: un verbo, muchas conjugaciones."}]},{"titulo":"Clases y objetos: modelar el mundo","contenido":["La programación orientada a objetos empaqueta datos y las operaciones que los manejan en una sola pieza: la clase. Una clase CuentaBancaria guarda el saldo y ofrece ingresar() y retirar(), y nadie toca el saldo directamente: solo a través de sus métodos. Eso es el encapsulamiento.","El constructor crea el objeto ya válido (CuentaBancaria c(«Ana», 100);) y el destructor lo despide limpiamente. Entre ambos, el objeto se gobierna solo: la regla RAII de la memoria sale de aquí.","La herencia permite que una clase descienda de otra (Vehiculo → Coche, Moto) reutilizando lo común, y el polimorfismo permite tratar a todos por su interfaz común: acelerar() significa algo distinto en cada uno, pero se llama igual.","Reto: escribe una clase Mascota con nombre, energía, y métodos jugar() (baja la energía) y dormir() (la recupera). Crea dos mascotas, juega con una y muestra sus energías: acabas de programar un Tamagotchi."],"quiz":[{"pregunta":"¿Qué es una clase?","opciones":["Un molde que empaqueta datos y las operaciones que los manejan","Un aula","Un tipo de error"],"correcta":0,"porque":"Datos + métodos juntos: el objeto se protege y se gobierna a sí mismo."},{"pregunta":"¿Qué es el encapsulamiento?","opciones":["Que los datos solo se toquen a través de los métodos del objeto","Poner todo en mayúsculas","Esconder el código"],"correcta":0,"porque":"El saldo no se toca directamente: se ingresa o se retira. El control vive dentro."},{"pregunta":"¿Qué aporta el polimorfismo?","opciones":["Tratar objetos distintos por su interfaz común","Muchas formas de virus","Herencia múltiple"],"correcta":0,"porque":"Mismo mensaje (acelerar), distinta respuesta según el objeto: flexibilidad real."}]},{"titulo":"La biblioteca estándar: vector, map y algoritmos","contenido":["Reinventar estructuras de datos es perder el tiempo: la STL (biblioteca estándar de plantillas) trae las mejores ya hechas. std::vector es una lista que crece sola y vive en memoria contigua (rapidísima); std::map es un diccionario ordenado; std::string maneja texto sin dolor.","Los algoritmos genéricos trabajan sobre cualquier contenedor: std::sort ordena un vector en una línea con uno de los mejores algoritmos conocidos; std::find busca; std::accumulate suma. Escribir sort(v.begin(), v.end()) es invocar décadas de optimización.","Las plantillas (templates) hacen que vector<int> y vector<string> compartan el mismo código: escribes la estructura una vez y funciona para cualquier tipo. Es la programación genérica, y C++ es su cuna.","Reto: crea un vector con diez números desordenados, ordénalo con std::sort, muéstralo, y calcula su suma con std::accumulate. Tres líneas de STL hacen el trabajo de treinta."],"quiz":[{"pregunta":"¿Qué es std::vector?","opciones":["Una lista dinámica en memoria contigua, rápida y que crece sola","Un vector matemático solamente","Un puntero crudo"],"correcta":0,"porque":"Es el contenedor por defecto en C++ moderno: cómodo y veloz."},{"pregunta":"¿Cómo se ordena un vector?","opciones":["Con std::sort(v.begin(), v.end())","A mano siempre","No se puede"],"correcta":0,"porque":"La STL incluye algoritmos de clase mundial: ordenar es una línea."},{"pregunta":"¿Qué son las plantillas?","opciones":["Código genérico que funciona con cualquier tipo","Plantillas de Word","Errores raros"],"correcta":0,"porque":"vector<int> y vector<string> nacen del mismo molde: escribe una vez, usa con todo."}]},{"titulo":"C++ moderno y el oficio","contenido":["El C++ actual (C++11 en adelante) es otro idioma comparado con el clásico: auto deduce tipos, los bucles for (auto x : lista) recorren sin índices, las lambdas crean funciones anónimas al vuelo, y los punteros inteligentes gobiernan la memoria. Quien aprendió C++ en 1998 y no se actualizó habla un dialecto antiguo.","El ecosistema profesional: compiladores (g++, clang), sistemas de construcción (CMake), sanitizers que cazan errores de memoria en las pruebas, y depuradores (gdb) que congelan el programa en el momento del fallo para inspeccionarlo por dentro.","¿Dónde te lleva este camino? Motores de juegos (Unreal es C++), navegadores (Chrome es C++), sistemas embebidos (tu lavadora, el coche), finanzas de alta frecuencia, robótica. Es el lenguaje más cercano al metal sin dejar de ser moderno.","Reto final: reescribe en C++ tu agenda de la materia de Python con un vector de structs y un menú. Comparar ambas versiones te enseñará más que diez lecciones: el mismo problema, dos filosofías."],"quiz":[{"pregunta":"¿Qué aportó el C++ moderno (desde C++11)?","opciones":["auto, bucles de rango, lambdas y punteros inteligentes","Pantallas azules","Menos seguridad"],"correcta":0,"porque":"El lenguaje se modernizó en serio: más seguro y más expresivo sin perder velocidad."},{"pregunta":"¿Qué hace un sanitizer?","opciones":["Detecta errores de memoria al ejecutar las pruebas","Limpia el teclado","Formatea el código"],"correcta":0,"porque":"Caza fugas y usos indebidos de memoria en tiempo de prueba, no en producción."},{"pregunta":"¿Qué software famoso está escrito en C++?","opciones":["Chrome y el motor Unreal, entre muchos","Ninguno conocido","Solo virus"],"correcta":0,"porque":"El software rápido del mundo (navegadores, juegos, coches) habla C++."}]}],"nivel":"avanzado"},{"id":"lpi-esenciales","titulo":"LPI Linux Essentials (010)","icono":"📜","lecciones":[{"titulo":"Comunidad Linux y software libre (010-1.1/1.3)","contenido":["El temario LPI empieza por la filosofía: el software libre se define por cuatro libertades — usar, estudiar, modificar y compartir. Linux nació de esa comunidad y hoy lo mantienen miles de personas y empresas que publican su código.","Una distribución es Linux más una selección de programas y un gestor de paquetes: Debian y Ubuntu usan paquetes .deb con apt; Fedora y Red Hat usan .rpm con dnf. Los programas de código abierto más usados: navegador Firefox, suite LibreOffice, servidor web Apache, y las herramientas GNU que acompañan a todo Linux.","Las licencias ordenan el intercambio: la GPL exige que las obras derivadas sigan libres (copyleft); MIT y BSD permiten casi todo. Saber qué licencia tiene un programa te dice qué puedes hacer con él legalmente.","Reto: identifica en tu móvil tres aplicaciones de código abierto y mira su licencia en su web. Reconocer licencias es el primer examen de la cultura libre."],"quiz":[{"pregunta":"¿Cuáles son las cuatro libertades del software libre?","opciones":["Usar, estudiar, modificar y compartir","Comprar, vender, alquilar y regalar","Descargar, instalar, borrar y pagar"],"correcta":0,"porque":"Las definió la Free Software Foundation y son la base de toda la comunidad."},{"pregunta":"¿Qué diferencia a la GPL de la licencia MIT?","opciones":["La GPL obliga a que las derivadas sigan libres (copyleft); la MIT es permisiva","La GPL es de pago","La MIT es solo para Linux"],"correcta":0,"porque":"Copyleft = la libertad se hereda; permisiva = haz casi lo que quieras."},{"pregunta":"¿Qué formatos de paquetes usan Debian y Red Hat?","opciones":[".deb y .rpm respectivamente",".exe y .msi",".zip y .tar"],"correcta":0,"porque":"apt maneja .deb; dnf maneja .rpm: las dos grandes familias de distribuciones."}]},{"titulo":"Encontrar el camino en el sistema (010-Tema 2)","contenido":["La línea de comandos tiene su gramática: orden, opciones y argumentos. ls -l /home lista con detalle esa carpeta. Las opciones cortas van con un guion (-l), las largas con dos (--help), y casi toda orden acepta --help como primer socorro.","Para moverte: pwd dice dónde estás, cd cambia de directorio (cd .. sube, cd ~ va a tu casa), ls lista. Para leer archivos: cat los vuelca enteros, less los pagina y permite buscar con /, head y tail muestran el principio y el final.","El manual vive dentro: man ls abre la página de manual de cualquier orden, con sus opciones explicadas. Y hay dos comodines que multiplican tu alcance: * (cualquier cosa) y ? (un carácter): ls *.txt lista todos los textos.","Reto: localiza con cd y ls dónde guarda tu sistema los registros (/var/log) y abre uno con less. Busca la palabra 'error' pulsando / dentro de less."],"quiz":[{"pregunta":"¿Qué hace man ls?","opciones":["Abre la página del manual de la orden ls","Crea un archivo","Lista usuarios"],"correcta":0,"porque":"man es la documentación oficial dentro del sistema: la primera referencia."},{"pregunta":"¿Qué hace el comodín *?","opciones":["Sustituye cualquier secuencia de caracteres","Borra archivos","Multiplica"],"correcta":0,"porque":"ls *.txt selecciona todos los archivos terminados en .txt."},{"pregunta":"¿Qué diferencia hay entre cat y less?","opciones":["cat vuelca todo de golpe; less pagina y permite buscar","Son iguales","less borra"],"correcta":0,"porque":"Para archivos largos, less es la herramienta: navega con flechas y busca con /."}]},{"titulo":"El poder de la línea de comandos (010-Tema 3)","contenido":["Los archivos se gobiernan con un puñado de órdenes: touch crea vacíos, mkdir carpetas, cp copia (con -r, carpetas enteras), mv mueve y renombra, rm borra (rm -r carpetas: sin papelera, con respeto). rmdir solo borra carpetas vacías.","Buscar es un superpoder doble: find busca archivos por nombre, tipo o fecha (find /home -name '*.jpg') y grep busca dentro de los archivos (grep -r 'contraseña' documentos/). Encuentra el archivo con find; encuentra el contenido con grep.","Las tuberías convierten órdenes en cadenas de montaje: la salida de una alimenta la siguiente. cat registro | grep error | sort | uniq -c | sort -nr cuenta los errores más frecuentes. Y la redirección guarda resultados: > crea o sobrescribe, >> añade al final.","Reto: crea una carpeta, dentro tres archivos de texto con contenido, y usa grep para encontrar una palabra en todos a la vez. Luego guarda el resultado en otro archivo con >."],"quiz":[{"pregunta":"¿Cómo copio una carpeta entera con su contenido?","opciones":["cp -r origen destino","cp origen destino","mv -r"],"correcta":0,"porque":"Sin -r, cp se niega a copiar directorios: la recursividad hay que pedirla."},{"pregunta":"¿Qué busca grep que no busca find?","opciones":["Texto dentro de los archivos","Nombres de archivo","Fechas"],"correcta":0,"porque":"find busca archivos por sus metadatos; grep busca en su contenido."},{"pregunta":"¿Qué diferencia hay entre > y >>?","opciones":["> sobrescribe el archivo; >> añade al final","Ninguna",">> borra"],"correcta":0,"porque":"Confundirlos destruye datos: >> acumula, > reemplaza."}]},{"titulo":"El sistema operativo Linux (010-Tema 4)","contenido":["Linux es técnicamente el núcleo: la pieza que habla con el hardware, reparte memoria y procesador, y ofrece servicios a los programas. Alrededor giran las bibliotecas, las herramientas y el escritorio. dmesg muestra los mensajes del núcleo; uname -a, su versión.","El hardware se asoma por archivos: /proc/cpuinfo describe el procesador, /proc/meminfo la memoria, lsblk lista los discos. La red se examina con ip a (direcciones), ip r (rutas) y ping (¿responde esa máquina?). Todo es leer los archivos correctos.","Los procesos se vigilan con ps aux o top, y el sistema guarda sus variables de entorno, como PATH, que dice dónde buscar los ejecutables. echo $PATH te muestra esa lista de carpetas.","Reto: ejecuta uname -a, lsblk y echo $PATH. Con esas tres salidas ya puedes describir la máquina: versión, discos y rutas de programas."],"quiz":[{"pregunta":"¿Qué es exactamente 'Linux' en sentido estricto?","opciones":["El núcleo que gestiona hardware y recursos","Todo el sistema completo","Un escritorio"],"correcta":0,"porque":"El kernel es Linux; lo demás son programas alrededor: de ahí 'GNU/Linux'."},{"pregunta":"¿Dónde consulto la información del procesador?","opciones":["En /proc/cpuinfo","En /etc/passwd","En la papelera"],"correcta":0,"porque":"/proc es una ventana al núcleo: archivos virtuales con el estado del sistema."},{"pregunta":"¿Qué contiene la variable PATH?","opciones":["Las carpetas donde se buscan los ejecutables","Las fotos","La contraseña"],"correcta":0,"porque":"Cuando escribes una orden, el sistema la busca en las carpetas del PATH."}]},{"titulo":"Seguridad y permisos de archivos (010-Tema 5)","contenido":["Las cuentas se administran con órdenes concretas: useradd crea usuarios, passwd cambia contraseñas, /etc/passwd lista las cuentas y /etc/group los grupos. sudo concede poderes de administrador por orden puntual, y queda registrado quién pidió qué.","Los permisos se leen en ternas: r (4), w (2), x (1) para dueño, grupo y otros. chmod 640 archivo dice: dueño lee y escribe, grupo solo lee, otros nada. chown cambia el dueño. Entender los números es entender la taquilla de todo el sistema.","Las claves especiales: sudo y los permisos protegen también en red. Y hay una costumbre de oro: las contraseñas no se guardan en texto plano en /etc/passwd sino como hashes en /etc/shadow, legible solo por root.","Reto: crea un archivo, ponle chmod 600 y comprueba con ls -l que solo tú puedes leerlo. Ese gesto es la base de proteger claves privadas, que exigen exactamente eso."],"quiz":[{"pregunta":"¿Qué significa chmod 755?","opciones":["Dueño todo (7), grupo y otros leer y ejecutar (5)","Todo el mundo puede todo","Nadie puede nada"],"correcta":0,"porque":"7 = rwx, 5 = r-x: la suma de r(4)+w(2)+x(1) por cada público."},{"pregunta":"¿Dónde se guardan realmente las contraseñas?","opciones":["Como hashes en /etc/shadow, solo legible por root","En /etc/passwd en texto claro","En el navegador"],"correcta":0,"porque":"Separar los hashes en shadow protegido fue una mejora histórica de seguridad."},{"pregunta":"¿Qué ventaja tiene sudo sobre trabajar como root?","opciones":["Poder puntual por orden, con registro de quién lo usó","Es más rápido","Ninguna"],"correcta":0,"porque":"El poder se concede por momentos y queda trazado: menos riesgo, más responsabilidad."}]}],"nivel":"avanzado"},{"id":"lpi-seguridad","titulo":"LPI Security Essentials (020)","icono":"🔐","lecciones":[{"titulo":"Criptografía e infraestructura de claves (020-022.1)","contenido":["El temario de seguridad de LPI arranca con la criptografía seria: el cifrado simétrico (AES) usa una sola clave y es rapidísimo, ideal para discos y datos grandes. El asimétrico (RSA, curvas elípticas) usa par de claves: la pública cifra y la privada descifra, y al revés, la privada firma y la pública verifica.","Los hashes (SHA-256) son huellas irreversibles: verifican integridad y firman compromisos. HMAC combina hash con clave para autenticar mensajes. Y la pregunta difícil es siempre la misma: ¿cómo sé que esta clave pública es de quien dice ser?","La respuesta es la PKI: autoridades de certificación (CA) que firman certificados vinculando una clave pública a una identidad. Tu navegador confía en unas CA raíz, y ellas avalan las demás en cadena. La cadena de confianza es la columna vertebral de internet.","Reto: genera un hash de un archivo con sha256sum, cambia una letra del archivo y repite. La huella completamente distinta demuestra por qué sirve para detectar manipulaciones."],"quiz":[{"pregunta":"¿Qué hace la clave privada en la firma digital?","opciones":["Firma, y cualquiera con la pública verifica","Cifra los datos","Nada, es decorativa"],"correcta":0,"porque":"Firmar es 'cifrar con la privada': solo el dueño pudo hacerlo, todos lo comprueban."},{"pregunta":"¿Qué problema resuelve una autoridad de certificación?","opciones":["Vincular una clave pública con una identidad real verificada","Acelerar la red","Crear claves"],"correcta":0,"porque":"Sin CA no sabes de quién es la clave: la PKI es el notario de internet."},{"pregunta":"¿Para qué sirve un hash en seguridad?","opciones":["Como huella irreversible para verificar integridad","Para cifrar mensajes","Para acelerar"],"correcta":0,"porque":"Cualquier cambio en el archivo cambia toda la huella: la manipulación queda expuesta."}]},{"titulo":"Cifrado web: TLS y los certificados (020-022.2)","contenido":["Cuando ves el candado, hay TLS debajo: el servidor presenta su certificado firmado por una CA, tu navegador verifica la cadena de confianza, y juntos negocian claves de sesión simétricas con criptografía asimétrica (hoy, casi siempre con intercambio efímero que da 'perfect forward secrecy': ni robando la clave privada mañana se lee lo grabado ayer).","Los certificados tienen campos que importan: el nombre del dominio (CN/SAN), las fechas de validez, el emisor. Un certificado caducado o de otro dominio dispara el aviso del navegador, y ese aviso no se ignora a la ligera: es la alarma contra impostores.","En la práctica del administrador: openssl genera claves y solicitudes de firma (CSR), Let's Encrypt emite certificados gratuitos y automáticos, y la configuración del servidor elige protocolos (TLS 1.2/1.3) y descarta los viejos y rotos (SSLv3, TLS 1.0).","Reto: pulsa el candado de cualquier web y examina su certificado: emisor, fechas y dominio. Estás leyendo el DNI digital del sitio."],"quiz":[{"pregunta":"¿Qué es el perfect forward secrecy?","opciones":["Que ni con la clave privada futura se descifran sesiones pasadas grabadas","Un seguro de coche","Un tipo de hash"],"correcta":0,"porque":"Las claves de sesión efímeras se destruyen: el pasado queda sellado."},{"pregunta":"¿Qué comprueba el navegador de un certificado?","opciones":["La cadena de confianza, las fechas y que el dominio coincida","El color del logo","La velocidad"],"correcta":0,"porque":"Si algo no cuadra, el aviso aparece: es la defensa contra suplantación."},{"pregunta":"¿Qué es Let's Encrypt?","opciones":["Una CA gratuita y automática que popularizó el https","Un antivirus","Un navegador"],"correcta":0,"porque":"Desde 2015, certificados gratis para todos: el porcentaje de web cifrada se disparó."}]},{"titulo":"Cifrado de correo: GPG y OpenPGP (020-022.3)","contenido":["El correo electrónico viaja por defecto como una postal: cualquiera en el camino puede leerlo. OpenPGP y su implementación libre GnuPG (gpg) lo convierten en carta certificada: cifras con la clave pública del destinatario y solo su privada lo abre; firmas con tu privada y cualquiera verifica con tu pública.","El flujo de trabajo con gpg: gpg --gen-key crea tu par de claves, gpg --export comparte tu pública, gpg --import recibe las ajenas, y gpg --encrypt --recipient destinatario archivo cifra. Firmar es gpg --sign, y la firma en claro (--clearsign) deja el texto legible con su sello.","La confianza entre claves se construye en la 'red de confianza' (web of trust): firmas las claves de quienes has verificado en persona, y la confianza se propaga. Es la PKI descentralizada, sin autoridad central.","Reto conceptual: explica en voz alta por qué para cifrar a María usas su clave PÚBLICA, pero para firmar usas tu PRIVADA. Si lo puedes explicar, lo entiendes."],"quiz":[{"pregunta":"¿Con qué clave cifro un mensaje para María?","opciones":["Con su clave pública","Con mi privada","Con mi pública"],"correcta":0,"porque":"La pública de ella cifra; solo su privada abre: nadie más puede leerlo."},{"pregunta":"¿Con qué clave firmo un documento?","opciones":["Con mi clave privada","Con la pública de otro","Con ninguna"],"correcta":0,"porque":"Firmar con la privada prueba autoría: cualquiera lo verifica con tu pública."},{"pregunta":"¿Qué es la web of trust?","opciones":["Una red de confianza descentralizada donde los usuarios firman las claves de otros","Una web de compras","Una VPN"],"correcta":0,"porque":"Sin autoridad central: la confianza se construye persona a persona."}]},{"titulo":"Cifrado de almacenamiento (020-022.4)","contenido":["Cifrar el disco entero (LUKS en Linux, BitLocker en Windows, FileVault en Mac) protege los datos si pierdes el equipo: sin la contraseña de arranque, el disco es ruido aleatorio. Es la medida más importante para portátiles y móviles.","Se puede cifrar por capas: disco entero, una partición, un contenedor cifrado como archivo, o archivos sueltos con gpg -c (simétrico con contraseña). Cada capa cubre un riesgo distinto: el disco entero protege contra robo físico; el archivo cifrado protege incluso en la nube.","Los detalles que importan: la contraseña del cifrado es el eslabón débil (larga y memorable), la hibernación y la memoria de intercambio pueden filtrar claves si no están cifradas, y borrar archivos de discos no cifrados no garantiza su desaparición (shred ayuda, pero en SSD ni eso).","Reto: comprueba si tu móvil tiene el cifrado activado (los actuales lo llevan por defecto) y piensa qué pasaría con tus datos si mañana lo pierdes. Ese ejercicio mental es análisis de riesgos."],"quiz":[{"pregunta":"¿Qué protege el cifrado de disco completo?","opciones":["Los datos si el equipo se pierde o es robado","Contra los virus","La batería"],"correcta":0,"porque":"Sin la clave de arranque, el disco entero es ruido: el robo físico queda neutralizado."},{"pregunta":"¿Cuál es el eslabón débil de un disco cifrado?","opciones":["La contraseña de cifrado","El algoritmo AES","El cable"],"correcta":0,"porque":"AES no se rompe: las contraseñas débiles sí. La fuerza está en la clave."},{"pregunta":"¿Por qué borrar archivos no basta en discos sin cifrar?","opciones":["Porque los datos pueden recuperarse de los restos magnéticos o bloques","Porque van a la nube","Porque el disco es lento"],"correcta":0,"porque":"Borrar quita la referencia, no los datos: el cifrado previo es la única garantía."}]},{"titulo":"Seguridad de dispositivos, aplicaciones y malware (020-023)","contenido":["El dispositivo se asegura desde el arranque: contraseña en la BIOS/UEFI, Secure Boot que verifica la firma del sistema, disco cifrado y bloqueo de pantalla automático. Los puertos físicos (USB) son una vía de entrada: los 'USB encontrados' son un cebo clásico de los atacantes.","Las aplicaciones heredan
