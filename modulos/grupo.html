<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0E0C">
<title>Grupo — Les vencimos</title>
<style>

:root{
  --fondo:#0E0E0C;--fondo-2:#161512;--fondo-3:#1C1A16;
  --tinta:#E6E1D6;--suave:#9A9488;--acento:#C4A15A;--acento-texto:#1A160E;
  --linea:rgba(230,225,214,.14);--peligro:#C46A4A;--ok:#8F9A72;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Segoe UI",system-ui,-apple-system,sans-serif;--radio:2px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--fondo);color:var(--tinta);font-family:var(--sans);line-height:1.5}
html{color-scheme:dark}
.wrap{max-width:54rem;margin:0 auto;padding:1.3rem 1.05rem 5rem}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding-bottom:.9rem;border-bottom:1px solid var(--linea);margin-bottom:1.1rem}
header.top a.brand{color:var(--tinta);text-decoration:none;font-family:var(--serif);font-weight:600}
.status{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--suave);font-weight:600}
h1{margin:0 0 .35rem;font-family:var(--serif);font-size:clamp(1.65rem,4.4vw,2.35rem);font-weight:600;line-height:1.12}
h2{font-family:var(--serif);font-weight:600;font-size:1.18rem;margin:.15rem 0 .45rem}
.lead{margin:0 0 1rem;color:var(--suave)}
.tabs{display:flex;flex-wrap:wrap;gap:.35rem;margin:0 0 1rem}
.tabs button,button{min-height:44px;padding:.4rem .8rem;border:1px solid var(--linea);background:var(--fondo-2);color:var(--tinta);border-radius:var(--radio);font:600 .88rem var(--sans);cursor:pointer}
.tabs button.on,button.primary{background:var(--acento);color:var(--acento-texto);border-color:var(--acento)}
.box{background:var(--fondo-2);border:1px solid var(--linea);border-radius:var(--radio);padding:.9rem 1rem;margin:.55rem 0}
.aviso{border-left:3px solid var(--acento);padding:.15rem 0 .15rem .7rem;color:var(--suave);margin:.45rem 0}
.meta{color:var(--suave);font-size:.88rem}
.kicker{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--suave);font-weight:600;margin:0 0 .2rem}
.sib{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1.6rem;padding-top:.8rem;border-top:1px solid var(--linea)}
.sib a{color:var(--acento);text-decoration:none;font-size:.86rem;font-weight:600;min-height:44px;display:inline-flex;align-items:center}
.foot{margin-top:1.2rem;color:var(--suave);font-size:.8rem}
label{display:block;font-size:.74rem;color:var(--suave);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin:.55rem 0 .28rem}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--fondo-3);color:var(--tinta);border:1px solid var(--linea);border-radius:var(--radio);font:inherit;padding:.55rem .65rem}
textarea{min-height:8.5rem;resize:vertical;line-height:1.45}
.row{display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0}
.logo-wrap{width:8.2rem;height:8.2rem;border:1px solid var(--linea);border-radius:var(--radio);background:var(--fondo-3);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.logo-wrap img{width:100%;height:100%;object-fit:cover}
.escenario{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(8.4rem,1fr));gap:.5rem;margin:.7rem 0;padding:.6rem;border:1px solid var(--linea);border-radius:var(--radio);overflow:hidden;min-height:12rem}
.escenario .fondo{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.14;pointer-events:none}
.miembro{background:var(--fondo-3);border:1px solid var(--linea);border-radius:var(--radio);padding:.7rem .75rem;min-height:6.4rem;display:flex;flex-direction:column;justify-content:flex-end;position:relative;z-index:1;text-decoration:none;color:var(--tinta)}
.miembro .rol{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--suave)}
.miembro .nom{font-family:var(--serif);font-size:1.12rem;font-weight:600}
.cab{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;margin:.4rem 0 1rem}
.item{background:var(--fondo-3);border:1px solid var(--linea);border-radius:var(--radio);padding:.7rem .8rem;margin:.4rem 0}
.item h3{margin:0 0 .2rem;font-family:var(--serif);font-size:1.05rem}
.letra-big{font-family:var(--serif);font-size:clamp(1.15rem,3.4vw,1.55rem);line-height:1.45;white-space:pre-wrap}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chips button.on{border-color:var(--acento);color:var(--acento)}

</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <a class="brand" href="musica.html">Les vencimos</a>
  <p class="status">Offline · file:// · sin nube</p>
</header>
<h1 id="titulo">Grupo</h1>
<p class="lead">Tu banda en este aparato: quienes tocan, el logo, las letras y lo que quereis hacer. No se sube a ninguna parte.</p>
<nav class="tabs" id="tabs"></nav>
<div id="app"></div>
<nav class="sib">
  <a href="musica.html">Musica</a>
  <a href="guitarra.html">Guitarra</a>
  <a href="bajo.html">Bajo</a>
  <a href="bateria.html">Bateria</a>
  <a href="canto-solfeo.html">Canto</a>
  <a href="dj.html">DJ</a>
  <a href="electronica.html">Electronica</a>
</nav>
<p class="foot">El logo va aparte de las letras. Si la foto no cabe, el grupo no se pierde. <button type="button" id="wipe">Borrar el grupo de este aparato</button></p>
</div>
<script>

(function(){
  var KEY="lv-grupo-v1";
  var KEYL="lv-grupo-logo-v1";
  var ROLES=[
    ["canto","Canto","canto-solfeo.html"],
    ["coros","Coros","canto-solfeo.html"],
    ["guitarra","Guitarra","guitarra.html"],
    ["guitarra2","Segunda guitarra","guitarra.html"],
    ["bajo","Bajo","bajo.html"],
    ["bateria","Bateria","bateria.html"],
    ["teclado","Teclado","piano.html"],
    ["piano","Piano","piano.html"],
    ["saxo","Saxo","saxofon.html"],
    ["armonica","Armonica","armonica.html"],
    ["dj","DJ","dj.html"],
    ["electro","Electronica","electronica.html"],
    ["otro","Otro",""]
  ];
  var TABS=[["muro","Muro"],["miembros","Miembros"],["canciones","Canciones"],["setlist","Setlist"],["ficha","Ficha"]];
  function uid(){ return "id"+Math.random().toString(36).slice(2,9); }
  function def(){ return {nombre:"", local:"", tab:"muro", hacer:"", miembros:[], canciones:[], setlist:[], ver:null}; }
  var st, logo="";
  try{ st=JSON.parse(localStorage.getItem(KEY)||"null")||def(); }catch(e){ st=def(); }
  try{ logo=localStorage.getItem(KEYL)||""; }catch(e){ logo=""; }
  if(!st.miembros) st.miembros=[];
  if(!st.canciones) st.canciones=[];
  if(!st.setlist) st.setlist=[];
  function saveData(){
    var copy={nombre:st.nombre,local:st.local,tab:st.tab,hacer:st.hacer,miembros:st.miembros,canciones:st.canciones,setlist:st.setlist};
    try{ localStorage.setItem(KEY, JSON.stringify(copy)); return true; }
    catch(e){ alert("No caben las letras en este aparato. Acorta una cancion."); return false; }
  }
  function saveLogo(url){
    try{ localStorage.setItem(KEYL, url||""); logo=url||""; return true; }
    catch(e){ alert("El logo no cabe. El grupo y las letras siguen."); return false; }
  }
  function esc(s){
    s=String(s==null?"":s);
    var o="";
    for(var i=0;i<s.length;i++){
      var c=s.charAt(i);
      if(c==="&") o+="\u0026amp;";
      else if(c==="<") o+="\u0026lt;";
      else if(c===">") o+="\u0026gt;";
      else if(c==="\"") o+="\u0026quot;";
      else o+=c;
    }
    return o;
  }
  function rolNom(id){ for(var i=0;i<ROLES.length;i++) if(ROLES[i][0]===id) return ROLES[i][1]; return "Otro"; }
  function rolHref(id){ for(var i=0;i<ROLES.length;i++) if(ROLES[i][0]===id) return ROLES[i][2]; return ""; }
  var ac=null, metro=null;
  function ensure(){
    if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended") ac.resume();
    return ac;
  }
  function stopMetro(){ if(metro){ clearInterval(metro); metro=null; } }
  function startMetro(bpm){
    stopMetro();
    bpm=Math.max(40, Math.min(240, +bpm||100));
    var ctx=ensure(), acc=0;
    function tick(on){
      var o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime;
      o.type="square"; o.frequency.value=on?880:660;
      g.gain.setValueAtTime(0.07,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.06);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+0.07);
    }
    tick(true);
    metro=setInterval(function(){ acc=(acc+1)%4; tick(acc===0); }, 60000/bpm);
  }
  function nav(){
    document.getElementById("tabs").innerHTML=TABS.map(function(t){
      return '<button type="button" class="'+(st.tab===t[0]?"on":"")+'" data-t="'+t[0]+'">'+t[1]+"</button>";
    }).join("");
    document.getElementById("titulo").textContent=st.nombre||"Grupo";
  }
  function logoHtml(cls){
    if(logo) return '<div class="'+(cls||"logo-wrap")+'"><img alt="Logo del grupo" src="'+logo+'"></div>';
    return '<div class="logo-wrap"><span class="meta">Sin logo</span></div>';
  }
  function paint(){
    stopMetro();
    nav();
    var el=document.getElementById("app");
    if(st.ver){
      var c=st.canciones.filter(function(x){return x.id===st.ver;})[0];
      if(!c){ st.ver=null; }
      else {
        el.innerHTML='<div class="box"><div class="kicker">Letra a pantalla</div><h2></h2><p class="meta" id="letra-meta"></p><div class="letra-big" id="letra-big"></div>'+
          '<div class="row"><button type="button" class="primary" id="metro">Metronomo '+esc(c.bpm||100)+'</button><button type="button" id="metro-off">Parar</button><button type="button" id="cerrar-letra">Volver</button></div></div>';
        el.querySelector("h2").textContent=c.titulo||"";
        document.getElementById("letra-meta").textContent=(c.tono||"—")+" · "+(c.bpm||"—")+" BPM";
        document.getElementById("letra-big").textContent=c.letra||"(Sin letra)";
        return;
      }
    }
    if(st.tab==="muro"){
      var cards=st.miembros.map(function(m){
        var href=rolHref(m.rol);
        var tag=href?"a":"div";
        var extra=href?' href="'+href+'"':'';
        return "<"+tag+' class="miembro"'+extra+'><span class="rol">'+esc(rolNom(m.rol))+'</span><span class="nom">'+esc(m.nombre||"Sin nombre")+"</span></"+tag+">";
      }).join("")||'<p class="meta" style="position:relative;z-index:1">Aun no hay miembros. Anade quien toca.</p>';
      el.innerHTML='<div class="cab">'+logoHtml()+
        '<div><div class="kicker">'+(st.local?esc(st.local):"El grupo")+'</div><h2 style="margin:0">'+(st.nombre?esc(st.nombre):"Sin nombre todavia")+"</h2>"+
        '<p class="meta">'+st.miembros.length+" en el escenario · "+st.canciones.length+" canciones</p></div></div>"+
        (st.hacer?'<div class="box"><div class="kicker">Que queremos hacer</div><p id="plan-txt"></p></div>':"")+
        '<div class="kicker">Escenario</div><div class="escenario"><div class="fondo" id="fondo"></div>'+cards+"</div>"+
        '<p class="aviso">Toca un miembro para abrir su instrumento. Esto es la ficha de ensayo.</p>';
      if(logo) document.getElementById("fondo").style.backgroundImage="url("+logo+")";
      var pt=document.getElementById("plan-txt"); if(pt) pt.textContent=st.hacer;
    } else if(st.tab==="miembros"){
      el.innerHTML='<div class="box"><h2>El grupo</h2>'+
        '<label for="g-nom">Nombre</label><input id="g-nom" type="text" maxlength="60" value="'+esc(st.nombre)+'" placeholder="Los de la plaza">'+
        '<label for="g-loc">Local / ciudad</label><input id="g-loc" type="text" maxlength="40" value="'+esc(st.local||"")+'" placeholder="Valladolid">'+
        '<label>Logo · foto de este aparato</label>'+
        '<div class="cab">'+logoHtml()+'<div><input id="g-logo" type="file" accept="image/*"><p class="meta">Se queda aqui. No se sube. JPEG 384 px.</p>'+
        (logo?'<button type="button" id="logo-off">Quitar logo</button>':"")+"</div></div></div>"+
        '<div class="box"><h2>Anadir miembro</h2>'+
        '<label for="m-nom">Nombre</label><input id="m-nom" type="text" maxlength="40" placeholder="Ana">'+
        '<label>Que toca</label><div class="chips" id="m-roles"></div>'+
        '<label for="m-nota">Nota</label><input id="m-nota" type="text" maxlength="80" placeholder="Ritmica, o segunda voz">'+
        '<div class="row"><button type="button" class="primary" id="m-add">Anadir al grupo</button></div></div>'+
        '<div id="m-list"></div>';
      st._rol="guitarra";
      document.getElementById("m-roles").innerHTML=ROLES.map(function(r){
        return '<button type="button" data-rol="'+r[0]+'" class="'+(st._rol===r[0]?"on":"")+'">'+r[1]+"</button>";
      }).join("");
      drawMembers();
    } else if(st.tab==="canciones"){
      el.innerHTML='<div class="box"><h2>Nueva cancion</h2>'+
        '<label for="c-tit">Titulo</label><input id="c-tit" type="text" maxlength="80">'+
        '<label for="c-ton">Tono</label><input id="c-ton" type="text" maxlength="16" placeholder="Sol, Dm">'+
        '<label for="c-bpm">BPM</label><input id="c-bpm" type="number" min="40" max="240" value="100">'+
        '<label for="c-letra">Letra</label><textarea id="c-letra"></textarea>'+
        '<label for="c-hacer">Que hacer / arreglo</label><textarea id="c-hacer" style="min-height:5rem" placeholder="Intro de bajo. Voz en el 5."></textarea>'+
        '<div class="row"><button type="button" class="primary" id="c-add">Guardar cancion</button></div></div>'+
        '<div id="c-list"></div>';
      drawSongs();
    } else if(st.tab==="setlist"){
      var rows=st.setlist.map(function(id,i){
        var c=st.canciones.filter(function(x){return x.id===id;})[0];
        if(!c) return "";
        return '<div class="item"><h3>'+(i+1)+". "+esc(c.titulo)+'</h3><p class="meta">'+(c.tono||"—")+" · "+(c.bpm||"—")+" BPM</p>"+
          '<div class="row"><button type="button" data-ver="'+id+'">Letra</button><button type="button" data-up="'+id+'">Subir</button><button type="button" data-down="'+id+'">Bajar</button><button type="button" data-out="'+id+'">Sacar</button></div></div>';
      }).join("")||'<p class="meta">Setlist vacio.</p>';
      var pool=st.canciones.filter(function(c){return st.setlist.indexOf(c.id)<0;}).map(function(c){
        return '<button type="button" data-in="'+c.id+'">+ '+esc(c.titulo)+"</button>";
      }).join("");
      el.innerHTML='<div class="box"><h2>Esta noche / este ensayo</h2>'+rows+"</div>"+
        '<div class="box"><h2>Anadir al setlist</h2><div class="row">'+(pool||'<p class="meta">No queda ninguna fuera.</p>')+"</div></div>";
    } else {
      el.innerHTML='<div class="box"><h2>Que quiere este grupo</h2>'+
        '<label for="g-hacer">Plan</label><textarea id="g-hacer"></textarea>'+
        '<div class="row"><button type="button" class="primary" id="plan-ok">Guardar plan</button></div></div>'+
        '<div class="box"><h2>Llevar la ficha a otro aparato</h2>'+
        '<p class="meta">Internet no guarda esto. La ficha es un JSON en tu pincho.</p>'+
        '<div class="row"><button type="button" class="primary" id="exp">Exportar ficha</button>'+
        '<label class="meta" style="margin:0">Importar <input id="imp" type="file" accept="application/json,.json"></label></div></div>';
      document.getElementById("g-hacer").value=st.hacer||"";
    }
  }
  function drawMembers(){
    var box=document.getElementById("m-list"); if(!box) return;
    box.innerHTML=st.miembros.map(function(m){
      return '<div class="item"><h3>'+esc(m.nombre||"Sin nombre")+'</h3><p class="meta">'+esc(rolNom(m.rol))+(m.nota?" · "+esc(m.nota):"")+"</p>"+
        '<button type="button" data-delm="'+m.id+'">Quitar del grupo</button></div>';
    }).join("")||'<p class="meta">Nadie todavia.</p>';
  }
  function drawSongs(){
    var box=document.getElementById("c-list"); if(!box) return;
    box.innerHTML=st.canciones.map(function(c){
      return '<div class="item"><h3>'+esc(c.titulo)+'</h3><p class="meta">'+(c.tono||"—")+" · "+(c.bpm||"—")+" BPM</p>"+
        (c.hacer?'<p class="meta">'+esc(c.hacer)+"</p>":"")+
        '<div class="row"><button type="button" data-ver="'+c.id+'">Letra a pantalla</button><button type="button" data-dels="'+c.id+'">Quitar cancion</button></div></div>';
    }).join("")||'<p class="meta">Aun no hay canciones.</p>';
  }
  function shrinkLogo(file, cb){
    if(!file || !file.type || file.type.indexOf("image/")!==0){ alert("Elige una imagen."); return; }
    if(file.size>8*1024*1024){ alert("Esa foto pesa demasiado."); return; }
    var r=new FileReader();
    r.onerror=function(){ alert("No pude leer esa imagen."); };
    r.onload=function(){
      var im=new Image();
      im.onload=function(){
        var max=384, w=im.width, h=im.height;
        if(w>max||h>max){ var s=max/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
        var cv=document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(im,0,0,w,h);
        var url=cv.toDataURL("image/jpeg",0.72);
        if(url.length>350000) url=cv.toDataURL("image/jpeg",0.48);
        if(url.length>350000){ alert("Sigue pesando. Recorta la foto."); return; }
        cb(url);
      };
      im.onerror=function(){ alert("Esa imagen no se pudo abrir."); };
      im.src=r.result;
    };
    r.readAsDataURL(file);
  }
  document.getElementById("tabs").addEventListener("click", function(e){
    var b=e.target.closest("button[data-t]"); if(!b) return;
    st.tab=b.dataset.t; st.ver=null; saveData(); paint();
  });
  document.getElementById("app").addEventListener("input", function(e){
    if(e.target.id==="g-nom"){ st.nombre=e.target.value; saveData(); document.getElementById("titulo").textContent=st.nombre||"Grupo"; }
    if(e.target.id==="g-loc"){ st.local=e.target.value; saveData(); }
  });
  document.getElementById("app").addEventListener("change", function(e){
    if(e.target.id==="g-logo" && e.target.files && e.target.files[0]){
      shrinkLogo(e.target.files[0], function(url){ if(saveLogo(url)) paint(); });
    }
    if(e.target.id==="imp" && e.target.files && e.target.files[0]){
      var fr=new FileReader();
      fr.onload=function(){
        try{
          var data=JSON.parse(fr.result);
          if(!data || typeof data!=="object") throw new Error("x");
          var next=def();
          next.nombre=String(data.nombre||"").slice(0,60);
          next.local=String(data.local||"").slice(0,40);
          next.hacer=String(data.hacer||"").slice(0,4000);
          next.miembros=Array.isArray(data.miembros)?data.miembros.slice(0,16).map(function(m){
            return {id:uid(), nombre:String(m.nombre||"").slice(0,40), rol:String(m.rol||"otro").slice(0,20), nota:String(m.nota||"").slice(0,80)};
          }):[];
          next.canciones=Array.isArray(data.canciones)?data.canciones.slice(0,60).map(function(c){
            return {id:uid(), titulo:String(c.titulo||"Sin titulo").slice(0,80), tono:String(c.tono||"").slice(0,16), bpm:+c.bpm||100, letra:String(c.letra||"").slice(0,8000), hacer:String(c.hacer||"").slice(0,2000)};
          }):[];
          next.setlist=next.canciones.map(function(c,i){ return (data.setlist && data.setlist[i])?c.id:null; }).filter(Boolean);
          if(Array.isArray(data.setlist) && data.canciones){
            next.setlist=data.setlist.map(function(old,i){
              return next.canciones[i]?next.canciones[i].id:null;
            }).filter(Boolean);
          }
          if(!saveData.call({})) {}
          st=next; saveData();
          if(typeof data.logo==="string" && data.logo.indexOf("data:image/")===0) saveLogo(data.logo);
          st.tab="muro"; saveData(); paint();
        }catch(err){ alert("Esa ficha no se entiende. No he tocado lo que habia."); }
      };
      fr.readAsText(e.target.files[0]);
    }
  });
  document.getElementById("app").addEventListener("click", function(e){
    var b=e.target.closest("button"); if(!b) return;
    if(b.dataset.rol){
      st._rol=b.dataset.rol;
      document.querySelectorAll("#m-roles button").forEach(function(x){ x.className=x.dataset.rol===st._rol?"on":""; });
      return;
    }
    if(b.id==="m-add"){
      var nom=document.getElementById("m-nom").value.trim();
      if(!nom){ alert("Pon un nombre."); return; }
      if(st.miembros.length>=16){ alert("Dieciseis llegan."); return; }
      st.miembros.push({id:uid(), nombre:nom, rol:st._rol||"otro", nota:document.getElementById("m-nota").value.trim()});
      saveData(); paint(); return;
    }
    if(b.id==="logo-off"){ saveLogo(""); paint(); return; }
    if(b.dataset.delm){ st.miembros=st.miembros.filter(function(m){return m.id!==b.dataset.delm;}); saveData(); paint(); return; }
    if(b.id==="c-add"){
      var tit=document.getElementById("c-tit").value.trim();
      if(!tit){ alert("Pon un titulo."); return; }
      if(st.canciones.length>=60){ alert("Sesenta canciones llegan."); return; }
      st.canciones.push({id:uid(), titulo:tit, tono:document.getElementById("c-ton").value.trim(), bpm:+document.getElementById("c-bpm").value||100, letra:document.getElementById("c-letra").value, hacer:document.getElementById("c-hacer").value.trim()});
      saveData(); paint(); return;
    }
    if(b.dataset.dels){
      var id=b.dataset.dels;
      st.canciones=st.canciones.filter(function(c){return c.id!==id;});
      st.setlist=st.setlist.filter(function(x){return x!==id;});
      saveData(); paint(); return;
    }
    if(b.dataset.ver){ st.ver=b.dataset.ver; paint(); return; }
    if(b.id==="cerrar-letra"){ st.ver=null; paint(); return; }
    if(b.id==="metro"){
      var c=st.canciones.filter(function(x){return x.id===st.ver;})[0];
      if(c) startMetro(c.bpm); return;
    }
    if(b.id==="metro-off"){ stopMetro(); return; }
    if(b.dataset.in){ st.setlist.push(b.dataset.in); saveData(); paint(); return; }
    if(b.dataset.out){ st.setlist=st.setlist.filter(function(x){return x!==b.dataset.out;}); saveData(); paint(); return; }
    if(b.dataset.up){
      var i=st.setlist.indexOf(b.dataset.up);
      if(i>0){ var t=st.setlist[i-1]; st.setlist[i-1]=st.setlist[i]; st.setlist[i]=t; saveData(); paint(); }
      return;
    }
    if(b.dataset.down){
      var j=st.setlist.indexOf(b.dataset.down);
      if(j>=0 && j<st.setlist.length-1){ var u=st.setlist[j+1]; st.setlist[j+1]=st.setlist[j]; st.setlist[j]=u; saveData(); paint(); }
      return;
    }
    if(b.id==="plan-ok"){ st.hacer=document.getElementById("g-hacer").value; saveData(); b.textContent="Guardado"; return; }
    if(b.id==="exp"){
      var payload={v:1,nombre:st.nombre,local:st.local,hacer:st.hacer,miembros:st.miembros,canciones:st.canciones,setlist:st.setlist};
      if(logo && logo.length<300000) payload.logo=logo;
      var blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
      var a=document.createElement("a");
      a.href=URL.createObjectURL(blob);
      a.download=(st.nombre||"grupo").replace(/[^\w\- ]+/g,"").slice(0,40)+"-ficha.json";
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 800);
    }
  });
  document.getElementById("wipe").onclick=function(){
    if(!confirm("Borrar el grupo, el logo y las letras de este aparato?")) return;
    localStorage.removeItem(KEY); localStorage.removeItem(KEYL); st=def(); logo=""; paint();
  };
  paint();
})();
</script>
</body>
</html>
