<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0E0C">
<title>Apagón — Les vencimos</title>
<style>

:root{
  --fondo:#0E0E0C; --fondo-2:#161512; --fondo-3:#1C1A16;
  --tinta:#E6E1D6; --suave:#9A9488;
  --acento:#C4A15A; --acento-texto:#1A160E;
  --linea:rgba(230,225,214,0.14);
  --peligro:#C46A4A; --ok:#8F9A72; --fase:#5B8FA8;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",Georgia,serif;
  --sans:"Segoe UI",system-ui,-apple-system,sans-serif;
  --radio:2px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--fondo);color:var(--tinta);font-family:var(--sans)}
body{padding:1.15rem 1rem 3.5rem;max-width:40rem;margin:0 auto}
header{border-bottom:1px solid var(--linea);padding-bottom:.85rem;margin-bottom:1rem}
header h1{margin:0;font-family:var(--serif);font-size:1.55rem;font-weight:600}
header p{margin:.35rem 0 0;color:var(--suave);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}
.badge-vida{display:inline-block;margin-top:.55rem;padding:.2rem .55rem;border:1px solid var(--acento);color:var(--acento);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;border-radius:var(--radio)}
.aviso{background:var(--fondo-2);border:1px solid var(--linea);border-left:4px solid var(--peligro);padding:.9rem 1rem;margin:0 0 1.1rem;border-radius:var(--radio);font-size:.95rem}
.aviso.ok{border-left-color:var(--ok)}
.aviso.info{border-left-color:var(--acento)}
.aviso strong{color:var(--peligro)}
.aviso.ok strong,.aviso.info strong{color:var(--acento)}
.aviso ul{margin:.4rem 0 0;padding-left:1.15rem;color:var(--suave)}
.aviso li{margin:.25rem 0}
.toc{display:flex;flex-direction:column;gap:.45rem;margin-bottom:1.25rem}
.toc button{text-align:left;padding:.9rem 1rem;background:var(--fondo-2);border:1px solid var(--linea);border-radius:var(--radio);color:inherit;font:inherit;cursor:pointer}
.toc button:hover,.toc button:focus{border-color:var(--acento)}
.toc .t{font-family:var(--serif);font-weight:600;font-size:1.08rem}
.toc .m{color:var(--suave);font-size:.85rem;margin-top:.2rem}
.back{margin:0 0 .85rem}
button{min-height:48px;padding:0 1rem;font:600 .95rem var(--sans);border:1px solid var(--linea);border-radius:var(--radio);background:var(--fondo-3);color:var(--tinta);cursor:pointer}
button.primary{background:var(--acento);color:var(--acento-texto);border-color:var(--acento)}
button.ghost{background:transparent}
.lesson h2{margin:0 0 .75rem;font-family:var(--serif);font-size:1.45rem;font-weight:600}
.step{background:var(--fondo-2);border:1px solid var(--linea);border-radius:var(--radio);padding:1rem;margin:0 0 .85rem}
.step .num{display:inline-block;color:var(--acento);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:.4rem}
.step p{margin:.35rem 0 0;line-height:1.45}
.tip{margin:.55rem 0 0;padding:.55rem .7rem;background:var(--fondo-3);border-left:3px solid var(--acento);font-size:.9rem;color:var(--suave)}
.diag{background:#0a0a09;border:1px solid var(--linea);border-radius:var(--radio);padding:.75rem;margin:.75rem 0 0;overflow:hidden}
.diag svg{display:block;width:100%;height:auto;max-height:220px}
.nav-steps{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
.foot{margin-top:1.6rem;color:var(--suave);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
.hidden{display:none!important}
.plant-grid{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin:.75rem 0}
@media(max-width:420px){.plant-grid{grid-template-columns:1fr}}
.plant-card{background:var(--fondo-2);border:1px solid var(--linea);border-radius:var(--radio);padding:.85rem}
.plant-card h3{margin:0 0 .35rem;font-family:var(--serif);font-size:1.05rem}
.plant-card p{margin:0;color:var(--suave);font-size:.88rem;line-height:1.4}
.checklist{display:flex;flex-direction:column;gap:.4rem;margin:.5rem 0 0}
.check{display:flex;gap:.65rem;align-items:flex-start;padding:.7rem .85rem;background:var(--fondo-3);border:1px solid var(--linea);border-radius:var(--radio);font-size:.92rem;line-height:1.35}
.check .box{width:18px;height:18px;border:2px solid var(--acento);border-radius:2px;flex-shrink:0;margin-top:.1rem}
@keyframes drip{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(8px);opacity:1}}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes spin-slow{to{transform:rotate(360deg)}}
@keyframes hammer{0%,100%{transform:rotate(0)}40%{transform:rotate(-25deg)}60%{transform:rotate(10deg)}}
.drip{animation:drip 1.4s ease-in-out infinite}
.sway{transform-origin:center bottom;animation:sway 2.5s ease-in-out infinite}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.spin-slow{transform-origin:center;animation:spin-slow 4s linear infinite}
.hammer{transform-origin:20px 80px;animation:hammer 1.2s ease-in-out infinite}

</style>
</head>
<body>
<header>
  <h1>Apagón</h1>
  <p>Sin luz · tips concretos</p>
  <span class="badge-vida">Vida · no cole</span>
</header>

<div class="aviso" role="alert">
  <strong>Apagón · casa</strong>
  <ul>
    <li>Linterna antes que velas. Nevera cerrada. Medicación a mano.</li>
    <li>Cuadro: ver también <strong>Electricidad</strong> («se va la luz»).</li>
    <li>Urgencias <strong>112</strong>. No uses el ascensor sin luz.</li>
  </ul>
</div>

<div id="toc" class="toc"></div>
<main id="app"></main>
<p class="foot">Les vencimos · dibujos SVG · offline · aprender para la vida</p>

<script>

(function(){
  const LESSONS = [
    {id:'ya', titulo:'Se fue la luz ahora', meta:'Primeros minutos', steps:[
      {t:'Respira y mira', d:'¿Solo tu casa o también el portal/calle? Pregunta a un vecino. Si es general, avisa a la compañía cuando puedas.', svg:'out'},
      {t:'Linterna primero', d:'No uses velas si puedes evitarlo (incendio). Linterna o frontal. Móvil con poca pantalla.', svg:'torch'},
      {t:'Cuadro eléctrico', d:'Si solo es tu casa: mira diferencial/PIA (ver Electricidad → «se va la luz»). No rearmes en bucle.', svg:'panel'},
      {t:'Prioridades', d:'Personas vulnerables, medicación, nevera cerrada, calma en casa.', svg:'prio'}
    ]},
    {id:'nevera', titulo:'Nevera y comida', meta:'Qué se salva', steps:[
      {t:'No abras', d:'Nevera cerrada aguanta horas; congelador más. Cada apertura pierde frío.', svg:'fridge'},
      {t:'Orden de consumo', d:'Primero nevera (lácteos, carne cocinada). Luego congelados que empiecen a ablandarse (cocinar y comer).', svg:'eat'},
      {t:'Cuando tirar', d:'Si estuvo >4 h por encima de 5 °C en nevera o comida caliente dudosa: mejor desechar. «Si dudas, fuera».', svg:'trash'},
      {t:'Sin cocina eléctrica', d:'Si tienes gas/camping-gas seguro y ventilado, úsalo con cuidado. Nunca carbón dentro de casa (CO).', svg:'cook'}
    ]},
    {id:'luz', titulo:'Luz y pilas', meta:'Linternas · radio', steps:[
      {t:'Kit de luz', d:'Linterna + pilas de sobra (o recargable siempre a tope). Una por planta/habitación clave.', svg:'torch'},
      {t:'Radio a pilas', d:'Para avisos si no hay datos. Marca emisoras locales antes.', svg:'radio'},
      {t:'Móvil', d:'Modo ahorro. Powerbank. Mensajes cortos mejor que vídeo.', svg:'phone'},
      {t:'Evita sobrecargar', d:'Al volver la luz, enciende poco a poco (no todo a la vez).', svg:'back'}
    ]},
    {id:'personas', titulo:'Personas y vecinos', meta:'Medicación · frío', steps:[
      {t:'Medicación', d:'Quién la necesita con horario. Nevera de medicamentos: bolsa isotérmica + hielo si se va mucho tiempo (consulta prospecto).', svg:'meds'},
      {t:'Frío / calor', d:'Abrigo en capas. En verano: ventilación nocturna, hidratación. Cuidado estufas improvisadas.', svg:'climate'},
      {t:'Vecinos', d:'Toca al de al lado: ¿mayores solos? ¿alguien depende de electricidad médica? Coordina.', svg:'neighbors'},
      {t:'Ascensor', d:'No lo uses en apagón. Si alguien queda atrapado: 112 y conserjería.', svg:'lift'}
    ]},
    {id:'prep', titulo:'Preparar el próximo', meta:'Lista práctica', steps:[
      {t:'Checklist', d:'Linternas, pilas, powerbank, radio, agua, comida lista, botiquín, efectivo menudo, copia documentos.', svg:'list'},
      {t:'Ensayo mental', d:'¿Dónde está todo? ¿Quién hace qué? 5 minutos de acuerdo familiar valen mucho.', svg:'plan'},
      {t:'Electricidad', d:'Repasa el cuadro con el módulo Electricidad (diferencial, PIA). Etiqueta circuitos si puedes.', svg:'panel'},
      {t:'Más resiliencia', d:'Agua a medio plazo, vecinos, mentalidad: módulo Resiliencia.', svg:'link'}
    ]}
  ];
  const SVG = {
    out:`<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="40" y="40" width="70" height="80" fill="#161512" stroke="#9A9488"/><rect x="125" y="40" width="70" height="80" fill="#161512" stroke="#9A9488"/><rect x="210" y="40" width="70" height="80" fill="#161512" stroke="#9A9488"/><circle class="pulse" cx="160" cy="30" r="8" fill="#C46A4A"/></svg>`,
    torch:`<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="60" y="70" width="120" height="28" rx="4" fill="#1C1A16" stroke="#C4A15A"/><path d="M180 70 L260 50 L260 118 L180 98 Z" fill="#C4A15A" class="pulse" opacity=".7"/></svg>`,
    panel:`<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="90" y="25" width="140" height="110" rx="4" fill="#1C1A16" stroke="#C4A15A"/><rect class="pulse" x="110" y="50" width="40" height="18" fill="#C46A4A"/><rect x="170" y="50" width="40" height="18" fill="#8F9A72"/><text x="160" y="110" text-anchor="middle" fill="#9A9488" font-size="11">Ver Electricidad</text></svg>`,
    prio:`<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="80" cy="80" r="28" fill="#C4A15A"/><text x="80" y="85" text-anchor="middle" fill="#0E0E0C" font-size="12">1</text><circle cx="160" cy="80" r="28" fill="#5B8FA8"/><text x="160" y="85" text-anchor="middle" fill="#0E0E0C" font-size="12">2</text><circle cx="240" cy="80" r="28" fill="#8F9A72"/><text x="240" y="85" text-anchor="middle" fill="#0E0E0C" font-size="12">3</text></svg>`,
    fridge:`<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="110" y="25" width="100" height="120" rx="4" fill="#161512" stroke="#5B8FA8"/><line x1="110" y1="80" x2="210" y2="80" stroke="#9A9488"/><text x="160" y="60" text-anchor="middle" fill="#C4A15A" font-size="11">CERRADA</text></svg>`,
    eat:`<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="100" cy="80" r="30" fill="#8F9A72"/><circle cx="180" cy="80" r="30" fill="#C4A15A"/><circle cx="250" cy="80" r="24" fill="#5B8FA8" opacity=".5"/><text x="160" y="140" text-anchor="middle" fill="#9A9488" font-size="12">Perecedero primero</text></svg>`,
    trash:`<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M120 50 H200 L190 140 H130 Z" fill="#1C1A16" stroke="#C46A4A"/><rect x="110" y="40" width="100" height="12" fill="#C46A4A"/><text x="160" y="100" text-anchor="middle" fill="#C46A4A" font-size="12">Duda = fuera</text></svg>`,
    cook:`<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="100" y="80" width="120" height="40" fill="#1C1A16" stroke="#C4A15A"/><circle class="pulse" cx="140" cy="70" r="10" fill="#C46A4A"/><circle class="pulse" cx="180" cy="70" r="10" fill="#C46A4A" style="animation-delay:.2s"/><text x="160" y="145" text-anchor="middle" fill="#9A9488" font-size="11">Ventilar · nunca carbón dentro</text></svg>`,
    radio:`<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="70" y="50" width="180" height="70" rx="6" fill="#1C1A16" stroke="#C4A15A"/><circle class="pulse" cx="120" cy="85" r="16" fill="#C4A15A"/><line x1="220" y1="40" x2="250" y2="20" stroke="#9A9488" stroke-width="3"/></svg>`,
    phone:`<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="130" y="30" width="60" height="100" rx="8" fill="#161512" stroke="#8F9A72"/><rect class="pulse" x="140" y="100" width="40" height="8" fill="#8F9A72"/></svg>`,
    back:`<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="60" y="50" width="50" height="60" fill="#8F9A72" class="pulse"/><rect x="130" y="50" width="50" height="60" fill="#9A9488" opacity=".4"/><rect x="200" y="50" width="50" height="60" fill="#9A9488" opacity=".2"/><text x="160" y="140" text-anchor="middle" fill="#9A9488" font-size="12">Poco a poco</text></svg>`,
    meds:`<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="110" y="40" width="100" height="80" rx="6" fill="#E6E1D6"/><text x="160" y="90" text-anchor="middle" fill="#0E0E0C" font-size="12">Rx</text></svg>`,
    climate:`<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="100" cy="80" r="28" fill="#5B8FA8"/><circle cx="220" cy="80" r="28" fill="#C4A15A"/><text x="100" y="85" text-anchor="middle" fill="#0E0E0C" font-size="11">Frío</text><text x="220" y="85" text-anchor="middle" fill="#0E0E0C" font-size="11">Calor</text></svg>`,
    neighbors:`<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="100" cy="90" r="22" fill="#C4A15A"/><circle cx="160" cy="70" r="22" fill="#8F9A72"/><circle cx="220" cy="90" r="22" fill="#5B8FA8"/></svg>`,
    lift:`<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="110" y="30" width="100" height="110" fill="#1C1A16" stroke="#C46A4A"/><text x="160" y="95" text-anchor="middle" fill="#C46A4A" font-size="14">NO</text></svg>`,
    list:`<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="80" y="25" width="160" height="120" fill="#161512" stroke="#C4A15A"/><path d="M110 55 H200 M110 80 H200 M110 105 H180" stroke="#8F9A72" stroke-width="3"/></svg>`,
    plan:`<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="160" cy="75" r="40" fill="none" stroke="#C4A15A" stroke-width="2"/><text x="160" y="80" text-anchor="middle" fill="#C4A15A" font-size="12">Plan</text></svg>`,
    link:`<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="40" y="55" width="100" height="50" rx="4" fill="#1C1A16" stroke="#C4A15A"/><text x="90" y="85" text-anchor="middle" fill="#C4A15A" font-size="11">Resiliencia</text><rect x="180" y="55" width="100" height="50" rx="4" fill="#1C1A16" stroke="#5B8FA8"/><text x="230" y="85" text-anchor="middle" fill="#5B8FA8" font-size="11">Electricidad</text></svg>`
  };
  let current=null, step=0;
  const toc=document.getElementById('toc'), app=document.getElementById('app');
  function showToc(){
    current=null; app.innerHTML=''; toc.classList.remove('hidden');
    toc.innerHTML=LESSONS.map(l=>'<button type="button" data-id="'+l.id+'"><div class="t">'+l.titulo+'</div><div class="m">'+l.meta+'</div></button>').join('')+
      '<p style="color:var(--suave);font-size:.9rem;margin:.75rem 0 0">Cuadro y rearmar: módulo <strong>Electricidad</strong> → «Cuando se va la luz». No duplicamos ese tema aquí.</p>';
    toc.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openLesson(b.getAttribute('data-id')));
  }
  function openLesson(id){ current=LESSONS.find(x=>x.id===id); step=0; toc.classList.add('hidden'); renderStep(); }
  function renderStep(){
    const L=current, s=L.steps[step], svg=SVG[s.svg]||SVG.torch;
    app.innerHTML='<div class="back"><button type="button" class="ghost" id="back">← Temas</button></div><article class="lesson"><h2>'+L.titulo+'</h2><div class="step"><div class="num">Paso '+(step+1)+' de '+L.steps.length+'</div><strong style="font-family:var(--serif);font-size:1.15rem">'+s.t+'</strong><p>'+s.d+'</p><div class="diag">'+svg+'</div></div><div class="nav-steps"><button type="button" id="prev"'+(step<=0?' disabled':'')+'>Anterior</button><button type="button" class="primary" id="next">'+(step>=L.steps.length-1?'Terminar':'Siguiente')+'</button></div></article>';
    document.getElementById('back').onclick=showToc;
    document.getElementById('prev').onclick=()=>{if(step>0){step--;renderStep();}};
    document.getElementById('next').onclick=()=>{if(step>=L.steps.length-1)showToc();else{step++;renderStep();}};
  }
  showToc();
})();

</script>
</body>
</html>
