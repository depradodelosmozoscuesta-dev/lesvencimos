<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0E0C">

<title>Economía — Les vencimos</title>
<style>

:root{
  --fondo:#0E0E0C; --fondo-2:#161512; --fondo-3:#1C1A16;
  --tinta:#E6E1D6; --suave:#9A9488;
  --acento:#C4A15A; --acento-texto:#1A160E;
  --linea:rgba(230,225,214,0.14);
  --peligro:#C46A4A; --ok:#8F9A72; --aviso:#C4A15A;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",Georgia,serif;
  --sans:"Segoe UI",system-ui,-apple-system,sans-serif;
  --radio:2px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--fondo);color:var(--tinta);font-family:var(--sans)}
body{padding:1.15rem 1rem 3rem;max-width:40rem;margin:0 auto}
header{border-bottom:1px solid var(--linea);padding-bottom:.85rem;margin-bottom:1rem}
header h1{margin:0;font-family:var(--serif);font-size:1.55rem;font-weight:600}
header p{margin:.35rem 0 0;color:var(--suave);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}
.disclaimer{background:var(--fondo-2);border:1px solid var(--linea);border-left:3px solid var(--peligro);padding:.85rem 1rem;margin:0 0 1rem;font-size:.9rem;color:var(--suave);border-radius:var(--radio);line-height:1.45}
.disclaimer.ok{border-left-color:var(--ok)}
.disclaimer.aviso{border-left-color:var(--aviso)}
.disclaimer strong{color:var(--tinta)}
.tabs{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 1rem}
.tabs button{min-height:44px;padding:.45rem .85rem;font:600 .85rem var(--sans);border:1px solid var(--linea);border-radius:var(--radio);background:var(--fondo-3);color:var(--tinta);cursor:pointer}
.tabs button.on{background:var(--acento);color:var(--acento-texto);border-color:var(--acento)}
h2{margin:1.2rem 0 .65rem;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--suave);font-weight:600}
h3{margin:.9rem 0 .45rem;font-family:var(--serif);font-size:1.12rem;font-weight:600}
.panel{background:var(--fondo-2);border:1px solid var(--linea);border-radius:var(--radio);padding:1rem;margin-bottom:.85rem}
.card{display:block;width:100%;text-align:left;padding:.85rem 1rem;margin:0 0 .5rem;background:var(--fondo-2);border:1px solid var(--linea);border-radius:var(--radio);color:inherit;font:inherit;cursor:pointer}
.card:hover,.card:focus{border-color:var(--acento)}
.card .t{font-family:var(--serif);font-weight:600;font-size:1.05rem}
.card .m{color:var(--suave);font-size:.85rem;margin-top:.25rem}
button,.btn{min-height:48px;padding:0 1rem;font:600 .95rem var(--sans);border:1px solid var(--linea);border-radius:var(--radio);background:var(--fondo-3);color:var(--tinta);cursor:pointer}
button.primary,.btn.primary{background:var(--acento);color:var(--acento-texto);border-color:var(--acento)}
button.danger{color:var(--peligro)}
button.ghost{background:transparent}
button.sm{min-height:40px;padding:0 .7rem;font-size:.85rem}
label.field{display:block;margin:0 0 .75rem}
label.field span{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--suave);margin-bottom:.3rem}
input,select,textarea{width:100%;min-height:48px;padding:.55rem .75rem;font:inherit;background:var(--fondo-3);color:var(--tinta);border:1px solid var(--linea);border-radius:var(--radio)}
textarea{min-height:6rem;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.row > *{flex:1 1 auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem}
@media(max-width:480px){.grid2,.grid3{grid-template-columns:1fr}}
.badge{display:inline-block;padding:.15rem .45rem;border:1px solid var(--linea);border-radius:var(--radio);font-size:.72rem;color:var(--acento);letter-spacing:.06em;text-transform:uppercase}
.badge.alta{color:var(--peligro);border-color:var(--peligro)}
.badge.media{color:var(--aviso)}
.badge.baja{color:var(--ok);border-color:var(--ok)}
.empty{color:var(--suave);font-size:.95rem;padding:.4rem 0}
.foot{margin-top:1.6rem;color:var(--suave);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
.check-item{display:flex;align-items:flex-start;gap:.65rem;padding:.75rem .9rem;background:var(--fondo-2);border:1px solid var(--linea);border-radius:var(--radio);cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit;margin:0 0 .45rem}
.check-item.done{opacity:.55}
.check-item .box{width:22px;height:22px;border:2px solid var(--linea);border-radius:var(--radio);flex-shrink:0;margin-top:.1rem}
.check-item.done .box{background:var(--ok);border-color:var(--ok)}
.check-item .txt{flex:1;line-height:1.35}
.bar{height:10px;background:var(--fondo-3);border:1px solid var(--linea);border-radius:var(--radio);overflow:hidden;margin:.45rem 0}
.bar > i{display:block;height:100%;background:var(--acento);width:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:.5rem 0 1rem}
.stat{background:var(--fondo-2);border:1px solid var(--linea);border-radius:var(--radio);padding:.75rem}
.stat .n{font-family:var(--serif);font-size:1.35rem;font-weight:600}
.stat .l{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--suave);margin-top:.2rem}
.item{display:flex;gap:.5rem;align-items:flex-start;justify-content:space-between;padding:.75rem .9rem;background:var(--fondo-2);border:1px solid var(--linea);border-radius:var(--radio);margin:0 0 .45rem}
.item .meta{flex:1;min-width:0}
.item .meta .ttl{font-weight:600}
.item .meta .sub{color:var(--suave);font-size:.85rem;margin-top:.15rem}
.item .amt{font-family:var(--serif);font-weight:600;white-space:nowrap}
.tip{margin:0 0 .65rem;padding:.75rem .9rem;background:var(--fondo-2);border:1px solid var(--linea);border-left:3px solid var(--acento);border-radius:var(--radio)}
.tip .tt{font-weight:600;margin:0 0 .25rem}
.tip .tb{margin:0;color:var(--suave);font-size:.92rem;line-height:1.45}
.tip.impact-alta{border-left-color:var(--peligro)}
.tip.impact-media{border-left-color:var(--aviso)}
.tip.impact-baja{border-left-color:var(--ok)}
.menu-day{margin:0 0 .75rem}
.menu-day h3{margin:0 0 .4rem;font-family:var(--serif);font-size:1.1rem}
.menu-day ul{margin:0;padding-left:1.1rem;color:var(--suave)}
.menu-day li{margin:.2rem 0}
.muted{color:var(--suave)}
.ok-txt{color:var(--ok)}
.bad-txt{color:var(--peligro)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.svg-wrap{background:var(--fondo-3);border:1px solid var(--linea);border-radius:var(--radio);padding:.75rem;margin:.5rem 0 1rem;overflow-x:auto}
.svg-wrap svg{display:block;max-width:100%;height:auto}
.svg-caption{font-size:.8rem;color:var(--suave);margin:.35rem 0 0;line-height:1.35}
.steps{display:flex;flex-wrap:wrap;gap:.35rem;margin:0 0 1rem}
.steps button{min-height:40px;padding:.35rem .65rem;font:600 .78rem var(--sans);border:1px solid var(--linea);border-radius:var(--radio);background:var(--fondo-3);color:var(--suave);cursor:pointer}
.steps button.on{background:var(--acento);color:var(--acento-texto);border-color:var(--acento)}
.steps button.done{color:var(--tinta);border-color:var(--ok)}
.ficha{border:1px solid var(--linea);border-radius:var(--radio);padding:.9rem 1rem;margin:0 0 .65rem;background:var(--fondo-2)}
.ficha h3{margin:0 0 .4rem;font-size:1.05rem}
.ficha .why{color:var(--acento);font-size:.85rem;margin:0 0 .5rem}
.tabla{width:100%;border-collapse:collapse;font-size:.9rem;margin:.5rem 0}
.tabla th,.tabla td{border:1px solid var(--linea);padding:.45rem .55rem;text-align:left}
.tabla th{color:var(--suave);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:.5rem .85rem;font-size:.8rem;color:var(--suave);margin:.35rem 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:1px;margin-right:.35rem;vertical-align:middle}
.num-step{display:inline-flex;align-items:center;justify-content:center;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--acento);color:var(--acento-texto);font-weight:700;font-size:.85rem;margin-right:.45rem}
.prose{line-height:1.5;color:var(--suave);font-size:.95rem}
.prose strong{color:var(--tinta)}
.callout{padding:.85rem 1rem;border:1px dashed var(--linea);border-radius:var(--radio);margin:.65rem 0;background:var(--fondo-3)}
.cmp-box{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}
@media(max-width:480px){.cmp-box{grid-template-columns:1fr}}
.cmp-card{padding:.75rem;border:1px solid var(--linea);border-radius:var(--radio);background:var(--fondo-3)}
.cmp-card.win{border-color:var(--ok)}
.ttl{font-weight:600}

</style>
</head>

a poca cantidad, olla a presión para legumbres."], ["media", "Horno", "Precalentar solo lo necesario. Varios platos seguidos. No abrir la puerta «a mirar» cada minuto."], ["baja", "Radiadores y circulación", "No tapar radiadores con sofás. Purgar si hay aire. Muebles que bloquean el flujo tiran el calor."], ["baja", "Ventilar con sentido", "5–10 min con calefacción/AC apagados, luego cerrar. Ventilar horas con sistema encendido es tirar energía."], ["baja", "Grifos y aireadores", "Aireadores baratos reducen caudal manteniendo sensación. Cerrar bien; reparar goteos pronto."], ["baja", "Cisterna de doble descarga", "Si puedes, usa el botón corto. Una botella llena dentro del depósito (sin interferir mecanismo) reduce volumen en cisternas antiguas."], ["baja", "Lavado de coche / manguera", "Cubo frente a manguera abierta. En comunidades, respeta normas; el desperdicio se paga en recibo."], ["baja", "Ordenadores y pantallas", "Apagar pantalla, suspender PC, brillo razonable. Un PC gaming 24/7 es un radiador caro."], ["baja", "Router y secundarios", "Un solo router suele bastar. Apagar repetidores/PLC si no se usan. LEDs de equipo: menores, pero hábitos suman."], ["baja", "Hervidor y cafetera", "Calienta solo el agua que vas a usar. Descalcificar: menos tiempo = menos kWh."], ["baja", "Congelar raciones", "Menos microondas/horno de emergencia y menos pedidos a domicilio por «no hay nada»."], ["baja", "Riego y terraza", "Riega temprano/tarde; platos bajo macetas. En verano el mediodía evapora el agua."], ["baja", "Revisar factura con lupa", "Anota kWh y € tres meses. Sin números, no hay mejora. Detecta fugas de hábito, no solo de tubería."], ["baja", "Electrodomésticos al reemplazar", "Cuando un aparato muera: mira etiqueta energética y tamaño real que necesitas. No anticipes compra «por si acaso»."], ["baja", "Lavavajillas vs a mano", "A mano con grifo abierto suele gastar más agua caliente. Si tienes lavavajillas, carga completa eco."], ["baja", "Apaga el piloto del calentador (si aplica)", "En algunos sistemas el piloto consume sin parar. Revisa manual y seguridad; no improvises con gas."], ["media", "Contrato y potencia: anota números", "Sin anotar kWh y € tres meses, cualquier tip es fe."]], "energiaHabits": [["termo_noche", "Reviso o programo el termo (horas valle / apagado si no hace falta)."], ["regletas", "Apago regletas de TV/consola al acostarme."], ["ducha", "Ducha ≤ 5–7 minutos; cierro grifo al enjabonar."], ["lavadora", "Pongo lavadora/lavavajillas a carga completa y eco."], ["luces", "Apago luces y LED decorativos al salir de la habitación."], ["ventilar", "Ventilo 5–10 min con calefacción/AC apagados, luego cierro."], ["nevera", "No meto comida caliente; reviso juntas de la puerta."], ["fugas", "Miro cisterna y grifos por goteos."], ["persianas", "En verano bajo persianas al sol fuerte; en invierno abro de día y cierro de noche."], ["carga", "Cargo el móvil/portátil a conciencia; no dejo cargadores calientes enchufados días."]], "habitos": [["revisar_gastos", "Reviso los gastos de la semana (app, libreta o tickets)."], ["nevera", "Miro nevera y despensa antes de hacer la compra."], ["lista", "Actualizo la lista de la compra con lo que falta de verdad."], ["menu", "Planifico menú de 3–7 días con lo que ya tengo."], ["ahorro", "Aporto algo (aunque sea poco) a una meta de ahorro."], ["facturas", "Reviso si hay recibos o facturas pendientes de mirar."], ["comparar", "Comparo precio/unidad en al menos un producto habitual."], ["desperdicio", "Uso sobras o congelo lo que no voy a comer ya."], ["suministros", "Miro si la calefacción/termo/standby están en modo sensato."], ["prioridades", "Repaso la lista de prioridades / gestiones pendientes."], ["ingresos", "Anoto ideas concretas para subir ingresos o skills esta semana (1 acción)."], ["deuda_cara", "Si hay deuda de consumo cara, reviso cuota y plan de ataque (sin productos)."], ["colchon", "Compruebo si el colchón de emergencia sigue siendo la prioridad nº1."], ["sin_impu o poco"], ["Cena", "Crema de zanahoria/calabaza + pan"]]], ["Jueves", [["Desayuno", "Café y tostada"], ["Comida", "Garbanzos al curry suave (especias básicas) con arroz"], ["Cena", "Revuelto de espinacas congeladas"]]], ["Viernes", [["Desayuno", "Fruta + yogur"], ["Comida", "Bacalao desalado o merluza congelada con patatas"], ["Cena", "Pizza casera simple (base + tomate + lo que sobre)"]]], ["Sábado", [["Desayuno", "Huevos + pan"], ["Comida", "Paella de verduras / arroz del señorito económico"], ["Cena", "Sopa de ajo o caldo con huevo"]]], ["Domingo", [["Desayuno", "Tostadas"], ["Comida", "Cocido ligero o fabada light (legumbre + verdura + poco chorizo si hay)"], ["Cena", "Bowl de sobras (arroz/legumbre/verdura)"]]]], "menuTips": ["Planifica el menú mirando primero nevera y despensa. Comprar «para el menú» sin mirar lo que hay es doble gasto.", "Batch cooking: un domingo cocina legumbre + arroz + proteína. Congela raciones etiquetadas con fecha.", "Sobras con regla: 24–48 h en nevera bien tapadas, o congelar. Reinventar (guiso → croquetas/empanadilla) evita tirar.", "Legumbres secas: remoja la noche anterior. El bote vale para prisa; la seca suele salir más barata por ración.", "Huevos: versátiles y económicos. Combínalos con verdura; no hace falta carne cada día.", "Pasta y arroz: stock razonable (2–4 semanas), no despensa de apocalipsis que luego apolilla.", "Verdura de temporada ES: invierno (col, puerro, naranja…), verano (tomate, calabacín, pimiento…). Congelada cubre huecos.", "Pedidos a domicilio: anota un mes completo. El «solo hoy» semanal es un sueldo pequeño al año.", "Especias básicas (pimentón, comino, orégano, ajo, laurel) transforman platos simples sin subir el ticket.", "Agua del grifo y café/té en casa frente a bebidas envasadas diarias.", "Si comes fuera: menú del día o tupper. La carta a la carta destroza el presupuesto de comida.", "Aprovecha huesos/verduras para caldo. Congela en cubiteras: base de sopas barata.", "Carne: compra para guisar (muslos, falda) y parte; el filete fino diario sale caro por proteína.", "Lista de «comidas comodín» (pasta-huevo-legumbre) para días malos: evita el delivery por agotamiento.", "Coste real del plato: suma aceite, gas/luz, merma y pan. El precio del súper no es el coste en plato.", "Congela en raciones individuales: descongelar «para uno» evita tirar cazuelas enteras.", "El pan del día anterior vale para torrijas, migas, picatostes: no es fracaso, es cocina.", "Compra especias enteras (pimienta, comino) y muele poco: más aroma, menos desperdicio.", "Plan «nevera vacía»: un día a la semana cocina solo con lo que hay. Creatividad = ahorro.", "Si vives solo, cocina de a 2–3 raciones igual: el coste de gas/luz por plato baja."], "menuIngredientes": ["Lentejas", "Garbanzos", "Alubias", "Arroz", "Pasta", "Huevos", "Tomate frito / tomates", "Cebolla", "Ajo", "Patatas", "Calabacín", "Espinacas / acelgas", "Zanahoria", "Lechuga / ensalada", "Atún en lata", "Pollo (muslos)", "Pescado congelado", "Yogur natural", "Avena", "Pan", "Aceite de oliva", "Sal y especias", "Plátanos / manzanas", "Queso fresco", "Pimentón", "Laurel", "Guisantes congelados", "Pimientos"], "plantillas": {"solo": {"nombre": "1 persona (orientativo)", "ingresos": 1400, "cats": {"vivienda": 500, "comida": 220, "luz_agua": 90, "transporte": 60, "salud": 30, "ocio": 60, "ropa": 25, "telecom": 35, "educacion": 20, "hogar": 25, "mascotas": 0, "deudas": 50, "otros": 40}}, "pareja": {"nombre": "Pareja (orientativo)", "ingresos": 2400, "cats": {"vivienda": 750, "comida": 380, "luz_agua": 120, "transporte": 120, "salud": 50, "ocio": 100, "ropa": 40, "telecom": 50, "educacion": 30, "hogar": 40, "mascotas": 30, "deudas": 80, "otros": 60}}, "familia": {"nombre": "Familia 3–4 (orientativo)", "ingresos": 3200, "cats": {"vivienda": 900, "comida": 550, "luz_agua": 160, "transporte": 180, "salud": 80, "ocio": 120, "ropa": 70, "telecom": 60, "educacion": 100, "hogar": 50, "mascotas": 40, "deudas": 100, "otros": 80}}}, "ruta": [{"t": "Colchón de emergencia", "d": "Antes de metas lejanas: 3–6 meses de gastos esenciales (alquiler, comida, suministros, transporte). Sin colchón, cualquier imprevisto te endeuda.", "semana": "Calcula tus gastos esenciales de un mes y ábrete una meta «Colchón» con ese objetivo parcial (aunque sea 500 € primero)."}, {"t": "Controlar fugas de dinero", "d": "Suscripciones olvidadas, delivery, café diario, compras impulsivas, comisiones. Lo pequeño semanal es grande anual.", "semana": "Lista todos los cargos recurrentes del último extracto. Cancela o pausa uno que no uses."}, {"t": "Presupuesto escrito", "d": "Sin números no hay margen. Ingresos netos − plan de categorías = ahorro posible.", "semana": "Rellena Presupuesto en esta app con cifras reales (no ilusiones). Ajusta hasta que el restante sea ≥ 0."}, {"t": "Aumentar empleabilidad", "d": "El ahorro solo no basta si el ingreso es bajo. Skills demandadas, portfolio, título/certificación pública, idiomas + oficio.", "semana": "Elige UNA skill y bloquea 3×45 min esta semana (práctica real, no solo vídeos)."}, {"t": "Segunda fuente de ingreso ética y legal", "d": "Horas extra, freelancing de tu oficio, venta de lo que no usas, clases, turnos. Genérico: sin esquemas milagro.", "semana": "Escribe 3 ideas legales que ya podrías ofrecer; contacta a una persona/empresa esta semana."}, {"t": "Reducir deudas caras (concepto)", "d": "Intereses altos de consumo comen el futuro. Prioriza las más caras; negocia plazos si procede; evita nuevas. No es consejo de refinanciación concreta.", "semana": "Ordena deudas por tipo de interés aproximado. Paga el mínimo en todas y extra a la más cara si puedes."}, {"t": "Meta a 1 año", "d": "Objetivo concreto y medible (colchón completo, curso, muda, deuda X).", "semana": "Define importe y fecha. Créala en Ahorro. Automatiza mentalmente: el día de cobro, aparta primero."}, {"t": "Meta a 5 años", "d": "Formación larga, entrada vivienda (si aplica), cambio de carrera. Requiere ingreso creciente, no solo tijera.", "semana": "Escribe qué skill o título te acerca. Busca vías públicas/oficiales o práctica demostrable."}, {"t": "Meta a 10–20 años", "d": "Horizonte largo: estabilidad, patrimonio neto conceptual (activos − deudas), salud financiera. Sin promesas de millón.", "semana": "Revisa si tu oficio escala (salario/experiencia) o si necesitas pivotar. Una conversación con alguien del sector."}, {"t": "Protección del hábito", "d": "Lifestyle creep: al subir sueldo, el gasto se come el alza. Inflación: el mismo € compra menos.", "semana": "Si te suben ingresos, asigna ≥50 % del incremento a ahorro/deuda antes de subir el nivel de vida."}, {"t": "Salud y capacidad de trabajar", "d": "Sin salud, el plan se cae. Sueño, dental básico, prevención: es economía, no lujo vacío.", "semana": "Agenda una gestión de salud pendiente (cita, revisión, hábito de sueño) y cúmplela."}, {"t": "Revisión trimestral", "d": "Números, metas, skills, deudas. Ajusta sin drama.", "semana": "Exporta JSON de esta app y anota 3 cambios para el próximo trimestre."}], "oficios": [{"n": "Soldadura especializada / estructuras", "e": "En industria y obra sigue habiendo falta de perfiles cualificados en muchos núcleos.", "est": "Ciclos FP, certificados de profesionalidad, práctica en taller. Soldadura TIG/MIG según especialidad.", "val": "Soldaduras de prueba fotografiadas, prácticas en empresa, carnets/habilitaciones cuando apliquen (sin marcas de curso).", "trampa": "Cursos cortos «milagro» sin horas de arco reales. La mano se gana quemando electrodos.", "extra": "En España/Europa la cualificación y la seguridad laboral no son adorno: son acceso al trabajo bien pagado del oficio. Pregunta siempre por convenio y EPP."}, {"n": "Mantenimiento industrial / electromecánica", "e": "Paradas de planta caras → demandan quien repare.", "est": "FP mantenimiento, electricidad-electrónica, mecánica. Leer esquemas.", "val": "Resolución de averías reales documentadas, prácticas, seguridad laboral.", "tr ntender sistemas.", "extra": "En España/Europa la cualificación y la seguridad laboral no son adorno: son acceso al trabajo bien pagado del oficio. Pregunta siempre por convenio y EPP."}, {"n": "Carpintería / montaje / reformistas serios", "e": "Reformas y mantenimiento de vivienda.", "est": "Aprendizaje con maestro, medición, acabados, seguridad.", "val": "Antes/después fotográficos, plazos cumplidos.", "trampa": "Presupuestos a la baja que luego se hinchan; reputación = activo.", "extra": "En España/Europa la cualificación y la seguridad laboral no son adorno: son acceso al trabajo bien pagado del oficio. Pregunta siempre por convenio y EPP."}, {"n": "Logística especializada / carretillero cualificado", "e": "Almacenes y puertos rotan personal formado.", "est": "Carnets de equipos, prevención riesgos, turnos.", "val": "Experiencia en almacén con responsabilidad.", "trampa": "Solo «buscar chollos» sin disponibilidad real de turnos.", "extra": "En España/Europa la cualificación y la seguridad laboral no son adorno: son acceso al trabajo bien pagado del oficio. Pregunta siempre por convenio y EPP."}, {"n": "Soldadura / mantenimiento naval o portuario (si vives cerca)", "e": "Nichos geográficos con poca gente dispuesta a turnos duros.", "est": "Oficio base + normas de puerto/astillero.", "val": "Entrar por contratas con seguridad fuerte.", "trampa": "Ignorar EPP y turnos: te echan o te lesionas.", "extra": "En España/Europa la cualificación y la seguridad laboral no son adorno: son acceso al trabajo bien pagado del oficio. Pregunta siempre por convenio y EPP."}, {"n": "Agro-tech / mantenimiento de riego y maquinaria (rural)", "e": "Campo profesionalizado; poca gente joven cualificada en zonas.", "est": "Mecánica, riego, electricidad básica agrícola.", "val": "Temporadas completas, referencias de explotaciones.", "trampa": "Romanticismo rural sin números ni peonadas reales.", "extra": "En España/Europa la cualificación y la seguridad laboral no son adorno: son acceso al trabajo bien pagado del oficio. Pregunta siempre por convenio y EPP."}, {"n": "Fontanería industrial / soldadura PE / redes", "e": "Infraestructura hídrica y gas.", "est": "Especialización + prevención.", "val": "Obras con empresas de redes.", "trampa": "Trabajar sin cualificación en gas/agua a presión.", "extra": "En España/Europa la cualificación y la seguridad laboral no son adorno: son acceso al trabajo bien pagado del oficio. Pregunta siempre por convenio y EPP."}, {"n": "Enfermería / técnicos sanitarios (vía oficial)", "e": "Demanda estructural; acceso por plazas/notas.", "est": "Vía universitaria/FP sanitaria oficial.", "val": "Título + prácticas + oposición/contratación.", "trampa": "Atajos no oficiales que no habilitan.", "extra": "En España/Europa la cualificación y la seguridad laboral no son adorno: son acceso al trabajo bien pagado del oficio. Pregunta siempre por convenio y EPP."}, {"n": "Educación infantil / apoyo educativo cualificado", "e": "Conciliación y ratios; cualificación importa.", "est": "Titulaciones oficiales del sector.", "val": "Experiencia en centros con referencias.", "trampa": "Canguros sin formación presentados como «educación».", "extra": "En España/Europa la cualificación y la seguridad laboral no son adorno: son acceso al trabajo bien pagado del oficio. Pregunta siempre por convenio y EPP."}, {"n": "Operación de calderas / salas técnicas", "e": "Edificios e industria necesitan quien mantenga salas.", "est": "Carnés según reglamento, práctica.", "val": "Guardias, lecturas, partes de mantenimiento.", "trampa": "Improvisar sin normativa: peligro y multa.", "extra": "En España/Europa la cualificación y la seguridad laboral no son adorno: son acceso al trabajo bien pagado del oficio. Pregunta siempre por convenio y EPP."}, {"n": "Prevención de riesgos / técnico de seguridad laboral", "e": "Normativa y responsabilidad empresarial sostienen la demanda.", "est": "Formación oficial de PRL según nivel; experiencia en obra/industria.", "val": "Participar en evaluaciones reales; no solo powerpoint.", "trampa": "Título colgado sin pisar planta.", "extra": "En España/Europa la cualificación y la seguridad laboral no son adorno: son acceso al trabajo bien pagado del oficio. Pregunta siempre por convenio y EPP."}, {"n": "Soldadura orbital / tubería de proceso (nicho)", "e": "Pocos con práctica limpia en sectores exigentes.", "est": "Base de soldadura + especialización y muchas horas.", "val": "Cupones/pruebas de soldadura aceptadas por calidad.", "trampa": "Curso corto sin horas suficientes.", "extra": "En España/Europa la cualificación y la seguridad laboral no son adorno: son acceso al trabajo bien pagado del oficio. Pregunta siempre por convenio y EPP."}, {"n": "Reparación de electrodomésticos / electrónica de servicio", "e": "Tirar y comprar nuevo no siempre sale a cuenta; falta servicio serio.", "est": "Electrónica práctica, diagnosis, stock de piezas comunes.", "val": "Reparaciones documentadas, garantía de tu trabajo.", "trampa": "Cobrar visita sin diagnóstico honesto: mata el boca a boca.", "extra": "En España/Europa la cualificación y la seguridad laboral no son adorno: son acceso al trabajo bien pagado del oficio. Pregunta siempre por convenio y EPP."}, {"n": "Conducción profesional especializada (si aplica carnés)", "e": "Logística y maquinaria necesitan carnés y responsabilidad.", "est": "Permisos correspondientes + tachógrafo/normativa cuando aplique.", "val": "Historial limpio, disponibilidad real.", "trampa": "Millas sin descanso: riesgo y sanciones.", "extra": "En España/Europa la cualificación y la seguridad laboral no son adorno: son acceso al trabajo bien pagado del oficio. Pregunta siempre por convenio y EPP."}], "mentalidad": [{"t": "Inflación (concepto)", "d": "Con el tiempo, el mismo billete compra menos. Por eso el colchón y los ingresos reales importan más que el número nominal en la cabeza. No es excusa para productos concretos: es motivo para skills y control de gasto."}, {"t": "Lifestyle creep", "d": "Sube el sueldo, sube el coche/ropa/restaurantes, el ahorro relativo no mejora. Antídoto: regla del incremento (una parte grande del alza a meta/deuda)."}, {"t": "Lotería y «toque de suerte»", "d": "La esperanza matemática suele ser negativa. Como entretenimiento simbólico ocasional, ok; como plan de vida, es sabotaje."}, {"t": "Deuda de consumo", "d": "Financiar gustos a interés alto hipoteca tu yo futuro. Si ya está, plan de salida; si no, evita."}, {"t": "Get rich quick", "d": "Cursos milagro, criptos «seguras», trades de pasillo, pirámides disfrazadas. Si alguien garantiza riqueza rápida, desconfía."}, {"t": "Comparación en redes", "d": "El escaparate ajeno no es su contabilidad. Decide con tus números."}, {"t": "Parálisis por análisis", "d": "Esperar el plan perfecto para no empezar el colchón de 200 €. Empieza imperfecto; itera cada mes."}, {"t": "Negar el gasto hormiga", "d": "«Son dos euros» × 90 veces. Mide un mes sin juzgarte; luego corta."}], "temporadas": [{"e": "Invierno", "i": "Coles, puerro, naranja, mandarina, kiwi, acelgas, cardo, alcachofa (según zona). Potajes y hornos largos aprovechan la cocina."}, {"e": "Primavera", "i": "Espárragos, guisantes, fresas (final), lechugas, calabacín temprano. Ensaladas + legumbre = menú barato."}, {"e": "Verano", "i": "Tomate, pimiento, berenjena, sandía, melón, pepino. Gazpacho/pisto; menos horno = menos kWh."}, {"e": "Otoño", "i": "Uva, manzana, setas (cuidado), calabaza, boniato, granada. Guisos de transición."}], "fugas90": [{"d": "Días 1–7", "t": "Medición sin juicio", "a": "Anota cada gasto >2 €. No cortes aún. Fotos de tickets valen."}, {"d": "Días 8–14", "t": "Top 5 fugas", "a": "Ordena por € semanales. Elige 2 para cortar o sustituir (p.ej. delivery → batch)."}, {"d": "Días 15–30", "t": "Suscripciones y fijos", "a": "Lista cargos recurrentes. Cancela 1 no usado. Revisa potencia/standby."}, {"d": "Días 31–60", "t": "Ingreso +1", "a": "Una acción de empleabilidad o ingreso extra legal (contacto, portfolio, turno)."}, {"d": "Días 61–90", "t": "Anclar hábito", "a": "Ahorro automático el día de cobro (importe pequeño pero sagrado). Revisa números."}], "glosario": [["Colchón de emergencia", "Dinero líquido para 3–6 meses de gastos esenciales. No es para el móvil nuevo."], ["Gasto hormiga", "Importes pequeños repetidos que suman un sueldo al año."], ["Lifestyle creep", "Subir el nivel de vida al ritmo del sueldo (o más rápido) sin subir el ahorro."], ["Tasa de ahorro", "Ahorro mensual / ingreso neto. Métrica más útil que «tengo intención de ahorrar»."], ["Deuda de consumo", "Crédito para bienes que se deprecian o se consumen; suele ser cara."], ["Potencia contratada", "Parte fija de la factura eléctrica ligada a la potencia; independiente de kWh consumidos."], ["€/kg o €/l", "Precio unitario real; compara envases distintos con esta cifra."], ["Batch cooking", "Cocinar en bloque para varios días; reduce delivery y merma."], ["Rentabilidad 0 % (en esta app)", "Escenario base: solo sumas lo que aportas, sin supuestos de mercado."], ["Supuesto orientativo", "Número hipotético para ver sensibilidad; no es previsión ni consejo de producto."]], "anexo": {"ensayos": [{"t": "Por qué 46 KB no bastan para toda una vida", "b": "La economía doméstica no es una lista de «ahorra el café». Es un sistema: ingresos, gastos esenciales, fugas, deuda, empleabilidad, colchón e inflación. Un módulo serio tiene que enseñar a medir, a decidir con números propios y a no confundir motivación con aritmética. Por eso aquí hay simulador, plantillas, menús, oficios y trampas — no un poster."}, {"t": "Ingresos primero, tijera después (y luego las dos)", "b": "Si el neto apenas cubre lo esencial, recortar el 5 % del ocio no construye un millón. La secuencia adulta es: (1) no sangrar por fugas idiotas, (2) proteger un colchón mínimo, (3) subir la capacidad de generar ingreso (skill/oficio), (4) volver a optimizar el gasto con más margen. Quien solo recorta se queda en supervivencia eterna."}, {"t": "El colchón no es opcional", "b": "Sin 3–6 meses de esenciales, cualquier avería, baja o retraso de nómina te empuja a deuda cara. El «primer millón» sin colchón es un castillo en el aire. Prioridad nº1: liquidez aburrida. Luego el resto."}, {"t": "Inflación y poder de compra", "b": "Si tus gastos esenciales suben un 4 % y tu neto un 1 %, estás empobreciéndote en silencio. La respuesta no es un producto mágico: es renegociar ingreso, cambiar skill, o rediseñar el coste de vida. Esta app no modela inflación en el simulador base (0 %) precisamente para no fingir precisión que no tenemos."}, {"t": "Deuda de consumo vs inversión en ti", "b": "Financiar un móvil a interés alto es consumir el futuro. Invertir tiempo en un oficio demandado es otra cosa: el «retorno» es empleabilidad, no un folleto. No confundas las dos. Y no pidas prestado para cursos milagro."}, {"t": "Automatizar el día de cobro", "b": "La voluntad falla a final de mes. El método tosco que funciona: el día que entra el neto, apartas primero el ahorro (aunque sean 20 €) y vives con el resto. Si «sobra» al final, casi nunca sobra."}, {"t": "Parejas y dinero", "b": "Sin cifras compartidas hay guerra fría. Acordad esenciales, ahorro común y gasto personal. No hace falta fundir cuentas: hace falta fundir la verdad de los números."}, {"t": "Lo que esta app no hará por ti", "b": "No elegirá banco, fondo ni seguro. No presentará la renta. No negociará tu hipoteca. No te hará millonario. Te obliga a mirar tus inputs y a practicar hábitos. El resto es tu vida laboral y tus decisiones."}], "ejemplosNumericos": [{"t": "Solo ahorro 0 % — ejemplo A", "b": "Capital 5.000 €, ahorro 300 €/mes, 25 años. Capital final ≈ 5.000 + 300×300 = 95.000 €. Lejos del millón. Déficit enorme → skill/ingreso, no solo cupones."}, {"t": "Solo ahorro 0 % — ejemplo B", "b": "Capital 20.000 €, ahorro 1.200 €/mes, 30 años. Final ≈ 20.000 + 1.200×360 = 452.000 €. Aún no es 1M; el simulador te dirá el PMT necesario o los años."}, {"t": "Solo ahorro 0 % — ejemplo C", "b": "Capital 50.000 €, ahorro 2.500 €/mes, 30 años. Final ≈ 50.000 + 900.000 = 950.000 €. Cerca: o más años, o más PMT, o aceptar que 1M es un hito simbólico."}, {"t": "Sensibilidad 2 % (supuesto, no promesa)", "b": "El mismo ejemplo B con 2 % anual compuesto da un final mayor en el papel. Úsalo solo para ver sensibilidad. No es una previsión de mercado ni una recomendación de producto."}, {"t": "Café y delivery — aritmética brutal", "b": "3 € × 20 días × 11 meses ≈ 660 €/año. Delivery 18 € × 8 veces/mes × 12 ≈ 1.728 €/año. Juntos > 2.300 €/año. En 10 años (0 %) ≈ 23.000 €. No es moralina: es el simulador en miniatura."}, {"t": "Suscripción olvidada", "b": "9,99 €/mes × 12 = ~120 €/año. Tres suscripciones muertas ≈ 360 €/año. En 15 años ≈ 5.400 € a rentabilidad 0 %. Cancela desde el extracto, no desde la memoria."}], "checklistHogar": ["He mirado el extracto del último mes completo.", "Sé cuánto son mis gastos esenciales (vivienda+comida+suministros+transporte).", "Tengo (o estoy construyendo) un colchón parcial con cifra escrita.", "Conozco mis 3 mayores fugas hormiga.", "He comparado €/kg en al menos 5 productos habituales.", "Sé qué potencia tengo contratada y qué kWh consumí el último periodo.", "Tengo una skill/oficio en práctica esta semana (no solo en la cabeza).", "He exportado un JSON de respaldo de esta app al menos una vez."], "erroresComunes": [["Presupuesto de fantasía", "Poner ingresos «ojalá» y gastos «ideal». Usa el mes pasado real."], ["Optimizar lo irrelevante", "Discutir 0,03 €/kg y no el alquiler o la deuda cara."], ["Ignorar la salud", "Sin capacidad de trabajar, el plan se cae. Dormir y dientes son economía."], ["Curso eterno sin práctica", "Consumir formación como serie. Valida con obra, soldadura, repo, clientes."], ["Compararse con escaparates", "Redes muestran consumo, no patrimonio neto ni deudas."], ["All-in en una apuesta", "Criptos, lotería, negocio sin números. Diversifica vida: skill + colchón + control."], ["Ahorrar y endeudarse a la vez en consumo", "Colchón a 0 % mientras pagas interés alto: prioriza la deuda cara."], ["No revisar nunca", "Sin revisión trimestral, el lifestyle creep gana por silencio."]], "calendarioCompra": [["Enero", "Legumbres, coles, cítricos. Revisa suscripciones post-Navidad. Devuelve lo no usado."], ["Febrero", "Potajes. Compara calefacción vs aislamiento barato (burletes)."], ["Marzo", "Transición a ensaladas. Revisa ropa: arreglar > comprar moda rápida."], ["Abril", "Guisantes/espárragos según zona. Planifica menú primavera."], ["Mayo", "Empieza temporada de más fresco. Menos horno."], ["Junio", "Tomate/pimiento. Gazpacho batch. Vigilancia AC: 26 °C orientativo."], ["Julio", "Fruta de verano. Agua del grifo + botella reutilizable."], ["Agosto", "Ojo a viajes y delivery «porque estoy de vacaciones»."], ["Septiembre", "Vuelta: material, rutina, batch cooking. Reinicia checklist hábitos."], ["Octubre", "Calabaza/boniato. Revisa junta nevera y termo."], ["Noviembre", "Guisos. Compara facturas 3 meses atrás."], ["Diciembre", "Presupuesto de fiestas cerrado ANTES. Regalos con tope."]], "palancasIngreso": [["Negociación con datos", "Lleva resultados, no sentimientos. Alternativas reales (otra oferta/oficio) aumentan poder."], ["Cambio de gremio", "De sector saturado a oficio con escasez: duele al inicio, cambia el neto a 3–5 años."], ["Turnicidad", "Noches/fines de semana pagan plus; calcula coste de salud y vida."], ["Especialización estrecha", "Un nicho feo (mantenimiento de X, soldadura Y) suele pagar más que «multiusos»."], ["Idioma + oficio", "Abre contratas y movilidad. Vocabulario técnico > conversación de bar."], ["Portfolio público", "Fotos de obras, repos, partes de trabajo (sin datos confidenciales)."], ["Enseñar lo que sabes", "Clases, mentorías, formaciones internas: ingreso extra sin pirámide."], ["Vender activos ociosos", "Una vez. No conviertas tu casa en bazar permanente."]]}, "faq": [{"q": "¿Esta app me hará millonario?", "a": "No. Es una calculadora y un temario de hábitos. El millón es un hito simbólico para pensar a largo plazo. Sin ingresos suficientes y años de consistencia, la aritmética no cierra — y eso es información útil, no fracaso moral."}, {"q": "¿Por qué el escenario por defecto es 0 %?", "a": "Porque no somos asesores ni adivinos. El 0 % muestra solo tu disciplina de ahorro. Los % de ejemplo (2/4) son supuestos orientativos para ver sensibilidad, no previsiones ni recomendaciones de productos."}, {"q": "¿Debo endeudarme para «invertir en mí»?", "a": "Depende del tipo de deuda y del retorno real (título que habilita, oficio con demanda). Endeudarse para un curso de marketing vacío suele ser un error. Esta app no recomienda créditos."}, {"q": "¿Cuánto colchón necesito?", "a": "Orden de magnitud: 3–6 meses de gastos esenciales (vivienda, comida, suministros, transporte mínimo). Si tus ingresos son muy inestables, apunta al lado alto. Empieza por un parcial si 3 meses asusta."}, {"q": "¿Qué hago si no llego al millón en el simulador?", "a": "Es lo esperado para muchos salarios. Usa el déficit: te dice el ahorro mensual necesario o los años. Luego mira oficios/skills y fugas. El objetivo puede ser 100k o 250k de patrimonio neto conceptual; el millón es la vara de medir, no un ultimátum."}, {"q": "¿Puedo usar esto en pareja?", "a": "Sí. Acordad cifras honestas. Podéis exportar JSON y guardarlo. No sustituye mediación ni terapia de pareja: solo pone números sobre la mesa."}, {"q": "¿Los menús son obligatorios?", "a": "No. Son plantillas económicas de cocina española. Adaptad alergias, religión, temporada y lo que ya hay en la nevera."}, {"q": "¿Por qué no recomendáis bancos o fondos?", "a": "Límite legal y de producto. La educación financiera genérica no requiere empujar productos. Tú eliges entidades con tu propio criterio y, si hace falta, con un profesional colegiado."}, {"q": "¿El comparador de compra sustituye mirar la etiqueta?", "a": "No. Es una ayuda aritmética. Sigue mirando composición, fechas y si realmente lo vas a consumir."}, {"q": "¿Qué es una «fuga»?", "a": "Dinero que sale sin decisión consciente: suscripciones, comisiones, delivery automático, standby, cisterna, snacks diarios. Se detecta midiendo, no moralizando."}, {"q": "¿Cómo encaja la inflación en el simulador?", "a": "No está modelada en la base a propósito. Si quieres una aproximación tosca, puedes exigir un ahorro mayor o revisar cada año tus números. No finjamos precisión de banco central."}, {"q": "¿Sirve para autónomos?", "a": "Sí, con matices: usa un neto medio conservador (después de impuestos y cotizaciones aproximados que tú calcules). Colchón más alto. Separar caja personal/profesional es higiene."}, {"q": "¿Puedo importar datos de otra app?", "a": "Solo el JSON que exporta esta. No hay nube ni conectores."}, {"q": "¿file:// funciona?", "a": "Sí. Está pensado offline absoluto: sin CDN, sin fuentes remotas, sin analytics. Abre economia.html desde Archivos."}, {"q": "¿Qué pasa si borro los datos?", "a": "Se van del localStorage de ese navegador. Por eso existe exportar JSON."}], "modulosTexto": [{"t": "Medir antes de cortar", "b": "La tentación es abrir la app, ponerse heroic@ y tachar cafés. El orden adulto es otro: medir un ciclo completo (al menos 30 días) sin drama. Anota ingresos netos reales, fijos, variables y un «agujero» (lo que no cuadra). Ese agujero es información de oro: suele ser efectivo, Bizum y delivery.\n\nCuando midas, categoriza con las mismas etiquetas siempre. Cambiar el esquema cada semana invalida la comparación. En esta app las categorías son fijas a propósito. Si un gasto no encaja, usa «Otros» y pon nota.\n\nTras medir, ordena categorías por euros, no por culpa. Vivienda alta puede ser normal en tu ciudad; ocio alto con colchón cero es otra historia. Corta donde el euro/dolor sea mejor: una suscripción de 12 €/mes que no usas duele cero y paga un trozo de colchón."}, {"t": "Diseñar el mes el día de cobro", "b": "El día de cobro es el único momento en que mucha gente tiene liquidez psicológica. Úsalo: (1) paga esenciales y deudas mínimas, (2) aparta ahorro/colchón, (3) reparte el resto en categorías semanales, (4) deja un sobre/partida de «imprevistos chicos».\n\nSi esperas a «ver qué sobra», sobra el cansancio. La automatización mental (aunque el dinero esté en la misma cuenta) consiste en no tocar la partida de ahorro salvo emergencia real.\n\nEn pareja, haced esta reunión el mismo día cada mes. 20 minutos con números. Sin acusaciones: con cifras."}, {"t": "Empleabilidad como proyecto", "b": "Trata tu capacidad de generar ingreso como un proyecto con hitos semanales. No «motivación»: calendario. Ejemplo: 3 bloques de 45 minutos de práctica (soldadura, labs, portfolio, idioma técnico). Domingos: 30 minutos de búsqueda de demanda real en tu provincia (ofertas, convenios, habladurías de gremio).\n\nValida skill con evidencia: foto, repo, pieza, cliente, responsable de taller. Los certificados ayudan cuando habilitan; no sustituyen horas.\n\nSi tu sector está saturado de titulares y vacío de gente que entrega, sé quien entrega. Esa es la escasez real."}, {"t": "Deudas caras: método conceptual", "b": "Sin recomendar productos: lista deudas con tipo de interés aproximado y cuota. Paga el mínimo en todas para no romper contratos. Todo euro extra a la más cara (método avalancha conceptual). Alternativa psicológica: la más pequeña primero (bola de nieve) si eso te mantiene constante — pero matemáticamente la cara suele doler más.\n\nNo abras nueva deuda de consumo para pagar otra. Si estás en situación extrema, busca información oficial de atención al sobreendeudamiento en tu comunidad; esta app no es ese servicio."}, {"t": "Casa: euros que no se ven", "b": "Cisterna que pierde, standby, termo a 70 °C, radiadores tapados, nevera con escarcha, lavadoras a media carga a 60 °C «porque sí». Cada uno parece menor; juntos son la diferencia entre colchón o no.\n\nRegistra tres facturas seguidas. Si no puedes explicar la subida, busca fuga o cambio de hábito (más teletrabajo en invierno, visitas, avería). La potencia contratada es un fijo: revísala con cuidado de no quedarte corta en picos (horno+termo+lavadora a la vez)."}, {"t": "Comida: el mayor variable controlable", "b": "Para muchos hogares, después de vivienda, la comida es el mayor variable. Aquí sí hay margen sin miseria: temporada, legumbre, huevo, batch, menos delivery, €/kg, marca blanca en básicos, menos monodosis.\n\nEl menú semanal no es romanticismo: es decisión previa al pasillo. El pasillo está diseñado para derrotar tu plan. Lista férrea. Estómago no vacío. Sin niños en zona de impulso si puedes.\n\nProteína barata rotativa: legumbre, huevo, lácteo fresco, conserva de pescado, muslo de pollo, congelado. La ternera premium diaria es un lujo, no un derecho nutricional único."}, {"t": "El horizonte largo sin autoengaño", "b": "Pensar a 20 años exige admitir incertidumbre: salud, pareja, país, oficio, inflación. Por eso el plan serio es robusto: colchón, skill transferible, deuda cara baja, gastos esenciales conscientes. El número 1.000.000 € es un faro, no un contrato con el universo.\n\nSi el simulador te muestra que con tu PMT actual no llegas, no cierres la app enfadado. Acabas de recibir un mapa del déficit. Los mapas no son insultos."}, {"t": "Privacidad y soberanía de datos", "b": "Todo vive en localStorage de este navegador/aparato. Sin nube de Les vencimos en este módulo. Exporta JSON y guárdalo en tu caja/USB si te importa. Al borrar datos del sitio o cambiar de navegador, puedes perder información. Eso es el precio del offline absoluto — y también su virtud."}], "temporadaDetalle": [{"mes": "Enero", "fruta": "Naranja, mandarina, kiwi, plátano (Canarias), limón", "verdura": "Acelga, cardo, coliflor, brócoli, puerro, repollo, escarola", "nota": "Potaje + cítricos. Hornos largos aprovechan la calefacción de la cocina."}, {"mes": "Febrero", "fruta": "Naranja, kiwi, chirimoya (final según zona)", "verdura": "Alcachofa, cardo, coles, espinaca", "nota": "Última ventana fuerte de guisos pesados."}, {"mes": "Marzo", "fruta": "Naranja tardía, fresa temprana (south)", "verdura": "Espárrago, guisante, lechuga, calabacín temprano", "nota": "Transición: menos cuchara, más verde."}, {"mes": "Abril", "fruta": "Fresa, níspero", "verdura": "Espárrago, alcachofa final, habas, guisantes", "nota": "Ensaladas con legumbre = menú barato."}, {"mes": "Mayo", "fruta": "Fresa, cereza temprana, níspero", "verdura": "Calabacín, judía verde, lechuga, pepino", "nota": "Empieza a bajar la necesidad de horno."}, {"mes": "Junio", "fruta": "Cereza, albaricoque, melocotón temprano, sandía temprana", "verdura": "Tomate, pimiento, berenjena, pepino", "nota": "Gazpacho/pisto batch."}, {"mes": "Julio", "fruta": "Melón, sandía, melocotón, nectarina, ciruela", "verdura": "Tomate, pimiento, judía, calabacín", "nota": "Comida fría + plancha. Vigilancia AC."}, {"mes": "Agosto", "fruta": "Higos, melón, sandía, uva temprana", "verdura": "Tomate (pico), pimiento, berenjena", "nota": "Ojo al gasto vacacional disfrazado."}, {"mes": "Septiembre", "fruta": "Uva, manzana temprana, higo final", "verdura": "Pimiento, tomate tardío, calabaza temprana", "nota": "Vuelta al batch cooking."}, {"mes": "Octubre", "fruta": "Manzana, pera, granada, uva", "verdura": "Calabaza, boniato, setas (cuidado), puerro", "nota": "Guisos de transición."}, {"mes": "Noviembre", "fruta": "Caqui, granada, manzana, pera", "verdura": "Coles, puerro, boniato, cardo temprano", "nota": "Revisión de facturas del otoño."}, {"mes": "Diciembre", "fruta": "Naranja, mandarina, kiwi, caqui", "verdura": "Cardo, coles, puerro, escarola", "nota": "Presupuesto de fiestas cerrado antes del día 1."}], "trabajados": [{"cap": 0, "pmt": 200, "years": 30, "final": 72000, "need": 2777.78}, {"cap": 5000, "pmt": 400, "years": 25, "final": 125000, "need": 3316.67}, {"cap": 10000, "pmt": 800, "years": 20, "final": 202000, "need": 4125.0}, {"cap": 25000, "pmt": 1500, "years": 15, "final": 295000, "need": 5416.67}, {"cap": 50000, "pmt": 2000, "years": 20, "final": 530000, "need": 3958.33}, {"cap": 0, "pmt": 2500, "years": 30, "final": 900000, "need": 2777.78}, {"cap": 100000, "pmt": 1000, "years": 25, "final": 400000, "need": 3000.0}, {"cap": 2000, "pmt": 150, "years": 40, "final": 74000, "need": 2079.17}, {"cap": 8000, "pmt": 600, "years": 22, "final": 166400, "need": 3757.58}, {"cap": 15000, "pmt": 350, "years": 35, "final": 162000, "need": 2345.24}, {"cap": 30000, "pmt": 900, "years": 18, "final": 224400, "need": 4490.74}, {"cap": 0, "pmt": 500, "years": 40, "final": 240000, "need": 2083.33}, {"cap": 75000, "pmt": 1800, "years": 12, "final": 334200, "need": 6423.61}, {"cap": 120000, "pmt": 500, "years": 40, "final": 360000, "need": 1833.33}, {"cap": 5000, "pmt": 100, "years": 50, "final": 65000, "need": 1658.33}], "antiEstafa": [{"t": "Garantía de rentabilidad", "d": "Si alguien te garantiza el X % sin riesgo, miente o no entiende riesgo. Fuera."}, {"t": "Urgencia artificial", "d": "«Solo hoy» «último cupo» en formación cara o productos financieros. La prisa es la herramienta."}, {"t": "Pirámide / multinivel disfrazado", "d": "El ingreso principal viene de reclutar, no de un bien/servicio real. Huye."}, {"t": "Trading fácil en el móvil", "d": "Capturas de gains sin losses. Si fuera fácil, no te lo venderían en anuncios."}, {"t": "Criptos «sin riesgo» / monedas milagro", "d": "Volatilidad extrema. Esta app no las recomienda. Educación: no pongas el colchón ahí."}, {"t": "Cursos que solo venden más cursos", "d": "Embudo infinito. Pregunta: ¿qué skill medible tendré en 30 días con evidencia?"}, {"t": "Prestamistas opacos", "d": "Tipos abusivos, letras pequeñas. Si estás ahogado, busca vías oficiales de tu comunidad, no anuncios de buscador."}, {"t": "Fingir ser «mentor» de riqueza", "d": "Lifestyle de alquiler de coche en vídeo. Pide números auditables; no los habrá."}, {"t": "Phishing de banco", "d": "Ningún banco serio te pide claves por SMS/email improvisado. Entra siempre tú por canal conocido (concepto)."}, {"t": "Inversión en algo que no entiendes", "d": "Si no puedes explicar el riesgo a un amigo en 2 minutos, no firmes."}], "semanasTipo": [{"n": "Semana de medición", "items": ["Anotar todos los gastos", "No cortar aún", "Foto de tickets", "Sumar delivery/café", "Revisar extracto"]}, {"n": "Semana de tijera", "items": ["Cancelar 1 suscripción", "Lista férrea de compra", "2 comidas batch", "Regletas off", "Techo de ocio escrito"]}, {"n": "Semana de ingreso", "items": ["Actualizar CV/portfolio", "1 contacto gremio", "3×45 min skill", "Mirar convenio/ofertas zona", "Precio a un servicio que ya sabes hacer"]}, {"n": "Semana de colchón", "items": ["Apartar ahorro día cobro", "Meta parcial en app", "Revisar deudas caras", "No compras >X€ sin 24h", "Exportar JSON"]}], "dialogos": [{"t": "«No llego a fin de mes»", "r": "Primero: ¿lo has medido 30 días? Segundo: esenciales vs hormiga. Tercero: ¿el ingreso es el problema? Si esenciales > neto, no hay tip de café que baste: vivienda/ingreso."}, {"t": "«Cuando gane más, ahorraré»", "r": "El lifestyle creep come el «más». Empieza con una cantidad ridícula ahora. El músculo importa más que el monto inicial."}, {"t": "«El millón es imposible»", "r": "Puede serlo con tu PMT actual. El simulador lo dice sin drama. Cambia PMT (ingreso) o el horizonte de meta (100k primero). Imposible hoy ≠ imposible la disciplina."}, {"t": "«Da igual, total inflación»", "r": "La inflación no justifica tirar el control. Justifica subir skills y no dormir en deuda cara. El 0 % de esta app es honestidad, no derrotismo."}, {"t": "«No tengo tiempo para cocinar»", "r": "Batch 90 minutos domingos suele ser menos que el tiempo+dinero del delivery semanal. Mide ambos."}, {"t": "«Mi oficio no tiene futuro»", "r": "Puede ser verdad. Entonces el plan es transición con práctica, no queja eterna. Mira oficios con escasez; elige uno compatible con tu cuerpo y ciudad."}], "manifiesto": "Les vencimos — Economía doméstica (manifiesto breve)\n\nNo venimos a venderte un sueño de yates. Venimos a recordarte que el dinero doméstico es un oficio: se mide, se practica, se revisa. Que el colchón aburrido te mantiene libre cuando el mundo falla. Que la empleabilidad es la auténtica «apalancamiento» legal de la gente trabajadora. Que los productos financieros concretos los eliges tú — o un profesional colegiado — no una app offline.\n\nEste módulo cabe en un HTML a propósito: file://, sin vigilancia, sin cuenta. Tus números se quedan en tu aparato. Si un día no hay red, sigue funcionando el simulador, el menú y la lista.\n\nJorge pedía más que un vistazo de 5 minutos. Aquí hay temario, tablas, oficios, trampas, menús, luz/agua, gráficos SVG y un wizard hacia el millón que, si no cierras números, te muestra el déficit con claridad. Eso es respeto: decirte la aritmética a la cara.\n\nUsa la pestaña Primer millón. Pon tus cifras reales. Si duele, bien: el dolor de un número es barato comparado con diez años de autoengaño.\n", "notasEspana": ["El coste de vivienda (alquiler o hipoteca) domina el presupuesto en muchas ciudades. Si supera ~35–40 % del neto, el margen para ahorro serio se estrecha: o ingreso, o mudanza, o convivencia, o política pública — una app no te baja el alquiler.", "Transporte: abono vs coche. Suma seguro, impuesto, taller, parking, multas, gasolina. El «coche barato» usado puede ser un pozo; calcula €/mes reales tres meses.", "Sanidad pública cubre mucho; aun así farmacia, dental y óptica golpean. Partida pequeña mensual > susto anual.", "Educación de hijos: material, comedor, extraescolares. Pon techo antes del curso, no en octubre.", "Comunidad de vecinos y derramas: pregunta actas; una derrama de ascensor no es «imprevisto mágico» si el edificio tiene 40 años.", "Autónomos: IVA/IRPF y cotizaciones no son «beneficio». Separa un % cada cobro en partida de impuestos (tú defines el %). Esta app no calcula tu modelo fiscal.", "ERTE, paro, becas: son ingresos inestables. Colchón más alto. No asumas que el pico dura.", "Trabajo a turnos: pluses sí, salud y guardería también. Contabilidad familiar completa.", "Zona rural: menos alquiler, más coche, menos oferta de oficios, a veces nichos agro-industriales. El simulador no cambia; tus inputs sí.", "Zona turística: alquileres tensos, hostelería con horarios duros, temporada alta/baja. Ahorra en alta como si la baja fuera segura."], "microRetos": [{"t": "48 h sin delivery", "d": "Cocina lo que hay. Anota el dinero no gastado y súmalo al colchón."}, {"t": "7 días de lista férrea", "d": "Nada fuera de lista salvo higiene/salud. Anota impulsos resistidos."}, {"t": "1 suscripción a juicio", "d": "Si no la abriste en 30 días, cancélala. Reactiva luego si de verdad duele."}, {"t": "Lectura de factura", "d": "Identifica potencia, energía, impuestos. Escribe kWh del periodo."}, {"t": "3×45 skill", "d": "Tres bloques esta semana de práctica de oficio/portfolio. Sin redes en paralelo."}, {"t": "Día de cobro sagrado", "d": "El próximo cobro: aparta ahorro antes de cualquier capricho."}, {"t": "Inventario casa", "d": "Lista 10 cosas vendibles/ donables. Una venta = liquidez."}, {"t": "Cisterna y grifos", "d": "Prueba colorante en cisterna; mira contador con todo cerrado 30 min."}, {"t": "Comparador 5 productos", "d": "Usa la pestaña Compra en 5 básicos. Quédate con el mejor €/kg real."}, {"t": "Export JSON", "d": "Backup. Sin drama. Hoy."}], "cierreLargo": "\nCómo usar este módulo en la práctica (guión de 14 días)\n\nDía 1: lee el aviso legal de la portada. Acepta que no hay magia.\nDía 2: rellena Presupuesto con el mes pasado real (nómina neta + gastos).\nDía 3: registra en Gastos todo lo que salga hoy y mañana.\nDía 4: crea meta Colchón parcial en Ahorro (aunque sea 300 €).\nDía 5: pasa por Compra, marca trucos que ya aplicas, prueba el comparador A/B.\nDía 6: elige Semana 1 o 2 de Menú; pasa ingredientes a la lista.\nDía 7: Luz y agua — calcula un recorte realista (10–40 €) y mira el acumulado a 10 años.\nDía 8: Primer millón paso 1 — capital, ahorro, horizonte, ingreso.\nDía 9: Simulador a 0 %. Mira déficit sin anestesia.\nDía 10: Opciones condicionales + plan 90 días si aplica.\nDía 11: Ruta de 12 pasos — ejecuta SOLO el «esta semana» del paso 1 o 2.\nDía 12: Oficios — elige 1 ficha y define una práctica de 45 min.\nDía 13: Mentalidad — lee anti-estafa en voz alta si hace falta.\nDía 14: Exporta JSON. Revisión: ¿qué número cambió de verdad?\n\nRepite el ciclo cada mes. La app no se cansa. El autoengaño sí, cuando lo miras con tablas.\n\n\nCierre: si solo tienes 10 minutos hoy\nAbre Primer millón → pon capital y ahorro real → escenario Solo ahorro 0 % → mira si llegas → si no, anota el PMT necesario.\nEse número es tu norte laboral más que cualquier frase motivacional.\n", "apendiceSvg": "Los gráficos SVG se generan en el navegador sin librerías. Si no ves el dibujo, el cálculo en tabla y texto sigue siendo válido. En lectores de pantalla, cada SVG lleva aria-label resumido.", "apendiceLegal": "Límites otra vez (por si saltaste el aviso): no somos asesores fiscales ni bancarios certificados; no recomendamos bancos, fondos, ETFs, criptos, seguros ni brokers; no garantizamos rentabilidades ni que llegarás a un millón de euros. Los ejemplos de salarios/oficios son órdenes de magnitud orientativos. Los escenarios con rentabilidad distinta de cero son supuestos orientativos que tú activas — no previsiones.", "lecturaRecomendadaConceptos": ["Interés compuesto (concepto matemático) — entiéndelo; no implica comprar un producto.", "Inflación y tipos reales — el poder de compra importa más que el número nominal.", "Coste de oportunidad — cada euro en consumo impulsivo no está en el colchón.", "Diversificación de vida — skill + salud + colchón + relaciones; no solo un activo.", "Margen de seguridad — asume imprevistos; planes al límite se rompen."], "bloquesExtra": [{"t": "Cómo leer el déficit del simulador", "b": "Si te faltan 600.000 € al horizonte, no es un insulto: es 600.000 / meses = euro/mes adicionales (a 0 %) o la señal de alargar años o subir ingreso. Divide el problema. Subir 200 €/mes de ahorro vía skill es a menudo más realista que «ser millonario ya»."}, {"t": "Impuestos (solo concepto)", "b": "El neto no es el bruto. Si hablas de subidas salariales, habla en neto estimado. Esta app no calcula IRPF ni cotizaciones. Para eso, herramientas oficiales o un profesional."}, {"t": "Vivienda en propiedad vs alquiler (marco)", "b": "No hay respuesta única. Suma entrada, impuestos, comunidad, derramas, seguro, oportunidad del capital inmovilizado frente a flexibilidad del alquiler. No usamos esta app para recomendarte comprar o alquilar."}, {"t": "Hijos y presupuesto", "b": "El coste real incluye tiempo. Extraescolares y marcas de ropa infantil se comen margen. Acordad techos anuales. El colchón familiar debe crecer con las responsabilidades."}, {"t": "Herencias y golpes de suerte", "b": "Si llega un capital extraordinario: colchón, deuda cara, luego plan. Evita lifestyle inmediato. No es consejo sucesorio."}]};

function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}
function load(k, fb){
  try{ var v=JSON.parse(localStorage.getItem(k)||'null'); return v==null?fb:v; }
  catch(e){ return fb; }
}
function save(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function euro(n){
  n = Number(n)||0;
  return n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
}
function euro0(n){
  n = Number(n)||0;
  return n.toLocaleString('es-ES',{maximumFractionDigits:0})+' €';
}
function todayISO(){
  var d=new Date();
  var m=String(d.getMonth()+1); if(m.length<2)m='0'+m;
  var day=String(d.getDate()); if(day.length<2)day='0'+day;
  return d.getFullYear()+'-'+m+'-'+day;
}

/* —— Matemáticas del simulador (ahorro / anualidad) —— */
function fvMensual(capital, pmt, rAnual, meses){
  capital = Number(capital)||0;
  pmt = Number(pmt)||0;
  meses = Math.max(0, Math.floor(Number(meses)||0));
  var r = (Number(rAnual)||0)/100/12;
  if(r===0) return capital + pmt*meses;
  var growth = Math.pow(1+r, meses);
  return capital*growth + pmt*((growth-1)/r);
}
function mesesParaObjetivo(capital, pmt, rAnual, objetivo){
  capital = Number(capital)||0;
  pmt = Number(pmt)||0;
  objetivo = Number(objetivo)||1000000;
  var r = (Number(rAnual)||0)/100/12;
  if(capital >= objetivo) return 0;
  if(pmt<=0 && (r<=0 || capital<=0)) return Infinity;
  if(r===0){
    if(pmt<=0) return Infinity;
    return Math.ceil((objetivo-capital)/pmt);
  }
  // n = ln( (FV*r + pmt) / (PV*r + pmt) ) / ln(1+r)
  var num = objetivo*r + pmt;
  var den = capital*r + pmt;
  if(den<=0 || num/den<=0) return Infinity;
  var n = Math.log(num/den)/Math.log(1+r);
  if(!isFinite(n) || n<0) return Infinity;
  return Math.ceil(n);
}
function pmtParaObjetivo(capital, rAnual, meses, objetivo){
  capital = Number(capital)||0;
  meses = Math.max(1, Math.floor(Number(meses)||0));
  objetivo = Number(objetivo)||1000000;
  var r = (Number(rAnual)||0)/100/12;
  if(r===0) return Math.max(0, (objetivo-capital)/meses);
  var growth = Math.pow(1+r, meses);
  var need = objetivo - capital*growth;
  if(need<=0) return 0;
  return need * r / (growth-1);
}
function serieAnual(capital, pmt, rAnual, aniosMax){
  var pts = [];
  var anios = Math.max(1, Math.min(80, Math.ceil(Number(aniosMax)||20)));
  for(var a=0;a<=anios;a++){
    pts.push({anio:a, capital: fvMensual(capital, pmt, rAnual, a*12)});
  }
  return pts;
}
function hitosMeses(capital, pmt, rAnual, marcas){
  var out = [];
  (marcas||[100000,250000,500000,1000000]).forEach(function(m){
    var mes = mesesParaObjetivo(capital, pmt, rAnual, m);
    out.push({marca:m, meses:mes});
  });
  return out;
}

function svgLineaCapital(pts, objetivo, w, h){
  w = w||320; h = h||180;
  var padL=42, padR=12, padT=14, padB=28;
  var maxY = Math.max(objetivo||1, 1);
  pts.forEach(function(p){ if(p.capital>maxY) maxY=p.capital; });
  maxY *= 1.05;
  var maxX = Math.max(1, pts.length-1);
  function x(i){ return padL + (i/maxX)*(w-padL-padR); }
  function y(v){ return padT + (1-(v/maxY))*(h-padT-padB); }
  var d='';
  pts.forEach(function(p,i){
    d += (i?'L':'M')+x(i).toFixed(1)+','+y(p.capital).toFixed(1)+' ';
  });
  var yObj = y(objetivo);
  var grid='';
  for(var g=0;g<4;g++){
    var yy = padT + g*(h-padT-padB)/3;
    grid += '<line x1="'+padL+'" y1="'+yy+'" x2="'+(w-padR)+'" y2="'+yy+'" stroke="rgba(230,225,214,0.12)" stroke-width="1"/>';
  }
  var labels = '<text x="4" y="'+(padT+4)+'" fill="#9A9488" font-size="10">'+esc(euro0(maxY))+'</text>';
  labels += '<text x="4" y="'+(h-padB)+'" fill="#9A9488" font-size="10">0</text>';
  labels += '<text x="'+padL+'" y="'+(h-6)+'" fill="#9A9488" font-size="10">0</text>';
  labels += '<text x="'+(w-padR-30)+'" y="'+(h-6)+'" fill="#9A9488" font-size="10">'+esc(String(maxX))+' a</text>';
  var svg = '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Evolución del capital hacia el objetivo">'
    +grid
    +'<line x1="'+padL+'" y1="'+yObj+'" x2="'+(w-padR)+'" y2="'+yObj+'" stroke="#C46A4A" stroke-dasharray="4 3" stroke-width="1.5"/>'
    +'<path d="'+d+'" fill="none" stroke="#C4A15A" stroke-width="2.5" stroke-linejoin="round"/>'
    +labels
    +'</svg>';
  return svg;
}
function svgBarrasCats(items, w, h){
  // items: [{label, value, color?}]
  w = w||320; h = h||200;
  var padL=8, padR=8, padT=10, padB=48;
  var maxV = 1;
  items.forEach(function(it){ if(it.value>maxV) maxV=it.value; });
  var n = Math.max(1, items.length);
  var bw = (w-padL-padR)/n;
  var bars='';
  var colors = ['#C4A15A','#8F9A72','#C46A4A','#9A9488','#E6E1D6','#B8956A','#6A7A5A','#A07050'];
  items.forEach(function(it,i){
    var bh = ((it.value/maxV)*(h-padT-padB));
    var x = padL + i*bw + bw*0.12;
    var y = padT + (h-padT-padB) - bh;
    var c = it.color || colors[i%colors.length];
    bars += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw*0.76).toFixed(1)+'" height="'+Math.max(0,bh).toFixed(1)+'" fill="'+c+'"/>';
    var lab = String(it.label||'').slice(0,8);
    bars += '<text x="'+(x+bw*0.38).toFixed(1)+'" y="'+(h-28)+'" fill="#9A9488" font-size="9" text-anchor="middle" transform="rotate(-35 '+(x+bw*0.38).toFixed(1)+' '+(h-28)+')">'+esc(lab)+'</text>';
  });
  var alt = items.map(function(it){ return it.label+': '+euro(it.value); }).join('; ');
  return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(alt)+'">'+bars+'</svg>';
}
function svgAnillo(parts, size){
  // parts: [{label, value, color}]
  size = size||180;
  var cx=size/2, cy=size/2, r=size*0.36, stroke=size*0.14;
  var total=0; parts.forEach(function(p){ total += Math.max(0,Number(p.value)||0); });
  if(total<=0){
    return '<svg viewBox="0 0 '+size+' '+size+'" role="img" aria-label="Sin datos de presupuesto"><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="rgba(230,225,214,0.14)" stroke-width="'+stroke+'"/></svg>';
  }
  var colors=['#C4A15A','#8F9A72','#C46A4A','#9A9488','#B8956A','#6A7A5A','#A07050','#D4B87A','#7A8A6A','#C48A6A','#8A9A72','#A09070'];
  var circ = 2*Math.PI*r;
  var offset=0;
  var arcs='';
  parts.forEach(function(p,i){
    var v=Math.max(0,Number(p.value)||0);
    if(v<=0) return;
    var len = (v/total)*circ;
    var c = p.color||colors[i%colors.length];
    arcs += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+c+'" stroke-width="'+stroke+'" stroke-dasharray="'+len.toFixed(2)+' '+(circ-len).toFixed(2)+'" stroke-dashoffset="'+(-offset).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
    offset += len;
  });
  var alt = parts.filter(function(p){return p.value>0;}).map(function(p){return p.label+': '+euro(p.value);}).join('; ');
  return '<svg viewBox="0 0 '+size+' '+size+'" role="img" aria-label="'+esc('Distribución: '+alt)+'">'+arcs+'<text x="'+cx+'" y="'+cy+'" text-anchor="middle" dominant-baseline="middle" fill="#E6E1D6" font-size="12" font-family="serif">'+esc(euro0(total))+'</text></svg>';
}
function svgBarrasProgreso(metas, w, h){
  w=w||320; h=Math.max(80, (metas.length||1)*36+20);
  var html='<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Progreso de metas de ahorro">';
  metas.forEach(function(m,i){
    var y=16+i*36;
    var obj=Number(m.objetivo)||0;
    var ap=Number(m.aportado)||0;
    var pct=obj>0?Math.min(1,ap/obj):0;
    html+='<text x="8" y="'+(y-4)+'" fill="#E6E1D6" font-size="11">'+esc(String(m.nombre||'').slice(0,28))+'</text>';
    html+='<rect x="8" y="'+y+'" width="'+(w-16)+'" height="12" fill="#1C1A16" stroke="rgba(230,225,214,0.14)"/>';
    html+='<rect x="8" y="'+y+'" width="'+((w-16)*pct).toFixed(1)+'" height="12" fill="#C4A15A"/>';
  });
  html+='</svg>';
  return html;
}

function doImport(){
  var raw = (document.getElementById('import-area').value||'').trim();
  if(!raw){ alert('Pega un JSON exportado antes.'); return; }
  var data;
  try{ data = JSON.parse(raw); }catch(e){ alert('JSON no válido.'); return; }
  if(!data || typeof data!=='object'){ alert('Formato no reconocido.'); return; }
  if(!confirm('¿Sustituir los datos guardados en este aparato por el JSON pegado?')) return;
  Object.keys(KEYS).forEach(function(k){
    if(data[k]!=null) save(KEYS[k], data[k]);
  });
  alert('Importación aplicada.');
  render();
}

function renderGastos(){
  var gastos = load(KEYS.gastos, []);
  var filtro = (app.dataset.filtroCat)||'';
  var mk = monthKey(todayISO());
  var delMes = gastos.filter(function(g){ return monthKey(g.fecha)===mk; });
  var porCat = {};
  delMes.forEach(function(g){ porCat[g.cat]=(porCat[g.cat]||0)+(Number(g.importe)||0); });
  if(filtro) delMes = delMes.filter(function(g){ return g.cat===filtro; });
  delMes.sort(function(a,b){ return String(b.fecha).localeCompare(String(a.fecha)); });
  var total = 0; delMes.forEach(function(g){ total += Number(g.importe)||0; });
  var totalMes = 0; Object.keys(porCat).forEach(function(k){ totalMes += porCat[k]; });

  var tot = presupuestoTotales();
  var planMap = {};
  (tot.p.categorias||[]).forEach(function(c){ planMap[c.id]=Number(c.plan)||0; });

  var opts = '<option value="">Todas las categorías</option>';
  DATA.cats.forEach(function(c){
    opts += '<option value="'+esc(c[0])+'"'+(filtro===c[0]?' selected':'')+'>'+esc(c[1])+'</option>';
  });
  var catOpts = '';
  DATA.cats.forEach(function(c){ catOpts += '<option value="'+esc(c[0])+'">'+esc(c[1])+'</option>'; });

  var html = '';
  html += '<div class="panel">';
  html += '<h2 style="margin-top:0">Nuevo gasto</h2>';
  html += '<div class="grid2">';
  html += '<label class="field"><span>Fecha</span><input type="date" id="g-fecha" value="'+todayISO()+'"></label>';
  html += '<label class="field"><span>Importe (€)</span><input type="number" inputmode="decimal" min="0" step="0.01" id="g-imp"></label>';
  html += '</div>';
  html += '<label class="field"><span>Categoría</span><select id="g-cat">'+catOpts+'</select></label>';
  html += '<label class="field"><span>Nota (opcional)</span><input type="text" id="g-nota" maxlength="120" placeholder="Ej. súper, farmacia…"></label>';
  html += '<button type="button" class="primary" id="btn-add-g" style="width:100%">Añadir gasto</button>';
  html += '</div>';

  var barItems = Object.keys(porCat).map(function(k){ return {label:catLabel(k).split('/')[0].trim(), value:porCat[k], id:k}; });
  barItems.sort(function(a,b){ return b.value-a.value; });
  if(barItems.length){
    html += '<h2>Gastos del mes por categoría</h2>';
    html += '<div class="svg-wrap">'+svgBarrasCats(barItems, 320, 180)+'<p class="svg-caption">Total mes: '+euro(totalMes)+'. Mes '+esc(mk)+'.</p></div>';

    html += '<h2>Qué se come el presupuesto</h2>';
    barItems.forEach(function(it){
      var plan = planMap[it.id]||0;
      var pctPlan = plan>0 ? Math.round(it.value/plan*100) : null;
      var pctMes = totalMes>0 ? Math.round(it.value/totalMes*1000)/10 : 0;
      var warn = (plan>0 && it.value>plan) || (pctMes>=25);
      html += '<div class="tip'+(warn?' impact-alta':'')+'"><div class="tt">'+esc(catLabel(it.id))+' · '+euro(it.value)+' ('+pctMes+'% del mes)</div>';
      html += '<p class="tb">';
      if(plan>0) html += 'Plan: '+euro(plan)+(pctPlan!=null?' · '+pctPlan+'% del plan':'')+'. ';
      else html += 'Sin plan en esta categoría. ';
      if(plan>0 && it.value>plan) html += '<strong style="color:var(--peligro)">Has superado el plan.</strong> Revisa fugas o ajusta el presupuesto a la realidad.';
      else if(pctMes>=25) html += 'Peso alto en el mes: normal en vivienda/comida; sospechoso en ocio/delivery si no era la intención.';
      else html += 'Dentro de un rango razonable respecto al resto.';
      html += '</p></div>';
    });
  }

  html += '<div class="panel">';
  html += '<label class="field"><span>Filtro del mes ('+esc(mk)+')</span><select id="g-filtro">'+opts+'</select></label>';
  html += '<div class="stat" style="margin-bottom:.75rem"><div class="n">'+euro(total)+'</div><div class="l">Total listado</div></div>';
  if(!delMes.length) html += '<p class="empty">No hay gastos este mes'+(filtro?' con ese filtro':'')+'.</p>';
  delMes.forEach(function(g){
    html += '<div class="item"><div class="meta"><div class="ttl">'+esc(catLabel(g.cat))+'</div><div class="sub">'+esc(g.fecha)+(g.nota?' · '+esc(g.nota):'')+'</div></div>';
    html += '<div style="text-align:right"><div class="amt">'+euro(g.importe)+'</div>';
    html += '<button type="button" class="sm danger" data-del="'+esc(g.id)+'" style="margin-top:.35rem">Borrar</button></div></div>';
  });
  html += '</div>';

  app.innerHTML = html;
  document.getElementById('g-filtro').addEventListener('change', function(){
    app.dataset.filtroCat = this.value;
    renderGastos();
  });
  document.getElementById('btn-add-g').addEventListener('click', function(){
    var fecha = document.getElementById('g-fecha').value || todayISO();
    var importe = parseFloat(document.getElementById('g-imp').value);
    var cat = document.getElementById('g-cat').value;
    var nota = (document.getElementById('g-nota').value||'').trim();
    if(!(importe>0)){ alert('Indica un importe válido.'); return; }
    var list = load(KEYS.gastos, []);
    list.push({id:uid(), fecha:fecha, cat:cat, importe:importe, nota:nota});
    save(KEYS.gastos, list);
    document.getElementById('g-imp').value='';
    document.getElementById('g-nota').value='';
    renderGastos();
  });
  app.querySelectorAll('[data-del]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var id = btn.getAttribute('data-del');
      if(!confirm('¿Borrar este gasto?')) return;
      var list = load(KEYS.gastos, []).filter(function(g){ return g.id!==id; });
      save(KEYS.gastos, list);
      renderGastos();
    });
  });
}

    html += '<h2>Progreso (SVG)</h2>';

  }

  if(!metas.length) html += '<p class="empty">Aún no hay metas. Empieza con una pequeña y realista.</p>';

    html += '<div class="row" style="justify-content:space-between"><div class="ttl" style="font-family:var(--serif);font-size:1.15rem;font-weight:600">'+esc(m.nombre)+'</div>';
    html += '<button type="button" class="sm danger" data-adel="'+esc(m.id)+'">Eliminar</button></div>';
    html += '<div class="bar" aria-hidden="true"><i style="width:'+pct+'%"></i></div>';
    html += '<p class="muted" style="margin:.35rem 0">'+euro(ap)+' / '+euro(obj)+' · '+pct+'%</p>';
    html += '<div class="row">';
    html += '<label class="field" style="flex:1;margin:0"><span class="sr-only">Aportar</span><input type="number" inputmode="decimal" min="0" step="0.01" placeholder="Aportar €" data-apin="'+esc(m.id)+'"></label>';
    html += '<button type="button" class="primary sm" data-ap="'+esc(m.id)+'">Sumar</button>';
    html += '</div></div>';
