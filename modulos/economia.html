  app.innerHTML = html;
  document.getElementById('btn-add-a').addEventListener('click', function(){
    var nombre = (document.getElementById('a-nom').value||'').trim();
    var objetivo = parseFloat(document.getElementById('a-obj').value)||0;
    var aportado = parseFloat(document.getElementById('a-ap').value)||0;
    if(!nombre){ alert('Pon un nombre a la meta.'); return; }
    if(!(objetivo>0)){ alert('Indica un objetivo en euros.'); return; }
    var list = load(KEYS.ahorro, []);
    list.push({id:uid(), nombre:nombre, objetivo:objetivo, aportado:aportado});
    save(KEYS.ahorro, list);
    renderAhorro();
  });
  app.querySelectorAll('[data-adel]').forEach(function(btn){
    btn.addEventListener('click', function(){
      if(!confirm('¿Eliminar esta meta?')) return;
      var id = btn.getAttribute('data-adel');
      save(KEYS.ahorro, load(KEYS.ahorro,[]).filter(function(m){ return m.id!==id; }));
      renderAhorro();
    });
  });
  app.querySelectorAll('[data-ap]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var id = btn.getAttribute('data-ap');
      var inp = app.querySelector('[data-apin="'+id+'"]');
      var add = parseFloat(inp && inp.value)||0;
      if(!(add>0)){ alert('Indica cuánto aportas.'); return; }
      var list = load(KEYS.ahorro, []);
      list.forEach(function(m){ if(m.id===id) m.aportado = (Number(m.aportado)||0)+add; });
      save(KEYS.ahorro, list);
      renderAhorro();
    });
  });
}

function unitFactor(u){
  u = String(u||'').toLowerCase();
  if(u==='kg'||u==='l'||u==='ud') return 1;
  if(u==='g'||u==='ml') return 0.001;
  return 1;
}
function renderCompra(){
  var tipsState = load(KEYS.compraTips, {});
  var lista = load(KEYS.lista, []);

  var html = '';
  html += '<h2>Comparador A vs B (€ / unidad)</h2>';
  html += '<div class="panel">';
  html += '<p class="muted" style="margin-top:0">Compara dos envases. Orientativo; redondeos posibles. Usa la misma base (kg, l o ud).</p>';
  html += '<div class="cmp-box">';
  html += '<div class="cmp-card" id="cmp-a"><strong>Producto A</strong>';
  html += '<label class="field"><span>Precio (€)</span><input type="number" inputmode="decimal" min="0" step="0.01" id="c-precio"></label>';
  html += '<label class="field"><span>Cantidad</span><input type="number" inputmode="decimal" min="0" step="0.01" id="c-cant"></label>';
  html += '<label class="field"><span>Unidad</span><select id="c-ud"><option value="kg">kg</option><option value="g">g</option><option value="l">l</option><option value="ml">ml</option><option value="ud">unidad(es)</option></select></label>';
  html += '</div>';
  html += '<div class="cmp-card" id="cmp-b"><strong>Producto B (opcional)</strong>';
  html += '<label class="field"><span>Precio (€)</span><input type="number" inputmode="decimal" min="0" step="0.01" id="c-precio-b"></label>';
  html += '<label class="field"><span>Cantidad</span><input type="number" inputmode="decimal" min="0" step="0.01" id="c-cant-b"></label>';
  html += '<label class="field"><span>Unidad</span><select id="c-ud-b"><option value="kg">kg</option><option value="g">g</option><option value="l">l</option><option value="ml">ml</option><option value="ud">unidad(es)</option></select></label>';
  html += '</div></div>';
  html += '<button type="button" class="primary" id="btn-cmp" style="width:100%;margin-top:.5rem">Calcular</button>';
  html += '<p id="c-res" class="muted" style="margin:.75rem 0 0"></p>';
  html += '</div>';

  html += '<h2>Trucos de compra densos ('+DATA.compraTips.length+')</h2>';
  html += '<p class="muted">Marca los que ya aplicas. No son bobadas de «ahorra sonriendo»: son fugas reales de ticket.</p>';
  DATA.compraTips.forEach(function(t,i){
    var done = !!tipsState[t[0]];
    html += '<button type="button" class="check-item'+(done?' done':'')+'" data-tip="'+esc(t[0])+'"><span class="box" aria-hidden="true"></span><span class="txt"><strong style="color:var(--tinta)">'+(i+1)+'.</strong> '+esc(t[1])+'</span></button>';
  });


  html += '<h2>Calendario de compra / casa (España)</h2>';
  DATA.anexo.calendarioCompra.forEach(function(c){
    html += '<div class="tip"><div class="tt">'+esc(c[0])+'</div><p class="tb">'+esc(c[1])+'</p></div>';
  });

  html += '<h2>Lista de la compra económica</h2>';
  html += '<div class="panel">';
  html += '<div class="row">';
  html += '<label class="field" style="flex:1;margin:0"><span class="sr-only">Artículo</span><input type="text" id="l-item" maxlength="80" placeholder="Artículo a comprar"></label>';
  html += '<button type="button" class="primary sm" id="btn-add-l">Añadir</button>';
  html += '</div>';
  if(!lista.length) html += '<p class="empty" style="margin-top:.75rem">Lista vacía.</p>';
  lista.forEach(function(it){
    html += '<button type="button" class="check-item'+(it.done?' done':'')+'" data-lid="'+esc(it.id)+'"><span class="box" aria-hidden="true"></span><span class="txt">'+esc(it.nombre)+'</span></button>';
  });
  html += '<div class="row" style="margin-top:.5rem">';
  html += '<button type="button" class="sm" id="btn-clear-done">Quitar marcados</button>';
  html += '<button type="button" class="sm danger" id="btn-clear-all">Vaciar lista</button>';
  html += '</div></div>';

  app.innerHTML = html;

  document.getElementById('btn-cmp').addEventListener('click', function(){
    function calc(precioEl, cantEl, udEl){
      var precio = parseFloat(document.getElementById(precioEl).value);
      var cant = parseFloat(document.getElementById(cantEl).value);
      var ud = document.getElementById(udEl).value;
      if(!(precio>=0) || !(cant>0)) return null;
      var base = cant * unitFactor(ud);
      if(!(base>0)) return null;
      var per = precio / base;
      var label = (ud==='g'||ud==='kg') ? '€/kg' : (ud==='ml'||ud==='l') ? '€/l' : '€/ud';
      return {per:per, label:label, ud:ud};
    }
    var a = calc('c-precio','c-cant','c-ud');
    var b = calc('c-precio-b','c-cant-b','c-ud-b');
    var out = document.getElementById('c-res');
    var boxA = document.getElementById('cmp-a');
    var boxB = document.getElementById('cmp-b');
    boxA.classList.remove('win'); boxB.classList.remove('win');
    if(!a){ out.textContent = 'Indica al menos precio y cantidad válidos en A.'; return; }
    var htmlr = '<strong style="color:var(--tinta)">A: '+esc(a.per.toLocaleString('es-ES',{maximumFractionDigits:3}))+' '+a.label+'</strong>';
    if(b){
      if(a.label!==b.label){
        htmlr += '<br><span class="muted">B usa otra base ('+esc(b.label)+'). Compara solo si tiene sentido (p.ej. ambos €/kg).</span>';
      }
      htmlr += '<br><strong style="color:var(--tinta)">B: '+esc(b.per.toLocaleString('es-ES',{maximumFractionDigits:3}))+' '+b.label+'</strong>';
      if(a.label===b.label){
        if(a.per<b.per){ boxA.classList.add('win'); htmlr += '<br><span class="ok-txt">A sale más barato por unidad.</span>'; }
        else if(b.per<a.per){ boxB.classList.add('win'); htmlr += '<br><span class="ok-txt">B sale más barato por unidad.</span>'; }
        else htmlr += '<br><span class="muted">Empate orientativo.</span>';
      }
    }
    htmlr += ' <span class="muted">(orientativo)</span>';
    out.innerHTML = htmlr;
  });

  app.querySelectorAll('[data-tip]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var id = btn.getAttribute('data-tip');
      var st = load(KEYS.compraTips, {});
      st[id] = !st[id];
      save(KEYS.compraTips, st);
      renderCompra();
    });
  });
  document.getElementById('btn-add-l').addEventListener('click', function(){
    var nombre = (document.getElementById('l-item').value||'').trim();
    if(!nombre) return;
    var list = load(KEYS.lista, []);
    list.push({id:uid(), nombre:nombre, done:false});
    save(KEYS.lista, list);
    renderCompra();
  });
  app.querySelectorAll('[data-lid]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var id = btn.getAttribute('data-lid');
      var list = load(KEYS.lista, []);
      list.forEach(function(it){ if(it.id===id) it.done = !it.done; });
      save(KEYS.lista, list);
      renderCompra();
    });
  });
  document.getElementById('btn-clear-done').addEventListener('click', function(){
    save(KEYS.lista, load(KEYS.lista,[]).filter(function(it){ return !it.done; }));
    renderCompra();
  });
  document.getElementById('btn-clear-all').addEventListener('click', function(){
    if(!confirm('¿Vaciar toda la lista?')) return;
    save(KEYS.lista, []);
    renderCompra();
  });
}

function mergeIngredientesLista(){
  var list = load(KEYS.lista, []);
  var nombres = {};
  list.forEach(function(it){ nombres[String(it.nombre).toLowerCase()] = true; });
  var added = 0;
  DATA.menuIngredientes.forEach(function(nom){
    var k = nom.toLowerCase();
    if(!nombres[k]){
      list.push({id:uid(), nombre:nom, done:false});
      nombres[k] = true;
      added++;
    }
  });
  save(KEYS.lista, list);
  return added;
}

function weekId(){
  var d = new Date();
  var onejan = new Date(d.getFullYear(),0,1);
  var week = Math.ceil((((d - onejan) / 86400000) + onejan.getDay()+1)/7);
  return d.getFullYear()+'-W'+week;
}

function simFrom(m){
  var objetivo = 1000000;
  var r = rFromEscenario(m.escenario, m.rCustom);
  var mesesH = Math.round((Number(m.horizonteAnios)||20)*12);
  var finalH = fvMensual(m.capital, m.ahorroMensual, r, mesesH);
  var meses = mesesParaObjetivo(m.capital, m.ahorroMensual, r, objetivo);
  var llega = isFinite(meses) && meses <= mesesH && finalH >= objetivo - 0.01;
  // también llega si en algún momento antes del horizonte
  if(isFinite(meses) && meses <= mesesH) llega = true;
  var deficit = Math.max(0, objetivo - finalH);
  var pmtNeed = pmtParaObjetivo(m.capital, r, mesesH, objetivo);
  var aniosNeed = isFinite(meses) ? (meses/12) : Infinity;
  var pts = serieAnual(m.capital, m.ahorroMensual, r, Math.max(m.horizonteAnios||20, isFinite(aniosNeed)?Math.ceil(aniosNeed):m.horizonteAnios||20));
  // truncate display to horizonte or arrival
  var aniosShow = Number(m.horizonteAnios)||20;
  if(isFinite(aniosNeed) && aniosNeed < aniosShow) aniosShow = Math.max(1, Math.ceil(aniosNeed));
  pts = serieAnual(m.capital, m.ahorroMensual, r, aniosShow);
  var hits = hitosMeses(m.capital, m.ahorroMensual, r, [100000,250000,500000,1000000]);
  return {r:r, mesesH:mesesH, finalH:finalH, meses:meses, llega:llega && isFinite(meses), deficit:deficit, pmtNeed:pmtNeed, aniosNeed:aniosNeed, pts:pts, hits:hits, objetivo:objetivo};
}

  html += '<div class="stat"><div class="n">'+euro0(m.ahorroMensual)+'</div><div class="l">Ahorro / mes</div></div>';
  html += '<div class="stat"><div class="n">'+esc(String(sim.r))+' %</div><div class="l">% anual usado</div></div>';
  html += '<div class="stat"><div class="n">'+euro0(sim.finalH)+'</div><div class="l">Al final del horizonte</div></div>';
  html += '</div>';

  if(sim.llega){
    var anios = Math.floor(sim.meses/12);
    var mesR = sim.meses % 12;
    html += '<div class="callout ok-txt"><strong>Con estos supuestos</strong> alcanzarías 1.000.000 € en aprox. <strong>'+esc(String(sim.meses))+' meses</strong> ('+esc(String(anios))+' años'+(mesR?' y '+mesR+' meses':'')+'). No es una garantía: es aritmética con tus inputs.</div>';
  } else {
    html += '<div class="callout bad-txt"><strong>No llega</strong> a 1.000.000 € en '+esc(String(m.horizonteAnios))+' años con estos números. Déficit al horizonte: <strong>'+euro(sim.deficit)+'</strong>.</div>';
    html += '<div class="tip impact-alta"><div class="tt">Qué haría falta (aritmética)</div><p class="tb">Ahorro mensual necesario (mismo horizonte y %): <strong style="color:var(--tinta)">'+euro(sim.pmtNeed)+'</strong> (ahora aportas '+euro(m.ahorroMensual)+').';
    if(isFinite(sim.aniosNeed)) html += ' O bien, manteniendo el ahorro actual: unos <strong style="color:var(--tinta)">'+esc(sim.aniosNeed.toFixed(1))+' años</strong>.';
    else html += ' Con ahorro 0 y % 0, el capital inicial no crece hacia el millón.';
    html += '</p></div>';
  }

  html += '<h2>Evolución del capital</h2>';
  html += '<div class="svg-wrap">'+svgLineaCapital(sim.pts, sim.objetivo)+'<p class="svg-caption">Línea: capital acumulado año a año. Línea discontinua: 1.000.000 €. Escenario r='+esc(String(sim.r))+'%.</p></div>';

  html += '<h2>Hitos</h2>';
  html += '<table class="tabla"><thead><tr><th>Hito</th><th>Tiempo (si aplica)</th></tr></thead><tbody>';
  sim.hits.forEach(function(h){
    var t = !isFinite(h.meses) ? 'No alcanzable con estos inputs' : (Math.floor(h.meses/12)+' a '+ (h.meses%12)+' m ('+h.meses+' meses)');
    html += '<tr><td>'+euro0(h.marca)+'</td><td>'+esc(t)+'</td></tr>';
  });
  html += '</tbody></table>';

  html += '<div class="row" style="margin-top:1rem">';
  html += '<button type="button" class="sm" data-ms="1">← Partida</button>';
  html += '<button type="button" class="primary sm" data-ms="3">Opciones según tus números →</button>';
  html += '</div>';
  return html;
}

function bindMillon(step, m){
  if(step===1){
    var b = document.getElementById('mm-save1');
    if(b) b.addEventListener('click', function(){
      m.capital = parseFloat(document.getElementById('mm-cap').value)||0;
      m.ahorroMensual = parseFloat(document.getElementById('mm-pmt').value)||0;
      m.horizonteAnios = parseFloat(document.getElementById('mm-hor').value)||20;
      m.ingresoNeto = parseFloat(document.getElementById('mm-ing').value)||0;
      m.step = 2;
      save(KEYS.millon, m);
      setMillonStep(2);
    });
  }
  if(step===2){
    var esc = document.getElementById('mm-esc');
    if(esc) esc.addEventListener('change', function(){
      document.getElementById('mm-rcustom-wrap').style.display = this.value==='custom'?'':'none';
    });
    var rc = document.getElementById('mm-recalc');
    if(rc) rc.addEventListener('click', function(){
      m.escenario = document.getElementById('mm-esc').value;
      m.rCustom = parseFloat(document.getElementById('mm-rcustom').value)||0;
      m.rAnual = rFromEscenario(m.escenario, m.rCustom);
      m.step = 2;
      save(KEYS.millon, m);
      renderMillon();
    });
  }
}
