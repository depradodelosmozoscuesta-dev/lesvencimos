<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Tanteo · Les vencimos</title>
<style>
:root {
  --bg: #0e0e0c;
  --bg2: #161512;
  --bg3: #1c1a16;
  --ink: #e6e1d6;
  --muted: #9a9488;
  --accent: #c4a15a;
  --on: #1a160e;
  --danger: #c46a4a;
  --ok: #8f9a72;
  --line: #2e2b24;
  --line2: #3a362c;
  --radius: 8px;
  --sans: system-ui, "Segoe UI", sans-serif;
  --serif: Georgia, Palatino, "Palatino Linotype", "Times New Roman", serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
html { overflow-x: hidden; }
body {
  font-family: var(--sans);
  font-size: 16.5px;
  line-height: 1.45;
  font-weight: 400;
  min-height: 100vh;
  padding:
    max(12px, env(safe-area-inset-top))
    max(16px, env(safe-area-inset-right))
    max(28px, env(safe-area-inset-bottom))
    max(16px, env(safe-area-inset-left));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button, [role="button"] { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#contenido:focus { outline: none; }
a { color: var(--accent); }
a.sec, a.item { color: inherit; text-decoration: none; }
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.skip {
  position: absolute;
  left: -999px;
  top: 0;
}
.skip:focus {
  left: 8px;
  top: 8px;
  z-index: 5;
  background: var(--accent);
  color: var(--on);
  padding: 10px 12px;
  border-radius: var(--radius);
}
.marco { max-width: 760px; margin: 0 auto; }
.top { margin-bottom: 14px; }
.top-row, .top-title {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  justify-content: space-between;
}
.top-title { margin-top: 8px; align-items: center; }
.marca, .modulo, .meta, .ayuda, .sec-d, .item-m, .item-r {
  color: var(--muted);
}
.marca, .modulo {
  margin: 0;
  font-size: 0.78rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 500;
}
h1, h2, .h1 {
  font-family: var(--serif);
  font-weight: 500;
  letter-spacing: -0.02em;
  margin: 0;
}
.h1, h1 { font-size: 1.7rem; line-height: 1.15; }
h2 { font-size: 1.2rem; margin: 1.1rem 0 0.4rem; }
.lead { margin: 0 0 12px; }
.aviso, .tip, .resultado {
  margin: 0 0 12px;
  padding: 10px 12px;
  background: var(--bg3);
  border-radius: var(--radius);
}
.aviso { border-left: 3px solid var(--danger); }
.tip { border-left: 3px solid var(--ok); }
.resultado { border-left: 3px solid var(--accent); }
.buscar { display: block; margin: 0 0 12px; }
input, select, textarea {
  width: 100%;
  min-height: 44px;
  background: var(--bg3);
  border: 1px solid var(--line2);
  border-radius: var(--radius);
  padding: 10px 12px;
}
textarea { min-height: 96px; resize: vertical; }
.secs, .lista { display: grid; gap: 8px; }
@media (min-width: 720px) {
  .secs { grid-template-columns: 1fr 1fr; }
}
.sec, .item, .check, .card {
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: inherit;
  text-align: left;
}
.sec, .item, .check {
  width: 100%;
  min-height: 44px;
  padding: 12px;
}
.sec, .item { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
.sec-t, .item-t { font-weight: 500; }
.sec-n { color: var(--accent); font-variant-numeric: tabular-nums; }
.check { display: flex; gap: 12px; align-items: flex-start; }
.check .box {
  width: 22px;
  height: 22px;
  margin-top: 2px;
  border: 1.5px solid var(--muted);
  border-radius: 4px;
  flex: none;
  position: relative;
}
.check.on { border-color: var(--accent); }
.check.on .box { background: var(--accent); border-color: var(--accent); }
.check.on .box::after {
  content: "";
  position: absolute;
  left: 7px;
  top: 3px;
  width: 5px;
  height: 10px;
  border: solid var(--on);
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}
.card { padding: 12px 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip, .btn {
  min-height: 44px;
  padding: 10px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--line2);
  background: transparent;
  color: var(--ink);
  font-weight: 500;
}
.chip.on, .btn.primary { background: var(--accent); color: var(--on); border-color: var(--accent); }
.btn.danger { border-color: var(--danger); color: var(--ink); }
.btn.ghost { background: transparent; }
.navp { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.prosa ul, .prosa ol { margin: 0.2rem 0 0.6rem; padding-left: 1.2rem; }
.prosa li { margin: 0.35rem 0; }
.prosa p { margin: 0.4rem 0 0.7rem; }
.dibujo {
  width: 100%;
  height: auto;
  display: block;
  margin: 0 0 12px;
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.form label { display: flex; flex-direction: column; gap: 6px; margin: 0 0 12px; }
.ayuda { margin: -6px 0 12px; font-size: 0.92rem; }
.vacio { color: var(--muted); }
.aparato {
  margin-top: 22px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}
.colofon {
  max-width: 760px;
  margin: 22px auto 0;
  color: var(--muted);
  font-size: 0.85rem;
}
.facil { font-size: 19px; }
.facil .h1, .facil h1 { font-size: 2rem; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

.gridj { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-width: 340px; margin: 12px 0 8px; }
.tile {
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--line2);
  border-radius: var(--radius);
  font-family: var(--serif);
  font-size: 1.45rem;
  font-weight: 500;
  text-transform: uppercase;
  background: var(--bg);
}
.tile[data-s="correct"] { background: var(--accent); color: var(--on); border-color: var(--accent); }
.tile[data-s="present"] { background: var(--ok); color: var(--on); border-color: var(--ok); }
.tile[data-s="absent"] { background: var(--bg2); color: var(--muted); border-color: var(--line); }
.tile.now { border-color: var(--accent); }
.kb { max-width: 520px; display: grid; gap: 6px; margin-top: 8px; }
.kbrow { display: flex; gap: 6px; justify-content: center; }
.key {
  flex: 1 1 0;
  min-height: 48px;
  min-width: 44px;
  max-width: 72px;
  padding: 0 2px;
  border-radius: var(--radius);
  border: 1px solid var(--line2);
  background: var(--bg3);
  color: var(--ink);
  font-weight: 500;
  text-transform: uppercase;
}
.key.wide { flex: 1 1 0; max-width: none; min-width: 44px; text-transform: none; font-size: 0.95rem; }
.key[data-s="correct"] { background: var(--accent); color: var(--on); border-color: var(--accent); }
.key[data-s="present"] { background: var(--ok); color: var(--on); border-color: var(--ok); }
.key[data-s="absent"] { background: var(--bg); color: var(--muted); }
.msg { min-height: 1.4em; margin: 8px 0; }
.bars { display: grid; gap: 6px; margin-top: 8px; }
.barrow { display: grid; grid-template-columns: 1.2rem 1fr 2rem; gap: 8px; align-items: center; }
.bar { height: 12px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); }
.ej { display: flex; gap: 4px; margin: 8px 0; }
.ej i {
  width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
  border-radius: 6px; font-style: normal; font-family: var(--serif); font-weight: 500;
}
.ej i.c { background: var(--accent); color: var(--on); }
.ej i.p { background: var(--ok); color: var(--on); }
.ej i.a { background: var(--bg2); color: var(--muted); border: 1px solid var(--line); }
@keyframes shake {
  25% { transform: translateX(-3px); }
  50% { transform: translateX(3px); }
  75% { transform: translateX(-2px); }
}
.shake { animation: shake 0.35s linear; }

</style>
</head>

      onKey(partida(r.modo, r.tema), norm(k));
    }
  });
  window.addEventListener("hashchange", render);
  render();
})();

</script>
