<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 72" role="img" aria-labelledby="ojoTitle ojoDesc">
  <title id="ojoTitle">Ojo cerrado</title>
  <desc id="ojoDesc">El ojo que vigila, cerrado. Les vencimos.</desc>
  <!-- Fondo sutil: halo de vigilancia apagado -->
  <ellipse cx="60" cy="36" rx="48" ry="28" fill="none" stroke="#9A9488" stroke-opacity="0.18" stroke-width="0.75"/>
  <!-- Contorno del ojo (almendra) — trazo irregular, hecho a mano -->
  <path fill="none" stroke="#E6E1D6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
        d="M14 36
           C28 18, 46 12, 60 12
           C74 12, 92 18, 106 36
           C92 54, 74 60, 60 60
           C46 60, 28 54, 14 36 Z"/>
  <!-- Iris apagado (casi oculto bajo el párpado) -->
  <circle cx="60" cy="36" r="14" fill="none" stroke="#9A9488" stroke-opacity="0.35" stroke-width="1.1"/>
  <circle cx="60" cy="36" r="5.5" fill="#9A9488" fill-opacity="0.22"/>
  <!-- Pupila tachada: slash dorado atravesando el iris -->
  <path fill="none" stroke="#C4A15A" stroke-width="2.2" stroke-linecap="round"
        d="M48 48 L72 24"/>
  <!-- Párpado superior cerrándose — curva pesada -->
  <path fill="#0E0E0C" fill-opacity="0.55" stroke="#E6E1D6" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
        d="M18 34
           C32 22, 48 17, 60 17
           C72 17, 88 22, 102 34
           C90 30, 74 28, 60 28
           C46 28, 30 30, 18 34 Z"/>
  <!-- Pestaña / pliegue inferior suave -->
  <path fill="none" stroke="#9A9488" stroke-opacity="0.55" stroke-width="1.1" stroke-linecap="round"
        d="M22 40 C36 48, 48 51, 60 51 C72 51, 84 48, 98 40"/>
  <!-- Corona / marca Les vencimos ayudando a cerrar (pétalo geométrico arriba) -->
  <g transform="translate(60, 4)" fill="none" stroke="#C4A15A" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-10 6 V11"/>
    <path d="M-4.5 3.5 V8.5"/>
    <path d="M4.5 3.5 V8.5"/>
    <path d="M10 6 V11"/>
  </g>
  <path transform="translate(60, 2)" fill="#C4A15A"
        d="M0 2c-0.55 4.6-4.5 6.9-7.9 8.05C-4.1 11.2-0.55 13.5 0 18.1c0.55-4.6 4.5-6.9 7.9-8.05C4.1 8.9 0.55 6.6 0 2z"/>
  <!-- Mano / cortina suave a la derecha: dedos que tiran del párpado -->
  <g fill="none" stroke="#C4A15A" stroke-opacity="0.85" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M98 22 C106 26, 110 32, 111 40"/>
    <path d="M100 28 C104 30, 107 34, 108 38"/>
    <path d="M96 26 C101 29, 104 33, 105 37"/>
  </g>
</svg>
