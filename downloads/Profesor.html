antes de comprar?","opciones":["¿Con qué tres cosas que ya tengo me lo pondría?","¿Está de moda?","¿Tiene descuento?"],"correcta":0,"porque":"Sin tres combinaciones en casa, la prenda será un estorbo con etiqueta: no entra."},{"pregunta":"¿Qué es el coste por uso?","opciones":["El precio dividido entre las veces que usas la prenda","El precio de etiqueta","El IVA"],"correcta":0,"porque":"La chaqueta cara usada 200 veces es barata; la camiseta de saldo usada dos veces es carísima."}]},{"titulo":"Vestir según la ocasión y según tú","contenido":["Cada ocasión tiene su idioma y vestirse es hablarlo: el código informal (diario), el informal elegante ('smart casual': camisa o polo, pantalón chino, zapatos limpios), el de negocios (traje o americana) y el de gala. La regla de supervivencia: ante la duda, ve un medio punto más arreglado que el evento; quedar demasiado formal es más fácil de arreglar (se quita la chaqueta) que al revés.","El cuerpo tiene geometría y la ropa la negocia: las rayas verticales estilizan, las horizontales ensanchan; los colores oscuros recogen, los claros expanden; las prendas con estructura (hombros, pinzas) ordenan la figura. No se trata de esconderse: se trata de poner el volumen donde tú decides.","Y luego está lo que no se compra: la postura y la actitud. La misma camisa cambia de categoría con la espalda recta y la mirada al frente. Vestirse es la carta de presentación, pero quien habla eres tú: la ropa abre la puerta, la persona la cruza.","Reto: planifica hoy el conjunto de tu próximo evento importante, de pies a cabeza, y déjalo preparado. Vestirse sin prisa es la mitad de vestir bien."],"quiz":[{"pregunta":"¿Cuál es la regla ante la duda sobre el código de vestimenta?","opciones":["Ir un medio punto más arreglado que el evento","Ir siempre de deporte","No ir"],"correcta":0,"porque":"Bajar el formalismo es fácil (quitar chaqueta); subirlo sobre la marcha, imposible."},{"pregunta":"¿Qué efecto tienen las rayas verticales?","opciones":["Estilizan la figura","Ensanchan","Ninguno"],"correcta":0,"porque":"Verticales alargan, horizontales ensanchan, oscuros recogen, claros expanden: geometría del vestir."},{"pregunta":"¿Qué parte del atuendo no se compra en tiendas?","opciones":["La postura y la actitud","Los zapatos","El cinturón"],"correcta":0,"porque":"La misma camisa cambia con la espalda recta: la ropa abre la puerta, la persona la cruza."}]}],"nivel":"basico"},{"id":"vida-real","titulo":"Matemáticas en la vida real","icono":"🏠","lecciones":[{"titulo":"La cocina: recetas y proporciones","contenido":["Toda receta es una proporción. Si la masa lleva 500 g de harina para 4 personas, para 6 hacen falta 750 g: divide entre 4 y multiplica por 6. La regla de tres, en delantal.","Las medidas de cocina son fracciones vivas: media taza, un cuarto de cucharadita, un tercio de litro. Doblar una receta es sumar fracciones sin darte cuenta.","Los hornos traen otra cuenta: tiempos y temperaturas. Si el pollo tarda 20 minutos por kilo y pesa 2,2 kg: 44 minutos. Más el precalentado.","Las conversiones salvavidas: una cucharada son unos 15 ml, una cucharadita unos 5 ml, una taza unos 240 ml. Un litro son 4 tazas y pico.","Y la cuenta invisible: el coste por ración. Si el guiso entero costó 9 y salen 6 platos, cada plato cuesta 1,5. Cocinar en casa suele salir a la tercera parte que comprar hecho: la olla es una máquina de ahorrar."],"quiz":[{"pregunta":"La receta es para 4 y lleva 500 g de harina. ¿Para 6?","opciones":["600 g","750 g","1.000 g"],"correcta":1,"porque":"500 ÷ 4 = 125 g por persona; 125 × 6 = 750."},{"pregunta":"El pollo tarda 20 min por kilo y pesa 2,2 kg. ¿Cuánto al horno?","opciones":["22 min","44 min","60 min"],"correcta":1,"porque":"20 × 2,2 = 44 minutos."},{"pregunta":"Un guiso de 9 da 6 platos. ¿Cuánto cuesta cada plato?","opciones":["1,5","2","0,6"],"correcta":0,"porque":"9 ÷ 6 = 1,5. La cocina casera es regla de tres con olor bueno."}]},{"titulo":"Casa y bricolaje","contenido":["Pintar una pared: mide ancho por alto para el área. Pared de 4 × 2,5 m: 10 m². Si el bote cubre 12 m² por litro, un litro basta. Si necesitara dos manos, dos litros.","Suelo: una habitación de 4 × 3 m tiene 12 m². Las cajas de tarima cubren 2 m² cada una: 6 cajas, más una de repuesto por los cortes. Siempre un 10% de más.","Cortar recto usa la geometría del albañil: para una esquina perfecta, marca 3 en un lado, 4 en el otro, y que la diagonal mida 5. Pitágoras con metro y lápiz.","Los taladros y tornillos hablan en fracciones: brocas de 6 mm, tacos de 8 mm. Que taco y broca coincidan es la mitad del arreglo.","Presupuesto de la reforma: suma materiales, suma un 15% de imprevistos (siempre los hay), y compara presupuestos por partidas, no solo por el total."],"quiz":[{"pregunta":"Pared de 4 × 2,5 m. ¿Qué área tiene?","opciones":["6,5 m²","10 m²","13 m²"],"correcta":1,"porque":"Ancho por alto: 4 × 2,5 = 10 m²."},{"pregunta":"Habitación de 12 m², cajas de 2 m². ¿Cuántas cajas compras?","opciones":["6","7 (con repuesto)","12"],"correcta":1,"porque":"6 cubren el suelo, pero los cortes gastan: siempre una de más."},{"pregunta":"¿Qué medidas dan una esquina perfectamente recta?","opciones":["2-2-3","3-4-5","5-5-5"],"correcta":1,"porque":"3² + 4² = 5²: si la diagonal mide 5, el ángulo es de 90°."}]},{"titulo":"El coche y los viajes","contenido":["Distancia = velocidad × tiempo. A 90 km/h durante 2 horas: 180 km. Y al revés: 300 km a 100 km/h son 3 horas justas, sin contar paradas.","El consumo: si el coche gasta 6 litros a los 100 km, un viaje de 350 km pide 21 litros (6 × 3,5). Si el litro está a 1,6, son unos 34.","Llenar el depósito enseña más: apunta litros y kilómetros entre repostajes. 42 litros para 600 km: 7 litros a los 100. Ese número tuyo vale más que el del folleto.","La regla de la distancia de seguridad: a 100 km/h recorres unos 28 metros por segundo. En dos segundos de despiste, 56 metros: más que media cancha de fútbol. La física no perdona el móvil.","Viaje largo: suma peajes, combustible, comidas y una noche si toca. El billete «barato» de avión a veces pierde contra el coche compartido entre cuatro: divide el coste total, no el depósito."],"quiz":[{"pregunta":"¿Cuánto se tarda en hacer 300 km a 100 km/h?","opciones":["2 horas","3 horas","3,5 horas"],"correcta":1,"porque":"Tiempo = distancia ÷ velocidad: 300 ÷ 100 = 3 h."},{"pregunta":"Consumo de 6 l/100 km en un viaje de 350 km. ¿Cuántos litros?","opciones":["21","35","12"],"correcta":0,"porque":"6 × 3,5 = 21 litros."},{"pregunta":"A 100 km/h, ¿cuántos metros recorres en 2 segundos de despiste?","opciones":["Unos 10 m","Unos 28 m","Unos 56 m"],"correcta":2,"porque":"28 m por segundo, por dos: 56 metros sin mirar la carretera."}]},{"titulo":"El cuerpo y la salud en números","contenido":["El IMC relaciona peso y estatura: peso ÷ (altura × altura), con la altura en metros. 70 kg y 1,75 m: 70 ÷ 3,06 ≈ 23. Entre 18,5 y 25 se considera rango saludable. Es orientativo, no una sentencia.","La fiebre se lee en décimas: 37,5 es diferente de 39,5. Cada décima cuenta cuando hay un niño de por medio; apunta la hora de cada toma.","Las dosis infantiles van por peso: «10 mg por kilo». Un niño de 20 kg toma 200 mg. Multiplicar bien aquí es salud, literalmente. Lee siempre el prospecto dos veces.","El pulso: cuéntalo 15 segundos y multiplica por 4. 18 latidos en 15 s son 72 por minuto. En reposo, 60 a 100 es lo habitual en adultos.","Los análisis hablan en rangos: «glucosa 70-100». Un valor fuera de rango una vez no es diagnóstico; la tendencia en el tiempo es la que informa. La estadística de tu propio cuerpo."],"quiz":[{"pregunta":"70 kg y 1,75 m de altura. ¿Qué IMC da?","opciones":["40","Unos 23","12"],"correcta":1,"porque":"1,75 × 1,75 ≈ 3,06; 70 ÷ 3,06 ≈ 23."},{"pregunta":"Dosis de 10 mg por kilo para un niño de 20 kg. ¿Cuánto toma?","opciones":["100 mg","200 mg","20 mg"],"correcta":1,"porque":"10 × 20 = 200 mg. El peso manda en la dosis."},{"pregunta":"18 latidos en 15 segundos. ¿Cuál es el pulso por minuto?","opciones":["18","72","270"],"correcta":1,"porque":"15 segundos × 4 = un minuto; 18 × 4 = 72."}]},{"titulo":"Comprar con cabeza","contenido":["El precio que importa no está en grande: es el precio por kilo o por litro, en la etiqueta pequeña del estante. El paquete grande no siempre gana.","Oferta «segunda unidad al 50%»: comprando dos, cada una sale al 75%, es decir, un 25% de descuento real. Las tiendas cuentan con que nadie haga esta cuenta.","«3 × 2» solo ahorra si necesitabas 3. Si usas 2 y el tercero caduca, pagaste de más por menos. El mejor descuento es no comprar lo que sobra.","Las suscripciones son gastos vampiro: 9,99 al mes son 120 al año. Suma todas las tuyas una vez al año y mira el susto. Lo pequeño y repetido pesa más que lo grande y único.","Y la inflación: si todo sube un 5% al año, en unos 14 años los precios se doblan (regla del 72: 72 ÷ 5 ≈ 14). Por eso el dinero quieto pierde."],"quiz":[{"pregunta":"«Segunda unidad al 50%». ¿Qué descuento real hay comprando dos?","opciones":["50%","25%","75%"],"correcta":1,"porque":"Pagas 1 + 0,5 = 1,5 por dos unidades: cada una sale al 75%."},{"pregunta":"Una suscripción de 9,99 al mes cuesta al año…","opciones":["Unos 100","Unos 120","Unos 60"],"correcta":1,"porque":"9,99 × 12 ≈ 120. Los gastos vampiro se cazan sumando el año."},{"pregunta":"Con inflación del 5%, ¿en cuánto se doblan los precios?","opciones":["5 años","Unos 14 años","20 años"],"correcta":1,"porque":"Regla del 72: 72 ÷ 5 ≈ 14 años."}]},{"titulo":"Sueldo, impuestos y préstamos","contenido":["El sueldo bruto no es el que llega: entre impuestos y cotizaciones, el neto puede ser un 20-30% menos. Haz tus cuentas siempre con el neto, el de verdad.","Los impuestos por tramos: subir de tramo NO hace que todo tu sueldo tribute más alto, solo la parte que pasa del borde. Subir de sueldo nunca te deja con menos: es un mito que conviene matar.","Préstamo: cuota pequeña no es préstamo bueno. Lo que importa es el total: cuota × meses + comisiones. Un préstamo de 5.000 a 5 años puede acabar costando 6.500.","El TAE resume el coste real anual, con todo incluido. Compara préstamos por TAE, no por la letra grande del anuncio.","Regla de la casa: vivienda que no supere el 30-35% de tus ingresos netos. El banco te prestará más de lo que te conviene; su límite no es tu límite."],"quiz":[{"pregunta":"¿Con qué sueldo se hacen las cuentas familiares?","opciones":["El bruto","El neto, el que llega","El del contrato"],"correcta":1,"porque":"El neto es el dinero real; el bruto es literatura."},{"pregunta":"Si subes de tramo de impuestos…","opciones":["Todo tu sueldo tributa más","Solo tributa más la parte que pasa del borde","Pierdes dinero"],"correcta":1,"porque":"Los tramos son por escalones: ganar más nunca te deja con menos neto."},{"pregunta":"¿Cómo se comparan dos préstamos?","opciones":["Por la cuota mensual","Por el TAE y el coste total","Por el anuncio"],"correcta":1,"porque":"La cuota baja puede esconder años extra: el total no miente."}]}],"nivel":"medio"},{"id":"supervivencia","titulo":"Matemáticas de supervivencia","icono":"🏕️","lecciones":[{"titulo":"La regla de los tres","contenido":["La supervivencia tiene su propia regla de tres: se aguanta unos 3 minutos sin aire, unas 3 horas expuesto al frío o calor extremo, unos 3 días sin agua y unas 3 semanas sin comida.","Esa jerarquía ordena las decisiones: primero respirar y protegerse del clima (refugio), luego agua, y la comida al final. El hambre asusta, pero la deshidratación mata antes.","El cuerpo pide unos 2 litros de agua al día en reposo; con calor o esfuerzo, el doble o más. Un adulto perdido con 5 litros tiene para poco más de dos días: el agua dicta el plan.","Racionar no es repartir en partes iguales hasta el final: es beber lo necesario hoy y buscar fuente mañana. Las cuentas de supervivencia se hacen con margen de error.","Memoriza: 3 minutos, 3 horas, 3 días, 3 semanas. Cuatro números que ordenan el mundo cuando todo sale mal."],"quiz":[{"pregunta":"¿Qué va primero en una emergencia?","opciones":["Buscar comida","Aire y refugio contra el clima","Hacer fuego bonito"],"correcta":1,"porque":"3 horas de exposición matan antes que 3 días sin agua: la prioridad es el refugio."},{"pregunta":"¿Cuánta agua necesita una persona al día como mínimo?","opciones":["Medio litro","Unos 2 litros, más con calor","Un vaso"],"correcta":1,"porque":"Dos litros en reposo; con esfuerzo o calor, el doble."},{"pregunta":"¿Cuántos días se puede aguantar sin comida aproximadamente?","opciones":["3 días","Unas 3 semanas","3 meses"],"correcta":1,"porque":"El hambre es grave pero lenta: el agua y el frío van mucho antes."}]},{"titulo":"El fuego y el refugio","contenido":["El fuego se construye con progresión geométrica: ramas finas como cerillas, luego como lápices, luego como muñecas, luego troncos. Cada etapa duplica el grosor de la anterior.","Saltarse la progresión — una rama gorda sobre yesca — apaga el fuego. Como en matemáticas: no hay atajos que salten pasos.","El refugio se calcula: el calor se pierde sobre todo por el suelo (conducción). Una cama de hojas de 20 cm aísla más que tres mantas debajo. Aísla primero del suelo, luego del aire.","Tamaño del refugio: justo para tu cuerpo. El espacio vacío hay que calentarlo con tu propio calor; un refugio grande es un frigorífico. Pequeño y bajo gana.","El triángulo de fuego — calor, combustible, oxígeno — es geometría de decisiones: falta uno y no hay fuego. Quitar uno apaga el fuego (por eso se tapa, se sofoca, se separa leña)."],"quiz":[{"pregunta":"¿Cómo se construye el fuego?","opciones":["Troncos grandes primero","De lo fino a lo grueso, duplicando grosor","Todo a la vez"],"correcta":1,"porque":"Progresión: yesca, cerillas, lápices, muñecas, troncos."},{"pregunta":"¿Por dónde pierde más calor el cuerpo tumbado?","opciones":["Por la cabeza","Por el suelo, por conducción","Por los pies"],"correcta":1,"porque":"El suelo roba calor por contacto: la cama de hojas es prioridad."},{"pregunta":"¿Qué tamaño debe tener el refugio?","opciones":["Grande y ventilado","Justo para el cuerpo, pequeño y bajo","Con vistas"],"correcta":1,"porque":"El aire vacío lo calientas tú: menos volumen, menos calor perdido."}]},{"titulo":"Agua: encontrarla y hacerla segura","contenido":["El agua fluye cuesta abajo: busca valles, vegetación verde, vuelos de pájaros al amanecer. La geometría del terreno dibuja dónde está.","Hervir es la cuenta más simple: 1 minuto a borbotones mata casi todo. En alta montaña, 3 minutos (el agua hierve más fría y necesita más tiempo).","El transecto de los arroyos: agua que corre clara es mejor que agua quieta. La turbidez se puede filtrar con tela y arena, pero filtrar NO desinfecta: hierve después igualmente.","Señales de distancia al agua: las abejas rara vez vuelan a más de 1-2 km de su agua; las hormigas subiendo a los árboles indican humedad cerca.","Nunca bebas por sed extrema sin tratar: una diarrea pierde más agua de la que ganaste. La cuenta más triste de la supervivencia."],"quiz":[{"pregunta":"¿Cuánto hay que hervir el agua para hacerla segura?","opciones":["10 segundos","1 minuto a borbotones","Una hora"],"correcta":1,"porque":"Un minuto de borbotones; en alta montaña, tres."},{"pregunta":"Filtrar con tela y arena…","opciones":["Desinfecta el agua","Quita turbidez pero no desinfecta: hierve después","Es suficiente"],"correcta":1,"porque":"El filtro quita lo que se ve; los microbios pasan. Solo el calor los mata."},{"pregunta":"¿Qué indica un valle con vegetación verde?","opciones":["Buen refugio","Agua cerca","Peligro"],"correcta":1,"porque":"El verde profundo delata humedad: el agua dibuja el paisaje."}]},{"titulo":"Señales y distancias","contenido":["El código universal de socorro son los TRES: tres fogatas, tres pitidos, tres destellos de espejo. Cualquier cosa repetida tres veces dice «ayuda» en todo el planeta.","El fuego de señales: humo de día (hojas verdes), llamas de noche. Un triángulo de tres fogatas, separadas unos 25-30 metros, es la señal aérea estándar.","Estimar distancias: el pulgar. Con el brazo extendido, tu pulgar cubre unos 2° del cielo; un objeto conocido (una casa de unos 10 m) que cabe bajo el pulgar está a unos 300-500 m.","El sonido: aire claro, el grito se oye a unos cientos de metros; el silbato, al doble. Tres pitidos, pausa, tres pitidos: el patrón importa más que el volumen.","Deja rastro si te mueves: ramas dobladas, montoncitos de piedras, marcas cada 50-100 m. Pero si no sabes dónde estás, la regla es quedarse: quien te busca, busca en el último punto conocido."],"quiz":[{"pregunta":"¿Cuál es la señal universal de socorro?","opciones":["Gritar fuerte","Tres de cualquier cosa: fogatas, pitidos, destellos","Una bandera blanca"],"correcta":1,"porque":"El tres repetido es el código internacional de emergencia."},{"pregunta":"¿Cómo se disponen las tres fogatas de señal aérea?","opciones":["En fila","En triángulo, a 25-30 m","Juntas"],"correcta":1,"porque":"El triángulo de tres fuegos es reconocible desde el aire como señal intencionada."},{"pregunta":"Si estás perdido y no sabes dónde estás, ¿qué manda la regla?","opciones":["Caminar hacia el sur","Quedarse en el sitio","Seguir el río"],"correcta":1,"porque":"Los rescatadores buscan desde el último punto conocido: moverse te aleja de la búsqueda."}]},{"titulo":"Orientarse sin brújula: lo esencial","contenido":["El sol sale por el este y se pone por el oeste. Al mediodía (en el hemisferio norte) está al sur. Con eso ya tienes una rosa de vientos aproximada.","El método del palo: clava un palo, marca la punta de su sombra, espera 15 minutos, marca la nueva punta. La línea une oeste-este; el sol viaja hacia el oeste.","De noche: la Estrella Polar marca el norte. Se encuentra prolongando cinco veces la distancia entre las dos estrellas del borde del carro de la Osa Mayor.","En el hemisferio sur no hay Polar: se usa la Cruz del Sur, alargando su brazo largo hacia el horizonte.","Ojo con los mitos: el musgo NO crece siempre al norte (crece donde hay humedad y sombra). Los árboles tampoco «señalan» con certeza. Confirma siempre con dos métodos distintos."],"quiz":[{"pregunta":"¿Qué te da el método del palo y la sombra?","opciones":["La hora exacta","La línea oeste-este","La altitud"],"correcta":1,"porque":"La sombra se mueve hacia el este: las dos marcas dibujan el eje oeste-este."},{"pregunta":"¿Qué estrella marca el norte en el hemisferio norte?","opciones":["Sirio","La Polar, por la Osa Mayor","Venus"],"correcta":1,"porque":"Prolongando el borde del carro de la Osa Mayor se llega a la Polar, que apenas se mueve."},{"pregunta":"¿El musgo crece siempre en la cara norte?","opciones":["Sí, infalible","No: crece donde hay humedad; hay que confirmar con otro método","Solo de noche"],"correcta":1,"porque":"Es un mito a medias: humedad y sombra mandan, no el norte."}]},{"titulo":"El botiquín en números","contenido":["La hipotermia empieza por debajo de 35 °C de temperatura corporal: temblor fuerte, torpeza, habla rara. Entre 32 y 35 es moderada; menos de 32, crítica. Números que hay que reconocer.","El triaje en emergencias ordena por colores: rojo (atención inmediata), amarillo (puede esperar), verde (leve), negro (no se puede hacer más). Primero los que más lo necesitan Y pueden salvarse: la cuenta más dura que existe.","RCP: 30 compresiones y 2 ventilaciones, a ritmo de 100-120 por minuto (el ritmo de «Stayin' Alive» de los Bee Gees, en serio: se enseña así).","La hemorragia se trata con presión directa fuerte y continua. Elevar la zona si se puede. No retires objetos clavados: taponan la herida.","Y la regla de oro de todo botiquín: saber usarlo vale más que llevarlo. Un torniquete mal puesto daña; una presión bien hecha salva. Practica antes de necesitarlo."],"quiz":[{"pregunta":"¿Por debajo de qué temperatura corporal empieza la hipotermia?","opciones":["37 °C","35 °C","30 °C"],"correcta":1,"porque":"Menos de 35 °C: temblor, torpeza y habla rara son las señales."},{"pregunta":"¿Cuál es el ritmo de la RCP?","opciones":["60 por minuto","100-120 compresiones por minuto","200 por minuto"],"correcta":1,"porque":"El ritmo de «Stayin' Alive»: 100-120, con 30 compresiones y 2 ventilaciones."},{"pregunta":"Un objeto clavado en una herida…","opciones":["Se retira rápido","No se retira: está taponando la hemorragia","Se mueve poco a poco"],"correcta":1,"porque":"Sacarlo abre el grifo: se inmoviliza y se presiona alrededor."}]}],"nivel":"medio"},{"id":"navegacion","titulo":"Navegación y orientación","icono":"🧭","lecciones":[{"titulo":"La rosa de los vientos y los grados","contenido":["La brújula divide el horizonte en 360°: norte 0°, este 90°, sur 180°, oeste 270°. Los rumbos se dicen en grados: «rumbo 135» es el sureste exacto.","Los puntos intermedios: noreste (45°), sureste (135°), suroeste (225°), noroeste (315°). Con ocho direcciones se describe cualquier camino.","Convertir dirección en número y número en dirección es el primer oficio del navegante. La mitad entre norte y este: (0 + 90) ÷ 2 = 45. Promedios con brújula.","Cuidado con el norte magnético: la aguja apunta al polo magnético, no al geográfico; la diferencia (declinación) cambia según dónde estés y puede llegar a grados que importan en travesías largas.","Practica en tu barrio: identifica dónde sale el sol (este aproximado) y construye tu rosa mental. Orientarse empieza por mirar."],"quiz":[{"pregunta":"¿Qué rumbo en grados es el este?","opciones":["0°","90°","180°"],"correcta":1,"porque":"Norte 0°, este 90°, sur 180°, oeste 270°."},{"pregunta":"¿Qué dirección es el rumbo 225°?","opciones":["Noreste","Sureste","Suroeste"],"correcta":2,"porque":"Entre sur (180°) y oeste (270°): el suroeste."},{"pregunta":"¿A qué norte apunta la brújula?","opciones":["Al geográfico","Al polo magnético, y hay que corregir la declinación","Al Polo Norte exacto"],"correcta":1,"porque":"Magnético y geográfico no coinciden: la declinación es la corrección."}]},{"titulo":"Leer el sol y las sombras","contenido":["El sol es un reloj y una brújula a la vez. Sale por el este, culmina al sur (hemisferio norte) a mediodía y se pone por el oeste.","El reloj de sol horizontal: la sombra de un palo vertical marca el tiempo. La sombra más corta del día señala el mediodía solar y apunta al norte-sur.","Método del reloj de agujas: apunta la aguja horaria hacia el sol; la bisectriz entre ella y las 12 marca el sur (hemisferio norte). Un reloj de pulsera convertido en brújula.","El ángulo del sol te da la hora restante: cada hora, el sol recorre unos 15° (360° ÷ 24). Si faltan 45° para el ocaso, quedan unas 3 horas de luz.","El analema: el sol no culmina siempre a la misma hora de reloj; la órbita terrestre lo adelanta y atrasa hasta 16 minutos a lo largo del año. La naturaleza no lleva horario de oficina."],"quiz":[{"pregunta":"¿Cuántos grados recorre el sol por hora?","opciones":["10°","15°","30°"],"correcta":1,"porque":"360° ÷ 24 horas = 15° por hora."},{"pregunta":"¿Qué marca la sombra más corta del día?","opciones":["El amanecer","El mediodía solar y la línea norte-sur","La primavera"],"correcta":1,"porque":"Cuando el sol culmina, la sombra es mínima y apunta al eje norte-sur."},{"pregunta":"Con el reloj de agujas, ¿dónde está el sur (hemisferio norte)?","opciones":["Donde apunta la horaria","En la bisectriz entre la horaria (al sol) y las 12","A las 6 en punto"],"correcta":1,"porque":"Mitad del ángulo entre el sol y el mediodía: el sur aproximado."}]},{"titulo":"Navegar por las estrellas","contenido":["La Estrella Polar es única: apenas se mueve, porque está casi sobre el eje de rotación de la Tierra. Todo el cielo gira a su alrededor.","Su altura sobre el horizonte ES tu latitud: si la Polar está a 40° sobre el horizonte, estás en latitud 40° norte. Los navegantes antiguos la medían con el astrolabio y el cuadrante.","Encontrarla: Osa Mayor, las dos estrellas del borde del cazo (Merak y Dubhe); alarga cinco veces su separación y ahí brilla la Polar.","En el hemisferio sur, la Cruz del Sur: alargando su eje mayor cuatro veces y bajando en perpendicular, se encuentra el polo sur celeste.","Las estrellas salen 4 minutos antes cada noche: por eso el cielo cambia con las estaciones. 4 minutos × 365 días = las 24 horas de la vuelta anual. El cielo es un calendario gigante."],"quiz":[{"pregunta":"¿Qué dato da la altura de la Estrella Polar sobre el horizonte?","opciones":["La hora","Tu latitud","La previsión del tiempo"],"correcta":1,"porque":"Altura de la Polar = latitud norte. A 40° de altura, estás a 40° N."},{"pregunta":"¿Cómo se localiza la Polar?","opciones":["Es la más brillante","Prolongando el borde del carro de la Osa Mayor cinco veces","Mirando al este"],"correcta":1,"porque":"Merak y Dubhe señalan el camino: cinco veces su distancia."},{"pregunta":"¿Cuánto se adelantan las estrellas cada noche?","opciones":["1 minuto","Unos 4 minutos","15 minutos"],"correcta":1,"porque":"4 minutos diarios × 365 = un día entero: el cielo da la vuelta al año."}]},{"titulo":"Mapas y escalas","contenido":["Un mapa es una proporción. Escala 1:25.000 significa que 1 cm en el papel son 25.000 cm reales: 250 metros. La regla de tres, otra vez, gobernando el terreno.","Las curvas de nivel unen puntos a la misma altura. Juntas: pendiente fuerte. Separadas: terreno suave. En V apuntando hacia arriba: un valle; redondas cerradas: una cima.","Orientar el mapa: girar el papel hasta que lo que ves coincida con lo dibujado (o alinear la brújula con el norte del mapa). Mapa orientado, cabeza orientada.","Medir una ruta con curvas: usa un cordón sobre el camino del mapa y luego estíralo contra la regla. Los caminos reales nunca son rectas.","Calcula el tiempo de marcha: unos 4-5 km/h en llano; la regla de Naismith añade 1 hora por cada 600 m de desnivel acumulado. 10 km con 300 m de subida: unas 3 horas."],"quiz":[{"pregunta":"En un mapa 1:25.000, ¿cuánto son 4 cm en la realidad?","opciones":["100 m","1 km","10 km"],"correcta":1,"porque":"4 × 250 m = 1.000 m = 1 km."},{"pregunta":"Curvas de nivel muy juntas indican…","opciones":["Un llano","Una pendiente fuerte","Un río"],"correcta":1,"porque":"Mucha altura en poco papel: la ladera es empinada."},{"pregunta":"Regla de Naismith: 10 km con 600 m de subida. ¿Cuánto tiempo?","opciones":["2 horas","3 horas","5 horas"],"correcta":1,"porque":"2 h de llano (5 km/h) + 1 h por los 600 m de desnivel = 3 h."}]},{"titulo":"Coordenadas y GPS","contenido":["La Tierra tiene su propia retícula: latitud (paralelos, del ecuador a los polos, 0° a 90°) y longitud (meridianos, desde Greenwich, 0° a 180° este u oeste).","Cada grado se divide en 60 minutos y cada minuto en 60 segundos: herencia babilónica pura, la base 60 navegando todavía.","Un minuto de latitud son exactamente 1 milla náutica (1.852 m): las millas marinas nacieron de la geometría del planeta, no de un capricho.","El GPS que llevas en el bolsillo: tu móvil mide cuánto tardan en llegar las señales de varios satélites (a la velocidad de la luz) y triangula tu posición. Es trigonometría espacial con relojes atómicos.","Historia enorme: la longitud fue irresoluble durante siglos en el mar — sin reloj preciso, no hay longitud. El cronómetro de John Harrison (siglo XVIII) ganó el premio más famoso de la navegación y salvó incontables barcos."],"quiz":[{"pregunta":"¿Cuánto mide un minuto de latitud?","opciones":["1 km","1 milla náutica (1.852 m)","100 m"],"correcta":1,"porque":"La milla náutica se definió así: geometría terrestre directa."},{"pregunta":"¿Cómo calcula el GPS tu posición?","opciones":["Con brújula interna","Midiendo tiempos de señal de varios satélites y triangulando","Preguntando a antenas"],"correcta":1,"porque":"Distancia = velocidad de la luz × tiempo; con varias distancias, tu punto."},{"pregunta":"¿Qué problema resolvió el cronómetro de Harrison?","opciones":["La latitud","La longitud en el mar","Las mareas"],"correcta":1,"porque":"Comparando la hora de a bordo con la hora del puerto sale la longitud."}]},{"titulo":"Mareas, vientos y tiempo","contenido":["Las mareas siguen a la Luna: dos pleamares y dos bajamares al día, separadas unas 6 horas y 12 minutos. Cada día, las mareas se retrasan unos 50 minutos: el día lunar dura 24 h 50 min.","La regla de los doceavos (para mareas grandes): el agua sube 1/12 la primera hora, 2/12 la segunda, 3/12 la tercera y la cuarta, 2/12 la quinta y 1/12 la sexta. La marea no sube pareja: corre más a media subida.","El viento se nombra por DE DÓNDE viene, las corrientes por HACIA DÓNDE van. Viento del norte empuja hacia el sur. Confundirlos ha perdido barcos.","Leer el cielo: nubes altas y finas anuncian cambio en 24-36 h; cúmulos que crecen a torre por la tarde, tormenta. «Cielo rojo al atardecer, buen tiempo va a traer»: los frentes viajan de oeste a este.","La presión atmosférica lo resume: si el barómetro baja rápido, mal tiempo en camino; si sube, estabilidad. 1.013 hPa es el estándar; cada caída de 10 hPa es noticia meteorológica."],"quiz":[{"pregunta":"¿Cada cuánto hay una pleamar aproximadamente?","opciones":["Cada 6 horas justas","Cada 6 h 12 min","Cada 12 horas"],"correcta":1,"porque":"Dos pleamares en 24 h 50 min: cada 6 h 12 min aproximadamente."},{"pregunta":"Según la regla de los doceavos, ¿cuándo sube más rápido la marea?","opciones":["La primera hora","Las horas tercera y cuarta","La última hora"],"correcta":1,"porque":"3/12 + 3/12 en medio: la marea corre al centro del ciclo."},{"pregunta":"El «viento del norte» viene…","opciones":["Del norte","Hacia el norte","Del sur"],"correcta":0,"porque":"Los vientos se nombran por su origen; las corrientes, por su destino."}]}],"nivel":"medio"},{"id":"matematicas-filosoficas","titulo":"Matemáticas filosóficas","icono":"💭","lecciones":[{"titulo":"El infinito: el número que no es número","contenido":["El infinito no es un número muy grande: es otra categoría. A cualquier número le puedes sumar uno; por eso «el número más grande» no existe. El infinito es el horizonte que se aleja al caminar.","Cantor demostró en 1874 algo que aún duele: hay infinitos de distinto tamaño. Los números naturales (1, 2, 3...) son infinitos «contables». Los números reales (todos los decimales) son un infinito MAYOR: incontable.","Su prueba, la diagonal: supón que haces una lista de todos los decimales; Cantor construye uno nuevo cambiando la primera cifra del primero, la segunda del segundo... Ese número no está en tu lista. La lista nunca se completa. El infinito de los reales desborda al de los naturales.","Y el hotel de Hilbert: un hotel con infinitas habitaciones, lleno, aún admite un huésped más: basta mover al de la habitación 1 a la 2, el de la 2 a la 3... Siempre queda la 1 libre. Con infinitos huéspedes nuevos, igual: cada uno a la habitación doble.","Cantor pagó un precio: fue ridiculizado por colegas como Kronecker («nadie nos expulsará del paraíso que Cantor creó», respondió Hilbert en su defensa). Hoy sus infinitos son la base de las matemáticas. Pensar lo impensable cuesta, y vale."],"quiz":[{"pregunta":"¿Qué demostró Cantor en 1874?","opciones":["Que el infinito no existe","Que hay infinitos de distintos tamaños","Que π es finito"],"correcta":1,"porque":"Los reales son un infinito mayor que los naturales: la diagonal lo prueba."},{"pregunta":"El hotel infinito lleno recibe un huésped más. ¿Qué pasa?","opciones":["Se rechaza","Se mueve a cada uno una habitación y cabe","Se duerme en el pasillo"],"correcta":1,"porque":"1→2, 2→3, 3→4… la habitación 1 queda libre. El infinito absorbe."},{"pregunta":"¿Qué es la diagonal de Cantor?","opciones":["Una recta","Un número nuevo construido cambiando una cifra de cada número de la lista","Una tabla"],"correcta":1,"porque":"Difiere de cada número en alguna posición: no puede estar en la lista."}]},{"titulo":"¿Se inventan o se descubren las matemáticas?","contenido":["Es la pregunta filosófica más vieja de la materia. ¿Existía el teorema de Pitágoras antes de que nadie lo pensara, como una ley esperando en el universo? ¿O lo creamos nosotros, como el ajedrez?","Platón decía: se descubren. Los números y las formas viven en un mundo de ideas perfectas; nosotros solo las vislumbramos. El círculo perfecto no existe en la naturaleza y sin embargo lo conocemos.","Los formalistas responden: se inventan. Las matemáticas son un juego de símbolos con reglas elegidas por humanos; su belleza es nuestra, como la del idioma.","El dato incómodo para los inventores: las matemáticas «inventadas» por juego terminan describiendo la realidad décadas después. Los números imaginarios eran un truco algebraico y hoy sostienen la ingeniería eléctrica. Wigner lo llamó «la irrazonable eficacia de las matemáticas» (1960).","Quizá la respuesta sea ambas: inventamos los símbolos y descubrimos sus consecuencias. Como quien inventa las reglas de un juego y descubre, sorprendido, las partidas que esas reglas escondían."],"quiz":[{"pregunta":"¿Qué defendía Platón sobre las matemáticas?","opciones":["Que se inventan","Que se descubren en un mundo de ideas","Que son poesía"],"correcta":1,"porque":"Para Platón las formas matemáticas existen perfectas más allá de nosotros."},{"pregunta":"¿Qué es «la irrazonable eficacia de las matemáticas»?","opciones":["Un error de Wigner","El hecho de que ideas matemáticas abstractas describan luego la realidad física","Una fórmula"],"correcta":1,"porque":"Wigner, 1960: por qué la naturaleza obedece matemáticas hechas por juego es un misterio."},{"pregunta":"Los números imaginarios son un ejemplo de…","opciones":["Invención que terminó describiendo el mundo real","Números falsos","Un error histórico"],"correcta":0,"porque":"Nacieron como truco y hoy describen la electricidad y las ondas."}]},{"titulo":"La lógica y las paradojas","contenido":["La lógica es la matemática del razonamiento: si A implica B, y B implica C, entonces A implica C. Aristóteles la ordenó; Boole la convirtió en álgebra (1854); los ordenadores la ejecutan millones de veces por segundo.","Las paradojas son las fisuras donde la lógica muestra sus límites. La del mentiroso: «esta frase es falsa». Si es verdad, es falsa; si es falsa, es verdad. No hay salida limpia.","Russell, 1901: el conjunto de todos los conjuntos que no se contienen a sí mismos. ¿Se contiene? Si sí, no; si no, sí. Esta paradoja hizo temblar los cimientos de las matemáticas recién construidos.","La respuesta fue reconstruir con cuidado: teoría de conjuntos con reglas que prohíben esos monstruos. Las matemáticas, como las ciudades, se rehacen después del terremoto.","Lección humilde: ni siquiera el razonamiento más riguroso está libre de sorpresas. Las paradojas no son fallos vergonzosos: son los detectores de humo del pensamiento."],"quiz":[{"pregunta":"¿Qué dice la paradoja del mentiroso?","opciones":["Una frase que miente sobre otra","«Esta frase es falsa»: verdad y falsedad se persiguen sin fin","Un chiste"],"correcta":1,"porque":"Si es verdadera es falsa y viceversa: la autorreferencia rompe la dicotomía."},{"pregunta":"¿Qué hizo la paradoja de Russell (1901)?","opciones":["Nada importante","Tambalear los fundamentos de la teoría de conjuntos","Probar que 2+2=5"],"correcta":1,"porque":"El conjunto que se contiene si y solo si no se contiene: hubo que reconstruir los cimientos."},{"pregunta":"¿Quién convirtió la lógica en álgebra?","opciones":["Aristóteles","Boole (1854)","Russell"],"correcta":1,"porque":"El álgebra booleana es hoy el idioma de cada chip."}]},{"titulo":"Gödel: los límites de la demostración","contenido":["En 1900, Hilbert soñó en voz alta: encontrar un sistema completo y sin contradicciones desde el que probar toda verdad matemática. El programa más ambicioso de la historia del pensamiento.","En 1931, Kurt Gödel, de 25 años, lo demolió con elegancia: en cualquier sistema lo bastante potente para hablar de números, hay verdades que no se pueden demostrar dentro del sistema.","Su truco fue la autorreferencia matemática: construyó una frase que dice, en lenguaje de números, «esta frase no es demostrable». Si el sistema la demuestra, contradice; si no, es verdadera pero indemostrable.","Y más: ningún sistema así puede demostrar su propia consistencia. Las matemáticas no pueden certificarse a sí mismas del todo, como un ojo no se ve a sí mismo directamente.","La consecuencia filosófica es inmensa y discutida: la verdad es más ancha que la demostración. Hay verdades que solo se alcanzan asomándose desde fuera. Gödel no mató las matemáticas: les dio humildad y profundidad."],"quiz":[{"pregunta":"¿Qué demostró Gödel en 1931?","opciones":["Que 2+2=4","Que todo sistema potente tiene verdades indemostrables","Que las matemáticas son falsas"],"correcta":1,"porque":"El teorema de incompletitud: ningún sistema basta para toda la verdad."},{"pregunta":"¿Qué herramienta usó Gödel?","opciones":["La brújula","La autorreferencia traducida a números","La estadística"],"correcta":1,"porque":"Codificó frases como números y construyó «esta frase no es demostrable»."},{"pregunta":"¿Qué quiso decir Hilbert con su programa de 1900?","opciones":["Fundar una universidad","Un sistema completo y consistente para toda la matemática","Un código secreto"],"correcta":1,"porque":"Era el sueño de la certeza total: Gödel demostró que era inalcanzable."}]},{"titulo":"La belleza matemática","contenido":["Los matemáticos hablan de demostraciones «hermosas» como los músicos de melodías. ¿Qué las hace bellas? Brevedad, sorpresa, y la sensación de que no podía ser de otra manera.","Hardy escribió en 1940 «Apología de un matemático»: «la belleza es la primera prueba; no hay lugar permanente en el mundo para las matemáticas feas». Hardy presumía de que su trabajo no servía para nada; hoy la teoría de números que amaba protege tus mensajes.","La identidad de Euler — e^(iπ) + 1 = 0 — es la candidata eterna a fórmula más bella: cinco constantes fundamentales (e, i, π, 1, 0) unidas en una línea. Feynman la llamó «la joya».","La belleza también es guía de trabajo: los físicos persiguen ecuaciones elegantes porque, una y otra vez, la naturaleza ha resultado preferirlas. Dirac decía que la belleza en las ecuaciones es más importante que su ajuste al experimento… y le funcionó.","¿Y por qué nos parecen bellas? Quizá porque el patrón comprendido es placer antiguo: el cerebro que veía el patrón sobrevivía. La estética matemática podría ser el eco de nuestra evolución."],"quiz":[{"pregunta":"¿Qué une la identidad de Euler?","opciones":["Solo números pares","e, i, π, 1 y 0 en una sola igualdad","Sumas y restas"],"correcta":1,"porque":"e^(iπ) + 1 = 0: cinco constantes legendarias en equilibrio perfecto."},{"pregunta":"¿Qué decía Hardy sobre las matemáticas bellas?","opciones":["Que no servían para nada… y se equivocó","Que eran inútiles","Que eran feas"],"correcta":0,"porque":"Presumía de inutilidad; su teoría de números cifra hoy internet."},{"pregunta":"¿Qué papel juega la belleza en la física teórica?","opciones":["Ninguno","Guía: la naturaleza ha preferido una y otra vez las ecuaciones elegantes","Estorba"],"correcta":1,"porque":"Dirac anteponía la belleza al ajuste experimental, y acertó."}]}],"nivel":"avanzado"},{"id":"sabiduria-numeros","titulo":"Sabiduría y números: tradición judía y taoísmo","icono":"☯️","lecciones":[{"titulo":"La gematría: cuando las letras son números","contenido":["En hebreo no hay cifras aparte: cada letra es también un número. Alef = 1, Bet = 2, ..., Yod = 10, Kaf = 20... Toda palabra suma un valor. Esa lectura numérica de las palabras se llama gematría.","El ejemplo más querido: las letras de «jai» (vida) suman 18 (jet = 8, yod = 10). Por eso el 18 es el número de la buena suerte en la tradición judía: regalos y donativos se dan en múltiplos de 18.","La gematría busca conexiones: si dos palabras suman lo mismo, la tradición pregunta qué las une. Es un arte de interpretación, no una ciencia de predicción: un espejo para pensar el texto, no una máquina de destinos.","El mismo juego existió en griego (isopsefía) y existe en árabe (abyad). La idea de que letras y números sean una sola cosa era normal en el mundo antiguo: las cifras separadas llegaron tarde a todas partes.","Advertencia honesta: con 22 letras-números, casi cualquier par de palabras puede «conectar» si se busca con ahínco. La gematría enseña simbolismo y memoria; las decisiones de la vida, mejor con la aritmética de siempre."],"quiz":[{"pregunta":"¿Por qué el 18 es especial en la tradición judía?","opciones":["Por los profetas","Porque «jai» (vida) suma 18 en gematría","Por las tribus"],"correcta":1,"porque":"Jet (8) + yod (10) = 18: la palabra «vida» hecha número."},{"pregunta":"¿Qué es la gematría?","opciones":["Un sistema de medidas","La lectura numérica de las letras hebreas","Un calendario"],"correcta":1,"porque":"Cada letra hebrea tiene valor numérico; las palabras suman."},{"pregunta":"¿Qué actitud conviene ante las «conexiones» de la gematría?","opciones":["Creerlas todas","Tomarlas como arte simbólico, no como prueba","Prohibirlas"],"correcta":1,"porque":"Con letras-números las coincidencias llueven: es interpretación, no predicción."}]},{"titulo":"El calendario hebreo: la danza del sol y la luna","contenido":["El calendario judío es lunisolar: los meses siguen a la Luna (29-30 días) pero las fiestas deben caer en su estación solar. Problema: 12 lunas son 354 días, 11 menos que el año solar.","La solución es una joya aritmética: el ciclo metónico. En 19 años hay casi exactamente 235 lunas. Así que 7 de cada 19 años llevan un mes extra (Adar II) y 12 son normales. El desfase residual: unas 2 horas por ciclo.","¿Por qué 19? Porque es la mejor aproximación pequeña: 19 años solares ≈ 235 meses lunares con error de horas. Los babilonios lo sabían; Metón de Atenas lo describió en 432 a.C.; el calendario hebreo lo fijó por ley.","Cada año del ciclo tiene su posición: los años 3, 6, 8, 11, 14, 17 y 19 son «embolismales» (de 13 meses). Calcular si un año es bisiesto: módulo 19. El resto manda.","Resultado: la Pascua siempre cae en primavera y Rosh Hashaná en otoño, con la Luna gobernando los meses y el Sol gobernando los años. Dos astros, una sola aritmética."],"quiz":[{"pregunta":"¿Qué problema resuelve el ciclo metónico?","opciones":["Las mareas","Que 12 lunas son 11 días menos que el año solar","Los eclipses"],"correcta":1,"porque":"Sin meses extra, las fiestas vagarían por las estaciones."},{"pregunta":"¿Cuántos años de cada 19 llevan mes extra?","opciones":["4","7","12"],"correcta":1,"porque":"235 lunas = 19 años: 12×12 + 7×13 = 144 + 91 = 235. Las cuentas cierran."},{"pregunta":"¿Cómo se sabe si un año hebreo es bisiesto?","opciones":["Tirando una moneda","Por su resto al dividir entre 19","Por la cosecha"],"correcta":1,"porque":"Año módulo 19: si cae en 3, 6, 8, 11, 14, 17 o 19, lleva Adar II."}]},{"titulo":"Los ciclos del siete","contenido":["La tradición judía organiza el tiempo en sietes: seis días de trabajo y el séptimo de descanso. El sabbat no es una costumbre: es una aritmética del descanso, quizá la primera ley de horarios laborales de la historia.","El ciclo escala: cada siete años, la tierra descansa (shmitá, el año sabático: de ahí viene tu palabra «sabático»). Y siete ciclos de siete años (49) culminan en el año 50, el jubileo: liberación de esclavos y retorno de tierras.","Hay una matemática social profunda aquí: los ciclos impiden que la deuda y la propiedad se acumulen para siempre. El jubileo es un «reset» periódico del tablero económico, diseñado hace más de 2.500 años.","El 7 recorre el mundo: 7 días de la semana (herencia judía vía Roma), 7 notas musicales, 7 maravillas. Los babilonios lo amaban por los 7 astros visibles: sol, luna y cinco planetas.","La lección práctica es de calendario: los ciclos que no coinciden con el año (7 no divide a 365) crean festivales móviles y puentes variables. Cada vez que consultas «qué día cae este año», estás viendo la aritmética modular de la semana."],"quiz":[{"pregunta":"¿Qué es la shmitá?","opciones":["Una fiesta de cosecha","El año sabático: la tierra descansa cada siete años","Un mes lunar"],"correcta":1,"porque":"Ciclo de siete años; de «shmitá» viene nuestra palabra «sabático»."},{"pregunta":"¿Qué es el jubileo?","opciones":["El año 7","El año 50, tras siete ciclos de siete: liberación y retorno de tierras","Un aniversario de boda"],"correcta":1,"porque":"7 × 7 = 49; el año 50 reiniciaba deudas y esclavitudes: un reset social."},{"pregunta":"¿Por qué «qué día cae la fiesta» cambia cada año?","opciones":["Por capricho","Porque la semana de 7 no divide a los 365 días del año","Por la Luna"],"correcta":1,"porque":"365 = 52×7 + 1: cada año las fechas corren un día (dos en bisiestos)."}]},{"titulo":"El I Ching y el nacimiento del binario","contenido":["El I Ching («Libro de las mutaciones») es un oráculo chino de hace casi 3.000 años. Sus signos son líneas: enteras (yang) o partidas (yin). Seis líneas apiladas forman un hexagrama.","¿Cuántos hexagramas hay? Cada línea tiene 2 opciones, y son 6 líneas: 2 × 2 × 2 × 2 × 2 × 2 = 2⁶ = 64. El I Ching es, sin proponérselo, un sistema de numeración binaria de seis bits.","En 1701, el misionero Bouvet envió a Leibniz los diagramas del I Ching ordenados. Leibniz acababa de publicar el sistema binario (0 y 1) y quedó asombrado: los hexagramas leídos de abajo arriba eran los números 0 a 63 en binario.","Leibniz vio en ello una confirmación casi teológica: la creación desde la nada (todo desde 0 y 1, como el mundo desde el vacío). Hoy, ese mismo binario es el idioma de todos los ordenadores: cada foto, cada mensaje, cada canción son filas de yang y yin.","La lección no es que el I Ching «predijera» la informática, sino algo más sutil: la estructura de dos símbolos repetidos es universal. Quien ordena decisiones en pares — sí/no, línea entera/partida, 1/0 — está haciendo la misma matemática."],"quiz":[{"pregunta":"¿Cuántos hexagramas tiene el I Ching y por qué?","opciones":["36, por los años","64, porque son 6 líneas con 2 opciones cada una: 2⁶","100, por costumbre"],"correcta":1,"porque":"2⁶ = 64: es combinatoria pura, tres siglos antes de que nadie la llamara así."},{"pregunta":"¿Qué relación descubrió Leibniz en 1701?","opciones":["Que el I Ching predice el clima","Que los hexagramas ordenados son los números 0-63 en binario","Que China inventó el papel"],"correcta":1,"porque":"Yang = 1, yin = 0, leído de abajo arriba: el sistema binario ya dibujado."},{"pregunta":"¿Qué idioma hablan los ordenadores?","opciones":["Hexagramas","Binario: el mismo 0/1 que yang/yin","Latín"],"correcta":1,"porque":"Todo lo digital son decisiones de dos estados apiladas: la estructura del I Ching."}]},{"titulo":"Yin, yang y el equilibrio dinámico","contenido":["El símbolo del taijitu (el círculo blanco y negro) es una lección de geometría: dos mitades iguales que se abrazan en curva, cada una con una semilla de la otra. No es «bueno contra malo»: es complementariedad.","Matemáticamente es perfecto: simetría rotacional de 180°, dos áreas exactamente iguales, y la división no es una recta sino una curva en S: el equilibrio no es estático, es una frontera que ondula.","El punto de cada color dentro del otro enseña la idea clave del taoísmo: nada es puro. En el yang pleno ya germina el yin. Cuando algo llega a su máximo, empieza su transformación: «cuando la luna está llena, empieza a menguar».","El Tao Te Ching lo dice con números: «El Tao engendra el Uno. El Uno engendra el Dos. El Dos engendra el Tres. El Tres engendra los diez mil seres». Una cosmogonía que suena a sucesión matemática: la multiplicación de lo simple en lo inmenso.","Hay una lectura casi de física: los sistemas vivos se mantienen por equilibrio dinámico, no por rigidez. Temperatura corporal, presión, azúcar: todo se regula oscilando alrededor de un punto. El yin-yang es homeostasis dibujada 2.500 años antes del termostato."],"quiz":[{"pregunta":"¿Qué simetría tiene el taijitu?","opciones":["De espejo","Rotacional de 180° con dos áreas iguales","Ninguna"],"correcta":1,"porque":"Giras media vuelta y queda igual: equilibrio perfecto en movimiento."},{"pregunta":"¿Qué significa el punto de color contrario en cada mitad?","opciones":["Un error de dibujo","Que en cada principio germina el otro: nada es puro","Decoración"],"correcta":1,"porque":"Yang contiene la semilla de yin: la transformación empieza en el máximo."},{"pregunta":"«El Dos engendra el Tres; el Tres, los diez mil seres» sugiere…","opciones":["Una receta","Una sucesión: de lo simple a lo inmenso por multiplicación","Un inventario"],"correcta":1,"porque":"El Tao Te Ching describe la complejidad naciendo de lo mínimo: aritmética cósmica."}]},{"titulo":"El vacío que sirve: el cero del Tao","contenido":["El capítulo 11 del Tao Te Ching: «Treinta radios se unen en un cubo, pero es el hueco del centro lo que hace útil a la rueda. Se moldea barro para hacer una vasija, pero es el vacío interior lo que la hace útil».","Es la filosofía del wu (vacío, no-ser): lo que falta es lo que funciona. La puerta es el agujero en la pared; la ventana, el hueco; la habitación, el espacio entre muros.","Las matemáticas tienen su propio vacío: el cero. Y como el cubo de la rueda, parece nada y lo sostiene todo. Sin cero no hay valor posicional, no hay negativos, no hay álgebra moderna.","La historia conecta: el cero pleno nació en la India (donde el vacío, śūnyatā, era ya idea filosófica central del budismo, primo del wu taoísta). Brahmagupta lo trató como número completo en 628. Las culturas que habían pensado el vacío a fondo fueron las que pudieron contarlo.","Occidente tardó siglos más: el cero llegó con los números arábigos y hasta fue prohibido en alguna ciudad italiana por «facilitar fraudes» (un cero añadido lo cambia todo). El vacío siempre incomoda antes de volverse imprescindible."],"quiz":[{"pregunta":"¿Qué enseña la vasija del Tao Te Ching?","opciones":["Que el barro es caro","Que es el vacío interior lo que la hace útil","Que hay que romperla"],"correcta":1,"porque":"El wu: lo que falta es lo que sirve. Como el hueco del cubo en la rueda."},{"pregunta":"¿Qué número es el «vacío útil» de las matemáticas?","opciones":["El uno","El cero","El pi"],"correcta":1,"porque":"Parece nada y sostiene el valor posicional, los negativos y el álgebra."},{"pregunta":"¿Dónde nació el cero como número completo?","opciones":["En Grecia","En la India, donde el vacío ya era idea filosófica","En Egipto"],"correcta":1,"porque":"Brahmagupta, 628: la cultura de la śūnyatā pudo pensar la nada como número."}]}],"nivel":"avanzado"},{"id":"dinero","titulo":"El dinero","icono":"💰","lecciones":[{"titulo":"Conocer el dinero y los precios","contenido":["El dinero sirve para cambiarlo por cosas: comida, transporte, medicinas. Cada billete y moneda vale una cantidad distinta: míralos con calma y aprende a reconocerlos.","Los precios se escriben con el número y la moneda: 2,50 significa dos unidades y media. La parte después de la coma son las partes pequeñas (céntimos, centavos...).","Antes de comprar, compara: mira el precio en dos tiendas. El mismo producto puede costar distinto.","Ojo con las ofertas: «3 por 5» solo es buena si de verdad necesitas 3. Comprar de más por una oferta también es gastar de más."],"quiz":[{"pregunta":"¿Qué significa 2,50 en un precio?","opciones":["Doscientos cincuenta","Dos unidades y media","Veinticinco"],"correcta":1,"porque":"La coma separa las unidades enteras de las partes pequeñas."},{"pregunta":"¿Qué conviene hacer antes de comprar?","opciones":["Comprar en la primera tienda","Comparar precios","Pedir fiado siempre"],"correcta":1,"porque":"Comparar precios entre tiendas ayuda a pagar menos por lo mismo."},{"pregunta":"Una oferta «3 por 5» es buena cuando…","opciones":["Siempre","Solo si necesitas los 3","Nunca"],"correcta":1,"porque":"Si solo necesitas uno, comprar tres es gastar de más."}]},{"titulo":"Pagar y contar el cambio","contenido":["Si algo cuesta 7 y pagas con un billete de 10, te tienen que devolver 3. Eso es el cambio: lo que pagas menos lo que cuesta.","Cuenta el cambio siempre antes de salir de la tienda. No es desconfianza, es cuidado. Todo el mundo se equivoca alguna vez.","Cuenta en voz baja: «cuesta 7, doy 10, me faltan 3». Si te dan monedas, súmalas despacio.","Si el cambio no cuadra, dilo con educación pero con firmeza: «Creo que me faltan 2». Es tu derecho."],"quiz":[{"pregunta":"Cuesta 7 y pagas con 10. ¿Cuál es el cambio?","opciones":["2","3","7"],"correcta":1,"porque":"10 − 7 = 3."},{"pregunta":"¿Cuándo hay que contar el cambio?","opciones":["En casa, luego","Antes de salir de la tienda","Nunca"],"correcta":1,"porque":"Si hay un error, dentro de la tienda se arregla enseguida."},{"pregunta":"Si el cambio no cuadra, ¿qué haces?","opciones":["Callarme e irme","Decirlo con educación y firmeza","Discutir a gritos"],"correcta":1,"porque":"Reclamar con calma es un derecho y suele resolverlo todo."}]},{"titulo":"Organizar el dinero de la semana","contenido":["Antes de gastar, apunta: ¿cuánto dinero entra y cuándo? ¿Qué gastos fijos hay? Comida, transporte, luz, medicinas van primero.","Un truco sencillo: separa el dinero en montones o sobres. Uno para comida, otro para transporte, otro para lo inesperado.","Guarda aunque sea poco. Una moneda cada día no parece nada, pero al final del mes es un colchón para emergencias.","La regla de oro: no gastes dinero que todavía no tienes. Las deudas crecen solas; el ahorro también."],"quiz":[{"pregunta":"¿Qué gastos van primero?","opciones":["Los caprichos","Comida, transporte y medicinas","Los regalos"],"correcta":1,"porque":"Primero lo necesario para vivir; lo demás espera."},{"pregunta":"¿Para qué sirve separar el dinero en sobres?","opciones":["Para no saber cuánto hay","Para no gastar lo de comida en otra cosa","Para esconderlo"],"correcta":1,"porque":"Cada sobre tiene su misión y así no se mezclan los gastos."},{"pregunta":"¿Cuál es la regla de oro?","opciones":["Gastar hoy y pagar mañana","No gastar dinero que aún no tienes","Pedir prestado siempre"],"correcta":1,"porque":"Gastar por adelantado crea deudas que crecen solas."}]},{"titulo":"Cuidado con las trampas","contenido":["Nadie regala dinero. Si algo suena demasiado bueno — premios que no pediste, negocios que doblan el dinero en una semana — es una trampa.","Nunca des claves, contraseñas ni números de tarjeta por teléfono o mensaje, aunque digan que son del banco. El banco de verdad nunca los pide así.","No firmes papeles que no entiendas. Pide tiempo, llévalos a casa y que te los explique alguien de confianza. Firmar sin entender es peligroso.","Si te presionan para decidir ya — «solo hoy», «última oportunidad» — esa prisa es la señal de alarma. Lo bueno puede esperar un día."],"quiz":[{"pregunta":"Te llaman «del banco» pidiendo tu contraseña. ¿Qué haces?","opciones":["Dársela","No darla y colgar","Dar solo la mitad"],"correcta":1,"porque":"El banco de verdad nunca pide claves por teléfono. Es una estafa."},{"pregunta":"¿Qué haces con un papel que no entiendes?","opciones":["Firmarlo rápido","Pedir tiempo y que alguien lo explique","Tirarlo"],"correcta":1,"porque":"Nunca se firma sin entender. Pedir ayuda es de listos, no de tontos."},{"pregunta":"«Solo hoy, última oportunidad» suele ser…","opciones":["Una gran ocasión","Una señal de alarma","Obligatorio aprovecharlo"],"correcta":1,"porque":"La prisa artificial es el truco favorito de quien quiere engañarte."}]}],"nivel":"basico"},{"id":"salud","titulo":"La salud","icono":"❤️","lecciones":[{"titulo":"Higiene: la primera medicina","contenido":["Lavarse las manos con jabón es la medicina más barata del mundo. Antes de comer, después del baño, al volver de la calle.","El jabón y 20 segundos (contar despacio hasta veinte) quitan los microbios que causan diarreas y resfriados.","Los dientes se lavan dos veces al día, dos minutos. Un diente enfermo duele, cuesta caro y se pierde; cuidarlo es gratis.","El agua que se bebe debe ser segura. Si hay dudas, hervirla un minuto mata los microbios."],"quiz":[{"pregunta":"¿Cuánto tiempo hay que lavarse las manos?","opciones":["3 segundos","Unos 20 segundos con jabón","Una hora"],"correcta":1,"porque":"Veinte segundos con jabón bastan para quitar los microbios."},{"pregunta":"¿Cuántas veces al día se lavan los dientes?","opciones":["Dos veces","Una al mes","Solo si duelen"],"correcta":0,"porque":"Dos veces al día evita caries y dolores caros."},{"pregunta":"Si el agua no es segura, ¿qué se hace?","opciones":["Beberla igual","Hervirla un minuto","Mezclarla con refresco"],"correcta":1,"porque":"Hervir el agua un minuto mata los microbios peligrosos."}]},{"titulo":"Las medicinas: cómo tomarlas bien","contenido":["Las medicinas curan si se toman como dice el médico: la cantidad justa, a la hora justa, los días justos.","Nunca tomes la medicina de otra persona, aunque tenga el mismo dolor. Lo que a uno le cura a otro le puede hacer daño.","Si el médico dice «7 días», son 7 días, aunque al tercero ya te encuentres bien. Dejarlo antes hace que la enfermedad vuelva más fuerte.","Mira la fecha de caducidad. Una medicina caducada puede no curar o hacer daño. Guárdalas lejos de los niños y del calor."],"quiz":[{"pregunta":"¿Puedes tomar la medicina de un vecino con el mismo dolor?","opciones":["Sí, es lo mismo","No, nunca","Solo media pastilla"],"correcta":1,"porque":"Cada medicina es para la persona y la enfermedad que recetó el médico."},{"pregunta":"El tratamiento es de 7 días y al tercero estás bien. ¿Qué haces?","opciones":["Dejarlo","Terminar los 7 días","Guardar el resto para otra vez"],"correcta":1,"porque":"Cortar antes deja vivos a los microbios más fuertes y la enfermedad vuelve."},{"pregunta":"¿Dónde se guardan las medicinas?","opciones":["Al alcance de los niños","Lejos de niños y del calor","En la cocina, al sol"],"correcta":1,"porque":"Los niños pueden tomarlas por error y el calor las estropea."}]},{"titulo":"Cuándo ir al médico","contenido":["Algunas señales no deben esperar: fiebre alta que no baja, dificultad para respirar, dolor fuerte en el pecho, heridas que no dejan de sangrar.","En los niños: no quieren comer ni beber, están muy dormidos, vomitan todo, o tienen fiebre alta. Con esas señales, al médico sin esperar.","Ir al médico pronto no es de débiles: es más barato y más fácil curar algo pequeño que algo grande.","Lleva apuntados los síntomas: desde cuándo, qué duele, qué medicinas tomaste. Ayuda mucho al médico."],"quiz":[{"pregunta":"Fiebre alta que no baja. ¿Qué toca?","opciones":["Esperar una semana","Ir al médico","Tomar café"],"correcta":1,"porque":"La fiebre alta persistente es una señal de alarma."},{"pregunta":"Un niño no quiere beber y está muy dormido. ¿Qué haces?","opciones":["Dejarlo descansar","Llevarlo al médico sin esperar","Darle dulces"],"correcta":1,"porque":"En niños, rechazar líquidos y estar muy dormido son señales graves."},{"pregunta":"¿Qué conviene llevar apuntado al médico?","opciones":["Nada, él lo adivina","Síntomas, desde cuándo y qué tomaste","Solo el dinero"],"correcta":1,"porque":"Esa información ayuda al médico a acertar antes."}]}],"nivel":"basico"},{"id":"tiempo","titulo":"El tiempo y el calendario","icono":"🕐","lecciones":[{"titulo":"Leer la hora","contenido":["El día tiene 24 horas. El reloj de agujas da dos vueltas al día: la mañana y la tarde-noche.","La aguja corta marca la hora; la larga marca los minutos. Si la corta está en el 3 y la larga en el 12, son las 3 en punto.","Cada número de la esfera son 5 minutos: la larga en el 1 son 5 minutos, en el 2 son 10, en el 6 son 30 (la media), en el 12 son 00 (en punto).","«Y cuarto» son 15 minutos, «y media» son 30. Las 4 y cuarto = 4:15. Las 4 y media = 4:30."],"quiz":[{"pregunta":"¿Qué marca la aguja corta?","opciones":["Los minutos","La hora","Los segundos"],"correcta":1,"porque":"La aguja corta señala la hora; la larga, los minutos."},{"pregunta":"La aguja larga en el 6 significa…","opciones":["6 minutos","30 minutos","La hora en punto"],"correcta":1,"porque":"Cada número son 5 minutos: 6 × 5 = 30."},{"pregunta":"«Las 4 y cuarto» son las…","opciones":["4:04","4:15","4:30"],"correcta":1,"porque":"Un cuarto de hora son 15 minutos."}]},{"titulo":"Los días, los meses y las citas","contenido":["La semana tiene 7 días: lunes, martes, miércoles, jueves, viernes, sábado y domingo.","El año tiene 12 meses: enero, febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, octubre, noviembre y diciembre.","Las fechas se escriben día / mes / año: 37/269/807 es el 5 de marzo de 2026. Ojo: primero el día, luego el mes.","Para no olvidar una cita: apúntala el mismo día que te la den — en el calendario del móvil o en papel — con la hora y el lugar. Y mírala cada mañana."],"quiz":[{"pregunta":"¿Cuántos meses tiene el año?","opciones":["10","12","7"],"correcta":1,"porque":"Doce meses, de enero a diciembre."},{"pregunta":"37/269/807 es…","opciones":["3 de mayo de 2026","5 de marzo de 2026","5 de marzo de 2003"],"correcta":1,"porque":"En España y Latinoamérica: primero el día, luego el mes, luego el año."},{"pregunta":"¿Cuándo hay que apuntar una cita?","opciones":["El día antes","El mismo día que te la den","No hace falta apuntarla"],"correcta":1,"porque":"Apuntarla en el momento evita olvidos; luego la memoria falla."}]}],"nivel":"basico"},{"id":"movil","titulo":"El móvil","icono":"📱","lecciones":[{"titulo":"Llamadas y mensajes","contenido":["Para llamar: abre la aplicación del teléfono, marca el número o busca el contacto, y pulsa el botón verde.","Guarda los números importantes como contactos con su nombre: familia, médico, emergencias. Así no hay que memorizarlos.","Los mensajes de texto (SMS) llegan sin internet. Sirven cuando no hay datos: escribe corto y claro.","Si llamas a emergencias, di primero DÓNDE estás: calle, número, pueblo. Luego qué pasa. Habla despacio y no cuelgues hasta que te lo digan."],"quiz":[{"pregunta":"¿Cómo se guardan los números importantes?","opciones":["En la memoria","Como contactos con su nombre","En un papel que se pierde"],"correcta":1,"porque":"Guardarlos con nombre evita memorizar y marcar mal."},{"pregunta":"¿Qué funciona sin internet?","opciones":["Los SMS y las llamadas","Los vídeos","Las redes sociales"],"correcta":0,"porque":"Llamadas y SMS van por la red de telefonía, no por internet."},{"pregunta":"En una llamada de emergencia, ¿qué se dice primero?","opciones":["Tu nombre completo","Dónde estás","Qué hora es"],"correcta":1,"porque":"Lo más urgente es que sepan dónde ir; luego se explica qué pasa."}]},{"titulo":"Seguridad: tu móvil, tus reglas","contenido":["Pon un bloqueo al móvil: patrón, PIN o huella. Si lo pierdes, nadie podrá ver tus fotos ni tus cosas.","No pulses enlaces de mensajes de desconocidos, aunque prometan premios. Son la trampa más común.","Desconfía de mensajes urgentes de «un familiar» pidiendo dinero desde un número nuevo. Antes de enviar nada, llama a ese familiar a su número de siempre.","Las fotos y mensajes que envías ya no son solo tuyos: pueden copiarse. No envíes nada que no querrías enseñar a todo el pueblo."],"quiz":[{"pregunta":"¿Por qué poner bloqueo al móvil?","opciones":["Para que gaste menos batería","Para que nadie vea tus cosas si lo pierdes","No hace falta"],"correcta":1,"porque":"El bloqueo protege fotos, mensajes y datos si el móvil cae en otras manos."},{"pregunta":"Un «familiar» pide dinero desde un número nuevo. ¿Qué haces?","opciones":["Enviarlo rápido","Llamar al número de siempre para comprobar","Enviar la mitad"],"correcta":1,"porque":"Es la estafa más común: siempre se comprueba llamando al número conocido."},{"pregunta":"Un enlace de un desconocido que promete un premio…","opciones":["Se abre rápido","Es casi seguro una trampa","Se reenvía a amigos"],"correcta":1,"porque":"Los premios no pedidos son el cebo favorito de los estafadores."}]}],"nivel":"basico"},{"id":"papeles","titulo":"Papeles y derechos","icono":"📄","lecciones":[{"titulo":"Tus documentos","contenido":["Tu documento de identidad dice quién eres. Guárdalo bien y lleva siempre encima una copia o el original, según la costumbre del país.","Guarda en un lugar seguro y conocido los papeles importantes: identidad, partidas de nacimiento, papeles de la vivienda, papeles médicos.","Haz copias de todo — en papel o foto en el móvil — y guárdalas aparte. Si se pierde el original, la copia salva muchos problemas.","Apunta o memoriza tu número de documento. Se pide en bancos, médicos y trámites."],"quiz":[{"pregunta":"¿Dónde se guardan los papeles importantes?","opciones":["Tirados por casa","En un lugar seguro y conocido","En el bolsillo siempre"],"correcta":1,"porque":"Un solo lugar seguro evita pérdidas y sustos."},{"pregunta":"¿Para qué sirven las copias o fotos de los documentos?","opciones":["Para nada","Para salvar problemas si se pierde el original","Para tirarlas"],"correcta":1,"porque":"Con una copia, reponer el original es mucho más fácil."},{"pregunta":"¿Qué número conviene memorizar?","opciones":["El de la lotería","El de tu documento de identidad","Ninguno"],"correcta":1,"porque":"Se pide en bancos, médicos y casi todos los trámites."}]},{"titulo":"Antes de firmar","contenido":["Una firma es una promesa con valor legal. Lo que firmas, lo cumples, aunque no lo hayas leído. Por eso: nunca firmes sin entender.","Lee despacio. Si hay palabras que no entiendes, pregunta. Preguntar es gratis; firmar a ciegas puede costar carísimo.","Pide siempre una copia de lo que firmas. Es tu derecho y te lo tienen que dar.","Si te meten prisa para firmar, desconfía. Los papeles serios aguantan una noche de pensarlo."],"quiz":[{"pregunta":"¿Qué es una firma?","opciones":["Un garabato","Una promesa con valor legal","Un adorno"],"correcta":1,"porque":"Firmar obliga a cumplir lo que dice el papel, lo hayas leído o no."},{"pregunta":"¿Qué haces si no entiendes una palabra del papel?","opciones":["Firmar igual","Preguntar antes de firmar","Rasparla"],"correcta":1,"porque":"Preguntar es gratis y es tu derecho entender lo que firmas."},{"pregunta":"Después de firmar, ¿qué pides?","opciones":["Nada","Una copia","Un regalo"],"correcta":1,"porque":"La copia es tu prueba de lo que firmaste. Te corresponde."}]}],"nivel":"basico"},{"id":"rcp","titulo":"RCP y primeros auxilios: salvar una vida","icono":"❤️‍🩹","lecciones":[{"titulo":"RCP paso a paso: la cadena que salva","contenido":["La RCP (reanimación cardiopulmonar) mantiene la sangre fluyendo al cerebro cuando el corazón se para. La cadena de supervivencia tiene cuatro eslabones: reconocer y llamar al 112, RCP precoz, desfibrilación rápida y cuidados hospitalarios. Los tres primeros dependen de ti: el ciudadano es el primer eslabón.","Paso a paso: primero comprueba que la zona es segura. Toca los hombros y grita: ¿estás bien? Si no responde, grita pidiendo ayuda y que llamen al 112 (o llama tú con el manos libres). Mira el pecho 10 segundos: si no respira o solo hace gasping (bocanadas raras), empieza ya. El gasping no es respirar.","Las compresiones: talón de una mano en el centro del pecho, la otra encima, brazos rectos, hombros sobre las manos. Hunde 5-6 cm, a ritmo de 100-120 por minuto (la canción 'Stayin' Alive' marca el paso). Sin parar: cada pausa vacía la presión. Si sabes y quieres: 30 compresiones y 2 ventilaciones; si no, solo compresiones, que ya es oro.","Reto: practica la posición de las manos y el ritmo sobre un cojín firme: cien compresiones contadas en voz alta. El músculo que aprende hoy, actúa mañana."],"quiz":[{"pregunta":"¿Cuáles son los cuatro eslabones de la cadena de supervivencia?","opciones":["Llamar al 112, RCP precoz, desfibrilación rápida y hospital","Esperar, mirar, llorar, rezar","Agua, azúcar y abanico"],"correcta":0,"porque":"Los tres primeros dependen del testigo: el ciudadano es el primer eslabón de la cadena."},{"pregunta":"¿Qué es el gasping y qué se hace ante él?","opciones":["Bocanadas raras que NO son respirar: se empieza la RCP igualmente","Respiración normal","Un estornudo"],"correcta":0,"porque":"El gasping engaña: si no responde y no respira normal, compresiones ya."},{"pregunta":"¿Cómo son las compresiones correctas?","opciones":["Centro del pecho, 5-6 cm de fondo, 100-120 por minuto, sin parar","Suaves para no dañar","En la tripa"],"correcta":0,"porque":"Fuerte y rápido en el centro: romper una costilla cura; un cerebro sin sangre, no."}]},{"titulo":"El desfibrilador (DESA): la máquina amiga","contenido":["El desfibrilador semiautomático (DESA) es la máquina amarilla o verde de aeropuertos, gimnasios y centros comerciales. Está hecha para que la use cualquiera: se abre, habla en español y guía paso a paso. Analiza el ritmo del corazón y solo descarga si hace falta: no se puede descargar por error a alguien que no lo necesita.","Cómo se usa: RCP en marcha, alguien trae el DESA, se enciende, se pegan los dos parches en el pecho desnudo (uno arriba a la derecha, otro en el lado izquierdo, como dibuja la propia máquina), todos se apartan cuando analiza ('no toquen al paciente') y, si lo indica, se pulsa el botón de descarga. Luego, más RCP: la máquina manda.","Cada minuto sin desfibrilar baja la supervivencia un 10%; con RCP inmediata y DESA en 3-5 minutos, las probabilidades de salvar a una persona con parada se multiplican por diez. Por eso los DESA cuelgan de las paredes como extintores: son el extintor del corazón.","Reto: busca hoy el DESA más cercano a tu casa y a tu trabajo (hay aplicaciones que los mapean). En la emergencia, saber dónde está vale minutos, y los minutos valen vidas."],"quiz":[{"pregunta":"¿Quién puede usar un DESA?","opciones":["Cualquiera: habla y guía paso a paso, y no descarga si no hace falta","Solo médicos","Solo con curso"],"correcta":0,"porque":"Está diseñado para el ciudadano: analiza solo y solo descarga si el corazón lo necesita."},{"pregunta":"¿Dónde se pegan los parches del DESA?","opciones":["Uno arriba a la derecha del pecho y otro en el lado izquierdo","En la espalda","En las piernas"],"correcta":0,"porque":"El propio parche trae el dibujo: la máquina no deja lugar a la duda."},{"pregunta":"¿Cuánto baja la supervivencia por cada minuto sin desfibrilar?","opciones":["Un 10% por minuto","Nada","Un 1%"],"correcta":0,"porque":"Por eso el DESA cuelga como un extintor: los minutos de un testigo valen vidas."}]},{"titulo":"Atragantamientos, atragantamiento y otras urgencias","contenido":["El atragantamiento parcial (la persona tose fuerte): anímala a toser, no hagas nada más: la tos es más potente que cualquier maniobra. El atragantamiento total (no puede toser ni hablar, se lleva las manos al cuello): 5 golpes en la espalda con el talón de la mano, entre los omóplatos, inclinando a la persona hacia delante; si no sale, 5 compresiones abdominales (maniobra de Heimlich: puño sobre el ombligo, hacia dentro y arriba).","La hemorragia grave se para con presión: gasa o paño, presión directa fuerte y sostenida, y subir la extremidad si se puede. El torniquete solo como último recurso en sangrados de extremidades que no ceden (y anotando la hora). El infarto (dolor opresivo en el pecho, sudor frío, falta de aire): 112 inmediato, persona en reposo semiincorporada, ropa floja. Nunca conducirla tú si puede venir la ambulancia.","El ictus se reconoce con la prueba rápida: pide que sonría (¿la cara está torcida?), que levante los dos brazos (¿uno cae?), que diga una frase (¿habla raro?). Un fallo = 112 y anota la hora del inicio: el tratamiento del ictus es una carrera contra el reloj y la hora decide qué tratamientos caben.","Reto: ensaya la maniobra de Heimlich en el aire con alguien de la familia: posición de las manos, dirección del empuje. Ensayar sin urgencia es lo que permite actuar con urgencia."],"quiz":[{"pregunta":"¿Qué se hace si alguien se atraganta pero tose fuerte?","opciones":["Animarle a toser y nada más: la tos es la mejor maniobra","Golpes en la espalda","Meter los dedos"],"correcta":0,"porque":"La tos efectiva expulsa sola: interferir solo estorba. Si deja de toser, entonces se actúa."},{"pregunta":"¿Cómo va la maniobra ante un atragantamiento total?","opciones":["5 golpes en la espalda inclinado hacia delante, luego 5 compresiones abdominales","Darle agua","Ponerlo boca abajo"],"correcta":0,"porque":"Golpes primero, Heimlich después, alternando hasta que salga o llegue ayuda."},{"pregunta":"¿Cómo se reconoce un ictus en 10 segundos?","opciones":["Sonrisa torcida, un brazo que cae, habla rara: un fallo es 112","Dolor de espalda","Estornudos"],"correcta":0,"porque":"Cara, brazos, habla: la prueba rápida que salva cerebros. Y anota la hora: decide el tratamiento."}]}],"nivel":"medio","adultos":false},{"id":"naturaleza","titulo":"Naturaleza: leer el mundo vivo","icono":"🌿","lecciones":[{"titulo":"Leer el paisaje: cómo funciona la naturaleza","contenido":["La naturaleza es un sistema de ciclos: el agua se evapora, llueve, corre al mar y vuelve; el carbono viaja entre plantas, aire y suelo; la energía entra del sol y pasa de la hierba al conejo y del conejo al zorro. Nada se pierde: todo se transforma. Entender los ciclos es entender por qué tirar algo 'fuera' es un mito: no hay ningún fuera.","El ecosistema es la comunidad: cada especie tiene su oficio (productores como las plantas, consumidores, descomponedores como hongos y bacterias) y la red aguanta mientras no falten piezas clave. Quitar los depredadores o los polinizadores desordena todo lo demás: la naturaleza es un reloj, no un montón de piezas.","La biodiversidad es el seguro de vida del planeta: cuantas más especies, más resistente es el sistema a las plagas, las sequías y los cambios. El monocultivo es frágil; el bosque mezclado, resistente. Lo mismo vale para el jardín: la variedad es salud.","Reto: en tu próximo paseo, identifica un productor, un consumidor y un descomponedor. Mirar con esas gafas convierte el campo en un libro abierto."],"quiz":[{"pregunta":"¿Qué son los ciclos de la naturaleza?","opciones":["El agua, el carbono y la energía viajando sin perderse: nada se pierde, todo se transforma","Las estaciones solamente","Los relojes de los animales"],"correcta":0,"porque":"El agua y el carbono circulan: por eso no existe tirar 'fuera': todo sigue dentro del sistema."},{"pregunta":"¿Qué oficios hay en un ecosistema?","opciones":["Productores, consumidores y descomponedores","Jefes y empleados","Solo animales"],"correcta":0,"porque":"Las plantas fabrican, los animales comen, los hongos y bacterias reciclan: el reloj completo."},{"pregunta":"¿Por qué importa la biodiversidad?","opciones":["Porque más especies hacen el sistema más resistente a plagas y sequías","Por estética","No importa"],"correcta":0,"porque":"La variedad es el seguro: el bosque mezclado aguanta lo que tumba al monocultivo."}]},{"titulo":"Plantas y árboles: los pulmones pacientes","contenido":["Las plantas son las únicas fábricas que comen luz: la fotosíntesis toma CO2 y agua y fabrica azúcar y oxígeno. Todo lo que comes (tú, la vaca, el pez) es luz solar empaquetada por una planta o alga. El oxígeno que respiras ahora mismo salió de una hoja.","Los árboles son ingenieros del clima: dan sombra que enfría 5-10 °C, retienen agua de lluvia, filtran aire y alojan cientos de especies. Un roble adulto es un condominio de insectos, pájaros, hongos y líquenes. Por eso plantar árboles bien elegidos (autóctonos, en el sitio adecuado) es la inversión ecológica más rentable.","Cultivar algo enseña más biología que un libro: la semilla necesita agua, luz y temperatura; la tierra viva (con lombrices y materia orgánica) se fabrica con compost; y el riego por la mañana temprano pierde menos agua que al mediodía. Un tiesto con lechugas es un laboratorio.","Reto: planta algo comestible esta semana (unas lechugas, un perejil, unas habas según la época). Comer lo que viste germinar cambia la relación con la comida."],"quiz":[{"pregunta":"¿Qué hace la fotosíntesis?","opciones":["Convierte luz, CO2 y agua en azúcar y oxígeno","Absorbe oxígeno de noche solamente","Colorea las hojas"],"correcta":0,"porque":"Toda la comida del mundo es luz solar empaquetada: las plantas son la base de la pirámide."},{"pregunta":"¿Cuánto puede enfriar la sombra de un árbol?","opciones":["Entre 5 y 10 grados la zona que cubre","Nada","Medio grado"],"correcta":0,"porque":"El árbol es el aire acondicionado original: sombra, evaporación y cobijo para cientos de especies."},{"pregunta":"¿Cuándo conviene regar las plantas?","opciones":["A primera hora de la mañana: se pierde menos agua por evaporación","Al mediodía","De noche siempre"],"correcta":0,"porque":"Regar al sol desperdicia agua y puede quemar hojas: la mañana temprana es la hora del hortelano."}]},{"titulo":"El agua y el clima: el tiempo y el planeta","contenido":["El agua dulce es un tesoro escaso: solo el 2,5% del agua del planeta es dulce y casi toda está congelada o bajo tierra; el grifo llega de un 0,3% de ríos y lagos. España es un país seco con sed de país rico: el ahorro doméstico (cisternas de doble botón, duchas cortas, riego de noche) no es tacañería: es geografía.","El tiempo es lo que pasa hoy; el clima, el promedio de décadas. El cambio climático es el clima moviéndose: olas de calor más largas, lluvias más torrenciales, el mar subiendo. La ciencia lo mide con termómetros, satélites y testigos de hielo: la atmósfera tiene un 50% más de CO2 que antes de la industria, y ese gas es una manta.","Qué puede una persona: las tres R ordenadas por valor: reducir (consumir menos es lo que más vale), reutilizar (la segunda vida de las cosas) y reciclar (la última opción, no la primera). Y las decisiones grandes: cómo te mueves, qué comes y cómo calientas tu casa pesan mil veces más que la pajita.","Reto: mide tu huella de una semana: duchas, carne, coche. Un solo número medido enseña más que cien noticias."],"quiz":[{"pregunta":"¿Cuánta del agua del planeta es dulce y accesible?","opciones":["Un 0,3% de ríos y lagos: el resto es salada, hielo o subterránea","La mitad","El 90%"],"correcta":0,"porque":"El grifo parece infinito y es un hilo fino: el ahorro doméstico es geografía aplicada."},{"pregunta":"¿Qué diferencia hay entre tiempo y clima?","opciones":["El tiempo es lo de hoy; el clima, el promedio de décadas","Son lo mismo","El clima es de ayer"],"correcta":0,"porque":"Un día frío no niega el calentamiento: el clima es la tendencia larga, no el titular de mañana."},{"pregunta":"¿Qué orden tienen las tres R?","opciones":["Reducir, reutilizar, reciclar: en ese orden de valor","Reciclar primero","Da igual"],"correcta":0,"porque":"Reciclar es la última opción, no la primera: lo que no se compra no hay que reciclarlo."}]}],"nivel":"basico","adultos":false},{"id":"geografia","titulo":"Geografía: el mapa del mundo","icono":"🗺️","lecciones":[{"titulo":"El mapa del mundo: continentes, mares y coordenadas","contenido":["La Tierra tiene siete continentes (o seis, según la escuela) y un solo océano con cinco nombres. Europa es pequeña pero densa; Asia, el gigante; África, el continente que cabe tres veces Estados Unidos y aún sobra: los mapas clásicos (Mercator) engordan el norte y achican el ecuador, y han deformado nuestra idea del mundo durante siglos.","Las coordenadas son el DNI de cualquier punto: la latitud (paralelos, del ecuador a los polos) dice cuánto al norte o sur; la longitud (meridianos, desde Greenwich) cuánto al este u oeste. España vive entre los 36° y 44° norte: la misma latitud de Nueva York, pero con clima mediterráneo gracias al mar.","Los mapas mienten por definición: no se puede aplanar una esfera sin estirar algo. Por eso hay proyecciones para cada uso y por eso conviene mirar un globo de vez en cuando: Rusia no es tan gigante ni Groenlandia tan enorme como pintan los mapas de pared.","Reto: busca tu casa en un mapa y anota sus coordenadas. Luego busca qué otros lugares del mundo comparten tu latitud: suele sorprender."],"quiz":[{"pregunta":"¿Qué hace la proyección de Mercator con los tamaños?","opciones":["Engorda el norte y achica el ecuador: deforma nuestra idea del mundo","L
