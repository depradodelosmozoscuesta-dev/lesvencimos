erna que no para de correr: la boya mal regulada o la junta del mecanismo: piezas de euros que ahorran litros al día.","Desatascar sin química agresiva: primero el desatascador de ventosa con agua cubriendo la goma, luego bicarbonato y vinagre con agua caliente, y como último recurso la varilla. Los químicos fuertes dañan tuberías viejas y son malos para todo lo demás. Los pelos se previenen con una rejilla de euros.","Reto: revisa debajo de cada grifo de casa: ¿hay goteo, humedad, óxido? Detectar una fuga pequeña hoy evita la inundación de mañana."],"quiz":[{"pregunta":"¿Qué es lo primero ante cualquier fuga de agua?","opciones":["Cerrar la llave de paso","Llamar al seguro","Poner un cubo y esperar"],"correcta":0,"porque":"Cortar el agua detiene el daño; todo lo demás viene después."},{"pregunta":"¿Qué suele fallar en un grifo que gotea?","opciones":["La junta o el cartucho cerámico","La cañería entera","El fregadero"],"correcta":0,"porque":"Una pieza de pocos euros y diez minutos de llave inglesa: la avería más agradecida de la casa."},{"pregunta":"¿Qué orden sigue un desatasco casero?","opciones":["Ventosa, luego bicarbonato y vinagre, y como último recurso la varilla","Químico fuerte primero","Golpear la tubería"],"correcta":0,"porque":"De lo suave a lo fuerte: la mayoría de los atascos ceden con la ventosa bien usada."}]},{"titulo":"Pintar como un profesional","contenido":["El 80% de una pintura buena es preparación: limpiar la pared, tapar agujeros, lijar lo suelto, proteger con cinta de carrocero los marcos y cubrir el suelo. La pintura sobre suciedad o polvo se despega: la pereza en la preparación se paga en el resultado.","La técnica: primero los bordes y esquinas con brocha (la famosa 'cortina'), luego el rodillo en W sin recargar, sin apretar, de arriba abajo. Dos capas finas siempre ganan a una gruesa: secan mejor, no chorrean y cubren de verdad. Entre capa y capa, el rodillo se envuelve en film para que no se seque.","Colores y trampas: el techador blanco hace la habitación más alta, el oscuro la acoge; prueba el color en un metro de pared y míralo de día y de noche antes de comprar los 15 litros. La pintura plástica mate disimula defectos; el brillo los subraya pero se limpia mejor.","Reto: pinta una sola pared de acento en una habitación. Es el proyecto perfecto para aprender: pequeño, reversible y con resultado espectacular."],"quiz":[{"pregunta":"¿Qué porcentaje del éxito al pintar es la preparación?","opciones":["Casi todo: limpiar, tapar, lijar y proteger","Ninguno: es solo dar rodillo","La mitad"],"correcta":0,"porque":"La pintura sobre polvo o grasa se despega: la preparación es la obra."},{"pregunta":"¿Cómo se aplica la pintura con rodillo?","opciones":["En forma de W, capas finas, de arriba abajo","Apretando fuerte","Solo horizontal"],"correcta":0,"porque":"La W reparte sin chorreos; dos capas finas siempre ganan a una gruesa."},{"pregunta":"¿Qué efecto tiene pintar el techo de blanco?","opciones":["Hace la habitación visualmente más alta","La hace más pequeña","Ninguno"],"correcta":0,"porque":"El blanco refleja luz y aleja el techo: el truco más viejo de los pintores."}]},{"titulo":"Electricidad doméstica segura: lo que sí puedes tocar","contenido":["Regla número uno, sin excepciones: antes de tocar nada eléctrico, corta el automático en el cuadro y comprueba con un comprobador que no hay corriente. La electricidad no avisa y no perdona. Lo que un aficionado puede hacer: cambiar enchufes, interruptores, bombillas y lámparas. Lo que no: tocar el cuadro general, derivaciones dentro de cajas, y cualquier cosa en baños sin saber mucho.","El código de colores español: marrón o negro es la fase (el peligroso), azul el neutro, y verde-amarillo la tierra (el salvavidas). Cambiar un enchufe: corriente cortada, foto del antes con el móvil, cables al mismo sitio, tornillos bien apretados, nada de cobre suelto asomando.","El diferencial (el interruptor que salta cuando hay fuga) te protege a ti; los automáticos protegen la instalación. Si salta el diferencial, hay una fuga a tierra: desenchufa aparatos uno a uno hasta encontrar al culpable. Si salta un automático, hay cortocircuito o exceso de consumo en ese circuito.","Reto: aprende tu cuadro eléctrico: qué automático corta qué zona de la casa, etiquétalos, y prueba el botón de test del diferencial (hay que pulsarlo una vez al año)."],"quiz":[{"pregunta":"¿Qué se hace SIEMPRE antes de tocar un enchufe por dentro?","opciones":["Cortar el automático y comprobar que no hay corriente","Ponerse guantes y ya está","Trabajar de noche"],"correcta":0,"porque":"Cortar y comprobar: la electricidad no avisa. Los dos pasos son inseparables."},{"pregunta":"¿Qué color tiene el cable de tierra?","opciones":["Verde-amarillo","Azul","Marrón"],"correcta":0,"porque":"Verde-amarillo es el salvavidas; azul el neutro; marrón o negro la fase peligrosa."},{"pregunta":"¿Para qué sirve el botón de test del diferencial?","opciones":["Para comprobar que salta y protege correctamente","Para gastar luz","Para nada"],"correcta":0,"porque":"Un test anual confirma que tu principal protector contra electrocución sigue vivo."}]}],"nivel":"basico"},{"id":"electricidad","titulo":"Electricidad en casa","icono":"⚡","lecciones":[{"titulo":"Qué es la electricidad: voltios, amperios y vatios","contenido":["La electricidad es un río de electrones. El voltaje (voltios, V) es la presión del agua: lo que empuja. La corriente (amperios, A) es el caudal: cuántos electrones pasan por segundo. La potencia (vatios, W) es el trabajo que hacen juntos: voltios por amperios. Una bombilla de 60 W a 230 V deja pasar un cuarto de amperio.","Corriente continua (CC): fluye siempre en la misma dirección, la de las pilas y los móviles. Corriente alterna (CA): cambia de dirección 50 veces por segundo, la de los enchufes, porque viaja mejor por los cables largos. El transformador de tu cargador convierte 230 V de alterna en 5 V de continua.","La analogía hidráulica explica todo: el cable es la tubería, el interruptor es el grifo, la resistencia es un estrechamiento, el fusible es la válvula de seguridad que se sacrifica. Con esa imagen mental puedes razonar casi cualquier circuito casero.","Reto: mira la etiqueta de tres aparatos de casa y anota sus vatios. El que más consume suele ser el que calienta: vitro, horno, secador, radiador. Calentar es lo caro."],"quiz":[{"pregunta":"¿Qué es el voltaje en la analogía del río?","opciones":["La presión que empuja los electrones","La cantidad de agua","El color del cable"],"correcta":0,"porque":"Voltios empujan, amperios cuentan cuántos pasan, vatios miden el trabajo total."},{"pregunta":"¿Cómo se calculan los vatios?","opciones":["Voltios multiplicados por amperios","Voltios entre amperios","Amperios al cuadrado"],"correcta":0,"porque":"P = V × I: la fórmula más útil de la electricidad doméstica."},{"pregunta":"¿Por qué los enchufes usan corriente alterna?","opciones":["Porque se transporta mejor a larga distancia","Porque es más bonita","Por casualidad"],"correcta":0,"porque":"La alterna se sube y baja de tensión con transformadores: eso la hizo ganar la guerra de las corrientes."}]},{"titulo":"La factura de la luz entendida","contenido":["Tu factura mide energía en kilovatios-hora (kWh): un aparato de 1.000 W encendido una hora. El radiador de 2.000 W encendido 5 horas son 10 kWh; a 0,15 € el kWh, 1,50 € esa tarde. Saber multiplicar potencia por horas es tener el poder de predecir tu factura.","La factura tiene dos partes: la potencia contratada (lo que pagas por poder enchufar mucho a la vez, aunque no lo uses) y el consumo (lo que de verdad gastas). Con la discriminación horaria, el mismo lavavajillas cuesta la mitad de madrugada que a la hora de cenar.","Los vampiros eléctricos: aparatos en standby que consumen 24 horas al día. La tele apagada, la consola en reposo, los cargadores enchufados: 5-10 W cada uno, suman decenas de euros al año. Las regletas con interruptor los matan de una vez.","Reto: estima el consumo mensual de tu nevera (funciona a intervalos, unos 150 W de media, 24 horas): compáralo con tu factura real y busca tu vampiro mayor."],"quiz":[{"pregunta":"¿Qué es un kilovatio-hora (kWh)?","opciones":["La energía de 1.000 W funcionando una hora","Mil voltios","La velocidad de la luz"],"correcta":0,"porque":"Es la unidad que facturan: potencia por tiempo, como litros de un grifo."},{"pregunta":"¿Qué dos partes grandes tiene la factura?","opciones":["La potencia contratada y el consumo real","Solo el consumo","IVA y nada más"],"correcta":0,"porque":"Pagas por poder usar mucho a la vez (potencia) y por lo que usas (consumo): se optimizan distinto."},{"pregunta":"¿Qué son los vampiros eléctricos?","opciones":["Aparatos que consumen en standby todo el día","Los murciélagos","Las bombillas LED"],"correcta":0,"porque":"Cada standby son 5-10 W las 24 horas: las regletas con interruptor los cortan de raíz."}]},{"titulo":"El cuadro eléctrico: el cerebro de la casa","contenido":["El cuadro de una vivienda tiene tres niveles de protección: el ICP o limitador (la compañía), el diferencial (te protege a ti: salta si detecta fuga de corriente a tierra, la electrocución) y los automáticos o PIA (protegen cada circuito: salta si hay cortocircuito o sobrecarga). Cada uno vigila un peligro distinto.","Cada automático gobierna una zona: luces, enchufes generales, cocina, lavadora, aire. Las secciones de cable y los amperios del automático van emparejados: cable fino con automático pequeño. Poner un automático más gordo 'para que no salte' es quitar el guardaespaldas porque molesta: el cable se calienta y arde.","Si un automático salta: baja palancas, desenchufa los aparatos de esa zona, sube el automático y ve enchufando uno a uno hasta encontrar el culpable. Si salta al instante con todo desenchufado, el fallo está en la instalación: eso ya es de electricista.","Reto: etiqueta hoy los automáticos de tu cuadro probando uno a uno qué corta. El día que salte a las 11 de la noche, lo agradecerás."],"quiz":[{"pregunta":"¿Qué protege el diferencial?","opciones":["A las personas, saltando si hay fuga de corriente","A los cables del calor","La factura"],"correcta":0,"porque":"Detecta la corriente que se escapa (quizá a través de una persona) y corta en milisegundos."},{"pregunta":"¿Por qué no poner un automático más gordo para que no salte?","opciones":["Porque entonces el cable se calienta sin protección y puede arder","Porque es ilegal","Se puede sin problema"],"correcta":0,"porque":"El automático se elige para el cable: quitar la protección es invitar al incendio."},{"pregunta":"¿Cómo se encuentra el aparato que hace saltar un automático?","opciones":["Desenchufando todo y enchufando uno a uno","Gritando al cuadro","Esperando una semana"],"correcta":0,"porque":"El proceso de eliminación encuentra al culpable en minutos: método, no magia."}]},{"titulo":"Circuitos básicos: serie, paralelo y el interruptor","contenido":["En serie los componentes van en fila india: la misma corriente pasa por todos y si uno se rompe, se apagan todos (las luces de Navidad antiguas). En paralelo cada uno tiene su camino: todos reciben el voltaje completo y uno puede fallar sin afectar al resto. Las casas se cablean en paralelo: por eso se funde una bombilla y no toda la casa.","El interruptor es un puente que se abre y se cierra: corta la fase, nunca el neutro. El conmutador (el de los pasillos con dos interruptores para una luz) usa dos conmutadores que eligen entre dos caminos: por eso cualquiera de los dos enciende y apaga.","La bombilla es una resistencia que se pone al rojo: el filamento de tungsteno se calienta hasta brillar (por eso las antiguas gastaban tanto: 95% calor, 5% luz). El LED es un semiconductor que emite luz directamente: misma luz con diez veces menos vatios.","Reto: cuenta cuántos circuitos en paralelo ves en tu salón (lámpara, enchufes, tele) y entiende por qué el diseño en paralelo conquistó el mundo."],"quiz":[{"pregunta":"¿Cómo están conectados los enchufes de una casa?","opciones":["En paralelo: cada uno recibe el voltaje completo","En serie","Mezclados"],"correcta":0,"porque":"El paralelo da a cada aparato sus 230 V e independencia: se funde uno y siguen los demás."},{"pregunta":"¿Qué cable debe cortar un interruptor?","opciones":["La fase","El neutro","La tierra"],"correcta":0,"porque":"Cortando la fase, la lámpara queda sin peligro al cambiar la bombilla; cortando el neutro, no."},{"pregunta":"¿Por qué consume tan poco un LED?","opciones":["Porque emite luz directamente sin calentar un filamento","Porque es pequeño","Porque es moderno"],"correcta":0,"porque":"La bombilla antigua era una estufa que daba luz de regalo; el LED es luz pura."}]},{"titulo":"Pequeñas reparaciones: alargadores, enchufes y lámparas","contenido":["Cambiar un enchufe o un interruptor es la reparación eléctrica más común: corriente cortada y comprobada, foto del cableado original, desatornillar, pasar los cables al nuevo igual que estaban (fase, neutro, tierra), apretar bien los bornes (un cable flojo chisporrotea y calienta) y montar. Quince minutos de tranquilidad.","Reparar un cable mordido por una silla o una lámpara: cortar la zona dañada, pelar 1 cm de cada extremo, unir con regleta de conexión (nunca trenzando y cinta aislante como única protección en instalación fija: la regleta es firme y segura), y comprobar que ningún cobre asoma.","Los ladrones y alargadores tienen límite: cada uno soporta una potencia máxima (suele ponerlo: 3.500 W). Enchufar radiador más secador en un ladrón de tres euros es el incendio clásico de las noticias. Los aparatos de calor van directos a la pared.","Reto: repasa los ladrones de tu casa: ¿qué hay enchufado en cada uno? Reorganiza para que los aparatos de calor tengan enchufe propio."],"quiz":[{"pregunta":"¿Qué se fotografía antes de desmontar un enchufe viejo?","opciones":["El cableado original, para montar el nuevo igual","La pared","Nada"],"correcta":0,"porque":"La foto es tu mapa: cada cable vuelve a su borne sin dudas."},{"pregunta":"¿Cómo se unen dos cables correctamente?","opciones":["Con una regleta de conexión","Trenzándolos y cinta","Con pegamento"],"correcta":0,"porque":"La regleta aprieta firme y aísla; el trenzado con cinta se afloja y es fuente de chispas."},{"pregunta":"¿Qué aparatos deben ir directos a la pared, sin ladrones?","opciones":["Los de calor: radiador, secador, freidora","El cargador del móvil","La lámpara LED"],"correcta":0,"porque":"El calor significa muchos vatios: sobrecargar un ladrón barato es el incendio clásico."}]}],"nivel":"basico"},{"id":"electronica","titulo":"Electrónica desde cero","icono":"🔌","lecciones":[{"titulo":"Los componentes: el alfabeto de la electrónica","contenido":["La electrónica tiene sus letras: la resistencia limita la corriente (la más común de todas), el condensador almacena carga como un mini-depósito, el diodo deja pasar la corriente en un solo sentido, el LED es un diodo que brilla, y el transistor es el interruptor gobernado por electricidad: la pieza que hizo posible toda la informática.","Cada componente habla por sus marcas: las resistencias llevan anillos de colores que dicen sus ohmios (marrón-negro-rojo = 1.000 Ω), los condensadores sus microfaradios impresos, los diodos una banda que marca el lado negativo. Aprender el código de colores es el alfabeto del taller.","La protoboard es el tablero de pruebas sin soldadura: agujeros conectados por dentro en filas, donde pinchas componentes y cables para probar circuitos sin compromiso. Todo circuito nace ahí antes de soldarse. La regla del taller: prueba en protoboard, mide con el multímetro, y solo entonces suelda.","Reto: consigue una resistencia y un LED de cualquier cacharro viejo: identifícalos y mide la resistencia con un multímetro. Ya estás leyendo electrónica."],"quiz":[{"pregunta":"¿Qué hace un transistor?","opciones":["Es un interruptor controlado por electricidad","Guarda fotos","Mide la temperatura"],"correcta":0,"porque":"Una pequeña corriente en la base gobierna una grande: amplifica y conmuta. Es el átomo de la informática."},{"pregunta":"¿Qué indica la banda de un diodo?","opciones":["Su lado negativo: la corriente solo pasa en un sentido","La marca","Nada"],"correcta":0,"porque":"El diodo es una calle de sentido único: la banda señala por dónde sale."},{"pregunta":"¿Para qué sirve la protoboard?","opciones":["Para probar circuitos pinchando componentes sin soldar","Para cortar pan","Para guardar tornillos"],"correcta":0,"porque":"El laboratorio de pruebas: todo circuito nace en protoboard antes de soldarse."}]},{"titulo":"La ley de Ohm: la fórmula que gobierna todo","contenido":["V = I × R: el voltaje es la corriente por la resistencia. Con dos datos calculas el tercero. Es la ley que se usa a diario: ¿qué resistencia necesita un LED a 9 V? El LED quiere 2 V y 20 mA, sobran 7 V; R = 7 / 0,02 = 350 Ω. Por eso el LED sin resistencia se quema: sin límite, la corriente lo fulmina.","El multímetro es el ojo del electrónico: mide voltios, amperios, ohmios y continuidad (el pitido que dice 'hay camino'). Medir voltaje: en paralelo al componente. Medir corriente: en serie, intercalado. Medir resistencia: con el circuito apagado. Confundir los modos es como se funden los multímetros.","La potencia también se calcula: P = V × I. Una resistencia debe aguantar la potencia que disipa o se calienta hasta morir: por eso hay resistencias de cuarto de vatio y resistencias gordas de cinco. El calor es el impuesto de la corriente.","Reto: calcula la resistencia para un LED a 5 V (caída 2 V, 20 mA): V = I × R al rescate. Es el primer cálculo de todo electrónico."],"quiz":[{"pregunta":"¿Qué dice la ley de Ohm?","opciones":["V = I × R: voltaje igual a corriente por resistencia","V = I + R","Todo fluye"],"correcta":0,"porque":"La trinidad sagrada: con dos valores conocidos, el tercero se calcula."},{"pregunta":"¿Por qué un LED necesita resistencia?","opciones":["Porque sin límite de corriente se quema","Para hacerlo bonito","No la necesita"],"correcta":0,"porque":"El LED apenas opone resistencia: sin la compañera, la corriente lo fulmina en un flash."},{"pregunta":"¿Cómo se mide la corriente con un multímetro?","opciones":["En serie, intercalando el aparato en el circuito","En paralelo","A ojo"],"correcta":0,"porque":"La corriente hay que atravesarla: el multímetro se pone en medio del camino de los electrones."}]},{"titulo":"Soldar: el arte de unir electrones","contenido":["Soldar es unir componentes con estaño fundido: el soldador a 350 °C calienta a la vez la patilla y la pista, y el estaño fluye sobre el metal caliente formando una montañita brillante y lisa. La regla de oro: se calienta la unión, no el estaño. Un punto mate, arrugado o en bola es una 'soldadura fría': no conduce bien y fallará.","La técnica: puntas limpias y estañadas, la patilla y la pista calientes un segundo, el estaño toca y fluye otro segundo, retirar, no soplar, no mover hasta que solidifique. Dos segundos por punto. Los componentes delicados (LED, transistores) soportan poco calor: rapidez o pinza disipadora.","Desoldar es la otra mitad del oficio: la malla absorbente chupa el estaño caliente, la bomba desoldadora lo aspira. Y la ventilación no es opcional: los vapores del fundente no son aromaterapia. Soldar junto a una ventana es higiene de taller.","Reto: practica soldando dos cables de estaño sobre una placa de pruebas vieja: diez puntos brillantes y en montañita antes de tocar un proyecto real."],"quiz":[{"pregunta":"¿Cómo es un buen punto de soldadura?","opciones":["Brillante, liso y en forma de montañita","En bola gris mate","Cuanto más estaño mejor"],"correcta":0,"porque":"El estaño brillante y fluido abraza los metales; la bola mate es soldadura fría que fallará."},{"pregunta":"¿Qué se calienta al soldar?","opciones":["La patilla y la pista a la vez; el estaño fluye sobre ellas","Solo el estaño","El aire"],"correcta":0,"porque":"El estaño debe fundirse por el calor de la unión, no por el soldador: ese es todo el secreto."},{"pregunta":"¿Por qué hay que ventilar al soldar?","opciones":["Por los vapores del fundente","Por el calor","No hace falta"],"correcta":0,"porque":"El humo de la colofonia no es saludable: ventana abierta o extractor, siempre."}]},{"titulo":"El primer proyecto: circuitos que hacen algo","contenido":["El camino clásico: primero un LED con su resistencia y una pila (hola mundo luminoso), luego un interruptor que lo gobierna, luego un LDR (resistencia que cambia con la luz) que lo enciende de noche: el esquema de todas las farolas automáticas. Tres proyectos y ya entiendes sensores y actuadores.","El temporizador 555 es el chip legendario: con dos resistencias y un condensador genera parpadeos, tonos y temporizaciones desde 1962. El circuito del LED parpadeante con un 555 es el rito de iniciación de toda una generación de electrónicos.","Las placas como Arduino bajaron la electrónica al alcance de todos: sensores de temperatura, movimiento, humedad, que se leen desde código y gobiernan motores, luces y relés. La electrónica moderna es mitad estaño, mitad programa, y el puente eres tú.","Reto: monta el LED con resistencia en una protoboard, luego añade el interruptor. El día que un LED parpadee por tu circuito, ya no hay vuelta atrás."],"quiz":[{"pregunta":"¿Cuál es el 'hola mundo' de la electrónica?","opciones":["Encender un LED con su resistencia y una pila","Fabricar un ordenador","Soldar un televisor"],"correcta":0,"porque":"Pila, resistencia, LED: si brilla, todo lo demás es ampliar este momento."},{"pregunta":"¿Qué hace el chip 555?","opciones":["Genera temporizaciones y parpadeos con dos resistencias y un condensador","Calienta café","Navega por internet"],"correcta":0,"porque":"El temporizador legendario desde 1962: el rito de iniciación de generaciones de electrónicos."},{"pregunta":"¿Qué es un LDR?","opciones":["Una resistencia que cambia con la luz: el sensor de las farolas","Un tipo de pila","Un soldador"],"correcta":0,"porque":"De día resiste poco, de noche mucho: con ese truco el circuito sabe si es de noche."}]}],"nivel":"medio"},{"id":"historia","titulo":"Historia: entender el mundo","icono":"📜","lecciones":[{"titulo":"Por qué estudiar historia (y cómo se hace)","contenido":["La historia no es una lista de fechas: es el intento de entender cómo llegamos hasta aquí. Todo lo que usas (el idioma, las leyes, las fronteras, el dinero) es un sediment de decisiones humanas del pasado. Quien no conoce la historia está condenado a que se la cuenten: y quien la cuenta, manda.","El historiador trabaja con fuentes: primarias (documentos, cartas, monedas, huesos de la época) y secundarias (lo que otros historiadores escribieron). El método es sospechar: ¿quién escribió esto, para quién, con qué interés? La crítica de fuentes es el detector de mentiras más antiguo del mundo.","Las fechas importan menos que los procesos: no memorizar 1492, sino entender qué cambió cuando dos mundos chocaron. La buena pregunta histórica no es 'cuándo' sino 'por qué cambió' y 'a costa de quién'.","Reto: pregunta a un familiar mayor por un recuerdo de su juventud y compáralo con lo que dice un libro de historia de esa época: acabas de hacer crítica de fuentes oral."],"quiz":[{"pregunta":"¿Qué es una fuente primaria?","opciones":["Un documento u objeto de la propia época estudiada","Un libro de texto","Una película"],"correcta":0,"porque":"La carta, la moneda o el hueso de entonces: materia prima del historiador."},{"pregunta":"¿Qué pregunta clave se hace el historiador ante una fuente?","opciones":["¿Quién la escribió, para quién y con qué interés?","¿Cuánto cuesta?","¿Es bonita?"],"correcta":0,"porque":"Toda fuente tiene autor e intención: la sospecha metódica es el oficio."},{"pregunta":"¿Qué importa más en historia?","opciones":["Entender los procesos de cambio","Memorizar fechas","Los nombres de reyes"],"correcta":0,"porque":"Las fechas son el esqueleto; los porqués son la carne."}]},{"titulo":"Prehistoria y las primeras civilizaciones","contenido":["El 99% de la historia humana es prehistoria: desde los primeros utensilios de piedra (hace más de 2 millones de años) hasta la escritura. Dos revoluciones lo cambiaron todo: el dominio del fuego (cocinar, calentarse, ahuyentar) y la agricultura (hace unos 10.000 años): quedarse en un sitio, almacenar excedente, y con el excedente llegaron las ciudades, los oficios... y los impuestos.","Las primeras civilizaciones nacieron junto a los grandes ríos: Mesopotamia (Tigris y Éufrates), Egipto (Nilo), el Indo y la China del río Amarillo. El río daba agua, barro fértil y calendario de crecidas. En Mesopotamia nació la escritura (cuneiforme, hacia 3300 a.C.) para llevar cuentas de grano: la escritura nació de la contabilidad, no de la poesía.","Egipto dejó las pirámides y una administración asombrosa; Mesopotamia, el Código de Hammurabi (hacia 1750 a.C.), uno de los primeros cuerpos de leyes escritos: la idea revolucionaria de que la ley esté escrita y sea la misma para todos.","Reto: busca en un mapa los cuatro grandes ríos de las primeras civilizaciones y piensa por qué ninguna nació lejos del agua."],"quiz":[{"pregunta":"¿Qué dos revoluciones transformaron la prehistoria?","opciones":["El fuego y la agricultura","La rueda y el teléfono","El hierro y el vapor"],"correcta":0,"porque":"Cocinar y quedarse: con el excedente agrícola nacieron ciudades, oficios y Estados."},{"pregunta":"¿Para qué nació la escritura en Mesopotamia?","opciones":["Para llevar cuentas de grano e impuestos","Para escribir poemas","Para jugar"],"correcta":0,"porque":"La contabilidad fue madre de la escritura: registrar quién debía cuánto trigo."},{"pregunta":"¿Qué aportó el Código de Hammurabi?","opciones":["Una de las primeras leyes escritas, iguales para todos","Las pirámides","El alfabeto"],"correcta":0,"porque":"Escribir la ley en piedra fue revolucionario: ya no dependía del capricho del juez."}]},{"titulo":"Grecia y Roma: el cimiento de Europa","contenido":["Grecia (siglos V-IV a.C.) inventó cosas que aún usamos: la democracia (en Atenas votaban los ciudadanos varones libres: poca gente, pero la idea quedó), la filosofía (Sócrates preguntando, Platón escribiendo, Aristóteles clasificando), el teatro, la historia como disciplina (Heródoto) y los Juegos Olímpicos.","Roma copió lo griego y lo escaló: de monarquía a república (senado, cónsules, leyes) y de república a imperio tras las guerras civiles. El Imperio romano unió el Mediterráneo con calzadas, acueductos, derecho romano (abuelo del nuestro) y el latín (padre del español). Cayó en Occidente en 476 d.C. por una mezcla de crisis económica, presión de los pueblos germánicos y división interna.","El legado invisible: nuestros meses (julio por Julio César, agosto por Augusto), nuestro derecho ('inocente hasta que se pruebe lo contrario'), nuestras carreteras sobre calzadas romanas y las lenguas romances. Hablamos latín corrompido cada día.","Reto: busca cinco palabras españolas de origen latino que uses hoy (casa, mesa, mano...) y una ley actual con raíz romana."],"quiz":[{"pregunta":"¿Qué inventó Atenas que aún usamos?","opciones":["La democracia, la filosofía y el teatro","El teléfono","La imprenta"],"correcta":0,"porque":"Votaban pocos, pero la idea de que el pueblo decida quedó plantada para siempre."},{"pregunta":"¿Qué lengua es la madre del español?","opciones":["El latín","El griego","El árabe"],"correcta":0,"porque":"El latín de los soldados y administradores romanos evolucionó hasta ser español, francés, italiano..."},{"pregunta":"¿Cuándo cayó el Imperio romano de Occidente?","opciones":["En 476 d.C.","En 1492","En el año 0"],"correcta":0,"porque":"Crisis económica, divisiones y presión germánica: el gigante se desmoronó por dentro."}]},{"titulo":"Edad Media y el nacimiento de España","contenido":["Tras la caída de Roma, Europa se fragmentó en reinos germánicos. En 711 los musulmanes cruzaron desde el norte de África y conquistaron casi toda la península en pocos años: nació al-Ándalus, que durante siglos fue el lugar más avanzado de Europa (Córdoba tenía alumbrado y bibliotecas cuando Londres era un poblado de barro).","La Edad Media no fue tan 'oscura': verjas, castillos y monasterios, sí, pero también universidades (Salamanca, 1218), catedrales góticas que tardaban siglos en levantarse y la convivencia (a veces pacífica, a veces no) de cristianos, judíos y musulmanes en la península, que dejó el español lleno de palabras árabes: aceite, azúcar, álgebra, ojalá.","En 1469 se casaron Isabel de Castilla y Fernando de Aragón; en 1492 conquistaron Granada (fin de la presencia musulmana en la península) y Colón llegó a América buscando las Indias. Un año que cambió el mundo: Europa se volcó hacia el Atlántico y España se convirtió en la primera potencia global.","Reto: escribe diez palabras árabes del español cotidiano (pista: casi todas las que empiezan por 'al-'). Cada palabra es un fósil histórico."],"quiz":[{"pregunta":"¿Qué fue al-Ándalus?","opciones":["La península bajo dominio musulmán desde 711, foco cultural de Europa","Un barco","Una ciudad romana"],"correcta":0,"porque":"Córdoba llegó a ser la mayor ciudad de Occidente: ciencia, medicina y traducción mientras Europa dormía."},{"pregunta":"¿Qué dejó la convivencia de las tres culturas en el español?","opciones":["Cientos de palabras árabes y tradiciones judías y cristianas","Nada","Solo comida"],"correcta":0,"porque":"Aceite, azúcar, álgebra, ojalá ('oxalá': si Alá quiere): el idioma es un museo."},{"pregunta":"¿Qué pasó en 1492?","opciones":["Caída de Granada y llegada de Colón a América","La caída de Roma","La guerra de los cien años"],"correcta":0,"porque":"Fin de al-Ándalus y comienzo de la era atlántica: un año bisagra de la historia mundial."}]},{"titulo":"El Imperio español y la Edad Moderna","contenido":["Con los Reyes Católicos y los Austrias, España construyó el primer imperio donde 'no se ponía el sol': América, Filipinas, media Italia, los Países Bajos. El oro y la plata americanos financiaron guerras europeas y, paradójicamente, empobrecieron el país: inflación y dependencia en lugar de industria.","La conquista de América fue también una catástrofe demográfica: las enfermedades europeas (viruela, sarampión) mataron a la mayoría de la población indígena, que no tenía defensas. Y el encuentro transformó la cocina mundial: el tomate, la patata, el maíz y el chocolate viajaron a Europa; el trigo, el caballo y el cerdo, a América (el intercambio colombino).","La Edad Moderna europea trajo la imprenta de Gutenberg (hacia 1450): los libros se abarataron cien veces y las ideas se escaparon del control de la Iglesia. Lutero clavó sus tesis en 1517 y Europa se partió religiosamente; la ciencia de Copérnico y Galileo movió la Tierra del centro del universo. Cada avance costó caro a quien lo propuso.","Reto: cena hoy algo con patata, tomate o chocolate y piensa que antes de 1492 en Europa nadie los había probado."],"quiz":[{"pregunta":"¿Por qué el oro americano empobreció a España a la larga?","opciones":["Causó inflación y desanimó la industria propia","Porque lo robaron los piratas","No llegó nunca"],"correcta":0,"porque":"Dinero fácil sin producir: los precios subieron y las manufacturas se compraban fuera."},{"pregunta":"¿Qué fue el intercambio colombino?","opciones":["El trasvase de plantas, animales y enfermedades entre América y Europa","Un tratado de paz","Una batalla"],"correcta":0,"porque":"La patata alimentó Europa; la viruela diezmó América: el intercambio fue desigual."},{"pregunta":"¿Qué cambió la imprenta de Gutenberg?","opciones":["Los libros se abarataron y las ideas se difundieron sin control","Nada importante","Solo los libros de cocina"],"correcta":0,"porque":"Multiplicar textos por cien es multiplicar lectores: la Reforma y la ciencia cabalgaron sobre el papel."}]},{"titulo":"Siglos XIX y XX: el mundo moderno","contenido":["El XIX fue el siglo de las revoluciones: la francesa (1789) sembró la libertad, la igualdad legal y el fin de los privilegios; la industrial (vapor, fábricas, ferrocarril) sacó a la humanidad del campo y creó la clase obrera y las ciudades gigantes. España vivió su independencia de las colonias americanas y sus guerras entre liberales y absolutistas.","El XX empezó con dos guerras mundiales que fueron también industriales: la primera (1914-18) mató a millones en las trincheras y rompió cuatro imperios; la segunda (1939-45) llevó la barbarie al límite (el Holocausto, las bombas atómicas) y dejó el mundo partido en dos bloques: la Guerra Fría hasta 1989. De sus cenizas nacieron la ONU y la Unión Europea: la apuesta por no repetir.","España en el XX: la Segunda República (1931), la Guerra Civil (1936-39) con sus cientos de miles de muertos, la larga dictadura de Franco (1939-75) y la Transición a la democracia, con la Constitución de 1978 que aún nos gobierna. La memoria de todo ello aún ordena nuestra política.","Reto: localiza en tu familia quién vivió la posguerra o la Transición y pídele un recuerdo: la historia reciente está en las cocinas, no solo en los libros."],"quiz":[{"pregunta":"¿Qué dos revoluciones marcaron el siglo XIX?","opciones":["La francesa y la industrial","La rusa y la china","La americana solamente"],"correcta":0,"porque":"Derechos ciudadanos y máquinas de vapor: la política y la economía modernas nacieron ahí."},{"pregunta":"¿Qué organizaciones nacieron tras la Segunda Guerra Mundial?","opciones":["La ONU y lo que sería la Unión Europea","La NASA solamente","El FMI solamente"],"correcta":0,"porque":"La lección de 1945 fue 'nunca más': cooperar para no repetir la catástrofe."},{"pregunta":"¿Cuándo se aprobó la Constitución española?","opciones":["En 1978","En 1936","En 1812"],"correcta":0,"porque":"La Transición pactada convirtió la dictadura en democracia sin guerra: el 6 de diciembre es fiesta por eso."}]}],"nivel":"medio"},{"id":"lengua","titulo":"Lengua española: escribir y hablar bien","icono":"✒️","lecciones":[{"titulo":"El español: de dónde viene y quién lo habla","contenido":["El español nació del latín vulgar que hablaban los soldados romanos en la península, no del latín culto de Cicerón. Veinte siglos de evolución convirtieron 'caballum' en 'caballo' y 'octo' en 'ocho'. Es, como el francés o el italiano, una hija del latín que salió de casa y se hizo mayor.","Hoy lo hablan unas 500 millones de personas: segunda lengua materna del mundo tras el chino. Es oficial en 21 países y cada país le dio su acento y sus palabras: el 'vos' argentino, el 'chévere' caribeño, el 'ordenador' español frente a la 'computadora' americana. Un idioma, veinte sabores.","Sus ingredientes: la base latina, un aliño visigodo (guerra, guante, ganar), una capa enorme de árabe por los ocho siglos de al-Ándalus (aceite, azúcar, almohada, ojalá), palabras americanas tras 1492 (chocolate, tomate, canoa) y ahora el inglés digital (tuitear, googlear). Cada palabra es un fósil de una época.","Reto: cuenta cuántas palabras con 'al-' usas en un día. Cada una es un eco de ochocientos años de historia."],"quiz":[{"pregunta":"¿De dónde nació el español?","opciones":["Del latín vulgar de los soldados romanos en la península","Del griego","Del árabe"],"correcta":0,"porque":"Veinte siglos de evolución convirtieron el latín de la calle en español."},{"pregunta":"¿Cuántas personas hablan español hoy?","opciones":["Unas 500 millones: segunda lengua materna del mundo","Cien millones","Mil millones"],"correcta":0,"porque":"Solo el chino tiene más hablantes nativos: el español es un gigante."},{"pregunta":"¿Qué capa de palabras dejó al-Ándalus?","opciones":["Cientos de palabras árabes: aceite, azúcar, almohada","Ninguna","Solo nombres de pueblos"],"correcta":0,"porque":"Ocho siglos de convivencia dejan marca: el idioma es un museo que hablamos."}]},{"titulo":"Ortografía sin miedo: las trampas clásicas","contenido":["El español se escribe casi como suena, pero tiene sus trampas históricas. La b y la v suenan igual desde hace siglos (antes no) y se aprenden de memoria y lectura: reglas como 'después de m va b' (cambio, hombro) o los verbos en -bir (escribir, vivir) ayudan. La h es muda y caprichosa: herencia de una hache latina que se fue perdiendo en la pronunciación pero no en la letra.","La g y la j: antes de e e i, la duda eterna. Reglas: los verbos en -ger y -gir van con g (proteger, dirigir) salvo excepciones; los en -jería van con j (brujería). La c, la z: 'caza' y 'casa' suenan igual en América y distinto en España: la ortografía guarda la historia de cuando sonaban diferentes.","Las tildes tienen lógica: agudas (terminan en vocal, n o s: canción, café), llanas (lo contrario: árbol, cárcel... no: fácil, azúcar), esdrújulas (siempre: médico, pájaro). Y la tilde diacrítica distingue palabras gemelas: tú/tu, él/el, sí/si, más/mas. Un tilde puede cambiar una frase entera: '¿por qué?' / 'porque'.","Reto: escribe de memoria diez palabras con h y diez con v; comprueba cuántas fallas. La ortografía se entrena como un músculo: leyendo y escribiendo."],"quiz":[{"pregunta":"¿Por qué la h se escribe si no suena?","opciones":["Por herencia del latín: sonaba y se perdió la pronunciación, no la letra","Por decoración","Por error"],"correcta":0,"porque":"La ortografía es conservadora: guarda la historia de cómo se hablaba antes."},{"pregunta":"¿Cuándo llevan tilde las palabras agudas?","opciones":["Cuando terminan en vocal, n o s","Siempre","Nunca"],"correcta":0,"porque":"Canción, café, compás: la regla de las agudas en tres letras."},{"pregunta":"¿Qué hace la tilde diacrítica?","opciones":["Distingue palabras iguales: tú/tu, él/el, sí/si","Nada","Decora"],"correcta":0,"porque":"Una rayita separa al pronombre del posesivo: la precisión vale una tilde."}]},{"titulo":"Gramática práctica: las piezas de la frase","contenido":["Toda frase española es una máquina con piezas: sustantivo (la cosa: casa, libertad), artículo (el, una), adjetivo (cómo es: roja), verbo (qué pasa: corre), adverbio (cómo, cuándo: rápido, ayer), preposición (el pegamento: de, con, por) y conjunción (la bisagra: y, pero, aunque). Identificar las piezas es desmontar el motor del idioma.","El verbo es la pieza reina: lleva dentro la persona (yo/tú/él), el número, el tiempo (pasado, presente, futuro) y el modo (indicativo para hechos, subjuntivo para deseos y dudas: 'quiero que vengas'). El subjuntivo español es un tesoro que el inglés casi perdió: permite decir 'ojalá llueva'.","El sujeto y el verbo deben concordar (los niños juegan, no juega), y el adjetivo con el sustantivo (casas blancas). La concordancia rota es el error más común y el más fácil de pulir leyendo la frase en voz alta: el oído corrige lo que la vista perdona.","Reto: toma cualquier frase de un libro y etiqueta cada palabra con su categoría. Desmontar el motor es la mejor forma de aprender a conducirlo."],"quiz":[{"pregunta":"¿Qué pieza de la frase es la reina?","opciones":["El verbo: lleva persona, tiempo y modo","El artículo","El adjetivo"],"correcta":0,"porque":"Un verbo solo puede ser frase entera ('llueve'): ninguna otra pieza puede."},{"pregunta":"¿Para qué sirve el subjuntivo?","opciones":["Para deseos, dudas e hipótesis: 'quiero que vengas'","Para insultar","Para nada"],"correcta":0,"porque":"El español distingue los hechos de los deseos con todo un modo verbal: ojalá lo uses."},{"pregunta":"¿Cuál es el truco más fácil para detectar errores de concordancia?","opciones":["Leer la frase en voz alta: el oído corrige lo que la vista perdona","Escribirla más grande","Ignorarla"],"correcta":0,"porque":"El oído está entrenado desde la infancia: léete y te corregirás."}]},{"titulo":"Escribir bien: claridad ante todo","contenido":["Escribir bien no es escribir bonito: es que te entiendan a la primera. La regla madre: una idea por frase, frases cortas, verbos en lugar de sustantivazos ('decidir' mejor que 'la toma de la decisión'). Si una frase ocupa cuatro líneas, el lector ya se ha perdido dos veces.","La estructura invisible: todo texto responde a preguntas en orden lógico. Un email: qué quiero, por qué, qué necesito del otro y para cuándo. Un resumen: qué pasó, a quién, cuándo, con qué consecuencia. Pensar primero la estructura y escribir después es la diferencia entre el borrador eterno y el texto que funciona.","Los enemigos del texto claro: la paja ('es importante destacar que...'), las frases hechas vacías, la jerga innecesaria y la primera versión. Nadie escribe bien a la primera: escribir es reescribir. Corta un tercio de lo que escribiste y el texto mejorará: casi siempre.","Reto: toma un texto tuyo viejo y córtale un tercio sin perder el mensaje. Duele las primeras veces; luego se vuelve un superpoder."],"quiz":[{"pregunta":"¿Cuál es la regla madre de escribir claro?","opciones":["Una idea por frase y frases cortas","Usar palabras difíciles","Escribir mucho"],"correcta":0,"porque":"El lector no debe releer: si tiene que releer, el fallo es del que escribe."},{"pregunta":"¿Qué se diseña antes de escribir un texto?","opciones":["La estructura: qué preguntas responde y en qué orden","El color de la letra","El título solamente"],"correcta":0,"porque":"Pensar la estructura primero es la diferencia entre el borrador eterno y el texto que funciona."},{"pregunta":"¿Qué mejora casi cualquier texto?","opciones":["Cortarle un tercio","Añadirle adjetivos","Ponerlo en mayúsculas"],"correcta":0,"porque":"Escribir es reescribir: la paja ahoga el mensaje; cortar lo libera."}]},{"titulo":"Leer más y mejor: el entrenamiento del idioma","contenido":["El vocabulario no se estudia: se lee. Quien lee un rato cada día absorbe palabras, construcciones y ritmos sin esfuerzo consciente: es el único gimnasio del idioma que no aburre. Los escritores profesionales son, ante todo, lectores profesionales.","Leer mejor es leer en dos pasadas: la primera, sin parar, para el placer y la idea general; la segunda, lenta, subrayando lo bueno y preguntándose por qué funciona. Subrayar y anotar convierte la lectura en conversación con el autor.","Los clásicos no son una obligación sino un truco: sobrevivieron siglos porque cuentan algo que sigue siendo verdad. El Quijote, el primer best seller de la historia, se puede leer como una novela de aventuras de dos locos maravillosos: solo hay que darle cincuenta páginas de confianza.","Reto: lee diez minutos cada noche durante un mes. Es el hábito con mejor relación esfuerzo-resultado que existe para el idioma."],"quiz":[{"pregunta":"¿Cómo se aprende vocabulario de verdad?","opciones":["Leyendo: se absorbe sin esfuerzo consciente","Memorizando listas","Viendo la tele apagada"],"correcta":0,"porque":"El gimnasio del idioma es la lectura: palabras y ritmos entran solos."},{"pregunta":"¿Cómo son las dos pasadas de la buena lectura?","opciones":["Primera sin parar por placer, segunda lenta subrayando","Al revés","Solo hay una"],"correcta":0,"porque":"Disfrutar primero, diseccionar después: leer y estudiar son dos actos distintos."},{"pregunta":"¿Por qué leer clásicos?","opciones":["Porque sobrevivieron siglos contando verdades que siguen vivas","Por obligación escolar","Para presumir"],"correcta":0,"porque":"El tiempo es el mejor crítico: lo que sigue en pie después de 400 años, algo tendrá."}]}],"nivel":"basico"},{"id":"eficiencia","titulo":"Eficiencia energética en casa","icono":"🏡","lecciones":[{"titulo":"La casa como sistema: por dónde se escapa la energía","contenido":["Una casa pierde calor como un cesto pierde agua: por los agujeros. El orden de las fugas en una vivienda típica: el tejado (25-30%), las paredes (25%), las ventanas (15-20%), el suelo (10%) y las corrientes de aire por rendijas (hasta 15%). Combatir el frío o el calor sin sellar las fugas es calentar la calle.","El diagnóstico casero es gratis: en un día de viento, pasa la mano por marcos de ventanas y puertas para sentir las corrientes; una vela encendida delata las fugas con el movimiento de la llama. De noche, una casa bien aislada mantiene la temperatura horas después de apagar la calefacción: la que se enfría en seguida es un colador.","Las tres estrategias en orden de rentabilidad: primero sellar (burletes, silicona, cortinas gruesas: euros y resultados inmediatos), luego aislar (ventanas dobles, aislamiento en paredes y tejado: inversión seria) y por último cambiar los aparatos (caldera, aire acondicionado). Arreglar la envolvente antes que la máquina es la regla de oro.","Reto: esta noche, apaga la calefacción y mide cuánto tarda tu casa en perder dos grados. Ese número es tu nota de aislamiento."],"quiz":[{"pregunta":"¿Por dónde se escapa más calor en una casa típica?","opciones":["Por el tejado y las paredes","Por el suelo","Por la chimenea solamente"],"correcta":0,"porque":"El calor sube y las paredes lo rodean: tejado y paredes suman la mitad de las pérdidas."},{"pregunta":"¿Cuál es el orden correcto para mejorar la eficiencia?","opciones":["Primero sellar, luego aislar, después cambiar aparatos","Cambiar la caldera primero","Comprar más radiadores"],"correcta":0,"porque":"Sellar es barato e inmediato; comprar una máquina mejor para una casa-colador es tirar el dinero."},{"pregunta":"¿Cómo se detectan corrientes de aire caseras?","opciones":["Con la mano o una vela junto a marcos y puertas en día de viento","Con la nariz","No se pueden detectar"],"correcta":0,"porque":"La llama que baila delata la fuga: el detector más barato del mundo."}]},{"titulo":"Combatir el calor sin fundir la factura","contenido":["La guerra contra el calor se gana de día: persianas bajadas o toldos en las horas de sol (el sol directo por una ventana es un radiador de 1.000 W gratis e indeseado), y ventanas abiertas solo cuando fuera hace más fresco que dentro: normalmente de noche y a primera hora. La ventilación cruzada (ventanas opuestas abiertas) barre la casa en minutos.","El ventilador no enfría el aire: te enfría a ti moviendo el aire sobre la piel (hasta 3-4 °C de sensación térmica por 2 céntimos la hora, frente a los 40 del aire acondicionado). Truco clásico: un bol con hielo delante del ventilador. Y el aire acondicionado, si se usa: a 25-26 °C, no a 21: cada grado menos suma un 8% a la factura.","Los trucos de la abuela funcionan: ropa de cama de algodón o lino, ducha templada antes de dormir (no fría: el cuerpo reacciona generando calor), comidas ligeras y frías, apagar aparatos que calientan (el horno en agosto es un enemigo) y dormir en la planta más baja, porque el calor sube.","Reto: prueba una semana el protocolo de las abuelas del sur: persianas de día, ventanas de noche, ventilador. Mide la diferencia en tu descanso y tu factura."],"quiz":[{"pregunta":"¿Qué hay que hacer con las persianas en verano?","opciones":["Bajarlas en las horas de sol: el sol directo es un radiador indeseado","Subirlas para que entre luz","Da igual"],"correcta":0,"porque":"El sol a través del cristal calienta como una estufa: la sombra es el primer aire acondicionado."},{"pregunta":"¿A qué temperatura conviene poner el aire acondicionado?","opciones":["25-26 °C: cada grado menos suma un 8% a la factura","18 °C","30 °C"],"correcta":0,"porque":"Vestirse ligero y 26 grados es confort de verdad; el contraste brusco con la calle además resfria."},{"pregunta":"¿Por qué la ducha antes de dormir debe ser templada y no fría?","opciones":["Porque el frío hace que el cuerpo reaccione generando calor","Porque el agua fría daña la piel","Da igual"],"correcta":0,"porque":"La ducha templada dilata los vasos y el cuerpo suelta calor; la fría provoca el efecto contrario."}]},{"titulo":"Combatir el frío: calentar personas, no habitaciones","contenido":["El frío se combate en capas: tres finas (interior que transpira, media que aísla, exterior que corta el viento) calientan más que una gruesa, porque el aire atrapado entre capas es el verdadero aislante. En casa: calcetines, zapatillas y una manta en el sofá valen por dos grados de calefacción. La cabeza, manos y pies fríos hacen sentir frío todo el cuerpo.","Calentar a la persona cuesta céntimos; calentar la casa, euros. Manta eléctrica o bolsa de agua caliente en la cama (el lecho frío es lo que más cuesta), alfombra sobre suelo frío, cortinas gruesas cerradas al anochecer (una ventana desnuda es un agujero de frío) y puertas cerradas para calentar solo la habitación que usas.","La calefacción eficiente: a 19-21 °C de día y 17 de noche; cada grado de más es un 7% más de factura. Purgar los radiadores al empezar el invierno (el aire dentro los deja a media potencia), no taparlos con muebles ni ropa, y el truco del termostato: bajarlo no calienta más lento, solo calienta menos.","Reto: baja un grado el termostato y añade una capa de ropa durante una semana. El bolsillo notará lo que el cuerpo apenas percibe."],"quiz":[{"pregunta":"¿Qué calienta más: una capa gruesa o tres finas?","opciones":["Tres finas: el aire atrapado entre capas es el verdadero aislante","Una gruesa","Da igual"],"correcta":0,"porque":"El aire es el aislante: las capas lo atrapan. Es el principio del plumas y de la lana."},{"pregunta":"¿Cuál es la forma más barata de estar caliente en casa?","opciones":["Calentar a la persona: manta, calcetines, ropa de abrigo","Subir la calefacción","Abrir el horno"],"correcta":0,"porque":"Calentar metros cúbicos de aire cuesta euros; una manta y calcetines, céntimos."},{"pregunta":"¿Para qué se purgan los radiadores?","opciones":["Para sacar el aire atrapado que los deja a media potencia","Para que huelan bien","Para gastar más"],"correcta":0,"porque":"El aire dentro impide que circule el agua caliente: purgar al inicio del invierno es mantenimiento gratis."}]},{"titulo":"Electrodomésticos y hábitos: la factura domada","contenido":["El mapa del consumo doméstico: la calefacción y el agua caliente son la mitad de la factura; luego la nevera (24 horas, 365 días: la única que nunca descansa), la cocina, la lavadora y la tele. Atacar en ese orden: bajar un grado el termostato vale más que un año de LEDs.","Hábitos que suman: lavadora a 30 °C y a carga completa (el 80% de su consumo es calentar el agua), lavavajillas mejor que fregar a mano con grifo abierto (gasta menos agua caliente), tapar las ollas (hierven antes), apagar el fuego cinco minutos antes (el calor residual cocina), y la nevera lejos del horno y sin hielo en las paredes.","La etiqueta energética (A a G) es el mapa del tesoro al comprar: un frigorífico A+++ gasta la mitad que uno de hace 15 años. Y el termo eléctrico, el segundo vampiro de la casa: programarlo o bajarlo a 50-55 °C ahorra sin notarse.","Reto: lee tu factura y calcula cuánto te cuesta cada aparato grande al mes (vatios × horas × precio). El que más te sorprenda, ese es tu objetivo."],"quiz":[{"pregunta":"¿Qué dos cosas consumen la mitad de la energía doméstica?","opciones":["La calefacción y el agua caliente","La tele y el ordenador","Las luces"],"correcta":0,"porque":"Calentar aire y agua cuesta mucho más que cualquier pantalla: atacar la factura empieza ahí."},{"pregunta":"¿Por qué conviene lavar a 30 °C?","opciones":["Porque el 80% del consumo de la lavadora es calentar el agua","Porque la ropa lo pide","Por tradición"],"correcta":0,"porque":"Los detergentes modernos funcionan en frío: lavar templado ahorra sin perder limpieza."},{"pregunta":"¿Qué dice la etiqueta energética al comprar un electrodoméstico?","opciones":["Cuánto consume en su clase: la A es la más eficiente","El color disponible","El peso"],"correcta":0,"porque":"Un frigorífico eficiente devuelve la diferencia de precio en pocos años de factura."}]}],"nivel":"basico"},{"id":"soledad","titulo":"La soledad: entenderla y habitarla","icono":"🤝","lecciones":[{"titulo":"La soledad: qué es y qué no es","contenido":["La soledad no es estar solo: es sentirse solo. Hay quien vive rodeado de gente y se siente invisible, y quien vive solo y está en paz. La soledad no deseada es una señal, como el hambre: el cuerpo avisando de que falta conexión. Y es común: en las encuestas, una de cada cuatro personas la reconoce. No es un defecto: es una condición humana.","Los psicólogos distinguen soledad elegida (retiro, descanso, espacio propio: sana y necesaria) de soledad impuesta (aislamiento, duelo, mudanzas, jubilación, rupturas). La primera nutre; la segunda, si se prolonga, pesa sobre la salud igual que el tabaco leve: la ciencia lo ha medido.","La soledad se combate como el frío: no esperando a que pase, sino saliendo a su encuentro con capas pequeñas. Y tiene una paradoja: se cura menos buscando compañía que ofreciéndola. Quien ayuda, quien cuida, quien pregunta, deja de ser invisible.","Reto: escribe hoy tres nombres de personas que te importan y que hace tiempo que no saludas. Esa lista es el punto de partida."],"quiz":[{"pregunta":"¿Qué es la soledad realmente?","opciones":["Un sentimiento de falta de conexión, no el hecho de estar solo","Estar en casa","Una enfermedad"],"correcta":0,"porque":"Se puede estar solo y en paz, o rodeado de gente y solo: la soledad es la señal, no la geografía."},{"pregunta":"¿Qué diferencia hay entre la soledad elegida y la impuesta?","opciones":["La elegida nutre y descansa; la impuesta, prolongada, daña la salud","Son iguales","La elegida es peor"],"correcta":0,"porque":"El retiro propio es un regalo; el aislamiento sufrido, una carga medible por la ciencia."},{"pregunta":"¿Cuál es la paradoja de la soledad?","opciones":["Se cura más ofreciendo compañía que buscándola","Se cura con tele","No se cura"],"correcta":0,"porque":"Quien ayuda y pregunta deja de ser invisible: dar conexión es la forma más rápida de recibirla."}]},{"titulo":"Pequeños pasos: reconstruir la conexión","contenido":["La conexión se construye como un músculo: con repeticiones pequeñas, no con hazañas. El primer escalón es el contacto ligero: saludar al vecino, hablar con el del mercado, llamar a un familiar cinco minutos. La ciencia lo confirma: las conversaciones breves con desconocidos amables mejoran el día mediblemente.","El segundo escalón es la rutina compartida: la clase semanal, el grupo de senderismo, la biblioteca, el voluntariado. La clave no es la actividad sino la repetición: ver a las mismas caras cada semana convierte extraños en conocidos y conocidos en amigos. La amistad adulta es, sobre todo, asistencia.","El tercer escalón es la conversación de verdad: pasar del 'qué tal' al 'cómo estás de verdad'. Preguntar y escuchar, contar algo propio sin miedo. La cercanía se construye turnándose en mostrarse: quien da el primer paso suele descubrir que el otro también esperaba.","Reto: esta semana, tres contactos ligeros y una llamada de verdad a alguien de tu lista. Apunta cómo te sentiste después: el cuerpo aprende por evidencia."],"quiz":[{"pregunta":"¿Cuál es el primer escalón contra la soledad?","opciones":["Contactos ligeros: saludar, charlar un minuto, llamar cinco minutos","Mudarse de ciudad","Esperar a que llamen"],"correcta":0,"porque":"Las conversaciones breves con desconocidos amables mejoran el día: la ciencia lo ha medido."},{"pregunta":"¿Qué convierte extraños en amigos en la vida adulta?","opciones":["La repetición: ver las mismas caras cada semana","La suerte","Las redes sociales"],"correcta":0,"porque":"La amistad adulta es asistencia: la rutina compartida teje lo que el azar no teje."},{"pregunta":"¿Qué distingue la conversación de verdad?","opciones":["Preguntar, escuchar y mostrarse uno mismo por turnos","Haber mucho","Contar chistes"],"correcta":0,"porque":"La cercanía se construye turnándose en mostrarse: quien da el primer paso descubre que el otro esperaba."}]},{"titulo":"Estar bien contigo: la soledad habitada","contenido":["Estar solo sin estar mal es una habilidad que se entrena. Las rutinas son el armazón: horarios de comida y sueño, una caminata diaria, un proyecto entre manos (plantas, cocina, un idioma, ese curso). El día con estructura es un día con suelo; el día sin forma es donde la soledad hace nido.","La mente en soledad tiende a rumiar: dar vueltas al mismo pensamiento como un hámster. Cortar la rumia tiene técnica: nombrar el pensamiento ('estoy dándole vueltas otra vez'), cambiar de actividad física (lavar platos, caminar), y la regla de oro de no tomar decisiones grandes ni juzgar tu vida en las noches malas.","Cuidar algo es el antídoto más antiguo: una planta, una mascota, una huerta en macetas, un proyecto. Ser necesitado por algo vivo reordena el día y da sentido que no depende de nadie más. Los estudios sobre mascotas y soledad son concluyentes: acompañan, estructuran y obligan a salir.","Reto: diseña tu 'día con suelo': hora de levantarte, una salida a la calle, una tarea de proyecto y una llamada. Escríbelo y pruébalo mañana."],"quiz":[{"pregunta":"¿Qué da estructura a un día en soledad?","opciones":["Las rutinas: horarios, una caminata, un proyecto","La tele todo el día","Dormir más"],"correcta":0,"porque":"El día con estructura es un día con suelo: la soledad anida en los días sin forma."},{"pregunta":"¿Cómo se corta la rumia mental?","opciones":["Nombrando el pensamiento, cambiando de actividad física y no decidir de noche","Dándole más vueltas","Con dulces"],"correcta":0,"porque":"Nombrar la rumia la desactiva, el cuerpo en movimiento la interrumpe, y la noche mala no es juez."},{"pregunta":"¿Por qué cuidar algo vivo combate la soledad?","opciones":["Porque ser necesitado estructura el día y da sentido propio","Porque gasta dinero","No la combate"],"correcta":0,"porque":"Una planta o una mascota reordena la vida: el antídoto más antiguo y más medido por la ciencia."}]},{"titulo":"Cuándo pedir ayuda (y que eso es fortaleza)","contenido":["Hay señales de que la soledad se ha hecho pesada: semanas sin ganas de nada, sueño y apetito revueltos, tristeza que no se mueve, dejar de contestar, dejar de arreglarse. Cuando la soledad se convierte en ese barro, ya no es solo soledad: puede ser depresión, y la depresión se trata y se cura.","Pedir ayuda no es rendirse: es exactamente lo contrario. El primer paso suele ser el médico de cabecera (sí, también para esto: la salud mental es salud), y los pasos siguientes, la terapia psicológica y, si hace falta, más apoyo. España tiene además el 024, línea de atención a la conducta suicida, gratuita y 24 horas: hablar salva.","Y hay ayuda intermediaria y amable: los grupos de apoyo, los teléfonos de la amistad para mayores, los centros de participación, la parroquia o la asociación del barrio. El aislamiento crece en el silencio; nombrarlo delante de alguien es ya la mitad del camino de vuelta.","Reto: guarda en el móvil el número de un amigo, el de tu médico y el 024. Tener a mano la ayuda antes de necesitarla es la preparación del valiente."],"quiz":[{"pregunta":"¿Qué señales indican que la soledad se ha hecho pesada?","opciones":["Semanas sin ganas, sueño y apetito revueltos, tristeza inmóvil","Un día de lluvia","Quedarse en casa un fin de semana"],"correcta":0,"porque":"Cuando el barro no se mueve en semanas, puede ser depresión: y la depresión se trata y se cura."},{"pregunta":"¿Cuál es el primer paso para pedir ayuda profesional en España?","opciones":["El médico de cabecera: la salud mental también es salud","Ir a urgencias sin más","Esperar años"],"correcta":0,"porque":"El médico de cabecera deriva y acompaña: pedir hora para esto es tan legítimo como para la espalda."},{"pregunta":"¿Qué es el 024?","opciones":["La línea gratuita y 24 horas de atención a la conducta suicida","Una farmacia","Un taxi"],"correcta":0,"porque":"Hablar salva: el 024 está para las noches más oscuras, gratis y siempre abierto."}]}],"nivel":"basico"},{"id":"sexualidad","titulo":"Sexualidad y bienestar","icono":"🧡","lecciones":[{"titulo":"La masturbación: normal, sana y humana","contenido":["La masturbación es una conducta humana normal y universal: la practican la inmensa mayoría de hombres y mujeres a lo largo de la vida, y la medicina la considera parte saludable de la sexualidad. No causa ceguera, ni granos, ni pérdida de fuerza: esos mitos nacieron  La excitación es una ola que sube, baja y vuelve a subir; aprender a surfearla (acercarse al punto alto y dejarla bajar, varias veces) alarga el placer y entrena el control. Los sexólogos llaman a esto 'edging' o control de la meseta, y es la base del trabajo terapéutico sobre la eyaculación precoz.","Para ellas: la mayoría de las mujeres necesitan estimulación clitoriana para llegar al orgasmo (el clítoris tiene el doble de terminaciones nerviosas que cualquier otra zona): manos, presión y ritmo constante suelen funcionar mejor que la prisa o la penetración sola. El lubricante, con agua de base, mejora todo y evita irritaciones. Para ellos: variar presión, ritmo y pausas enseña al cuerpo a no correr siempre al final.","El ambiente también es técnica: intimidad sin interrupciones, sin culpa y sin el teléfono. La respiración lenta (exhalar largo) mantiene la excitación manejable; la respiración entrecortada la dispara. Y la regla de higiene básica: manos limpias, uñas cortas y, si hay juguetes, lavados antes y después según su material.","Reto: la próxima vez, practica una sola cosa: respirar lento y sin prisa durante todo el proceso. La diferencia entre mecánica y placer suele ser solo eso."],"quiz":[{"pregunta":"¿Qué es el control de la meseta o 'edging'?","opciones":["Acercarse al punto alto y dejar bajar la excitación varias veces","Ir deprisa","Una enfermedad"],"correcta":0,"porque":"Surfear la ola enseña control y alarga el placer: es la base de la terapia para la eyaculación precoz."},{"pregunta":"¿Qué necesita la mayoría de las mujeres para llegar al orgasmo?","opciones":["Estimulación clitoriana, con ritmo y sin prisa","Solo penetración","Silencio absoluto"],"correcta":0,"porque":"El clítoris es el centro del placer femenino: la ciencia lleva décadas diciéndolo."},{"pregunta":"¿Qué papel juega la respiración?","opciones":["Exhalar largo mantiene la excitación manejable; la respiración entrecortada la dispara","Ninguno","Hay que aguantarla"],"correcta":0,"porque":"La respiración es el mando a distancia del sistema nervioso: lenta calma, rápida acelera."}]},{"titulo":"Mente, culpa y pareja: el lado humano","contenido":["La culpa es el invitado más frecuente y menos útil: generaciones educadas en la vergüenza arrastran una incomodidad que no les pertenece. La sexología moderna es clara: el deseo propio no es sucio ni egoísta; es parte del equipamiento humano. Soltar la culpa no es libertinaje: es higiene mental.","En pareja, la masturbación no compite con el sexo compartido: lo complementa. Cada uno sigue siendo dueño de su cuerpo y de su deseo; hablarlo sin drama ('a veces me apetece a solas') evita malentendidos tontos. Y la masturbación mutua es, además, una forma de intimidad que enseña al otro lo que a uno le gusta: comunicación sin palabras.","El porno merece un capítulo aparte: es ficción con actores, no educación. Usado con conciencia puede ser un estímulo más; usado como manual, deforma las expectativas (cuerpos, duraciones, reacciones) y, en exceso, puede acostumbrar al cerebro a estímulos cada vez más intensos. La vida real es más lenta, más torpe y mucho mejor.","Reto: si tienes pareja, practica decir en voz alta una preferencia tuya sin vergüenza. La comunicación sexual es la técnica más efectiva que existe."],"quiz":[{"pregunta":"¿Qué dice la sexología sobre la culpa asociada al deseo propio?","opciones":["Que es heredada e inútil: soltarla es higiene mental","Que hay que tenerla","Que es útil"],"correcta":0,"porque":"Generaciones educadas en la vergüenza arrastran una incomodidad que no les pertenece: soltarla es sano."},{"pregunta":"¿La masturbación compite con el sexo en pareja?","opciones":["No: lo complementa y puede mejorar la comunicación","Sí, siempre","Solo los martes"],"correcta":0,"porque":"Cada uno es dueño de su deseo; hablarlo sin drama evita malentendidos y enseña lo que gusta."},{"pregunta":"¿Qué problema tiene usar el porno como manual?","opciones":["Deforma expectativas de cuerpos, tiempos y reacciones: es ficción, no educación","Ninguno","Que es caro"],"correcta":0,"porque":"El porno es cine con actores: como estímulo consciente, vale; como escuela, desinforma."}]},{"titulo":"La anatomía del placer: el mapa que nadie enseñó","contenido":["El placer tiene anatomía y durante siglos fue el territorio menos cartografiado de la medicina. El clítoris, cuya estructura completa solo se describió en 1998, es un órgano de unos 10 centímetros con la mayor parte interna: el botón visible es la punta del iceberg. Su única función conocida es dar placer: no hay otro órgano humano así. En el hombre, el glande concentra la sensibilidad, y la próstata es su punto intenso interno.","Las zonas erógenas no son mitología: son piel con más terminaciones nerviosas (labios, cuello, orejas, pezones, cara interna de los muslos). Y el órgano sexual más grande es la piel entera, gobernada por el cerebro: la excitación nace en la cabeza mucho antes que en el cuerpo. Por eso el cansancio, el enfado o la prisa son anticonceptivos del deseo.","El ciclo de la respuesta sexual tiene cuatro fases: deseo, excitación, meseta y orgasmo, con su resolución. Conocer el propio ciclo (cuánto tiempo necesitas, qué lo frena, qué lo acelera) es la diferencia entre ir a ciegas y conducir. Los cuerpos no vienen con manual: se aprenden.","Reto: lee sobre la anatomía del clítoris o de la próstata en una fuente seria (un manual de medicina, no un foro). Conocer el mapa es la primera técnica."],"quiz":[{"pregunta":"¿Cuándo se describió la estructura completa del clítoris?","opciones":["En 1998: la medicina lo cartografió tarde","En la antigua Grecia","En 1850"],"correcta":0,"porque":"Un órgano de 10 cm, mayormente interno, descrito por completo hace apenas una generación."},{"pregunta":"¿Cuál es el órgano sexual más grande del cuerpo?","opciones":["La piel entera, gobernada por el cerebro","Los genitales","Las manos"],"correcta":0,"porque":"La excitación nace en la cabeza: por eso el cansancio y la prisa son enemigos del deseo."},{"pregunta":"¿Cuáles son las fases de la respuesta sexual?","opciones":["Deseo, excitación, meseta y orgasmo","Solo el orgasmo","Apertura y cierre"],"correcta":0,"porque":"El ciclo descrito por Masters y Johnson: conocerlo es conducir en lugar de ir a ciegas."}]},{"titulo":"El consentimiento: la base de todo","contenido":["El consentimiento es la primera y última regla: solo un sí entusiasta es un sí. No es un trámite: es la condición sin la cual no hay sexualidad sana, y además es ley en España desde 2022 ('solo sí es sí'). El silencio, la duda, la parálisis o el alcohol de más no son un sí. Y el sí se puede retirar en cualquier momento: lo que empezó bien puede parar, y parar es respeto.","El consentimiento sano es continuo y específico: preguntar ('¿te gusta?', '¿seguimos?') no rompe el clima; lo construye. Las parejas que hablan tienen mejor vida sexual, y la investigación lo confirma una y otra vez: la comunicación es el afrodisíaco más documentado que existe.","La presión no es seducción: insistir hasta que el otro cede, usar la culpa ('si me quisieras...') o la comparación es coacción, aunque no haya fuerza. Y a la inversa: nadie debe nada sexual a nadie, ni siquiera a su pareja de años. El deseo se comparte, no se cobra.","Reto: practica la pregunta amable: la próxima vez, pregunta en voz alta qué le gusta al otro. La comunicación es técnica, no poesía."],"quiz":[{"pregunta":"¿Qué cuenta como consentimiento válido?","opciones":["Solo un sí claro y entusiasta, que puede retirarse en cualquier momento","El silencio","No decir que no"],"correcta":0,"porque":"El silencio, la duda o la parálisis no son un sí: la ley española lo dejó escrito en 2022."},{"pregunta":"¿Qué dice la investigación sobre preguntar durante el sexo?","opciones":["Que las parejas que hablan tienen mejor vida sexual: no rompe el clima, lo construye","Que hay que callar","Que da vergüenza y no se hace"],"correcta":0,"porque":"La comunicación es el afrodisíaco más documentado: preguntar es técnica, no torpeza."},{"pregunta":"¿Qué es la coacción sexual en pareja?","opciones":["Insistir, culpabilizar o presionar hasta que el otro cede","Pedir un beso","Enamorarse"],"correcta":0,"porque":"La presión sin fuerza también es coacción: el deseo se comparte, nunca se cobra."}]},{"titulo":"Las primeras veces y los nervios","contenido":["Los nervios son la constante universal: la primera vez de cada cosa (primer beso, primera vez, primera vez con alguien nuevo) viene con el corazón acelerado. Y la ansiedad es el interruptor del cuerpo: en los hombres puede apagar la erección, en las mujeres la lubricación y el orgasmo. No es fallo: es fisiología. La respuesta correcta es la calma, el humor y seguir jugando sin meta.","El rendimiento es una trampa mental: convertir el sexo en un examen ('¿estaré bien?', '¿le gustaré?') saca a la mente del cuerpo, y el sexo ocurre en el cuerpo. Los terapeutas lo llaman 'rol de espectador' y es la primera causa de los tropiezos: la receta es volver a los sentidos: lo que huele, lo que se siente, la respiración del otro.","Los tropiezos son estadística, no veredicto: la eyaculación más rápida de lo deseado, la erección que no llega, el orgasmo que se esconde: les pasa a casi todos, casi siempre por nervios, cansancio o alcohol. Se convierten en problema solo cuando la vergüenza impide hablarlo. Nombrarlo en voz baja ('estoy nervioso') desactiva la mitad del problema.","Reto: aprende la frase mágica contra los nervios: 'vamos sin prisa, esto es para disfrutar'. Dicho en serio, cambia cualquier escena."],"quiz":[{"pregunta":"¿Qué hace la ansiedad con la respuesta sexual?","opciones":["Puede apagar la erección, la lubricación o el orgasmo: es fisiología, no fallo","Nada","La mejora"],"correcta":0,"porque":"El sistema nervioso del estrés apaga el del placer: son incompatibles por diseño."},{"pregunta":"¿Qué es el 'rol de espectador'?","opciones":["Observarse y evaluarse durante el sexo en lugar de sentir: saca a la mente del cuerpo","Ver películas","Una técnica avanzada"],"correcta":0,"porque":"Convertir el sexo en examen lo suspende: la receta es volver a los sentidos."},{"pregunta":"¿Qué se hace cuando algo no funciona?","opciones":["Nombrarlo con calma y humor, y seguir sin meta","Callar y huir","Culparse"],"correcta":0,"porque":"Los tropiezos son estadística universal: la vergüenza los agranda, nombrarlos los encoge."}]},{"titulo":"El sexo seguro: protegerse es quererse","contenido":["Las infecciones de transmisión sexual no avisan: la clamidia o el VPH pueden no dar síntomas durante años mientras se contagian. El preservativo, bien puesto desde el principio (no 'a mitad'), es la barrera que protege de casi todas: VIH, clamidia, gonorrea, sífilis. Con los fluidos no se negocia: la confianza no mata virus, el látex sí.","El VPH merece capítulo aparte: es tan común que casi toda persona sexualmente activa lo encontrará, y algunas cepas causan cáncer de cuello de útero. La vacuna existe, es gratuita en España para adolescentes y cada vez se ofrece a más edades. Las revisiones ginecológicas (citologías) y las pruebas de ITS tras cambios de pareja son mantenimiento, no sospecha.","La anticoncepción es un menú: preservativo (el único que protege de ITS), píldora y otros hormonales (eficaces pero con receta y revisión), el DIU (el olvido no es opción), y los métodos naturales (poco fiables: el calendario falla más de lo que promete). La píldora del día después es para emergencias, no para método: su nombre lo dice.","Reto: si hay vida sexual activa, revisa cuándo fue tu última prueba de ITS o citología. Ponerla al día es el gesto de cuidado más concreto que existe."],"quiz":[{"pregunta":"¿Por qué el preservativo debe ponerse desde el principio?","opciones":["Porque las ITS se contagian también antes de la eyaculación","Por comodidad","Da igual cuándo"],"correcta":0,"porque":"Los fluidos previos ya contagian: 'a mitad' es casi como no usarlo."},{"pregunta":"¿Qué es el VPH y qué lo previene?","opciones":["Un virus muy común con cepas cancerígenas; lo previene la vacuna","Una bacteria","Un hongo"],"correcta":0,"porque":"La vacuna contra el VPH previene cánceres: de los pocos gestos médicos que pueden decir eso."},{"pregunta":"¿Qué método protege a la vez de embarazo e ITS?","opciones":["El preservativo: es el único de doble protección","La píldora","El calendario"],"correcta":0,"porque":"Los hormonales evitan embarazo pero no infecciones: solo la barrera hace ambas cosas."}]},{"titulo":"El deseo a lo largo de la vida","contenido":["El deseo no es un grifo: es una marea. Sube y baja con la edad, el estrés, los hijos, la salud y las temporadas. Las parejas largas no tienen menos deseo por defecto: tienen el mismo deseo con menos novedad, y la novedad se puede fabricar: cambiar de escenario, de hora, de plan. La rutina mata más pasiones que la edad.","Con los años el sexo cambia de deporte a paseo, y ganan muchos: más lentitud, más juego, menos obsesión por la meta. La menopausia trae sequedad (solución sencilla: lubricantes y tiempo), y la edad masculina trae erecciones menos automáticas (solución: más estimulación directa y menos prisa). Los cuerpos cambian; el placer se adapta.","Las discrepancias de deseo en pareja (uno quiere más, otro menos) son la consulta más común de los sexólogos. La clave no es el promedio sino la negociación amable: hablarlo sin culpables, buscar el punto medio y entender que el deseo del otro no es un rechazo a ti. La mayoría de las veces, el problema no es el sexo: es la conversación que falta.","Reto: si hay pareja, propón un cambio de rutina pequeño esta semana: otra hora, otro lugar de la casa, algo nuevo. La novedad es el combustible del deseo."],"quiz":[{"pregunta":"¿Qué mata más pasiones en parejas largas?","opciones":["La rutina: el deseo necesita novedad, y la novedad se fabrica","La edad","Los hijos solamente"],"correcta":0,"porque":"El deseo es marea, no grifo: cambiar escenario, hora y plan es avivar el fuego."},{"pregunta":"¿Cómo cambia el sexo con la edad?","opciones":["De deporte a paseo: más lentitud y juego, menos obsesión por la meta","Desaparece","Empeora siempre"],"correcta":0,"porque":"Los cuerpos cambian y el placer se adapta: muchos ganan en calidad lo que pierden en velocidad."},{"pregunta":"¿Cuál es la consulta más común de los sexólogos?","opciones":["Las diferencias de deseo dentro de la pareja","Los juguetes","Las posturas"],"correcta":0,"porque":"Uno quiere más, otro menos: se negocia hablando sin culpables, no con promedios."}]},{"titulo":"El juego: variedad, fantasía y ternura","contenido":["El sexo memorable es menos técnica y más atención: el juego previo no es el preliminar del plato principal, es gran parte del banquete. Besos, caricias, palabras y tiempo: el cuerpo entero es el escenario, y los genitales llegan al final, no al principio. Quien se salta el juego se salta el sexo.","Las fantasías son normales y universales: la imaginación erótica es el juguete más antiguo. Compartirlas (sin obligación de cumplirlas) es intimidad de alto nivel; cumplir alguna, si ambos quieren, es aventura. Los juguetes, los juegos de rol, los escenarios: todo vale si hay dos síes y buen humor.","Y está lo que los manuales olvidan: la ternura. Reírse cuando algo sale torpe, abrazarse después, quedarse un rato: el 'después' es donde se cosecha lo sembrado. El sexo es, en el fondo, dos personas haciéndose sentir bien: todo lo demás es decoración.","Reto: la próxima vez, dobla el tiempo del juego previo y quítale la meta. La diferencia entre trámite y banquete suele ser solo esa."],"quiz":[{"pregunta":"¿Qué es el juego previo realmente?","opciones":["Gran parte del banquete, no un trámite antes del plato principal","Una pérdida de tiempo","Opcional"],"correcta":0,"porque":"Besos, caricias y tiempo: el cuerpo entero es el escenario; los genitales llegan al final."},{"pregunta":"¿Qué se dice de las fantasías sexuales?","opciones":["Que son normales y universales; compartirlas sin obligación es intimidad","Que son enfermedad","Que hay que ocultarlas"],"correcta":0,"porque":"La imaginación erótica es el juguete más antiguo: compartirla, con dos síes, es aventura."},{"pregunta":"¿Qué papel juega el 'después'?","opciones":["La ternura y el abrazo cosechan lo sembrado: es parte del sexo","Ninguno","Hay que dormir ya"],"correcta":0,"porque":"Reírse de lo torpe y quedarse un rato: el sexo es dos personas haciéndose sentir bien."}]}],"nivel":"basico","adultos":true},{"id":"moda","titulo":"Moda y vestir bien","icono":"👔","lecciones":[{"titulo":"Vestir bien: las tres reglas que nunca fallan","contenido":["Vestir bien no es seguir la moda: es acertar con tres cosas que no caducan. Primera: el ajuste. Una prenda barata de tu talla sienta mejor que una cara que te quede grande o pequeña; el 80% de 'vestir bien' es que la ropa caiga donde debe (hombro en el hombro, pantalón sin arrugas de sobra).","Segunda: el color. Dos o tres colores por conjunto como máximo, con uno neutro de base (azul marino, gris, beige, blanco, negro) y uno de acento. Los colores que te favorecen dependen de tu tono de piel: pieles cálidas ganan con tierras y dorados, pieles frías con azules y grises. El espejo con luz de día es el único juez fiable.","Tercera: el estado. Ropa limpia, planchada, sin bolitas ni zurcidos visibles, zapatos limpios. Un conjunto humilde bien mantenido gana siempre a uno caro descuidado. La gente recuerda el estado general mucho más que la marca.","Reto: haz el test del ajuste con tu prenda favorita: ¿el hombro de la chaqueta cae en tu hombro? ¿El pantalón toca el zapato sin arrastrar? Ajústate eso y habrás subido de nivel sin gastar un euro."],"quiz":[{"pregunta":"¿Cuál es la regla número uno para vestir bien?","opciones":["El ajuste: que la ropa caiga donde debe","La marca","El precio"],"correcta":0,"porque":"El ajuste es el 80% del resultado: una prenda barata de tu talla gana a una cara mal llevada."},{"pregunta":"¿Cuántos colores por conjunto como máximo?","opciones":["Dos o tres, con un neutro de base y uno de acento","Siete","Solo negro"],"correcta":0,"porque":"El neutro da la base, el acento la personalidad: más de tres colores suele ser ruido."},{"pregunta":"¿Qué pesa más que la marca en la impresión general?","opciones":["El estado: ropa limpia, planchada y zapatos cuidados","El logo","El perfume"],"correcta":0,"porque":"La gente recuerda el estado general, no la etiqueta: el cuidado es elegancia gratis."}]},{"titulo":"El armario inteligente: menos, mejor","contenido":["El armario cápsula es la idea madre: pocas prendas que combinan entre sí. Con 10-15 piezas bien elegidas (un vaquero oscuro, un pantalón neutro, camisas lisas, un jersey, una chaqueta versátil, zapatos cómodos y arreglados) se montan decenas de conjuntos. La clave: todo combina con todo porque los colores se eligieron para ello.","Comprar bien es comprar despacio: la pregunta de oro antes de pagar es '¿con qué tres cosas que ya tengo me lo pondría?'. Si no hay respuesta, no entra en casa. Y la cuenta del coste por uso: una chaqueta de 100 € usada 200 veces cuesta 50 céntimos por uso; la camiseta de 8 € usada dos veces, 4 €. Lo barato mal elegido es lo caro.","El mantenimiento alarga vidas: seguir la etiqueta de lavado, lavar del revés y en frío, secar a la sombra, guardar los jerséis doblados (perchados se deforman) y los zapatos con horma o papel. Una prenda bien cuidada dura el triple: la moda más sostenible es la que no se tira.","Reto: haz el inventario: saca todo lo que no te has puesto en un año. Lo que sobre, que entre en la regla de combinar con tres cosas. Dona el resto: armario ligero, cabeza ligera."],"quiz":[{"pregunta":"¿Qué es un armario cápsula?","opciones":["Pocas prendas elegidas para combinar todas entre sí","Un armario pequeño","Ropa de astronauta"],"correcta":0,"porque":"10-15 piezas bien elegidas dan decenas de conjuntos: la clave es la paleta de colores."},{"pregunta":"¿Cuál es la pregunta de oro
