"Tapan el oído con cera","Suben la música al máximo"],"correcta":0,"porque":"Interferencia destructiva: cresta contra valle da silencio."}]},{"titulo":"La luz: la velocidad límite del universo","contenido":["La luz es una onda electromagnética que no necesita aire ni nada para viajar: cruza el vacío del espacio a 300.000 kilómetros por segundo, y nada con masa puede alcanzar esa velocidad. La luz del Sol tarda 8 minutos en llegar; miras el Sol como era hace 8 minutos.","Blanca al ojo, la luz es una mezcla de colores: cada color es una frecuencia distinta. El prisma la descompone porque cada color se desvía un poco distinto. El cielo es azul porque el aire dispersa más el azul que el rojo; al atardecer la luz cruza más aire, pierde el azul y queda el rojo.","La reflexión y la refracción gobiernan los espejos y las lentes: al pasar del aire al agua la luz cambia de velocidad y se tuerce, por eso la pajita parece doblada y por eso funcionan las gafas y las lupas.","La luz también se comporta como partícula, el fotón: paquetes indivisibles de energía. El efecto fotoeléctrico (la luz arranca electrones del metal solo si su color tiene suficiente energía, aunque haya poca) le valió el Nobel a Einstein, no la relatividad."],"quiz":[{"pregunta":"¿A qué velocidad viaja la luz en el vacío?","opciones":["Unos 300.000 km/s, y nada con masa la alcanza","Como el sonido","Depende de la linterna"],"correcta":0,"porque":"Es la velocidad límite del universo: la luz solar tarda 8 minutos en llegar."},{"pregunta":"¿Por qué es azul el cielo?","opciones":["El aire dispersa más la luz azul que la roja","Porque el mar se refleja","Por pintura atmosférica"],"correcta":0,"porque":"La dispersión de Rayleigh: el azul rebota por todas partes y llena el cielo."},{"pregunta":"¿Qué mostró el efecto fotoeléctrico?","opciones":["Que la luz llega en paquetes de energía, los fotones","Que el metal es imán","Que la luz pesa"],"correcta":0,"porque":"Solo la frecuencia importa, no la cantidad de luz: la prueba de que la luz es granular."}]},{"titulo":"El átomo y la física cuántica: las reglas pequeñas","contenido":["Todo lo que tocas son átomos: un núcleo diminuto (protones y neutrones) con electrones alrededor. Si el átomo fuera un estadio, el núcleo sería una cereza en el centro: casi todo es vacío. Y sin embargo no atraviesas la silla, porque las repulsiones eléctricas de los electrones te sostienen.","A escala atómica las reglas cambian por completo: la física cuántica. Los electrones no tienen posiciones exactas sino nubes de probabilidad; ocupan solo ciertos niveles de energía, como peldaños de una escalera, y saltan entre ellos absorbiendo o emitiendo luz de colores exactos. Por eso cada elemento tiene su propia huella de colores, y así sabemos de qué están hechas las estrellas.","El principio de incertidumbre de Heisenberg dice que no se pueden conocer a la vez la posición y la velocidad exactas de una partícula: no es falta de buenos instrumentos, es una propiedad de la naturaleza. En el mundo pequeño, la certeza total está prohibida.","La cuántica no es solo filosofía rara: el láser, el transistor de tu móvil, el LED, la resonancia magnética y el GPS salen de ella. Sin mecánica cuántica no habría electrónica moderna."],"quiz":[{"pregunta":"¿Cómo es el interior de un átomo?","opciones":["Un núcleo diminuto con electrones alrededor: casi todo vacío","Una bolita maciza","Un líquido denso"],"correcta":0,"porque":"El núcleo concentra la masa en una fracción minúscula del volumen."},{"pregunta":"¿Qué dice el principio de incertidumbre?","opciones":["Que posición y velocidad exactas no pueden conocerse a la vez","Que nada se puede medir","Que los átomos no existen"],"correcta":0,"porque":"Es un límite de la naturaleza, no de los instrumentos."},{"pregunta":"¿Por qué cada elemento emite sus colores característicos?","opciones":["Porque sus electrones solo saltan entre niveles de energía fijos","Porque tienen pintura","Por casualidad"],"correcta":0,"porque":"Los niveles cuantizados producen rayas espectrales: el DNI luminoso de cada elemento."}]},{"titulo":"Relatividad especial: el tiempo que se estira","contenido":["En 1905, un empleado de la oficina de patentes de Berna publicó una idea que rompió el sentido común: la velocidad de la luz es la misma para todos los observadores, se muevan como se muevan. Para que eso sea cierto, el tiempo y el espacio tienen que ceder.","Las consecuencias, medidas mil veces, son reales: un reloj que viaja rápido atrasa respecto a uno quieto (los satélites del GPS deben corregirlo cada día o el navegador erraría kilómetros), y los objetos en movimiento se acortan en la dirección del viaje. A velocidades normales el efecto es minúsculo; cerca de la luz, enorme.","De la misma teoría sale la ecuación más famosa: E = mc². Masa y energía son la misma cosa en dos formas, y como c² es un número gigantesco, un gramo de masa guarda la energía de una bomba. El Sol brila convirtiendo masa en luz; las bombas nucleares también, por desgracia.","La relatividad enseña una humildad útil: conceptos que parecían obvios (el tiempo pasa igual para todos) eran solo aproximaciones de nuestra vida lenta y pequeña."],"quiz":[{"pregunta":"¿Qué postulado arranca la relatividad especial?","opciones":["La velocidad de la luz es igual para todos los observadores","La Tierra es el centro","El tiempo es absoluto"],"correcta":0,"porque":"Si la luz no cede, ceden el tiempo y el espacio: toda la teoría sigue de ahí."},{"pregunta":"¿Qué les pasa a los relojes que viajan rápido?","opciones":["Atrasan respecto a los quietos","Se adelantan","Se paran"],"correcta":0,"porque":"La dilatación del tiempo es real: el GPS la corrige a diario."},{"pregunta":"¿Qué dice E = mc²?","opciones":["Que la masa es energía concentrada en cantidad enorme","Que la energía no existe","Que m es un mes"],"correcta":0,"porque":"Con c² tan grande, poca masa equivale a muchísima energía."}]},{"titulo":"Relatividad general: la gravedad como geometría","contenido":["Newton describió la gravedad como una fuerza misteriosa que actúa a distancia. Einstein la explicó de otra manera en 1915: la masa curva el espacio-tiempo, y los objetos simplemente siguen el camino más recto posible por ese espacio curvado. La Tierra no 'tira' de la Luna: la Luna rueda por el hueco que la Tierra hace en la geometría.","La imagen clásica: una lona tensa con una bola pesada en el centro. Las canicas que pasan cerca se desvían por la curva de la lona, no porque la bola las llame. La gravedad es geometría.","La teoría hizo predicciones atrevidas y acertó todas: la luz se curva al pasar junto al Sol (medido en el eclipse de 1919), el tiempo corre más lento cerca de una masa grande, existen los agujeros negros donde la curvatura es tan extrema que ni la luz escapa, y el universo entero se expande.","En 2015 se detectaron ondas gravitacionales: temblores del propio espacio-tiempo producidos por dos agujeros negros que chocaron hace mil millones de años. Escuchamos la geometría vibrar."],"quiz":[{"pregunta":"¿Qué es la gravedad según Einstein?","opciones":["La curvatura del espacio-tiempo producida por la masa","Un imán gigante","El peso del aire"],"correcta":0,"porque":"La masa curva la geometría y los cuerpos siguen esas curvas: no hay fuerza a distancia."},{"pregunta":"¿Qué se midió en el eclipse de 1919?","opciones":["Que la luz de las estrellas se curva al pasar junto al Sol","Que el Sol es verde","Que la Luna es de queso"],"correcta":0,"porque":"Esa observación hizo a Einstein famoso de la noche a la mañana."},{"pregunta":"¿Qué son las ondas gravitacionales?","opciones":["Vibraciones del espacio-tiempo por masas enormes aceleradas","Olas del mar muy grandes","Terremotos lunares"],"correcta":0,"porque":"Detectadas en 2015: choques de agujeros negros que hacen temblar la geometría."}]},{"titulo":"Física nuclear: el fuego del núcleo","contenido":["El núcleo atómico guarda una energía inmensa. Hay dos formas de sacarla: partir núcleos pesados (fisión: el uranio se divide y suelta energía y neutrones que parten más núcleos, una reacción en cadena) o unir núcleos ligeros (fusión: el hidrógeno se funde en helio, la caldera del Sol y de todas las estrellas).","La fisión controlada da electricidad en las centrales nucleares: el calor hierve agua, el vapor mueve turbinas, y al final, como siempre, un imán gira. Sin control, la misma reacción en cadena es una bomba. La física no distingue; las decisiones humanas, sí.","La fusión es el sueño limpio: combustible casi inagotable (el agua del mar) y sin residuos duraderos, pero exige reproducir en la Tierra las condiciones del centro del Sol: cien millones de grados. Lleva décadas 'a treinta años vista', pero los avances recientes son reales.","La radiactividad natural, lejos de ser solo un peligro, es una herramienta: el carbono-14 data huesos y pergaminos, los isótopos radiactivos diagnostican y tratan cánceres, y el calor radiactivo del interior de la Tierra mueve los continentes."],"quiz":[{"pregunta":"¿Qué es la fisión nuclear?","opciones":["Partir núcleos pesados para liberar energía","Unir átomos de hidrógeno","Quemar carbón"],"correcta":0,"porque":"Uranio dividido suelta energía y neutrones que mantienen la cadena."},{"pregunta":"¿De dónde saca el Sol su energía?","opciones":["De la fusión de hidrógeno en helio","De quemar gas","De electricidad"],"correcta":0,"porque":"Las estrellas son calderas de fusión: convierten masa en luz."},{"pregunta":"¿Para qué sirve el carbono-14?","opciones":["Para datar restos antiguos","Para endulzar","Para imantar"],"correcta":0,"porque":"Su decaimiento constante es un reloj que mide la edad de lo que estuvo vivo."}]},{"titulo":"El modelo estándar: las piezas últimas","contenido":["Bajo los protones y neutrones hay otra capa: están hechos de quarks. El modelo estándar, la tabla periódica de lo diminuto, cuenta con 17 partículas fundamentales: quarks y leptones (como el electrón) como ladrillos de la materia, y bosones como mensajeros de las fuerzas.","Hay cuatro fuerzas fundamentales: la gravedad (gobierna planetas), el electromagnetismo (átomos, luz, química, tu mano que no atraviesa la mesa), la fuerza nuclear fuerte (pega los quarks y los núcleos) y la débil (responsable de ciertas desintegraciones radiactivas). Todo lo que te ha pasado en la vida, salvo la gravedad, fue electromagnetismo.","En 2012 se encontró en el CERN la pieza que faltaba: el bosón de Higgs, la partícula asociada al campo que da masa a las demás. Se buscaba desde 1964 y costó la máquina más grande jamás construida, un anillo de 27 kilómetros bajo Suiza y Francia.","El modelo estándar funciona de maravilla pero sabemos que está incompleto: no incluye la gravedad ni explica la materia oscura, esa masa invisible que parece ser cinco veces más abundante que toda la materia que vemos. La física no está acabada: queda lo mejor."],"quiz":[{"pregunta":"¿Qué es el modelo estándar?","opciones":["El catálogo de las partículas fundamentales y sus fuerzas","Una norma de calidad","Un modelo de coche"],"correcta":0,"porque":"17 partículas fundamentales explican toda la materia conocida."},{"pregunta":"¿Cuántas fuerzas fundamentales hay?","opciones":["Cuatro: gravedad, electromagnetismo, fuerte y débil","Dos","Cien"],"correcta":0,"porque":"Todo fenómeno conocido se reduce a esas cuatro interacciones."},{"pregunta":"¿Qué se descubrió en el CERN en 2012?","opciones":["El bosón de Higgs","Un planeta nuevo","El átomo"],"correcta":0,"porque":"La pieza que explica por qué las partículas tienen masa, buscada desde 1964."}]},{"titulo":"Cosmología: la historia del universo","contenido":["El universo tuvo un principio hace unos 13.800 millones de años: el Big Bang, una expansión desde un estado caliente y denso. No fue una explosión en el espacio, sino del espacio mismo. Lo sabemos por tres pruebas independientes: las galaxias se alejan, el fondo de microondas (el resplandor fósil del universo joven) y la proporción de elementos ligeros.","Todo lo que ves es un recuento reciente: el hidrógeno y el helio se cocinaron en los primeros tres minutos; el carbono de tus huesos, el oxígeno que respiras y el hierro de tu sangre se forjaron en estrellas que explotaron antes de que naciera el Sol. Somos literalmente polvo de estrellas.","Y el misterio mayor: todo lo que vemos (estrellas, planetas, personas) es apenas el 5% del universo. El resto es materia oscura (25%), que atrae gravitatoriamente pero no brilla, y energía oscura (70%), que acelera la expansión. Nadie sabe qué son.","La cosmología es la ciencia más humilde: estudia el todo sabiendo que casi todo es desconocido. Y sin embargo ya puede contar la historia completa, del primer segundo a las galaxias, con números que se pueden medir."],"quiz":[{"pregunta":"¿Cuántos años tiene el universo?","opciones":["Unos 13.800 millones","Un millón","Es eterno sin principio"],"correcta":0,"porque":"Tres pruebas independientes fijan la edad y el Big Bang."},{"pregunta":"¿De dónde viene el hierro de tu sangre?","opciones":["De estrellas que explotaron antes de que naciera el Sol","Del núcleo de la Tierra recién hecho","Del oxígeno comprimido"],"correcta":0,"porque":"Los elementos pesados se forjan en estrellas y se reparten en supernovas."},{"pregunta":"¿Qué fracción del universo es materia visible?","opciones":["Apenas el 5%","La mitad","Todo lo que vemos es todo"],"correcta":0,"porque":"El 95% restante es materia oscura y energía oscura: lo desconocido manda."}]}],"nivel":"medio"},{"id":"quimica","titulo":"Química completa","icono":"🧪","lecciones":[{"titulo":"Átomos y la tabla periódica: el alfabeto de la materia","contenido":["Todo lo material, del aire al oro, está hecho combinando apenas un centenar de elementos químicos. Cada elemento es un tipo de átomo, y lo que lo define es su número de protones: 1 para el hidrógeno, 6 para el carbono, 79 para el oro. Cambia el número de protones y cambia el elemento.","La tabla periódica los ordena todos, y no es una lista cualquiera: es un mapa. Los de la misma columna se comportan parecido (todos los de la primera columna explotan en agua; los de la última no reaccionan con nada). La posición de un elemento te dice sus propiedades antes de conocerlo.","Mendeléyev la ordenó en 1869 dejando huecos para elementos aún no descubiertos, y predijo sus propiedades con tal acierto que cuando aparecieron (galio, germanio) la tabla se convirtió en ley. Una buena teoría no solo ordena lo conocido: predice lo desconocido.","Los electrones de la capa externa mandan: son los que tocan a los vecinos y deciden cómo reacciona el átomo. Toda la química es, en el fondo, la negociación de esos electrones exteriores."],"quiz":[{"pregunta":"¿Qué define a un elemento químico?","opciones":["Su número de protones","Su color","Su precio"],"correcta":0,"porque":"El número atómico (protones) es la identidad del elemento: 6 es carbono, 79 es oro."},{"pregunta":"¿Qué comparten los elementos de una misma columna?","opciones":["Comportamientos químicos parecidos","El mismo peso exacto","El olor"],"correcta":0,"porque":"Misma configuración externa de electrones, misma familia de reacciones."},{"pregunta":"¿Qué hizo grande la tabla de Mendeléyev?","opciones":["Predijo elementos y propiedades aún no descubiertos","Era muy bonita","Cabe en un folio"],"correcta":0,"porque":"Dejó huecos y acertó lo que los llenaría: la señal de una teoría verdadera."}]},{"titulo":"Enlaces químicos: por qué los átomos se juntan","contenido":["Los átomos se unen buscando estabilidad, y hay dos estrategias principales. En el enlace iónico, un átomo regala electrones y otro los acepta: quedan cargados con signos opuestos y se atraen. Así nace la sal de mesa: sodio y cloro, dos elementos peligrosos por separado, forman juntos el condimento más tranquilo del mundo.","En el enlace covalente, los átomos comparten electrones en vez de intercambiarlos. Así se unen los dos hidrógenos con el oxígeno en el agua, y así se construyen las moléculas enormes de la vida. El carbono es el rey del covalente: con sus cuatro enlaces hace cadenas, ramas y anillos sin límite.","Entre moléculas hay atracciones más débiles pero decisivas. El puente de hidrógeno, una atracción suave entre moléculas de agua, hace que el agua hierva a 100 °C en vez de a −80 °C como le correspondería. Sin ese enlace débil, los océanos serían vapor y no existiríamos.","Las propiedades de un material salen de sus enlaces: el diamante y el lápiz son ambos carbono puro, pero en el diamante cada átomo está atado a cuatro vecinos en 3D (el material más duro) y en el grafito las capas resbalan entre sí (por eso escribe). Misma materia, distinta arquitectura."],"quiz":[{"pregunta":"¿Qué ocurre en un enlace iónico?","opciones":["Un átomo cede electrones y otro los acepta; luego se atraen","Comparten todo por igual","Se repelen"],"correcta":0,"porque":"Transferencia de electrones más atracción eléctrica: así funciona la sal."},{"pregunta":"¿Qué hace especial al carbono?","opciones":["Sus cuatro enlaces covalentes permiten cadenas y anillos infinitos","Es el más caro","Es el único negro"],"correcta":0,"porque":"Esa versatilidad lo convierte en el ladrillo de toda la química de la vida."},{"pregunta":"Mismo carbono: ¿por qué el diamante es durísimo y el grafito blando?","opciones":["Por la arquitectura de sus enlaces: red 3D contra capas que resbalan","Porque el diamante está limpio","Porque el grafito es más joven"],"correcta":0,"porque":"Las propiedades nacen de la estructura, no solo del ingrediente."}]},{"titulo":"Reacciones y estequiometría: la cocina exacta","contenido":["Una reacción química es un reordenamiento de átomos: se rompen enlaces y se forman otros, pero ningún átomo aparece ni desaparece. Lavoisier lo estableció pesando todo antes y después: la masa total se conserva. Nada se pierde, todo se transforma; esa frase es química contable.","La ecuación química es la receta escrita con símbolos: 2H₂ + O₂ → 2H₂O dice que dos moléculas de hidrógeno y una de oxígeno producen dos de agua. Ajustarla es contar que haya los mismos átomos de cada elemento a ambos lados.","El mol es la unidad del cocinero químico: un mol son 602.000.000.000.000.000.000.000 partículas, y resulta que un mol de cualquier sustancia pesa en gramos lo que su masa molecular. Así, la receta molecular se convierte en gramos de balanza: 2 gramos de hidrógeno con 16 de oxígeno dan 18 gramos de agua.","Con la estequiometría se calcula cuánto fertilizante rinde un campo, cuánto combustible necesita un cohete o cuánta levadura hace subir el pan. Es aritmética con proporciones, la misma de la cocina, pero con átomos."],"quiz":[{"pregunta":"¿Qué se conserva siempre en una reacción química?","opciones":["La masa total: ningún átomo aparece ni desaparece","El color","La temperatura"],"correcta":0,"porque":"Ley de Lavoisier: los átomos solo cambian de pareja, nunca de número."},{"pregunta":"¿Qué es un mol?","opciones":["602 sextillones de partículas: la unidad para contar átomos en gramos","Un animal que cava","Un litro de gas"],"correcta":0,"porque":"El mol traduce el mundo invisible de las moléculas al mundo pesable del laboratorio."},{"pregunta":"¿Qué permite calcular la estequiometría?","opciones":["Cuánto reactivo necesitas y cuánto producto obtienes","El sabor de la comida","El clima"],"correcta":0,"porque":"Es la contabilidad de la reacción: proporciones exactas, como una receta."}]},{"titulo":"Ácidos y bases: la escala del pH","contenido":["Un ácido es una sustancia que suelta protones (H⁺) en agua; una base, la que los recoge. El limón, el vinagre y el yogur son ácidos; el jabón y la lejía son básicos. Juntos se neutralizan: por eso el bicarbonato calma la acidez de estómago.","El pH mide esa acidez en una escala de 0 a 14: 7 es neutro (agua pura), menos de 7 ácido, más de 7 básico. Y es logarítmica: cada paso es diez veces más. Un pH 4 es diez veces más ácido que un 5 y cien veces más que un 6.","La vida es quisquillosa con el pH: tu sangre se mantiene entre 7.35 y 7.45 con sistemas tampón que absorben los excesos; un cambio de medio punto es una emergencia. El suelo del huerto también tiene su pH, y cada planta prefiere el suyo: por eso los arándanos quieren tierra ácida.","Los indicadores son tintes que cambian de color con el pH: la sopa de col lombarda es rosa en vinagre y verde en bicarbonato. Un laboratorio entero cabe en una cazuela."],"quiz":[{"pregunta":"¿Qué es un ácido?","opciones":["Una sustancia que suelta protones H⁺ en agua","Algo dulce","Un metal"],"correcta":0,"porque":"Ácido dona protones, base los recoge: de ahí salen todas sus propiedades."},{"pregunta":"¿Qué significa que el pH sea logarítmico?","opciones":["Que cada unidad es diez veces más ácido o básico","Que se mide con logaritmos de madera","Que no tiene escala"],"correcta":0,"porque":"De pH 6 a pH 4 hay cien veces más acidez, no el doble."},{"pregunta":"¿Por qué el pH de la sangre apenas cambia?","opciones":["Por los sistemas tampón que absorben los excesos de ácido o base","Porque no comemos limón","Por casualidad"],"correcta":0,"porque":"Los amortiguadores químicos mantienen estable lo que la vida necesita fijo."}]},{"titulo":"Oxidación y reducción: el robo de electrones","contenido":["Oxidación no es solo cosa del oxígeno: es perder electrones. Reducción es ganarlos. Siempre ocurren juntas, porque el electrón perdido por uno tiene que recogerlo otro: a la pareja se le llama reacción redox. Truco de memoria: quien se oxida, pierde.","El hierro que se oxida es el ejemplo de todos los días: el hierro cede electrones al oxígeno con ayuda del agua y nace el óxido, esa escama marrón. Pintar, engrasar o galvanizar (cubrir de zinc) es poner barreras o señuelos a ese robo de electrones.","Las redox son las reacciones que nos alimentan y nos mueven: respirar es oxidar azúcar despacio para cosechar su energía; la gasolina que arde es una oxidación rápida. Misma química, distinta velocidad.","Y están en la tecnología fina: los metales se obtienen reduciendo sus minerales (el hierro se reduce del óxido en el alto horno), y el aluminio se protege con una capa de su propio óxido, que a diferencia del del hierro sí sella."],"quiz":[{"pregunta":"¿Qué es oxidarse, químicamente?","opciones":["Perder electrones","Ganar protones","Ponerse marrón"],"correcta":0,"porque":"Oxidación es pérdida de electrones; reducción, ganancia. Siempre en pareja."},{"pregunta":"¿Por qué se oxida el hierro y cómo se evita?","opciones":["Cede electrones al oxígeno con agua; se evita con barreras como pintura o zinc","Porque está triste; no se evita","Por el Sol; con sombra"],"correcta":0,"porque":"Sin contacto con aire y agua, o con un metal señuelo, el robo de electrones se frena."},{"pregunta":"¿Qué tienen en común respirar y quemar gasolina?","opciones":["Ambas son oxidaciones: una lenta y controlada, otra rápida","Nada, son opuestas","Que las dos dan frío"],"correcta":0,"porque":"La respiración celular es una combustión en cámara lenta, paso a paso."}]},{"titulo":"Gases: la ley que gobierna globos y neumáticos","contenido":["Un gas es un enjambre de partículas volando libres y chocando contra todo: la presión es el martilleo de esos choques contra las paredes. El aire que te rodea te aplasta con el peso de una columna de 100 kilómetros de atmósfera, y no lo notas porque tu cuerpo empuja igual hacia afuera.","La ley de los gases ideales, PV = nRT, une presión, volumen y temperatura en una sola frase. De ella salen reglas de sentido común hechas números: si comprimes un gas a la mitad de volumen, la presión se duplica (Boyle); si lo calientas, se expande o sube su presión (por eso el neumático se endurece en verano y por eso no se tira un aerosol al fuego).","El buceo es la lección aplicada más seria: al bajar 10 metros la presión se duplica, el aire se comprime y se disuelve más nitrógeno en la sangre. Subir deprisa es abrir una botella de cava dentro de tus venas: por eso se asciende despacio.","Los globos aerostáticos vuelan por la misma ley al revés: aire caliente, mismo peso en más volumen, menos denso que el aire de fuera, y la flotación de Arquímedes hace el resto."],"quiz":[{"pregunta":"¿Qué es la presión de un gas?","opciones":["El martilleo de sus partículas contra las paredes","Su color","Su olor"],"correcta":0,"porque":"Cada choque molecular empuja un poco; billones de choques por segundo son la presión."},{"pregunta":"Si comprimes un gas a la mitad de volumen a temperatura fija, su presión…","opciones":["se duplica","baja a la mitad","no cambia"],"correcta":0,"porque":"Boyle: presión y volumen van al revés, su producto se mantiene."},{"pregunta":"¿Por qué debe ascender despacio un buzo?","opciones":["Para que el nitrógeno disuelto salga sin formar burbujas en la sangre","Para ver mejor los peces","Por cortesía"],"correcta":0,"porque":"Al bajar la presión, el gas disuelto forma burbujas: la enfermedad de descompresión."}]},{"titulo":"Disoluciones: el arte de mezclar","contenido":["Una disolución es una mezcla perfecta a escala molecular: la sal desaparece en el agua porque las moléculas de agua rodean cada ion y se lo llevan de paseo. No es magia ni desaparición: si evaporas el agua, la sal reaparece entera.","La concentración dice cuánto soluto hay por cantidad de disolución: gramos por litro, o porcentaje. El suero fisiológico es agua con un 0.9% de sal porque así coincide con la salinidad de tus células: más salada o menos salada las dañaría.","Hay un límite, la solubilidad: llega un punto en que el agua no admite más sal y el resto se queda en el fondo. Calentar suele aumentar el límite (por eso el azúcar entra mejor en el café caliente) y enfriar lo baja (por eso cristaliza la miel).","Semejante disuelve a semejante: el agua, que es polar, disuelve sal y azúcar pero no aceite; el aceite se mezcla con grasas. Por eso el jabón es tan listo: cada molécula tiene una cabeza que ama el agua y una cola que ama la grasa, y así arrastra la grasa al agua."],"quiz":[{"pregunta":"¿Qué pasa cuando la sal se disuelve en agua?","opciones":["Las moléculas de agua rodean y separan sus iones","La sal se evapora","El agua se vuelve sal para siempre"],"correcta":0,"porque":"Se dispersa a escala iónica: por eso al evaporar el agua la sal vuelve intacta."},{"pregunta":"¿Por qué el suero lleva exactamente un 0.9% de sal?","opciones":["Para igualar la salinidad de las células y no dañarlas","Por tradición","Porque es más barato"],"correcta":0,"porque":"La isotonía evita que las células se hinchen o se arruguen por ósmosis."},{"pregunta":"¿Cómo limpia el jabón la grasa?","opciones":["Con moléculas de cabeza amante del agua y cola amante de la grasa","Disolviendo la piel","Congelando la grasa"],"correcta":0,"porque":"El jabón es un puente químico entre dos mundos que no se mezclan."}]},{"titulo":"Química orgánica: el imperio del carbono","contenido":["La química orgánica es la química del carbono, y es un mundo aparte porque el carbono hace cadenas, ramas y anillos sin límite: con un solo tipo de átomo como columna vertebral se construyen millones de moléculas distintas, del metano al ADN.","Los hidrocarburos son la familia básica: solo carbono e hidrógeno. El metano (gas natural), la gasolina y el butano son hidrocarburos que queman dando dióxido de carbono, agua y energía. De largos que sean depende si son gas, líquido o cera.","Añade adornos a la cadena (un grupo alcohol, un ácido, un amino) y cambia todo: el etanol emborracha, el vinagre es un ácido, y los aminoácidos se encadenan para formar proteínas. Veinte aminoácidos bastan para construir todas las proteínas de todos los seres vivos.","Las moléculas orgánicas tienen hasta chiralidad: como las manos, pueden ser diestras o zurdas, iguales en fórmula pero imágenes en espejo. Y el cuerpo las distingue: el limón y la naranja huelen distinto en parte por moléculas que son espejo una de otra."],"quiz":[{"pregunta":"¿Qué estudia la química orgánica?","opciones":["Los compuestos del carbono","Solo los órganos del cuerpo","Los metales"],"correcta":0,"porque":"El carbono, por sus cuatro enlaces, sostiene millones de moléculas distintas."},{"pregunta":"¿Qué sale de quemar un hidrocarburo?","opciones":["Dióxido de carbono, agua y energía","Oro","Oxígeno puro"],"correcta":0,"porque":"La combustión completa rompe la molécula y libera su energía."},{"pregunta":"¿Qué es la chiralidad?","opciones":["Moléculas que son imagen en espejo, como las dos manos","Un tipo de cristal","Una enfermedad"],"correcta":0,"porque":"Misma fórmula, distinta orientación: el cuerpo las trata como sustancias diferentes."}]},{"titulo":"Energía y velocidad: termoquímica y cinética","contenido":["Toda reacción tiene una factura energética. Las exotérmicas sueltan calor (la leña que arde, la cal viva al mojarse) y las endotérmicas lo absorben (la bolsa de frío instantáneo del botiquín). Romper enlaces cuesta energía; formarlos la devuelve; la diferencia es el calor de la reacción.","La velocidad de una reacción depende de que las moléculas choquen con fuerza y orientación suficientes: hay una barrera de entrada, la energía de activación, como el puerto de montaña que hay que subir antes de bajar. Por eso el papel no arde solo aunque le convenga energéticamente: necesita la cerilla que le pague la entrada.","Cuatro maneras de acelerar una reacción: subir la temperatura (los choques son más fuertes: por eso la nevera frena el deterioro), concentrar los reactivos (más choques), moler los sólidos (más superficie) y usar un catalizador.","El catalizador es el túnel en la montaña: ofrece un camino más bajo sin consumirse. Las enzimas de tu cuerpo son catalizadores que hacen en milisegundos reacciones que a pelo tardarían años. Sin enzimas, la digestión de esta mañana aún estaría empezando."],"quiz":[{"pregunta":"¿Qué es una reacción exotérmica?","opciones":["La que suelta calor al ocurrir","La que absorbe calor","La que no ocurre"],"correcta":0,"porque":"Formar enlaces nuevos devuelve más energía de la que costó romper los viejos."},{"pregunta":"¿Qué es la energía de activación?","opciones":["La barrera de entrada que hay que superar para que empiece la reacción","La energía de los cables","El calor del fuego"],"correcta":0,"porque":"Por eso hace falta una cerilla para encender papel que 'quiere' arder."},{"pregunta":"¿Qué hace un catalizador?","opciones":["Baja la barrera ofreciendo otro camino, sin consumirse","Añade más reactivo","Enfría todo"],"correcta":0,"porque":"Acelera sin gastarse: las enzimas son los catalizadores de la vida."}]},{"titulo":"Equilibrio químico: el tira y afloja","contenido":["Muchas reacciones no van hasta el final: llegan a un equilibrio donde reactivos y productos convierten unos en otros al mismo ritmo. Nada se para: es un equilibrio dinámico, como dos escaleras mecánicas, una subiendo y otra bajando, con la gente siempre igual repartida.","El principio de Le Chatelier es la regla de oro: si molestas a un sistema en equilibrio, el sistema responde contrarrestando la molestia. Añade más reactivo y se fabrica más producto; aprieta con presión y se desplaza hacia donde ocupa menos; calienta y huye del calor.","Este principio mueve la industria: el amoníaco para fertilizantes (que alimenta a la mitad de la humanidad) se fabrica forzando con presión y temperatura un equilibrio terco. Y mueve tu cuerpo: la hemoglobina suelta el oxígeno justo donde los tejidos lo consumen, porque al retirarlo el equilibrio responde entregando más.","El equilibrio químico enseña una forma de pensar: los sistemas no se agotan en una dirección, negocian. Y quien entiende la negociación puede empujarla a su favor."],"quiz":[{"pregunta":"¿Qué es un equilibrio químico?","opciones":["Un estado donde las reacciones directa e inversa van al mismo ritmo","Una reacción parada","Una balanza rota"],"correcta":0,"porque":"Nada se detiene: simplemente entra tanto producto como el que vuelve atrás."},{"pregunta":"¿Qué dice Le Chatelier?","opciones":["Que el sistema responde contrarrestando cualquier cambio que le impongas","Que todo se detiene","Que la presión no importa"],"correcta":0,"porque":"Molesta al equilibrio y se desplazará en la dirección que compense tu molestia."},{"pregunta":"¿Qué producto, clave para alimentar al mundo, se fabrica forzando un equilibrio?","opciones":["El amoníaco","El vidrio","La sal"],"correcta":0,"porque":"El proceso Haber-Bosch convierte nitrógeno del aire en fertilizante a presión."}]},{"titulo":"Electroquímica: pilas, metales y corrosión","contenido":["La electroquímica es el intercambio entre reacciones químicas y corriente eléctrica. En una pila, una reacción redox se parte en dos: la oxidación ocurre en un electrodo y la reducción en otro, y los electrones se ven obligados a viajar por el circuito externo. Ese viaje forzado es la electricidad que aprovechas.","Una patata o un limón con dos clavos de metales distintos ya es una pila: el zinc se oxida, el cobre se reduce, y entre ambos fluye corriente. Todas las pilas, de la de botón a la del coche eléctrico, son ese mismo truco con mejores materiales.","El proceso inverso existe: meter corriente para forzar una reacción que no quiere ocurrir. Así se recargan las pilas, así se obtiene el aluminio de su mineral (la electrólisis es tan cara en energía que reciclar una lata ahorra el 95%) y así se croma un grifo.","La corrosión es electroquímica en tu contra: el hierro se oxida como en una pila involuntaria. Las soluciones también lo son: pintar corta el circuito, y el galvanizado pone un metal más generoso (el zinc) para que se oxide él primero en tu lugar."],"quiz":[{"pregunta":"¿Cómo produce electricidad una pila?","opciones":["Separa la oxidación de la reducción y obliga a los electrones a viajar por el circuito","Guarda rayos en una caja","Quema papel dentro"],"correcta":0,"porque":"Los electrones de la reacción redox hacen el trabajo eléctrico a su paso."},{"pregunta":"¿Qué es la electrólisis?","opciones":["Forzar con corriente una reacción que no ocurre sola","Un tipo de pilates","La luz del Sol"],"correcta":0,"porque":"Es la pila al revés: se usa para recargar, obtener aluminio o cromar."},{"pregunta":"¿Por qué el galvanizado protege al hierro?","opciones":["Porque el zinc se oxida primero, sacrificándose por él","Porque el zinc es bonito","Porque pesa más"],"correcta":0,"porque":"El metal más reactivo actúa de señuelo electroquímico: ánodo de sacrificio."}]},{"titulo":"Luz y materia: la espectroscopia","contenido":["Cada elemento, al calentarse o excitarse, emite luz solo en sus colores exactos: su espectro. El sodio tiñe la llama de amarillo, el cobre de verde, el estroncio de rojo. Los fuegos artificiales son un examen de química en el cielo.","La espectroscopia consiste en descomponer la luz y leer esas rayas como un código de barras. Con ella se analiza sin tocar: qué contiene un mineral, qué gases hay en una chimenea, si el vino está adulterado. Y con ella se descubrió un elemento en el Sol (el helio) antes de encontrarlo en la Tierra.","Mirando las estrellas, las rayas espectrales aparecen corridas hacia el rojo: el universo se expande y estira la luz en el viaje. La misma técnica que analiza una llama mide galaxias a miles de millones de años luz.","En el laboratorio moderno hay un espectro para cada escala: infrarrojo para los enlaces que vibran, ultravioleta para los electrones que saltan, resonancia magnética para los núcleos. Ver la materia es, literalmente, hacerle preguntas con luz."],"quiz":[{"pregunta":"¿Qué es el espectro de un elemento?","opciones":["Sus colores característicos de emisión, únicos como un código de barras","Un fantasma","Su punto de fusión"],"correcta":0,"porque":"Los electrones solo saltan entre niveles fijos: la luz que emiten delata al elemento."},{"pregunta":"¿Qué elemento se descubrió primero en el Sol?","opciones":["El helio","El oro","El plomo"],"correcta":0,"porque":"Se vio en el espectro solar en 1868 y se encontró en la Tierra 27 años después."},{"pregunta":"¿Cómo sabemos que el universo se expande?","opciones":["Las rayas espectrales de las galaxias se corren hacia el rojo","Porque lo dijo un periódico","Porque las estrellas se apagan"],"correcta":0,"porque":"El corrimiento al rojo es el efecto Doppler aplicado a la luz de galaxias lejanas."}]},{"titulo":"La química de la vida: biomoléculas y polímeros","contenido":["La vida usa cuatro grandes familias de moléculas: azúcares (energía rápida), grasas (energía guardada y membranas), proteínas (las herramientas: enzimas, músculo, anticuerpos) y ácidos nucleicos (ADN y ARN: el manual de instrucciones).","Todas son polímeros: moléculas largas hechas repitiendo piezas pequeñas, como un collar de cuentas. Las proteínas son cadenas de aminoácidos; el ADN, una cadena de cuatro letras (A, T, G, C); el almidón, una cadena de glucosas. La química de la vida es modular: pocas piezas, infinitas combinaciones.","El ADN guarda la información en el orden de sus letras, y su forma de doble hélice es también su sistema de copia: cada hebra sirve de molde para reconstruir la otra. Watson y Crick lo vieron en 1953 gracias a la foto 51 de Rosalind Franklin, cuya aportación se reconoció tarde e injustamente poco.","Los plásticos son polímeros hechos por humanos con la misma idea: repite una pieza miles de veces y obtienes nylon, polietileno o PET. Su virtud y su problema son lo mismo: la naturaleza no tiene enzimas para deshacerlos, así que duran siglos. La química del futuro diseña polímeros que la vida sí sepa digerir."],"quiz":[{"pregunta":"¿Qué cuatro familias de moléculas usa la vida?","opciones":["Azúcares, grasas, proteínas y ácidos nucleicos","Metales y gases","Solo agua"],"correcta":0,"porque":"Con esas cuatro familias se construye todo ser vivo conocido."},{"pregunta":"¿Qué es un polímero?","opciones":["Una molécula larga hecha repitiendo piezas pequeñas","Un metal brillante","Un gas noble"],"correcta":0,"porque":"Proteínas, ADN, almidón y plásticos comparten la misma idea: el collar de cuentas."},{"pregunta":"¿Quién obtuvo la imagen clave para descubrir la doble hélice?","opciones":["Rosalind Franklin","Isaac Newton","Albert Einstein"],"correcta":0,"porque":"Su foto 51 mostró la forma de hélice; el Nobel de 1962 no la incluyó."}]}],"nivel":"medio"},{"id":"anatomia","titulo":"Anatomía del cuerpo humano","icono":"🫀","lecciones":[{"titulo":"El mapa del cuerpo: cómo está organizado","contenido":["El cuerpo humano se organiza por pisos: células forman tejidos, tejidos forman órganos, órganos forman sistemas. Once sistemas principales trabajan en equipo: circulatorio, respiratorio, digestivo, nervioso, óseo, muscular y compañía. Ninguno trabaja solo: el corazón bombea sangre que los pulmones cargan de oxígeno que comió el digestivo.","Para orientarse, la anatomía tiene sus direcciones: superior/inferior (arriba/abajo), anterior/posterior (delante/detrás), medial/lateral (hacia el centro o hacia fuera). Decir 'la herida está en la parte anterior del antebrazo' es ya hablar con precisión médica.","Cifras para asombrarse: unos 37 billones de células, 206 huesos en el adulto, más de 600 músculos, y unos 100.000 kilómetros de vasos sanguíneos: dos vueltas y media a la Tierra dentro de ti.","Reto: nombra en voz alta cinco órganos y di a qué sistema pertenece cada uno. Ubicar es el primer paso para entender."],"quiz":[{"pregunta":"¿Cuál es la escalera de organización del cuerpo?","opciones":["Células → tejidos → órganos → sistemas","Órganos → células → tejidos","Sistemas → nada más"],"correcta":0,"porque":"Cada nivel se construye con el anterior: la célula es el ladrillo de todo."},{"pregunta":"¿Cuántos huesos tiene un adulto?","opciones":["206","86","500"],"correcta":0,"porque":"Nacemos con unos 300 que se van fusionando hasta los 206 del adulto."},{"pregunta":"¿Qué significa 'anterior' en anatomía?","opciones":["Hacia delante del cuerpo","Hacia arriba","Hacia dentro"],"correcta":0,"porque":"Las direcciones anatómicas son el GPS del cuerpo: anterior/posterior, superior/inferior, medial/lateral."}]},{"titulo":"El corazón y la circulación: la doble bomba","contenido":["El corazón es dos bombas en una: la derecha manda la sangre usada a los pulmones a cargarse de oxígeno, la izquierda la impulsa al cuerpo entero. Late unas 100.000 veces al día, sin descanso, toda la vida. Sus cuatro cámaras (dos aurículas arriba, dos ventrículos abajo) y sus válvulas hacen que la sangre vaya siempre hacia adelante.","Los vasos tienen oficios distintos: las arterias llevan la sangre que sale del corazón (gruesas, elásticas, a presión), las venas la devuelven (con válvulas contra la gravedad), y los capilares, finísimos, son donde ocurre el trueque real: oxígeno y nutrientes salen, desechos entran.","El pulso que te tomas en la muñeca es la onda de cada latido viajando por la arteria. La tensión arterial (la famosa '12/8') mide la presión máxima (cuando el corazón aprieta) y la mínima (cuando descansa).","Reto: tómate el pulso en reposo, haz 30 sentadillas y tómatelo otra vez. La diferencia es tu corazón respondiendo a la demanda: fisiología en vivo."],"quiz":[{"pregunta":"¿Qué hace la mitad derecha del corazón?","opciones":["Manda la sangre a los pulmones a oxigenarse","Manda sangre al cerebro solamente","Filtra la sangre"],"correcta":0,"porque":"Circuito pulmonar a la derecha, circuito del cuerpo a la izquierda: dos bombas gemelas."},{"pregunta":"¿Dónde ocurre el intercambio real de oxígeno y nutrientes?","opciones":["En los capilares","En las arterias grandes","En las venas"],"correcta":0,"porque":"Los capilares son tan finos que las células rojas pasan de una en una: el mercado celular."},{"pregunta":"¿Qué significan los dos números de la tensión arterial?","opciones":["La presión máxima al latir y la mínima al descansar","Pulso y temperatura","Mañana y tarde"],"correcta":0,"porque":"12/8: 12 cuando aprieta (sistólica), 8 cuando se relaja (diastólica)."}]},{"titulo":"Respiración: la fábrica de oxígeno","contenido":["El aire entra por nariz o boca, baja por la tráquea y se ramifica en bronquios cada vez más finos hasta llegar a los alveolos: unos 300 millones de saquitos donde el oxígeno salta a la sangre y el dióxido de carbono salta al aire. Extendidos, los alveolos cubrirían medio campo de tenis.","Respiramos unas 20.000 veces al día sin pensar: el diafragma (el músculo bajo los pulmones) baja, el pecho se expande y el aire entra; al subir, sale. Toser y estornudar son el sistema de limpieza: expulsiones a presión de lo que no debe estar dentro.","La sangre que sale de los pulmones lleva el oxígeno atado a la hemoglobina de los glóbulos rojos, que es roja por el hierro que lleva. Por eso la falta de hierro (anemia) cansa: menos camiones de oxígeno circulando.","Reto: cuenta tus respiraciones en un minuto en reposo (lo normal: 12-20). Luego respira hondo cinco veces despacio y nota cómo baja el pulso: el diafragma habla con el sistema nervioso."],"quiz":[{"pregunta":"¿Dónde pasa el oxígeno del aire a la sangre?","opciones":["En los alveolos","En la tráquea","En la nariz"],"correcta":0,"porque":"300 millones de saquitos con paredes de una célula de grosor: el intercambio ocurre ahí."},{"pregunta":"¿Qué músculo hace entrar el aire?","opciones":["El diafragma","El bíceps","El corazón"],"correcta":0,"porque":"El diafragma baja y el pecho se llena: respirar es mecánica de músculos."},{"pregunta":"¿Qué transporta el oxígeno en la sangre?","opciones":["La hemoglobina de los glóbulos rojos","El plasma solamente","Las plaquetas"],"correcta":0,"porque":"La hemoglobina con su hierro es el camión del oxígeno: de ahí el color rojo."}]},{"titulo":"El sistema nervioso: la red eléctrica","contenido":["El cerebro y la médula espinal son el centro de mando; los nervios son los cables que llegan a cada rincón. La neurona es la unidad: recibe señales por sus dendritas, las transmite por su axón como un impulso eléctrico-químico, y las pasa a la siguiente por la sinapsis, donde viajan moléculas mensajeras.","Hay dos grandes divisiones: el sistema voluntario (mover la mano) y el autónomo (corazón, digestión, pupilas), que funciona solo. El autónomo tiene dos modos: simpático (acelerar: peligro, esfuerzo) y parasimpático (frenar: descanso, digestión). El equilibrio entre ambos es la salud del día a día.","El cerebro pesa kilo y medio y consume el 20% de tu energía. Sus zonas tienen oficios: el lóbulo occipital ve, el temporal oye y guarda memorias, el frontal decide y planifica, el cerebelo coordina el movimiento. Y se reconfigura toda la vida: la plasticidad cerebral es la esperanza del aprendizaje y de la rehabilitación.","Reto: cierra los ojos y toca tu nariz con un dedo, rápido. Eso funciona gracias a la propiocepción: los sensores de tus músculos informando al cerebro sin mirar."],"quiz":[{"pregunta":"¿Cómo se comunican dos neuronas?","opciones":["Por la sinapsis: moléculas mensajeras entre una y otra","Por cables de cobre","Por sonido"],"correcta":0,"porque":"La sinapsis es química: el impulso eléctrico se convierte en mensajeros y vuelve a ser eléctrico."},{"pregunta":"¿Qué hace el sistema simpático?","opciones":["Acelera: prepara el cuerpo para el esfuerzo o el peligro","Te da sueño","Digiere"],"correcta":0,"porque":"Simpático acelera, parasimpático frena: el acelerador y el freno internos."},{"pregunta":"¿Qué es la plasticidad cerebral?","opciones":["La capacidad del cerebro de reorganizarse y aprender toda la vida","Que el cerebro es blando","Una enfermedad"],"correcta":0,"porque":"El cerebro se recablea con la práctica: por eso la rehabilitación y el estudio funcionan."}]},{"titulo":"Huesos y músculos: la estructura que te mueve","contenido":["El esqueleto no es un armazón muerto: es tejido vivo que se renueva sin parar, almacena calcio y fabrica la sangre en su médula. Los 206 huesos se articulan unos con otros (las articulaciones) y los ligamentos los sujetan; el cartílago amortigua los roce extremos.","Los músculos tiran, nunca empujan: por eso trabajan en parejas. El bíceps flexiona el codo y el tríceps lo extiende; uno tira mientras el otro cede. El músculo esquelético obedece tu voluntad, el cardíaco y el liso (tripas, vasos) funcionan solos.","El hueso roto se suelda solo si se alinea y se inmoviliza (la escayola solo lo mantiene quieto); el músculo se fortalece con uso y se atrofia sin él: 'úsalo o piérdelo' es fisiología literal. La vitamina D y el calcio son el material; el ejercicio de carga, la orden de construir.","Reto: toca tu antebrazo mientras abres y cierras el puño: sentirás trabajar los músculos flexores. Has localizado anatomía viva con la mano."],"quiz":[{"pregunta":"¿Por qué trabajan los músculos en parejas?","opciones":["Porque solo pueden tirar, no empujar","Porque son perezosos","Por estética"],"correcta":0,"porque":"Bíceps flexiona, tríceps extiende: la pareja antagonista gobierna cada articulación."},{"pregunta":"¿Qué fabrica la médula ósea?","opciones":["Las células de la sangre","Grasa solamente","Cartílago"],"correcta":0,"porque":"Dentro de los huesos nace la sangre: glóbulos rojos, blancos y plaquetas."},{"pregunta":"¿Cómo se fortalece el hueso?","opciones":["Con ejercicio de carga, calcio y vitamina D","Con reposo absoluto","Con azúcar"],"correcta":0,"porque":"El hueso responde al uso: caminar y cargar peso le ordenan hacerse fuerte."}]},{"titulo":"El sistema digestivo: la larga cocina","contenido":["La digestión es una cadena de montaje de nueve metros: la boca tritura y empieza con la saliva, el esófago empuja con olas musculares, el estómago remueve con ácido (tan fuerte que digeriría el propio estómago sin su capa de moco), y el intestino delgado, con sus seis metros llenos de pliegues, absorbe los nutrientes.","El hígado es la fábrica química: produce la bilis para las grasas, procesa todo lo absorbido, almacena reservas y desactiva tóxicos. El páncreas aporta los jugos que terminan de desmontar la comida y regula el azúcar en sangre con la insulina. El intestino grueso recupera agua y aloja la microbiota.","La microbiota intestinal son billones de bacterias que ayudan a digerir, fabrican vitaminas y entrenan las defensas. La fibra es su comida: una dieta rica en fibra es, literalmente, alimentar a tu ejército interior.","Reto: tras tu próxima comida, cuenta cuánto tardas en tener hambre de nuevo. Los hidratos simples dan hambre a las dos horas; la fibra y la proteína aguantan más: tu cuerpo como laboratorio."],"quiz":[{"pregunta":"¿Dónde se absorben la mayoría de los nutrientes?","opciones":["En el intestino delgado","En el estómago","En la boca"],"correcta":0,"porque":"Seis metros de pliegues y vellosidades: una superficie de absorción enorme."},{"pregunta":"¿Por qué el ácido del estómago no digiere el propio estómago?","opciones":["Por su capa de moco protector","Porque es débil","Porque el estómago es de hierro"],"correcta":0,"porque":"El moco es el escudo; cuando falla, aparecen las úlceras."},{"pregunta":"¿Qué es la microbiota?","opciones":["Los billones de bacterias beneficiosas del intestino","Una verdura","Un medicamento"],"correcta":0,"porque":"Un órgano invisible que digiere, fabrica vitaminas y educa las defensas: se alimenta de fibra."}]},{"titulo":"Las defensas: el ejército interior","contenido":["El sistema inmune tiene dos ejércitos: el innato (rápido y genérico: piel, fiebre, inflamación, células devoradoras) y el adaptativo (lento pero exacto: linfocitos que reconocen a cada enemigo concreto y fabrican anticuerpos a medida). La fiebre no es el enemigo: es la estrategia de cocinar al invasor.","La inflamación es la zona de obras: roja, caliente, hinchada y dolorida porque llegan sangre y tropas de defensa. Los ganglios linfáticos que se hinchan en el cuello con una angina son cuarteles trabajando a destajo.","Las vacunas son el entrenamiento del ejército adaptativo: presentan al enemigo inofensivo (una pieza, un muñeco) para que el cuerpo fabrique anticuerpos y memoria. Cuando el enemigo real llega, la defensa ya lo conoce: es la idea más rentable de la historia de la medicina.","Reto: repasa tu calendario de vacunación (tétanos cada 10 años en adultos). Tenerlo al día es mantenimiento del ejército, igual que cambiar el aceite al coche."],"quiz":[{"pregunta":"¿Qué hace la fiebre?","opciones":["Dificulta la vida del invasor subiendo la temperatura","Es solo un síntoma inútil","Te deshidrata a propósito"],"correcta":0,"porque":"La fiebre moderada es estrategia defensiva: muchos microbios sufren con el calor."},{"pregunta":"¿Qué hacen los anticuerpos?","opciones":["Reconocen y marcan a un enemigo concreto","Transportan oxígeno","Coagulan"],"correcta":0,"porque":"Cada anticuerpo es una llave para una cerradura concreta: el ejército exacto."},{"pregunta":"¿Cómo funciona una vacuna?","opciones":["Entrena al sistema inmune con una versión inofensiva del enemigo","Mata virus con veneno","Engorda las defensas"],"correcta":0,"porque":"Memoria inmunológica sin pasar la enfermedad: la idea que más vidas ha salvado."}]},{"titulo":"Los cinco sentidos y la piel","contenido":["La piel es el órgano más grande (unos 2 m²): barrera contra microbios, regulador de temperatura por sudor y sangre, y campo de sensores de tacto, presión, dolor y temperatura. Se renueva por completo cada mes aproximadamente.","El ojo es una cámara: la córnea y el cristalino enfocan la luz sobre la retina, donde los conos (color) y bastones (penumbra) la convierten en señal eléctrica que viaja al cerebro. El oído transforma vibraciones del aire en señales: el tímpano, los tres huesecillos más pequeños del cuerpo (martillo, yunque y estribo) y la cóclea con sus celdas de vello.","El gusto y el olfato son químicos: detectan moléculas. Buena parte de lo que llamamos 'sabor' es en realidad olor: por eso con la nariz tapada la comida sabe a poco. Y el equilibrio vive en el oído interno: los canales semicirculares detectan los giros de la cabeza.","Reto: con los ojos cerrados, prueba a identificar tres objetos solo por el tacto y tres olores de la cocina. Los sentidos se entrenan como los músculos."],"quiz":[{"pregunta":"¿Cuál es el órgano más grande del cuerpo?","opciones":["La piel","El hígado","El intestino"],"correcta":0,"porque":"Dos metros cuadrados de barrera, termostato y sensor: la piel es un órgano completo."},{"pregunta":"¿Qué huesos son los más pequeños del cuerpo?","opciones":["Los tres huesecillos del oído: martillo, yunque y estribo","Los del dedo meñique","Los de la nariz"],"correcta":0,"porque":"Miden milímetros y amplifican el sonido hacia la cóclea."},{"pregunta":"¿Por qué con la nariz tapada la comida sabe a poco?","opciones":["Porque gran parte del sabor es en realidad olfato","Porque la lengua se duerme","Por costumbre"],"correcta":0,"porque":"Gusto y olfato trabajan juntos: el resfriado lo demuestra cada invierno."}]}],"nivel":"basico"},{"id":"enfermeria","titulo":"Enfermería y medicina básica","icono":"🩺","lecciones":[{"titulo":"Las constantes vitales: el cuadro de mandos","contenido":["Las constantes vitales son cuatro números que cuentan cómo está el cuerpo ahora mismo: temperatura, pulso, respiración y tensión arterial. Un profesional sanitario los mira antes que nada, como un piloto mira su panel. Saber tomarlos y entenderlos es la primera habilidad de enfermería.","Los valores normales del adulto: temperatura 36-37,5 °C (fiebre a partir de 38); pulso 60-100 latidos por minuto en reposo; respiración 12-20 por minuto; tensión en torno a 12/8 (se considera alta de forma sostenida desde 14/9). Los niños tienen pulso y respiración más rápidos: es normal.","Cómo medir: el pulso, con dos dedos en la muñeca durante un minuto; la respiración, contando elevaciones del pecho sin avisar (si la persona sabe, la cambia); la tensión, con el brazalete a la altura del corazón, sentado y en calma cinco minutos. La temperatura, axilar o timpánica, según el aparato.","Reto: toma tus cuatro constantes hoy y anótalas. Repite mañana a la misma hora. Tener tu 'normal' registrado es un regalo para cualquier médico futuro."],"quiz":[{"pregunta":"¿Cuáles son las cuatro constantes vitales?","opciones":["Temperatura, pulso, respiración y tensión arterial","Peso, talla, edad y sexo","Solo el pulso"],"correcta":0,"porque":"Son el cuadro de mandos: lo primero que se mide en cualquier valoración."},{"pregunta":"¿Cuál es el pulso normal de un adulto en reposo?","opciones":["Entre 60 y 100 por minuto","Entre 20 y 40","Más de 150"],"correcta":0,"porque":"Por debajo de 60 con mareo o por encima de 100 en reposo, conviene consultar."},{"pregunta":"¿Por qué se cuenta la respiración sin avisar?","opciones":["Porque si la persona lo sabe, la modifica sin querer","Por superstición","Para ir más rápido"],"correcta":0,"porque":"La respiración es semivoluntaria: saber que la observan la cambia."}]},{"titulo":"Primeros auxilios: PAS y la llamada que salva","contenido":["Ante cualquier emergencia manda la conducta PAS: Proteger (que el lugar no sea peligroso para ti ni para la víctima: un socorrista electrocutado no ayuda a nadie), Avisar (llamar al 112 dando lugar exacto, qué ha pasado y cuántos heridos) y Socorrer (actuar dentro de lo que sabes). En ese orden, siempre.","Si una persona no responde: comprueba si respira (mira el pecho diez segundos). Si respira, ponla de lado en posición lateral de seguridad para que no se ahogue si vomita. Si no respira, empieza la RCP y manda a por un desfibrilador (DESA) si lo hay cerca: cada minuto sin RCP baja la supervivencia un 10%.","La RCP en adultos: manos entrelazadas en el centro del pecho, brazos rectos, comprimir fuerte y rápido: 5-6 cm de profundidad, 100-120 por minuto (el ritmo de 'Stayin' Alive'). Sin parar hasta que llegue ayuda o la persona respire. Comprimir mal es infinitamente mejor que no comprimir.","Reto: localiza hoy el DESA más cercano a tu casa o trabajo (hay aplicaciones que los muestran). Saber dónde está antes de la emergencia es media batalla ganada."],"quiz":[{"pregunta":"¿Qué orden sigue la conducta PAS?","opciones":["Proteger, Avisar, Socorrer","Socorrer, Avisar, Proteger","Avisar, Proteger, Socorrer"],"correcta":0,"porque":"Primero no empeorar la escena, luego llamar al 112, luego actuar: siempre en ese orden."},{"pregunta":"¿Qué se hace si alguien no responde pero respira?","opciones":["Posición lateral de seguridad","Darle agua","Sentarlo"],"correcta":0,"porque":"De lado, la lengua y los vómitos no obstruyen la vía aérea."},{"pregunta":"¿Cómo son las compresiones de la RCP?","opciones":["Centro del pecho, 5-6 cm de profundidad, 100-120 por minuto","Suaves y lentas","Sobre el estómago"],"correcta":0,"porque":"Fuerte y rápido en el centro del pecho: eso mantiene la sangre llegando al cerebro."}]},{"titulo":"Heridas, quemaduras y golpes: cuidados básicos","contenido":["Heridas: primero lávate las manos. Para el sangrado, presión directa con una gasa o paño limpio durante minutos, sin levantar para mirar. Limpia con suero o agua y jabón del centro hacia fuera, y cubre. Señales de que necesita puntos: bordes separados, más de 2 cm, o que no para de sangrar.","Quemaduras: la regla de oro es agua fría corriente 15-20 minutos, inmediatamente. Nunca hielo, nunca pasta de dientes, nunca reventar ampollas (son el mejor apósito natural). Las quemaduras grandes, en cara, manos o genitales, o con piel carbonizada, son de hospital sí o sí.","Golpes y torceduras: la sigla RICE: Reposo, Hielo (envuelto en un paño, 15 minutos), Compresión con venda y Elevación. El esguince es el ligamento estirado o roto; la fractura, el hueso. Si hay deformidad, no se puede apoyar o duele mucho al mover: radiografía.","Reto: monta un pequeño botiquín casero: gasas, esparadrapo, suero, tijeras, guantes, analgésicos, termómetro. Revisa caducidades una vez al año."],"quiz":[{"pregunta":"¿Cuál es el primer gesto ante un sangrado?","opciones":["Presión directa sobre la herida con un paño limpio","Torniquete inmediato","Echar alcohol"],"correcta":0,"porque":"La presión directa sostenida detiene la inmensa mayoría de las hemorragias."},{"pregunta":"¿Qué se hace primero con una quemadura?","opciones":["Agua fría corriente 15-20 minutos","Pasta de dientes","Reventar las ampollas"],"correcta":0,"porque":"El agua fría detiene el daño térmico; los remedios caseros lo empeoran."},{"pregunta":"¿Qué significa RICE?","opciones":["Reposo, Hielo, Compresión, Elevación","Rápido, Intenso, Calor, Estirar","Un tipo de vendaje"],"correcta":0,"porque":"Las siglas del primer día de cualquier torcedura o golpe fuerte."}]},{"titulo":"Medicamentos: dosis, horarios y respeto","contenido":["Un medicamento es una sustancia con efectos, y los efectos dependen de la dosis: el mismo paracetamol cura el dolor a su dosis y daña el hígado si se supera. La regla sagrada: el medicamento correcto, a la dosis correcta, por la vía correcta, a la hora correcta, a la persona correcta. Los 'cinco correctos' de la enfermería.","Los antibióticos solo valen contra bacterias, nunca contra virus (el resfriado y la gripe son virus). Tomarlos 'por si acaso' o abandonarlos a mitad cría superbacterias resistentes: un problema mundial. Se toman hasta el último día de la pauta, aunque uno se encuentre bien.","Errores comunes: mezclar medicamentos sin consultar (el ibuprofeno con ciertos fármacos daña el estómago), tomar con pomelo (altera docenas de medicinas), guardarlos en el baño húmedo, y usar los de otra persona. El prospecto no es literatura: es el manual de la máquina.","Reto: revisa el cajón de medicinas de casa: caducidades, conservación y si sabes para qué es cada cosa. Lleva lo caducado al punto SIGRE de la farmacia."],"quiz":[{"pregunta":"¿Contra qué funcionan los antibióticos?","opciones":["Solo contra bacterias, no contra virus","Contra todo","Solo contra virus"],"correcta":0,"porque":"Resfriados y gripe son virales: el antibiótico ahí solo cría resistencias."},{"pregunta":"¿Qué pasa si abandonas un antibiótico a mitad de pauta?","opciones":["Las bacterias supervivientes pueden hacerse resistentes","Nada","Te curas antes"],"correcta":0,"porque":"Sobreviven las más duras y se multiplican: así nacen las superbacterias."},{"pregunta":"¿Cuáles son los 'cinco correctos' al dar un medicamento?","opciones":["Medicamento, dosis, vía, hora y persona correctos","Color, tamaño, sabor, marca y precio","Solo la hora"],"correcta":0,"porque":"El protocolo de seguridad que evita la mayoría de los errores de medicación."}]},{"titulo":"Higiene de manos: el gesto que más vidas salva","contenido":["El gesto sanitario más eficaz jamás inventado no es una máquina: es lavarse las manos. La mayoría de las infecciones se transmiten por las manos que tocan superficies y luego cara, comida o heridas. Cuarenta segundos con agua y jabón, con palmas, dorsos, entre dedos y uñas, reducen drásticamente el contagio.","Los momentos clave: antes de comer o cocinar, después del baño, tras toser o sonarse, al llegar de la calle, antes de tocar una herida y tras cuidar a un enfermo. El gel hidroalcohólico sirve cuando no hay agua, pero el jabón arrastra lo que el gel no alcanza.","En hospitales, la higiene de manos es la medida número uno contra las infecciones que se cogen dentro. Y tiene una historia asombrosa: Semmelweis demostró en 1847 que lavarse las manos salvaba a las parturientas, y la medicina tardó décadas en hacerle caso (ya lo verás en las historias).","Reto: cronometra tu próximo lavado completo: canta dos veces el cumpleaños feliz mientras frotas. Cuarenta segundos parecen muchos hasta que los cuentas."],"quiz":[{"pregunta":"¿Cuál es la medida más eficaz contra el contagio?","opciones":["Lavarse las manos bien y a menudo","Tomar vitaminas","Ponerse dos mascarillas"],"correcta":0,"porque":"Cuarenta segundos de agua y jabón: barato, simple y demoledor contra los microbios."},{"pregunta":"¿Cuánto debe durar un buen lavado de manos?","opciones":["Unos 40 segundos frotando bien","5 segundos","Dos minutos"],"correcta":0,"porque":"El tiempo de cantar dos veces el cumpleaños feliz, sin olvidar entre los dedos."},{"pregunta":"¿Quién demostró en 1847 que lavarse las manos salvaba vidas?","opciones":["Ignaz Semmelweis","Einstein","Darwin"],"correcta":0,"porque":"Bajó la mortalidad de las parturientas del 18% al 2%: y le tomaron por loco."}]},{"titulo":"Cuándo es urgencia y cuándo puede esperar","contenido":["Saber distinguir la urgencia de lo esperable ahorra vidas (y colapsos de urgencias). Urgencia real: dolor de pecho opresivo, dificultad para respirar, signos de ictus (cara torcida, brazo caído, habla rara: actúa rápido, cada minuto cuenta), sangrado que no cede, pérdida de conciencia, fiebre alta con rigidez de cuello o con manchas que no desaparecen al presionar.","Puede ir al médico sin correr: fiebre moderada que remite, resfriados, dolores leves de días, molestias digestivas pasajeras. Y la atención primaria existe para casi todo lo demás: mejor la cita de mañana que la sala de espera de hoy para un catarro.","La regla de la empeora: cualquier síntoma que empeora rápido, te despierta de noche, o viene acompañado de 'algo va muy mal' merece valoración. Y en duda grave, el 112 prefiere mil llamadas de más a una de menos.","Reto: aprende la prueba del ictus (sonreír, levantar los dos brazos, decir una frase completa) y enséñasela a dos personas. Es un detector gratuito que salva cerebros."],"quiz":[{"pregunta":"¿Cuáles son los tres signos rápidos del ictus?","opciones":["Cara torcida, un brazo que cae, habla extraña","Dolor de pie, tos y mareo","Solo fiebre"],"correcta":0,"porque":"Sonreír, brazos arriba, frase completa: si falla uno, 112 inmediato."},{"pregunta":"Un resfriado común, ¿dónde se atiende mejor?","opciones":["En casa y, si hace falta, en atención primaria","En urgencias de madrugada","No se debe hacer nada nunca"],"correcta":0,"porque":"Urgencias es para lo urgente: el catarro se cura con reposo, líquidos y tiempo."},{"pregunta":"¿Qué debe hacerse ante un dolor de pecho opresivo?","opciones":["Llamar al 112 sin esperar","Esperar a que pase solo","Tomar un café"],"correcta":0,"porque":"Con el corazón, cada minuto cuenta: ante la duda, se llama."}]}],"nivel":"basico"},{"id":"optica","titulo":"Óptica y optometría","icono":"👁️","lecciones":[{"titulo":"El ojo: la cámara que llevas en la cara","contenido":["El ojo funciona como una cámara: la luz entra por la córnea (la ventana transparente delantera, que hace el 70% del enfoque), pasa por la pupila (el diafragma que se abre y cierra según la luz), atraviesa el cristalino (la lente flexible que enfoca fino) y aterriza en la retina, la pantalla de atrás.","La retina convierte la luz en electricidad con dos tipos de células: los bastones (120 millones, ven en penumbra, sin color) y los conos (6 millones, ven color y detalle, concentrados en la mácula, el centro de alta definición). La imagen llega al revés y el cerebro la voltea: el procesador siempre fue cerebral.","El punto ciego es real: donde el nervio óptico sale del ojo no hay células que vean, y el cerebro rellena el hueco sin avisar. Y la acomodación (enfocar de cerca y de lejos) la hace el cristalino cambiando de forma: un autofocus biológico que se endurece con los años.","Reto: encuentra tu punto ciego: cierra el ojo izquierdo, mira un punto en papel con el derecho y acerca un bolígrafo desde el lado hasta que desaparezca. Magia que es anatomía."],"quiz":[{"pregunta":"¿Qué parte del ojo hace el 70% del enfoque?","opciones":["La córnea","El cristalino","La pupila"],"correcta":0,"porque":"La córnea es la gran lente fija; el cristalino solo ajusta el fino."},{"pregunta":"¿Qué células de la retina ven el color?","opciones":["Los conos","Los bastones","Los glóbulos"],"correcta":0,"porque":"Los conos dan color y detalle en el centro; los bastones, visión nocturna en los bordes."},{"pregunta":"¿Qué es el punto ciego?","opciones":["La zona sin células donde sale el nervio óptico","Una enfermedad","Un mito"],"correcta":0,"porque":"Todo ojo lo tiene: el cerebro rellena el hueco y nadie lo nota... hasta que lo buscas."}]},{"titulo":"Miopía, hipermetropía, astigmatismo y presbicia","contenido":["Los cuatro defectos de refracción son problemas de enfoque, no de salud: la imagen no aterriza en la retina. Miopía: el ojo es demasiado largo y enfoca delante de la retina; se ve mal de lejos (es la del estudiante y la pantalla). Hipermetropía: ojo corto, enfoca detrás; cuesta de cerca, sobre todo con cansancio.","Astigmatismo: la córnea no es redonda como un balón sino ovalada como un balón de rugby, y enfoca la imagen deformada a todas las distancias: luces con colas, letras con sombra. Presbicia (la 'vista cansada'): a partir de los 40-45 el cristalino se endurece y ya no enfoca de cerca: les pasa a todos, miopes incluidos.","Las dioptrías miden la graduación: con signo menos corrigen miopía (lente que diverge), con signo más corrigen hipermetropía y presbicia (lente que converge). Un -3,00 es un miope moderado; el astigmatismo se anota aparte con su cilindro y su eje.","Reto: mira un texto a brazo extendido: si lo acercas y se ve mejor, posible miopía o presbicia según tu edad. No diagnostica, pero enseña a entender tu receta cuando llegue."],"quiz":[{"pregunta":"¿Qué es la miopía?","opciones":["El ojo enfoca delante de la retina: se ve mal de lejos","El ojo enfoca detrás de la retina","La córnea es ovalada"],"correcta":0,"porque":"Ojo largo o córnea potente: la imagen aterriza antes de la pista."},{"pregunta":"¿Qué es la presbicia o vista cansada?","opciones":["El cristalino se endurece con la edad y no enfoca de cerca","Una infección","Ver doble"],"correcta":0,"porque":"A partir de los 40-45 les llega a todos: el autofocus biológico se queda fijo."},{"pregunta":"¿Qué significa una graduación de -3,00 dioptrías?","opciones":["Miopía de 3 dioptrías","Hipermetropía de 3 dioptrías","Astigmatismo"],"correcta":0,"porque":"Signo menos: miopía. Signo más: hipermetropía o vista cansada."}]},{"titulo":"El examen visual: qué pasa en la óptica","contenido":["El examen optométrico empieza con la agudeza visual: la cartilla de Snellen con las letras que se achican (la famosa E giratoria o las letras sueltas). Ver la fila que se ve a 6 metros se anota como fracción: 6/6 es visión completa; 6/12 significa que ves a 6 metros lo que un ojo sano ve a 12.","Después viene la refracción: el foróptero (las gafas de prueba de la consulta) va probando lentes mientras preguntan '¿mejor así o así?'. Hoy un autorefractómetro da la estimación inicial y el optometrista la afina. Se mide cada ojo por separado y luego juntos: la graduación final es la que da la mejor visión con máxima comodidad.","El examen completo incluye más: la salud del ojo por dentro (la lámpara de hendidura y el fondo de ojo muestran retina y vasos: la hipertensión y la diabetes se ven ahí antes de dar síntomas), la presión intraocular (el glaucoma no avisa) y la visión binocular (cómo trabajan los dos ojos en equipo).","Reto: tápate un ojo y lee el cartel más lejano de tu calle; repite con el otro. Si hay diferencia clara entre ojos, toca revisión: cada ojo tiene su propia graduación."],"quiz":[{"pregunta":"¿Qué significa una agudeza visual de 6/6?","opciones":["Visión completa: ves a 6 metros lo esperable a 6 metros","Visión doble","Ceguera parcial"],"correcta":0,"porque":"La fracción compara tu distancia de visión con la del ojo estándar."},{"pregunta":"¿Qué aparato prueba lentes preguntando 'mejor así o así'?","opciones":["El foróptero","El termómetro","El otoscopio"],"correcta":0,"porque":"Las gafas de prueba gigantes de la consulta: con ellas se afina la receta final."},{"pregunta":"¿Por qué es importante mirar el fondo del ojo?","opciones":["Porque diabetes e hipertensión se ven en la retina antes de dar síntomas","Por estética","No es importante"],"correcta":0,"porque":"La retina es la única parte del cuerpo donde los vasos se ven directamente: una ventana a la salud."}]},{"titulo":"Gafas, lentillas y cirugía: las correcciones","contenido":["Las gafas son la corrección más antigua y segura: lentes que desvían la luz justo lo que el ojo no puede. Las lentillas se apoyan en la lágrima sobre la córnea y se mueven con el ojo: mejores para deporte y campo visual, pero exigen higiene estricta (dormir con ellas multiplica el riesgo de infección corneal, que puede dejar cicatriz).","La cirugía láser (LASIK y familia) retalla la córnea para que enfoque bien sin gafas: rápida y con grandes resultados en candidatos bien seleccionados, pero es cirugía: tiene riesgos, no quita la presbicia futura y no es para todos (córneas finas o graduaciones inestables quedan fuera).","Los filtros: el antirreflejante quita brillos y cansa menos; el fotocromático oscurece al sol; el filtro de luz azul es más marketing que ciencia (lo que cansa de las pantallas es parpadear menos, no el color). Gafas de sol sin filtro UV certificado son peores que no llevar: dilatan la pupila y dejan pasar más daño.","Reto: revisa tus gafas de sol: ¿dicen UV400 o CE? Si no lo pone, no protegen. La sombra sin filtro es una trampa para el ojo."],"quiz":[{"pregunta":"¿Por qué no hay que dormir con lentillas?","opciones":["Multiplica el riesgo de infección en la córnea","Porque se pierden","No pasa nada"],"correcta":0,"porque":"La córnea respira del aire: tapada toda la noche, los microbios celebran."},{"pregunta":"¿Qué hace la cirugía LASIK?","opciones":["Retalla la córnea con láser para enfocar sin gafas","Cambia el color del ojo","Quita las cataratas"],"correcta":0,"porque":"Modifica la gran lente fija del ojo: funciona muy bien en candidatos bien seleccionados."},{"pregunta":"¿Por qué son peligrosas las gafas de sol sin filtro UV?","opciones":["Oscurecen, la pupila se dilata y entra más radiación dañina","Porque son feas","No lo son"],"correcta":0,"porque":"Sombra sin filtro es peor que luz: el ojo se abre y recibe todo el ultravioleta."}]},{"titulo":"Pantallas, higiene visual y salud de los ojos","contenido":["La regla 20-20-20 contra la fatiga de pantalla: cada 20 minutos, mira 20 segundos algo a más de 20 pies (6 metros). Lo que cansa no es la luz azul sino fijar el enfoque de cerca durante horas y parpadear un tercio de lo normal: de ahí el ojo seco del oficinista. Pantalla ligeramente por debajo de los ojos y a un brazo de distancia.","Los ojos se alimentan: la luteína de las verduras de hoja verde protege la mácula; los omega-3 ayudan a la lágrima; la vitamina A es literalmente materia prima de la retina (de ahí el dicho de las zanahorias). El tabaco, en cambio, multiplica el riesgo de degeneración macular y cataratas.","Señales de alarma que no esperan: pérdida brusca de visión, lluvia súbita de moscas volantes con destellos (posible desprendimiento de retina: urgencia), dolor ocular intenso con náuseas (posible glaucoma agudo), y visión doble nueva. Y la revisión periódica: cada 1-2 años con gafas, y del fondo de ojo en diabéticos cada año.","Reto: pon una alarma y practica hoy la regla 20-20-20 durante tu tiempo de pantalla. Tus ojos de los 60 te lo agradecerán."],"quiz":[{"pregunta":"¿Qué dice la regla 20-20-20?","opciones":["Cada 20 minutos, mirar 20 segundos algo a 6 metros","Dormir 20 horas","Parpadear 20 veces seguidas"],"correcta":0,"porque":"Descansar el enfoque y humedecer el ojo: el ejercicio más barato de la vista."},{"pregunta":"¿Qué puede anunciar una lluvia súbita de moscas volantes con destellos?","opciones":["Un posible desprendimiento de retina: urgencia","Cansancio normal","Hambre"],"correcta":0,"porque":"La retina se está despegando y es una carrera contra el reloj: urgencias oculares ya."},{"pregunta":"¿Cada cuánto conviene revisar la vista si usas gafas?","opciones":["Cada 1-2 años","Cada 20 años","Nunca"],"correcta":0,"porque":"La graduación cambia despacio y la salud ocular se vigila: revisión regular."}]}],"nivel":"medio"},{"id":"bricolaje","titulo":"Bricolaje doméstico","icono":"🔨","lecciones":[{"titulo":"El taller casero: herramientas y seguridad","contenido":["El bricolaje empieza antes de la primera herramienta: con la seguridad. Gafas para cortar y taladrar, guantes para manipular (nunca para el taladro: un guante enganchado arrastra la mano), y la regla de oro: ninguna prisa vale un dedo. El 90% de los accidentes de bricolaje son prisas, herramientas inadecuadas o piezas mal sujetas.","El kit básico que resuelve el 80% de la vida doméstica: cinta métrica, nivel, destornilladores de estrella y planos, martillo, alicates, llave inglesa, cutter, cinta de carrocero y aislante. Con eso y un taladro se conquista una casa entera. Compra poco y bueno: una herramienta mala es dos veces cara.","Aprende a medir dos veces y cortar una. Marca con lápiz, sujeta la pieza con sargentos o un tornillo de banco, y deja que la herramienta trabaje: la fuerza bruta es síntoma de hacerlo mal. La hoja corta, la broca taladra, tú solo guías.","Reto: organiza hoy tu rincón de herramientas: todo visible, cada cosa en su sitio. Un taller ordenado es la mitad de un trabajo bien hecho."],"quiz":[{"pregunta":"¿Por qué no se usan guantes con el taladro?","opciones":["Porque si se enganchan arrastran la mano entera","Porque sudan","Por estética"],"correcta":0,"porque":"Las máquinas que giran y los guantes no se llevan: la regla más importante del taller."},{"pregunta":"¿Cuál es la regla de oro del corte?","opciones":["Medir dos veces y cortar una","Cortar rápido","Usar siempre serrucho"],"correcta":0,"porque":"El material desperdiciado no perdona: el lápiz es gratis, la tabla no."},{"pregunta":"¿Qué indica que estás usando mal una herramienta?","opciones":["Tener que hacer fuerza bruta","Que haga ruido","Que sea vieja"],"correcta":0,"porque":"La herramienta adecuada y afilada trabaja sola: la fuerza desesperada es síntoma de error."}]},{"titulo":"Madera: cortar, taladrar, lijar y unir","contenido":["La madera es la escuela del bricolaje. Tiene veta: cortar a favor es fácil, en contra astilla. Se mide, se marca la línea de corte y se serra dejando la línea del lado del desperdicio. El taladro necesita la broca de madera y un trozo de sacrificio debajo para no destrozar la mesa.","Unir madera tiene tres caminos: tornillos (fuertes y desmontables: haz siempre agujero guía para no rajar), cola blanca (la unión encolada bien hecha es más fuerte que la propia madera: necesita presión y 24 horas) y clavos (rápidos pero flojos con los años).","El lijado va de grano grueso a fino (80, 120, 180) y siempre a favor de la veta. Después, el acabado: barniz protege y da brillo, el aceite nutre y deja tacto natural, la pintura tapa y decora. Lijar entre capas con grano fino es el secreto del acabado profesional.","Reto: haz un posavasos: corta un cuadrado de 10 cm, lija los cuatro lados y bordes en tres granos, y barnízalo. El proyecto más pequeño enseña todo el proceso."],"quiz":[{"pregunta":"¿Para qué sirve el agujero guía antes del tornillo?","opciones":["Para que la madera no se raje","Para ir más rápido","Para nada"],"correcta":0,"porque":"La broca abre camino y el tornillo aprieta sin partir la fibra."},{"pregunta":"¿Qué unión de madera es más fuerte que la propia madera?","opciones":["La cola blanca bien aplicada y prensada","El clavo","La cinta aislante"],"correcta":0,"porque":"El encolado bien hecho une las fibras: al romperse, cede la madera, no la cola."},{"pregunta":"¿En qué orden se lija?","opciones":["De grano grueso a grano fino, a favor de la veta","De fino a grueso","En círculos"],"correcta":0,"porque":"Cada grano borra las rayas del anterior: 80, 120, 180 es el camino clásico."}]},{"titulo":"Paredes: colgar, anclar y reparar","contenido":["Antes de taladrar una pared, averigua qué es: ladrillo o bloque (suena hueco al golpear, se taladra con broca de widia y percusión), pladur (suena muy hueco, necesita tacos especiales basculantes o de expansión) y hormigón (duro de verdad: broca de hormigón y paciencia). El taco equivocado es el cuadro en el suelo.","La cadena del agujero: detecta primero cables y tuberías con un detector (o evita las zonas verticales de enchufes y grifos), marca con nivel, pega un sobre de papel debajo para recoger el polvo, taladra recto y a la profundidad del taco, mete el taco a ras y atornilla dejando la cabeza justa.","Reparar desperfectos: los agujeros pequeños se rellenan con masilla, se deja secar, se lija y se pinta. Las grietas finas: se abren un poco en V, se rellenan con masilla elástica y se pintan. El gotelé no se lija: se moja, se raspa o se tapa con pintura de la misma textura.","Reto: cuelga hoy ese cuadro que lleva meses apoyado en el suelo: nivel, marca, detector, taco correcto. Una hora de bricolaje que se disfruta cada día."],"quiz":[{"pregunta":"¿Qué se comprueba antes de taladrar una pared?","opciones":["Que no haya cables ni tuberías detrás","La marca del taladro","El color de la pared"],"correcta":0,"porque":"Un detector de metales y corriente evita el disgusto: cables y tuberías son enemigos ocultos."},{"pregunta":"¿Qué taco necesita el pladur?","opciones":["Tacos especiales basculantes o de expansión para cartón-yeso","El taco normal de ladrillo","Ninguno"],"correcta":0,"porque":"El pladur es hueco: el taco normal no se agarra a nada; los basculantes abren alas por detrás."},{"pregunta":"¿Cómo se arregla un agujero pequeño en la pared?","opciones":["Masilla, secado, lijado y pintura","Con chicle","No tiene arreglo"],"correcta":0,"porque":"Rellenar, lijar a ras y pintar: el agujero desaparece en una tarde."}]},{"titulo":"Fontanería doméstica: grifos, cisternas y fugas","contenido":["La primera lección de fontanería casera: localiza la llave de paso general de tu casa hoy, antes de necesitarla. Ante cualquier fuga, cerrar el agua es lo primero; cada grifo y cisterna suele tener además su llave pequeña debajo. Un cubo y unos trapos viejos son el uniforme del fontanero doméstico.","El grifo que gotea casi siempre es la junta o el cartucho cerámico gastado: se cierra el agua, se desmonta el mando (el tornillo suele esconderse bajo la tapa de color), se cambia la pieza y listo. La cist
