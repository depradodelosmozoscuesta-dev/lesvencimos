<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1017">
<title>Profesor</title>
<style>
/* ═══════════════════════════════════════════════════════════
   EL PROFESOR — 37 materias · 269 lecciones · 807 preguntas

   Un archivo y nada más. Se abre con doble clic, funciona sin
   internet y sin servidor, y el avance se guarda en el propio
   navegador. Para meterlo en otro asistente hay dos maneras, las
   dos explicadas al final del archivo:
     · un <iframe src="Profesor.html">  — cero integración,
     · o copiar el <script> y llamar a Profesor.montar(...).

   El temario va INCRUSTADO aquí dentro, no en un archivo aparte.
   Es medio mega y tiene su precio, pero Chrome en Android bloquea
   la carga de guiones entre archivos cuando se abre con file://:
   si el temario fuera aparte, en la tablet no cargaría NADA y la
   pantalla saldría vacía sin decir por qué.
   ═══════════════════════════════════════════════════════════ */

:root{
  --fondo:#0d1017; --fondo-2:#10141d; --panel:#171b25; --panel-claro:#232936;
  --tinta:#e6ebf2; --tinta-suave:#9aa6b8;
  --acento:#818cf8; --ambar:#fbbf24; --verde:#34d399; --rojo:#f47272;
  --sombra:0 10px 26px rgba(0,0,0,.35);
}
/* Modo claro: se respeta lo que tenga puesto el aparato. El asistente
   de Morgan lleva el suyo en un atributo, y aquí se acepta el mismo
   nombre para que herede solo si se incrusta. */
@media (prefers-color-scheme: light){
  :root:not([data-tema="oscuro"]){
    --fondo:#dde3ea; --fondo-2:#d3dae2; --panel:#fff; --panel-claro:#c3ccd6;
    --tinta:#12212e; --tinta-suave:#55697c;
    --acento:#0e7490; --ambar:#b45309; --verde:#047857; --rojo:#be123c;
    --sombra:0 8px 20px rgba(60,75,90,.18);
  }
}
:root[data-tema="claro"]{
  --fondo:#dde3ea; --fondo-2:#d3dae2; --panel:#fff; --panel-claro:#c3ccd6;
  --tinta:#12212e; --tinta-suave:#55697c;
  --acento:#0e7490; --ambar:#b45309; --verde:#047857; --rojo:#be123c;
  --sombra:0 8px 20px rgba(60,75,90,.18);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--fondo); color:var(--tinta);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.5;
  display:flex; flex-direction:column;
}

/* ——— la barra de arriba ——— */
.barra{
  flex:0 0 auto; display:flex; align-items:center; gap:10px;
  padding:10px 14px; background:var(--fondo-2);
  border-bottom:1px solid var(--panel-claro);
}
.barra h1{
  font-size:1.05rem; margin:0; font-weight:700; flex:1 1 auto;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.avance{ font-size:.8rem; color:var(--tinta-suave); white-space:nowrap }

.btn{
  font:inherit; font-size:.86rem; font-weight:600; cursor:pointer;
  min-height:40px; padding:0 14px; border-radius:11px;
  border:1px solid var(--panel-claro); background:var(--panel);
  color:var(--tinta); white-space:nowrap;
}
.btn:hover{ border-color:var(--acento) }
.btn.principal{ background:var(--acento); border-color:var(--acento); color:#fff }
.btn.suave{ background:transparent; color:var(--tinta-suave) }

/* ——— el cuerpo ——— */
.cuerpo{
  flex:1 1 auto; overflow-y:auto; padding:14px;
  max-width:760px; width:100%; margin:0 auto;
}
.sub{
  font-size:.74rem; color:var(--tinta-suave); font-weight:700;
  letter-spacing:.06em; text-transform:uppercase; margin:18px 0 8px;
}
.sub:first-child{ margin-top:0 }

.fila{
  display:flex; align-items:center; gap:12px;
  padding:12px 14px; margin-bottom:8px;
  background:var(--panel); border:1px solid var(--panel-claro);
  border-radius:14px; cursor:pointer; text-align:left; width:100%;
  font:inherit; color:var(--tinta);
}
.fila:hover{ border-color:var(--acento) }
.fila-titulo{ font-weight:600; font-size:.95rem }
.fila-sub{ font-size:.8rem; color:var(--tinta-suave) }

.barra-avance{
  height:5px; margin-top:6px; border-radius:3px;
  background:rgba(128,128,128,.22); overflow:hidden;
}
.barra-avance > i{
  display:block; height:100%; border-radius:3px;
  background:var(--verde); transition:width .3s ease;
}

.tarjeta{
  background:var(--panel); border:1px solid var(--panel-claro);
  border-radius:16px; padding:16px; box-shadow:var(--sombra);
}
.tarjeta-titulo{ font-size:1.1rem; font-weight:700; margin:0 0 4px }
.parrafo{ margin:10px 0; line-height:1.65; font-size:.95rem }
.numerote{ font-size:2.2rem; font-weight:800; margin:8px 0; line-height:1 }

/* Las opciones del quiz: de dedo, y anchas para que se lean de un
   vistazo. En una tablet de cocina se responde con el pulgar. */
.opcion{
  display:block; width:100%; text-align:left;
  min-height:48px; padding:12px 14px; margin-top:8px;
  border:1px solid var(--panel-claro); border-radius:12px;
  background:rgba(128,128,128,.07); color:var(--tinta);
  font:inherit; font-size:.95rem; cursor:pointer;
  transition:background .15s ease, border-color .15s ease;
}
.opcion:hover:not(:disabled){ background:rgba(128,128,128,.16) }
.opcion:disabled{ cursor:default; opacity:.75 }
/* La correcta SIEMPRE se marca en verde, se acierte o no: hay que ver
   cuál era, no solo que fallaste. */
.opcion.bien{
  border-color:var(--verde); opacity:1; color:var(--verde); font-weight:600;
  background:color-mix(in srgb, var(--verde) 16%, transparent);
}
.opcion.mal{
  border-color:var(--rojo); color:var(--rojo);
  background:color-mix(in srgb, var(--rojo) 14%, transparent);
}
@supports not (color: color-mix(in srgb, red 10%, transparent)){
  .opcion.bien, .opcion.mal{ background:rgba(128,128,128,.16) }
}

/* El porqué de la respuesta: esto es lo que enseña. */
.porque{
  margin-top:12px; padding:10px 12px; border-radius:10px;
  background:rgba(128,128,128,.10); border-left:3px solid var(--acento);
  font-size:.9rem; line-height:1.55; color:var(--tinta-suave);
}

.fin{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px }
.aviso{
  font-size:.82rem; color:var(--tinta-suave); margin-top:14px;
  padding:10px 12px; border-radius:10px; background:rgba(128,128,128,.08);
}

/* ——— quién estudia ——— */
.quien{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:6px }
.quien select, .quien input{
  font:inherit; font-size:.9rem; min-height:40px; padding:0 10px;
  border-radius:11px; border:1px solid var(--panel-claro);
  background:var(--panel); color:var(--tinta);
}

/* ——— imprimir una lección ——— */
@media print{
  .barra, .btn, .opcion, .fin, .aviso, .quien{ display:none !important }
  body, .cuerpo, .tarjeta{
    background:#fff !important; color:#000 !important;
    box-shadow:none !important; border:0 !important;
    max-width:none; overflow:visible; height:auto;
  }
  .porque{ border-left:3px solid #999; color:#333 }
}

@media (prefers-reduced-motion: reduce){
  .barra-avance > i, .opcion{ transition:none }
}
</style>
</head>
<body>
  <div class="barra">
    <button type="button" class="btn suave" id="atras" hidden>←</button>
    <h1 id="titulo">Profesor</h1>
    <span class="avance" id="avance"></span>
  </div>
  <div class="cuerpo" id="cuerpo"></div>

<script>
// ============================================================
//  EL TEMARIO — 37 materias, 269 lecciones, 807 preguntas.
//
//  Va en archivo APARTE a propósito: son cientos de KB y meterlos dentro
//  de index.html los haría descargar en CADA carga de página, mirases la
//  agenda o la compra. Aquí se carga solo al abrir Enseñanza, y una vez.
//
//  Formato de cada materia:
//    { id, titulo, icono, nivel, adultos?, lecciones: [...] }
//  Y de cada lección:
//    { titulo, contenido: [párrafos], quiz: [{pregunta, opciones, correcta, porque}] }
//
//  `nivel` dice cuánta BASE hace falta: basico / medio / avanzado.
//  `adultos` es otra cosa: materias que NO deben salir en el perfil de
//  un menor aunque el texto sea sencillo. Mezclar las dos cosas dejaba
//  «Sexualidad y bienestar» en la lista de un niño de ocho años.
//
//  El 'porque' de cada respuesta es lo que separa enseñar de examinar:
//  no basta con decir que está mal, hay que decir por qué.
//
//  Para añadir lecciones se edita ESTE archivo y nada más.
// ============================================================
const TEMARIO = [{"id":"leer","titulo":"Leer y escribir","icono":"📖","lecciones":[{"titulo":"Las letras y los sonidos","contenido":["Todo lo que leemos está hecho de letras. En español hay 27 letras. Cada letra tiene un sonido, y juntando sonidos formamos palabras.","Las vocales son cinco: A, E, I, O, U. Son las más importantes: casi todas las sílabas llevan una vocal.","Las demás letras son consonantes. Solas no suenan bien; necesitan una vocal al lado. Por ejemplo, la M sola no dice nada, pero con la A dice MA.","Practica en voz alta: MA, ME, MI, MO, MU. Luego PA, PE, PI, PO, PU. Lee despacio: no hay prisa. Leer despacio también es leer."],"quiz":[{"pregunta":"¿Cuántas vocales hay?","opciones":["Tres","Cinco","Diez"],"correcta":1,"porque":"Las vocales son A, E, I, O, U: cinco en total."},{"pregunta":"¿Qué necesita una consonante para sonar?","opciones":["Otra consonante","Una vocal","Nada, suena sola"],"correcta":1,"porque":"Las consonantes se juntan con una vocal para formar sílabas, como MA o PE."},{"pregunta":"¿Cómo se lee mejor cuando se está aprendiendo?","opciones":["Muy rápido","Despacio y en voz alta","En silencio y con prisa"],"correcta":1,"porque":"Leer despacio y en voz alta ayuda a unir letras, sonidos y significados."}]},{"titulo":"De las sílabas a las palabras","contenido":["Las palabras se dividen en golpes de voz llamados sílabas. Por ejemplo: CA-SA tiene dos sílabas. PA-NE-DE-RO tiene cuatro.","Para leer una palabra larga, léela por partes: primero una sílaba, luego la siguiente, y al final júntalas todas.","Practica: ME-SA, SO-LA-PU-erta no... mejor: PUER-TA, VEN-TA-NA, A-GUA. Di cada parte y después la palabra entera.","Un truco: aplaude con cada sílaba al decir la palabra. Tu nombre también tiene sílabas. ¿Cuántas tiene el tuyo?"],"quiz":[{"pregunta":"¿Cuántas sílabas tiene CA-SA?","opciones":["Una","Dos","Tres"],"correcta":1,"porque":"CA-SA se dice con dos golpes de voz: dos sílabas."},{"pregunta":"¿Cómo se lee una palabra larga?","opciones":["Toda de golpe","Por sílabas y luego junta","No se puede leer"],"correcta":1,"porque":"Leer sílaba por sílaba y luego juntarlas es la manera más fácil."},{"pregunta":"¿Cuántas sílabas tiene A-GUA?","opciones":["Dos","Una","Cuatro"],"correcta":0,"porque":"A-GUA tiene dos sílabas."}]},{"titulo":"Leer frases y entenderlas","contenido":["Una frase es un grupo de palabras que dice algo completo: «La tienda abre a las nueve».","Las mayúsculas marcan el principio de una frase. El punto (.) marca el final. La coma (,) es una pausa corta para respirar.","Cuando leas una frase, pregúntate: ¿quién hace qué? En «María compra pan», María es quien hace, y compra pan es lo que hace.","Practica con cosas de la calle: carteles, nombres de tiendas, señales de tráfico. Cada salida a la calle puede ser una clase."],"quiz":[{"pregunta":"¿Qué marca el final de una frase?","opciones":["La coma","El punto","La mayúscula"],"correcta":1,"porque":"El punto (.) indica que la frase terminó."},{"pregunta":"En «Juan bebe agua», ¿quién hace la acción?","opciones":["El agua","Bebe","Juan"],"correcta":2,"porque":"Juan es quien hace la acción de beber."},{"pregunta":"¿Para qué sirve la coma?","opciones":["Para terminar la frase","Para hacer una pausa corta","Para gritar"],"correcta":1,"porque":"La coma marca una pausa breve dentro de la frase."}]},{"titulo":"Escribir tu nombre y tus datos","contenido":["Lo primero que hay que saber escribir es el propio nombre. Se escribe con la primera letra mayúscula: Rosa, Ahmed, Lucía.","Los apellidos también empiezan con mayúscula. Escribe tu nombre completo muchas veces hasta que salga sin pensar.","Aprende también a escribir tu dirección: la calle, el número, el pueblo o la ciudad. Te hará falta para formularios, paquetes y trámites.","Y tu número de teléfono: escríbelo en un papel y léelo en voz alta por bloques, por ejemplo de tres en tres cifras."],"quiz":[{"pregunta":"¿Cómo empieza un nombre propio?","opciones":["Con minúscula","Con mayúscula","Da igual"],"correcta":1,"porque":"Los nombres de personas y lugares empiezan con mayúscula."},{"pregunta":"¿Qué datos conviene saber escribir de memoria?","opciones":["Solo el nombre","Nombre, dirección y teléfono","Ninguno"],"correcta":1,"porque":"Nombre, dirección y teléfono se necesitan en formularios y trámites."},{"pregunta":"¿Cómo es más fácil recordar un número de teléfono?","opciones":["Todas las cifras de golpe","Por bloques de dos o tres cifras","Al revés"],"correcta":1,"porque":"Dividirlo en bloques pequeños hace más fácil recordarlo y decirlo."}]}],"nivel":"basico"},{"id":"matematicas","titulo":"Matemáticas","icono":"🔢","lecciones":[{"titulo":"Los números hasta cien","contenido":["Los números se escriben con diez cifras: 0, 1, 2, 3, 4, 5, 6, 7, 8 y 9. Con esas diez se forman todos los números del mundo.","Del 1 al 20 hay que aprenderlos de memoria. A partir del 20 hay un truco: 21 es veinte y uno, 32 es treinta y dos. Primero las decenas, luego las unidades.","Las decenas son: 10 diez, 20 veinte, 30 treinta, 40 cuarenta, 50 cincuenta, 60 sesenta, 70 setenta, 80 ochenta, 90 noventa, 100 cien.","Practica contando cosas reales: monedas, pasos, cucharas, sillas. Contar cosas de verdad enseña más que contar en el aire."],"quiz":[{"pregunta":"¿Cuántas cifras básicas hay?","opciones":["Cinco","Diez","Cien"],"correcta":1,"porque":"Hay diez cifras: del 0 al 9. Con ellas se escribe cualquier número."},{"pregunta":"¿Qué número es «cuarenta»?","opciones":["14","40","400"],"correcta":1,"porque":"Cuarenta es 40: cuatro decenas."},{"pregunta":"¿Cómo se forma el 32?","opciones":["Treinta y dos","Tres y dos","Trescientos dos"],"correcta":0,"porque":"32 es treinta (30) y dos (2): treinta y dos."}]},{"titulo":"Unidades, decenas y centenas","contenido":["En un número, cada cifra vale según el lugar que ocupa. Esto es lo más importante de todas las matemáticas.","En 345, el 5 son 5 unidades, el 4 son 4 decenas (40) y el 3 son 3 centenas (300). O sea: 300 + 40 + 5.","Por eso 52 y 25 no son lo mismo: 52 es 50 + 2 y 25 es 20 + 5. El orden de las cifras cambia el valor.","El cero es un guarda plaza: en 307 el 0 dice «aquí no hay decenas». Sin ese cero sería 37, un número mucho menor.","Practica: descompón estos números — 58, 103, 260, 999. Di en voz alta cuántas centenas, decenas y unidades tiene cada uno."],"quiz":[{"pregunta":"En 345, ¿cuánto vale el 4?","opciones":["4","40","400"],"correcta":1,"porque":"El 4 está en el lugar de las decenas: vale 40."},{"pregunta":"¿Qué número es mayor?","opciones":["25","52","Son iguales"],"correcta":1,"porque":"52 es 50+2 y 25 es 20+5. El orden de las cifras cambia el valor."},{"pregunta":"¿Qué papel tiene el 0 en 307?","opciones":["Ninguno, sobra","Guarda el lugar de las decenas","Multiplica por diez"],"correcta":1,"porque":"Sin ese cero sería 37. El cero guarda la plaza vacía."}]},{"titulo":"Números grandes: miles y millones","contenido":["Después de 999 viene el 1.000 (mil). Mil unidades, cien decenas o diez centenas: todo eso es un mil.","Los números grandes se leen por grupos de tres: 4.520 se lee «cuatro mil quinientos veinte». El punto separa los miles.","Un millón son mil miles: 1.000.000. Es un número enorme: contando un número por segundo, tardarías más de 11 días sin dormir.","Con el dinero esto importa mucho: confundir 1.000 con 10.000 es un error caro. Cuenta siempre los ceros y los puntos despacio."],"quiz":[{"pregunta":"¿Cómo se lee 4.520?","opciones":["Cuatrocientos cincuenta y dos","Cuatro mil quinientos veinte","Cuarenta y cinco mil veinte"],"correcta":1,"porque":"El punto separa los miles: 4 mil y 520."},{"pregunta":"¿Cuánto es un millón?","opciones":["Cien mil","Mil miles","Cien cientos"],"correcta":1,"porque":"Un millón son mil miles: 1.000.000."},{"pregunta":"¿Qué hay que contar con cuidado en un precio grande?","opciones":["Las letras","Los ceros y los puntos","El color del billete"],"correcta":1,"porque":"Confundir 1.000 con 10.000 es un error caro: un cero más o menos lo cambia todo."}]},{"titulo":"Sumar","contenido":["Sumar es juntar. Si tienes 3 naranjas y te dan 2, ahora tienes 5. Eso se escribe: 3 + 2 = 5.","El signo + se lee «más» y el signo = se lee «es igual a».","Para sumar números de dos cifras, suma primero las unidades y luego las decenas: 23 + 14 → 3+4=7 y 20+10=30 → 37.","Truco útil: sumar de diez en diez es fácil. 10+10=20, 45+10=55. Si sabes sumar dieces, el resto cuesta menos.","Practica en la compra: si el pan vale 1 y la leche 2, ¿cuánto es en total?"],"quiz":[{"pregunta":"¿Cuánto es 3 + 2?","opciones":["4","5","6"],"correcta":1,"porque":"Tres naranjas más dos naranjas son cinco naranjas."},{"pregunta":"¿Qué significa el signo +?","opciones":["Quitar","Juntar o añadir","Repartir"],"correcta":1,"porque":"Sumar es juntar cantidades."},{"pregunta":"¿Cuánto es 23 + 14?","opciones":["37","36","47"],"correcta":0,"porque":"3+4 son 7 y 20+10 son 30: en total 37."}]},{"titulo":"Sumar llevando","contenido":["A veces las unidades pasan de diez: 27 + 15. Sumas 7+5=12. El 2 se queda y el 1 (una decena) «se lleva» a las decenas.","Luego sumas las decenas con la que te llevaste: 20+10+10 = 40. Resultado: 27 + 15 = 42.","Escríbelo en vertical, un número encima del otro, unidades con unidades y decenas con decenas. Así no se te escapa ninguna llevada.","La comprobación: suma al revés (15 + 27) o resta (42 − 15 = 27). Si cuadra, está bien.","Practica: 38 + 24, 56 + 37, 49 + 51. Despacio, con llevadas apuntadas."],"quiz":[{"pregunta":"¿Cuánto es 27 + 15?","opciones":["32","42","312"],"correcta":1,"porque":"7+5=12: queda el 2 y te llevas 1. Luego 20+10+10=40. Total: 42."},{"pregunta":"¿Qué es «llevarse una»?","opciones":["Quitar una unidad","Pasar una decena formada al sumar las unidades","Saltarse una cifra"],"correcta":1,"porque":"Si las unidades pasan de diez, esa decena se suma a la columna de las decenas."},{"pregunta":"¿Cómo se comprueba una suma?","opciones":["No se puede","Sumando al revés o restando","Sumando otra vez lo mismo sin mirar"],"correcta":1,"porque":"Si 27+15=42, entonces 42−15 debe dar 27. Si cuadra, está bien."}]},{"titulo":"Restar","contenido":["Restar es quitar. Si tienes 5 monedas y gastas 2, te quedan 3. Se escribe: 5 − 2 = 3.","La resta sirve para cosas muy prácticas: saber cuánto dinero te queda, cuánto falta para llegar a una cantidad, o cuántos años de diferencia hay entre dos personas.","También sirve para comparar: ¿cuánto cuesta más el autobús que andar? ¿Cuántos años más tiene Ana que Luis?","Para comprobar una resta, usa la suma al revés: si 5 − 2 = 3, entonces 3 + 2 = 5. Si la vuelta cuadra, la resta está bien.","Practica: tenías 10 y gastaste 4, ¿cuánto te queda? Compruébalo sumando: 6 + 4 = 10. Bien."],"quiz":[{"pregunta":"¿Cuánto es 5 − 2?","opciones":["2","3","7"],"correcta":1,"porque":"De cinco quitas dos y quedan tres."},{"pregunta":"¿Cómo se comprueba una resta?","opciones":["Sumando el resultado con lo quitado","Restando otra vez","No se puede comprobar"],"correcta":0,"porque":"Si 5 − 2 = 3, la suma 3 + 2 debe dar 5."},{"pregunta":"Tenías 10 y gastaste 4. ¿Cuánto queda?","opciones":["5","6","14"],"correcta":1,"porque":"10 − 4 = 6. Y 6 + 4 = 10, así que cuadra."}]},{"titulo":"Restar pidiendo prestada","contenido":["A veces la cifra de arriba es más pequeña que la de abajo: 42 − 17. El 2 no puede quitar 7.","Entonces la decena de al lado «presta» una: el 4 se queda en 3, y el 2 se convierte en 12. Ahora 12 − 7 = 5.","Luego las decenas: 30 − 10 = 20. Resultado: 42 − 17 = 25.","Comprueba siempre: 25 + 17 = 42. Cuadra, así que está bien.","Practica: 53 − 28, 61 − 35, 90 − 46. Apunta las pedidas y comprueba sumando."],"quiz":[{"pregunta":"¿Cuánto es 42 − 17?","opciones":["35","25","15"],"correcta":1,"porque":"El 2 pide prestada una decena: 12−7=5 y 30−10=20. Total: 25."},{"pregunta":"¿Cuándo hay que «pedir prestada»?","opciones":["Siempre","Cuando la cifra de arriba es menor que la de abajo","Nunca"],"correcta":1,"porque":"Si el 2 no puede quitar 7, la decena de al lado le presta diez."},{"pregunta":"¿Cuánto es 90 − 46?","opciones":["54","44","56"],"correcta":1,"porque":"10−6=4 y 80−40=40. Total: 44. Y 44+46=90: cuadra."}]},{"titulo":"Multiplicar: sumar muchas veces","contenido":["Multiplicar es sumar lo mismo varias veces. 3 × 4 es lo mismo que 4 + 4 + 4 = 12. Se lee «tres por cuatro».","Sirve para mucho: si un kilo de arroz cuesta 2 y compras 3 kilos, son 2 × 3 = 6.","El orden no cambia el resultado: 3 × 4 = 4 × 3 = 12. Elige el orden que te sea más fácil.","Trucos básicos: multiplicar por 0 da 0. Multiplicar por 1 no cambia nada. Multiplicar por 10 solo añade un cero: 7 × 10 = 70.","Multiplicar por 2 es «el doble»: el doble de 8 es 16. Practica los dobles: son la mitad de las tablas ya hecha."],"quiz":[{"pregunta":"¿Cuánto es 3 × 4?","opciones":["7","12","34"],"correcta":1,"porque":"4 + 4 + 4 = 12."},{"pregunta":"Un kilo cuesta 2 y compras 3 kilos. ¿Cuánto pagas?","opciones":["5","6","8"],"correcta":1,"porque":"2 × 3 = 6."},{"pregunta":"¿Cuánto es 7 × 10?","opciones":["17","70","700"],"correcta":1,"porque":"Multiplicar por 10 solo añade un cero: 70."}]},{"titulo":"Las tablas de multiplicar","contenido":["Las tablas se aprenden poco a poco, no todas de golpe. Empieza por la del 2, la del 5 y la del 10: son las más fáciles.","La del 5 tiene truco: siempre acaba en 0 o en 5. 5, 10, 15, 20, 25... Es como contar monedas de cinco.","La del 9 también: los resultados suman 9 (18 → 1+8=9, 27 → 2+7=9) y bajan de uno en uno: 9, 18, 27, 36, 45, 54, 63, 72, 81, 90.","Si sabes que 3 × 4 = 12, ya sabes que 4 × 3 = 12. Cada tabla que aprendes te da media tabla de regalo.","Canta las tablas en voz alta, una cada día, mientras cocinas o caminas. En dos semanas las tienes."],"quiz":[{"pregunta":"Los resultados de la tabla del 5 siempre acaban en…","opciones":["2 o 4","0 o 5","Cualquier cifra"],"correcta":1,"porque":"5, 10, 15, 20, 25... siempre terminan en 0 o en 5."},{"pregunta":"¿Cuánto es 9 × 4?","opciones":["34","36","45"],"correcta":1,"porque":"9, 18, 27, 36: el cuarto es 36. Y 3+6=9, como manda el truco."},{"pregunta":"Si sabes 3 × 4 = 12, ¿qué más sabes gratis?","opciones":["Nada más","Que 4 × 3 = 12","Que 3 × 3 = 12"],"correcta":1,"porque":"El orden no cambia el resultado: cada tabla aprendida regala media tabla."}]},{"titulo":"Multiplicar números de dos cifras","contenido":["Para multiplicar 12 × 3, descompón el 12 en 10 + 2. Multiplica cada parte: 10 × 3 = 30 y 2 × 3 = 6. Suma: 30 + 6 = 36.","Otro ejemplo: 23 × 4 → 20 × 4 = 80 y 3 × 4 = 12 → 80 + 12 = 92.","Con decenas enteras es aún más fácil: 30 × 4 → 3 × 4 = 12, añade el cero → 120.","Esto sirve cada semana: si el billete de autobús cuesta 12 y lo usas 5 veces, son 12 × 5 = 60.","Practica: 11 × 6, 21 × 4, 40 × 3. Descompón, multiplica y suma."],"quiz":[{"pregunta":"¿Cuánto es 12 × 3?","opciones":["15","36","123"],"correcta":1,"porque":"10×3=30 y 2×3=6; 30+6=36."},{"pregunta":"¿Cuánto es 23 × 4?","opciones":["812","92","82"],"correcta":1,"porque":"20×4=80 y 3×4=12; 80+12=92."},{"pregunta":"¿Cuánto es 30 × 4?","opciones":["34","120","12"],"correcta":1,"porque":"3×4=12 y añades el cero del 30: 120."}]},{"titulo":"Dividir: repartir en partes iguales","contenido":["Dividir es repartir en partes iguales. 12 caramelos entre 4 niños tocan a 3 cada uno. Se escribe 12 ÷ 4 = 3.","La división es la multiplicación al revés: si 3 × 4 = 12, entonces 12 ÷ 4 = 3 y 12 ÷ 3 = 4. Saber las tablas es saber dividir.","Dividir entre 2 es hacer la mitad. La mitad de 10 es 5, la mitad de 50 es 25. Se usa todos los días.","Práctica real: si 3 amigos pagan una comida de 24 a partes iguales, cada uno pone 24 ÷ 3 = 8.","Y ojo: dividir entre cero no se puede. No hay manera de repartir algo entre nadie."],"quiz":[{"pregunta":"12 caramelos entre 4 niños. ¿Cuántos tocan a cada uno?","opciones":["2","3","4"],"correcta":1,"porque":"12 ÷ 4 = 3. Comprueba: 3 × 4 = 12."},{"pregunta":"¿Cuál es la mitad de 50?","opciones":["20","25","30"],"correcta":1,"porque":"50 ÷ 2 = 25. Y 25 + 25 = 50."},{"pregunta":"Si 3 × 4 = 12, ¿cuánto es 12 ÷ 3?","opciones":["4","3","36"],"correcta":0,"porque":"La división es la multiplicación al revés: 12 ÷ 3 = 4."}]},{"titulo":"Dividir con resto","contenido":["A veces el reparto no sale exacto: 13 caramelos entre 4 niños tocan a 3 cada uno y SOBRA 1. Ese 1 es el resto.","Se escribe: 13 ÷ 4 = 3 y sobra 1. El resto siempre es más pequeño que el número entre el que divides.","Comprueba: 4 × 3 = 12, más el resto 1 → 13. Cuadra.","En la vida real decide qué hacer con el resto: si 25 personas caben de 4 en 4 en coches, necesitas 7 coches (6 llenos y 1 con 1 persona). El resto también viaja.","Practica: 17 ÷ 5, 22 ÷ 3, 30 ÷ 7. Busca cuántas veces cabe y qué sobra."],"quiz":[{"pregunta":"13 ÷ 4 es…","opciones":["3 y sobra 1","4 y sobra 1","3 exacto"],"correcta":0,"porque":"4×3=12 y sobra 1 para llegar a 13."},{"pregunta":"¿Cuánto puede valer el resto como máximo al dividir entre 4?","opciones":["4","3","Lo que sea"],"correcta":1,"porque":"El resto siempre es menor que el divisor: con 4, puede ser 1, 2 o 3."},{"pregunta":"25 personas en coches de 4. ¿Cuántos coches hacen falta?","opciones":["6","7","5"],"correcta":1,"porque":"6 coches llevan 24 y queda 1 persona: necesita el séptimo coche."}]},{"titulo":"Mitades, tercios y cuartos","contenido":["Partir algo en partes iguales crea fracciones. Una pizza en 2 partes iguales: cada parte es un medio (1/2).","En 4 partes iguales: cada parte es un cuarto (1/4). Dos cuartos son un medio. Cuatro cuartos son el entero.","El número de abajo dice en cuántas partes se partió; el de arriba, cuántas partes coges. En 3/4: se partió en 4 y coges 3.","Medio kilo son 500 gramos. Un cuarto de kilo son 250 gramos. Tres cuartos de kilo son 750 gramos.","Con la hora igual: un cuarto de hora son 15 minutos, media hora son 30. Por eso decimos «y cuarto» e «y media»."],"quiz":[{"pregunta":"¿Cuántos cuartos hacen un entero?","opciones":["Dos","Tres","Cuatro"],"correcta":2,"porque":"Cuatro cuartos juntos vuelven a formar la cosa completa."},{"pregunta":"¿Cuántos gramos son un cuarto de kilo?","opciones":["400","250","125"],"correcta":1,"porque":"Un kilo son 1.000 gramos; 1.000 ÷ 4 = 250."},{"pregunta":"En 3/4, ¿qué significa el 4 de abajo?","opciones":["Las partes que coges","En cuántas partes iguales se partió","Nada"],"correcta":1,"porque":"Abajo va el número de partes iguales; arriba, las que coges."}]},{"titulo":"Porcentajes: los descuentos de la vida","contenido":["Un porcentaje es una parte de 100. El 50% es la mitad. El 25% es un cuarto. El 10% es una de cada diez partes.","El 10% es fácil de calcular: quita un cero (o mueve la coma). El 10% de 80 es 8. El 10% de 250 es 25.","Con el 10% calculas otros: el 20% es el doble del 10%. El 5% es la mitad del 10%. El 50% es la mitad de todo.","En las rebajas: una camisa de 40 con un 25% de descuento. El 25% es un cuarto: 40 ÷ 4 = 10 de descuento. Pagas 30.","Ojo: un 50% de descuento y luego otro 50% NO es gratis. El segundo descuento se aplica al precio ya rebajado: de 100 pasas a 50 y luego a 25."],"quiz":[{"pregunta":"¿Cuál es el 10% de 80?","opciones":["80","8","70"],"correcta":1,"porque":"El 10% se calcula quitando un cero: 8."},{"pregunta":"Camisa de 40 con 25% de descuento. ¿Cuánto pagas?","opciones":["10","25","30"],"correcta":2,"porque":"El 25% es un cuarto: 40÷4=10 de descuento; 40−10=30."},{"pregunta":"¿Qué es el 50% de algo?","opciones":["Todo","La mitad","Un cuarto"],"correcta":1,"porque":"50 de cada 100 es exactamente la mitad."}]},{"titulo":"Medidas: metros, kilos y litros","contenido":["El metro mide largos. 100 centímetros hacen un metro. Tu altura se dice en metros y centímetros: 1 metro 65.","El kilo (kilogramo) mide peso. 1.000 gramos hacen un kilo. Medio kilo son 500 gramos.","El litro mide líquidos. Una botella grande de agua suele tener litro y medio. 1.000 mililitros hacen un litro.","En la compra, compara por kilo o por litro: un paquete grande no siempre sale mejor. Mira el «precio por kilo» en la etiqueta pequeña del lineal.","Practica: ¿qué pesa más, medio kilo o 400 gramos? ¿Qué es más, 800 mililitros o un litro?"],"quiz":[{"pregunta":"¿Cuántos gramos hacen un kilo?","opciones":["100","1.000","10.000"],"correcta":1,"porque":"Kilo quiere decir mil: 1.000 gramos."},{"pregunta":"¿Qué pesa más?","opciones":["Medio kilo","400 gramos","Pesan igual"],"correcta":0,"porque":"Medio kilo son 500 gramos, más que 400."},{"pregunta":"¿Qué es más líquido?","opciones":["800 mililitros","Un litro","Son iguales"],"correcta":1,"porque":"Un litro son 1.000 mililitros, más que 800."}]},{"titulo":"Cuentas con dinero y redondeo","contenido":["El dinero usa decimales: 3,50 son 3 unidades y 50 céntimos. Las cuentas con dinero son sumas y restas normales.","Redondear es quedarte con lo grueso para calcular rápido: 4,90 es «casi 5». 2,10 es «apenas 2».","Antes de pagar, estima: 4,90 + 2,10 ≈ 5 + 2 = 7. Si te cobran 12, algo va mal. La estimación es tu escudo.","Redondea siempre hacia arriba al comprar: tres cosas de 2,90 son «casi 9», no 6. Así nunca te falta dinero en la caja.","Practica: llevas 10 y compras algo de 3,75 y algo de 4,20. Estima: 4 + 5 = 9. Te llega, y sobra cerca de 1."],"quiz":[{"pregunta":"¿Cómo redondeas 4,90 para calcular rápido?","opciones":["Como 4","Como 5","Como 49"],"correcta":1,"porque":"4,90 está casi en 5; con 4 te quedarías corto."},{"pregunta":"¿Cuánto es 3,75 + 4,20 aproximadamente?","opciones":["Casi 7","Casi 8","Casi 9"],"correcta":1,"porque":"3,75 ≈ 4 y 4,20 ≈ 4: en total, casi 8 (justo 7,95)."},{"pregunta":"¿Por qué redondear hacia arriba en la compra?","opciones":["Para gastar más","Para no quedarte sin dinero en la caja","Da igual"],"correcta":1,"porque":"Si calculas de más, la sorpresa siempre es agradable: te sobra."}]},{"titulo":"Comparar y ordenar números","contenido":["Saber qué número es mayor es de las cosas más útiles: comparar precios, distancias, facturas.","Primero cuenta las cifras: el número con más cifras siempre es mayor. 1.000 siempre gana a 999.","Si tienen las mismas cifras, compara de izquierda a derecha: 462 contra 481. Los dos empiezan por 4. Segunda cifra: 6 contra 8. Gana 481. Ya está, no hace falta mirar más.","Los signos: > significa «es mayor que» y < significa «es menor que». Truco: la boca del signo siempre se abre hacia el número grande: 481 > 462.","Practica comparando precios reales en una tienda: ¿qué es más barato, 3,75 o 3,50? Compara cifra a cifra."],"quiz":[{"pregunta":"¿Qué número es mayor?","opciones":["999","1.000","Son iguales"],"correcta":1,"porque":"El que tiene más cifras siempre gana: cuatro cifras contra tres."},{"pregunta":"¿Cuál es mayor, 462 o 481?","opciones":["462","481","Son iguales"],"correcta":1,"porque":"Empatan en la primera cifra (4); en la segunda, 8 gana a 6."},{"pregunta":"¿Qué significa 50 > 30?","opciones":["50 es menor que 30","50 es mayor que 30","Son iguales"],"correcta":1,"porque":"La boca del signo se abre hacia el número grande: 50."}]},{"titulo":"Pares, impares y contar saltando","contenido":["Los números pares se pueden repartir entre dos sin que sobre nada: 2, 4, 6, 8, 10... Los impares siempre dejan uno suelto: 3, 5, 7, 9...","Truco infalible: mira solo la última cifra. Si acaba en 0, 2, 4, 6 u 8, es par. 1.376 es par; 843 es impar.","Contar de 2 en 2: 2, 4, 6, 8, 10... Sirve para contar parejas: zapatos, guantes, huevos.","Contar de 5 en 5: 5, 10, 15, 20... Sirve para monedas de cinco y para los minutos del reloj.","Contar de 10 en 10: 10, 20, 30... Es la base del dinero y de las decenas. Si dominas estos tres saltos, la mitad de las matemáticas diarias están hechas."],"quiz":[{"pregunta":"¿Es par o impar 1.376?","opciones":["Par","Impar","No se puede saber"],"correcta":0,"porque":"Acaba en 6: es par. Solo importa la última cifra."},{"pregunta":"¿Cómo se cuentan los minutos del reloj de agujas?","opciones":["De 2 en 2","De 5 en 5","De 20 en 20"],"correcta":1,"porque":"Cada número de la esfera son 5 minutos: 5, 10, 15, 20..."},{"pregunta":"Siguiendo de 2 en 2: 12, 14, 16, …","opciones":["17","18","20"],"correcta":1,"porque":"De dos en dos: después de 16 viene 18."}]},{"titulo":"Multiplicar por 100 y por 1.000","contenido":["Si multiplicar por 10 añade un cero, multiplicar por 100 añade dos: 7 × 100 = 700. Y por 1.000 añade tres: 7 × 1.000 = 7.000.","Con decimales la coma se mueve a la derecha: 2,5 × 10 = 25; 2,5 × 100 = 250.","Esto convierte unidades al momento: 3 kilos son 3 × 1.000 = 3.000 gramos. 2 metros son 2 × 100 = 200 centímetros. Litro y medio son 1,5 × 1.000 = 1.500 mililitros.","Y al revés sirve para dividir: 4.500 gramos entre 1.000 = 4,5 kilos. La coma salta a la izquierda.","Practica con cosas de casa: pasa 4 kilos a gramos, 3 metros a centímetros, 2,5 litros a mililitros."],"quiz":[{"pregunta":"¿Cuánto es 7 × 100?","opciones":["70","700","7.000"],"correcta":1,"porque":"Por 100 se añaden dos ceros: 700."},{"pregunta":"¿Cuántos gramos son 3 kilos?","opciones":["300","3.000","30.000"],"correcta":1,"porque":"3 × 1.000 = 3.000 gramos."},{"pregunta":"¿Cuánto es 2,5 × 10?","opciones":["2,50","25","250"],"correcta":1,"porque":"La coma salta un lugar a la derecha: 25."}]},{"titulo":"Multiplicar dos cifras por dos cifras","contenido":["Ya sabes 23 × 4. Ahora el siguiente paso: 23 × 14. La idea es la misma, descomponiendo las dos partes.","Descompón el 14 en 10 + 4. Calcula por separado: 23 × 10 = 230 y 23 × 4 = 92. Suma: 230 + 92 = 322.","Regla de oro: multiplica por la decena (fácil, solo añade un cero) y luego por la unidad, y suma los dos resultados.","Otro: 15 × 12 → 15 × 10 = 150 y 15 × 2 = 30 → 180. Sirve para calcular jornales: 12 días a 15 la jornada son 180.","Practica despacio: 11 × 13, 21 × 12, 25 × 11. Apunta los dos pasos por separado para no perderte."],"quiz":[{"pregunta":"¿Cuánto es 23 × 14?","opciones":["322","92","230"],"correcta":0,"porque":"23×10=230 y 23×4=92; 230+92=322."},{"pregunta":"¿Cuánto es 15 × 12?","opciones":["150","172","180"],"correcta":2,"porque":"15×10=150 y 15×2=30; 150+30=180."},{"pregunta":"¿Cuál es el truco para multiplicar por la decena?","opciones":["Es imposible","Multiplicar por la cifra y añadir un cero","Sumar diez veces"],"correcta":1,"porque":"23 × 10 es 23 × 1 con un cero más: 230."}]},{"titulo":"La división larga","contenido":["Para dividir números grandes, como 96 ÷ 4, se va por partes, de izquierda a derecha.","Pregunta: ¿cuántas veces cabe 4 en 9? Cabe 2 veces (2×4=8) y sobra 1. Ese 1 baja con el 6 y forma 16.","¿Cuántas veces cabe 4 en 16? Exactamente 4. Resultado: 96 ÷ 4 = 24.","Comprueba siempre multiplicando: 24 × 4 = 96. Cuadra.","Otro: 156 ÷ 3 → 3 cabe en 15 cinco veces (15), sobra 0; baja el 6 → 3 cabe en 6 dos veces. Resultado: 52. Comprueba: 52 × 3 = 156. ¡Bien!","No tengas prisa: la división larga es lenta para todo el mundo. Lento y bien gana a rápido y mal."],"quiz":[{"pregunta":"¿Cuánto es 96 ÷ 4?","opciones":["22","24","26"],"correcta":1,"porque":"4 cabe 2 veces en 9 (sobra 1), y 4 veces en 16: 24. Y 24×4=96."},{"pregunta":"¿Cuánto es 156 ÷ 3?","opciones":["42","52","62"],"correcta":1,"porque":"3 cabe 5 veces en 15 y 2 veces en 6: 52. Comprueba: 52×3=156."},{"pregunta":"¿Cómo se comprueba una división?","opciones":["Sumando","Multiplicando el resultado por el divisor","No se puede"],"correcta":1,"porque":"Si 96÷4=24, entonces 24×4 debe dar 96."}]},{"titulo":"Fracciones equivalentes y comparar","contenido":["Dos fracciones pueden valer lo mismo aunque se escriban distinto: 1/2 es lo mismo que 2/4 y que 4/8. Se llaman equivalentes.","Míralo con una pizza: la mitad es la mitad, la cortes en 2 trozos o en 8. 4/8 de pizza llena lo mismo que 1/2.","La regla: si multiplicas arriba y abajo por el mismo número, el valor no cambia. 1/2 → (×3) → 3/6. Mismo valor.","Para comparar fracciones con el mismo número abajo, gana la que tiene más arriba: 3/4 es más que 1/4 (misma pizza, más trozos).","Con distinto número abajo, conviértelas al mismo: ¿más 1/2 o 2/5? 1/2 = 5/10 y 2/5 = 4/10. Gana 1/2."],"quiz":[{"pregunta":"¿Cuál vale lo mismo que 1/2?","opciones":["1/4","2/4","3/4"],"correcta":1,"porque":"2/4 es la mitad igual que 1/2: mismo valor, otra escritura."},{"pregunta":"¿Qué es más, 3/4 o 1/4?","opciones":["1/4","3/4","Son iguales"],"correcta":1,"porque":"Mismo tamaño de trozo (cuartos); quien coge 3 tiene más que quien coge 1."},{"pregunta":"¿Qué es más, 1/2 o 2/5?","opciones":["2/5","1/2","Son iguales"],"correcta":1,"porque":"1/2 = 5/10 y 2/5 = 4/10. Gana 5/10."}]},{"titulo":"Sumar y restar fracciones","contenido":["Sumar fracciones del mismo tamaño es como contar trozos de pizza: 1/4 + 2/4 = 3/4. Se suman los de arriba y los de abajo se quedan igual.","Nunca sumes los de abajo: 1/4 + 2/4 no es 3/8. Los cuartos no se convierten en octavos por juntarlos.","Restar igual: 3/4 − 1/4 = 2/4, que es lo mismo que 1/2.","Si los trozos son de distinto tamaño, primero hazlos iguales: 1/2 + 1/4 → 1/2 = 2/4 → 2/4 + 1/4 = 3/4.","Ejemplo de cocina: la receta lleva 1/2 litro de leche y 1/4 de litro de nata. En total: 3/4 de litro de líquido."],"quiz":[{"pregunta":"¿Cuánto es 1/4 + 2/4?","opciones":["3/8","3/4","1/2"],"correcta":1,"porque":"Se suman los de arriba: 1+2=3 cuartos. Los de abajo no se tocan."},{"pregunta":"¿Cuánto es 1/2 + 1/4?","opciones":["2/6","3/4","1/4"],"correcta":1,"porque":"1/2 = 2/4; 2/4 + 1/4 = 3/4."},{"pregunta":"¿Cuánto es 3/4 − 1/4?","opciones":["1/4","1/2","1"],"correcta":1,"porque":"3−1=2 cuartos, y 2/4 es lo mismo que 1/2."}]},{"titulo":"Los números decimales","contenido":["Los decimales son fracciones escritas con coma: 0,5 es lo mismo que 1/2 (la mitad). 0,25 es un cuarto. 0,1 es una décima parte.","La primera cifra tras la coma son las décimas: 0,3 son 3 de cada 10. La segunda son las centésimas: 0,05 son 5 de cada 100.","Por eso el dinero usa dos decimales: 3,75 son 3 unidades, 7 décimas y 5 centésimas — o sea, 75 céntimos.","Comparar decimales: iguala las cifras con ceros. ¿0,5 o 0,45? Escribe 0,50 contra 0,45: gana 0,50. ¡0,5 es mayor que 0,45 aunque 45 sea mayor que 5!","Este es el error más común con decimales: creer que más cifras significa más valor. No: 0,9 > 0,89."],"quiz":[{"pregunta":"¿Qué es 0,5?","opciones":["Cinco unidades","La mitad","Cinco centésimas"],"correcta":1,"porque":"0,5 = 5/10 = 1/2: la mitad."},{"pregunta":"¿Qué es mayor, 0,5 o 0,45?","opciones":["0,45 porque 45 es más que 5","0,5","Son iguales"],"correcta":1,"porque":"0,5 = 0,50, y 50 centésimas ganan a 45."},{"pregunta":"¿Cuántos céntimos son 3,75?","opciones":["375","75","3"],"correcta":1,"porque":"El 3 son las unidades; el ,75 son 75 céntimos."}]},{"titulo":"Sumar y restar con decimales","contenido":["La regla de oro con decimales: coma con coma. Escribe los números en columna con las comas alineadas y suma como siempre.","12,5 + 3,75: alinea las comas. 5 + 75 centésimas... mejor míralo como dinero: 12,50 + 3,75 = 16,25.","Si falta cifra, añade un cero: 7,5 es lo mismo que 7,50. Así todas las columnas tienen su número.","Restar igual: 20 − 12,75 → 20,00 − 12,75 = 7,25. El cambio de pagar 12,75 con un billete de 20.","Practica con el ticket de la compra: suma tres precios y comprueba que el total cuadra. Es la mejor clase de decimales que existe."],"quiz":[{"pregunta":"¿Cuánto es 12,50 + 3,75?","opciones":["15,25","16,25","15,75"],"correcta":1,"porque":"12,50 + 3,75: 0,50+0,75=1,25 y 12+3=15; total 16,25."},{"pregunta":"¿Cuál es la regla de oro con decimales?","opciones":["Sumar sin mirar la coma","Alinear coma con coma","Quitar las comas"],"correcta":1,"porque":"Coma con coma: así las décimas suman con décimas y las unidades con unidades."},{"pregunta":"Pagas 12,75 con un billete de 20. ¿Cuál es el cambio?","opciones":["7,25","8,25","7,75"],"correcta":0,"porque":"20,00 − 12,75 = 7,25."}]},{"titulo":"Porcentajes avanzados: impuestos, propinas e intereses","contenido":["Ya sabes calcular el 10%, el 25% y el 50%. Con el 10% y un poco de maña calculas cualquiera: el 15% es el 10% más la mitad del 10%.","Ejemplo: cuenta de 40 y quieres dejar el 10% de propina → 4. ¿El 15%? → 4 + 2 = 6.","Los impuestos se suman al precio: algo cuesta 100 más un 10% de impuesto → pagas 110.","El interés de un préstamo es un porcentaje sobre lo prestado: pides 1.000 al 10% anual → al año debes 1.100. Por eso las deudas crecen solas.","Y al revés: el interés del ahorro trabaja para ti. 1.000 guardados al 5% → al año tienes 1.050 sin mover un dedo.","Antes de firmar un préstamo, pregunta siempre: ¿qué porcentaje? ¿Sobre qué cantidad? ¿Cuánto pagaré en total? Las tres preguntas que valen oro."],"quiz":[{"pregunta":"¿Cuál es el 15% de 40?","opciones":["4","6","15"],"correcta":1,"porque":"10% de 40 = 4; la mitad es 2; 4+2 = 6."},{"pregunta":"Pides 1.000 al 10% anual. ¿Cuánto debes al año?","opciones":["1.010","1.100","2.000"],"correcta":1,"porque":"El 10% de 1.000 son 100: debes 1.100."},{"pregunta":"¿Qué tres cosas se preguntan antes de un préstamo?","opciones":["El color del contrato","Porcentaje, sobre qué cantidad y total a pagar","Solo la cuota mensual"],"correcta":1,"porque":"La cuota pequeña puede esconder años de pagos: lo que importa es el total."}]},{"titulo":"La regla de tres","contenido":["La regla de tres resuelve el problema más común de la vida: «si 2 kilos cuestan 3, ¿cuánto cuestan 5 kilos?»","Paso 1: averigua cuánto vale UNO. Si 2 kilos cuestan 3, un kilo cuesta 3 ÷ 2 = 1,5.","Paso 2: multiplica por lo que quieres. 5 kilos cuestan 1,5 × 5 = 7,5.","Resumen: divide para llegar a uno, multiplica para llegar a lo que necesitas. Sirve para precios, recetas, jornales, distancias.","Receta: si para 4 personas hacen falta 200 gramos de arroz, para 6 → 200 ÷ 4 = 50 gramos por persona → 50 × 6 = 300 gramos.","Ojo con los casos al revés: si 2 personas tardan 6 horas en pintar una casa, 4 personas tardan MENOS, no más: 3 horas. Ahí divide en vez de multiplicar. Pregúntate siempre: ¿más personas, más tiempo o menos?"],"quiz":[{"pregunta":"2 kilos cuestan 3. ¿Cuánto cuestan 5 kilos?","opciones":["6","7,5","10"],"correcta":1,"porque":"Un kilo: 3÷2=1,5. Cinco kilos: 1,5×5=7,5."},{"pregunta":"Para 4 personas, 200 gramos de arroz. ¿Para 6?","opciones":["250","300","400"],"correcta":1,"porque":"50 gramos por persona × 6 = 300."},{"pregunta":"2 personas pintan en 6 horas. ¿Y 4 personas?","opciones":["12 horas","3 horas","6 horas"],"correcta":1,"porque":"Más manos, menos tiempo: el doble de personas, la mitad de horas."}]},{"titulo":"Perímetro y área","contenido":["El perímetro es el borde: cuánta valla necesitas para un corral. Se suman los lados. Un corral de 10 por 6 metros: 10+6+10+6 = 32 metros de valla.","El área es la superficie: cuánta tierra, cuántas baldosas, cuánta pintura. En un rectángulo: largo × ancho. 10 × 6 = 60 metros cuadrados.","No los confundas: la valla mide el borde (metros); el terreno mide la superficie (metros cuadrados).","Ejemplo real: una habitación de 4 por 3 metros tiene 12 metros cuadrados de suelo. Si cada baldosa cubre un metro cuadrado, necesitas 12 (más 1 o 2 de repuesto por si se rompe alguna).","Pintura: si un bote cubre 10 metros cuadrados y la pared tiene 25, necesitas 3 botes. Siempre redondea hacia arriba."],"quiz":[{"pregunta":"Corral de 10 por 6 metros. ¿Cuánta valla hace falta?","opciones":["60 metros","32 metros","16 metros"],"correcta":1,"porque":"El perímetro suma los cuatro lados: 10+6+10+6 = 32."},{"pregunta":"Habitación de 4 por 3 metros. ¿Cuál es su superficie?","opciones":["7 metros cuadrados","12 metros cuadrados","14 metros cuadrados"],"correcta":1,"porque":"Área = largo × ancho = 4 × 3 = 12."},{"pregunta":"Un bote cubre 10 m² y la pared tiene 25 m². ¿Cuántos botes?","opciones":["2","2,5","3"],"correcta":2,"porque":"Dos botes no llegan (20 m²). Los materiales siempre se redondean hacia arriba: 3."}]},{"titulo":"El tiempo: duraciones y horarios","contenido":["Una hora tiene 60 minutos; un minuto, 60 segundos. Todo el cálculo de horarios sale de ahí.","¿Cuánto dura algo? Resta horas con horas y minutos con minutos. De las 9:15 a las 11:45: 2 horas y 30 minutos.","Cuando los minutos no se pueden restar, convierte una hora en 60: de las 9:50 a las 11:10 → de 9:50 a 10:50 hay 1 hora, de 10:50 a 11:10 hay 20 minutos → 1 hora y 20 minutos.","Ir hacia delante: el autobús sale a las 14:45 y tarda 50 minutos → 14:45 + 15 min = 15:00, más 35 min → llega a las 15:35.","Practica con tu día: ¿cuánto hay entre que sales de casa y vuelves? ¿Cuánto duermes si te acuestas a las 22:30 y te levantas a las 6:30? (8 horas justas)."],"quiz":[{"pregunta":"¿Cuánto hay de las 9:15 a las 11:45?","opciones":["2 horas","2 horas y 30 minutos","3 horas"],"correcta":1,"porque":"De 9 a 11 son 2 horas; de :15 a :45 son 30 minutos."},{"pregunta":"El bus sale a las 14:45 y tarda 50 minutos. ¿A qué hora llega?","opciones":["15:35","15:30","14:95"],"correcta":0,"porque":"14:45 + 15 min = 15:00; quedan 35 min → 15:35. No existen las 14:95."},{"pregunta":"Duermes de 22:30 a 6:30. ¿Cuántas horas son?","opciones":["7","8","9"],"correcta":1,"porque":"De 22:30 a 6:30 hay exactamente 8 horas."}]},{"titulo":"Tablas y gráficas","contenido":["Una tabla ordena información en filas y columnas: los horarios del autobús, la lista de precios, los resultados de fútbol.","Lee primero los títulos de las filas y las columnas. Luego cruza: la fila de «lunes» con la columna de «salida» te dice la hora.","Una gráfica de barras compara cantidades de un vistazo: la barra más alta es la mayor. No hace falta leer números para ver quién gana.","Ojo con las trampas: si el eje no empieza en cero, una barra puede parecer el doble sin serlo. Mira siempre los números, no solo las alturas.","Practica: mira el horario del autobús de tu zona y encuentra tres cosas: primera salida, última salida y cada cuánto pasa."],"quiz":[{"pregunta":"¿Qué se lee primero en una tabla?","opciones":["Los números del medio","Los títulos de filas y columnas","Lo último"],"correcta":1,"porque":"Sin saber qué significa cada fila y columna, los números no dicen nada."},{"pregunta":"¿Qué muestra de un vistazo una gráfica de barras?","opciones":["Qué cantidad es mayor","Las horas","Los nombres"],"correcta":0,"porque":"La barra más alta es la cantidad mayor: se ve sin leer."},{"pregunta":"¿Cuál es la trampa típica de las gráficas?","opciones":["Los colores","Un eje que no empieza en cero exagera las diferencias","Las barras horizontales"],"correcta":1,"porque":"Si el eje empieza en 90, una barra de 100 parece el doble que una de 95 sin serlo."}]},{"titulo":"Cálculo mental: trucos rápidos","contenido":["Sumar de izquierda a derecha: 46 + 37 → 40+30=70, 6+7=13 → 83. Las decenas primero, como se habla.","Sumar 9 es sumar 10 y quitar 1: 56 + 9 = 56 + 10 − 1 = 65. Restar 9 igual al revés: 56 − 9 = 56 − 10 + 1 = 47.","El doble y la mitad: el doble de 17 es el doble de 10 (20) más el doble de 7 (14) = 34. La mitad de 36 es la mitad de 30 (15) más la mitad de 6 (3) = 18.","Multiplicar por 5 es multiplicar por 10 y partir por la mitad: 18 × 5 → 180 ÷ 2 = 90.","Entrena cinco minutos al día con la vida real: suma la compra, calcula el cambio, dobla recetas. El cálculo mental es un músculo: crece con uso."],"quiz":[{"pregunta":"¿Cuánto es 46 + 37?","opciones":["73","83","713"],"correcta":1,"porque":"70 + 13 = 83. Decenas primero, unidades después."},{"pregunta":"¿Cuánto es 56 − 9 con el truco del 10?","opciones":["45","47","65"],"correcta":1,"porque":"56 − 10 = 46, y le devuelves 1: 47."},{"pregunta":"¿Cuánto es 18 × 5?","opciones":["90","80","95"],"correcta":0,"porque":"18 × 10 = 180, la mitad es 90."}]},{"titulo":"La calculadora del móvil","contenido":["Tu móvil lleva una calculadora. Búscala entre las aplicaciones: el icono suele ser un cuadrado con signos + − × ÷.","Úsala para cuentas largas o con decimales: sumar todo el ticket, calcular descuentos, repartir gastos.","Pero escribe despacio y revisa: la calculadora nunca se equivoca, pero el dedo sí. Un cero de más lo cambia todo.","Antes de aceptar el resultado, haz la estimación mental: si multiplicas 48 × 21 y esperas «unos 1.000» y te sale 10.080, te comiste un cero. Estima siempre primero.","Regla de convivencia: la calculadora hace la cuenta, pero tú haces el pensar. Decide la operación tú; que ella solo calcule."],"quiz":[{"pregunta":"¿Quién puede equivocarse al usar la calculadora?","opciones":["La calculadora","El dedo al teclear","Nadie nunca"],"correcta":1,"porque":"La máquina calcula bien lo que le escribes; el error está en lo que le escribes."},{"pregunta":"¿Qué hay que hacer antes de aceptar el resultado?","opciones":["Apagar el móvil","Estimar mentalmente si tiene sentido","Multiplicar otra vez"],"correcta":1,"porque":"Si esperabas unos 1.000 y salen 10.080, la estimación te avisa del cero de más."},{"pregunta":"¿Quién decide qué operación hacer?","opciones":["La calculadora","Tú","Da igual"],"correcta":1,"porque":"La calculadora calcula; pensar qué calcular es trabajo tuyo."}]},{"titulo":"Resolver problemas paso a paso","contenido":["Todo problema de matemáticas se resuelve igual: lee despacio, dos veces. Los problemas difíciles casi siempre son problemas leídos deprisa.","Pregúntate: ¿qué me piden? ¿Qué datos tengo? Subraya los números con el dedo.","Decide la operación: ¿junto (suma)? ¿quito (resta)? ¿repito lo mismo (multiplicación)? ¿reparto (división)?","Calcula y luego pregúntate: ¿tiene sentido? Si te sale que un kilo de pan cuesta 900, algo falla. El sentido común es la última comprobación.","Ejemplo completo: «Compro 4 cuadernos a 3 cada uno y pago con 20. ¿Cuánto me devuelven?» → 4 × 3 = 12 → 20 − 12 = 8. ¿Tiene sentido? Sí: devolución menor de 20. Hecho."],"quiz":[{"pregunta":"¿Qué es lo primero al resolver un problema?","opciones":["Multiplicar todo","Leer despacio dos veces","Adivinar"],"correcta":1,"porque":"La mayoría de errores vienen de leer deprisa, no de calcular mal."},{"pregunta":"«Repartir en partes iguales» indica…","opciones":["Suma","Resta","División"],"correcta":2,"porque":"Repartir es dividir."},{"pregunta":"4 cuadernos a 3 cada uno, pagas con 20. ¿Cuánto devuelven?","opciones":["12","8","13"],"correcta":1,"porque":"4×3=12 y 20−12=8. Y tiene sentido: la devolución es menor que 20."}]}],"nivel":"basico"},{"id":"matematicas-avanzadas","titulo":"Matemáticas avanzadas","icono":"🧮","lecciones":[{"titulo":"Los números negativos","contenido":["Los números no terminan en el cero: continúan hacia abajo. Los negativos son deudas, temperaturas bajo cero, pisos del sótano.","Debes 5: tienes −5. El termómetro marca 2 bajo cero: −2. El ascensor va al sótano 1: piso −1.","La recta numérica: en el centro el 0, a la derecha los positivos, a la izquierda los negativos. Cuanto más a la derecha, mayor: −2 es mayor que −5 (deber 2 es mejor que deber 5).","Sumar un negativo es restar: 10 + (−3) = 7. Restar un negativo es sumar: 10 − (−3) = 13. Quitar una deuda es ganar dinero.","Multiplicando: negativo por positivo da negativo (−3 × 4 = −12). Negativo por negativo da POSITIVO: −3 × −4 = 12. Dos «no» hacen un «sí».","Practica: estás a −2 grados y sube 5. ¿A cuánto estás? A 3. Debes 8 y pagas 5: debes 3, o sea, −3."],"quiz":[{"pregunta":"¿Qué es mayor?","opciones":["−5","−2","Son iguales"],"correcta":1,"porque":"Deber 2 es mejor que deber 5: −2 está más a la derecha en la recta."},{"pregunta":"¿Cuánto es 10 − (−3)?","opciones":["7","13","−13"],"correcta":1,"porque":"Quitar una deuda de 3 es como ganar 3: 10 + 3 = 13."},{"pregunta":"¿Cuánto es −3 × −4?","opciones":["−12","12","−7"],"correcta":1,"porque":"Negativo por negativo da positivo: 12."}]},{"titulo":"Las potencias","contenido":["Una potencia es multiplicar un número por sí mismo varias veces. 2³ («dos al cubo») es 2 × 2 × 2 = 8. El numerito de arriba dice cuántas veces.","2² («dos al cuadrado») es 2 × 2 = 4. 5² = 25. 10² = 100. Los cuadrados se llaman así porque miden el área de un cuadrado: lado × lado.","Cualquier número elevado a 1 es él mismo: 7¹ = 7. Y elevado a 0 es 1: 7⁰ = 1. Raro, pero es la regla que hace que todo lo demás funcione.","Las potencias de 10 gobiernan el mundo de las medidas: 10² = 100, 10³ = 1.000, 10⁶ = un millón. Por eso un kilómetro son 10³ metros.","Crecimiento explosivo: dobla un grano de arroz en cada casilla del ajedrez: 1, 2, 4, 8, 16... En la casilla 30 hay más de 500 millones. Así crecen las deudas con interés y las epidemias sin control."],"quiz":[{"pregunta":"¿Cuánto es 2³?","opciones":["6","8","9"],"correcta":1,"porque":"2 × 2 × 2 = 8."},{"pregunta":"¿Cuánto es 10⁴?","opciones":["40","1.000","10.000"],"correcta":2,"porque":"Uno seguido de cuatro ceros: diez mil."},{"pregunta":"¿Cuánto es 5⁰?","opciones":["0","5","1"],"correcta":2,"porque":"Todo número elevado a 0 da 1."}]},{"titulo":"Las raíces cuadradas","contenido":["La raíz cuadrada es la pregunta al revés de la potencia: si 5² = 25, entonces √25 = 5. ¿Qué número multiplicado por sí mismo da 25?","√9 = 3, √16 = 4, √100 = 10. Las raíces exactas de los cuadrados perfectos conviene conocerlas de memoria.","No todas salen exactas: √2 ≈ 1,41. El símbolo ≈ significa «aproximadamente». Para la vida diaria, una aproximación buena vale.","¿Para qué sirve? Si un terreno cuadrado tiene 100 m², cada lado mide √100 = 10 metros. La raíz te da el lado a partir del área.","Practica: √36, √49, √64, √81. Y estima: √50 está entre √49 (7) y √64 (8), más cerca del 7: unas 7,1."],"quiz":[{"pregunta":"¿Cuánto es √49?","opciones":["6","7","24,5"],"correcta":1,"porque":"7 × 7 = 49."},{"pregunta":"Un terreno cuadrado tiene 36 m². ¿Cuánto mide cada lado?","opciones":["6 metros","9 metros","18 metros"],"correcta":0,"porque":"√36 = 6: lado × lado = 36."},{"pregunta":"¿Qué significa ≈?","opciones":["Exactamente igual","Aproximadamente","Mayor que"],"correcta":1,"porque":"≈ se usa cuando el valor no es exacto pero muy cercano, como √2 ≈ 1,41."}]},{"titulo":"El orden de las operaciones","contenido":["Cuando una cuenta mezcla operaciones, hay un orden obligatorio. Sin él, 2 + 3 × 4 daría 20 o 14 según quién la haga. La matemática no admite dos respuestas.","El orden: 1º paréntesis, 2º potencias y raíces, 3º multiplicaciones y divisiones, 4º sumas y restas.","2 + 3 × 4 = 2 + 12 = 14. La multiplicación va antes que la suma. Si quieres lo otro, usa paréntesis: (2 + 3) × 4 = 20.","Los paréntesis mandan sobre todo: lo que está dentro se hace primero. 18 ÷ (3 + 3) = 18 ÷ 6 = 3.","Practica: 10 − 2 × 3 (= 4, no 24). (10 − 2) × 3 (= 24). 5 + 4² (= 21, no 81)."],"quiz":[{"pregunta":"¿Cuánto es 2 + 3 × 4?","opciones":["20","14","24"],"correcta":1,"porque":"Primero la multiplicación: 3×4=12, luego 2+12=14."},{"pregunta":"¿Cuánto es (2 + 3) × 4?","opciones":["14","20","9"],"correcta":1,"porque":"El paréntesis manda: 5 × 4 = 20."},{"pregunta":"¿Cuánto es 5 + 4²?","opciones":["81","21","13"],"correcta":1,"porque":"Primero la potencia: 16, luego 5+16=21."}]},{"titulo":"El álgebra: letras que guardan números","contenido":["El álgebra usa letras para números que no conocemos todavía. La letra x no es un misterio: es una caja cerrada con un número dentro.","Si compro 3 kg de patatas y pago 6, ¿cuánto vale el kilo? En álgebra: 3x = 6. La x es el precio del kilo.","Resolver es despejar: dejar la x sola. Si 3x = 6, divido todo entre 3: x = 2. El kilo vale 2.","Las reglas del juego: lo mismo + lo mismo se junta (x + x = 2x). Un número delante multiplica (3x es 3 veces x).","Esto que acabas de hacer — plantear y resolver 3x = 6 — es exactamente lo que hace un ingeniero, solo que con más letras. El álgebra es aritmética con cajas cerradas."],"quiz":[{"pregunta":"¿Qué es la x en 3x = 6?","opciones":["Una letra del abecedario","Un número que aún no conocemos","Un signo de multiplicar"],"correcta":1,"porque":"La letra es una caja cerrada: guarda el número que buscamos."},{"pregunta":"Si 3x = 6, ¿cuánto vale x?","opciones":["3","2","18"],"correcta":1,"porque":"Divido todo entre 3: x = 2."},{"pregunta":"¿Cuánto es x + x + x?","opciones":["x³","3x","3"],"correcta":1,"porque":"Tres veces lo mismo: 3x."}]},{"titulo":"Ecuaciones: la balanza","contenido":["Una ecuación es una balanza equilibrada: lo de la izquierda pesa igual que lo de la derecha. x + 5 = 12 significa: la caja más 5 equilibra 12.","Regla de oro: lo que hagas a un lado, hazlo al otro, y la balanza sigue equilibrada. Quita 5 de ambos lados: x = 7.","Si la x está multiplicada, divide en ambos lados: 4x = 20 → x = 5. Si está dividida, multiplica: x/3 = 6 → x = 18.","Con varios pasos: 2x + 3 = 11 → quita 3: 2x = 8 → divide entre 2: x = 4. Siempre deshaciendo lo último que se hizo.","Comprueba siempre: mete tu solución en la ecuación original. 2×4 + 3 = 11. Cuadra. Esta costumbre vale más que cien trucos."],"quiz":[{"pregunta":"Si x + 5 = 12, ¿cuánto vale x?","opciones":["7","17","5"],"correcta":0,"porque":"Quita 5 en los dos lados: x = 7."},{"pregunta":"Si 2x + 3 = 11, ¿cuánto vale x?","opciones":["4","7","2"],"correcta":0,"porque":"Quita 3: 2x = 8. Divide entre 2: x = 4."},{"pregunta":"¿Cómo se comprueba una solución?","opciones":["No se puede","Metiéndola en la ecuación original","Preguntando"],"correcta":1,"porque":"Si al sustituir la balanza queda equilibrada, la solución es correcta."}]},{"titulo":"Ecuaciones más duras: paréntesis y letras a los dos lados","contenido":["Con paréntesis, primero reparte lo de fuera: 3(x + 2) = 3x + 6. Cada término de dentro recibe el multiplicador. Es la propiedad distributiva.","3(x + 2) = 15 → 3x + 6 = 15 → 3x = 9 → x = 3.","Con letras a los dos lados, junta las x en un lado: 5x = 2x + 9 → quita 2x de ambos: 3x = 9 → x = 3.","Ejemplo de la vida: «Tengo el doble de años que mi hija y entre los dos sumamos 48». Hija: x. Yo: 2x. x + 2x = 48 → 3x = 48 → x = 16. La hija tiene 16 y yo 32.","Todo problema de la vida con dos cantidades relacionadas se puede vestir de ecuación. Traducir del idioma de la calle al idioma del álgebra es la verdadera habilidad."],"quiz":[{"pregunta":"¿Cuánto es 3(x + 2)?","opciones":["3x + 2","3x + 6","x + 6"],"correcta":1,"porque":"El 3 multiplica a cada término: 3x + 6."},{"pregunta":"Si 5x = 2x + 9, ¿cuánto vale x?","opciones":["3","9","4,5"],"correcta":0,"porque":"Quita 2x de ambos lados: 3x = 9, x = 3."},{"pregunta":"Hija: x años. Yo: 2x. Sumamos 48. ¿Cuántos tiene la hija?","opciones":["24","16","12"],"correcta":1,"porque":"3x = 48, x = 16. Y yo tengo 32: 16 + 32 = 48. Cuadra."}]},{"titulo":"Dos ecuaciones a la vez","contenido":["A veces hay dos cajas cerradas: x e y. Con dos incógnitas hacen falta dos pistas: dos ecuaciones.","Ejemplo: 2 cafés y 1 té cuestan 5. 1 café y 1 té cuestan 3. ¿Cuánto vale cada cosa? Café: x, té: y. 2x + y = 5; x + y = 3.","Truco de la resta: resta la segunda de la primera: (2x + y) − (x + y) = 5 − 3 → x = 2. El café vale 2. Y de la segunda: 2 + y = 3 → y = 1. El té vale 1.","Comprueba en las dos: 2×2 + 1 = 5 ✅ y 2 + 1 = 3 ✅. Si solo cuadra en una, algo falló.","Esto se llama sistema de ecuaciones. Con tres incógnitas, tres ecuaciones. Misma idea, más paciencia."],"quiz":[{"pregunta":"2 cafés y 1 té cuestan 5; 1 café y 1 té cuestan 3. ¿Cuánto vale el café?","opciones":["1","2","3"],"correcta":1,"porque":"La diferencia entre las dos compras es exactamente un café: 5 − 3 = 2."},{"pregunta":"¿Y el té?","opciones":["1","2","3"],"correcta":0,"porque":"Si el café vale 2 y café+té valen 3, el té vale 1."},{"pregunta":"Con dos incógnitas, ¿cuántas ecuaciones hacen falta?","opciones":["Una","Dos","Cuatro"],"correcta":1,"porque":"Cada incógnita necesita su pista: dos incógnitas, dos ecuaciones."}]},{"titulo":"Desigualdades","contenido":["La vida rara vez da igualdades exactas: «puedo gastar COMO MÁXIMO 50», «hay que llegar ANTES de las 9». Eso son desigualdades.","x + 20 ≤ 50 significa: lo que gasto (x) más los 20 fijos no puede pasar de 50. Se resuelve como una ecuación: x ≤ 30. Puedo gastar hasta 30.","Los signos: < menor que, > mayor que, ≤ menor o igual, ≥ mayor o igual.","Una diferencia importante: al multiplicar o dividir por un número negativo, el signo DA LA VUELTA. −2x < 10 → x > −5. Es la única trampa, pero hay que conocerla.","Las desigualdades no dan una respuesta, dan un terreno de juego: «entre 0 y 30». Muchas decisiones reales son así."],"quiz":[{"pregunta":"¿Qué significa x ≤ 30?","opciones":["x es exactamente 30","x puede valer 30 o menos","x es mayor que 30"],"correcta":1,"porque":"≤ es «menor o igual»: todo vale hasta 30, incluido el 30."},{"pregunta":"Si x + 20 ≤ 50, ¿cuánto puede valer x como máximo?","opciones":["70","30","50"],"correcta":1,"porque":"Quita 20 en ambos lados: x ≤ 30."},{"pregunta":"¿Qué pasa al dividir una desigualdad entre un número negativo?","opciones":["Nada","El signo da la vuelta","Se borra el signo"],"correcta":1,"porque":"−2x < 10 se convierte en x > −5: el < se gira a >."}]},{"titulo":"El plano: coordenadas","contenido":["Dos rectas cruzadas — una horizontal (eje x) y otra vertical (eje y) — convierten una hoja en un mapa. Cada punto tiene su dirección: (3, 2).","El primer número manda los pasos a la derecha; el segundo, los pasos hacia arriba. (3, 2): tres a la derecha, dos hacia arriba. Primero el pasillo, luego la planta.","El cruce de los ejes es el (0, 0): el origen. A la izquierda y hacia abajo, números negativos: (−2, 1) está dos a la izquierda y uno arriba.","Los mapas del móvil funcionan exactamente así: cada lugar de la Tierra tiene sus dos coordenadas, latitud y longitud.","Practica: dibuja una cruz en un papel y coloca los puntos (1, 1), (4, 0), (2, 3), (−1, 2). Estás haciendo geometría analítica, la misma de Descartes."],"quiz":[{"pregunta":"El punto (3, 2) está…","opciones":["3 arriba y 2 a la derecha","3 a la derecha y 2 arriba","En el centro"],"correcta":1,"porque":"Primero la x (derecha), luego la y (arriba)."},{"pregunta":"¿Qué punto es el origen?","opciones":["(1, 1)","(0, 0)","(10, 10)"],"correcta":1,"porque":"El origen es donde se cruzan los ejes: cero pasos en ninguna dirección."},{"pregunta":"El punto (−2, 1) está…","opciones":["2 a la izquierda y 1 arriba","2 a la derecha y 1 arriba","2 abajo"],"correcta":0,"porque":"La x negativa va a la izquierda; la y positiva, hacia arriba."}]},{"titulo":"Funciones: máquinas de números","contenido":["Una función es una máquina: entra un número, sale otro. A cada entrada le corresponde exactamente una salida.","Se escribe f(x) = 2x + 3. Si entra x = 4, sale f(4) = 2×4 + 3 = 11. La máquina siempre hace lo mismo con lo que entra.","Ejemplos de la vida: el precio del taxi es función de los kilómetros. La factura de la luz es función del consumo. Tu peso es función de lo que comes y andas.","Una función se puede dibujar: cada x da una y, y los puntos (x, y) forman un dibujo en el plano. Ese dibujo cuenta la historia completa de la máquina.","La notación f(x) asusta pero es solo una etiqueta: «lo que sale cuando metes x». Nada más."],"quiz":[{"pregunta":"Si f(x) = 2x + 3, ¿cuánto es f(4)?","opciones":["9","11","24"],"correcta":1,"porque":"2×4 + 3 = 11."},{"pregunta":"¿Qué es una función?","opciones":["Un número grande","Una máquina: entra un número y sale otro","Una fracción"],"correcta":1,"porque":"A cada entrada, una salida: esa es toda la idea."},{"pregunta":"El precio del taxi según los kilómetros es…","opciones":["Una función","Una ecuación imposible","Casualidad"],"correcta":0,"porque":"A cada distancia le corresponde un precio: eso es una función."}]},{"titulo":"La recta y la pendiente","contenido":["La función más simple dibuja una línea recta: y = 2x + 1. El 2 es la pendiente (cuánto sube por cada paso a la derecha) y el 1 es dónde corta al eje vertical.","Pendiente grande: sube empinada. Pendiente 1: sube como una escalera de 45 grados. Pendiente 0: plana, no sube. Pendiente negativa: baja.","Ejemplo: un móvil cuesta 10 de fijo más 2 por cada giga: y = 2x + 10. Con 5 gigas pagas 20. La pendiente es «el precio de cada giga».","La pendiente se calcula con dos puntos: subida dividida por avance. Si sube 6 mientras avanza 3, la pendiente es 6 ÷ 3 = 2.","Toda la economía, la física y la ingeniería empiezan aquí: entender cómo una cosa cambia cuando cambia otra."],"quiz":[{"pregunta":"En y = 2x + 1, ¿qué es el 2?","opciones":["La pendiente","El corte con el eje","Un error"],"correcta":0,"porque":"Multiplica a la x: dice cuánto sube la recta por cada paso."},{"pregunta":"Una pendiente negativa significa que la recta…","opciones":["Sube","Baja","Es vertical"],"correcta":1,"porque":"Si y baja cuando x avanza, la pendiente es negativa."},{"pregunta":"Sube 6 mientras avanza 3. ¿Cuál es la pendiente?","opciones":["3","2","18"],"correcta":1,"porque":"Pendiente = subida ÷ avance = 6 ÷ 3 = 2."}]},{"titulo":"Curvas: la parábola y otras formas","contenido":["No todo es recto. y = x² dibuja una parábola: un cuenco. Pasa por (0,0), (1,1), (2,4), (3,9): sube cada vez más deprisa.","La parábola es la forma de una pelota lanzada al aire, de la antena parabólica, de los faros del coche.","El cuenco tiene un fondo: el punto más bajo se llama vértice. En y = x² está en (0, 0). En y = x² − 4 está en (0, −4): la misma curva, bajada 4 pisos.","Hay curvas que se disparan, como y = 2ˣ (crecimiento de epidemias e intereses compuestos), y curvas que se achatan, como y = 10/x (repartir 10 entre cada vez más personas).","Saber qué forma tiene una relación — recta, cuenco, explosión, caída — es entender el mundo antes de calcular nada."],"quiz":[{"pregunta":"¿Qué forma tiene y = x²?","opciones":["Una recta","Un cuenco (parábola)","Un círculo"],"correcta":1,"porque":"Los cuadrados crecen cada vez más deprisa y dibujan un cuenco."},{"pregunta":"¿Qué trayectoria dibuja una pelota lanzada al aire?","opciones":["Recta","Parábola","Zigzag"],"correcta":1,"porque":"Sube frenando y baja acelerando: una parábola boca abajo."},{"pregunta":"La curva y = 2ˣ describe…","opciones":["Crecimiento explosivo","Algo plano","Una bajada"],"correcta":0,"porque":"Cada paso dobla el anterior: 2, 4, 8, 16, 32… una explosión."}]},{"titulo":"Ángulos","contenido":["Un ángulo es una abertura entre dos líneas que se juntan. Se mide en grados (°). La vuelta completa son 360°.","90° es el ángulo recto: la esquina de un libro, de una puerta. Es el ángulo más importante de la construcción.","Menor de 90°: agudo (abierto poco, como unas tijeras cerrándose). Mayor de 90°: obtuso. Exactamente 180°: una línea recta.","Los ángulos de un triángulo siempre suman 180°, los de un cuadrilátero 360°. Si conoces dos ángulos de un triángulo, el tercero sale restando.","Practica mirando el mundo: la esquina de la mesa (90°), la manecilla del reloj a las 3 (90°), a las 6 (180°), abriendo una puerta del todo."],"quiz":[{"pregunta":"¿Cuántos grados tiene un ángulo recto?","opciones":["45","90","180"],"correcta":1,"porque":"La esquina perfecta: 90°."},{"pregunta":"Un triángulo tiene ángulos de 60° y 80°. ¿Cuánto mide el tercero?","opciones":["40°","60°","100°"],"correcta":0,"porque":"Los tres suman 180°: 180 − 60 − 80 = 40."},{"pregunta":"¿Cuántos grados tiene la vuelta completa?","opciones":["180","360","90"],"correcta":1,"porque":"El círculo entero son 360°; media vuelta, 180°."}]},{"titulo":"Triángulos","contenido":["El triángulo es la figura más fuerte: por eso los puentes, las torres eléctricas y las estanterías están llenos de triángulos. No se deforma.","Según sus lados: equilátero (tres iguales, tres ángulos de 60°), isósceles (dos iguales) y escaleno (todos distintos).","El área de cualquier triángulo es base × altura ÷ 2. Un triángulo es exactamente medio rectángulo: córtalo por la diagonal y lo verás.","Un triángulo con base 10 y altura 6 tiene área 10 × 6 ÷ 2 = 30. La mitad del rectángulo de 10 × 6.","La suma de dos lados siempre es mayor que el tercero: con palos de 3, 4 y 10 no se puede cerrar ningún triángulo. El camino directo siempre es el más corto."],"quiz":[{"pregunta":"¿Cuál es el área de un triángulo de base 10 y altura 6?","opciones":["60","30","16"],"correcta":1,"porque":"Base × altura ÷ 2 = 10 × 6 ÷ 2 = 30."},{"pregunta":"¿Cómo se llama el triángulo con los tres lados iguales?","opciones":["Isósceles","Escaleno","Equilátero"],"correcta":2,"porque":"Equilátero: tres lados iguales y tres ángulos de 60°."},{"pregunta":"¿Se puede hacer un triángulo con lados de 3, 4 y 10?","opciones":["Sí","No","Solo si es rectángulo"],"correcta":1,"porque":"3 + 4 = 7, que es menos que 10: los palos cortos no llegan a juntarse."}]},{"titulo":"El teorema de Pitágoras","contenido":["En un triángulo con un ángulo recto (90°), el lado más largo se llama hipotenusa. Pitágoras descubrió su secreto: a² + b² = c².","Traducido: los cuadrados de los dos lados cortos, sumados, dan el cuadrado del lado largo. Lados 3 y 4: 9 + 16 = 25, y √25 = 5. La hipotenusa mide 5.","El 3-4-5 es la herramienta de los albañiles desde el antiguo Egipto: para comprobar que una esquina está recta, miden 3 por un lado, 4 por otro, y la diagonal debe dar 5.","Sirve también al revés: conocida la diagonal y un lado, sale el otro. Una escalera de 5 m apoyada a 3 m de la pared: 25 − 9 = 16, √16 = 4. Toca la pared a 4 m de altura.","GPS, pantallas, aviones: cada vez que se calcula una distancia en línea recta, Pitágoras está trabajando."],"quiz":[{"pregunta":"Lados de 3 y 4. ¿Cuánto mide la hipotenusa?","opciones":["7","5","25"],"correcta":1,"porque":"9 + 16 = 25 y √25 = 5."},{"pregunta":"¿Para qué usan los albañiles el 3-4-5?","opciones":["Para pesar cemento","Para comprobar esquinas rectas","Para contar ladrillos"],"correcta":1,"porque":"Si la diagonal mide 5, el ángulo es exactamente de 90°."},{"pregunta":"Escalera de 5 m a 3 m de la pared. ¿A qué altura toca?","opciones":["4 m","2 m","8 m"],"correcta":0,"porque":"25 − 9 = 16 y √16 = 4."}]},{"titulo":"El círculo y el número π","contenido":["El círculo tiene un centro, un radio (del centro al borde) y un diámetro (de borde a borde pasando por el centro: el doble del radio).","Divide la vuelta de cualquier círculo entre su diámetro y siempre sale el mismo número: 3,14159... Se llama π (pi). Es de los números más famosos del mundo.","Longitud de la circunferencia: π × diámetro (o 2πr). Una rueda de 1 m de diámetro avanza unos 3,14 m por vuelta.","Área del círculo: π × r². Una pizza de radio 15 cm: 3,14 × 225 ≈ 700 cm². Una de radio doble (30) tiene CUATRO veces más superficie, no dos: 2.827 cm².","Ese último dato vale dinero: la pizza grande de 30 cm equivale a 4 pequeñas de 15. Compara precios con áreas, no con diámetros."],"quiz":[{"pregunta":"¿Cuánto vale π aproximadamente?","opciones":["2,5","3,14","4"],"correcta":1,"porque":"3,14159…: la vuelta de cualquier círculo es unas 3,14 veces su diámetro."},{"pregunta":"¿Cuál es el área de un círculo de radio 10?","opciones":["314","31,4","100"],"correcta":0,"porque":"π × r² = 3,14 × 100 = 314."},{"pregunta":"Pizza de 30 cm contra pizza de 15 cm. ¿Cuánta más superficie?","opciones":["El doble","El triple","Cuatro veces más"],"correcta":2,"porque":"El área crece con el cuadrado del radio: radio doble, área cuádruple."}]},{"titulo":"Volúmenes","contenido":["El volumen es lo que cabe dentro. En una caja: largo × ancho × alto. Una caja de 2 × 3 × 4 metros tiene 24 metros cúbicos.","Un metro cúbico (1 m × 1 m × 1 m) son 1.000 litros. Así se miden los depósitos de agua y las piscinas.","Cilindro (un bidón): área del círculo de la base × altura = πr² × h. Un bidón de radio 0,3 m y 1 m de alto: 3,14 × 0,09 × 1 ≈ 0,28 m³, unos 280 litros.","Esfera (un balón): 4/3 × π × r³. No hace falta memorizarla; hay que saber que existe y para qué sirve.","Idea clave: si doblas TODAS las medidas de algo, el volumen se multiplica por 8 (2×2×2). Por eso un depósito doble de grande guarda ocho veces más."],"quiz":[{"pregunta":"¿Qué volumen tiene una caja de 2 × 3 × 4 metros?","opciones":["9 m³","24 m³","14 m³"],"correcta":1,"porque":"Largo × ancho × alto = 2 × 3 × 4 = 24."},{"pregunta":"¿Cuántos litros caben en un metro cúbico?","opciones":["100","1.000","10.000"],"correcta":1,"porque":"1 m³ = 1.000 litros."},{"pregunta":"Si doblas todas las medidas de un depósito, su volumen…","opciones":["Se dobla","Se multiplica por 4","Se multiplica por 8"],"correcta":2,"porque":"2 × 2 × 2 = 8: el volumen crece con el cubo de las medidas."}]},{"titulo":"Trigonometría: seno, coseno y tangente","contenido":["La trigonometría estudia la relación entre los lados y los ángulos de los triángulos. Con ella se miden cosas sin tocarlas: alturas de montañas, distancias a barcos, posiciones de satélites.","En un triángulo rectángulo, el seno de un ángulo es: lado de enfrente ÷ hipotenusa. El coseno: lado pegado ÷ hipotenusa. La tangente: enfrente ÷ pegado.","Truco de memoria: SOH-CAH-TOA. SEno = Opuesto/Hipotenusa, CAH: Coseno = Adyacente/Hipotenusa, TOA: Tangente = Opuesto/Adyacente.","Ejemplo real: miras la cima de un árbol con un ángulo de 45° desde 10 m de distancia. A 45° la tangente vale 1, así que altura = 10 × 1 = 10 metros (más tu altura de los ojos).","La calculadora del móvil tiene botones sin, cos, tan (gírala a horizontal si no aparecen). Tú pones el ángulo; ella te da la proporción."],"quiz":[{"pregunta":"¿Qué es el seno de un ángulo?","opciones":["Hipotenusa ÷ opuesto","Opuesto ÷ hipotenusa","Adyacente ÷ opuesto"],"correcta":1,"porque":"SOH: SEno = Opuesto / Hipotenusa."},{"pregunta":"Ángulo de 45°, distancia 10 m, tangente 1. ¿Altura del árbol?","opciones":["5 m","10 m","20 m"],"correcta":1,"porque":"Altura = distancia × tangente = 10 × 1 = 10 m (más la altura de tus ojos)."},{"pregunta":"¿Qué permite medir la trigonometría?","opciones":["Solo triángulos de papel","Distancias y alturas sin tocarlas","Solo círculos"],"correcta":1,"porque":"Con un ángulo y una distancia se calcula lo inalcanzable."}]},{"titulo":"Estadística: media, mediana y moda","contenido":["Tres maneras de resumir un montón de números. Conviene conocer las tres porque cada una cuenta una verdad distinta.","Media: suma todo y divide entre cuántos hay. Edades 20, 30 y 40: media = 90 ÷ 3 = 30.","Mediana: ordena y coge el del medio. En 20, 30 y 40 es 30. Pero en 20, 20 y 80: la media es 40, la mediana es 20. La mediana no se deja arrastrar por los extremos.","Moda: el valor que más se repite. En una zapatería, la moda es la talla que más se vende: es la que hay que tener en stock.","Por eso los sueldos «medios» engañan: un jefe con 10.000 y nueve empleados con 1.000 dan una media de 1.900, pero la mediana es 1.000. Cuando te den una media, pregunta por la mediana."],"quiz":[{"pregunta":"¿Cuál es la media de 20, 30 y 40?","opciones":["30","35","90"],"correcta":0,"porque":"Suma 90, divide entre 3: 30."},{"pregunta":"¿Cuál es la mediana de 20, 20 y 80?","opciones":["40","20","80"],"correcta":1,"porque":"Ordenados, el del medio es 20. La media (40) queda engordada por el 80."},{"pregunta":"¿Qué es la moda?","opciones":["El valor más alto","El valor que más se repite","El valor del medio"],"correcta":1,"porque":"Moda es lo más frecuente: la talla más vendida, la edad más común."}]},{"titulo":"Probabilidad","contenido":["La probabilidad mide lo esperable que es algo: de 0 (imposible) a 1 (seguro). Un 0,5 es «una de cada dos veces»: el 50%.","Se calcula: casos favorables ÷ casos posibles. Sacar un rey de una baraja de 40: hay 4 reyes → 4/40 = 0,1, un 10%.","Cara o cruz: 1/2. Un dado: 1/6 de sacar un 5. La lotería: 1 entre millones. Por eso la lotería es un impuesto a quien no hizo esta lección.","Las rachas no existen: si salió cara cinco veces, la siguiente sigue siendo 1/2. La moneda no tiene memoria. Creer que «ya toca cruz» se llama falacia del jugador y ha arruinado a muchos.","Regla práctica: si entiendes la probabilidad real, nadie te vende humo: ni apuestas, ni «inversiones milagro», ni miedos exagerados."],"quiz":[{"pregunta":"¿Qué probabilidad hay de sacar un rey en una baraja de 40 (4 reyes)?","opciones":["Un 40%","Un 10%","Un 4%"],"correcta":1,"porque":"4/40 = 0,1: una de cada diez veces."},{"pregunta":"Salieron 5 caras seguidas. ¿Qué probabilidad tiene la siguiente cruz?","opciones":["Casi segura","1/2","Muy pequeña"],"correcta":1,"porque":"La moneda no tiene memoria: cada lanzamiento empieza de cero."},{"pregunta":"¿Qué significa probabilidad 0?","opciones":["Muy raro","Imposible","Seguro"],"correcta":1,"porque":"0 es imposible; 1 es seguro; 0,5 está a medias."}]},{"titulo":"Sucesiones y patrones","contenido":["Una sucesión es una lista de números que sigue una regla. Encontrar la regla es encontrar el patrón.","Aritmética: se suma lo mismo cada vez. 5, 8, 11, 14... (suma 3). Es el patrón del ahorro constante: guardo 10 cada semana.","Geométrica: se multiplica por lo mismo. 3, 6, 12, 24... (doble). Es el patrón del interés compuesto, las bacterias y los rumores.","El truco está en comparar vecinos: ¿se suma o se multiplica? ¿Cuánto? Una vez pillada la regla, puedes predecir el futuro de la lista.","Fibonacci: 1, 1, 2, 3, 5, 8, 13... cada uno es la suma de los dos anteriores. Aparece en las piñas, los girasoles y las galaxias. Las matemáticas también hacen poesía."],"quiz":[{"pregunta":"5, 8, 11, 14… ¿qué sigue?","opciones":["16","17","28"],"correcta":1,"porque":"Suma 3 cada vez: 14 + 3 = 17."},{"pregunta":"3, 6, 12, 24… ¿qué sigue?","opciones":["36","48","30"],"correcta":1,"porque":"Se multiplica por 2: 24 × 2 = 48."},{"pregunta":"El interés compuesto sigue una sucesión…","opciones":["Aritmética","Geométrica","Sin patrón"],"correcta":1,"porque":"Cada año se multiplica por el mismo factor: crecimiento geométrico."}]},{"titulo":"Logaritmos","contenido":["El logaritmo es la pregunta al revés de la potencia: si 10³ = 1.000, entonces log(1.000) = 3. Pregunta: «¿a qué exponente elevé 10 para llegar aquí?»","Suena raro, pero mide cosas que van a saltos enormes: los terremotos (escala Richter), el volumen del sonido (decibelios), la acidez (pH).","Cada punto de la escala Richter es 10 veces más fuerte: un terremoto de 6 no es «un poco más» que uno de 5: es DIEZ veces más. Eso lo dice un logaritmo.","También responde preguntas de tiempo: «si mi dinero se dobla cada 8 años, ¿cuándo tendré 8 veces más?» Tres dobladas: 24 años. El logaritmo cuenta doblada
