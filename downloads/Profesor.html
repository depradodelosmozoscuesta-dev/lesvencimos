os dibuja exactos","Los colorea"],"correcta":0,"porque":"Groenlandia parece del tamaño de África y es 14 veces menor: aplanar una esfera siempre miente."},{"pregunta":"¿Qué indican la latitud y la longitud?","opciones":["Cuánto al norte/sur del ecuador y cuánto al este/oeste de Greenwich","La altura","La temperatura"],"correcta":0,"porque":"Dos números localizan cualquier punto del planeta: el DNI geográfico universal."},{"pregunta":"¿Qué ciudad está a la misma latitud que el centro de España?","opciones":["Nueva York, aunque su clima es muy distinto","Oslo","El Cairo"],"correcta":0,"porque":"La latitud no lo es todo: el mar y las corrientes escriben el clima sobre las coordenadas."}]},{"titulo":"Ríos, montañas y mares: la anatomía del planeta","contenido":["Los ríos son las venas de la historia: las civilizaciones nacieron en sus orillas (Nilo, Tigris, Indo, Amarillo) y las ciudades siguen en ellos. En España, el Ebro es el más caudaloso, el Tajo el más largo, y el Guadalquivir el navegable: Sevilla fue puerto de Indias gracias a él.","Las montañas son el esqueleto: los Pirineos y los Alpes nacieron del choque de placas que aún sigue (África empuja Europa unos milímetros al año). Las cordilleras mandan sobre el clima: frenan nubes, crean lluvia de un lado y desierto del otro (la 'sombra orográfica' que seca el sureste español).","Los mares conectan más que separan: el Mediterráneo fue la autopista de fenicios, griegos y romanos ('mare nostrum'), y el estrecho de Gibraltar, con 14 km, es la puerta entre dos mares y dos continentes: por ahí pasan barcos, corrientes y, desde hace milenios, personas e ideas.","Reto: traza en un mapa de España los cinco ríos grandes (Ebro, Duero, Tajo, Guadiana, Guadalquivir) y fíjate: casi todos desembocan en el Atlántico, incluidos los que nacen cerca del Mediterráneo."],"quiz":[{"pregunta":"¿Cuál es el río más caudaloso de España?","opciones":["El Ebro","El Tajo","El Guadalquivir"],"correcta":0,"porque":"El Tajo es el más largo y el Guadalquivir el histórico navegable, pero el Ebro lleva más agua."},{"pregunta":"¿Qué es la sombra orográfica?","opciones":["La sequedad que las montañas crean al frenar las nubes de un lado","La sombra de un pico al atardecer","Una nube grande"],"correcta":0,"porque":"Las cordilleras reparten la lluvia: cara húmeda al viento, cara seca a sotavento. Así se secó el sureste."},{"pregunta":"¿Por qué fue clave el Mediterráneo en la historia?","opciones":["Porque era la autopista que conectaba civilizaciones: más une que separa","Por sus playas","Por el pescado"],"correcta":0,"porque":"Fenicios, griegos y romanos lo llamaron 'nuestro mar': la autopista de la antigüedad."}]},{"titulo":"España en el mapa: diversidad dentro de un país","contenido":["España es un continente pequeño: la Galicia verde y atlántica, la Meseta seca y alta (la mayor altiplanicie de Europa tras Suiza), el sureste casi desértico, los valles húmedos del norte, el Mediterráneo templado. En pocas horas de coche se cruzan tres climas: eso explica la variedad de cocinas, acentos y carácteres.","La organización: 17 comunidades autónomas y 2 ciudades autónomas, 50 provincias, y la capital en el centro exacto (Madrid está donde está porque Felipe II la puso en 1561 buscando el ombligo del reino). Las dos Castillas ocupan la Meseta; las costas concentran la población: el interior se vacía y las costas se llenan.","Las islas son dos mundos aparte: las Canarias, volcánicas y africanas (El Teide, 3.715 m, es el techo de España y el tercer volcán más alto del mundo), y las Baleares, mediterráneas. Y Ceuta y Melilla recuerdan que España tiene frontera terrestre con África.","Reto: localiza en el mapa las cinco cordilleras principales (Pirineos, Cantábrica, Ibérico, Central, Béticas) y mira cómo encierran la Meseta: la geografía explica la historia."],"quiz":[{"pregunta":"¿Qué es la Meseta?","opciones":["La gran altiplanicie central de España, una de las más altas de Europa","Una playa","Un río"],"correcta":0,"porque":"Castilla vive a 600-800 metros de altura: por eso sus inviernos son duros y su cielo, inmenso."},{"pregunta":"¿Por qué Madrid es la capital?","opciones":["Porque Felipe II la puso en 1561 buscando el centro del reino","Por los romanos","Por el puerto"],"correcta":0,"porque":"Una decisión de despacho en el ombligo de la península: la geografía como política."},{"pregunta":"¿Cuál es el techo de España?","opciones":["El Teide, en Tenerife: 3.715 metros","El Mulhacén","El Aneto"],"correcta":0,"porque":"El volcán canario supera a cualquier pico peninsular: el techo de España está en el Atlántico africano."}]}],"nivel":"basico","adultos":false},{"id":"ancianos","titulo":"Cuidar a los mayores","icono":"🧓","lecciones":[{"titulo":"Acompañar sin invadir: el respeto primero","contenido":["Ayudar a una persona mayor empieza por una pregunta: ¿qué necesitas tú, no qué creo yo que necesitas? La mejor ayuda es la que refuerza la autonomía: hacer con, no hacer por. Cada tarea que le quitas del todo es una capacidad que se atrofia: la regla de oro es ayudar lo justo para que siga pudiendo.","El trato diario manda: hablar mirando a los ojos, sin gritar (la sordera no es tontería), sin diminutivos infantiles ('¿qué tal estamos?') y con tiempo: la prisa humilla. La persona mayor es adulta completa con setenta años de experiencia: la memoria puede flaquear, la dignidad no negocia.","Las visitas y las llamadas regulares son medicina: la soledad es el mayor enemigo de la vejez y el calendario de contacto (martes llamada, sábado visita) vale más que el regalo esporádico. Y escuchar de verdad: las historias repetidas no son un fallo, son lo que queda cuando el presente se hace pequeño.","Reto: pregunta hoy a tu mayor qué le gustaría hacer que hace tiempo no hace, y hazlo posible. La mejor ayuda cabe en esa respuesta."],"quiz":[{"pregunta":"¿Cuál es la regla de oro al ayudar a un mayor?","opciones":["Hacer con él, no por él: ayudar lo justo para que siga pudiendo","Hacerlo todo tú","No ayudar nunca"],"correcta":0,"porque":"Cada tarea arrebatada es una capacidad perdida: la autonomía se entrena o se atrofia."},{"pregunta":"¿Cómo se habla con respeto a una persona mayor?","opciones":["Mirando a los ojos, sin gritar, sin infantilizar y con tiempo","Como a un niño","Gritando al oído"],"correcta":0,"porque":"La sordera no es tontería y la edad no es infancia: la dignidad no negocia."},{"pregunta":"¿Qué vale más: el regalo esporádico o el calendario de contacto?","opciones":["El contacto regular: la soledad es el mayor enemigo de la vejez","El regalo caro","Nada"],"correcta":0,"porque":"Martes llamada, sábado visita: la constancia es la medicina que no se compra."}]},{"titulo":"La casa segura: prevenir las caídas","contenido":["Las caídas son la primera causa de accidente grave en mayores, y la mayoría ocurren en casa. La inspección tiene recorrido fijo: alfombras sueltas (fuera o pegadas), cables por el suelo (recogidos), pasillos despejados, luz suficiente en escaleras y de noche (luz de cortesía de la cama al baño: la caída clásica de madrugada).","El baño es la zona cero: barras de agarre junto al inodoro y la ducha, alfombra antideslizante dentro y fuera, silla de ducha si hay mareos, y la temperatura del agua controlada. Una barra bien anclada cuesta veinte euros y vale una cadera.","Los zapatos importan más de lo que parece: cerrados, con suela de goma, sin tacón y del número justo (las zapatillas de andar por casa sueltas son una trampa). Y las revisiones que previenen caídas: vista al día (las gafas viejas causan tropiezos), oído (el equilibrio vive en el oído interno) y revisión de medicamentos que marean.","Reto: haz hoy la ruta de la madrugada (cama → baño) contando obstáculos con los ojos entrecerrados. Lo que tropieces imaginariamente, quítalo de verdad."],"quiz":[{"pregunta":"¿Cuál es la primera causa de accidente grave en mayores?","opciones":["Las caídas en casa","Los incendios","Los atragantamientos"],"correcta":0,"porque":"Y la mayoría son prevenibles: alfombras, cables, poca luz y baño sin agarres son la lista negra."},{"pregunta":"¿Qué tres cosas blindan un baño?","opciones":["Barras de agarre, antideslizantes y silla de ducha si hay mareos","Mármol nuevo","Cortinas bonitas"],"correcta":0,"porque":"Una barra bien anclada cuesta veinte euros y vale una cadera: la cuenta más clara del cuidado."},{"pregunta":"¿Qué calzado previene caídas en casa?","opciones":["Cerrado, suela de goma, del número justo","Zapatillas sueltas","Calcetines solos"],"correcta":0,"porque":"Las zapatillas de andar por casa sueltas son una trampa clásica: el zapato es equipo de seguridad."}]},{"titulo":"Medicinas, citas y papeles: el cuidado ordenado","contenido":["El caos de medicamentos es el peligro silencioso: pastillas duplicadas, horas olvidadas, mezclas que chocan. La solución es el sistema: pastillero semanal preparado el domingo, lista escrita de todos los medicamentos (con dosis y horas) colgada en la cocina y copia en el bolso, y una sola farmacia que ve el cuadro completo.","Las citas médicas se preparan: lista de síntomas y preguntas por escrito, acompañar si se puede (dos pares de oídos retienen el doble), y anotar lo dicho antes de salir. El médico tiene diez minutos: quien llega ordenado, sale mejor atendido. Y los informes y pruebas, archivados en una carpeta que viaja a cada consulta.","Los papeles prácticos que conviene tener al día: la tarjeta sanitaria a mano, los teléfonos de emergencia en la pared en letra grande, las llaves con un vecino de confianza, y hablado en familia (antes de la crisis) lo que la persona quiere: dónde vivir, qué cuidados, qué decisiones. Hablarlo en calma es un regalo, no un mal presagio.","Reto: monta esta semana la carpeta sanitaria de tu mayor: lista de medicinas, informes, teléfonos y citas. Una hora de orden que paga tranquilidad todo el año."],"quiz":[{"pregunta":"¿Cuál es el sistema que ordena las medicinas de un mayor?","opciones":["Pastillero semanal y lista escrita de medicamentos a la vista","La memoria","Botes por toda la casa"],"correcta":0,"porque":"El pastillero del domingo y la lista en la cocina acaban con las dosis dobles y los olvidos."},{"pregunta":"¿Cómo se prepara una cita médica para aprovecharla?","opciones":["Síntomas y preguntas por escrito, acompañar y anotar antes de salir","Improvisando","Sin ir"],"correcta":0,"porque":"El médico tiene diez minutos: quien llega ordenado, sale mejor atendido."},{"pregunta":"¿Qué conversación conviene tener antes de la crisis?","opciones":["Qué quiere la persona: dónde vivir, qué cuidados, qué decisiones","Ninguna: da mala suerte","Solo de herencias"],"correcta":0,"porque":"Hablarlo en calma es un regalo: decidir en la urgencia es decidir mal."}]},{"titulo":"Mente activa, cuerpo en marcha: envejecer bien","contenido":["El cerebro mayor se entrena como el músculo: leer, jugar a las cartas, hacer cuentas, aprender cosas nuevas (un idioma, un instrumento, el móvil) construye reserva cognitiva. Y la actividad social es tan protectora como la mental: el centro de mayores, la peña, la parroquia o el club de lectura son gimnasios de cerebro con café incluido.","El cuerpo pide tres cosas: caminar a diario (el mejor ejercicio y el más barato), ejercicios de fuerza y equilibrio (levantarse de la silla sin manos, estar a la pata coja con apoyo: el equilibrio se pierde si no se practica) y comer con proteína suficiente, que en los mayores es la asignatura pendiente: el músculo necesita material.","Vigilar sin agobiar las señales: pérdida de peso sin explicación, olvidos que cruzan lo normal (perderse en el barrio, repetir la misma pregunta en minutos, no reconocer la rutina), descuido de la higiene o de la casa. La diferencia entre el olvido de la edad y el principio de algo más está en si afecta a la vida diaria: ante la duda, al médico pronto, porque lo que se coge temprano se maneja mejor.","Reto: propón a tu mayor un plan de tres patas: paseo diario, una actividad de grupo semanal y un juego de mesa o lectura compartida. Envejecer bien es un deporte de equipo."],"quiz":[{"pregunta":"¿Qué construye reserva cognitiva en la vejez?","opciones":["Aprender cosas nuevas, leer, jugar y la vida social activa","Ver la tele todo el día","Dormir mucho"],"correcta":0,"porque":"El cerebro se entrena como el músculo: lo nuevo y lo social son sus mejores pesas."},{"pregunta":"¿Cuál es la asignatura pendiente en la comida de los mayores?","opciones":["La proteína suficiente para mantener el músculo","El azúcar","El café"],"correcta":0,"porque":"Sin proteína no hay músculo, y sin músculo no hay independencia: el plato mayor necesita su ración."},{"pregunta":"¿Qué diferencia el olvido normal de la señal de alarma?","opciones":["Que afecte a la vida diaria: perderse en el barrio, repetir la misma pregunta en minutos","Olvidar un nombre","Buscar las gafas"],"correcta":0,"porque":"Olvidar dónde están las llaves es normal; olvidar para qué sirven, no: ante la duda, médico pronto."}]}],"nivel":"medio","adultos":false},{"id":"arte","titulo":"Historia del arte","icono":"🎨","lecciones":[{"titulo":"Arte prehistórico y antiguo: los primeros dibujos","contenido":["El arte nació antes que la escritura: en Altamira y Lascaux, hace 15.000-36.000 años, alguien pintó bisontes y caballos a la luz de una lamparilla de grasa, usando el relieve de la roca para dar volumen. No era decoración: era magia de la caza, rito, memoria. Ya había en ellos todo lo que seguiría: línea, color, movimiento y la necesidad de dejar huella.","Egipto fijó un canon que duró 3.000 años: las figuras de perfil con el ojo de frente, el tamaño según la importancia (el faraón gigante, el enemigo diminuto). No buscaban parecerse al mundo: buscaban ordenarlo. El arte como estabilidad eterna para una civilización que temía el caos.","Grecia inventó la belleza medida: el canon de Policleto (el cuerpo en proporciones matemáticas), el contrapposto (el peso en una pierna: la figura que respira) y el Partenón, donde hasta las columnas se curvan para engañar el ojo hacia la perfección. Roma copió lo griego y añadió el retrato realista: verrugas, arrugas y carácter.","Reto: busca los bisontes de Altamira y fíjate en cómo el pintor usó los bultos de la roca como lomo y barriga del animal. El trampantojo tiene 15.000 años."],"quiz":[{"pregunta":"¿Cuántos años tienen las pinturas de Altamira y Lascaux?","opciones":["Entre 15.000 y 36.000 años: anteriores a la escritura","Quinientos","Dos mil"],"correcta":0,"porque":"Alguien pintó bisontes a la luz de una lamparilla antes de que existiera escribir: el arte es más viejo que la letra."},{"pregunta":"¿Cómo representaba Egipto a las personas?","opciones":["De perfil con el ojo de frente y el tamaño según la importancia","Con fotografía","De espaldas"],"correcta":0,"porque":"No buscaban parecerse al mundo sino ordenarlo: el faraón gigante, el enemigo diminuto, durante 3.000 años."},{"pregunta":"¿Qué es el contrapposto griego?","opciones":["El peso del cuerpo apoyado en una pierna: la figura que respira","Un tipo de columna","Una salsa"],"correcta":0,"porque":"Policleto y los suyos descubrieron que la pierna libre da vida: la estatua dejó de ser un palo."}]},{"titulo":"Edad Media y Renacimiento: de Dios al hombre","contenido":["El arte medieval miraba al cielo: iglesias románicas de piedra gruesa y luz escasa, luego el gótico que conquista la luz con vidrieras y arcos que suben (Chartres, León). Las imágenes eran la Biblia de los que no sabían leer: cada capitel, una lección.","El Renacimiento (siglo XV) cambió el centro: de Dios al hombre. Brunelleschi inventa la perspectiva matemática (el punto de fuga: el mundo en tres dimensiones sobre una tabla plana), Masaccio la estrena, y Leonardo la perfecciona con el sfumato (contornos difuminados como los ve el ojo). Miguel Ángel esculpe el David con 26 años y pinta la Capilla Sixtina tumbado en andamios.","El truco técnico del Renacimiento es la ventana de Alberti: el cuadro como ventana abierta al mundo. Líneas que huyen a un punto, figuras con anatomía estudiada en cadáveres, luz que modela. El artista deja de ser artesano y se convierte en genio: la firma nace aquí.","Reto: mira 'La última cena' de Leonardo y traza con el dedo las líneas del techo y las paredes: todas huyen a la cabeza de Cristo. La perspectiva también predica."],"quiz":[{"pregunta":"¿Qué buscaba el arte gótico que el románico no tenía?","opciones":["Conquistar la luz: vidrieras y arcos que suben","El oro","El retrato"],"correcta":0,"porque":"Del muro grueso a la pared de cristal: el gótico hizo de la luz un sermón."},{"pregunta":"¿Qué inventó Brunelleschi que lo cambió todo?","opciones":["La perspectiva matemática: el punto de fuga","El óleo","La escultura"],"correcta":0,"porque":"Un punto donde huyen las líneas y la tabla plana se convierte en ventana: nació la ilusión de profundidad."},{"pregunta":"¿Qué es el sfumato de Leonardo?","opciones":["Contornos difuminados como los ve el ojo, sin líneas duras","Un pincel","Un color"],"correcta":0,"porque":"La Gioconda sonríe de forma ambigua porque sus comisuras están difuminadas: el ojo las completa."}]},{"titulo":"Barroco y el Siglo de Oro español","contenido":["El Barroco (siglo XVII) es el arte del drama: Caravaggio enciende la oscuridad con un foco lateral (el tenebrismo) y mete santos con cara de tabernero. Bernini hace que el mármol sude y se mueva. El arte deja de ser contemplación para ser golpe de efecto: emocionar para convencer, era la receta de la Contrarreforma.","España vivió su Siglo de Oro pintando: Velázquez llevó la pintura a su cumbre con 'Las Meninas' (1656), un cuadro sobre el propio mirar: el pintor pintándose pintando, el espejo del fondo, el espectador dentro de la escena. Zurbarán pintó monjes con bodegones místicos; Murillo, la ternura sevillana; y Goya cerró el siglo abriendo el siguiente.","Goya es el puente: pintor de la corte que retrató reyes sin adular, pintó la guerra sin heroicidad ('El 3 de mayo') y acabó sordo pintando las Pinturas Negras en las paredes de su casa: el arte moderno (expresión del interior, no del encargo) empieza en esa quinta.","Reto: quédate un minuto ante 'Las Meninas' (en el museo o en imagen): ¿dónde estás tú en el cuadro? Velázquez te dejó el sitio de los reyes."],"quiz":[{"pregunta":"¿Qué es el tenebrismo barroco?","opciones":["Un foco de luz sobre la oscuridad para dar drama, como hizo Caravaggio","Pintar de noche","Usar solo negro"],"correcta":0,"porque":"La luz que rasga la sombra: el teatro llegó a la pintura para emocionar y convencer."},{"pregunta":"¿Qué hace único a 'Las Meninas'?","opciones":["Es un cuadro sobre el propio mirar: el espectador queda dentro de la escena","Es muy grande","Es el más caro"],"correcta":0,"porque":"El pintor se pinta pintando y el espejo refleja a los reyes: donde estás tú, estaban ellos. Foucault le dedicó un capítulo."},{"pregunta":"¿Por qué Goya es el puente al arte moderno?","opciones":["Porque pintó la guerra sin heroicidad y su interior en las Pinturas Negras","Porque era sordo","Porque era español"],"correcta":0,"porque":"Del encargo cortesano a la expresión propia: el arte moderno empieza en la Quinta del Sordo."}]},{"titulo":"Del impresionismo al arte moderno: romper las reglas","contenido":["El impresionismo (1870) fue un escándalo de pinceladas: Monet, Renoir y compañía salieron del estudio a pintar la luz del momento, con manchas de color que solo se ordenan a distancia. El salón oficial los rechazó; la crítica se burló ('impresión' era un insulto). Hoy sus cuadros llenan museos: la vanguardia siempre parece error al principio.","El siglo XX fue una cadena de rupturas: Van Gogh pintó el sentimiento con color y remolinos; Cézanne desmontó las formas en geometrías y Picasso acabó el trabajo con el cubismo (mostrar todas las caras a la vez, como las conoce la memoria); Dalí y los surrealistas pintaron los sueños; Kandinsky cruzó la última frontera: el cuadro sin tema, pura forma y color.","El 'Guernica' (1937) es la cumbre de Picasso y del arte comprometido: el bombardeo de la ciudad vasca convertido en grito universal, en blanco y negro como una fotografía de prensa. El arte del XX demostró que una imagen puede ser conciencia de una época.","Reto: compara el 'Impresión, sol naciente' de Monet con una foto del mismo puerto: ¿dónde hay más verdad, en el detalle o en la luz? Esa pregunta abrió el arte moderno."],"quiz":[{"pregunta":"¿Por qué se llamó 'impresionismo'?","opciones":["Por una burla de la crítica a un cuadro de Monet: 'Impresión, sol naciente'","Porque imprimían","Por una ciudad"],"correcta":0,"porque":"El insulto de un crítico bautizó el movimiento: pintar la impresión del momento, no el detalle del estudio."},{"pregunta":"¿Qué propone el cubismo de Picasso y Braque?","opciones":["Mostrar todas las caras del objeto a la vez, como las conoce la memoria","Pintar cubos","Copiar la realidad"],"correcta":0,"porque":"El ojo fija una vista; la memoria guarda muchas: el cubismo pintó la memoria."},{"pregunta":"¿Por qué el Guernica está en blanco y negro?","opciones":["Como una fotografía de prensa: el grito universal contra el bombardeo","Porque se acabó el color","Por estilo solamente"],"correcta":0,"porque":"Picasso lo despojó de color para que doliera como un titular: el arte como conciencia."}]},{"titulo":"El arte hoy: qué es arte y para qué sirve","contenido":["Desde que Duchamp expuso un urinario en 1917 ('La fuente'), la pregunta cambió: ya no es '¿está bien hecho?' sino '¿qué idea mueve?'. El arte contemporáneo es conceptual: el valor está en la idea, el contexto y la pregunta que plantea. El urinario decía: el museo y el artista deciden qué es arte: y esa provocación abrió el siglo.","El arte actual es un plural: instalaciones que se pisan, performances con el cuerpo, arte urbano (Banksy convirtiendo muros en titulares), arte digital e inteligencia artificial. La regla para no perderse: preguntar qué intenta decir la obra antes de juzgar cómo está hecha. Y permitirse no entender: el arte también es conversación, no examen.","¿Para qué sirve el arte? Para lo que sirvió en Altamira: vernos desde fuera, recordar quiénes somos, emocionarnos juntos y preguntarnos lo que las palabras no alcanzan. Una sociedad sin arte es una sociedad sin espejo: la técnica cambia, la necesidad no.","Reto: visita (en persona o en la web del museo) una obra de arte contemporáneo y escríbete tres líneas: qué ves, qué intenta decir, qué te hace sentir. Eso ya es crítica de arte."],"quiz":[{"pregunta":"¿Qué cambió 'La fuente' de Duchamp en 1917?","opciones":["Convirtió la pregunta en 'qué idea mueve' en lugar de 'está bien hecho'","Nada","Era una broma sin más"],"correcta":0,"porque":"Un urinario firmado preguntó quién decide qué es arte: el arte conceptual nació de ese gesto."},{"pregunta":"¿Qué regla ayuda a entender el arte actual?","opciones":["Preguntar qué intenta decir antes de juzgar cómo está hecho","Mirar el precio","Leer el título solamente"],"correcta":0,"porque":"La idea manda: y permitirse no entender es parte del juego, no un fracaso."},{"pregunta":"¿Para qué sirve el arte según su historia?","opciones":["Para vernos desde fuera, recordar y preguntar lo que las palabras no alcanzan","Para decorar","Para invertir"],"correcta":0,"porque":"Desde Altamira: la técnica cambia, la necesidad de espejo no."}]}],"nivel":"medio","adultos":false},{"id":"dibujo","titulo":"Programa de dibujo: de cero a cuaderno","icono":"✏️","lecciones":[{"titulo":"Dibujar es mirar: el programa arranca","contenido":["El secreto del dibujo no está en la mano: está en el ojo. Dibujar es aprender a ver lo que hay en lugar de lo que crees que hay: el niño dibuja el símbolo de una casa; el dibujante dibuja ESTA casa, con su inclinación y sus sombras. La primera semana de cualquier curso serio no se dibuja mejor: se mira mejor.","El material mínimo cabe en un bolsillo: un lápiz de grafito medio (HB o 2B), una goma maleable y un cuaderno de hojas lisas. No hace falta más durante meses: el dibujo es el arte más barato del mundo. La regla del cuaderno: no arrancar páginas: los dibujos malos son el mapa del progreso.","El primer ejercicio es legendario: dibuja tu mano sin levantar el lápiz y sin mirar el papel, siguiendo el contorno con la vista como una hormiga lenta (dibujo de contorno ciego). Saldrá torcido y es el objetivo: sincronizar ojo y mano. Cinco minutos al día de ese ejercicio cambian más que horas de copiar dibujos bonitos.","Reto del día 1: tu mano en contorno ciego, tres veces, sin borrar. Fecha la página: dentro de un mes será tu medalla."],"quiz":[{"pregunta":"¿Dónde está el secreto del dibujo?","opciones":["En el ojo: dibujar es aprender a ver lo que hay","En el pulso","En los lápices caros"],"correcta":0,"porque":"El niño dibuja el símbolo; el dibujante dibuja ESTA casa: la primera lección es mirar."},{"pregunta":"¿Qué material hace falta para empezar?","opciones":["Un lápiz HB, una goma y un cuaderno: nada más","Un caballete","Treinta rotuladores"],"correcta":0,"porque":"El dibujo es el arte más barato del mundo: el bolsillo del material no excusa a nadie."},{"pregunta":"¿Qué es el dibujo de contorno ciego?","opciones":["Dibujar sin mirar el papel, siguiendo el contorno con la vista como una hormiga","Dibujar con los ojos cerrados","Dibujar rápido"],"correcta":0,"porque":"Sale torcido y ese es el objetivo: sincronizar ojo y mano, el ejercicio madre de todos los cursos."}]},{"titulo":"Línea, forma y proporción: la semana 1","contenido":["Toda forma compleja se rompe en formas simples: la cabeza es un óvalo, el tronco una caja, los brazos cilindros. El dibujante profesional empieza siempre por el esqueleto de formas grandes y añade detalle al final. Quien empieza por la pestaña se queda sin cara: lo general primero, lo particular después.","La proporción se mide con el lápiz: brazo estirado, pulgar sobre el lápiz, se mide la altura del modelo y se compara con su anchura (¿cuántas veces cabe la cabeza en el cuerpo? En el adulto: unas siete y media). Medir con el lápiz convierte el 'me sale raro' en un dato: el ojo engaña, la comparación no.","La línea tiene carácter: la línea floja y miedosa delata la muñeca tensa; la línea segura nace de dibujar desde el hombro, no desde los dedos. Ejercicio de calentamiento diario: una página de líneas largas y de círculos sueltos, rápidos, del hombro. La escritura bonita y el dibujo suelto usan músculos distintos.","Reto de la semana 1: dibuja una taza por formas (cilindro + asa torcida) midiendo con el lápiz. Luego una página de líneas del hombro. Veinte minutos diarios bastan."],"quiz":[{"pregunta":"¿Por dónde empieza el dibujante profesional?","opciones":["Por las formas grandes: óvalos, cajas y cilindros; el detalle al final","Por las pestañas","Por la sombra"],"correcta":0,"porque":"Quien empieza por la pestaña se queda sin cara: lo general primero, lo particular después."},{"pregunta":"¿Cómo se mide la proporción?","opciones":["Con el lápiz a brazo estirado: comparar alturas y anchuras con el pulgar","A ojo","Con regla siempre"],"correcta":0,"porque":"El brazo estirado y el pulgar convierten el 'me sale raro' en un dato medible."},{"pregunta":"¿De dónde nace la línea segura?","opciones":["Del hombro, no de los dedos: dibujar con el brazo","De la muñeca","De la goma"],"correcta":0,"porque":"Una página diaria de líneas largas del hombro es el calentamiento de todos los dibujantes."}]},{"titulo":"Luz y sombra: el volumen aparece (semana 2)","contenido":["El volumen no se dibuja con líneas sino con luz: toda forma redonda tiene su mapa de cinco zonas (luz directa, medio tono, núcleo de sombra, sombra reflejada y sombra proyectada). Entender ese mapa es entender por qué una esfera parece esfera: y es el mismo mapa en una manzana, una mejilla o una montaña.","El ejercicio clásico es la esfera: dibuja un círculo, decide de dónde viene la luz, y sombrea en degradado suave del lado contrario, con la sombra proyectada que lo ancla al suelo (sin ella, la esfera flota). En una hora de esfera se aprende más de volumen que en un mes de dibujos planos.","El sombreado se hace en capas: primero tono medio en toda la zona de sombra, luego oscurecer por pasadas cruzadas (achurado), nunca frotando con el dedo al principio (mancha sin control). El borde más oscuro no es el contorno: es el núcleo de la sombra, justo donde la forma gira. Ahí vive el truco de los maestros.","Reto de la semana 2: una esfera diaria con luz de distinto lado cada día, y luego una fruta real de la cocina con una lamparita. La cocina es el estudio del pintor desde Chardin."],"quiz":[{"pregunta":"¿Con qué se dibuja el volumen?","opciones":["Con luz y sombra: el mapa de cinco zonas de la forma","Con líneas más gordas","Con color"],"correcta":0,"porque":"Luz directa, medio tono, núcleo de sombra, reflejo y sombra proyectada: el mapa de toda forma redonda."},{"pregunta":"¿Para qué sirve la sombra proyectada?","opciones":["Para anclar el objeto al suelo: sin ella, flota","Para decorar","Para nada"],"correcta":0,"porque":"La sombra en el suelo es la gravedad del dibujo: sin ella, la esfera es un globo al viento."},{"pregunta":"¿Dónde está el punto más oscuro de una forma redonda?","opciones":["En el núcleo de la sombra, donde la forma gira: no en el contorno","En el borde","En la luz"],"correcta":0,"porque":"El contorno recibe luz reflejada del suelo; el núcleo es el último lugar donde muere la luz: el truco de los maestros."}]},{"titulo":"Perspectiva: la profundidad engañada (semana 3)","contenido":["La perspectiva es el truco de poner el espacio en el papel: las líneas paralelas que se alejan se juntan en puntos de fuga sobre la línea del horizonte (que es, exactamente, la altura de tus ojos). Con un punto de fuga se dibujan calles y vías de tren; con dos, las esquinas de los edificios; con tres, el vértigo de mirar un rascacielos.","La línea del horizonte es la clave que nadie ve: está en todos los dibujos aunque no se dibuje. Todo lo que está por encima de ella muestra su cara inferior; todo lo que está por debajo muestra su cara superior. Por eso las mesas se ven desde arriba y las cornisas desde abajo: tus ojos mandan.","La perspectiva atmosférica es el otro truco, más viejo: lo lejano es más claro, más azulado y menos detallado (Leonardo lo escribió primero). Las montañas del fondo en gris azulado y los árboles del frente en detalle: el paisaje respira profundidad sin una sola línea de fuga.","Reto de la semana 3: dibuja tu calle o tu pasillo con un punto de fuga, marcas el horizonte y comprueba qué caras de los objetos se ven. El pasillo de casa es el mejor maestro de perspectiva."],"quiz":[{"pregunta":"¿Qué es la línea del horizonte en perspectiva?","opciones":["La altura exacta de tus ojos: ahí se juntan las fugas","El mar","El borde del papel"],"correcta":0,"porque":"El horizonte sube y baja contigo: por eso las mesas se ven desde arriba y las cornisas desde abajo."},{"pregunta":"¿Cuántos puntos de fuga hacen falta para dibujar una esquina de edificio?","opciones":["Dos: uno para cada dirección de la esquina","Uno","Siete"],"correcta":0,"porque":"Un punto para la calle, dos para la esquina, tres para el vértigo del rascacielos."},{"pregunta":"¿Qué dice la perspectiva atmosférica?","opciones":["Lo lejano es más claro, más azulado y menos detallado","Lo lejano es negro","Nada"],"correcta":0,"porque":"El aire entre el ojo y la montaña aclara y azula: Leonardo lo escribió primero y los paisajistas viven de ello."}]},{"titulo":"Retrato y figura humana: el Everest amable (semana 4)","contenido":["La cara tiene un mapa de proporciones que ya usaba el Renacimiento: los ojos están a mitad de la altura de la cabeza (no arriba: es el error universal del principiante), la base de la nariz a mitad entre ojos y barbilla, la boca a un tercio de esa distancia, las orejas entre ceja y nariz. El mapa es el andamiaje; la persona se dibuja después corrigiendo sobre él.","El cuerpo se mide en cabezas: el adulto mide unas siete cabezas y media, los hombros son dos cabezas de ancho, el codo coincide con la cintura y la muñeca con la cadera. Estas reglas son el mapa; cada cuerpo real es la excursión. Y el dibujo de gesto (capturar la pose en 30 segundos con tres líneas) es el ejercicio que da vida a las figuras: la línea de acción antes que el detalle.","Los errores clásicos del retrato: ojos demasiado arriba, orejas olvidadas, boca demasiado abajo, y dibujar 'símbolos de ojo' en lugar del ojo que se ve. La cura es la de siempre: mirar más que dibujar, medir más que suponer, y dibujar lo feo que sale sin borrarlo todo: el cuaderno es un laboratorio, no una exposición.","Reto de la semana 4: autorretrato de espejo con el mapa de proporciones, y diez dibujos de gesto de la familia viendo la tele. El gesto en 30 segundos es el secreto de la vida en el papel."],"quiz":[{"pregunta":"¿Dónde están los ojos en la cabeza?","opciones":["A mitad de la altura total: el error universal es ponerlos arriba","En el tercio superior","Junto a la frente"],"correcta":0,"porque":"El mapa renacentista: ojos a la mitad, nariz a mitad de ojos-barbilla, boca a un tercio."},{"pregunta":"¿Cuántas cabezas mide un adulto?","opciones":["Unas siete y media","Cuatro","Doce"],"correcta":0,"porque":"La cabeza es la regla del cuerpo: hombros de dos cabezas, codo en la cintura, muñeca en la cadera."},{"pregunta":"¿Qué es el dibujo de gesto?","opciones":["Capturar la pose en 30 segundos con la línea de acción, sin detalle","Un retrato de horas","Copiar fotos"],"correcta":0,"porque":"La línea de acción antes que el detalle: el gesto es lo que da vida a la figura."}]},{"titulo":"El cuaderno de por vida: dibujar como hábito","contenido":["El dibujo mejora por acumulación, no por inspiración: diez minutos diarios durante un año valen más que diez cursos. El cuaderno de viaje (dibujar el café, la plaza, el perro del vecino) convierte cualquier espera en taller y cualquier viaje en doble recuerdo: quien dibuja un lugar lo recuerda siempre.","La constancia tiene trucos: el cuaderno pequeño siempre encima, dibujar lo que haya (la taza de hoy es la lección de hoy), fechar cada página y no borrar los fallos. La comparación mensual es el motor: el dibujo 30 contra el dibujo 1 demuestra lo que la motivación prometía.","Dibujar bien no es el objetivo final: el objetivo es mirar el mundo con más atención, que es otra forma de quererlo. El cuaderno es una conversación contigo en imágenes, el diario más antiguo del mundo: empezó en una cueva y sigue en tu mochila.","Reto final: diez minutos diarios durante 30 días, lo que sea, fechado y sin arrancar páginas. Al terminar, hojea el cuaderno entero: ese viaje es el verdadero diploma."],"quiz":[{"pregunta":"¿Qué hace mejorar en dibujo?","opciones":["Diez minutos diarios durante un año: acumulación, no inspiración","Un curso caro","El talento solo"],"correcta":0,"porque":"La mano aprende por repetición tranquila: el hábito diario vence al curso heroico."},{"pregunta":"¿Por qué no arrancar las páginas malas del cuaderno?","opciones":["Porque son el mapa del progreso y la comparación mensual es el motor","Porque da mala suerte","Por pereza"],"correcta":0,"porque":"El dibujo 30 contra el dibujo 1 demuestra lo que la motivación solo promete."},{"pregunta":"¿Cuál es el verdadero objetivo de dibujar?","opciones":["Mirar el mundo con más atención: otra forma de quererlo","Ganar premios","Copiar fotos"],"correcta":0,"porque":"El cuaderno es el diario más antiguo del mundo: empezó en una cueva y sigue en tu mochila."}]}],"nivel":"basico","adultos":false},{"id":"supervivencia-total","titulo":"Supervivencia completa: curso total","icono":"🏕️","lecciones":[{"titulo":"La mentalidad: la supervivencia empieza en la cabeza","contenido":["Toda historia real de supervivencia tiene el mismo protagonista: la cabeza. Los expertos militares y los supervivientes reales coinciden: el factor decisivo no es la fuerza ni el equipo, es la actitud. El pánico mata más que el frío: la persona que entra en pánico toma malas decisiones en cadena. La receta universal: PARA (Protégete, Analiza, Respira, Actúa) o su versión inglesa STOP: parar, pensar, observar, planear.","Las prioridades no se negocian: la regla de los tres ordena todo (3 minutos sin aire, 3 horas sin refugio en frío extremo, 3 días sin agua, 3 semanas sin comida). El orden de actuación es siempre el mismo: primeros auxilios primero, luego refugio y fuego, luego agua, luego señales, y la comida al final. El hambre aprieta pero no mata en días; la hipotermia mata en horas.","El error mortal más común es caminar sin rumbo para 'buscar ayuda': quien se queda quieto es encontrado; quien deambula se agota, se pierde más y dispersa a los rescatadores. La regla del bosque: si estás perdido y dijiste a alguien tu ruta, quieto, visible y a sobrevivir ordenadamente. El rescate suele llegar: tu trabajo es llegar entero a cuando llegue.","Reto: memoriza la regla de los tres y el orden de prioridades. Son seis líneas que deciden por ti cuando la cabeza no pueda."],"quiz":[{"pregunta":"¿Qué decide la mayoría de las supervivencias reales?","opciones":["La actitud y la calma, no la fuerza ni el equipo","La suerte","El cuchillo"],"correcta":0,"porque":"El pánico toma malas decisiones en cadena: parar, respirar y planear es la primera técnica."},{"pregunta":"¿Cuál es el orden correcto de prioridades?","opciones":["Primeros auxilios, refugio y fuego, agua, señales y comida al final","Comida primero","Caminar buscando ayuda"],"correcta":0,"porque":"La regla de los tres: el refugio mata en horas, el agua en días, el hambre en semanas."},{"pregunta":"¿Qué se hace si estás perdido y avisaste de tu ruta?","opciones":["Quedarse quieto, visible y organizado: el rescate llega","Caminar sin rumbo","Esconderse"],"correcta":0,"porque":"Quien deambula se agota y dispersa a los rescatadores: el quieto es el encontrado."}]},{"titulo":"El refugio: la primera noche no se negocia","contenido":["El refugio es la primera prioridad en frío o lluvia porque la hipotermia mata en horas. Las reglas del sitio: seco, plano, lejos de cauces (la tormenta lejana baja de noche), sin ramas muertas altas (las 'viudas' caen sin aviso), protegido del viento dominante y cerca de materiales. Media hora eligiendo bien el sitio vale una noche.","El refugio más rápido es la 'lean-to': una rama horizontal entre dos árboles a la altura del pecho, ramas apoyadas en diagonal formando un tejado, y encima capas gruesas de hojas, ramas de pino o corteza (mínimo 30 cm: el aislamiento es grosor, no estética). Dentro, una cama de hojas secas de 20 cm: el frío viene del suelo más que del aire, y el colchón importa más que el tejado.","La regla del tamaño: el refugio pequeño se calienta con tu propio cuerpo; el grande se enfría. Y la señal de alarma de la hipotermia es la confusión (la víctima dice tonterías y quiere quitarse ropa): si alguien del grupo 'delira de frío', es emergencia inmediata: calor, refugio y bebida caliente.","Reto: construye un mini-refugio de 1 metro en el parque o el monte con ramas y hojas, sin atar nada. Entender la estructura en pequeño es saberlo hacer en grande."],"quiz":[{"pregunta":"¿Qué es una 'viuda' al elegir el sitio del refugio?","opciones":["Una rama muerta alta que cae sin aviso","Una araña","Una piedra"],"correcta":0,"porque":"Las ramas muertas caen con el viento nocturno: el refugio se monta lejos de ellas."},{"pregunta":"¿Qué aísla más en un refugio: el tejado o el colchón?","opciones":["El colchón de hojas: el frío viene del suelo más que del aire","El tejado","Da igual"],"correcta":0,"porque":"Veinte centímetros de hojas secas debajo valen más que el mejor tejado: el suelo roba el calor."},{"pregunta":"¿Cuál es la señal de alarma de la hipotermia?","opciones":["La confusión y decir tonterías: emergencia inmediata","El hambre","El sueño solamente"],"correcta":0,"porque":"El delirio de frío anuncia el peligro mortal: calor, refugio y bebida caliente sin esperar."}]},{"titulo":"El fuego: calor, agua segura y ánimo","contenido":["El fuego es tres cosas a la vez: calor, agua potable y moral. El kit mental del fuego tiene tres pisos: yesca (lo que prende con una chispa: hierba seca, pelusa, corteza de abedul, yesca comercial), ceba (ramitas finas como cerillas) y leña (de fina a gruesa). El error universal: empezar con leña gorda. El fuego se construye en pirámide o tipi, con aire por abajo: el fuego respira.","Los métodos por orden de fiabilidad: mechero y cerillas (lleva dos medios de fuego siempre, en bolsas distintas), ferrocerio (la barra de chispas funciona mojada: el favorito de los supervivientes), y los métodos de fricción (arco y taladro) que son la universidad del fuego: funcionan, pero exigen técnica, madera adecuada y práctica previa. Nadie hace fuego por fricción la primera vez en la emergencia: se aprende antes, en el jardín.","El fuego responsable: sobre tierra limpia, lejos de raíces y turba (el fuego subterráneo viaja), con agua o tierra preparada, y apagado de verdad (remojado y removido hasta que la ceniza esté fría a la mano). El incendio forestal que arrasa un monte empieza casi siempre en un fuego 'bien apagado'.","Reto: practica el fuego de una cerilla en el jardín o una barbacoa: yesca, ceba y tipi de leña fina. Una cerilla, una sola. Es el examen real."],"quiz":[{"pregunta":"¿Cuál es la estructura correcta para encender un fuego?","opciones":["Yesca, ceba y leña de fina a gruesa, en tipi y con aire por abajo","Leña gorda primero","Todo amontonado"],"correcta":0,"porque":"El fuego respira y crece por escalones: quien empieza con troncos se queda sin fuego y sin cerillas."},{"pregunta":"¿Qué método de fuego funciona mojado?","opciones":["El ferrocerio: la barra de chispas es la favorita de los supervivientes","El mechero","La lupa"],"correcta":0,"porque":"La barra de ferrocerio chispea a 3.000 grados aunque llueva: dos medios de fuego, en bolsas distintas, siempre."},{"pregunta":"¿Cómo se apaga un fuego de verdad?","opciones":["Remojado y removido hasta que la ceniza esté fría al tacto","Con tierra encima y ya","Dejándolo solo"],"correcta":0,"porque":"La brasa bajo la ceniza vive horas y el fuego en turba viaja bajo tierra: frío a la mano o no está apagado."}]},{"titulo":"Agua: encontrarla, filtrarla y hacerla segura","contenido":["El agua es la prioridad número uno real: a los tres días sin beber el cuerpo falla. Encontrarla en la naturaleza: sigue la vegetación verde, las huellas de animales al amanecer, las zonas bajas del terreno y el vuelo de los pájaros por la tarde (van a beber). En roca, busca las oquedades tras la lluvia; en el barranco seco, cava en la curva exterior donde el agua corre.","Agua turbia o dudosa nunca se bebe cruda: el orden es filtrar y desinfectar. Filtrar con tela, arena y carbón (el filtro de supervivencia en botella: capas de tela, carbón, arena y grava) quita lo sólido pero no los microbios. Desinfectar sí: hervir 1 minuto a borbotones (3 minutos en altura) mata todo; las pastillas potabilizadoras son la opción ligera; el sol (botella transparente 6 horas al sol fuerte, método SODIS) funciona en emergencia.","El sudor es agua que se pierde: en calor, trabajar a la sombra y por las mañanas y tardes ahorra más agua que cualquier filtro. Y nunca: beber orina, alcohol o agua de mar (deshidratan más de lo que dan), ni comer nieve sin fundir (baja la temperatura corporal). La sed ya es señal de deshidratación empezada: bebe a sorbo, no a tragos.","Reto: monta el filtro de botella en casa (tela, carbón, arena, grava) y hierve el agua resultante. Entenderlo haciéndolo es la única forma de tenerlo."],"quiz":[{"pregunta":"¿Cómo se encuentra agua en la naturaleza?","opciones":["Vegetación verde, zonas bajas, huellas al amanecer y pájaros por la tarde","Siguiendo el viento","Cavando en las cumbres"],"correcta":0,"porque":"Los animales beben al alba y los pájaros al atardecer: la naturaleza señala el agua al que la lee."},{"pregunta":"¿Qué mata los microbios del agua dudosa?","opciones":["Hervirla 1 minuto a borbotones (3 en altura) o pastillas potabilizadoras","Filtrarla con tela solamente","Dejarla reposar"],"correcta":0,"porque":"El filtro casero quita lo sólido; solo el hervor o la química matan microbios. Filtrar y luego hervir."},{"pregunta":"¿Por qué no se bebe agua de mar nunca?","opciones":["Porque deshidrata más de lo que da: la sal obliga al riñón a gastar agua","Por el sabor","Sí se puede poco"],"correcta":0,"porque":"El mar es una trampa mortal: cada trago resta. Orina y alcohol, igual: restan más de lo que dan."}]},{"titulo":"Orientación: sol, estrellas y señales del terreno","contenido":["El sol es la primera brújula: sale por el este y se pone por el oeste, y al mediodía solar está al sur (en España). El truco del palo: clava un palo vertical, marca la punta de la sombra, espera 15 minutos y marca la nueva: la línea va de oeste a este, y perpendicular es norte-sur. De noche, la Estrella Polar (la última del carro del carro de la Osa Mayor, cinco veces su distancia) señala el norte exacto.","Los mapas y la brújula se aprenden antes de perderse: el mapa se orienta con la brújula (norte del mapa al norte de la aguja) y el terreno se lee en curvas de nivel (juntas: pendiente; en V: valles y arroyos). El GPS del móvil es maravilloso hasta que se agota la batería: el mapa de papel y la brújula no necesitan cobertura ni pilas.","Perdido de verdad: el barranco baja, el camino baja, el agua baja: seguir los cauces hacia abajo lleva a ríos más grandes y a gente. En España, bajar suele funcionar; en alta montaña, no siempre (hay cortados). La regla general: valle abajo, sendero visible, y deja señales (ramas cruzadas, piedras en flecha) de tu camino para el rescate.","Reto: aprende a localizar la Osa Mayor y la Estrella Polar esta noche. El norte gratis y siempre visible es el superpoder más antiguo."],"quiz":[{"pregunta":"¿Cómo se halla el este-oeste con un palo?","opciones":["Marcando la punta de la sombra dos veces con 15 minutos de diferencia","Mirando las hormigas","Por el musgo"],"correcta":0,"porque":"La sombra se mueve de oeste a este: dos marcas y una línea perpendicular dan los cuatro puntos."},{"pregunta":"¿Cómo se encuentra la Estrella Polar?","opciones":["Prolongando cinco veces la distancia entre las dos estrellas del 'carro' de la Osa Mayor","Es la más brillante","Mirando al sur"],"correcta":0,"porque":"La Polar no es brillante pero es fiel: señala el norte exacto toda la noche, toda la vida."},{"pregunta":"¿Qué regla sirve cuando estás perdido en el monte?","opciones":["Seguir los cauces valle abajo hacia ríos más grandes y dejar señales del camino","Subir a la cumbre","Correr"],"correcta":0,"porque":"El agua baja a la gente: barranco, arroyo, río, pueblo. Y las flechas de piedras guían al rescate."}]},{"titulo":"Comida en la naturaleza: lo último de la lista","contenido":["La comida es la última prioridad (el cuerpo aguanta semanas sin ella) y la más peligrosa de improvisar: la regla de oro es que en duda no se come. Ninguna seta se toca sin conocimiento experto local: no hay truco fiable (ni la cuchara de plata, ni el ajo, ni el color) y los errores de setas se pagan con el hígado. Los expertos en setas se hacen en años, no en emergencias.","Lo seguro en el bosque español: frutos conocidos (moras, castañas asadas, bellotas tostadas y lixiviadas), plantas conocidas sin duda (ortiga hervida como espinaca, diente de león), y las proteínas humildes que no fallan: caracoles (purga de unos días, cocidos), peces con nasa o anzuelo, e insectos (grillos y larvas tostadas: proteína pura que asquea solo a la cabeza).","La pesca y la trampa valen más que la caza: la nasa de botella en el arroyo, el cebo en la hora dorada del amanecer, y la trampa simple para pequeños animales en los senderos que usan (los rastros se leen: huellas, excrementos, ramas rozadas). Cazar sin práctica gasta más calorías de las que da: la pesca quieta es la caza del sabio.","Reto: aprende a identificar cinco plantas comestibles de tu zona con una guía seria (moras, ortiga, diente de león, castaña, higuera). El conocimiento previo es la única despensa fiable."],"quiz":[{"pregunta":"¿Cuál es la regla de oro con la comida silvestre?","opciones":["En duda no se come: no hay truco fiable para las setas","Probar un poco","Lo que comen los pájaros"],"correcta":0,"porque":"Ni cuchara de plata ni ajo ni color: los errores de setas se pagan con el hígado. Experto o nada."},{"pregunta":"¿Qué proteínas humildes no fallan en el monte?","opciones":["Caracoles purgados, pescado de nasa e insectos tostados","Cazar ciervos","Lombrices crudas"],"correcta":0,"porque":"La pesca quieta y el caracol paciente dan más calorías que la caza sin práctica, que las gasta."},{"pregunta":"¿Por qué la comida es la última prioridad?","opciones":["Porque el cuerpo aguanta semanas sin comer y el error alimentario mata antes","Porque engorda","Por pereza"],"correcta":0,"porque":"Refugio y agua matan en horas y días; el hambre, en semanas: primero lo que apura."}]},{"titulo":"Señales de rescate: hacerse encontrar","contenido":["El objetivo de la señal es romper el patrón del terreno: lo que no es natural se ve. El fuego de tres en triángulo es la señal de socorro internacional; el humo de día (hojas verdes sobre el fuego) y la llama de noche. En suelo abierto, la X grande de ropa, piedras o ramas (mínimo 6 metros) se ve desde el aire: el piloto busca formas geométricas que la naturaleza no hace.","El espejo de señales es el instrumento más infravalorado: el destello de un espejo se ve a kilómetros y funciona con el sol incluso sin saber a quién avisas (barre el horizonte). El silbato vale más que la voz: tres toques cortos es la señal universal de socorro, se oye más lejos y no se agota. Gritar cansa; silbar no.","La preparación silenciosa es la mejor señal: dejar dicho el plan (ruta y hora de vuelta) a alguien de confianza es lo que pone a los rescatadores en marcha y en el sitio. La mitad de los rescates españoles se inician porque alguien avisó: el plan dejado en casa es el primer equipo de rescate.","Reto: aprende la señal universal (tres de todo: tres fuegos, tres silbidos, tres destellos) y deja el hábito de avisar tu ruta cada vez que salgas al monte."],"quiz":[{"pregunta":"¿Qué forma toma la señal de socorro internacional?","opciones":["Los grupos de tres: tres fuegos en triángulo, tres silbidos, tres destellos","Un círculo","La letra H sola"],"correcta":0,"porque":"Tres de todo es socorro en cualquier idioma: el triángulo de fuegos y los tres toques de silbato."},{"pregunta":"¿Por qué el silbato vale más que la voz?","opciones":["Se oye más lejos y no se agota: gritar cansa, silbar no","Es más bonito","Es igual"],"correcta":0,"porque":"En la emergencia la voz muere en horas; el silbato sigue de noche y atraviesa el bosque."},{"pregunta":"¿Cuál es la primera herramienta de rescate?","opciones":["Dejar dicho el plan: ruta y hora de vuelta a alguien de confianza","El helicóptero","El móvil"],"correcta":0,"porque":"El aviso previo pone a los rescatadores en marcha y en el sitio: la mitad de los rescates empiezan así."}]},{"titulo":"Primeros auxilios en el monte: lejos de la ayuda","contenido":["En el monte la ayuda tarda horas: el primer respondedor eres tú. La valoración es la urbana (proteger, avisar, socorrer) con un añadido: ¿puede caminar o hay que ir a por ayuda? Las lesiones que no caminan (fractura de pierna, esguince grave, golpe en la cabeza) convierten la excursión en operación de rescate: refugio para el herido, dos que van a por ayuda si es posible, nunca dejar solo al herido salvo obligación.","Las tres urgencias del monte: la hipotermia (abrigo, refugio, bebida caliente, calor compartido cuerpo a cuerpo si hace falta), el golpe de calor (sombra, agua, enfriar cuello y axilas) y las fracturas y esguinces (inmovilizar con lo que haya: palos, mochila, cinta; la extremidad inmovilizada no se empeora en la caminata).","El botiquín del monte cabe en un puño y salva excursiones: gasas, esparadrapo, venda, analgésico, antihistamínico, tijeras, guantes, manta térmica (la de emergencia pesa 50 gramos y refleja el 90% del calor del cuerpo), silbato y cinta americana (la cinta americana arregla botas, mochilas y vendajes: es la navaja suiza de los remiendos).","Reto: monta tu botiquín de puño esta semana y llévalo siempre. La manta térmica de dos euros es el mejor seguro de vida que existe."],"quiz":[{"pregunta":"¿Qué tres urgencias dominan el monte?","opciones":["Hipotermia, golpe de calor y fracturas o esguinces","Picaduras solamente","Hambre"],"correcta":0,"porque":"Frío, calor y traumatismos: el trio que el botiquín y la técnica deben cubrir."},{"pregunta":"¿Qué hace la manta térmica de emergencia?","opciones":["Refleja el 90% del calor del cuerpo y pesa 50 gramos","Da calor eléctrico","Solo tapa"],"correcta":0,"porque":"Dos euros y 50 gramos contra la hipotermia: la mejor relación peso-vida del equipo."},{"pregunta":"¿Qué se hace con una fractura en el monte?","opciones":["Inmovilizar con lo que haya (palos, cinta, mochila) antes de mover","Entablillar en el hospital","Moverla para comprobar"],"correcta":0,"porque":"La extremidad inmovilizada no se empeora en el traslado: palos y cinta americana son la escayola del bosque."}]},{"titulo":"Clima extremo: frío, calor, tormenta y nieve","contenido":["El frío mata por humedad más que por grados: mojado a 10 grados con viento es más peligroso que seco a menos 5. La defensa es la capa y la sequedad: ropa de repuesto en bolsa estanca, nunca dormir con la ropa sudada, y la regla del esfuerzo: si sudas en invierno, vas demasiado abrigado. El viento es el enemigo invisible: la sensación térmica con viento es la cifra que manda.","El calor mata por deshidratación y golpe de calor: agua y sales, trabajo en las horas frescas, cabeza cubierta y ritmo lento. El golpe de calor (piel caliente y seca, confusión, pulso rápido) es emergencia mortal: sombra, enfriar por cuello-axilas-ingle y ayuda ya. La tormenta en montaña tiene sus reglas: fuera de crestas y árboles solitarios, agachado en bola sobre la mochila si te pilla, nunca bajo el árbol más alto.","La nieve exige técnica: la cueva de nieve (la nieve aísla: dentro hay 0 grados aunque fuera haga menos 20), el sol de la nieve ciega (gafas o la máscara con ranuras de emergencia) y la regla del alud: nunca solo, nunca sin conocer el parte, y si te pilla: nadar, y al parar, brazo delante de la cara para hacer aire.","Reto: aprende a leer la sensación térmica (temperatura + viento) en el parte meteorológico de tu próxima salida. El número que manda no es el del termómetro."],"quiz":[{"pregunta":"¿Qué mata más en frío: los grados o la humedad?","opciones":["La humedad y el viento: mojado a 10 grados es peor que seco a menos 5","Los grados solos","La nieve"],"correcta":0,"porque":"El agua roba el calor 25 veces más rápido que el aire: la ropa seca es vida, y si sudas en invierno vas mal."},{"pregunta":"¿Qué es el golpe de calor y cómo se trata?","opciones":["Piel caliente y seca con confusión: emergencia mortal, sombra y enfriar cuello-axilas-ingle","Una sudoración fuerte","Sed"],"correcta":0,"porque":"Cuando el cuerpo deja de sudar, la alarma es máxima: enfriar las zonas grandes de sangre y ayuda ya."},{"pregunta":"¿Qué se hace si te pilla una tormenta en la montaña?","opciones":["Fuera de crestas y árboles solitarios, agachado en bola, lejos del punto más alto","Bajo el árbol más grande","Corriendo"],"correcta":0,"porque":"El rayo busca el punto alto: no serlo es la técnica. En bola, con los pies juntos, sobre la mochila."}]},{"titulo":"El kit de supervivencia: lo que cabe en una mochila","contenido":["El equipo de supervivencia se resume en las diez esencias: navaja o multiherramienta, dos medios de fuego, manta térmica, silbato, fronta o linterna con pilas de repuesto, botiquín de puño, cinta americana, cuerda (10 metros de paracord), recipiente para agua y pastillas potabilizadoras, mapa y brújula. Todo junto cabe en una riñonera y pesa un kilo: el seguro que nunca estorba.","La regla de los dos: dos medios de fuego, dos formas de purificar agua, dos luces. En supervivencia, uno es ninguno: lo que falla te deja a cero. Y el equipo no sirve sin la práctica: la navaja no afilada, el ferrocerio nunca usado y el mapa no leído son peso muerto. El kit se estrena en el jardín, no en la emergencia.","El equipo invisible vale más que el visible: avisar la ruta, mirar el parte del tiempo, llevar el móvil cargado (y apagado para ahorrar batería), conocer el 112 y las apps de emergencia con GPS (AlertCops o la app regional de rescate). El mejor equipo de supervivencia es el que hace que no haga falta sobrevivir.","Reto: monta tu riñonera de las diez esencias esta semana y déjala en la mochila para siempre. Un kilo de tranquilidad que no volverás a notar hasta que lo necesites."],"quiz":[{"pregunta":"¿Cuáles son las diez esencias del kit?","opciones":["Navaja, fuego doble, manta térmica, silbato, luz, botiquín, cinta, cuerda, agua y potabilizadoras, mapa y brújula","Comida y una tienda grande","Solo el móvil"],"correcta":0,"porque":"Un kilo en una riñonera cubre refugio, fuego, agua, señales y orientación: el seguro que no estorba."},{"pregunta":"¿Qué dice la regla de los dos?","opciones":["Dos medios de fuego, dos de agua, dos luces: uno es ninguno","Llevar dos mochilas","Ir siempre de dos en dos"],"correcta":0,"porque":"En supervivencia, lo único que falla te deja a cero: la redundancia es el seguro del equipo."},{"pregunta":"¿Cuál es el mejor equipo de supervivencia?","opciones":["El que hace que no haga falta: avisar la ruta, mirar el parte, el móvil cargado","El más caro","El más pesado"],"correcta":0,"porque":"La preparación silenciosa evita la mayoría de las emergencias: el kit se compra; la prudencia se entrena."}]},{"titulo":"Supervivencia urbana: la ciudad también falla","contenido":["La ciudad da sustos distintos: apagones largos, inundaciones, olas de calor, terremotos. El kit urbano es la versión doméstica: agua embotellada (4 litros por persona y día, para 3 días), comida que no necesite cocina, linternas y pilas, radio a pilas (cuando el móvil no tiene red, la radio informa), botiquín, efectivo en billetes pequeños (sin luz no hay datáfono) y las llaves y documentos en copia.","El terremoto en ciudad tiene protocolo: dentro, protégete bajo mesa firme o junto a muro de carga, lejos de cristales; fuera, en zona abierta lejos de fachadas. Después: cierra gas y luz si huele o suena, zapatos puestos (los cristales cortan la huida), escaleras siempre, ascensor nunca. Y la inundación: nunca cruzar corrientes de agua al tobillo con el coche (30 cm de agua arrastran un coche) ni a pie sin palo que sondee.","La ola de calor urbana castiga a los mayores y solos: la ronda de vecinos (llamar al mayor de la escalera en los días rojos) salva más vidas que cualquier app. Y el apagón largo: la nevera cerrada conserva 4 horas, el congelador 24; las velas con cuidado y el grupo de vecinos informado por la radio a pilas.","Reto: prepara esta semana la bolsa de emergencia de casa (agua, linterna, radio, botiquín, efectivo, documentos) en un lugar conocido por toda la familia. La ciudad agradece a los previsores."],"quiz":[{"pregunta":"¿Cuánta agua guarda el kit urbano de emergencia?","opciones":["4 litros por persona y día, para 3 días","Una botella","Ninguna: hay grifo"],"correcta":0,"porque":"Cuando la red falla, el grifo calla: doce litros por persona es el colchón doméstico."},{"pregunta":"¿Qué se hace en un terremoto dentro de casa?","opciones":["Bajo una mesa firme o junto a muro de carga, lejos de cristales","Salir corriendo por las escaleras","En el ascensor"],"correcta":0,"porque":"La mayoría de las heridas son cristales y caídas de cosas: protegerse dentro hasta que pare, luego salir por escaleras."},{"pregunta":"¿Cuánta agua hace falta para que arrastre un coche?","opciones":["30 centímetros de corriente bastan","Un metro","No lo arrastra"],"correcta":0,"porque":"Nunca cruzar inundaciones con el coche: la DANA lo enseñó trágicamente. El agua al tobillo ya engaña."}]},{"titulo":"La psicología del rescate: aguantar y ayudar","contenido":["La mente en la emergencia atraviesa fases conocidas: shock ('esto no puede estar pasando'), negación, y luego la decisión. Los que aguantan son los que se dan tareas: la mente ocupada no entra en pánico. La técnica del rescate psicológico es el pequeño paso: no 'voy a morir' sino 'ahora enciendo el fuego; luego, agua'. La supervivencia se gana en tareas de diez minutos.","Ayudar a otros en crisis es técnica también: hablar bajo y claro, dar órdenes concretas y amables ('siéntate aquí, coge esto'), no preguntar en abstracto. El que está en shock necesita que otro piense por él un rato: y cederle tareas pequeñas es la forma de devolverle el mando. El grupo que se organiza sobrevive mejor que el grupo fuerte.","El humor negro, la canción, la rutina del campamento: los supervivientes reales lo repiten: aguantar la moral es aguantar la vida. Y después del rescate, la cabeza sigue trabajando: hablar de lo vivido, sin prisa y sin vergüenza, es parte de la cura. Lo que se nombra, se integra; lo que se calla, vuelve.","Reto: ensaya mentalmente tu plan: si mañana te pierdes en tu ruta habitual, ¿qué haces en los primeros diez minutos? La mente que ensaya, no se sorprende."],"quiz":[{"pregunta":"¿Cuál es la técnica psicológica clave en una emergencia?","opciones":["Dividir en tareas de diez minutos: la mente ocupada no entra en pánico","Pensar en el final","Dormir"],"correcta":0,"porque":"El pánico crece en el vacío: 'ahora el fuego, luego el agua' es la escalera que saca del miedo."},{"pregunta":"¿Cómo se ayuda a alguien en shock?","opciones":["Con voz baja, órdenes concretas y amables, y tareas pequeñas que le devuelvan el mando","Gritándole que reaccione","Dejándolo solo"],"correcta":0,"porque":"El shock necesita que otro piense un rato: las órdenes concretas son la mano que lo saca."},{"pregunta":"¿Qué papel juega hablar después del rescate?","opciones":["Nombrar lo vivido lo integra: lo que se calla, vuelve","Ninguno","Hay que olvidar"],"correcta":0,"porque":"La cabeza sigue trabajando después: hablarlo sin vergüenza es parte de la cura."}]}],"nivel":"avanzado","adultos":false}];

/* ═══════════════════════════════════════════════════════════
   EL PROFESOR — el programa

   Se expone como window.Profesor para poder montarlo dentro de otro
   asistente sin tocar nada:

       Profesor.montar(document.getElementById("mi-hueco"), {
         quien: "ana",            // con quién va el avance
         rol: "peque",            // "peque" filtra materias (ver abajo)
         guardar: async (avance) => { ... },   // opcional
         leer:    async ()       => ({ ... }), // opcional
       });

   Si no se le pasan `guardar` y `leer`, usa el almacén del navegador.
   Así funciona solo, y encaja con un servidor el día que haga falta.
   ═══════════════════════════════════════════════════════════ */
(function (global) {
  "use strict";

  const NIVELES = { basico: "Básico", medio: "Medio", avanzado: "Avanzado" };
  const LLAVE = "profesor:avance:";

  // ——— dónde se guarda el avance ———
  // El almacén del navegador puede fallar (ventana privada, permisos,
  // datos borrados). Si falla no se pierde la lección: se sigue en
  // memoria y ya está. Perder el avance es molesto; que reviente la
  // pantalla a media lección es peor.
  const enMemoria = {};
  function leerLocal(quien) {
    try {
      const t = localStorage.getItem(LLAVE + quien);
      return t ? JSON.parse(t) : (enMemoria[quien] || {});
    } catch (e) { return enMemoria[quien] || {}; }
  }
  function guardarLocal(quien, datos) {
    enMemoria[quien] = datos;
    try { localStorage.setItem(LLAVE + quien, JSON.stringify(datos)); }
    catch (e) { /* en memoria se queda, y la lección no se pierde */ }
  }

  function quienesHay() {
    const fuera = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(LLAVE)) fuera.push(k.slice(LLAVE.length));
      }
    } catch (e) { /* sin almacén, se empieza de cero */ }
    for (const k of Object.keys(enMemoria)) if (!fuera.includes(k)) fuera.push(k);
    return fuera.sort();
  }

  /* ——— qué materias ve cada cual ———
     A un peque no le salen LPIC-1 ni Ciberseguridad avanzada: se ahoga
     la lista y no encuentra lo suyo. Y tampoco las materias marcadas
     como de adultos, que es una cosa DISTINTA del nivel: «Sexualidad y
     bienestar» está escrita con lenguaje sencillo, pero no va en la
     pantalla de un niño de ocho años. Mezclar las dos cosas es lo que
     la dejaba ahí. */
  function materiasDe(rol, temario) {
    if (rol === "peque") {
      return temario.filter(m => m.nivel === "basico" && !m.adultos);
    }
    return temario;
  }

  // El orden en que se enseñan los niveles. Sin esto salen como estén
  // escritos en el temario, y «avanzado» aparece antes que «básico».
  const ORDEN = { basico: 0, medio: 1, avanzado: 2 };

  function crear(etiqueta, clase, texto) {
    const e = document.createElement(etiqueta);
    if (clase) e.className = clase;
    if (texto != null) e.textContent = texto;
    return e;
  }

  function Profesor(hueco, opciones) {
    const op = opciones || {};
    // Ojo con esto: el temario se declara con `const TEMARIO = [...]`, y
    // un const del ámbito global NO se cuelga de window. Buscarlo como
    // global.TEMARIO daba una lista vacía y la pantalla salía con el
    // aviso de «no encuentro el temario» aunque estuviera dos líneas
    // más arriba en el mismo archivo. Con typeof se ve de las dos
    // formas: como const y como propiedad de window.
    const temario = op.temario ||
      (typeof TEMARIO !== "undefined" ? TEMARIO : (global.TEMARIO || []));
    let quien = op.quien || "yo";
    let rol = op.rol || "adulto";
    let avance = {};

    const leerAvance = op.leer || (async () => leerLocal(quien));
    const guardarAvance = op.guardar || (async (d) => guardarLocal(quien, d));

    // Los tres trozos de pantalla que este módulo gobierna. Cuando va
    // suelto son los de la página; incrustado, se los fabrica.
    const cuerpo = op.cuerpo || document.getElementById("cuerpo") || hueco;
    const elTitulo = op.titulo || document.getElementById("titulo");
    const elAvance = op.avance || document.getElementById("avance");
    const elAtras = op.atras || document.getElementById("atras");

    let volverA = null;              // qué hace el botón de atrás ahora

    function ponerAtras(fn, texto) {
      volverA = fn;
      if (!elAtras) return;
      elAtras.hidden = !fn;
      elAtras.title = texto || "Atrás";
    }
    if (elAtras) elAtras.addEventListener("click", () => { if (volverA) volverA(); });

    function ponerTitulo(t) { if (elTitulo) elTitulo.textContent = t; }
    function ponerAvance(t) { if (elAvance) elAvance.textContent = t || ""; }

    function hecha(materiaId, i) {
      const v = avance[materiaId + ":" + i];
      return !!(v && v.hecha);
    }

    /* ——————————————————— quién estudia ——————————————————— */
    function pintarQuien() {
      cuerpo.replaceChildren();
      ponerTitulo("Profesor");
      ponerAvance("");
      ponerAtras(null);

      const caja = crear("div", "tarjeta");
      caja.appendChild(crear("div", "tarjeta-titulo", "¿Quién estudia?"));
      caja.appendChild(crear("p", "parrafo",
        "Lo que aprende cada uno es suyo: el avance se guarda por " +
        "persona y no se mezcla."));

      const fila = crear("div", "quien");
      const sel = crear("select");
      const hay = quienesHay();
      for (const n of hay) {
        const o = crear("option", null, n); o.value = n; sel.appendChild(o);
      }
      const nuevo = crear("option", null, "— alguien nuevo —");
      nuevo.value = "\u0000nuevo";
      sel.appendChild(nuevo);
      sel.value = hay.includes(quien) ? quien : (hay[0] || "\u0000nuevo");

      const nombre = crear("input");
      nombre.placeholder = "Nombre";
      nombre.hidden = sel.value !== "\u0000nuevo";
      sel.addEventListener("change", () => { nombre.hidden = sel.value !== "\u0000nuevo"; });

      const rolSel = crear("select");
      for (const [v, t] of [["adulto", "Adulto: todo el temario"],
                            ["peque", "Peque: solo lo básico"]]) {
        const o = crear("option", null, t); o.value = v; rolSel.appendChild(o);
      }
      rolSel.value = rol;

      const entrar = crear("button", "btn principal", "Empezar");
      entrar.type = "button";
      entrar.addEventListener("click", async () => {
        const n = sel.value === "\u0000nuevo"
          ? (nombre.value.trim() || "yo") : sel.value;
        quien = n; rol = rolSel.value;
        avance = (await leerAvance(quien)) || {};
        pintarMaterias();
      });

      fila.appendChild(sel); fila.appendChild(nombre);
      fila.appendChild(rolSel); fila.appendChild(entrar);
      caja.appendChild(fila);
      cuerpo.appendChild(caja);
    }

    /* ——————————————————— las materias ——————————————————— */
    function pintarMaterias() {
      cuerpo.replaceChildren();
      cuerpo.scrollTop = 0;
      ponerTitulo("🎓 " + quien);
      ponerAtras(op.quien ? null : pintarQuien, "Cambiar de persona");

      const lista = materiasDe(rol, temario).slice()
        .sort((a, b) => (ORDEN[a.nivel] ?? 9) - (ORDEN[b.nivel] ?? 9));

      let hechas = 0, total = 0;
      for (const m of lista) {
        m.lecciones.forEach((_, i) => { total++; if (hecha(m.id, i)) hechas++; });
      }
      ponerAvance(hechas + " de " + total + " lecciones");

      let nivelActual = "";
      for (const m of lista) {
        if (m.nivel !== nivelActual) {
          nivelActual = m.nivel;
          cuerpo.appendChild(crear("div", "sub", NIVELES[m.nivel] || m.nivel));
        }
        const n = m.lecciones.filter((_, i) => hecha(m.id, i)).length;

        const tarjeta = crear("button", "fila");
        tarjeta.type = "button";
        const izq = crear("div");
        izq.style.flex = "1";
        izq.appendChild(crear("div", "fila-titulo",
          (m.icono ? m.icono + " " : "") + m.titulo));
        const barra = crear("div", "barra-avance");
        const relleno = crear("i");
        relleno.style.width = Math.round(100 * n / m.lecciones.length) + "%";
        barra.appendChild(relleno);
        izq.appendChild(barra);

        const cuenta = crear("div", "fila-sub", n + "/" + m.lecciones.length);
        if (n === m.lecciones.length) cuenta.style.color = "var(--verde)";

        tarjeta.appendChild(izq); tarjeta.appendChild(cuenta);
        tarjeta.addEventListener("click", () => pintarLecciones(m));
        cuerpo.appendChild(tarjeta);
      }
    }

    /* ——————————————————— las lecciones ——————————————————— */
    function pintarLecciones(materia) {
      cuerpo.replaceChildren();
      cuerpo.scrollTop = 0;
      ponerTitulo((materia.icono ? materia.icono + " " : "") + materia.titulo);
      ponerAtras(pintarMaterias, "Materias");
      const n = materia.lecciones.filter((_, i) => hecha(materia.id, i)).length;
      ponerAvance(n + " de " + materia.lecciones.length);

      materia.lecciones.forEach((l, i) => {
        const f = crear("button", "fila");
        f.type = "button";
        const marca = crear("span", null, hecha(materia.id, i) ? "✓" : "•");
        marca.style.cssText = "width:18px;flex:0 0 18px;color:" +
          (hecha(materia.id, i) ? "var(--verde)" : "var(--tinta-suave)");
        const t = crear("div", "fila-titulo", l.titulo);
        t.style.flex = "1";
        f.appendChild(marca); f.appendChild(t);
        const v = avance[materia.id + ":" + i];
        if (v && v.total) f.appendChild(crear("div", "fila-sub", v.aciertos + "/" + v.total));
        f.addEventListener("click", () => pintarLeccion(materia, i));
        cuerpo.appendChild(f);
      });
    }

    /* ——————————————————— una lección ——————————————————— */
    function pintarLeccion(materia, indice) {
      const l = materia.lecciones[indice];
      cuerpo.replaceChildren();
      cuerpo.scrollTop = 0;
      ponerTitulo(l.titulo);
      ponerAtras(() => pintarLecciones(materia), materia.titulo);
      ponerAvance("Lección " + (indice + 1) + " de " + materia.lecciones.length);

      const caja = crear("div", "tarjeta");
      caja.appendChild(crear("div", "tarjeta-titulo", l.titulo));
      for (const parrafo of (l.contenido || [])) {
        // textContent y no innerHTML: el temario es texto, no HTML. Si
        // una lección lleva un < o un &, así se lee como se escribió y
        // no se cuela nada raro en la página.
        caja.appendChild(crear("p", "parrafo", parrafo));
      }
      cuerpo.appendChild(caja);

      const pie = crear("div", "fin");
      const imprimir = crear("button", "btn", "🖨 Imprimir");
      imprimir.type = "button";
      imprimir.addEventListener("click", () => global.print());
      pie.appendChild(imprimir);

      if (!(l.quiz || []).length) {
        const b = crear("button", "btn principal", "✓ Leída");
        b.type = "button";
        b.addEventListener("click", () => terminar(materia, indice, 0, 0));
        pie.appendChild(b);
        cuerpo.appendChild(pie);
        return;
      }
      cuerpo.appendChild(pie);
      pintarPregunta(materia, indice, 0, 0);
    }

    /* ——————————————————— el quiz ——————————————————— */
    function pintarPregunta(materia, indice, numero, aciertos) {
      const l = materia.lecciones[indice];
      const q = l.quiz[numero];

      const viejo = document.getElementById("quiz");
      if (viejo) viejo.remove();
      const caja = crear("div", "tarjeta");
      caja.id = "quiz";
      caja.style.marginTop = "12px";

      caja.appendChild(crear("div", "fila-sub",
        "Pregunta " + (numero + 1) + " de " + l.quiz.length));
      const t = crear("div", "fila-titulo", q.pregunta);
      t.style.margin = "8px 0 12px";
      caja.appendChild(t);

      q.opciones.forEach((texto, i) => {
        const b = crear("button", "opcion", texto);
        b.type = "button";
        b.addEventListener("click", () => {
          // Al responder se bloquean todas: sin esto se puede pulsar la
          // siguiente antes de leer por qué falló, que es justo lo
          // único que enseña de una respuesta mal.
          for (const otra of caja.querySelectorAll(".opcion")) otra.disabled = true;
          const bien = i === q.correcta;
          b.classList.add(bien ? "bien" : "mal");
          if (!bien) caja.querySelectorAll(".opcion")[q.correcta].classList.add("bien");

          caja.appendChild(crear("div", "porque",
            (bien ? "✓ " : "✗ ") + (q.porque || "")));

          const ultima = numero + 1 >= l.quiz.length;
          const seguir = crear("button", "btn principal",
            ultima ? "Terminar" : "Siguiente →");
          seguir.type = "button";
          seguir.style.marginTop = "12px";
          seguir.addEventListener("click", () => {
            const suma = aciertos + (bien ? 1 : 0);
            if (ultima) terminar(materia, indice, suma, l.quiz.length);
            else pintarPregunta(materia, indice, numero + 1, suma);
          });
          caja.appendChild(seguir);
          seguir.scrollIntoView({ block: "nearest", behavior: "smooth" });
        });
        caja.appendChild(b);
      });
      cuerpo.appendChild(caja);
    }

    /* ——————————————————— apuntar lo hecho ——————————————————— */
    async function terminar(materia, indice, aciertos, total) {
      const clave = materia.id + ":" + indice;
      const antes = avance[clave] || {};
      // Se queda el MEJOR resultado, no el último: repasar una lección
      // y fallar no debería borrar que la aprobaste.
      avance[clave] = {
        hecha: true,
        aciertos: Math.max(Number(antes.aciertos) || 0, aciertos),
        total: total,
        veces: (Number(antes.veces) || 0) + 1,
        fecha: new Date().toISOString().slice(0, 10),
      };
      try { await guardarAvance(avance, { materia: materia.id, indice, aciertos, total }); }
      catch (e) { /* la lección ya está contada en memoria: no se pierde */ }

      cuerpo.replaceChildren();
      cuerpo.scrollTop = 0;
      ponerAtras(() => pintarLecciones(materia), materia.titulo);

      const caja = crear("div", "tarjeta");
      caja.appendChild(crear("div", "tarjeta-titulo",
        total ? "Lección terminada" : "Lección leída"));
      if (total) {
        const r = crear("div", "numerote", aciertos + " de " + total);
        r.style.color = aciertos === total ? "var(--verde)" : "var(--ambar)";
        caja.appendChild(r);
        caja.appendChild(crear("div", "fila-sub",
          aciertos === total ? "Entera. A la siguiente."
            : aciertos * 2 >= total ? "Bien. Repásala y sale redonda."
              : "Léela otra vez sin prisa; luego se ve clara."));
      }
      cuerpo.appendChild(caja);

      const pie = crear("div", "fin");
      const hay = indice + 1 < materia.lecciones.length;
      if (hay) {
        const sig = crear("button", "btn principal", "Siguiente lección →");
        sig.type = "button";
        sig.addEventListener("click", () => pintarLeccion(materia, indice + 1));
        pie.appendChild(sig);
      }
      const rep = crear("button", "btn", "Repetir");
      rep.type = "button";
      rep.addEventListener("click", () => pintarLeccion(materia, indice));
      pie.appendChild(rep);
      const lista = crear("button", "btn", "← " + materia.titulo);
      lista.type = "button";
      lista.addEventListener("click", () => pintarLecciones(materia));
      pie.appendChild(lista);
      cuerpo.appendChild(pie);
    }

    /* ——————————————————— arrancar ——————————————————— */
    (async function () {
      if (!temario.length) {
        cuerpo.replaceChildren();
        cuerpo.appendChild(crear("div", "aviso",
          "No encuentro el temario. Si lo has separado en otro archivo, " +
          "cárgalo antes que este."));
        return;
      }
      // Si el que llama ya sabe quién estudia (porque lo eligió en su
      // propia pantalla de familia), no se le vuelve a preguntar.
      if (op.quien) {
        avance = (await leerAvance(quien)) || {};
        pintarMaterias();
      } else {
        pintarQuien();
      }
    })();

    return {
      materias: pintarMaterias,
      leccion: pintarLeccion,
      get quien() { return quien; },
      get avance() { return avance; },
    };
  }

  global.Profesor = {
    montar: Profesor,
    // Para contar sin abrir nada: cuántas materias, lecciones y
    // preguntas hay. Útil para enseñarlo en la pantalla de inicio.
    resumen: function (temario) {
      const t = temario ||
        (typeof TEMARIO !== "undefined" ? TEMARIO : (global.TEMARIO || []));
      let lecciones = 0, preguntas = 0;
      for (const m of t) {
        lecciones += m.lecciones.length;
        for (const l of m.lecciones) preguntas += (l.quiz || []).length;
      }
      return { materias: t.length, lecciones, preguntas };
    },
  };
})(window);

/* ——— arrancarlo cuando va suelto ———
   Esto es del archivo suelto, NO del módulo: si copias el módulo dentro
   de otro asistente, eres tú quien decide cuándo montarlo y con quién.
   Por eso la llamada está aquí abajo y no dentro de Profesor. */
Profesor.montar(document.getElementById("cuerpo"));
