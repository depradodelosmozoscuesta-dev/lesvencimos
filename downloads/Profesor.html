s.","No hace falta calcularlos a mano: la calculadora del móvil tiene el botón log. Hace falta entender qué pregunta responden."],"quiz":[{"pregunta":"Si 10³ = 1.000, ¿cuánto es log(1.000)?","opciones":["1.000","3","10"],"correcta":1,"porque":"El logaritmo devuelve el exponente: 3."},{"pregunta":"¿Cuánto más fuerte es un terremoto de 6 que uno de 5?","opciones":["Un poco más","El doble","Diez veces más"],"correcta":2,"porque":"La escala es logarítmica: cada punto multiplica por 10."},{"pregunta":"¿Qué pregunta responde un logaritmo?","opciones":["¿Cuánto es la suma?","¿A qué exponente elevé la base?","¿Cuál es la raíz?"],"correcta":1,"porque":"Es la potencia al revés: te da el exponente desconocido."}]},{"titulo":"Límites: acercarse sin llegar","contenido":["El cálculo universitario entero descansa sobre una idea: el límite. Acercarse a algo todo lo que quieras, aunque nunca llegues.","Parte una tableta de chocolate por la mitad, y la mitad otra vez, y otra... Te quedas con 1/2 + 1/4 + 1/8 + 1/16... Sumas infinitos trozos y el total se acerca a 1 sin pasarse jamás.","Ese «se acerca a 1» es un límite. Los griegos lo vieron como paradoja (¿cómo puede Aquiles alcanzar a la tortuga si siempre le queda la mitad del camino?); Newton y Leibniz lo convirtieron en herramienta.","El truco profundo: con límites, lo infinitamente pequeño deja de dar miedo y se vuelve útil. Se puede sumar lo infinito y trabajar con lo instantáneo.","Todo lo que sigue — derivadas e integrales — son límites con traje de fiesta. Si entiendes esta lección, entiendes la puerta de la universidad."],"quiz":[{"pregunta":"1/2 + 1/4 + 1/8 + 1/16… hasta el infinito se acerca a…","opciones":["Al infinito","A 1","A 2"],"correcta":1,"porque":"Cada trozo nuevo llena la mitad de lo que falta: nunca pasa de 1, pero llega tan cerca como quieras."},{"pregunta":"¿Qué es un límite?","opciones":["Un muro","Un valor al que te acercas todo lo que quieras","Un número negativo"],"correcta":1,"porque":"El límite describe hacia dónde va algo, aunque nunca lo toque."},{"pregunta":"¿Qué herramienta hizo útil lo infinitamente pequeño?","opciones":["La regla","El límite","El compás"],"correcta":1,"porque":"Con límites se puede trabajar con lo infinitesimal de manera exacta."}]},{"titulo":"La derivada: medir el cambio","contenido":["La derivada responde: ¿qué deprisa cambia algo AHORA MISMO? El velocímetro del coche es una derivada: no dice cuánto has recorrido, dice a qué velocidad lo estás recorriendo en este instante.","En una gráfica, la derivada es la pendiente en cada punto. Recta: pendiente constante, derivada siempre igual. Parábola: pendiente que crece, derivada creciente.","La derivada de x² es 2x. En el punto x = 3, la curva sube con pendiente 6. En x = 0, pendiente 0: el fondo del cuenco está plano.","Pendiente cero es oro: ahí la función está en un máximo o un mínimo. ¿El precio que da más beneficio? ¿La hora de menos tráfico? Donde la derivada vale cero.","Física, economía, medicina, ingeniería: todas usan derivadas para optimizar. Entender la idea ya te separa del 95% de la gente."],"quiz":[{"pregunta":"¿Qué mide la derivada?","opciones":["La cantidad total","Lo deprisa que cambia algo en un instante","El promedio"],"correcta":1,"porque":"Es el velocímetro, no el cuentakilómetros: el cambio en el momento."},{"pregunta":"¿Cuál es la derivada de x²?","opciones":["x","2x","x²"],"correcta":1,"porque":"La pendiente del cuenco en cada punto x es 2x."},{"pregunta":"¿Dónde están los máximos y mínimos de una función?","opciones":["Donde la derivada vale cero","En el punto más alto del papel","Al azar"],"correcta":0,"porque":"En la cima y en el fondo la pendiente es plana: derivada cero."}]},{"titulo":"La integral: sumar lo continuo","contenido":["La integral es la hermana gemela de la derivada, al revés. Si la derivada deshace el recorrido en velocidades, la integral junta las velocidades y reconstruye el recorrido.","La idea: para medir el área bajo una curva, córtala en tiras finísimas, súmalas todas, y haz las tiras cada vez más finas hasta el infinito (¡un límite!). El total exacto es la integral.","El cuentakilómetros del coche es una integral: suma todos los instantes de velocidad y te dice los kilómetros totales.","Sirve para calcular áreas imposibles con regla, volúmenes de cualquier forma, el trabajo de una fuerza, la medicina acumulada en la sangre.","El teorema fundamental del cálculo dice: derivada e integral son operaciones inversas, como la suma y la resta. Ese teorema, firmado hace 300 años, sostiene la ciencia moderna. Y tú ya entiendes de qué va."],"quiz":[{"pregunta":"¿Qué calcula la integral?","opciones":["La pendiente","El total acumulado: áreas, distancias, sumas continuas","El máximo"],"correcta":1,"porque":"Junta todos los trocitos y da el total: como el cuentakilómetros con la velocidad."},{"pregunta":"¿Qué relación hay entre derivada e integral?","opciones":["Ninguna","Son operaciones inversas","Son lo mismo"],"correcta":1,"porque":"Una deshace lo que hace la otra: como sumar y restar."},{"pregunta":"¿Cómo se mide el área bajo una curva?","opciones":["No se puede","Cortándola en tiras finísimas y sumando al límite","Con una regla"],"correcta":1,"porque":"Tiras infinitamente finas sumadas: esa es la integral."}]},{"titulo":"Los números primos: los ladrillos","contenido":["Un número primo solo se puede dividir exactamente entre 1 y él mismo: 2, 3, 5, 7, 11, 13, 17, 19, 23... El 12 no es primo porque 12 = 3 × 4. El 13 sí: no hay manera de descomponerlo.","Los primos son los ladrillos de los números: TODO número se fabrica multiplicando primos, y de una sola manera. 60 = 2 × 2 × 3 × 5. Es el «ADN» del número: nadie más tiene esa fórmula.","¿Cómo encontrarlos? La criba de Eratóstenes: escribe los números, tacha los múltiplos de 2, luego los de 3, luego los de 5... Los que sobreviven son primos.","Euclides demostró que nunca se acaban: por grande que sea un primo, siempre hay otro mayor. Los matemáticos siguen cazando primos gigantes: el mayor conocido tiene más de 40 millones de cifras.","¿Y para qué? Tu seguridad digital: cifrar un mensaje es multiplicar dos primos enormes; romper el cifrado exige encontrarlos, y eso llevaría millones de años. Los primos son los cerrajeros de internet."],"quiz":[{"pregunta":"¿Cuál de estos es primo?","opciones":["21","23","27"],"correcta":1,"porque":"21 = 3×7 y 27 = 3×9. El 23 no se descompone en nada: es primo."},{"pregunta":"¿Cómo se descompone 60 en primos?","opciones":["6 × 10","2 × 2 × 3 × 5","4 × 15"],"correcta":1,"porque":"2×2×3×5 = 60, y todos son primos. Esa es su fórmula única."},{"pregunta":"¿Cuántos números primos hay?","opciones":["1.000","Un millón","Infinitos"],"correcta":2,"porque":"Euclides lo demostró hace 2.300 años: siempre hay un primo más grande."}]},{"titulo":"Números irracionales: los indomables","contenido":["Hay números que no se pueden escribir como fracción, por mucho que lo intentes: √2, π... Sus decimales siguen para siempre sin repetirse jamás. Se llaman irracionales.","√2 ≈ 1,4142135623... y podrías calcular mil años más sin encontrar un patrón que se repita. No es que no sepamos: es que se puede DEMOSTRAR que ese patrón no existe.","Los racionales (fracciones) y los irracionales juntos forman los números reales: llenan la recta por completo, sin agujeros. Entre dos números cualesquiera siempre hay infinitos de ambos tipos.","Curiosidad: los irracionales son inmensamente más abundantes que los racionales. Si lanzaras un dardo a la recta numérica, acertar en una fracción exacta tiene probabilidad cero.","No son un capricho: sin irracionales no hay geometría exacta (la diagonal de un cuadrado), ni π, ni la circunferencia de una rueda. Lo indomable resultó ser lo más necesario."],"quiz":[{"pregunta":"¿Qué es un número irracional?","opciones":["Un número negativo","Uno que no se puede escribir como fracción","Un número muy grande"],"correcta":1,"porque":"Sus decimales no terminan ni se repiten nunca: ninguna fracción los captura."},{"pregunta":"¿Cuál de estos es irracional?","opciones":["0,5","√2","3/4"],"correcta":1,"porque":"0,5 y 3/4 son fracciones. √2 demostró ante los griegos que no lo es."},{"pregunta":"Los racionales y los irracionales juntos forman…","opciones":["Los enteros","Los números reales","Los primos"],"correcta":1,"porque":"Juntos llenan la recta numérica entera, sin huecos."}]},{"titulo":"Los números imaginarios: el número imposible","contenido":["¿Qué número multiplicado por sí mismo da −1? Ninguno de los normales: positivo por positivo da positivo, y negativo por negativo también. Durante siglos, la respuesta oficial fue «esa cuenta no tiene sentido».","Hasta que los matemáticos se armaron de valor: inventaron un número nuevo, i, con una sola propiedad: i × i = −1. Y descubrieron que las cuentas salían perfectas.","Los números que mezclan lo normal y lo imaginario se llaman complejos: 3 + 2i. Se dibujan en un plano: los normales a lo ancho, los imaginarios a lo alto.","Con ellos, TODA ecuación tiene solución: es el teorema fundamental del álgebra. Lo que era un callejón sin salida se convirtió en autopista.","Y lo asombroso: ese número «inventado» describe el mundo real mejor que los normales. La electricidad de tu casa, el wifi, la resonancia magnética del hospital: todo se calcula con imaginarios."],"quiz":[{"pregunta":"¿Cuánto es i × i?","opciones":["1","−1","i"],"correcta":1,"porque":"Esa es su única regla y su definición: i² = −1."},{"pregunta":"¿Qué son los números complejos como 3 + 2i?","opciones":["Errores de cálculo","Mezclas de un número normal y uno imaginario","Números negativos"],"correcta":1,"porque":"Tienen una parte real (3) y una parte imaginaria (2i), y se dibujan en un plano."},{"pregunta":"¿Dónde se usan los números imaginarios hoy?","opciones":["En nada, son ficción","En electricidad, wifi y medicina","Solo en libros"],"correcta":1,"porque":"La corriente alterna y las ondas se describen con ellos: lo imposible resultó indispensable."}]},{"titulo":"Combinatoria: el arte de contar sin contar","contenido":["¿De cuántas maneras se pueden ordenar 3 libros en un estante? Contar a mano sale: 6. Pero hay un atajo: 3 opciones para el primer puesto, 2 para el segundo, 1 para el tercero: 3 × 2 × 1 = 6.","Eso se escribe 3! («tres factorial»). Con 10 personas en fila: 10! = 3.628.800 órdenes distintos. Los factoriales crecen a velocidad de vértigo.","Si solo importa QUÉ grupo, no el orden — 3 tapas elegidas entre 10 — se usan las combinaciones: las filas del triángulo de Pascal. De 10 platos eliges 3: hay 120 menús posibles.","La combinatoria decide tu seguridad: un PIN de 4 cifras tiene 10.000 opciones (poco). Una contraseña de 8 letras y números tiene billones de billones (muchísimo). Por eso te piden contraseñas largas.","También decide la lotería: acertar 6 números entre 49 tiene 13.983.816 combinaciones posibles. Tu boleto es una entre catorce millones. Ahora ya lo sabes con números."],"quiz":[{"pregunta":"¿Cuánto es 4! (cuatro factorial)?","opciones":["16","24","10"],"correcta":1,"porque":"4 × 3 × 2 × 1 = 24 órdenes posibles."},{"pregunta":"¿Cuántos PINs distintos de 4 cifras existen?","opciones":["4.000","10.000","40.000"],"correcta":1,"porque":"10 opciones por posición: 10 × 10 × 10 × 10 = 10.000."},{"pregunta":"¿Qué es más seguro contra un ladrón?","opciones":["Un PIN de 4 cifras","Una contraseña larga con letras y números","Es igual"],"correcta":1,"porque":"Más caracteres y más variedad: combinatoria brutal a tu favor."}]},{"titulo":"El número e: el crecimiento continuo","contenido":["Imagina un banco que paga el 100% anual: tus 100 se convierten en 200. Si paga la mitad dos veces al año: 225. Si paga cada mes: unos 261. ¿Y si paga a cada instante?","La cuenta se acerca a un número mágico: 2,71828..., al que Euler llamó e. Es el límite del crecimiento continuo: crece todo lo que puede crecer en cada instante.","e gobierna todo lo que crece en proporción a sí mismo: bacterias que se multiplican, capitales con interés, la radiactividad que decae, una taza de café que se enfría.","Es tan fundamental como π: aparece en la campana de Gauss de la estadística, en las olas, en la epidemia que crece. Donde hay cambio continuo, hay una e escondida.","Euler lo coronó con la fórmula que los matemáticos llaman la más bella: e elevado a (i × π) más 1 es igual a 0. Cinco números legendarios en una sola línea."],"quiz":[{"pregunta":"¿Cuánto vale e aproximadamente?","opciones":["1,5","2,718","3,141"],"correcta":1,"porque":"e ≈ 2,71828...: el límite del crecimiento instantáneo."},{"pregunta":"¿De dónde salió el número e?","opciones":["De medir círculos","De calcular intereses aplicados cada vez más seguido","De contar primos"],"correcta":1,"porque":"Bernoulli lo encontró persiguiendo el interés continuo: los bancos parieron un número cósmico."},{"pregunta":"¿Qué procesos sigue e?","opciones":["Solo bancarios","Todo lo que crece o decae en proporción a sí mismo","Ninguno real"],"correcta":1,"porque":"Poblaciones, intereses, enfriamiento, radiactividad: todos crecen o decaen «al ritmo de sí mismos»."}]},{"titulo":"Matrices y vectores: tablas que calculan","contenido":["Un vector es una lista de números con sentido: (3, 2) puede ser «3 pasos al este, 2 al norte». Una matriz es una tabla de números que TRANSFORMA cosas: gira, estira, mueve.","Las matrices se multiplican entre sí siguiendo su propia regla (fila por columna), y lo asombroso es que multiplicar matrices es encadenar transformaciones: girar y luego estirar en una sola cuenta.","Cada videojuego que has visto funciona así: los personajes son nubes de vectores y cada fotograma multiplica matrices para girarlos, moverlos y proyectarlos en tu pantalla.","Las hojas de cálculo, las fotos (cada píxel, tres números), el GPS: todo son tablas de números procesadas a toda velocidad.","Y la inteligencia artificial: una red neuronal es, esencialmente, multiplicar matrices enormes millones de veces. Cuando hablas con una IA, estás hablando con álgebra de tablas."],"quiz":[{"pregunta":"¿Qué es un vector?","opciones":["Una lista de números con dirección y sentido","Un número negativo","Una fracción"],"correcta":0,"porque":"Como (3, 2): tres pasos al este, dos al norte."},{"pregunta":"¿Qué hace una matriz?","opciones":["Guarda fotos y nada más","Transforma: gira, estira, mueve","Solo suma"],"correcta":1,"porque":"Multiplicar por una matriz es aplicar una transformación completa de una vez."},{"pregunta":"¿Qué usa la inteligencia artificial en su interior?","opciones":["Magia","Multiplicaciones de matrices gigantes","Palomas mensajeras"],"correcta":1,"porque":"Las redes neuronales son álgebra de matrices ejecutada millones de veces."}]},{"titulo":"Series infinitas: sumar lo que no se acaba","contenido":["Una serie es sumar los términos de una sucesión, todos. Suena imposible: ¿cómo se suma lo infinito? Y sin embargo: 1/2 + 1/4 + 1/8 + ... = 1 exactamente. Ya lo viste en la lección de límites.","La clave es que los términos mengüen deprisa. La serie geométrica (cada término es una fracción fija del anterior) siempre tiene suma finita: 1 + 1/2 + 1/4 + ... = 2.","Ejemplo de la vida: una pelota que rebota al 60% de su altura cada vez. Alturas: 1 + 0,6 + 0,36 + ... La suma total es finita: la pelota recorre solo 4 veces su altura y se detiene en tiempo finito.","Las hipotecas son series: cada cuota futura vale hoy un poco menos (el descuento es geométrico). Sumarlas todas da el valor real del préstamo. Los bancos hacen esta cuenta contigo; ahora sabes qué hacen.","Y hay series famosas: la que suma 1 − 1/3 + 1/5 − 1/7 + ... da exactamente π/4. Que sumando fracciones salga el número de los círculos es uno de los grandes misterios hermosos."],"quiz":[{"pregunta":"¿Cuánto suma 1 + 1/2 + 1/4 + 1/8 + ... hasta el infinito?","opciones":["Infinito","2","1"],"correcta":1,"porque":"Cada término llena la mitad de lo que falta para 2: la suma converge a 2."},{"pregunta":"¿Cuándo una serie infinita tiene suma finita?","opciones":["Nunca","Cuando los términos menguan suficientemente deprisa","Siempre"],"correcta":1,"porque":"Si cada término es mucho menor que el anterior, la suma se frena y converge."},{"pregunta":"¿Qué dan las cuotas futuras de una hipoteca sumadas con descuento?","opciones":["Una serie geométrica","Un número primo","Una parábola"],"correcta":0,"porque":"Cada cuota futura vale hoy una fracción fija menos: puro crecimiento geométrico al revés."}]},{"titulo":"El arte de demostrar","contenido":["La matemática es la única ciencia donde las verdades son para siempre. Lo logra con un invento griego: la DEMOSTRACIÓN. No basta con mil ejemplos que funcionen: hay que probar que no puede fallar jamás.","Ejemplo real: «la suma de dos números pares es par». Probar con 2+4, 6+8 no demuestra nada. Pero todo par se escribe 2 veces algo: 2a + 2b = 2(a+b), que es par. Fin. Vale para todos los pares del universo.","Otro método precioso: la reducción al absurdo. Supón lo contrario de lo que quieres probar y sigue la lógica hasta que choque contra una pared. Así demostró Euclides que los primos son infinitos.","Y la inducción: como una fila de dominós. Demuestras el primer caso, y demuestras que cada caso empuja al siguiente. Caen todos, hasta el infinito.","Demostrar no es solo técnica: es una actitud. Quien aprende a exigir demostraciones deja de tragarse promesas vacías, en la pizarra y en la vida."],"quiz":[{"pregunta":"Para demostrar «par + par = par», ¿qué vale?","opciones":["Probar mil ejemplos","Escribir los pares como 2a y 2b y sumar","Preguntar a un experto"],"correcta":1,"porque":"2a + 2b = 2(a+b): la letra habla por TODOS los pares a la vez."},{"pregunta":"¿Qué es una reducción al absurdo?","opciones":["Insultar al contrario","Suponer lo contrario y chocar con una contradicción","Contar muy rápido"],"correcta":1,"porque":"Si suponer lo contrario lleva a un imposible, lo contrario es falso y tu tesis, verdadera."},{"pregunta":"La inducción matemática funciona como…","opciones":["Una fila de dominós","Una lotería","Una espiral"],"correcta":0,"porque":"Demuestras el primer caso y el empujón de cada caso al siguiente: caen todos."}]},{"titulo":"Derivadas: las reglas del juego","contenido":["Derivar tiene trucos que lo hacen mecánico. La regla reina: la derivada de xⁿ es n·xⁿ⁻¹. La de x² es 2x; la de x³ es 3x²; la de x⁵ es 5x⁴. El exponente baja multiplicando y cede un piso.","Regla de la suma: la derivada de una suma es la suma de las derivadas. x³ + x² → 3x² + 2x. Cada término por su lado.","Las constantes desaparecen: la derivada de 7 es 0 (algo fijo no cambia). Y una constante multiplicando se queda: la derivada de 5x² es 10x.","Ejemplo completo: f(x) = x³ − 6x² + 9x + 1 → f'(x) = 3x² − 12x + 9. En un minuto tienes la pendiente de esa curva en cualquier punto.","Las reinas de las derivadas: la de eˣ es eˣ (¡se deriva a sí misma!), la del seno es el coseno, y la del coseno es −seno. Por eso e y las ondas gobiernan la física."],"quiz":[{"pregunta":"¿Cuál es la derivada de x³?","opciones":["x²","3x²","3x³"],"correcta":1,"porque":"El exponente baja multiplicando y cede un piso: 3·x²."},{"pregunta":"¿Cuál es la derivada de 5x²?","opciones":["5x","10x","2x⁵"],"correcta":1,"porque":"La constante se queda y x² baja a 2x: 5 × 2x = 10x."},{"pregunta":"¿Qué función es su propia derivada?","opciones":["x²","eˣ","seno"],"correcta":1,"porque":"La derivada de eˣ es eˣ: crece exactamente al ritmo de sí misma."}]},{"titulo":"Optimización: encontrar el mejor","contenido":["La pregunta más rentable de las matemáticas: ¿cuál es la MEJOR opción? ¿El precio que más beneficio da? ¿La forma que menos material gasta? La derivada responde.","La idea: en el punto más alto de una curva (o el más bajo), la pendiente es plana. Derivada cero = candidato a óptimo. Calcula dónde la derivada vale cero y ahí está el tesoro.","Ejemplo clásico: tienes 40 metros de valla para un corral rectangular. ¿Qué forma da más terreno? El área es x(20−x). Su derivada: 20 − 2x. Cero cuando x = 10: un cuadrado de 10 × 10. El círculo haría aún mejor: la naturaleza siempre optimiza.","Las empresas viven de esto: máximo beneficio, mínimo coste, mínimo tiempo. Las fábricas, las aerolíneas y las redes de reparto optimizan con derivadas cada segundo.","Y tu vida también: repartir tiempo entre tareas, encontrar la dosis justa, elegir la ruta. Optimizar es decidir con matemáticas."],"quiz":[{"pregunta":"¿Dónde está el máximo o mínimo de una función?","opciones":["Donde la derivada es muy grande","Donde la derivada vale cero","En el origen"],"correcta":1,"porque":"En la cima y en el fondo la pendiente es plana: derivada cero."},{"pregunta":"40 m de valla para un corral rectangular. ¿Qué forma da más área?","opciones":["Muy alargado","Un cuadrado de 10 × 10","Da igual"],"correcta":1,"porque":"Área = x(20−x); su derivada 20−2x vale cero en x = 10."},{"pregunta":"¿Qué forma cerrada encierra más área con el mismo perímetro?","opciones":["El cuadrado","El triángulo","El círculo"],"correcta":2,"porque":"El círculo es el campeón absoluto: por eso las pompas de jabón son redondas."}]},{"titulo":"Integrales: reglas y áreas exactas","contenido":["Integrar es derivar al revés: se busca la función cuya derivada es la que tienes. Como la derivada de xⁿ es n·xⁿ⁻¹, la integral de xⁿ es xⁿ⁺¹/(n+1). La integral de x² es x³/3.","Con eso, el área bajo una curva deja de ser misterio: el área bajo x² entre 0 y 3 es 3³/3 = 9. Exacta. Arquímedes tardó meses en este cálculo; tú tardas un minuto.","La integral definida tiene límites: «de 0 a 3». Se calcula la antiderivada en el límite superior menos en el inferior: F(3) − F(0).","Aplicaciones: la distancia a partir de la velocidad, el trabajo de una fuerza, el volumen de sólidos raros, la energía consumida, la medicina acumulada en sangre.","El área bajo una curva de probabilidad da la probabilidad: así se calculan riesgos en seguros y resultados en ensayos médicos. La integral es la calculadora de lo acumulado."],"quiz":[{"pregunta":"¿Cuál es la integral de x²?","opciones":["2x","x³/3","x³"],"correcta":1,"porque":"Sube un piso el exponente y divide entre el nuevo: x³/3. Derívala y vuelves a x²."},{"pregunta":"¿Cuánto vale el área bajo x² entre 0 y 3?","opciones":["9","27","3"],"correcta":0,"porque":"F(3) − F(0) = 27/3 − 0 = 9."},{"pregunta":"¿Cómo se calcula una integral definida?","opciones":["Midiendo con regla","Antiderivada arriba menos antiderivada abajo","No se puede"],"correcta":1,"porque":"El teorema fundamental del cálculo: F(b) − F(a)."}]},{"titulo":"Ecuaciones diferenciales: las leyes del cambio","contenido":["Una ecuación diferencial no pregunta «¿cuánto vale esto?» sino «¿cómo cambia esto?». Es una ecuación donde la incógnita es una función entera y aparece mezclada con su derivada.","Ejemplo: «la velocidad de crecimiento es proporcional a la población». Eso se escribe P' = k·P, y su solución es P = e^(kt): crecimiento exponencial. Así se modelan epidemias y poblaciones.","El enfriamiento del café: «se enfría en proporción a la diferencia con el ambiente» (ley de Newton). Solución: decae hacia la temperatura ambiente con una exponencial.","Las leyes de la física son ecuaciones diferenciales: el movimiento de los planetas, las ondas del sonido, la electricidad, el calor. Newton las inventó para esto: son el idioma en que está escrito el universo.","Resolverlas a mano es un arte; hoy los ordenadores las aproximan millón a millón: la predicción del tiempo, el diseño de aviones y la vacuna que te pusieron salieron de ahí."],"quiz":[{"pregunta":"¿Qué describe una ecuación diferencial?","opciones":["Un número fijo","Cómo cambia algo, mezclando función y derivada","Solo geometría"],"correcta":1,"porque":"La incógnita es una función y aparece con su derivada: habla del cambio."},{"pregunta":"Si P' = k·P, ¿cómo crece la población?","opciones":["En línea recta","Exponencialmente, con e","No crece"],"correcta":1,"porque":"Crecer en proporción a sí misma es la definición de la exponencial."},{"pregunta":"¿Qué leyes de la física son ecuaciones diferenciales?","opciones":["Ninguna","Planetas, ondas, electricidad, calor… casi todas","Solo el calor"],"correcta":1,"porque":"El universo habla en ecuaciones diferenciales desde Newton."}]}],"nivel":"avanzado"},{"id":"estadistica-avanzada","titulo":"Estadística y probabilidad avanzada","icono":"📊","lecciones":[{"titulo":"La dispersión: la media no basta","contenido":["Dos fábricas pagan de media 1.500. En una, todos cobran entre 1.400 y 1.600. En la otra, la mitad cobra 800 y unos pocos 4.000. Misma media, mundos distintos.","La desviación típica mide cuánto se separan los datos de su media: si es pequeña, todos viven cerca del promedio; si es grande, el promedio es un espejismo.","Se calcula así: diferencias con la media, al cuadrado, promedio, y raíz cuadrada. Los cuadrados castigan las distancias grandes.","Regla práctica: cuando te den una media, pregunta siempre por la dispersión. Un río «de media medio metro de profundidad» puede tener un pozo de tres metros en medio.","En fábricas, la dispersión es calidad: tornillos de «10 mm de media» no sirven si unos miden 8 y otros 12. La industria moderna nació de domar la variabilidad."],"quiz":[{"pregunta":"¿Qué mide la desviación típica?","opciones":["El valor más alto","Cuánto se separan los datos de la media","El número de datos"],"correcta":1,"porque":"Dice si los datos viven apretados junto a la media o desperdigados."},{"pregunta":"Misma media de sueldo, ¿qué empresa es más justa?","opciones":["La de desviación pequeña","La de desviación grande","Da igual"],"correcta":0,"porque":"Desviación pequeña: casi todos cobran parecido a la media."},{"pregunta":"¿Por qué se elevan al cuadrado las diferencias?","opciones":["Por estética","Para que las distancias grandes pesen más y no se cancelen los signos","Es un error histórico"],"correcta":1,"porque":"Sin cuadrados, las diferencias positivas y negativas se anularían entre sí."}]},{"titulo":"La campana de Gauss","contenido":["Mide la altura de mil personas, o el peso de mil manzanas, o los errores de mil mediciones, y dibuja el resultado: siempre sale la misma forma. Una campana.","Es la distribución normal: la mayoría se amontona en el centro y los extremos son raros. La media marca el pico; la desviación típica, la anchura.","La regla de oro: el 68% de los casos cae a una desviación de la media; el 95%, a dos; el 99,7%, a tres. Si la altura media es 170 con desviación 10, el 95% de la gente mide entre 150 y 190.","Por eso sirve para todo: detectar piezas defectuosas, notas raras en un examen, pacientes fuera de rango. Lo «anormal» se define con la campana.","Cuidado: no todo es una campana. Los sueldos, por ejemplo, tienen cola larga a la derecha: unos pocos ganan muchísimo. Aplicar la campana donde no toca es el error favorito de los que hablan sin datos."],"quiz":[{"pregunta":"¿Qué porcentaje de casos cae a DOS desviaciones de la media?","opciones":["El 50%","El 95%","El 99%"],"correcta":1,"porque":"68% a una, 95% a dos, 99,7% a tres desviaciones."},{"pregunta":"Altura media 170, desviación 10. ¿Entre qué valores está el 68%?","opciones":["Entre 150 y 190","Entre 160 y 180","Entre 169 y 171"],"correcta":1,"porque":"Una desviación a cada lado: 170 ± 10."},{"pregunta":"¿Qué distribución NO sigue la campana?","opciones":["Las alturas","Los sueldos","Los errores de medida"],"correcta":1,"porque":"Los sueldos tienen cola larga: unos pocos muy altos estiran el promedio."}]},{"titulo":"Correlación no es causalidad","contenido":["Cuando dos cosas suben y bajan juntas, hay correlación. Pero eso NO significa que una cause la otra. Es la trampa estadística más peligrosa del mundo.","Ejemplo clásico: las ventas de helado y los ahogamientos suben juntos en verano. ¿Los helados ahogan gente? No: el calor causa ambos. Hay un tercer factor escondido.","Las tres posibilidades: A causa B, B causa A, o una C oculta causa las dos. Y la cuarta: pura casualidad, que con millones de datos siempre aparece.","Ejercicio de defensa: cada vez que leas «quienes hacen X tienen más Y», pregúntate qué factor oculto podría explicarlo. Los titulares de prensa viven de esta confusión.","¿Cómo se demuestra causalidad de verdad? Con experimentos: grupos al azar, uno con tratamiento y otro sin él. Así se prueban las vacunas. El azar, bien usado, es el mejor detective."],"quiz":[{"pregunta":"Helados y ahogamientos suben juntos. ¿Conclusión?","opciones":["Los helados ahogan","Un tercer factor (el calor) causa ambos","Casualidad pura"],"correcta":1,"porque":"Correlación con causa oculta: el verano explica las dos curvas."},{"pregunta":"¿Cómo se demuestra que algo causa otra cosa?","opciones":["Con una correlación fuerte","Con un experimento con grupos al azar","Con muchos titulares"],"correcta":1,"porque":"El experimento aleatorio elimina los factores ocultos: es el patrón oro."},{"pregunta":"Con millones de datos, las correlaciones falsas…","opciones":["Desaparecen","Aparecen seguro por casualidad","Son imposibles"],"correcta":1,"porque":"Con suficientes pares de variables, algunas bailarán juntas por puro azar."}]},{"titulo":"Encuestas y muestreo","contenido":["¿Cómo saber qué piensan 40 millones de personas preguntando a mil? El muestreo: si las mil se eligen al azar, el resultado se acerca al real con un margen calculable.","La matemática del asunto: con 1.000 personas bien elegidas, el margen de error es de unos ±3 puntos. Y lo asombroso: ese margen apenas depende de si el país tiene un millón o cien millones.","La palabra clave es «al azar». Si encuestas solo a los que contestan el teléfono fijo, o solo a tus seguidores, la muestra está sesgada y los números mienten con elegancia.","Caso célebre: en 1936 la revista Literary Digest encuestó a 2,4 millones de personas y predijo mal las elecciones de EE.UU. Gallup, con 50.000 bien elegidas, acertó. Tamaño sin azar no sirve.","Regla de defensa: ante cualquier encuesta, pregunta quién pagó, a quién preguntaron y cómo. La pregunta sesgada («¿está usted a favor de la injusticia?») fabrica el resultado antes de empezar."],"quiz":[{"pregunta":"¿Cuál es el margen de error típico de 1.000 personas elegidas al azar?","opciones":["±30 puntos","±3 puntos","±0,3 puntos"],"correcta":1,"porque":"Unas mil respuestas aleatorias dan márgenes de unos tres puntos porcentuales."},{"pregunta":"¿Qué hace válida una encuesta?","opciones":["Muchas respuestas","Selección al azar","Preguntas bonitas"],"correcta":1,"porque":"El azar en la elección es lo que hace representativa a la muestra."},{"pregunta":"1936: 2,4 millones de respuestas y predicción fallida. ¿Por qué?","opciones":["Faltaron respuestas","La muestra estaba sesgada","Error de suma"],"correcta":1,"porque":"Encuestaron por teléfono y coche: solo ricos. Cantidad sin azar no sirve."}]},{"titulo":"Cómo mentir con estadística","contenido":["Darrel Huff escribió en 1954 el manual de defensa «Cómo mentir con estadística». Sus trampas siguen funcionando hoy; aquí van las principales.","Trampa 1: el porcentaje relativo. «Este alimento reduce el riesgo un 50%». Si el riesgo era de 2 entre un millón y pasa a 1 entre un millón, el 50% es cierto y a la vez no significa nada.","Trampa 2: la gráfica recortada. Si el eje no empieza en cero, una subida del 2% parece una montaña rusa. Mira siempre dónde empiezan los números.","Trampa 3: la media elegida a convenio. Según quieras impresionar, das la media, la mediana o la moda: con los sueldos dan resultados muy distintos.","Trampa 4: el sesgo del superviviente. Si solo miras los aviones que volvieron, reforzarás donde no hace falta: los agujeros que importan están en los que no volvieron. Wald lo entendió así en la Segunda Guerra Mundial y salvó flotas enteras."],"quiz":[{"pregunta":"«Reduce el riesgo un 50%» de 2 por millón a 1 por millón es…","opciones":["Una gran protección","Cierto y a la vez casi irrelevante","Falso"],"correcta":1,"porque":"El 50% relativo es cierto; el cambio absoluto es diminuto."},{"pregunta":"¿Qué hace sospechar de una gráfica?","opciones":["Que tenga colores","Que el eje no empiece en cero","Que tenga barras"],"correcta":1,"porque":"El eje recortado convierte hormigas en montañas."},{"pregunta":"¿Qué es el sesgo del superviviente?","opciones":["Estudiar solo a los que volvieron y sacar conclusiones erróneas","Sobrevivir a un accidente","Un tipo de media"],"correcta":0,"porque":"Wald: refuerza donde los aviones que NO volvieron tenían los agujeros."}]},{"titulo":"El teorema de Bayes: pensar al revés","contenido":["Bayes enseña a actualizar lo que crees cuando llega una pista nueva. Su resultado más famoso es una bomba contra la intuición.","Imagina una enfermedad que tiene 1 persona de cada 1.000. Un test la detecta bien el 99% de las veces, pero da falsa alarma en el 5% de los sanos. Te haces el test y sale positivo. ¿Qué probabilidad hay de que estés enfermo?","Intuición: 99%. Realidad: haz la cuenta con 1.000 personas. 1 está enferma y da positivo. De las 999 sanas, unas 50 dan falso positivo. Total de positivos: 51. Solo 1 es enfermo de verdad: ¡un 2%!","La lección: la probabilidad de un resultado depende de lo común que sea la enfermedad, no solo de lo bueno que sea el test. Los positivos de enfermedades raras son mayoría falsos.","Bayes gobierna hoy el mundo: el filtro de spam de tu correo, el diagnóstico médico, la IA. Pensar al revés — de la pista a la causa — es pensar en bayesiano."],"quiz":[{"pregunta":"Test 99% fiable, enfermedad de 1 entre 1.000, positivo. ¿Probabilidad real de estar enfermo?","opciones":["99%","50%","Un 2%"],"correcta":2,"porque":"Casi todos los positivos son falsas alarmas de los 999 sanos: solo 1 de cada 51 positivos está enfermo."},{"pregunta":"¿Qué enseña Bayes?","opciones":["A memorizar datos","A actualizar creencias cuando llegan pistas nuevas","A hacer tests"],"correcta":1,"porque":"Bayes es la matemática de cambiar de opinión con evidencia."},{"pregunta":"¿Por qué fallan tanto los tests de enfermedades raras?","opciones":["Son malos tests","La rareza de la enfermedad domina sobre la precisión","Mala suerte"],"correcta":1,"porque":"Con enfermos tan escasos, las falsas alarmas de los sanos ganan por número."}]}],"nivel":"avanzado"},{"id":"numeros-de-dios","titulo":"Los números de Dios en la naturaleza","icono":"🌻","lecciones":[{"titulo":"El número áureo: 1,618...","contenido":["Divide una vara en dos trozos de modo que «el todo es al trozo grande como el grande al pequeño». Esa proporción única es el número áureo: φ = 1,6180339887...","Tiene una propiedad de magia: φ² = φ + 1. Es el único número que al elevarse al cuadrado solo se suma a sí mismo. Y 1/φ = φ − 1. Se contiene a sí mismo en bucle.","Los griegos lo adoraban: Euclides lo definió como «la proporción extrema y media». Los renacentistas lo llamaron «proporción divina» y Luca Pacioli le dedicó un libro entero, ilustrado por Leonardo da Vinci.","Aparece en el pentagrama (la estrella de cinco puntas está hecha de proporciones áureas), en las espirales de las conchas y en la relación entre los números de Fibonacci: cuanto más grandes, más se acerca su cociente a φ.","Honestidad matemática: que el Partenón o la Mona Lisa «estén diseñados» con φ es más leyenda que hecho. El número áureo real — el de las plantas y las galaxias — es más hermoso que el de los mitos."],"quiz":[{"pregunta":"¿Cuánto vale φ (el número áureo)?","opciones":["3,141...","1,618...","2,718..."],"correcta":1,"porque":"φ = 1,6180339887...: la proporción en la que todo/grande = grande/pequeño."},{"pregunta":"¿Qué propiedad única tiene φ?","opciones":["φ² = φ + 1","Es par","Tiene 3 decimales"],"correcta":0,"porque":"Al cuadrarse solo se suma a sí mismo: φ² = φ + 1. Ningún otro número lo hace."},{"pregunta":"¿Qué relación tiene con Fibonacci?","opciones":["Ninguna","El cociente de Fibonacci vecinos se acerca a φ","Lo inventó Fibonacci"],"correcta":1,"porque":"8/5=1,6; 13/8=1,625; 21/13=1,615...: tiende exactamente a 1,618..."}]},{"titulo":"Fibonacci en la naturaleza","contenido":["Cuenta las espirales de un girasol: 34 en un sentido, 55 en el otro. Las de una piña: 8 y 13. Las escamas de la piña tropical: 5, 8 y 13. Siempre números de Fibonacci vecinos. ¿Por qué?","La planta va colocando semillas o hojas nuevas girando un ángulo fijo: el «ángulo áureo», 137,5°, que es 360° dividido según φ. Es el ángulo que menos huecos deja: el empaquetado perfecto.","Si girara exactamente un tercio de vuelta, las semillas se apilarían en 3 filas con huecos enormes. Girando según φ — el número «más irracional que existe» — ninguna fila se alinea jamás: cada semilla encuentra su sitio.","La naturaleza no calcula: la selección natural premió a las plantas que cabían más semillas en el mismo espacio, y el óptimo matemático resultó ser Fibonacci.","Pasa lo mismo con las hojas alrededor del tallo (filotaxis), las ramas de los árboles y hasta los pétalos: lirios de 3, buttercups de 5, margaritas de 34 o 55. Mira la próxima flor que encuentres."],"quiz":[{"pregunta":"¿Qué números aparecen en las espirales del girasol?","opciones":["Pares al azar","Números de Fibonacci vecinos, como 34 y 55","Siempre 12"],"correcta":1,"porque":"34 y 55, 55 y 89: vecinos de la sucesión de Fibonacci, siempre."},{"pregunta":"¿Cuánto mide el ángulo áureo?","opciones":["90°","137,5°","180°"],"correcta":1,"porque":"Es 360° repartidos según φ: el giro que deja menos huecos."},{"pregunta":"¿Por qué las plantas usan Fibonacci?","opciones":["Por estética","Porque es el empaquetado óptimo y la selección natural lo premió","Casualidad"],"correcta":1,"porque":"Más semillas en el mismo espacio = más descendencia. La evolución es matemática aplicada."}]},{"titulo":"π y e donde no los esperas","contenido":["π no vive solo en los círculos. Mide un río de verdad: su longitud serpenteante dividida por la distancia en línea recta de nacimiento a desembocadura se acerca a π. Lo descubrió el geólogo Hans-Henrik Stølum en 1996.","El experimento más raro de las matemáticas: la aguja de Buffon (1777). Tira agujas sobre un suelo de listones y la proporción de las que cruzan una raya da... π. Se puede calcular π tirando palillos.","e aparece en todo crecimiento vivo: colonias de bacterias, la ramificación de los pulmones, la espiral de la concha del nautilus (espiral logarítmica: crece sin cambiar de forma).","La tela de araña, la trayectoria de un halcón al abalanzarse, la galaxia espiral: todas siguen la espiral logarítmica de e. Jakob Bernoulli la amaba tanto que pidió grabarla en su tumba («aunque transformada, resurgo igual»); el escultor, por error, le grabó una espiral distinta.","¿Por qué estos números por todas partes? Porque describen simetrías profundas: el círculo es la forma de «igual distancia», y e es la ley de «crecer en proporción a uno mismo». La naturaleza repite sus buenas ideas."],"quiz":[{"pregunta":"¿Qué relación guarda un río con π?","opciones":["Ninguna","Su longitud real entre la recta se acerca a π","Los ríos son circulares"],"correcta":1,"porque":"Stølum lo midió en 1996: la serpenteante de los ríos ronda 3,14 veces la distancia directa."},{"pregunta":"¿Qué experimento calcula π con agujas?","opciones":["El péndulo","La aguja de Buffon","El prisma"],"correcta":1,"porque":"Buffon, 1777: la fracción de agujas que cruzan las rayas del suelo revela π."},{"pregunta":"¿Qué ley sigue la espiral de la concha del nautilus?","opciones":["Crece con e: en proporción a sí misma","Crece lineal","No sigue leyes"],"correcta":0,"porque":"Espiral logarítmica: crece sin cambiar de forma, la firma de e."}]},{"titulo":"Fractales: infinito en lo finito","contenido":["Un fractal es una forma que se repite a sí misma a todas las escalas: acércate a un trozo de brócoli romanesco y verás brócolis pequeños idénticos; acércate más y verás brócolis aún más pequeños.","El copo de nieve de Koch se construye poniendo triángulos sobre triángulos sin fin: su borde es infinitamente largo, pero encierra un área finita. Infinito en lo finito.","La naturaleza es fractal porque crece repitiendo instrucciones simples: los bronquios de tus pulmones se bifurcan una y otra vez (¡toda tu superficie pulmonar, del tamaño de una cancha de tenis, cabe en tu pecho!), los rayos se ramifican, los ríos dibujan deltas como árboles.","Benoît Mandelbrot lo formalizó en 1975 y preguntó: «¿Cuánto mide la costa de Gran Bretaña?» Respuesta: depende de la regla que uses; con reglas más finas, más larga. Las fronteras fractales no tienen longitud fija.","Hoy los fractales comprimen imágenes, animan los paisajes de las películas, describen galaxias y latidos del corazón. La geometría de la naturaleza no era la de Euclides: era fractal."],"quiz":[{"pregunta":"¿Qué es un fractal?","opciones":["Una figura rota","Una forma que se repite a todas las escalas","Un polígono grande"],"correcta":1,"porque":"Cada trozo contiene la forma entera en miniatura, una y otra vez."},{"pregunta":"El copo de Koch tiene…","opciones":["Borde finito y área infinita","Borde infinito y área finita","Todo finito"],"correcta":1,"porque":"El perímetro crece sin límite mientras el área se estabiliza: paradoja domesticada."},{"pregunta":"¿Dónde hay fractales en tu cuerpo?","opciones":["En ningún sitio","Pulmones, vasos sanguíneos, neuronas","Solo en los huesos"],"correcta":1,"porque":"La ramificación repetida empaqueta superficies enormes en volúmenes pequeños."}]},{"titulo":"Simetría: el lenguaje de las formas","contenido":["La simetría es «cambiar algo y que siga igual». Tu cuerpo tiene simetría bilateral: espejo a la mitad y casi no se nota. La estrella de mar tiene simetría radial: gira un quinto de vuelta y es idéntica.","El copo de nieve tiene seis brazos porque el agua se congela en hexágonos: la geometría de la molécula H₂O manda. Nunca verás un copo de cinco brazos; Kepler ya lo notó en 1611.","Las teselaciones — cubrir el plano sin huecos — solo admiten tres baldosas regulares: triángulo, cuadrado y hexágono. Por eso las abejas usan hexágonos: es la forma que más miel guarda con menos cera. Los matemáticos lo conjeturaron en la antigüedad; se demostró del todo en 1999.","En la Alhambra de Granada, los artesanos nazaríes dibujaron hace 700 años los 17 tipos posibles de patrones de papel pintado. El matemático que clasificó esos 17 grupos llegó en 1891: el arte llegó primero.","La simetría va más hondo: en física, cada simetría esconde una ley de conservación (teorema de Noether, 1918). Que las leyes no cambien con el tiempo conserva la energía. Emmy Noether unió forma y universo."],"quiz":[{"pregunta":"¿Por qué los copos de nieve tienen seis brazos?","opciones":["Azar","La molécula de agua se congela en hexágonos","Tradición"],"correcta":1,"porque":"La geometría molecular del hielo impone el orden de seis."},{"pregunta":"¿Qué baldosas regulares cubren el plano sin huecos?","opciones":["Cualquiera","Solo triángulo, cuadrado y hexágono","Solo el cuadrado"],"correcta":1,"porque":"Son las únicas cuyos ángulos dividen exactamente a 360°."},{"pregunta":"¿Qué dice el teorema de Noether?","opciones":["La miel es dulce","Cada simetría esconde una ley de conservación","Los hexágonos son perfectos"],"correcta":1,"porque":"Emmy Noether, 1918: simetría temporal → energía conservada. La física moderna descansa en ello."}]},{"titulo":"El caos y el efecto mariposa","contenido":["En 1961, Edward Lorenz simulaba el tiempo atmosférico en un ordenador primitivo. Un día reintrodujo datos redondeados: 0,506 en vez de 0,506127. La predicción divergió por completo. Había descubierto el caos.","El caos no es desorden: son sistemas con reglas perfectamente deterministas donde el resultado depende tan brutalmente de las condiciones iniciales que predecir a largo plazo es imposible en la práctica.","De ahí la metáfora: «el aleteo de una mariposa en Brasil puede provocar un tornado en Texas». No es poesía: es sensibilidad extrema a las condiciones iniciales, medida con exponentes de Lyapunov.","Por eso el parte meteorológico falla más allá de unos días: no es incompetencia, es matemática. El clima (estadística de décadas) sí es predecible; el tiempo del martes que viene, solo hasta cierto punto.","El caos también crea belleza: el conjunto de Mandelbrot, los sistemas planetarios, los latidos del corazón. Entre el orden perfecto y el azar total hay una frontera fértil: ahí vivimos."],"quiz":[{"pregunta":"¿Qué descubrió Lorenz en 1961?","opciones":["Una mariposa","Que errores diminutos en el arranque cambian toda la predicción","El calentamiento global"],"correcta":1,"porque":"0,506 en vez de 0,506127 bastó para un clima completamente distinto."},{"pregunta":"¿Qué es un sistema caótico?","opciones":["Puro azar","Determinista pero impredecible a largo plazo","Un sistema roto"],"correcta":1,"porque":"Las reglas son exactas; la predicción se degrada por la sensibilidad extrema al inicio."},{"pregunta":"¿Qué sí es predecible del tiempo?","opciones":["El martes que viene, siempre","El clima estadístico de décadas","Nada en absoluto"],"correcta":1,"porque":"El promedio es estable aunque cada día concreto sea impredecible: estadística contra caos."}]}],"nivel":"avanzado"},{"id":"universidad","titulo":"Matemáticas de universidad","icono":"🎓","lecciones":[{"titulo":"Épsilon y delta: la prueba del límite","contenido":["El límite es la idea sobre la que se construye todo el cálculo, y durante 150 años nadie supo decir exactamente qué significaba 'acercarse'. La respuesta moderna es un juego de retos: tú me das un error tan pequeño como quieras (épsilon) y yo encuentro un entorno (delta) donde la función cumple ese error. Si siempre puedo, el límite existe.","Ejemplo: queremos probar que cuando x se acerca a 3, 2x se acerca a 6. Tú me retas: 'quiero que esté a menos de 0.01 de 6'. Yo calculo: si x está a menos de 0.005 de 3, entonces 2x está a menos de 0.01 de 6. Gano el reto. Y gano para cualquier reto, por pequeño que sea.","Parece pedantería, pero es el cimiento: sin esta definición, la palabra 'infinitamente cerca' era vaga y llevaba a paradojas. Con épsilon y delta, el infinitesimal se doma: todo se enuncia con números finitos y concretos.","El lenguaje de retos también sirve fuera de las matemáticas: es la diferencia entre 'esto funciona más o menos' y 'dame tu exigencia y te garantizo que la cumplo'. La ingeniería moderna, con sus tolerancias, habla épsilon-delta sin saberlo."],"quiz":[{"pregunta":"¿Qué es épsilon en la definición de límite?","opciones":["El error máximo que tú exiges","Un número infinito","La pendiente de la curva"],"correcta":0,"porque":"Épsilon es el reto de precisión: tan pequeño como quieras. Delta es la respuesta."},{"pregunta":"Si siempre puedo responder a cualquier épsilon con un delta, entonces…","opciones":["el límite existe y está probado","la función es par","delta es cero"],"correcta":0,"porque":"Ganar el juego de retos para todo épsilon es exactamente la definición de límite."},{"pregunta":"¿Qué problema resolvió esta definición?","opciones":["La vaguedad de 'infinitamente cerca'","La falta de calculadoras","El precio de los libros"],"correcta":0,"porque":"Antes, los infinitesimales eran un concepto confuso que provocaba paradojas."}]},{"titulo":"Series de Taylor: reconstruir cualquier curva","contenido":["Una serie de Taylor dice algo asombroso: si conoces todo lo que pasa en un solo punto (el valor, la pendiente, la curvatura, y así hasta el infinito), conoces la función entera. Es como deducir toda la trayectoria de un tren mirando un solo instante con instrumentos perfectos.","La fórmula: f(x) = f(0) + f′(0)x + f″(0)x²/2! + f‴(0)x³/3! + ... Cada término añade un detalle más fino. Con pocos términos ya tienes una aproximación excelente cerca del punto.","Así calculan las calculadoras el seno, el coseno o el logaritmo: no guardan tablas, evalúan los primeros términos de la serie. sen(x) ≈ x − x³/6 + x⁵/120 ya da resultados muy buenos para x pequeño.","La idea filosófica es potente: lo local, mirado con suficiente profundidad, contiene lo global. Un punto, interrogado con todas las derivadas, revela la curva completa."],"quiz":[{"pregunta":"¿Qué hace una serie de Taylor?","opciones":["Reconstruye una función entera a partir de lo que ocurre en un punto","Suma números al azar","Dibuja círculos"],"correcta":0,"porque":"Con el valor y todas las derivadas en un punto, la serie reconstruye la función."},{"pregunta":"¿Cómo calcula sen(x) una calculadora?","opciones":["Evaluando términos de su serie de Taylor","Con una tabla gigante","Midiendo triángulos"],"correcta":0,"porque":"Los chips evalúan polinomios de Taylor: rápido y preciso."},{"pregunta":"¿Qué idea profunda encierra?","opciones":["Lo local bien mirado contiene lo global","Los números son letras","Las curvas no existen"],"correcta":0,"porque":"Un solo punto, con todas sus derivadas, revela la curva completa."}]},{"titulo":"Varias variables y el gradiente","contenido":["El mundo real no depende de una sola variable: la temperatura de una sala cambia con el sitio, el beneficio depende del precio y del coste a la vez. El cálculo multivariable estudia funciones de varias entradas, como el mapa de alturas de una montaña: a cada punto (x, y) le corresponde una altura.","La derivada parcial mide cómo cambia la función moviéndote en una sola dirección, congelando las demás: la pendiente hacia el este, o hacia el norte.","El gradiente junta todas las parciales en un vector, y tiene dos propiedades maravillosas: apunta en la dirección de máxima subida, y es perpendicular a las curvas de nivel. Un montañero que siempre sigue el gradiente sube por el camino más empinado posible.","El gradiente descendente (bajar siguiendo menos el gradiente) es hoy el algoritmo más importante del mundo: así aprenden las redes neuronales, ajustando millones de parámetros cuesta abajo hasta minimizar el error."],"quiz":[{"pregunta":"¿Qué mide una derivada parcial?","opciones":["El cambio moviéndote en una sola dirección, congelando las demás","El área total","El volumen"],"correcta":0,"porque":"Cada parcial mira una dirección dejando fijas las otras variables."},{"pregunta":"¿Hacia dónde apunta el gradiente?","opciones":["Hacia la máxima subida","Hacia abajo siempre","Hacia el norte"],"correcta":0,"porque":"El gradiente señala la dirección de ascenso más rápido, perpendicular a las curvas de nivel."},{"pregunta":"¿Dónde se usa hoy el descenso del gradiente?","opciones":["En el aprendizaje de las redes neuronales","En la cocina","En la relojería"],"correcta":0,"porque":"Toda la inteligencia artificial moderna aprende bajando por el gradiente del error."}]},{"titulo":"Integrales dobles: sumar sobre superficies","contenido":["Si la integral simple suma rodajas a lo largo de una línea, la integral doble suma columnitas sobre una superficie. Imagina un queso de base rectangular cuya altura varía de punto a punto: para calcular su volumen, divides la base en cuadraditos diminutos, sumas altura por cuadradito y pasas al límite.","El truco práctico es integrar dos veces seguidas: primero para cada x sumas a lo largo de y (integral interna), luego sumas esos resultados a lo largo de x (integral externa). El teorema de Fubini garantiza que, con funciones razonables, el orden no importa.","A veces conviene cambiar de coordenadas: para regiones redondas, las coordenadas polares (radio y ángulo) simplifican todo, a cambio de multiplicar por el factor r. Así se calculan volúmenes de montañas, depósitos o lonas.","Las integrales dobles están en todas partes: la probabilidad conjunta de dos variables, la masa de una placa de densidad variable, el centro de gravedad de una vela de barco."],"quiz":[{"pregunta":"¿Qué calcula una integral doble?","opciones":["Una suma de valores sobre una superficie, como un volumen","Solo longitudes","Letras griegas"],"correcta":0,"porque":"Suma altura por cuadradito sobre toda la base: volumen bajo la superficie."},{"pregunta":"¿Qué dice el teorema de Fubini?","opciones":["Que se puede integrar variable a variable y el orden no importa en funciones razonables","Que no se puede integrar","Que todo suma cero"],"correcta":0,"porque":"Fubini convierte la integral doble en dos integrales simples encadenadas."},{"pregunta":"¿Qué coordenadas convienen para regiones redondas?","opciones":["Polares: radio y ángulo","Romanas","Binarias"],"correcta":0,"porque":"En polares los círculos se vuelven rectángulos y la integral se simplifica."}]},{"titulo":"El plano complejo y la fórmula de Euler","contenido":["Los números complejos nacen de un acto de valentía: inventar un número i cuyo cuadrado es −1. Dibujado como punto del plano (parte real a la derecha, imaginaria arriba), multiplicar por i resulta ser girar 90°. El álgebra imposible se vuelve geometría de giros.","La fórmula de Euler, e^(iθ) = cos θ + i sen θ, dice que las exponenciales imaginarias son rotaciones. Con θ = π se obtiene e^(iπ) + 1 = 0, la llamada identidad más bella de las matemáticas: une cinco constantes fundamentales en una sola línea.","Lejos de ser un juguete, los complejos son el lenguaje natural de la electricidad (corriente alterna), la mecánica cuántica (las funciones de onda son complejas) y el procesamiento de señales.","Lección humilde: lo que un día se llamó 'imaginario' por burla resultó describir el mundo mejor que los números 'reales'. Los nombres despectivos envejecen mal ante la evidencia."],"quiz":[{"pregunta":"¿Qué es i?","opciones":["El número cuyo cuadrado es −1","Una letra romana","El infinito"],"correcta":0,"porque":"i² = −1 abre la puerta al plano complejo."},{"pregunta":"¿Qué hace geométricamente multiplicar por i?","opciones":["Girar 90 grados","Duplicar","Borrar el número"],"correcta":0,"porque":"En el plano complejo, i es una rotación de un cuarto de vuelta."},{"pregunta":"¿Qué dice la identidad de Euler?","opciones":["e^(iπ) + 1 = 0, uniendo cinco constantes","Que π es entero","Que i es cero"],"correcta":0,"porque":"Une e, i, π, 1 y 0 en una sola igualdad: por eso la llaman la más bella."}]},{"titulo":"Autovalores: las direcciones especiales","contenido":["Toda transformación lineal (giros, estiramientos, deformaciones) tiene direcciones privilegiadas: los autovectores, que solo se estiran o encogen sin cambiar de dirección. El factor de estiramiento es el autovalor. Encontrarlos es entender el esqueleto de la transformación.","Se calculan resolviendo det(A − λI) = 0, la ecuación característica. Suena abstracto, pero la imagen es clara: una esfera de goma deformada se convierte en elipsoide, y sus ejes principales son los autovectores.","Las aplicaciones son enormes: los modos de vibración de un puente son autovalores; el algoritmo original de Google (PageRank) es el autovector principal de la matriz de enlaces de toda la web; el análisis de componentes principales (PCA) reduce datos gigantes a sus autodirecciones.","Idea profunda: en medio de una transformación complicada, siempre hay direcciones que se comportan con sencillez. Buscar los autovectores es buscar la simplicidad oculta en el lío."],"quiz":[{"pregunta":"¿Qué es un autovector?","opciones":["Una dirección que la transformación solo estira, sin girar","Un coche autónomo","Un vector de longitud cero"],"correcta":0,"porque":"Los autovectores conservan su dirección; solo cambian de tamaño según el autovalor."},{"pregunta":"¿Qué famoso algoritmo es un autovector?","opciones":["El PageRank original de Google","El horno microondas","El GPS"],"correcta":0,"porque":"PageRank ordenaba la web usando el autovector principal de su matriz de enlaces."},{"pregunta":"¿Qué enseñanza dejan los autovalores?","opciones":["Toda transformación compleja tiene direcciones simples ocultas","Las matrices son inútiles","Los vectores no existen"],"correcta":0,"porque":"Encontrar autovectores es encontrar la sencillez dentro de la complicación."}]},{"titulo":"Osciladores: la ecuación de todo lo que vibra","contenido":["Una sola ecuación gobierna los péndulos, los muelles, los circuitos de radio y hasta los átomos: x″ = −ω²x. Dice que la aceleración es proporcional a la posición y en sentido contrario: cuanto más te alejas del equilibrio, más fuerte tira de vuelta. Su solución son senos y cosenos: movimiento armónico.","De esta ecuación salen la frecuencia (cuántas oscilaciones por segundo), el periodo y la amplitud. Un columpio, una cuerda de guitarra y un electrón atrapado obedecen la misma matemática.","El peligro llega con la resonancia: si empujas el sistema justo a su frecuencia natural, la amplitud crece y crece. Por eso los soldados rompen el paso al cruzar puentes, y por eso el puente de Tacoma se retorció hasta caer en 1940.","Las ecuaciones diferenciales como esta son el lenguaje de las leyes físicas: no dicen dónde está algo, sino cómo cambia. Conocer la regla del cambio y el estado inicial basta para predecir el futuro del sistema."],"quiz":[{"pregunta":"¿Qué dice la ecuación x″ = −ω²x?","opciones":["Que la aceleración tira de vuelta al equilibrio con fuerza proporcional a la distancia","Que todo está quieto","Que x es infinito"],"correcta":0,"porque":"Es la ley de todo oscilador: la restauración proporcional genera senos y cosenos."},{"pregunta":"¿Qué es la resonancia?","opciones":["Amplificación por empujar a la frecuencia natural del sistema","Un instrumento musical","Silencio total"],"correcta":0,"porque":"Empujar al ritmo propio del sistema hace crecer la amplitud sin freno."},{"pregunta":"¿Qué predicen las ecuaciones diferenciales?","opciones":["El futuro del sistema a partir de la regla de cambio y el estado inicial","La lotería","El pasado remoto"],"correcta":0,"porque":"Regla de cambio + estado inicial = evolución completa. Es la base de la física."}]},{"titulo":"Teoría de grafos: los puentes de Königsberg","contenido":["Un grafo es solo puntos (nodos) unidos por líneas (aristas). Con esa pobreza de ingredientes se modela casi todo: redes de carreteras, amistades, internet, moléculas, la propagación de rumores y de enfermedades.","La teoría nació con un pasatiempo: ¿se puede pasear por Königsberg cruzando cada uno de sus 7 puentes exactamente una vez? Euler demostró que no: solo hace falta contar cuántas aristas tocan cada nodo. Un paseo así existe solo si hay 0 o 2 nodos con grado impar. Königsberg tenía 4.","De ese juego salieron conceptos poderosos: caminos más cortos (así calcula rutas el GPS), árboles (estructuras sin ciclos, como los torneos de eliminación), coloreado de mapas y detección de comunidades en redes.","La lección de Euler es un método: olvida los detalles irrelevantes (tamaño de las islas, longitud de los puentes) y quédate con la estructura pura. Abstraer es conservar solo lo que importa."],"quiz":[{"pregunta":"¿Qué es un grafo?","opciones":["Puntos unidos por líneas: nodos y aristas","Una pintura famosa","Un número primo"],"correcta":0,"porque":"Nodos más aristas: con eso se modelan carreteras, redes y relaciones."},{"pregunta":"¿Por qué era imposible el paseo de Königsberg?","opciones":["Porque tenía 4 nodos con número impar de puentes","Porque llovía","Porque los puentes eran de madera"],"correcta":0,"porque":"Un camino euleriano exige 0 o 2 nodos impares; Königsberg tenía 4."},{"pregunta":"¿Qué método enseña este problema?","opciones":["Abstraer: quedarse solo con la estructura que importa","Memorizar mapas","Caminar más rápido"],"correcta":0,"porque":"Euler ignoró la geografía y conservó solo las conexiones: nació una rama nueva."}]},{"titulo":"Topología: la taza y el donut","contenido":["La topología es la geometría de la goma: dos formas son 'la misma' si una se puede deformar en la otra sin romperla ni pegarla. Por eso se dice que un topólogo no distingue una taza de un donut: ambos tienen exactamente un agujero.","Lo que importa en topología no son distancias ni ángulos, sino propiedades profundas: número de agujeros, conexión, fronteras. El mapa del metro es topológico: distorsiona las distancias pero conserva fielmente qué estación conecta con cuál, que es lo único que necesitas.","Sus herramientas clasifican todos los universos posibles. La conjetura de Poincaré (¿toda forma 3D sin agujeros es una esfera deformada?) resistió un siglo hasta que Perelman la demostró en 2003, y luego rechazó la medalla Fields y el millón de dólares.","La topología vive hoy en el análisis de datos (detectar la 'forma' de nubes de puntos), en la física de materiales exóticos y en la robótica, para planear movimientos sin choques."],"quiz":[{"pregunta":"¿Cuándo son 'la misma forma' dos objetos en topología?","opciones":["Cuando uno se deforma en el otro sin romperlo ni pegarlo","Cuando pesan igual","Cuando son del mismo color"],"correcta":0,"porque":"La topología ignora tamaño y ángulos: solo cuenta la estructura de conexiones y agujeros."},{"pregunta":"¿Por qué el mapa del metro es topológico?","opciones":["Porque distorsiona distancias pero conserva las conexiones","Porque es gratis","Porque es redondo"],"correcta":0,"porque":"Para viajar solo importa qué conecta con qué: pura topología."},{"pregunta":"¿Qué hizo Perelman con los premios por demostrar Poincaré?","opciones":["Los rechazó","Los duplicó","Los vendió"],"correcta":0,"porque":"Rechazó la medalla Fields y el premio del millón: le bastaba con la verdad."}]},{"titulo":"Teoría de juegos: el dilema del prisionero","contenido":["La teoría de juegos estudia decisiones donde tu mejor jugada depende de lo que hagan los demás. Dos sospechosos detenidos por separado: si ambos callan, un año cada uno; si uno traiciona y el otro calla, el traidor sale libre y el otro cae diez años; si ambos traicionan, cinco años cada uno.","La lógica individual empuja a traicionar: pase lo que pase, traicionar es mejor para ti. Pero si ambos razonan así, acaban peor que si hubieran cooperado. Es el equilibrio de Nash: una situación donde nadie mejora cambiando solo, aunque no sea lo mejor para el grupo.","Este dilema explica conflictos reales: carreras armamentísticas, precios de guerra entre empresas, sobreexplotación de recursos comunes. Y su versión repetida enseña otra cosa: cuando el juego se repite, estrategias amables pero firmes (cooperar primero, responder en igualdad) ganan a largo plazo.","Von Neumann fundó la teoría en 1928 para entender el póker; hoy se usa en economía, biología evolutiva, subastas de espectro y diseño de tratados internacionales."],"quiz":[{"pregunta":"¿Cuál es la paradoja del dilema del prisionero?","opciones":["La mejor decisión individual lleva al peor resultado conjunto","Los dos salen libres siempre","No tiene solución"],"correcta":0,"porque":"Traicionar conviene a cada uno, pero si ambos lo hacen acaban peor que cooperando."},{"pregunta":"¿Qué es un equilibrio de Nash?","opciones":["Una situación donde nadie mejora cambiando su jugada en solitario","Un balón de fútbol","Un empate a cero"],"correcta":0,"porque":"En el equilibrio, cada jugada es la mejor respuesta a las demás: nadie se mueve solo."},{"pregunta":"¿Qué gana en el juego repetido a largo plazo?","opciones":["Estrategias amables pero firmes: cooperar primero y responder en igualdad","Traicionar siempre","Jugar al azar"],"correcta":0,"porque":"En torneos de estrategias, 'ojo por ojo' amable resultó de las más exitosas."}]},{"titulo":"Criptografía: secretos con números","contenido":["La criptografía moderna se apoya en problemas fáciles de hacer y difíciles de deshacer. Multiplicar dos primos de 300 cifras tarda un instante; factorizar el resultado llevaría siglos a los ordenadores actuales. En esa asimetría descansa la seguridad de internet.","Diffie y Hellman resolvieron en 1976 un milagro: dos personas pueden acordar una clave secreta hablando en público, usando aritmética modular. Alice y Bob intercambian potencias módulo un primo; un espía ve todo lo transmitido y aun así no puede reconstruir el secreto.","RSA (1977) lo llevó más lejos: cada persona publica una clave pública para cifrar y guarda una privada para descifrar. Así firmas documentos y compras en línea sin haber compartido nunca un secreto.","El futuro trae una amenaza y una promesa: los ordenadores cuánticos, con el algoritmo de Shor, factorizarían rápido y romperían RSA; por eso ya se diseña criptografía post-cuántica basada en problemas distintos."],"quiz":[{"pregunta":"¿En qué se apoya la seguridad de RSA?","opciones":["En que multiplicar primos es fácil pero factorizar el producto es muy difícil","En guardar bien el papel","En la suerte"],"correcta":0,"porque":"La asimetría factorización/multiplicación protege las claves."},{"pregunta":"¿Qué logró el protocolo Diffie-Hellman?","opciones":["Acordar una clave secreta conversando en público","Imprimir dinero","Hablar más rápido"],"correcta":0,"porque":"Con aritmética modular, dos desconocidos crean un secreto a la vista de todos."},{"pregunta":"¿Qué amenaza el algoritmo de Shor?","opciones":["Rompería la factorización con ordenadores cuánticos","Borraría internet","Nada, es un juego"],"correcta":0,"porque":"Shor factoriza en tiempo razonable: por eso nace la criptografía post-cuántica."}]},{"titulo":"Entropía de Shannon: medir la información","contenido":["En 1948 Shannon se preguntó: ¿cuánta información hay en un mensaje? Su respuesta: la información mide sorpresa. 'Mañana saldrá el sol' informa casi nada; 'mañana nevará en el desierto' informa muchísimo, porque es improbable.","La fórmula H = −Σ p·log₂(p) mide la incertidumbre media en bits: una moneda justa vale 1 bit (máxima incertidumbre); una moneda trucada que casi siempre cae cara vale menos, porque sorprende menos.","De aquí salen dos límites que gobiernan la era digital: ningún mensaje puede comprimirse por debajo de su entropía (límite de los ZIP y los MP4), y ningún canal puede transmitir más de su capacidad sin errores (límite de la fibra y del wifi).","La entropía de información conecta con la física: el desorden de un gas y la información de un mensaje comparten fórmula. Saber es, literalmente, reducir incertidumbre del mundo."],"quiz":[{"pregunta":"Según Shannon, ¿qué mide la información?","opciones":["La sorpresa: cuanto más improbable, más informa","El peso del papel","El tamaño de la pantalla"],"correcta":0,"porque":"Un mensaje predecible apenas informa; uno improbable informa mucho."},{"pregunta":"¿Cuántos bits vale una moneda justa?","opciones":["1 bit","100 bits","Cero"],"correcta":0,"porque":"Dos resultados igual de probables: máxima incertidumbre, exactamente 1 bit."},{"pregunta":"¿Qué límite impone la entropía?","opciones":["Ningún mensaje se comprime por debajo de ella","No se puede hablar por teléfono","Los bits pesan demasiado"],"correcta":0,"porque":"La entropía es el suelo de la compresión y el techo de los canales."}]},{"titulo":"La transformada de Fourier: escuchar las notas","contenido":["Cualquier señal, por enrevesada que sea, es una suma de ondas puras: eso dice la transformada de Fourier. Un acorde de piano es una única curva complicada, pero Fourier la descompone en sus notas: esta frecuencia con esta fuerza, esta otra con esta otra.","Matemáticamente, transforma la señal del dominio del tiempo al dominio de la frecuencia: en vez de 'cuánto vale la señal en cada instante', dice 'cuánta energía hay en cada frecuencia'. Es pasar de la ola al reparto de notas.","Sus usos son ubicuos: el MP3 guarda frecuencias en vez de muestras (y tira las que el oído no percibe); la resonancia magnética reconstruye tu cuerpo a partir de frecuencias; el wifi y el 5G reparten datos en frecuencias; los sismólogos leen el interior de la Tierra.","La FFT, el algoritmo rápido para calcularla, reduce el trabajo de n² a n·log n: una mejora de millones de veces para señales grandes. Gauss la conocía en 1805; Cooley y Tukey la redescubrieron en 1965, justo cuando el mundo la necesitaba."],"quiz":[{"pregunta":"¿Qué hace la transformada de Fourier?","opciones":["Descompone una señal en sus ondas puras, como un acorde en notas","Sube el volumen","Borra la señal"],"correcta":0,"porque":"Toda señal es suma de senos y cosenos: Fourier encuentra cuáles y con qué fuerza."},{"pregunta":"¿Qué es el dominio de la frecuencia?","opciones":["La descripción de cuánta energía hay en cada frecuencia","Una tienda de radios","El futuro"],"correcta":0,"porque":"Misma señal, otra mirada: de 'cuándo' a 'qué notas'."},{"pregunta":"¿Qué mejora aporta la FFT?","opciones":["Reduce el cálculo de n² a n·log n operaciones","Usa más memoria","Hace la señal más lenta"],"correcta":0,"porque":"Ese salto de eficiencia hizo posible el audio, la imagen y las comunicaciones digitales."}]}],"nivel":"avanzado"},{"id":"fisica","titulo":"Física completa","icono":"⚛️","lecciones":[{"titulo":"La caída de los cuerpos: Galileo tenía razón","contenido":["Durante casi dos mil años se creyó que los objetos pesados caían más rápido que los ligeros, porque Aristóteles lo dijo y nadie lo comprobó. Galileo lo comprobó: soltó esferas de distinto peso y midió. Todas caen igual. Sin aire, una pluma y un martillo tocan el suelo a la vez, como demostró un astronauta en la Luna en 1971.","Lo que Galileo descubrió midiendo es que la caída es un movimiento uniformemente acelerado: cada segundo que pasa, la velocidad crece en la misma cantidad, unos 9.8 metros por segundo cada segundo. En un segundo caes a 10 m/s; en dos, a 20; en tres, a 30.","La distancia recorrida crece con el cuadrado del tiempo: en un segundo, 5 metros; en dos, 20; en tres, 45. Esa regla sencilla (d = ½gt²) permite calcular la altura de un puente con solo un reloj y una piedra: deja caer la piedra, cuenta segundos, eleva al cuadrado, multiplica por 5.","El método de Galileo importa tanto como su resultado: no discutas sobre cómo debería ser la naturaleza; pregúntale a la naturaleza con un experimento. Ahí nace la ciencia moderna."],"quiz":[{"pregunta":"¿Qué descubrió Galileo sobre la caída de los cuerpos?","opciones":["Que todos caen con la misma aceleración si no hay aire","Que los pesados caen el doble de rápido","Que la Tierra es plana"],"correcta":0,"porque":"Sin rozamiento del aire, pluma y martillo caen igual: la aceleración no depende del peso."},{"pregunta":"¿Cuánto gana de velocidad un objeto cada segundo de caída?","opciones":["Unos 9.8 m/s cada segundo","Siempre 100 m/s","Nada, cae a velocidad fija"],"correcta":0,"porque":"La gravedad acelera uniformemente: 9.8 m/s más por cada segundo."},{"pregunta":"¿Cómo mides la altura de un puente con una piedra y un reloj?","opciones":["Con d = ½·g·t² usando el tiempo de caída","Tirando la piedra hacia arriba","Preguntando al alcalde"],"correcta":0,"porque":"El tiempo de caída al cuadrado, por la mitad de g, da la altura."}]},{"titulo":"Las tres leyes de Newton: las reglas del movimiento","contenido":["Primera ley: nada cambia su movimiento sin una fuerza que lo empuje. Una bola quieta sigue quieta; una bola rodando seguiría rodando para siempre si el rozamiento no la frenara. Por eso, si el coche frena de golpe, tu cuerpo sigue hacia adelante: llevas cinturón para que la fuerza del cinturón te frene a ti también.","Segunda ley: F = m·a. La fuerza que aplicas produce una aceleración, y cuanta más masa tenga el objeto, menos acelera. Empujar un carrito vacío es fácil; empujarlo lleno de ladrillos, con el mismo empuje, acelera mucho menos. Esta ecuación de cinco símbolos gobierna desde carritos hasta cohetes.","Tercera ley: a toda acción, una reacción igual y contraria. Al nadar empujas el agua hacia atrás y el agua te empuja hacia adelante. El cohete no 'empuja contra el aire': expulsa gases hacia abajo y los gases lo empujan hacia arriba, incluso en el vacío del espacio.","Con estas tres leyes y la gravitación, Newton explicó a la vez la manzana que cae y la Luna que orbita: es la misma fuerza. Por primera vez, el cielo y la tierra obedecían una sola física."],"quiz":[{"pregunta":"¿Qué dice la primera ley de Newton?","opciones":["Que sin fuerzas, el movimiento no cambia","Que todo cae","Que la energía se crea"],"correcta":0,"porque":"La inercia: lo quieto sigue quieto y lo que se mueve sigue moviéndose en línea recta."},{"pregunta":"Si duplicas la masa empujando con la misma fuerza, la aceleración…","opciones":["se reduce a la mitad","se duplica","no cambia"],"correcta":0,"porque":"a = F/m: doble masa, mitad de aceleración."},{"pregunta":"¿Por qué sube un cohete en el vacío?","opciones":["Porque expulsa gases hacia abajo y ellos lo empujan hacia arriba","Porque empuja el aire","Porque pesa poco"],"correcta":0,"porque":"Acción y reacción: no necesita aire contra el que apoyarse."}]},{"titulo":"Energía: la moneda que nunca se pierde","contenido":["La energía es la capacidad de producir cambios: mover, calentar, iluminar. Viene en muchas formas: cinética (movimiento), potencial (altura o posición), térmica, química, eléctrica, luminosa. Un ciclista en lo alto de una colina guarda energía potencial; al bajar, se convierte en cinética sin pisar los pedales.","La ley más importante de toda la física: la energía no se crea ni se destruye, solo se transforma. La comida que desayunas era energía química; tu paseo la convierte en movimiento y calor. La luz del sol fue energía nuclear en el Sol, luz en el viaje, azúcar en la planta y ahora tu merienda.","La potencia mide lo rápido que usas energía: energía por segundo. Una bombilla de 60 vatios gasta 60 julios cada segundo. La factura de la luz cobra kilovatios-hora: la energía total consumida, no la velocidad de consumo.","Cuando algo 'gasta' energía, en realidad la convierte en calor desordenado que ya no se puede aprovechar del todo. Ahorrar energía es, en el fondo, perder menos en cada transformación."],"quiz":[{"pregunta":"¿Qué dice la ley de conservación de la energía?","opciones":["Que no se crea ni se destruye, solo se transforma","Que la energía es gratis","Que el calor no es energía"],"correcta":0,"porque":"Es la ley más firme de la física: la energía cambia de forma, nunca de cantidad total."},{"pregunta":"¿Qué es la energía potencial?","opciones":["La guardada por la posición, como el agua de una presa","La del ruido","La que no existe"],"correcta":0,"porque":"Un objeto alto o un muelle comprimido guardan energía lista para soltarse."},{"pregunta":"¿Qué mide la potencia?","opciones":["La velocidad a la que se usa la energía","El color de la luz","El peso de los cables"],"correcta":0,"porque":"Vatios = julios por segundo: potencia es energía dividida por tiempo."}]},{"titulo":"Calor: la física de lo caliente y lo frío","contenido":["La temperatura mide lo agitadas que están las partículas de un cuerpo. El calor es energía que viaja de lo caliente a lo frío, nunca al revés por sí solo: por eso la taza enfría la habitación una mota y la habitación no calienta la taza. Esa flecha de dirección es la segunda ley de la termodinámica.","Hay tres caminos para el calor: conducción (contacto directo, la cuchara en la sopa), convección (corrientes de fluido, el aire caliente que sube) y radiación (ondas de luz infrarroja, el calor del Sol cruzando el vacío). Un buen termo bloquea los tres a la vez.","La entropía mide el desorden, y la segunda ley dice que en todo proceso espontáneo el desorden total aumenta. Por eso los huevos no se desfrían y las tazas rotas no se recomponen: no es imposible por energía, es estadísticamente imposible por desorden.","Las máquinas de vapor nacieron antes que su teoría. Carnot, un ingeniero francés, demostró que ni la máquina perfecta convierte todo el calor en trabajo: siempre se pierde una parte. De esa limitación técnica nació la física más profunda sobre el tiempo y el universo."],"quiz":[{"pregunta":"¿Qué es la temperatura?","opciones":["La medida de la agitación de las partículas","Un color","Una sensación sin física"],"correcta":0,"porque":"Caliente y frío son, en el fondo, partículas moviéndose rápido o despacio."},{"pregunta":"¿En qué dirección fluye el calor espontáneamente?","opciones":["De lo caliente a lo frío","De lo frío a lo caliente","En círculos"],"correcta":0,"porque":"Segunda ley de la termodinámica: el calor baja de temperatura, como el agua baja de altura."},{"pregunta":"¿Qué es la entropía?","opciones":["La medida del desorden, que siempre aumenta en procesos espontáneos","Un tipo de gas","La fuerza del Sol"],"correcta":0,"porque":"El universo tiende al desorden: por eso hay procesos irreversibles."}]},{"titulo":"Electricidad y magnetismo: dos caras de una misma fuerza","contenido":["La electricidad es el movimiento de cargas, casi siempre electrones. La corriente es su caudal (amperios), el voltaje es la presión que los empuja (voltios) y la resistencia es lo que estorba su paso (ohmios). La ley de Ohm los une: V = I·R, la ecuación más útil del taller.","En casa hay que respetar dos ideas: la corriente busca cerrar un circuito, y el agua con sales conduce, así que agua y enchufes no se mezclan. El interruptor de seguridad (el diferencial) corta la luz si detecta que la corriente se fuga por donde no debe: por ejemplo, por una persona.","El magnetismo y la electricidad son la misma fuerza vista desde dos ángulos: una corriente crea un campo magnético (por eso funciona el electroimán del chatarrero) y un imán en movimiento crea corriente (así genera electricidad toda central: hidroeléctrica, eólica o nuclear, todas acaban girando un imán).","Maxwell resumió todo esto en cuatro ecuaciones en 1865 y dedujo algo inesperado: la luz es una onda electromagnética. Radio, wifi, rayos X y luz visible son la misma onda con distinta frecuencia."],"quiz":[{"pregunta":"¿Qué dice la ley de Ohm?","opciones":["V = I·R: voltaje, corriente y resistencia ligados","Que la corriente es azul","Que los electrones pesan"],"correcta":0,"porque":"Con dos de los tres valores calculas el tercero: la base de toda la electricidad práctica."},{"pregunta":"¿Cómo genera electricidad una central hidroeléctrica?","opciones":["El agua mueve turbinas que hacen girar imanes junto a bobinas","Quemando agua","Con paneles solares"],"correcta":0,"porque":"Imán en movimiento → corriente inducida. Todas las centrales acaban en ese truco."},{"pregunta":"¿Qué descubrió Maxwell?","opciones":["Que la luz es una onda electromagnética","Que la Tierra es redonda","Que el aire pesa"],"correcta":0,"porque":"Sus cuatro ecuaciones unificaron electricidad, magnetismo y óptica."}]},{"titulo":"Ondas y sonido: el mensajero tembloroso","contenido":["Una onda es una perturbación que viaja sin que la materia viaje con ella: la ola del estadio recorre las gradas, pero cada persona solo se levanta y se sienta. El sonido es una onda de presión en el aire: el altavoz empuja el aire, el aire empuja a su vecino, y tu oído recoge la llegada.","Tres números describen toda onda: frecuencia (cuántas oscilaciones por segundo, en hercios: es el tono, grave o agudo), amplitud (la fuerza de la oscilación: es el volumen) y longitud de onda (la distancia entre crestas). Una cuerda de guitarra al aire vibra a una frecuencia; al pisarla más corta, sube la frecuencia y el tono.","Cuando dos ondas se encuentran se suman: si llegan en fase se refuerzan (interferencia constructiva) y si llegan desfasadas se cancelan (destructiva). Los auriculares con cancelación de ruido escuchan el ruido y emiten su onda espejo: ruido más antirruido igual a silencio.","El efecto Doppler explica por qué la ambulancia suena más aguda al acercarse y más grave al alejarse: las ondas se comprimen delante y se estiran detrás. Con la luz pasa igual, y eso permitió descubrir que el universo se expande."],"quiz":[{"pregunta":"¿Qué es una onda?","opciones":["Una perturbación que viaja sin transportar materia","Un chorro de partículas","Un tipo de cuerda"],"correcta":0,"porque":"La energía viaja; el agua o el aire solo oscilan en su sitio."},{"pregunta":"¿Qué propiedad de la onda determina si un sonido es grave o agudo?","opciones":["La frecuencia","El volumen","El color"],"correcta":0,"porque":"Más hercios, tono más agudo; menos hercios, más grave."},{"pregunta":"¿Cómo funcionan los auriculares con cancelación de ruido?","opciones":["Emiten la onda opuesta al ruido y se cancelan",
