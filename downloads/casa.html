<!DOCTYPE html>
<!--
  CHARLA — asistente conversacional entrenable de Casa.
  Un archivo. Sin internet, sin CDN, sin dependencias. Licencia MIT.

  Cómo funciona:
   1. Escribes. Casa analiza intención, tipo de respuesta esperado y ánimo.
   2. Si sabe, contesta. Si no, dice que no sabe y te deja enseñarle.
   3. Toda respuesta se puede corregir ENTERA o POR BLOQUES.
   4. Lo aprendido se guarda con su contexto y se reutiliza.
  Nada entra en firme sin que lo confirmes tú.
-->
<html lang="es">
<head>
<meta charset="utf-8">

<title>Charla · Casa</title>
<style>
:root{
  --fondo:#efe8dc; --papel:#f7f1e6; --tinta:#1c1916; --suave:#6a6258;
  --linea:#d7cfc2; --acento:#8b3a2f; --acento-texto:#f7f1e6;
  --mia:#e6ddcd; --radio:14px;
  --ui:"Segoe UI","Helvetica Neue",system-ui,sans-serif; --libro:Georgia,"Times New Roman",serif;

html[data-tema="noche"]{--fondo:#171513;--papel:#211e1a;--tinta:#efe8dc;--suave:#a89e90;
  --linea:#3a342d;--acento:#c9705c;--acento-texto:#171513;--mia:#2b2621}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--ui);

nav button{flex:1;padding:6px;font-size:13px;background:var(--papel);color:var(--tinta);

<body>
<header>
  <h1>Charla <span class="aviso" style="font-weight:400">v10</span></h1>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<footer id="pie"></footer>

<script>
"use strict";
(function () {

/* =====================================================================
   1. NORMALIZAR
   ===================================================================== */
function escRe(t){ return String(t).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function n(t){return String(t||"").toLowerCase().normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim();}
function esc(t){return String(t).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

/* =====================================================================
   2. TEMAS GRAVES — aquí no se aconseja nunca
   ===================================================================== */
var GRAVE = ["murio","se murio","fallecio","muerte","entierro","cancer","tumor",
  "enfermo grave","suicid","quitarme de en medio","me pego","maltrat","denuncia",
  "juicio","adiccion","alcoholic","drogas","no quiero vivir","estoy fatal de la cabeza"];
function esGrave(t){for(var i=0;i<GRAVE.length;i++) if(t.indexOf(GRAVE[i])!==-1) return true;return false;}

/* =====================================================================
   3. INTENCIÓN — catálogo cerrado de 18. No se amplía desde el código.
   ===================================================================== */
var INTENCIONES = ["SALUDAR","DESPEDIR","PREGUNTAR_ESTADO","VALORAR_EXPERIENCIA",
  "PREGUNTAR_DATO","PEDIR_OPINION","PEDIR_INSTRUCCION","COMPROBAR_EXISTENCIAS",
  "PROPONER","OFRECER","PEDIR_FAVOR","CONFIRMAR","DECLINAR","CHARLA_LIGERA",
  "REACCIONAR","EXPRESAR_MALESTAR","CONSOLAR","CORTESIA","PREGUNTAR_IDENTIDAD","AFIRMAR_HECHO"];

var REGLAS_INT = [
  [/\b(como te llamas|cual es tu nombre|tu nombre|^nombre|quien eres|que eres|que sabes|que sabes hacer|que te gusta|te gusta|tu .{0,12}favorit|como puedo verte|donde estas|tienes .{0,10}(cuerpo|cara|edad)|cuantos anos tienes|eres (real|humano|una maquina)|como me ves|de donde eres)\b/, "PREGUNTAR_IDENTIDAD"],
  [/\b(que tal (estas|andas|vas)|como (estas|te encuentras|andas|vas)|todo bien|has dormido|que tal la (manana|noche))\b/, "PREGUNTAR_ESTADO"],
  [/\b(que tal (fue|estuvo|lo pasaste)|como fue|como estuvo|te gusto|merecio la pena)\b/, "VALORAR_EXPERIENCIA"],
  [/\b(hola|holi|buenas|buen dia|buenos dias|buenas tardes|buenas noches|hey|ey|que pasa|saludos)\b/, "SALUDAR"],
  [/^\s*(que hay|que hay\?|que hay de nuevo)\s*[?!]*\s*$/, "SALUDAR"],
  [/\b(adios|adio|chao|chau|ciao|hasta luego|hasta manana|hasta pronto|hasta ahora|me voy|nos vemos|buenas noches ya|me piro|me largo)\b/, "DESPEDIR"],
  [/\b(queda|quedan|hay)\s+\w+\s+(en (la|el) (nevera|despensa|armario)|para)\b|\bnos queda\b/, "COMPROBAR_EXISTENCIAS"],
  [/\b(me dejas|me pasas|me prestas|puedes .{0,20}(traer|coger|bajar|subir)|se puede (entrar|pasar))\b/, "PEDIR_FAVOR"],
  [/\b(que te parece|crees que|piensas que|tu que opinas|que opinas)\b/, "PEDIR_OPINION"],
  [/\b(que hago con|que hay que hacer|que se hace con|donde pongo|debo|tengo que|hace falta que|como lo hago|como se arregla|como se cura)\b/, "PEDIR_INSTRUCCION"],
  [/\b(quieres|te apetece|nos vamos|vamos a|y si|podriamos|te vienes)\b/, "PROPONER"],
  [/\b(te ayudo|quieres que|te echo una mano|necesitas algo)\b/, "OFRECER"],
  [/\b(no, gracias|paso|no me apetece|prefiero no|otro dia)\b/, "DECLINAR"],
  [/\b(gracias|de nada|que aproveche|muy amable|un placer)\b/, "CORTESIA"],
  [/\b(que me dices|no me digas|anda ya|en serio|madre mia|vaya tela)\b/, "REACCIONAR"],
  [/\b(estoy\s+(cansad|hech|fatal|molid|revent|agotad)|que pereza|no puedo mas|me duele|estoy hart|vaya dia|vaya cansancio|cansancio vital|que sueno|estoy roto)/, "EXPRESAR_MALESTAR"],
  [/\b(estoy triste|lo estoy pasando mal|me siento sol|estoy baj)\b/, "CONSOLAR"],
  [/\bhace\s+(un\s+|una\s+|)(frio|calor|dia|tarde|noche|sol|viento)|\bvaya\s+(frio|calor)|\bque\s+(frio|calor)\s+hace|\bllueve|\besta\s+lloviendo/, "CHARLA_LIGERA"],
  [/\b(vale|de acuerdo|hecho|perfecto|apuntalo|si, claro|me parece bien)\b/, "CONFIRMAR"],
  [/\b(donde|cuando|a que hora|quien|cuanto|por que|que dia)\b/, "PREGUNTAR_DATO"]
];
function intencionDe(t){
  for(var i=0;i<REGLAS_INT.length;i++) if(REGLAS_INT[i][0].test(t)) return REGLAS_INT[i][1];
  /* Red de seguridad: si no pregunta nada, te está contando algo.
     Mejor una intención floja que ninguna: sin intención, el filtro
     que impide responder cualquier cosa se queda sin efecto. */
  if(!/[?]/.test(t) && !/\b(que|quien|cuando|donde|cuanto|cual|como|por que)\b/.test(t))
    return "AFIRMAR_HECHO";
  return "";
}

/* Forma de hablar: no es lo mismo "dame eso" que "¿me lo das, porfa?" */
var MODOS=["pregunta","orden","ruego","afirmacion"];
var VERBO_INI=/^(dame|dame|pon|ponme|trae|traeme|coge|cogeme|deja|dejame|abre|cierra|apaga|enciende|llama|dile|dime|busca|guarda|apunta|borra|quita|saca|mete|ven|vete|espera|para|sigue|escucha|mira)\b/;
function modoDe(t){
  if(/\b(porfa|por favor|te lo pido|si eres tan amable|si puedes|hazme el favor)\b/.test(t)) return "ruego";
  /* "el arroz dónde está" es una pregunta aunque no lleve interrogante
     y aunque el "dónde" no vaya delante. Al dictar por voz casi nunca
     llega el signo. */
  if(/[?]/.test(t)||/\b(que|quien|quienes|cuando|donde|cuanto|cuanta|cuantos|cuantas|cual|cuales|como|por que)\b/.test(t))
    return "pregunta";
  if(VERBO_INI.test(t)) return "orden";
  return "afirmacion";
}

/* =====================================================================
   GRAMÁTICA CASTELLANA (incrustada: un módulo, un archivo)
   ===================================================================== */
var PERSONAS = ["yo","tu","el","nosotros","vosotros","ellos"];
var TIEMPOS  = ["presente","pasado","imperfecto","futuro","condicional"];

/* --- terminaciones regulares ------------------------------------- */
var TERM = {
  ar:{ presente:["o","as","a","amos","áis","an"],
       pasado:["é","aste","ó","amos","asteis","aron"],
       imperfecto:["aba","abas","aba","ábamos","abais","aban"] },
  er:{ presente:["o","es","e","emos","éis","en"],
       pasado:["í","iste","ió","imos","isteis","ieron"],
       imperfecto:["ía","ías","ía","íamos","íais","ían"] },
  ir:{ presente:["o","es","e","imos","ís","en"],
       pasado:["í","iste","ió","imos","isteis","ieron"],
       imperfecto:["ía","ías","ía","íamos","íais","ían"] }
};
var FUT  = ["é","ás","á","emos","éis","án"];
var COND = ["ía","ías","ía","íamos","íais","ían"];

/* raíces de futuro que no se hacen con el infinitivo entero */
var RAIZ_FUT = { tener:"tendr", poner:"pondr", salir:"saldr", venir:"vendr",
  hacer:"har", decir:"dir", poder:"podr", querer:"querr", saber:"sabr",
  haber:"habr", caber:"cabr", valer:"valdr" };

/* cambio de raíz en presente (no en nosotros ni vosotros) */
var DIPTONGA = {
  e_ie:["querer","pensar","empezar","cerrar","entender","perder","sentir",
        "preferir","despertar","calentar","encender","merendar","regar"],
  o_ue:["poder","contar","volver","dormir","recordar","encontrar","costar",
        "mover","llover","probar","acostar","soler","doler","colgar","oler","cocer","volar","sonar","rogar","tostar"],
  e_i :["pedir","servir","repetir","vestir","seguir","medir","reir","freir"]
};

/* verbos que van por su cuenta */
var IRREG = {
  ser:{presente:["soy","eres","es","somos","sois","son"],
       pasado:["fui","fuiste","fue","fuimos","fuisteis","fueron"],
       imperfecto:["era","eras","era","éramos","erais","eran"]},
  estar:{presente:["estoy","estás","está","estamos","estáis","están"],
       pasado:["estuve","estuviste","estuvo","estuvimos","estuvisteis","estuvieron"]},
  ir:{presente:["voy","vas","va","vamos","vais","van"],
       pasado:["fui","fuiste","fue","fuimos","fuisteis","fueron"],
       imperfecto:["iba","ibas","iba","íbamos","ibais","iban"]},
  haber:{presente:["he","has","ha","hemos","habéis","han"],
       pasado:["hube","hubiste","hubo","hubimos","hubisteis","hubieron"]},
  tener:{presente:["tengo","tienes","tiene","tenemos","tenéis","tienen"],
       pasado:["tuve","tuviste","tuvo","tuvimos","tuvisteis","tuvieron"]},
  hacer:{presente:["hago","haces","hace","hacemos","hacéis","hacen"],
       pasado:["hice","hiciste","hizo","hicimos","hicisteis","hicieron"]},
  decir:{presente:["digo","dices","dice","decimos","decís","dicen"],
       pasado:["dije","dijiste","dijo","dijimos","dijisteis","dijeron"]},
  poder:{presente:["puedo","puedes","puede","podemos","podéis","pueden"],
       pasado:["pude","pudiste","pudo","pudimos","pudisteis","pudieron"]},
  querer:{presente:["quiero","quieres","quiere","queremos","queréis","quieren"],
       pasado:["quise","quisiste","quiso","quisimos","quisisteis","quisieron"]},
  saber:{presente:["sé","sabes","sabe","sabemos","sabéis","saben"],
       pasado:["supe","supiste","supo","supimos","supisteis","supieron"]},
  ver:{presente:["veo","ves","ve","vemos","veis","ven"],
       pasado:["vi","viste","vio","vimos","visteis","vieron"],
       imperfecto:["veía","veías","veía","veíamos","veíais","veían"]},
  dar:{presente:["doy","das","da","damos","dais","dan"],
       pasado:["di","diste","dio","dimos","disteis","dieron"]},
  venir:{presente:["vengo","vienes","viene","venimos","venís","vienen"],
       pasado:["vine","viniste","vino","vinimos","vinisteis","vinieron"]},
  poner:{presente:["pongo","pones","pone","ponemos","ponéis","ponen"],
       pasado:["puse","pusiste","puso","pusimos","pusisteis","pusieron"]},
  salir:{presente:["salgo","sales","sale","salimos","salís","salen"]},
  traer:{presente:["traigo","traes","trae","traemos","traéis","traen"],
       pasado:["traje","trajiste","trajo","trajimos","trajisteis","trajeron"]},
  oir:{presente:["oigo","oyes","oye","oímos","oís","oyen"]},
  caer:{presente:["caigo","caes","cae","caemos","caéis","caen"]}
};

/* verbos de andar por casa: con estos se cubre casi toda la conversación */
var VERBOS = ["ser","estar","ir","haber","tener","hacer","decir","poder",
"querer","saber","ver","dar","venir","poner","salir","traer","oir","caer",
"hablar","llamar","llevar","dejar","pasar","quedar","tomar","comprar",
"cocinar","cenar","comer","beber","limpiar","lavar","planchar","barrer",
"fregar","tender","recoger","guardar","apuntar","mirar","escuchar","esperar",
"llegar","entrar","subir","bajar","abrir","cerrar","encender","apagar",
"trabajar","descansar","dormir","despertar","levantar","sentar","andar",
"correr","volver","contar","pensar","creer","olvidar","recordar","buscar",
"encontrar","empezar","acabar","terminar","seguir","parar","ayudar",
"cuidar","preguntar","contestar","llorar","reir","cantar","bailar","jugar",
"coger","fregar","tirar","meter","sacar","quitar","poner","echar","doblar",
"sobrar","oler","calentar","congelar","descongelar","hervir","freir","asar",
"aprovechar","estropear","caducar","guardar","enfriar","picar","rallar",
"colgar","enviar","mandar","avisar","cambiar","arreglar","montar","cortar",
"leer","escribir","pintar","coser","regar","pagar","costar","doler",
"necesitar","gustar","preferir","pedir","servir","usar","probar","romper",
"aconsejar","cansar","calentar","estropear","caducar","brillar","molestar",
"soldar","taladrar","enchufar","cargar","descargar","apretar","aflojar",
"volar","viajar","conducir","aparcar","llover","nevar","doler","toser",
"estudiar","aprender","ensenar","enseñar","cantar","tocar","sonar","soñar",
"nadar","pasear","visitar","invitar","celebrar","cumplir","casar","nacer",
"morir","vivir","quedarse","marchar","volverse","acordar","fijar","tardar"];

/* --- conjugar ----------------------------------------------------- */
function clase(inf){ return inf.slice(-2); }
function raizDe(inf){ return inf.slice(0,-2); }

function conjugar(inf, persona, tiempo){
  var i = PERSONAS.indexOf(persona);
  if(i < 0 || TIEMPOS.indexOf(tiempo) < 0) return null;
  var c = clase(inf);
  if(c !== "ar" && c !== "er" && c !== "ir") return null;

  if(tiempo === "futuro" || tiempo === "condicional"){
    var r = RAIZ_FUT[inf] || inf;
    return r + (tiempo === "futuro" ? FUT[i] : COND[i]);
  }
  if(IRREG[inf] && IRREG[inf][tiempo]) return IRREG[inf][tiempo][i];

  var raiz = raizDe(inf);
  if(tiempo === "presente" && i !== 3 && i !== 4){
    if(DIPTONGA.e_ie.indexOf(inf) >= 0) raiz = cambiaUltima(raiz, "e", "ie");
    else if(DIPTONGA.o_ue.indexOf(inf) >= 0) raiz = cambiaUltima(raiz, "o", "ue");
    else if(DIPTONGA.e_i.indexOf(inf) >= 0) raiz = cambiaUltima(raiz, "e", "i");
  }
  if(tiempo === "pasado" && i === 2 && DIPTONGA.e_i.indexOf(inf) >= 0)
    raiz = cambiaUltima(raiz, "e", "i");
  var forma = raiz + TERM[c][tiempo][i];
  /* En castellano el diptongo ue al principio de palabra lleva h:
     oler -> huele, no "uele". Sin esto, "las lentejas huelen raro" no
     reconocía el verbo. */
  if(/^ue/.test(forma)) forma = "h" + forma;
  return forma;
}

/* cambia la ÚLTIMA vocal indicada de la raíz (pensar -> piens, no pienss) */
function cambiaUltima(raiz, de, a){
  var p = raiz.lastIndexOf(de);
  return p < 0 ? raiz : raiz.slice(0,p) + a + raiz.slice(p+1);
}


/* Participio y gerundio: no son personas, pero son verbo. */
function participio(inf){
  var IRR={hacer:"hecho",decir:"dicho",ver:"visto",poner:"puesto",volver:"vuelto",
    abrir:"abierto",escribir:"escrito",romper:"roto",morir:"muerto",cubrir:"cubierto",
    dar:"dado",ser:"sido",ir:"ido",tener:"tenido"};
  if(IRR[inf]) return IRR[inf];
  return clase(inf)==="ar" ? raizDe(inf)+"ado" : raizDe(inf)+"ido";
}
function gerundio(inf){
  var IRR={ir:"yendo",decir:"diciendo",poder:"pudiendo",venir:"viniendo",
    dormir:"durmiendo",pedir:"pidiendo",leer:"leyendo",traer:"trayendo",oir:"oyendo"};
  if(IRR[inf]) return IRR[inf];
  return clase(inf)==="ar" ? raizDe(inf)+"ando" : raizDe(inf)+"iendo";
}

/* --- análisis inverso: de la forma al infinitivo ------------------- */
function sinTilde(p){ return p.replace(/á/g,"a").replace(/é/g,"e").replace(/í/g,"i")
  .replace(/ó/g,"o").replace(/ú/g,"u").replace(/ü/g,"u"); }
var INDICE = null;
function indice(){
  if(INDICE) return INDICE;
  INDICE = {};
  VERBOS.forEach(function(inf){
    TIEMPOS.forEach(function(t){
      PERSONAS.forEach(function(p){
        var f = conjugar(inf, p, t);
        if(!f) return;
        /* se guarda también sin tildes: el motor normaliza el texto y
           busca "cantara", no "cantará" */
        [f, sinTilde(f)].forEach(function(k){
          if(!INDICE[k]) INDICE[k] = [];
          INDICE[k].push({inf:inf, persona:p, tiempo:t});
        });
      });
    });
    INDICE[inf] = INDICE[inf] || [];
    INDICE[inf].push({inf:inf, persona:null, tiempo:"infinitivo"});
    /* "hay" no encaja en ninguna casilla del cuadro: es impersonal.
       Se añade a mano o "¿qué hay que hacer?" no reconoce el verbo. */
    if(inf==="haber"){ INDICE["hay"]=[{inf:"haber", persona:"el", tiempo:"presente"}]; }
    [[participio(inf),"participio"],[gerundio(inf),"gerundio"]].forEach(function(x){
      [x[0], sinTilde(x[0])].forEach(function(k){
        if(!INDICE[k]) INDICE[k]=[];
        INDICE[k].push({inf:inf, persona:null, tiempo:x[1]});
      });
    });
  });
  return INDICE;
}
function analizarVerbo(palabra){
  var l = indice()[palabra.toLowerCase()];
  return l ? l.slice() : null;
}

/* --- espejo: lo que tú dices, dicho por él ------------------------- */
var PAR = { yo:"tú", "tú":"yo", me:"te", te:"me", mi:"tu", tu:"mi",
  mis:"tus", tus:"mis", mío:"tuyo", tuyo:"mío", mía:"tuya", tuya:"mía",
  conmigo:"contigo", contigo:"conmigo", "mí":"ti", ti:"mí" };
var VUELTA = { yo:"tu", tu:"yo", el:"el", nosotros:"vosotros",
               vosotros:"nosotros", ellos:"ellos" };

function espejo(frase){
  return frase.split(/(\s+)/).map(function(tr){
    if(/^\s+$/.test(tr)) return tr;
    var m = tr.match(/^([^a-záéíóúüñ]*)([a-záéíóúüñ]*)([\s\S]*)$/i);
    var antes = m[1], limpio = m[2], cola = m[3];
    if(!limpio) return tr;
    var baja = limpio.toLowerCase();
    if(PAR[baja]) return antes + mayus(limpio, PAR[baja]) + cola;
    /* "como", "sobre", "vale" o "para" parecen verbos y no lo son en
       la frase. Si la palabra pertenece a una clase cerrada, se deja
       en paz: convertir "y como quemado" en "y comes quemado" es peor
       que no hacer nada. */
    var cat = categoria(baja);
    if(cat==="adverbio"||cat==="interrogativo"||cat==="conjuncion"||
       cat==="preposicion"||cat==="articulo") return tr;
    var an = analizarVerbo(baja);
    if(an){
      var v = an.filter(function(x){return x.persona==="yo"||x.persona==="tu";})[0];
      if(v){
        var otra = conjugar(v.inf, VUELTA[v.persona], v.tiempo);
        if(otra) return antes + mayus(limpio, otra) + cola;
      }
    }
    return tr;
  }).join("");
}
function mayus(orig, nueva){
  return /^[A-ZÁÉÍÓÚÑ]/.test(orig) ? nueva.charAt(0).toUpperCase()+nueva.slice(1) : nueva;
}

   conjunciones del castellano son listas CERRADAS: caben enteras y
   no fallan nunca. Los verbos salen del índice. Lo que no es nada de
   eso, es nombre o adjetivo. Esto no se marca a mano: se calcula.
   --------------------------------------------------------------- */

var SUF_ADJ=/(oso|osa|able|ible|ivo|iva|ante|ente|ico|ica|udo|uda|ísimo|isimo|ísima|isima)$/;

function enLista(p, l){ return l.indexOf(p)>=0; }
function categoria(palabra){
  var p = sinTilde(String(palabra||"").toLowerCase());
  if(!p) return "";
  if(enLista(p, ARTICULOS)) return "articulo";
  if(enLista(p, PREPOS))    return "preposicion";
  if(enLista(p, INTERROG))  return "interrogativo";
  if(enLista(p, PRONOM))    return "pronombre";
  if(enLista(p, CONJUN))    return "conjuncion";
  if(enLista(p, ADVERB))    return "adverbio";
  var v = indice()[p];
  if(v && v.length) return v[0].tiempo==="infinitivo" ? "verbo (infinitivo)" : "verbo";
  if(enLista(p, ADJET) || SUF_ADJ.test(p)) return "adjetivo";
  if(/^[0-9]+$/.test(p)) return "numero";
  return "nombre";
}

/* --- contracciones y concordancia --------------------------------- */
function contraer(t){
  return t.replace(/\ba el\b/g,"al").replace(/\bde el\b/g,"del")
          .replace(/\bA el\b/g,"Al").replace(/\bDe el\b/g,"Del");
}
/* Los nombres acabados en -e o en consonante no tienen regla de género
   en castellano: "el coche" pero "la llave". No hay truco que valga, hay
   que listarlos. Estos son los de andar por casa. */
var FEM_EXC = ["mano","foto","moto","radio",
  "llave","leche","carne","noche","tarde","gente","calle","clase","nube",
  "sangre","muerte","suerte","parte","fuente","base","serpiente","corriente",
  "torre","nieve","fiebre","costumbre","cumbre","legumbre","clave","nave",
  "sal","piel","miel","flor","labor","pared","red","sed","vez","luz","voz",
  "cruz","paz","nariz","razon","razón","imagen","cancion","canción","mujer",
  "col","hiel","crin","sien","tos","res","mies"];
var MASC_EXC = ["dia","día","mapa","problema","tema","sofa","sofá","agua"];
/* Del plural al singular: vocal + s, consonante + es, -ones -> -ón */
function singular(p){
  if(!/s$/.test(p) || p.length<3) return p;
  if(/ones$/.test(p)) return p.slice(0,-4)+"ón";
  if(/ces$/.test(p))  return p.slice(0,-3)+"z";      // luces -> luz
  if(/es$/.test(p)){
    /* El castellano solo termina palabra en l, r, n, d, z, s, j, y.
       Si al quitar "es" queda algo que no puede acabar así, es que la
       palabra terminaba en -e: llaves -> llav(e), coches -> coch(e). */
    var sin = p.slice(0,-2);
    return /[lrndzsjy]$/.test(sin) ? sin : p.slice(0,-1);
  }
  return p.slice(0,-1);
}
function genero(p){
  p = p.toLowerCase();
  p = singular(p);
  if(MASC_EXC.indexOf(p) >= 0) return "m";
  if(FEM_EXC.indexOf(p) >= 0) return "f";
  if(/(a|ción|sión|dad|tad|umbre|ez)$/.test(p)) return "f";
  return "m";
}
function numero(p){ return /(s|es)$/.test(p.toLowerCase()) ? "pl" : "sg"; }
function concordar(palabra){
  var g = genero(palabra), n = numero(palabra);
  return { articulo: n==="pl" ? (g==="f"?"las":"los") : (g==="f"?"la":"el"),
           indef:    n==="pl" ? (g==="f"?"unas":"unos") : (g==="f"?"una":"un"),
           genero:g, numero:n };
}

var GRAM={categoria:categoria, conjugar:conjugar, analizarVerbo:analizarVerbo, espejo:espejo,
  contraer:contraer, concordar:concordar, singular:singular, indice:indice};

   4. TIPO DE RESPUESTA EXIGIDO — el interrogativo manda
   ===================================================================== */
var TIPOS = [
  [/\bcuant[oa]s?\s+(?:tiempo\s+)?(?:se\s+)?tarda\b|\bcuanto\s+se\s+tarda\b/, "DURACION"],
  [/\bque\s+ingredientes\b|\bque\s+lleva\b|\bcon\s+que\s+se\s+hace\b/, "LISTA"],
  [/\bquien(?:es)?\b/, "PERSONA"],
  [/\bdonde\b|\ben que (sitio|parte|cajon|armario)\b|\bpor donde\b/, "LUGAR"],
  [/\bcuando\b|\bque\s+dia\b|\ba\s+que\s+hora\b/, "MOMENTO"],
  [/\bcuant[oa]s?\b/, "CANTIDAD"],
  [/\bpor\s+que\b/, "MOTIVO"],
  [/\bcomo\s+se\s+(hace|prepara|pone)\b/, "PROCEDIMIENTO"],
  [/^(?:\s*)(?:es|son|esta|estan|hay|tienes|puedes|quieres|te)\b.*\?/, "SI_NO"]
];
function tipoDe(t){for(var i=0;i<TIPOS.length;i++) if(TIPOS[i][0].test(t)) return TIPOS[i][1];return "";}

/* =====================================================================
   5. DESAMBIGUADOR DE "PASAR" (probado aparte, 40/40)
   ===================================================================== */
var VP="(?:pasar|pasarlo|pasarse|paso|pasas|pasa|pasamos|pasan|pase|pases|pasaste|"+
       "pasaron|pase|pasaba|pasaban|pasando|pasado|pasada|pasame|pasamelo|pasale|"+
       "pasanos|pasalo|pasate)";
var PAS=[
 [new RegExp("\\b(?:me|te|se|nos|os)?\\s*lo\\s+"+VP+"\\b"),"VALORAR_EXPERIENCIA"],
 [new RegExp("\\b"+VP+"\\s+pagina\\b"),"OLVIDAR"],
 [new RegExp("\\b"+VP+"\\s+(?:el|la|los|las|un|una|dos|tres|toda\\s+la|todo\\s+el)?\\s*(?:tiempo|tarde|manana|noche|dia|dias|semana|mes|meses|ano|anos|rato|horas?)\\b"),"TRANSCURRIR"],
 [new RegExp("\\bse\\s+(?:me|te|le|nos)\\s+(?:ha\\s+)?"+VP+"\\b"),"OLVIDAR"],
 [new RegExp("\\b"+VP+"\\s+(?:mucho\\s+|mucha\\s+|muchisimo\\s+|un\\s+|una\\s+|bastante\\s+)?(?:frio|calor|hambre|sed|miedo|sueno|verguenza|dolor)\\b"),"PADECER"],
 [new RegExp("\\b"+VP+"\\s+de\\b(?!\\s+(?:una\\s+vez|golpe))|\\b"+VP+"\\s+olimpicamente\\b"),"DESINTERES"],
 [new RegExp("\\b"+VP+"\\s+por\\s+"),"DESPLAZARSE"],
 [new RegExp("\\b"+VP+"\\s+(?:el|la|los|las)?\\s*(?:examen|itv|curso|prueba|revision|corte)\\b"),"SUPERAR"],
 [new RegExp("\\b(?:pasame|pasamelo|pasale|pasanos)\\s+"),"TRANSFERIR"],
 [new RegExp("\\b"+VP+"\\s+(?:el|la|los|las)?\\s*(?:aspiradora|fregona|trapo|bayeta|escoba)\\b"),"LIMPIAR"],
 [new RegExp("\\b(?:me|te|le|nos)\\s+"+VP+"\\s+(?:el|la|los|las|un|una)\\b"),"TRANSFERIR"]
];
function sentidoPasar(t){
  if(!/\bpas/.test(t)) return "";
  if(/\bpastill|\bpasta\b|\bpasillo/.test(t) && !new RegExp("\\b"+VP+"\\b").test(t)) return "";
  for(var i=0;i<PAS.length;i++) if(PAS[i][0].test(t)) return PAS[i][1];
  return "";
}

/* =====================================================================
   6. ÁNIMO Y CONTEXTO — peso = 2,624 * segundos^-0,628
   ===================================================================== */
function pesoPrevio(seg){ return seg<=1?1:Math.min(1, 2.624*Math.pow(seg,-0.628)); }
var POS=/\b(bien|genial|estupendo|contento|feliz|me alegro|fenomenal|de lujo|encantad)\b/;
var NEG=/\b(mal|fatal|triste|cansad|hart|pereza|horrible|regular|jodid|agobiad|solo)\b/;
function animoDe(t){ if(NEG.test(t)) return "neg"; if(POS.test(t)) return "pos"; return "neu"; }

function animoActual(){
  // El ánimo de ahora, más el de antes pesado por lo que hace que se dijo.
  var v={pos:0,neu:0,neg:0}, ahora=Date.now(), i, m, p;
  for(i=datos.charla.length-1;i>=0 && i>datos.charla.length-8;i--){
    m=datos.charla[i]; if(m.quien!=="yo") continue;
    p=pesoPrevio((ahora-m.t)/1000);
    v[m.animo||"neu"]+=p;
  }
  return v.neg>v.pos && v.neg>v.neu*0.6 ? "neg" : (v.pos>v.neg && v.pos>v.neu*0.6 ? "pos" : "neu");
}

/* Sugerencias: las que vienen de serie más las que pegues tú en
   Ajustes. No son fichas: solo salen cuando pides ayuda al enseñar,
   así que por muchas que metas no compiten con lo que le enseñes. */
function sugerencias(intencion){
  var a=SUG_SERIE[intencion]||[], b=(datos && datos.sug && datos.sug[intencion])||[];
  var vistas={}, out=[];
  b.concat(a).forEach(function(x){
    var k=String(x).toLowerCase();
    if(!vistas[k]){ vistas[k]=1; out.push(x); }
  });
  return out;
}


/* =====================================================================
   8. ALMACÉN — IndexedDB, y si no se puede, localStorage. Sin silencios.
   ===================================================================== */
var VERSION_APP="10";
var CLAVE="casa-charla-v1", alm={modo:"memoria",bd:null,mem:null};
function abrir(){return new Promise(function(ok){
  var p; try{p=indexedDB.open(CLAVE,1);}catch(e){return ok(local());}
  if(!p) return ok(local());
  p.onupgradeneeded=function(){p.result.createObjectStore("estado");};
  p.onsuccess=function(){alm.modo="indexeddb";alm.bd=p.result;ok(true);};
  p.onerror=function(){ok(local());};
  setTimeout(function(){if(alm.modo==="memoria") ok(local());},1500);
});}
function local(){try{localStorage.setItem(CLAVE+"-t","1");localStorage.removeItem(CLAVE+"-t");
  alm.modo="localstorage";}catch(e){alm.modo="memoria";}return true;}
function leer(){return new Promise(function(ok){
  if(alm.modo==="indexeddb"){var t=alm.bd.transaction("estado","readonly").objectStore("estado").get("todo");
    t.onsuccess=function(){ok(t.result||null);};t.onerror=function(){ok(null);};}
  else if(alm.modo==="localstorage"){try{ok(JSON.parse(localStorage.getItem(CLAVE)||"null"));}catch(e){ok(null);}}
  else ok(alm.mem);
});}
function escribir(d){return new Promise(function(ok,mal){
  if(alm.modo==="indexeddb"){var tx=alm.bd.transaction("estado","readwrite");
    tx.objectStore("estado").put(d,"todo");tx.oncomplete=function(){ok(true);};
    tx.onerror=function(){mal(new Error("La base de datos rechazó el guardado."));};}
  else if(alm.modo==="localstorage"){try{localStorage.setItem(CLAVE,JSON.stringify(d));ok(true);}
    catch(e){mal(new Error("No cabe más. Exporta la copia ya."));}}
  else {alm.mem=d;mal(new Error("Sin almacenamiento: al cerrar se pierde. Exporta la copia."));}
});}

var datos=null, vista="charla", aviso="", ense=null, corr=null;
/* Clases que marcas TÚ, porque solo tú sabes que Vicente es una
   persona y que el Madrid es un equipo. Lo gramatical (artículo,
   verbo, preposición) no se marca: lo calcula GRAM.categoria. */
/* Estas nombran una categoría, no una cosa concreta. Si "sobras" fuera
   COMIDA, "¿qué hago con las sobras?" rellenaría el hueco consigo mismo
   y saldría "con sobras añade queso". No se dejan marcar. */
var GENERICAS=("sobras sobra comida comidas cosa cosas algo esto eso aquello "+
  "resto restos trozo trozos parte partes gente persona personas sitio lugar "+
  "sitios cacharro cacharros bicho bichos animal animales").split(" ");
function esGenerica(p){ return GENERICAS.indexOf(p)>=0; }

/* La clase tiene que cuadrar con lo que la palabra ES. Marcar "bien"
   como CUALIDAD convirtió una respuesta en plantilla con hueco y la
   dejó inservible. Ahora se comprueba antes y se explica por qué no.
   ACCION pide un verbo, CUALIDAD un adjetivo, y el resto un nombre. */
function pegaClase(palabra, clase){
  var c=GRAM.categoria(palabra);
  /* Solo se rechaza a ciegas lo que NUNCA nombra nada: artículos,
     preposiciones, pronombres, conjunciones, adverbios. Con el resto
     hay que ser flexible, porque en castellano nombre y verbo se
     solapan sin parar: "la cocina" y "él cocina" son la misma palabra,
     y "roto" es participio y adjetivo a la vez. */
  if(c==="articulo"||c==="preposicion"||c==="pronombre"||c==="conjuncion"||
     c==="adverbio"||c==="interrogativo")
    return '"'+palabra+'" es un '+c+", y esos no nombran nada. "+
           "Marca la palabra que dice QUÉ o QUIÉN.";
  /* Y hasta aquí. No se puede saber si "raro", "moho" o "hinchada" son
     adjetivos sin un diccionario entero, y rechazarlos por no estar en
     una lista es peor que dejarlos pasar. Lo único seguro es lo de
     arriba: las clases cerradas del castellano. */
  return null;
}

var CLASES_SERIE=["PERSONA","ANIMAL","PLANTA","LUGAR","SITIO_CASA","OBJETO",
  "APARATO","HERRAMIENTA","COMIDA","BEBIDA","MEDICINA","ROPA","EQUIPO",
  "ACTIVIDAD","FECHA","HORA","CANTIDAD","DINERO","CUALIDAD","ACCION"];

/* Las de serie más las que te inventes tú. No hay lista de clases que
   valga para todas las casas: quien tiene plantas necesita PLANTA y
   quien tiene taller necesita BROCA. Se crean desde el mismo sitio
   donde se marca la palabra. */
var CLASES=CLASES_SERIE.slice();
function refrescarClases(){
  CLASES=CLASES_SERIE.concat((datos && datos.clases) || []);
}
function nuevo(){return {version:7, charla:[], fichas:[], entidades:{}, contexto:null,
          perfil:0, marcador:[0,0,0,0,0], pesos:null, ajustes:0,
          sug:{}, hechos:[], pendiente:null, clases:[], contextos:[],
          atributos:{}, capas:{}, sentidos:{}, plantillas:{}, grave:0};}

/* Qué entidades conocidas aparecen en la frase. */
function entidadesEn(t, ctx){
  var out=[], k, vistas={}, e=datos.entidades||{}, se=datos.sentidos||{};
  function mete(k2){
    if(vistas[k2] || !new RegExp("\\b"+escRe(k2)+"\\b").test(t)) return;
    vistas[k2]=1;
    var sen=elegirSentido(k2, t, ctx||null);
    if(sen) out.push({palabra:k2, clase:sen.clase, sentido:sen});
  }
  for(k in se) mete(k);
  for(k in e)  mete(k);
  return out;
}

/* Palabras con carga, sin las de relleno. */
var VACIAS={que:1,de:1,la:1,el:1,y:1,a:1,en:1,un:1,una:1,es:1,se:1,no:1,con:1,por:1,
  para:1,me:1,te:1,lo:1,los:1,las:1,su:1,mi:1,tu:1,al:1,del:1,si:1,ya:1,muy:1,mas:1,
  este:1,esta:1,eso:1,esto:1,como:1,pero:1,tan:1,le:1,ha:1,he:1,has:1,hay:1,
  quien:1,quienes:1,cuando:1,donde:1,cuanto:1,cuanta:1,cuantos:1,cuantas:1,
  cual:1,cuales:1,porque:1,tiene:1,tienes:1,tengo:1,tienen:1,hace:1,haces:1,
  hacer:1,estan:1,estoy:1,puede:1,puedes:1,puedo:1,quiere:1,quieres:1,
  tener:1,poder:1,querer:1,haber:1,estar:1,ser:1,
  ellos:1,ellas:1,nosotros:1,vosotros:1,usted:1,ustedes:1,ella:1};
/* Palabras que significan lo mismo comparten clave. Sin esto, "tu nombre"
   y "como te llamas" generan dos fichas distintas para la misma pregunta. */
var SINON={llamas:"nombre",llamo:"nombre",llamar:"nombre",llaman:"nombre",
  apellido:"nombre",apodo:"nombre",edad:"anos",annos:"anos",
  gusta:"gustar",gustan:"gustar",gustaria:"gustar",encanta:"gustar",
  sabes:"saber",sabe:"saber",conoces:"saber",
  eres:"ser",soy:"ser",es:"ser",
  favorito:"favorito",favorita:"favorito",preferido:"favorito",preferida:"favorito",
  cansado:"cansancio",cansada:"cansancio",cansadisimo:"cansancio",agotado:"cansancio",
  comprar:"compra",compro:"compra",compras:"compra",
  /* Saludos: todos a la misma palabra. Sin esto, "Hola ¿qué tal?" y
     "Buenas ¿cómo estás?" no comparten ninguna palabra y no se
     reconocen entre sí. */
  buenas:"hola",holi:"hola",hey:"hola",saludos:"hola",
  adios:"despedida",chao:"despedida",hasta:"despedida",luego:"despedida",
  /* Cortesía y estado */
  gracias:"gracias",graciasss:"gracias",
  vale:"conforme",conforme:"conforme",
  ayuda:"ayudar",ayudas:"ayudar",ayudame:"ayudar",
  /* "estar" y "ser" son vacías por lo mucho que salen, pero el estado
     de ánimo sí importa: se rescata por aquí. */
  tal:"estado",animo:"estado",animado:"estado"};

/* Todas las formas de un verbo se guardan como el infinitivo. Así
   "canta", "cantaba", "cantarás" y "cantó" son la misma palabra clave.
   Esto es lo que hace que una ficha valga para muchas frases sin tener
   que enseñarle cada tiempo verbal por separado. */
function lema(p){
  if(SINON[p]) return SINON[p];
  var a=GRAM.analizarVerbo(p);
  if(a && a.length){
    var v=a.filter(function(x){return x.tiempo!=="infinitivo";})[0];
    if(v) return v.inf;
  }
  return p;
}
function claves(t){
  return n(t).replace(/[^a-z0-9 ]/g," ").split(" ")
    .filter(function(p){return p.length>2 && !VACIAS[p];})
    .map(lema)
    .filter(function(p){return !VACIAS[p];}).slice(0,8);
}
var FORMULAS={SALUDAR:1, DESPEDIR:1, CORTESIA:1, AGRADECER:1};
function clavesCon(t, intencion, ctx){
  var c=claves(t), e=datos.entidades||{}, i, clases=[], rutas=[];
  var tn=n(t);
  for(i=0;i<c.length;i++){
    if(!e[c[i]]) continue;
    var sen0=elegirSentido(c[i], tn, ctx||null);
    /* La clase sale del sentido ELEGIDO, no del primero de la lista:
       "el banco y el dinero" es un LUGAR, aunque el banco del parque
       vaya primero en el vocabulario. */
    var cl0="@"+((sen0 && sen0.clase) || e[c[i]]);
    if(clases.indexOf(cl0)<0) clases.push(cl0);
    /* LA RUTA. El sentido ya elegido tiene una etiqueta inglesa, y esa
       etiqueta es el camino por el que se guarda y se busca. Hace dos
       cosas de una vez:
         · junta sinónimos    nevera y frigorifico -> #fridge
         · separa sentidos    el banco del parque  -> #bench
                              el banco del dinero  -> #bank
       Se guarda ADEMÁS de la palabra, no en su lugar: la palabra
       exacta sigue valiendo más que la ruta. */
    var sen=sen0;
    if(sen && sen.en){
      var ruta="#"+n(sen.en).replace(/[^a-z0-9]/g,"_");
      if(rutas.indexOf(ruta)<0) rutas.push(ruta);
    }
  }
  c=c.concat(rutas).concat(clases);
  if(intencion && FORMULAS[intencion]) c.push("@"+intencion);
  return c;
}

/* =====================================================================
   10. ANÁLISIS Y RESPUESTA
   ===================================================================== */
/* Distancia de una letra: sirve para las erratas de dictado, no para
   parecerse en general. Solo se usa con listas cerradas. */
function unaLetra(a2, b2){
  if(Math.abs(a2.length-b2.length)>1) return false;
  var i=0, j=0, fallos=0;
  while(i<a2.length && j<b2.length){
    if(a2[i]===b2[j]){ i++; j++; continue; }
    if(++fallos>1) return false;
    if(a2.length>b2.length) i++;
    else if(a2.length<b2.length) j++;
    else { i++; j++; }
  }
  return fallos + (a2.length-i) + (b2.length-j) <= 1;
}

/* Los interrogativos cambian el sentido de la frase entera: si "dónde"
   llega como "dnde", Charla deja de saber que le preguntan un sitio y
   contesta cualquier cosa. Se corrigen antes de nada. */
var INTERROG_FIJOS="que quien quienes cuando donde adonde cuanto cuanta cuantos cuantas cual cuales como porque".split(" ");
function arreglaInterrogativos(t){
  return t.split(" ").map(function(p){
    if(p.length<3 || INTERROG_FIJOS.indexOf(p)>=0) return p;
    /* Solo se corrige lo que NO es una palabra conocida. "canta" está a
       una letra de "cuanta" y convertirlo sería destrozar la frase.
       Una errata es una palabra que no existe, no una que se parece. */
    if(GRAM.analizarVerbo(p)) return p;
    if((datos && datos.entidades && datos.entidades[p]) ||
       (datos && datos.sentidos && datos.sentidos[p])) return p;
    if(VACIAS[p] || SINON[p] || ALIM[p] || HERRAM[p]) return p;
    if(GRAM.categoria(p)!=="nombre") return p;
    for(var i=0;i<INTERROG_FIJOS.length;i++)
      if(unaLetra(p, INTERROG_FIJOS[i])) return INTERROG_FIJOS[i];
    return p;
  }).join(" ");
}

function analizar(frase){
  var t=arreglaInterrogativos(n(frase)), inten=intencionDe(t);
  var ents=entidadesEn(t, datos.contexto||null);
  if(!datos.contexto){
    /* Sin contexto abierto: se deduce de las palabras y se vuelven a
       elegir los sentidos con ese contexto ya puesto. */
    var imp=contextoImplicito(ents);
    if(imp) ents=entidadesEn(t, imp);
  }
  return { texto:frase, t:t, grave:esGrave(t), intencion:inten,
           tipo:tipoDe(t), pasar:sentidoPasar(t), animo:animoDe(t),
           modo:modoDe(t), entidades:ents,
           contexto:(datos.contexto || contextoImplicito(ents) || null),
           implicito:(!datos.contexto && !!contextoImplicito(ents)),
           claves:clavesCon(frase, inten, datos.contexto||contextoImplicito(ents)) };
}



/* =====================================================================
   CONTEXTOS Y ATRIBUTOS
   Un contexto ya no es solo un nombre: son CAPAS. Dónde estás, con
   quién, de tú o de usted, qué momento y qué tono. Dos situaciones
   pueden compartir el sitio y diferenciarse por el trato.

   Y cada palabra puede llevar atributos: dónde vive, en qué estado
   está, a qué contexto pertenece. Eso permite que Charla sepa que si
   hablas de arroz estás en la cocina aunque no lo hayas dicho.
   ===================================================================== */
var CONTEXTOS_SERIE = [
  "cocina","comedor","salon","dormitorio","bano","terraza","jardin",
  "garaje","taller","trastero","despensa","lavadero",
  "compra","cocinar","limpieza","colada","plantas","mascotas",
  "medicos","medicinas","dinero","papeleo","averias","bricolaje",
  "coche","viaje","calle","trabajo","tienda","vecinos",
  "familia","amigos","ocio","deporte","futbol","musica","lectura",
  "fiesta","cena","desayuno","noche","manana","fin de semana"
];

/* Las capas: cada una es una pregunta distinta sobre la situación. */
var CAPAS = [
  {id:"sitio",   nombre:"Dónde",     valores:["casa","cocina","salon","dormitorio","bano","terraza","garaje","taller","calle","coche","trabajo","tienda"]},
  {id:"quien",   nombre:"Con quién", valores:["solo","pareja","hijos","familia","amigos","vecino","desconocido","cliente"]},
  {id:"trato",   nombre:"Trato",     valores:["tu","usted"]},
  {id:"momento", nombre:"Cuándo",    valores:["manana","mediodia","tarde","noche","madrugada"]},
  {id:"tono",    nombre:"Tono",      valores:["normal","prisa","broma","serio","cansado"]}
];

/* Atributos que tiene sentido rellenar según la clase. Es una guía
   para quien los rellene, no una obligación. */
var ATRIBUTOS_GUIA = {
  COMIDA:      ["contexto","sitio","estado","se_congela","dura_dias"],
  BEBIDA:      ["contexto","sitio","estado","abierto","dura_dias"],
  MEDICINA:    ["contexto","sitio","receta","momento"],
  HERRAMIENTA: ["contexto","sitio","riesgo","para"],
  APARATO:     ["contexto","sitio","enchufe","marca"],
  ROPA:        ["contexto","sitio","lavado","temporada"],
  PLANTA:      ["contexto","sitio","riego","luz"],
  ANIMAL:      ["contexto","come","paseo"],
  PERSONA:     ["contexto","trato","relacion"],
  SITIO_CASA:  ["contexto"],
  OBJETO:      ["contexto","sitio","para"]
};

/* Carga un paquete de vocabulario entero. Formato:
   { "palabras": { "arroz": {"clase":"COMIDA","contexto":"cocina",
                             "sitio":"despensa","se_congela":"si"} },
     "contextos": ["cocina","taller"],
     "capas": { "cocina": {"sitio":"cocina","trato":"tu"} } }
   Comprueba todo antes de guardar y te dice qué ha descartado. */
function cargarVocabulario(txt){
  var obj;
  try{
    var limpio=txt.replace(/^[\s\S]*?var\s+\w+\s*=\s*/,"").replace(/;\s*$/,"").trim();
    obj=JSON.parse(limpio);
  }catch(e){ return {error:"No he podido leerlo: "+e.message}; }
  if(!obj || typeof obj!=="object") return {error:"Eso no es un paquete de vocabulario."};

  var puestas=0, atrs=0, ctxs=0, caps=0, fuera=[];
  datos.atributos=datos.atributos||{};
  datos.entidades=datos.entidades||{};
  datos.contextos=datos.contextos||[];
  datos.capas=datos.capas||{};
  datos.clases=datos.clases||[];

  (obj.contextos||[]).forEach(function(c){
    c=n(String(c)).trim();
    if(c && datos.contextos.indexOf(c)<0){ datos.contextos.push(c); ctxs++; }
  });

  var k, v, ck;
  for(k in (obj.capas||{})){
    var nom=n(k).trim(), cap=obj.capas[k], guarda={};
    if(!nom || typeof cap!=="object") continue;
    CAPAS.forEach(function(c){ if(cap[c.id]) guarda[c.id]=n(String(cap[c.id])); });
    if(Object.keys(guarda).length){ datos.capas[nom]=guarda; caps++;
      if(datos.contextos.indexOf(nom)<0) datos.contextos.push(nom); }
  }

  for(k in (obj.palabras||{})){
    var pal=n(k).replace(/[^a-z0-9ñ ]/g,"").trim();
    if(!pal){ fuera.push(k); continue; }
    if(esGenerica(pal)){ fuera.push(pal+" (categoría, no cosa)"); continue; }
    v=obj.palabras[k];
    if(typeof v==="string") v={clase:v};
    if(!v || typeof v!=="object"){ fuera.push(pal); continue; }
    /* Formato nuevo: lista de sentidos. Formato viejo: una clase
       suelta, que se convierte en un sentido único. */
    var lista = Array.isArray(v.sentidos) && v.sentidos.length
      ? v.sentidos : (v.clase ? [v] : []);
    if(!lista.length){ fuera.push(pal+" (sin clase)"); continue; }

    var buenos=[], malo=null;
    lista.forEach(function(sen){
      if(!sen || typeof sen!=="object") return;
      var clase=String(sen.clase||"").toUpperCase().replace(/[^A-Z0-9_]/g,"");
      if(!clase) return;
      var mal=pegaClase(pal, clase);
      if(mal){ malo=GRAM.categoria(pal); return; }
      if(CLASES.indexOf(clase)<0){ datos.clases.push(clase); refrescarClases(); }
      var limpio={clase:clase};
      for(ck in sen){
        if(ck==="clase"||ck==="sentidos") continue;
        var val=n(String(sen[ck])).trim();
        if(!val) continue;
        limpio[n(ck).replace(/[^a-z0-9_]/g,"_")]=val;
        atrs++;
      }
      buenos.push(limpio);
      if(limpio.contexto){
        datos.contextos=datos.contextos||[];
        if(datos.contextos.indexOf(limpio.contexto)<0) datos.contextos.push(limpio.contexto);
      }
    });
    if(!buenos.length){ fuera.push(pal+(malo?" ("+malo+")":"")); continue; }

    /* No se pisa: se suman los sentidos que no estuvieran ya. */
    datos.sentidos=datos.sentidos||{};
    var ya=datos.sentidos[pal]||[];
    buenos.forEach(function(nuevo){
      /* Si el sentido trae su traducción inglesa, esa manda como
         identidad: "bench" es "bench" venga del paquete que venga.
         Es la manera más fiable de no duplicar ni pisar sentidos. */
      var igual = nuevo.en
        ? ya.filter(function(x){ return x.en===nuevo.en; })[0]
        : ya.filter(function(x){
            return x.clase===nuevo.clase && (x.contexto||"")===(nuevo.contexto||""); })[0];
      if(igual){ for(ck in nuevo) igual[ck]=nuevo[ck]; }
      else ya.push(nuevo);
    });
    datos.sentidos[pal]=ya;
    datos.entidades[pal]=ya[0].clase;      // el primero hace de principal
    puestas++;
  }
  if(!puestas && !atrs && !ctxs && !caps)
    return {error:"No he encontrado nada aprovechable."};
  var multi=0, mk;
  for(mk in (datos.sentidos||{})) if(datos.sentidos[mk].length>1) multi++;
  datos.fichas.forEach(function(f){ rehacer(f); });
  tirarIndice();
  return {puestas:puestas, atrs:atrs, ctxs:ctxs, caps:caps, multi:multi, fuera:fuera};
}

/* ---------------------------------------------------------------
   SENTIDOS. Una palabra puede ser varias cosas. El alcohol del
   botiquín, el de la copa y el de limpiar son tres, y solo la frase
   entera dice cuál. Se guardan todos y se elige en cada momento.
   --------------------------------------------------------------- */
function sentidosDe(palabra){
  var l=(datos.sentidos||{})[palabra];
  if(l && l.length) return l;
  /* Formato viejo: una clase suelta más sus atributos. */
  var c=(datos.entidades||{})[palabra];
  if(!c) return [];
  var uno={clase:c}, at=(datos.atributos||{})[palabra]||{}, k;
  for(k in at) uno[k]=at[k];
  return [uno];
}

/* Puntúa un sentido contra la frase: manda el contexto abierto, luego
   las palabras vecinas que coinciden con sus atributos o su glosa. */
/* Todas las formas de las palabras de la frase, para poder comparar
   "limpia" con "limpiar" y "cristal" con "cristales". */
function bolsaDe(t){
  var b={};
  t.replace(/[^a-z0-9ñ ]/g," ").split(/\s+/).forEach(function(w){
    if(w.length<3) return;
    b[w]=1; b[lema(w)]=1; b[GRAM.singular(w)]=1; b[lema(GRAM.singular(w))]=1;
  });
  return b;
}
function puntuaSentido(sen, t, ctx, bolsa){
  var p=0, k, v;
  bolsa=bolsa||bolsaDe(t);
  if(ctx && sen.contexto===ctx) p+=6;
  for(k in sen){
    /* "en" es la etiqueta inglesa: sirve para identificar el sentido,
       no para buscarla dentro de una frase en español. */
    if(k==="clase" || k==="en") continue;
    v=n(String(sen[k])).replace(/[^a-z0-9ñ ]/g," ");
    if(!v) continue;
    v.split(/\s+/).forEach(function(w){
      if(w.length<3) return;
      if(bolsa[w] || bolsa[lema(w)] || bolsa[GRAM.singular(w)])
        p+= (k==="contexto"?3:2);
    });
  }
  return p;
}

function elegirSentido(palabra, t, ctx){
  var l=sentidosDe(palabra);
  if(!l.length) return null;
  if(l.length===1) return l[0];
  var bolsa=bolsaDe(t);
  var mejor=l[0], mp=puntuaSentido(l[0], t, ctx, bolsa), i, p;
  for(i=1;i<l.length;i++){
    p=puntuaSentido(l[i], t, ctx, bolsa);
    if(p>mp){ mp=p; mejor=l[i]; }
  }
  return mejor;
}

/* Limpia entidades que nunca debieron entrar. Devuelve las quitadas. */
function purgarVacias(){
  var fuera=[], retiradas={}, e=datos.entidades||{};
  Object.keys(e).forEach(function(p){
    if(p.length<=2 || esGenerica(p) || CERRADAS[GRAM.categoria(p)]){
      fuera.push(p+" ("+GRAM.categoria(p)+")");
      retiradas[p]=e[p];
      delete datos.entidades[p];
      if(datos.sentidos) delete datos.sentidos[p];
      if(datos.atributos) delete datos.atributos[p];
    }
  });
  if(!fuera.length) return fuera;
  /* Los huecos que dejaron esas palabras quedan huérfanos: {CUALIDAD}
     en una respuesta que ya no puede rellenarlo. Se les devuelve la
     palabra original, que casi siempre era el artículo. */
  datos.fichas.forEach(function(f){ limpiaHuecos(f, retiradas); rehacer(f); });
  tirarIndice();
  return fuera;
}

function limpiaHuecos(f, retiradas){
  var texto=(f.bloques||[]).join(" ");
  var marcas=texto.match(/\{([A-Z_]+)\}/g);
  if(!marcas) return;
  var hay=(analizar(f.ida||"").entidades||[]).map(function(x){return x.clase;});
  var huerfanas=marcas.map(function(x){return x.slice(1,-1);})
                      .filter(function(c){return hay.indexOf(c)<0;});
  if(!huerfanas.length) return;
  f.bloques=f.bloques.map(function(b){
    huerfanas.forEach(function(c){
      var orig=Object.keys(retiradas||{}).filter(function(p){return retiradas[p]===c;})[0];
      b=b.split("{"+c+"}").join(orig||"");
      b=b.replace(/\s+/g," ").trim();
    });
    return b;
  }).filter(function(b){ return /[a-záéíóúüñ0-9]/i.test(b); });
}

function atributosDe(palabra, t, ctx){
  var sen=elegirSentido(palabra, t===undefined?"":t, ctx||null);
  if(!sen) return null;
  var o={}, k;
  for(k in sen) if(k!=="clase") o[k]=sen[k];
  return Object.keys(o).length? o : null;
}

function ponerAtributo(palabra, clave, valor){
  datos.atributos=datos.atributos||{};
  var a=datos.atributos[palabra]||{};
  if(valor===null||valor==="") delete a[clave]; else a[clave]=String(valor);
  if(Object.keys(a).length) datos.atributos[palabra]=a;
  else delete datos.atributos[palabra];
  if(clave==="contexto" && valor){
    datos.contextos=datos.contextos||[];
    if(datos.contextos.indexOf(valor)<0) datos.contextos.push(valor);
  }
}

/* Contexto que se deduce de las palabras: si hablas de arroz y arroz
   pertenece a cocina, estás en la cocina aunque no lo hayas abierto. */
function contextoImplicito(entidades){
  var cuenta={}, mejor=null, i;
  (entidades||[]).forEach(function(e){
    var sen=e.sentido;
    if(sen && sen.contexto){ cuenta[sen.contexto]=(cuenta[sen.contexto]||0)+1; }
  });
  for(i in cuenta) if(!mejor || cuenta[i]>cuenta[mejor]) mejor=i;
  return mejor;
}

/* Capas del contexto en uso. Un contexto puede declararlas o no. */
function capasDe(nombre){
  return ((datos.capas||{})[nombre]) || null;
}
function capasComunes(a2, b2){
  var ca=capasDe(a2), cb=capasDe(b2), n2=0, k;
  if(!ca||!cb) return 0;
  for(k in ca) if(cb[k]===ca[k]) n2++;
  return n2;
}


/* =====================================================================
   PLANTILLAS: HABLAR SIN FICHA
   Cuando no hay ninguna ficha buena pero el vocabulario sí sabe algo,
   Charla compone la frase. No inventa hechos: solo pone en castellano
   lo que ya está etiquetado. Si no hay dato, no hay plantilla.
   ===================================================================== */
var IMPER_IRREG={ir:"ve", venir:"ven", tener:"ten", poner:"pon", salir:"sal",
  hacer:"haz", decir:"di", ser:"se", saber:"sabe", oir:"oye", dar:"da"};
function imperativo(inf){
  if(IMPER_IRREG[inf]) return IMPER_IRREG[inf];
  return GRAM.conjugar(inf,"el","presente") || inf;
}

/* El vocabulario se guarda sin tildes para poder buscar. Para hablar
   hay que devolvérselas: "En el cajon" delata la máquina. */
var TILDES={cajon:"cajón",salon:"salón",bano:"baño",armario:"armario",
  botiquin:"botiquín",buhardilla:"buhardilla",desvan:"desván",
  jardin:"jardín",balcon:"balcón",habitacion:"habitación",
  cocina:"cocina",despensa:"despensa",nevera:"nevera",congelador:"congelador",
  encimera:"encimera",fregadero:"fregadero",alacena:"alacena",
  garaje:"garaje",trastero:"trastero",terraza:"terraza",lavadero:"lavadero",
  cajonera:"cajonera",estanteria:"estantería",vitrina:"vitrina",
  aparador:"aparador",comoda:"cómoda",bodega:"bodega",altillo:"altillo"};
function conTilde(p){ return TILDES[p] || p; }

var PLANTILLAS_SERIE = {
  LUGAR:        "En {ART_SITIO} {SITIO}.",
  LUGAR_ORDEN:  "En {ART_SITIO} {SITIO}.",
  FALTA_NUCLEO: "¿El qué?",
  MOMENTO:      "{MOMENTO}.",
  PROCEDIMIENTO:"{VERBO_IMP} {ART_OBJ} {OBJETO}."
};
function plantilla(id){
  return (datos.plantillas && datos.plantillas[id]) || PLANTILLAS_SERIE[id] || null;
}

/* Rellena una plantilla. Devuelve null si falta cualquier pieza: es
   preferible callar a soltar una frase con un hueco dentro. */
function rellenaPlantilla(txt, piezas){
  var falta=false;
  var out=txt.replace(/\{([A-Z_]+)\}/g, function(todo, k){
    if(piezas[k]===undefined || piezas[k]===null || piezas[k]===""){ falta=true; return ""; }
    return piezas[k];
  }).replace(/\s+/g," ").replace(/\s+([.,;:!?])/g,"$1").trim();
  return falta ? null : out;
}

function componer(a){
  /* 1. Preguntas de sitio: el vocabulario sabe dónde vive cada cosa. */
  if(a.tipo==="LUGAR"){
    var conSitio=(a.entidades||[]).filter(function(e){
      return e.sentido && e.sentido.sitio; })[0];
    if(!conSitio){
      /* "¿Dónde está?" a secas: no has dicho el qué, así que se
         pregunta. Pero "¿dónde está el abono?" sí lo dice, aunque no
         sepamos qué es el abono: ahí toca decir que no se sabe. */
      if(!(a.claves||[]).filter(esPropia).length)
        return {texto:plantilla("FALTA_NUCLEO"), motivo:"no has dicho el qué"};
      return null;
    }
    var sitio=conTilde(conSitio.sentido.sitio);
    var cc=GRAM.concordar(conSitio.sentido.sitio);
    var verbo=verboDe(a.t.replace(/[^a-z0-9ñ ]/g," ").split(/\s+/).filter(Boolean));
    /* "¿Dónde guardo X?" pide una orden; "¿dónde está X?" pide un sitio. */
    var manda = verbo && /^(guardar|poner|meter|dejar|colocar)$/.test(verbo.inf);
    var txt = manda
      ? rellenaPlantilla(plantilla("LUGAR_ORDEN"),
          {VERBO_IMP:may(imperativo(verbo.inf)), ART_SITIO:cc.articulo, SITIO:sitio})
      : rellenaPlantilla(plantilla("LUGAR"),
          {ART_SITIO:cc.articulo, SITIO:sitio});
    if(txt) return {texto:txt, motivo:"vocabulario: "+conSitio.palabra+" vive en "+sitio};
  }
  return null;
}

/* =====================================================================
   ALMACÉN DE HECHOS
   Charla guardaba RÉPLICAS: "si me dices X, contesto Y". Esto guarda
   DATOS: sujeto - relación - objeto. Así "va a cantar Miguel" deja de
   ser una respuesta y pasa a ser algo que se puede consultar.

   Regla que no se salta: si no hay una entidad marcada, NO se inventa
   sujeto. Prefiere preguntar.
   ===================================================================== */
var AUX={ser:1,estar:1,haber:1,tener:1,ir:1,poder:1,querer:1,soler:1,deber:1};
var SUJETABLE={PERSONA:1, ANIMAL:1, EQUIPO:1};
var RESERVADO=/\b(medic|pastill|receta|analitic|diagnostic|enferm|hospital|dinero|euros|banco|nomina|deuda|hipoteca|sueldo|divorci|herencia)/;

/* Devuelve {inf, pos} del primer verbo con contenido. */
function verboDe(palabras){
  var i, an, v, primero=null;
  for(i=0;i<palabras.length;i++){
    an=GRAM.analizarVerbo(palabras[i]);
    if(!an || !an.length) continue;
    v=(an.filter(function(x){return x.tiempo!=="infinitivo";})[0]||an[0]).inf;
    if(!primero) primero={inf:v, pos:i};
    if(!AUX[v]) return {inf:v, pos:i};       // "va a cantar" -> cantar
  }
  return primero;                            // solo había auxiliar: vale
}

/* Lo que queda después del verbo, quitando el sujeto y las palabras
   de relleno. "Miguel canta el jueves" -> "el jueves". */
function objetoDe(palabras, verbo, sujeto){
  if(!verbo) return null;
  var resto=palabras.slice(verbo.pos+1).filter(function(p){
    if(p===sujeto) return false;
    var c=GRAM.categoria(p);
    return c!=="pronombre" && c!=="conjuncion" && p!=="que";
  });
  /* La preposición se queda: "a las ocho" es la respuesta, "las ocho"
     está coja. */
  return resto.length ? resto.join(" ") : null;
}

function extraerHechos(a){
  if(a.modo==="pregunta") return [];
  var suj=(a.entidades||[]).filter(function(e){return SUJETABLE[e.clase];})[0];
  var palabras=a.t.replace(/[^a-z0-9ñ ]/g," ").split(/\s+/).filter(Boolean);
  var verbo=verboDe(palabras);
  if(!suj && !verbo) return [];
  var h={ id:"h"+Date.now()+Math.floor(Math.random()*99),
    sujeto: suj?suj.palabra:null,
    clase:  suj?suj.clase:null,
    relacion: verbo?verbo.inf:null,
    objeto: suj?objetoDe(palabras, verbo, suj.palabra):null,
    contexto:a.contexto, ambito: RESERVADO.test(a.t)?"reservado":"personal",
    confirmado:true, t:Date.now() };
  return [h];
}

/* "Apuntado: Miguel canta el jueves", no "Miguel cantar el jueves". */
function frasear(h){
  var v=GRAM.conjugar(h.relacion,"el","presente")||h.relacion;
  return "Apuntado: "+may(h.sujeto)+" "+v+(h.objeto?" "+h.objeto:"")+".";
}

function completo(h){ return !!(h && h.sujeto && h.relacion); }

function guardarHecho(h){
  if(!completo(h)) return null;
  datos.hechos=datos.hechos||[];
  var igual=datos.hechos.filter(function(x){
    return x.sujeto===h.sujeto && x.relacion===h.relacion && x.objeto===h.objeto;})[0];
  if(igual){ igual.t=Date.now(); return igual; }
  datos.hechos.push(h);
  return h;
}
function olvidarHecho(id){
  datos.hechos=(datos.hechos||[]).filter(function(h){return h.id!==id;});
}
function hechosDe(sujeto){
  return (datos.hechos||[]).filter(function(h){return h.sujeto===sujeto;});
}
function may(p){ return String(p).charAt(0).toUpperCase()+String(p).slice(1); }

function consultarHechos(a){
  if(a.modo!=="pregunta" || !(datos.hechos||[]).length) return null;
  var suj=(a.entidades||[]).filter(function(e){return SUJETABLE[e.clase];})[0];
  var palabras=a.t.replace(/[^a-z0-9ñ ]/g," ").split(/\s+/).filter(Boolean);
  var verbo=verboDe(palabras);
  /* "¿Qué hace Miguel?" no pregunta por el verbo hacer: pide la lista
     de todo lo que sé de él. Igual con "¿qué pasa con...?". */
  var COMODIN={hacer:1, pasar:1, ocurrir:1, suceder:1, saber:1, contar:1, decir:1};
  var rel=(verbo && !AUX[verbo.inf] && !COMODIN[verbo.inf]) ? verbo.inf : null;
  if(!suj && !rel) return null;

  var cae=datos.hechos.filter(function(h){
    if(suj && h.sujeto!==suj.palabra) return false;
    if(rel && h.relacion!==rel) return false;
    return true;
  }).sort(function(x,y){return y.t-x.t;});

  /* Preguntan por el sujeto: "¿quién canta?" */
  if((a.tipo==="PERSONA"||a.tipo==="ANIMAL") && rel && !suj){
    if(!cae.length) return null;
    /* Para listar nombres manda el orden en que te los contaron, no
       lo reciente: "Miguel y Celia" suena a lista, no a novedad. */
    var nombres=[];
    cae.slice().sort(function(x,y){return x.t-y.t;})
       .forEach(function(h){ if(nombres.indexOf(h.sujeto)<0) nombres.push(h.sujeto); });
    return { texto: nombres.map(may).join(" y ")+".", hechos:cae };
  }
  if(!suj) return null;

  /* Preguntan un detalle: "¿cuándo canta Miguel?" */
  if(rel){
    if(!cae.length){
      var otros=hechosDe(suj.palabra);
      if(!otros.length) return null;
      /* Sabe quién es, pero no lo que le preguntas. Eso NO puede tapar
         una ficha que sí tenga respuesta: se marca como flojo. */
      return { texto:"De "+may(suj.palabra)+" no sé eso.", hechos:[], flojo:true };
    }
    var conObj=cae.filter(function(h){return h.objeto;});
    if(conObj.length) return { texto: may(conObj[0].objeto)+".", hechos:conObj };
    return { texto:"De "+may(suj.palabra)+" sé que "+cae[0].relacion+
                   ", pero no "+(a.tipo==="MOMENTO"?"cuándo":"ese detalle")+".",
             hechos:cae, flojo:true };
  }

  /* "¿Qué sabes de Miguel?" */
  if(!cae.length) return null;
  var dichos=[];
  cae.forEach(function(h){
    var v=GRAM.conjugar(h.relacion,"el","presente")||h.relacion;
    var frase=v+(h.objeto?" "+h.objeto:"");
    /* "canta el jueves" ya incluye "canta": no repetirlo suelto. */
    var tapado=dichos.filter(function(x){return x.indexOf(v)===0;}).length>0;
    if(!tapado && dichos.indexOf(frase)<0) dichos.push(frase);
  });
  return { texto: may(suj.palabra)+": "+dichos.slice(0,4).join(", ")+".", hechos:cae };
}

function diasDe(t){

  /* Hace falta un espacio entre el número y la unidad. Sin él,
     "serrano" se leía como "serr" + "ano" y daba una fecha absurda. */
  var U="(dias?|semanas?|meses|mes|anos?|horas?|minutos?)";
  m=t.match(new RegExp("\\b(\\d+|[a-z]+)\\s+"+U+"\\b")) ||
    t.match(new RegExp("\\b(\\d+)\\s*"+U+"\\b"));
  if(!m) return null;
  var v = /^\d+$/.test(m[1]) ? parseInt(m[1],10) : NUM[m[1]];
  if(v===undefined || isNaN(v)) return null;
  if(/hora/.test(m[2]))   return v/24;
  if(/minuto/.test(m[2])) return v/1440;
  if(/semana/.test(m[2])) return v*7;
  if(/mes/.test(m[2]))    return v*30;
  if(/ano/.test(m[2]))    return v*365;
  return v;
}

function alimentoDe(t){
  var i, m;
  for(i=0;i<COMPUESTOS.length;i++){
    m=t.match(COMPUESTOS[i][0]);
    if(m) return {palabra:m[0].trim(), cat:COMPUESTOS[i][1], compuesto:true};
  }
  var palabras=t.replace(/[^a-z0-9ñ ]/g," ").split(/\s+/), p, c, hallados=[];
  for(i=0;i<palabras.length;i++){
    p=palabras[i];
    c=ALIM[p] || (p.length>3 ? ALIM[GRAM.singular(p)] : null);
    if(c) hallados.push({palabra:p, cat:c});
  }
  if(!hallados.length) return null;
  /* "Sopa de pescado" no es pescado crudo: si hay una palabra de plato
     cocinado junto a un crudo, manda la cocinada. */
  var cocina=hallados.filter(function(x){return x.cat==="SOBRAS";})[0];
  if(cocina && hallados.filter(function(x){return CRUDOS.indexOf(x.cat)>=0;}).length)
    return cocina;
  /* Si no, manda el más delicado: ante la duda, el plazo corto. */
  hallados.sort(function(x,y){return CAT[x.cat].dias-CAT[y.cat].dias;});
  return hallados[0];
}

function redondea(d){
  if(d<1){ var h=Math.round(d*24); return h+(h===1?" hora":" horas"); }
  var v=Math.round(d);
  return v+(v===1?" día":" días");
}

/* La cuenta pura, para poder probarla con dos hipótesis. */
function dictamen(cat, dias, t){
  var c=CAT[cat];
  if(dias===null)
    return {tipo:"preguntar", texto:"¿Cuántos días lleva? Con "+c.nombre+
            " el límite está en "+c.dias+(c.dias===1?" día.":" días.")};
  /* "cuatro horas fuera de la nevera" lleva dentro la palabra nevera.
     Lo que cuenta es si está DENTRO, no si la nombra. */
  if(FUERA.test(t) && !/\b(en|dentro de)\s+(la\s+)?(nevera|frigo|frigorifico)\b/.test(t)){
    var horas=dias*24;
    if(horas > c.fuera)
      return {tipo:"tirar", texto:"Fuera de la nevera "+c.nombre+" aguanta "+
              c.fuera+(c.fuera===1?" hora":" horas")+". Lleva "+redondea(dias)+". Tíralo."};
    return {tipo:"bien", texto:"Aún está en plazo, pero mételo en la nevera ya."};
  }
  if(dias > c.dias){
    /* En nivel 1 y 2 pasarse es un riesgo de salud: tirar. En nivel 4
       y 5 es cuestión de que ya no está bueno, no de que enferme. */
    if(c.nivel>=4)
      return {tipo:"pasado", texto:may(c.nombre)+" aguanta unos "+c.dias+
        " días y lleva "+redondea(dias)+". No es peligroso, pero habrá perdido. Pruébalo."};
    return {tipo:"tirar", texto:"No. "+may(c.nombre)+" aguanta "+c.dias+
            (c.dias===1?" día":" días")+" en nevera y lleva "+redondea(dias)+". Tíralo."};
  }
  if(dias === c.dias)
    return {tipo:"limite", texto:"Está justo en el límite ("+c.dias+
            (c.dias===1?" día":" días")+"). Si huele raro o tiene mala pinta, tíralo. Si no, hoy y ya."};
  if(dias===0)
    return {tipo:"bien", texto:"Recién hecho, sin problema"+(c.ojo?". Ojo: "+c.ojo:".")};
  return {tipo:"bien", texto:"Va bien: "+redondea(dias)+" de "+c.dias+
          (c.dias===1?" día":" días")+" que aguanta"+(c.ojo?". Ojo: "+c.ojo:".")};
}

/* "¿Los mejillones están crudos o cocinados?", no "¿El mejillones
   está crudo?". El concordador ya estaba, solo había que usarlo. */
function preguntaEstado(palabra){
  var c=GRAM.concordar(palabra), pl=c.numero==="pl", fem=c.genero==="f";
  return "¿"+may(c.articulo)+" "+palabra+" "+(pl?"están":"está")+" "+
         (fem?(pl?"crudas o cocinadas":"cruda o cocinada")
             :(pl?"crudos o cocinados":"crudo o cocinado"))+
         "? Cambia mucho el plazo.";
}


/* =====================================================================
   HERRAMIENTAS
   Aquí no cuentan los días: cuenta con qué te puedes hacer daño.
   Cuatro niveles y la protección de cada uno. Se dice ANTES, no
   después. Y en lo eléctrico se avisa de lo único que importa de

   ===================================================================== */
var RIESGO = {

  alto:   {aviso:"Corta la luz en el cuadro ANTES de tocar nada. "+

  extremo:{aviso:"Gafas cerradas, protección de oídos, guantes gruesos y ropa "+
                 "ceñida. Nada de mangas sueltas ni cordones colgando."}
};
var HERRAM = {};
function herram(nivel, uso, palabras){
  palabras.split(" ").forEach(function(p){ HERRAM[p]={nivel:nivel, uso:uso}; });
}
herram("bajo","montar muebles y apretar tornillos",
  "destornillador destornilladores alicate alicates llave llaves allen inglesa "+
  "martillo espatula metro cinta destornillar atornillar");
