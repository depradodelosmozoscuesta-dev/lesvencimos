herram("extremo","cortar, taladrar y demoler",
  "amoladora radial taladro percutor sierra circular caladora rotaflex "+
  "taladrar amolar esmeriladora ingletadora");

function herramientaDe(t){
  var palabras=t.replace(/[^a-z0-9ñ ]/g," ").split(/\s+/), i, p, hallada=null;
  var orden={bajo:1, medio:2, alto:3, extremo:4};
  for(i=0;i<palabras.length;i++){
    p=palabras[i];
    var h=HERRAM[p] || (p.length>3 ? HERRAM[GRAM.singular(p)] : null);
    /* Si nombra varias, manda la más peligrosa. */
    if(h && (!hallada || orden[h.nivel]>orden[hallada.nivel]))
      hallada={palabra:p, nivel:h.nivel, uso:h.uso};
  }
  return hallada;
}

function veredictoHerramienta(a){
  var t=a.t, h=herramientaDe(t);
  if(!h) return null;
  /* Solo entra si vas a usarla o preguntas cómo. */
  if(!/\b(voy a|puedo|como|que necesito|hace falta|uso|usar|con que|cojo|coger|peligro|seguro|me pongo)\b/.test(t))
    return null;
  return {tipo:"herramienta", nivel:h.nivel, palabra:h.palabra,
          texto: RIESGO[h.nivel].aviso};
}

/* ---------------------------------------------------------------
   PREGUNTA PENDIENTE. Si Charla pregunta "¿cuántos días lleva?" y tú
   contestas "3", ese 3 no significa nada por sí solo: hay que juntarlo
   con lo que preguntaste antes. En tu conversación acertó de milagro,
   con una ficha que no venía a cuento.
   --------------------------------------------------------------- */
function completaPendiente(frase){
  var p=datos.pendiente;
  if(!p) return null;
  datos.pendiente=null;                 // solo vale para el turno siguiente
  var r=n(frase), extra="";
  if(/^\s*\d+\s*$/.test(r)) extra=r.trim()+" dias";        // "3"
  else if(/^\s*(\d+|un|una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez)\s*(dias?|horas?|semanas?)?\s*$/.test(r))
    extra=r.trim()+(/dia|hora|semana/.test(r)?"":" dias");    // "cinco", "dos dias"
  else if(/\b(crud|cocinad|cocid|hervid|asad|frit|guisad|horn)/.test(r)) extra=r;
  else if(/\b(ayer|anteayer|hoy|semana|mes)\b/.test(r)) extra=r;
  else return null;                     // no contestaba a la pregunta
  var juntas=analizar(p.texto+" "+extra);
  var v=veredictoComida(juntas);
  if(!v || v.tipo==="preguntar") return null;
  return v;
}

function veredictoComida(a){
  var t=a.t, al=alimentoDe(t);
  if(!al) return null;
  /* "¿Dónde guardo los garbanzos?" pregunta un SITIO, no si caducan.
     La palabra "guardo" disparaba la tabla y tapaba la respuesta. */
  if(a.tipo==="LUGAR") return null;
  /* La tabla habla de PLAZOS. Solo entra si le preguntas por plazos o
     si dices cuánto tiempo lleva. "¿Qué hago con la pasta?" es una
     instrucción, no una fecha: ahí manda lo que tú le enseñaste. */
  var dePlazo=/\b(caduc|estropea|malo|mala|pasad|huele|aguanta|dura|cuanto tiempo|se puede com|puedo com|me lo como|sirve todavia|esta bien|esta mal|tirar|tiro)/.test(t);
  if(!dePlazo && diasDe(t)===null) return null;
  /* "Me sobró pasta de ayer, ¿qué hago?" lleva fecha pero pide una
     instrucción, no un dictamen. Se marca para que, si tienes una
     ficha, hable ella. Salvo que haya que tirarlo: eso manda siempre. */
  var esInstruccion = !dePlazo &&
    (a.intencion==="PEDIR_INSTRUCCION" || /\bque (hago|preparo|cocino|le pongo)\b/.test(t));

  /* Si ya dices que huele raro o tiene moho, la fecha da igual: eso
     se tira. Preguntar "¿cuántos días lleva?" cuando acabas de decir
     que huele mal es lo contrario de ayudar. */
  if(/\bhuele\w*\s+(raro|mal|fatal|a rayos)|\bhuelen\w*\s+(raro|mal|fatal)|\bmal olor|\btiene moho|\bcon moho|\bmohos|\bverdoso|\bbaboso|\bviscoso|\bpinta rara|\bmala pinta|\bhinchad|\babombad/.test(t))
    return {tipo:"tirar", instruccion:false,
            texto:"Si huele raro o tiene moho, fuera. No merece la pena arriesgarse."};

  var cat=al.cat, dias=diasDe(t);
  var cocinado=COCINADO.test(t), crudo=CRUDO.test(t);

  /* El arroz y las lentejas son dos cosas distintas según estén: en el
     paquete aguantan meses, cocidos tres días. Si no lo dices, se
     prueban las dos, y si la respuesta cambia, pregunta. Antes daba
     por bueno "lentejas de hace seis días", que cocidas se tiran. */
  if(!al.compuesto && SECO_SI_CRUDO.indexOf(al.palabra)>=0 && !cocinado){
    if(crudo) cat="SECO";
    else {
      var vs=dictamen("SECO", dias, t), vh2=dictamen("SOBRAS", dias, t);
      if(vs.tipo===vh2.tipo) cat="SOBRAS";
      else return {tipo:"preguntar", alimento:al.palabra, texto:preguntaEstado(al.palabra)};
    }
  }
  else if(!al.compuesto && CRUDOS.indexOf(cat)>=0 && cocinado) cat="SOBRAS";
  else if(!al.compuesto && CRUDOS.indexOf(cat)>=0 && !crudo && !cocinado){
    /* No sabemos cómo está: se prueban las dos. Solo pregunta si la
       respuesta cambia; si con las dos hay que tirarlo, lo dice y ya. */
    var vc=dictamen(cat, dias, t), vh=dictamen("SOBRAS", dias, t);
    if(vc.tipo===vh.tipo) return CAT[cat].dias<=CAT.SOBRAS.dias ? vc : vh;
    return {tipo:"preguntar", alimento:al.palabra, texto:preguntaEstado(al.palabra)};
  }

  if(CONGELADO.test(t))
    return {tipo:"info", texto:"Congelado aguanta meses. Al descongelarlo, "+
            "cuenta desde cero y no lo vuelvas a congelar."};

  var v=dictamen(cat, dias, t);
  if(v.tipo==="preguntar") v.alimento=al.palabra;
  v.instruccion=esInstruccion;
  return v;
}

/* Una ficha con hueco {PERSONA} solo vale si la frase trae una persona. */
function rellenable(bloques,a){
  var txt=bloques.join(" "), i, c;
  for(i=0;i<CLASES.length;i++){ c=CLASES[i];
    if(txt.indexOf("{"+c+"}")!==-1 && !a.entidades.filter(function(e){return e.clase===c;}).length) return false; }
  return true;
}
function rellenar(bloques,a){
  return bloques.map(function(b){
    CLASES.forEach(function(c){
      var e=a.entidades.filter(function(x){return x.clase===c;})[0];
      if(!e) return;
      /* Si delante del hueco hay artículo, se rehace: la plantilla
         nació con "el pescado" y ahora entra "sopa". */
      b=b.replace(new RegExp("\\b(el|la|los|las|un|una|unos|unas)\\s+\\{"+c+"\\}","gi"),
        function(todo, art){
          var cc=GRAM.concordar(e.palabra);
          var def=/^(el|la|los|las)$/i.test(art);
          var nuevo=def?cc.articulo:cc.indef;
          if(/^[A-ZÁÉÍÓÚÑ]/.test(art)) nuevo=nuevo.charAt(0).toUpperCase()+nuevo.slice(1);
          return nuevo+" "+e.palabra;
        });
      b=b.split("{"+c+"}").join(e.palabra);
    });
    return b;
  }).filter(function(b){ return /[a-záéíóúüñ0-9]/i.test(b); });
}

/* ---------------------------------------------------------------
   CAMINOS. La misma pregunta se puede resolver dando importancia a
   cosas distintas: a las palabras, a la intención, al contexto o a
   la costumbre. Cada reparto de pesos es un camino. No hay uno
   verdadero: hay uno que acierta más contigo, y eso se mide.
   --------------------------------------------------------------- */
var PERFILES=[
 {nombre:"equilibrado",        int:3, tipo:2, pasar:3, animo:1, modo:2, ctx:3, clave:3, hist:1},
 {nombre:"por las palabras",   int:1, tipo:1, pasar:2, animo:0, modo:1, ctx:1, clave:6, hist:0},
 {nombre:"por la intención",   int:6, tipo:4, pasar:2, animo:1, modo:5, ctx:1, clave:1, hist:0},
 {nombre:"por el contexto",    int:2, tipo:1, pasar:1, animo:3, modo:1, ctx:8, clave:2, hist:0},
 {nombre:"por la costumbre",   int:2, tipo:1, pasar:1, animo:1, modo:1, ctx:2, clave:2, hist:4}
];
var EJES=["int","tipo","pasar","animo","modo","ctx","clave","hist"];
function perfilActual(){
  if(datos.pesos) return datos.pesos;
  return PERFILES[datos.perfil||0];
}

/* ---------------------------------------------------------------
   ABANICO. En vez de un solo asistente, ocho. Cada uno usa los
   pesos de ahora movidos un poco al azar, así que se va por un
   camino distinto. Tú les pones nota de 0 a 100 y con las ocho
   notas se corrigen los pesos: hacia donde puntuaste alto y
   lejos de donde puntuaste bajo.
   --------------------------------------------------------------- */
function pesosBase(){
  var w=perfilActual(), o={}, i;
  for(i=0;i<EJES.length;i++) o[EJES[i]]=w[EJES[i]];
  return o;
}
function desviar(w, radio){
  var o={}, i;
  for(i=0;i<EJES.length;i++)
    o[EJES[i]]=Math.max(0, w[EJES[i]] + (Math.random()*2-1)*radio);
  return o;
}
/* Devuelve las respuestas DISTINTAS, con qué pesos salió cada una.
   Si ocho asistentes dicen lo mismo, tú solo puntúas una vez. */
function abanico(a, animo, cuantos, radio){
  var w=pesosBase(), i, r, txt, mapa={}, orden=[];
  cuantos=cuantos||8; radio=radio===undefined?3:radio;
  for(i=0;i<cuantos;i++){
    var wv=desviar(w, radio);
    var c=candidatos(a, animo, wv, 1, 3);
    var bl = c.length ? rellenar(c[0].ficha.bloques.slice(),a) : ["(no sé)"];
    txt = bl.join(" ");
    if(!mapa[txt]){ mapa[txt]={texto:txt, bloques:bl, notasBl:bl.map(function(){return null;}),
                               pesos:[], id:c.length?c[0].ficha.id:null,
                               camino:c.length?c[0].camino:[], nota:null};
                    orden.push(mapa[txt]); }
    mapa[txt].pesos.push(wv);
  }
  return orden;
}
/* Con las notas por bloque se puede armar una respuesta que no dijo
   ninguno de los ocho: el mejor primer bloque de uno con el mejor
   segundo bloque de otro. Acertó el nombre pero no la acción, así
   que nos quedamos con el nombre de aquí y la acción de allá. */
function mejoresBloques(opciones){
  var largo=0, i, j, out=[], mejorN, mejorB;
  opciones.forEach(function(o){ if(o.bloques.length>largo) largo=o.bloques.length; });
  for(j=0;j<largo;j++){
    mejorN=-1; mejorB=null;
    for(i=0;i<opciones.length;i++){
      var o=opciones[i];
      if(j>=o.bloques.length) continue;
      var n=o.notasBl[j];
      if(n===null||n===undefined) n=o.nota;          // sin nota de bloque, vale la general
      if(n===null||n===undefined) continue;
      if(n>mejorN){ mejorN=n; mejorB=o.bloques[j]; }
    }
    if(mejorB!==null && mejorN>=50) out.push(mejorB);
  }
  return out;
}

/* Regla de ajuste: cada peso se mueve según cuánto se desvió en las
   variantes que puntuaste por encima de la media. Es la misma idea
   del ±1 del entrenador, pero usando las ocho notas y no solo dos. */
function ajustarPesos(opciones, radio, paso){
  var todas=[], w=pesosBase(), i, j, med=0, des=0, g;
  radio=radio===undefined?3:radio; paso=paso===undefined?1:paso;
  opciones.forEach(function(o){
    var n=o.nota, v=(o.notasBl||[]).filter(function(x){return x!==null&&x!==undefined;});
    if((n===null||n===undefined) && v.length)
      n=v.reduce(function(x,y){return x+y;},0)/v.length;   // media de los bloques
    if(n===null||n===undefined) return;
    o.pesos.forEach(function(p){ todas.push({p:p, n:+n}); });
  });
  if(todas.length<2) return null;
  for(i=0;i<todas.length;i++) med+=todas[i].n; med/=todas.length;
  for(i=0;i<todas.length;i++) des+=(todas[i].n-med)*(todas[i].n-med);
  des=Math.sqrt(des/todas.length);
  /* Si les has puesto la misma nota a todas, no hay nada que aprender.
     Antes se quedaba callado sin mover nada; ahora lo dice. */
  if(des<0.5) return null;
  for(j=0;j<EJES.length;j++){
    g=0;
    for(i=0;i<todas.length;i++) g+=(todas[i].n-med)/des*(todas[i].p[EJES[j]]-w[EJES[j]]);
    g=g/(todas.length*radio);
    w[EJES[j]]=Math.max(0, Math.min(12, w[EJES[j]]+paso*g));
  }
  datos.pesos=w;
  datos.ajustes=(datos.ajustes||0)+1;
  return w;
}

/* Puntúa una ficha y devuelve además el camino: qué sumó y cuánto. */
function esPropia(c){ return c.charAt(0)!=="@"; }
function esRuta(c){ return c.charAt(0)==="#"; }

/* Cuántos atributos comparten dos palabras. Es la medida de si son
   intercambiables: el arroz y las lentejas viven en la despensa y se
   cuecen las dos; Mourinho y Celia no comparten nada, y por eso lo que
   dijiste de uno no vale para la otra. */
function puenteAtributos(f, a){
  var mejor=0;
  entidadesDe(f.claves||[]).forEach(function(x){
    var ax=atributosDe(x.palabra); if(!ax) return;
    (a.entidades||[]).forEach(function(y){
      if(y.palabra===x.palabra || y.clase!==x.clase) return;
      var ay=atributosDe(y.palabra); if(!ay) return;
      var n2=0, k;
      for(k in ax) if(ay[k]===ax[k]) n2++;
      if(n2>mejor) mejor=n2;
    });
  });
  return mejor;
}

/* Entidades conocidas que aparecen en una lista de claves. */
function entidadesDe(claves, t, ctx){
  var e=datos.entidades||{}, out=[];
  claves.forEach(function(c){
    if(esRuta(c) || !e[c]) return;
    var sen=elegirSentido(c, t||"", ctx||null);
    out.push({palabra:c, clase:sen?sen.clase:e[c]});
  });
  return out;
}
function otroSujeto(f, a){
  var ef=entidadesDe(f.claves||[], f.ida||"", f.contexto), ea=a.entidades||[];
  if(!ef.length || !ea.length) return false;
  if(/\{[A-Z]+\}/.test((f.bloques||[]).join(" "))) return false;   // es plantilla
  /* Da igual la clase: lo que dijiste del Madrid tampoco vale para
     Celia. Si la ficha habla de alguien o algo concreto y tú preguntas
     por otro, no sirve. Solo pasa si comparten la misma entidad. */
  var comparten=false, choca=false;
  ef.forEach(function(x){
    ea.forEach(function(y){
      if(x.palabra!==y.palabra) return;
      /* Misma palabra, distinto sentido: el perro que ladra y el perro
         que le dices a un amigo no son el mismo perro. */
      if(x.clase!==y.clase) choca=true; else comparten=true;
    });
  });
  return choca || !comparten;
}

function puntuar(f, a, animo, w){
  var p=0, camino=[], comunes;
  if(f.intencion && a.intencion && f.intencion!==a.intencion) return null;
  comunes=f.claves.filter(function(c){return a.claves.indexOf(c)!==-1;});
  if(!comunes.length && f.claves.length && a.claves.length) return null;
  /* "@PERSONA" en común no es tener algo en común: cualquier frase con
     una persona lo cumple. Hace falta compartir una palabra de verdad,
     salvo que ninguna de las dos tenga palabras propias. */
  var propiasF=f.claves.filter(esPropia), propiasA=a.claves.filter(esPropia);
  /* "¿Dónde está?" no dice de qué. Una ficha que habla del cuchillo no
     puede contestarla: primero hay que preguntar el qué. */
  if(!propiasA.length && propiasF.length) return null;
  var puente=puenteAtributos(f, a);
  /* Mismo tipo exigido y misma clase de cosa: "¿dónde están las
     lentejas?" y "el arroz dónde está" preguntan lo mismo sobre dos
     comidas. Eso basta para reconocerse sin compartir palabra. */
  var mismoMarco = f.tipo && f.tipo===a.tipo &&
                   comunes.filter(function(c){return !esPropia(c);}).length>0;
  if(propiasF.length && propiasA.length && !comunes.filter(esPropia).length &&
     puente<2 && !mismoMarco) return null;
  /* Lo que opinaste de Mourinho no vale para Celia. Si la ficha se
     aprendió hablando de alguien concreto y ahora preguntas por otro
     de la misma clase, no sirve, salvo que la respuesta se guardara
     como plantilla con hueco. */
  if(otroSujeto(f, a) && puente<2) return null;
  /* Preguntar dónde está algo es preguntar un SITIO. Una ficha de
     cocción no puede contestarlo por compartir la palabra "lentejas".
     Antes: "¿Dónde están las lentejas?" -> "Si están duras, más agua".
     Con aplomo y falso, que es la peor combinación. */
  if(a.tipo==="LUGAR" && f.tipo!=="LUGAR") return null;
  /* Los saludos son fórmulas cortas: "Hola", "Buenas tardes" y "Buenos
     días" no son la misma. Compartir la clave "@SALUDAR" no basta, hace
     falta compartir la palabra de verdad. */
  if(FORMULAS[a.intencion] && a.intencion===f.intencion){
    /* La ficha no puede pedir más de lo que has dicho: "Buenas tardes"
       no contesta a un "Hola" pelado, aunque compartan la raíz. */
    var falta=f.claves.filter(esPropia).filter(function(c){
      return a.claves.indexOf(c)===-1; });
    if(falta.length) return null;
  }
  /* Contarme algo no es preguntarme algo. "Va a cantar Miguel" me lo
     dijiste tú; "¿Y Miguel?" me lo preguntas. Una ficha nacida de una
     afirmación no debe contestar preguntas: para eso hace falta el
     almacén de hechos, no una réplica guardada. */
  if(f.modo && a.modo &&
     (f.modo==="afirmacion") !== (a.modo==="afirmacion")) return null;
  /* "Abre la nevera" y "Cierra la nevera" comparten la nevera y son lo
     contrario. En una orden, el verbo ES la instrucción. */
  if(a.modo==="orden" && f.modo==="orden"){
    var va=verboDe(a.t.replace(/[^a-z0-9ñ ]/g," ").split(/\s+/).filter(Boolean));
    var vf=f.ida ? verboDe(n(f.ida).replace(/[^a-z0-9ñ ]/g," ").split(/\s+/).filter(Boolean)) : null;
    if(va && vf && va.inf!==vf.inf) return null;
  }
  if(!rellenable(f.bloques,a)) return null;
  function suma(n,pts){ if(pts>0){p+=pts; camino.push(n+" +"+pts);} }
  if(f.intencion && f.intencion===a.intencion) suma("misma intención ("+f.intencion+")", w.int);
  if(f.tipo && f.tipo===a.tipo)
    suma("pide lo mismo ("+f.tipo+")", a.tipo==="LUGAR" ? w.tipo*2 : w.tipo);
  if(f.pasar && f.pasar===a.pasar) suma("mismo sentido de pasar", w.pasar);
  if(f.animo===animo)              suma("mismo ánimo", w.animo);
  if(f.modo && f.modo===a.modo)    suma("misma forma ("+f.modo+")", w.modo);
  if(f.contexto && a.contexto){
    /* Lo aprendido dentro de un contexto NO sale en otro. Es la
       diferencia entre el fondo del pozo y el fondo del restaurante:
       misma palabra, dos cosas, y solo el contexto las separa. */
    if(f.contexto!==a.contexto){
      /* Nombres distintos, pero puede que compartan capas: la cena en
         casa y el desayuno en casa comparten sitio y trato. Si no
         comparten ninguna, son mundos separados. */
      var com=capasComunes(f.contexto, a.contexto);
      if(!com) return null;
      suma("capas en común con "+f.contexto+" ("+com+")", Math.round(w.ctx*com/CAPAS.length));
    } else suma("mismo contexto ("+f.contexto+")", w.ctx);
  }
  if(comunes.length){
    var pes=0;
    comunes.forEach(function(c){
      pes += !esPropia(c) ? w.clave/2 : (esRuta(c) ? w.clave*0.8 : w.clave); });
    suma("palabras en común ("+comunes.join(", ")+")", Math.round(pes));
  }
  /* Una ficha que nombra justo esa comida vale más que una plantilla
     que sirve para cualquiera. Antes "me sobra bacon" contestaba con
     la ficha de la sopa. */
  var exacta=0;
  (a.entidades||[]).forEach(function(e){
    if((f.claves||[]).indexOf(e.palabra)>=0) exacta++;
  });
  if(exacta) suma("habla justo de eso ("+exacta+")", exacta*w.clave);
  /* Dos palabras distintas que comparten atributos se parecen: el
     arroz y las lentejas viven las dos en la despensa y las dos se
     cuecen. Vale menos que nombrar la misma, pero vale. */
  if(puente) suma("comparten "+puente+" atributos", Math.min(w.clave, puente));
  var h=(Math.min(2,f.aciertos||0)-Math.min(3,f.fallos||0))*w.hist;
  if(h>0) suma("ya te ha servido antes", h);
  else if(h<0){ p+=h; camino.push("la has corregido "+h); }
  return {ficha:f, punt:p, camino:camino};
}

/* Hasta tres respuestas distintas, ordenadas, cada una con su camino. */
/* ---------------------------------------------------------------
   ÍNDICE INVERTIDO. En vez de mirar las 200.000 fichas una a una,
   se mira solo las que comparten alguna palabra con la pregunta.
   Se reconstruye cuando cambia el número de fichas. Nada más.
   --------------------------------------------------------------- */
var IDX=null, IDX_N=-1, IDX_SIN=[], palAbierta=null;
function indiceFichas(){
  if(IDX && IDX_N===datos.fichas.length) return IDX;
  IDX={}; IDX_SIN=[];
  datos.fichas.forEach(function(f){
    if(!f.claves || !f.claves.length){ IDX_SIN.push(f); return; }
    f.claves.forEach(function(c){ (IDX[c]=IDX[c]||[]).push(f); });
  });
  IDX_N=datos.fichas.length;
  return IDX;
}
function tirarIndice(){ IDX=null; IDX_N=-1; }

/* Las fichas que merece la pena mirar para esta pregunta. */
function aspirantes(a){
  var ix=indiceFichas(), vistas={}, out=IDX_SIN.slice();
  if(!a.claves.length) return datos.fichas;      // sin palabras, todas
  a.claves.forEach(function(c){
    (ix[c]||[]).forEach(function(f){ if(!vistas[f.id]){vistas[f.id]=1; out.push(f);} });
  });
  return out;
}

function candidatos(a, animo, w, tope, sacudida){
  /* sacudida: solo la usa el abanico. Sin ella, dos fichas empatadas
     salen siempre en el mismo orden y los ocho caminos acaban diciendo
     lo mismo. Un empujoncito al azar hace que el abanico explore.
     La respuesta normal NO lleva sacudida: es la misma siempre. */
  var lista=[], i, r, vistos={}, cand;
  w=w||perfilActual(); tope=tope||3; sacudida=sacudida||0;
  cand=aspirantes(a);
  for(i=0;i<cand.length;i++){
    r=puntuar(cand[i], a, animo, w);
    if(r){ if(sacudida) r.punt+=Math.random()*sacudida; if(r.punt>=5) lista.push(r); }
  }
  lista.sort(function(x,y){return y.punt-x.punt;});
  return lista.filter(function(r){
    var k=rellenar(r.ficha.bloques.slice(),a).join("|");
    if(vistos[k]) return false; vistos[k]=1; return true;
  }).slice(0,tope);
}

function buscar(a, animo){
  var c=candidatos(a, animo, perfilActual(), 1);
  return c.length ? {ficha:c[0].ficha, punt:c[0].punt, camino:c[0].camino} : null;
}

/* Repreguntar: ya sabemos cuál era la buena. Se prueban todos los
   caminos y se anota cuáles la habrían puesto la primera. */
function repreguntar(frase, buena){
  var a=analizar(frase), animo=animoActual(), res=[];
  PERFILES.forEach(function(w,i){
    var c=candidatos(a, animo, w, 3);
    var pos=-1, k;
    for(k=0;k<c.length;k++)
      if(rellenar(c[k].ficha.bloques.slice(),a).join(" ").trim()===buena.trim()){pos=k;break;}
    res.push({perfil:w.nombre, i:i, puesto:pos, camino:pos>=0?c[pos].camino:[],
              propone:c.length?rellenar(c[0].ficha.bloques.slice(),a).join(" "):"(nada)"});
  });
  return {a:a, res:res};
}

/* Anota el resultado y, si un camino destaca, lo adopta. */
function anotarCamino(res){
  datos.marcador=datos.marcador||[0,0,0,0,0];
  res.forEach(function(r){ if(r.puesto===0) datos.marcador[r.i]++; });
  var mejor=0, i;
  for(i=1;i<datos.marcador.length;i++) if(datos.marcador[i]>datos.marcador[mejor]) mejor=i;
  var total=datos.marcador.reduce(function(x,y){return x+y;},0);
  if(total>=10 && datos.marcador[mejor]>datos.marcador[datos.perfil||0]) datos.perfil=mejor;
  return {perfil:PERFILES[datos.perfil||0].nombre, marcador:datos.marcador.slice(), total:total};
}

function responder(frase){
  var a=analizar(frase), animo=animoActual();
  if(a.grave){
    datos.grave++;
    return {a:a, bloques:["Eso es serio y no soy quien para aconsejarte.",
                          "Habla con alguien de confianza."], origen:"grave"};
  }
  /* Comida: si el veredicto es TIRAR manda por encima de todo lo
     aprendido. En lo demás deja hablar a tus fichas, y solo contesta
     él si no hay ninguna. */
  /* ¿Estaba esperando un dato? Si esto lo completa, se contesta ya. */
  var comp=completaPendiente(frase);
  if(comp) return {a:a, bloques:[comp.texto], origen:"comida"};

  /* La tabla manda SIEMPRE que tenga veredicto, no solo para tirar.
     Una ficha que dice "Basura" no puede tapar un "va bien", ni un
     "va bien" aprendido puede tapar un "tíralo", ni ninguna ficha
     puede saltarse la pregunta de si está crudo o cocinado. Si había
     una ficha, se ofrece debajo como alternativa. */
  var vc=veredictoComida(a);
  if(vc){
    var alt=candidatos(a, animo, perfilActual(), 2);
    /* Pediste una instrucción y tienes ficha propia: contesta la tuya.
       El peligro es lo único que no cede. */
    if(vc.instruccion && vc.tipo!=="tirar" && alt.length) vc=null;
  }
  if(vc){
    if(vc.tipo==="preguntar") datos.pendiente={texto:a.texto, t:Date.now()};
    /* Si hay peligro o falta un dato, la tabla habla sola: nada puede
       taparlo. Si no lo hay, la tabla va DELANTE y tu respuesta detrás,
       porque preguntaste qué hacer y eso lo sabes tú mejor. */
    /* Seguridad alimentaria: el veredicto habla SOLO. Una ficha
       aprendida no puede ir pegada detrás contradiciéndolo ni
       matizándolo. Si tenías una, queda debajo como alternativa. */
    return {a:a,
      bloques: [vc.texto],
      origen: vc.tipo==="preguntar" ? "comida-falta" : "comida",
      camino:["tabla de conservación ("+vc.tipo+")"],
      otras: alt.map(function(r2){
        return {id:r2.ficha.id, texto:rellenar(r2.ficha.bloques.slice(),a).join(" "),
                punt:r2.punt, camino:r2.camino};})};
  }
  /* La protección se dice antes de empezar, no después. Nivel alto y
     extremo mandan por encima de lo aprendido. */
  var vh3=veredictoHerramienta(a);
  if(vh3 && (vh3.nivel==="alto"||vh3.nivel==="extremo"))
    return {a:a, bloques:[vh3.texto], origen:"herramienta"};

  var rh=null;
  if(a.modo==="pregunta"){
    rh=consultarHechos(a);
    if(rh && !rh.flojo) return {a:a, bloques:[rh.texto], origen:"hecho", hechos:rh.hechos};
  }
  /* En una afirmación el hecho se guarda calladamente: la respuesta la
     sigue dando la ficha si la hay. Contarle algo y que además conteste
     no son cosas incompatibles. */
  var nuevos=[];
  if(a.modo!=="pregunta"){
    nuevos=extraerHechos(a).map(guardarHecho).filter(Boolean);
  }
  var cs=candidatos(a, animo, perfilActual(), 3);
  var h=cs.length ? {ficha:cs[0].ficha, punt:cs[0].punt, camino:cs[0].camino} : null;
  if(h){ h.ficha.usos=(h.ficha.usos||0)+1;
         return {a:a, bloques:rellenar(h.ficha.bloques.slice(),a), origen:"aprendido",
                 id:h.ficha.id, punt:h.punt, camino:h.camino,
                 hechos:nuevos,
                 otras:cs.slice(1).map(function(r){
                   return {id:r.ficha.id, texto:rellenar(r.ficha.bloques.slice(),a).join(" "),
                           punt:r.punt, camino:r.camino};})}; }
  if(vh3) return {a:a, bloques:[vh3.texto], origen:"herramienta"};
  if(rh) return {a:a, bloques:[rh.texto], origen:"hecho", hechos:rh.hechos};
  var comp=componer(a);
  if(comp) return {a:a, bloques:[comp.texto], origen:"plantilla",
                   camino:["compuesto — "+comp.motivo]};
  if(nuevos.length)
    return {a:a, origen:"hecho-nuevo", hechos:nuevos,
      bloques:[frasear(nuevos[0])]};
  /* Sabe de quién le hablas pero no qué le cuentas. Pregunta en vez
     de suponer. */
  var medio=extraerHechos(a)[0];
  if(medio && medio.sujeto && !medio.relacion)
    return {a:a, origen:"hecho-falta",
            bloques:["¿Qué me cuentas de "+may(medio.sujeto)+"?"]};
  return {a:a, bloques:[], origen:"no-se"};
}

/* Parte una respuesta en bloques por puntuación. */
function partir(texto){
  return String(texto).split(/(?<=[.!?])\s+|\s*\|\s*/).map(function(s){return s.trim();})
    .filter(Boolean);
}

/* Si la respuesta repite una entidad que venía en la pregunta, se
   guarda como hueco. Así una ficha cubre a Miguel, a Raúl y a quien
   venga después. Se usa al enseñar Y al corregir: si no, corregir un
   bloque dejaba dentro "pasta" y la plantilla se quedaba coja. */
var CERRADAS={articulo:1, preposicion:1, pronombre:1, conjuncion:1,
              adverbio:1, interrogativo:1};
/* Un artículo jamás es un hueco. Si el vocabulario marcó "el" o "donde"
   como entidad, "En el cajón" se convertía en "En {CUALIDAD} cajón" y
   al rellenarlo salía "En donde cajón". El motor se protege solo,
   aunque los datos vengan mal. */
function huecable(palabra){
  return palabra.length>2 && !CERRADAS[GRAM.categoria(palabra)];
}
function ponerHuecos(bloques, entidades){
  return bloques.map(function(b){
    (entidades||[]).forEach(function(e){
      if(!huecable(e.palabra)) return;
      b=b.replace(new RegExp("\\b"+escRe(e.palabra)+"\\b","gi"),"{"+e.clase+"}");
    });
    return b;
  });
}

function aprender(a, bloques, animo){
  bloques=ponerHuecos(bloques, a.entidades);
  var f={ id:"f"+Date.now()+Math.floor(Math.random()*99),
    ida:a.texto, claves:a.claves, intencion:a.intencion, tipo:a.tipo,
    pasar:a.pasar, animo:animo, modo:a.modo, contexto:a.contexto,
    bloques:bloques, aciertos:0, fallos:0, usos:0,
    ambito:"personal", t:Date.now() };
  datos.fichas.push(f);
  tirarIndice();
  return f;
}

/* Las palabras se marcaban solo en el panel de enseñar, y ese panel
   únicamente aparece cuando Charla no sabe qué decir. Si ya lo sabía,
   no había manera de marcar nada. Aquí se marca cuando quieras. */
/* Marcar una palabra tiene efecto hacia atrás: las fichas que la
   nombran vuelven a calcular sus claves Y sus huecos. Si no, la
   respuesta se quedaría con "Miguel" escrito a mano y no serviría
   para Raúl. */
function rehacer(f){
  if(!f.ida) return;
  f.claves=clavesCon(f.ida, f.intencion, f.contexto);
  f.bloques=ponerHuecos(f.bloques, analizar(f.ida).entidades);
}

function barra(etiqueta, valor, tope, extra){
  var pct = tope>0 ? Math.round(100*valor/tope) : 0;
  return '<div class="brow"><span class="bet">'+esc(etiqueta)+"</span>"+
         '<span class="bar"><i style="width:'+Math.max(pct,2)+'%"></i></span>'+
         '<span class="bnum">'+valor+(extra||"")+"</span></div>";
}

/* ---------------------------------------------------------------
   EXAMEN. Pegas un montón de preguntas y Charla las contesta todas
   de golpe SIN guardar nada. Sirve para ver el agujero: qué sabe
   contestar y qué no. Las preguntas se las puede escribir una IA;
   las respuestas NO, porque una IA no conoce tu manera de hablar.
   --------------------------------------------------------------- */
var examen=null;

function pasarExamen(texto){
  var lineas=texto.split(/\r?\n/).map(function(l){return l.trim();})
                  .filter(function(l){return l.length>2;});
  var bien=[], mal=[], vistas={};
  lineas.forEach(function(q){
    if(vistas[q.toLowerCase()]) return;
    vistas[q.toLowerCase()]=1;
    var a=analizar(q);
    if(a.grave){ mal.push({q:q, motivo:"tema serio"}); return; }
    var c=candidatos(a, animoActual(), perfilActual(), 1);
    if(c.length) bien.push({q:q, r:rellenar(c[0].ficha.bloques.slice(),a).join(" "),
                            punt:c[0].punt});
    else mal.push({q:q, motivo:faltaPor(a)});
  });
  return {bien:bien, mal:mal, total:lineas.length};
}

/* Por qué no sabe: sirve más que un "no sé" a secas. */
function faltaPor(a){
  var propias=(a.claves||[]).filter(esPropia);
  if(!propias.length) return "no reconozco ninguna palabra";
  var sinMarcar=[];
  propias.forEach(function(p){
    if(!(datos.entidades||{})[p] && GRAM.categoria(p)==="nombre") sinMarcar.push(p);
  });
  if(sinMarcar.length) return "sin marcar: "+sinMarcar.join(", ");
  return "no le he enseñado nada parecido";
}

  if(!examen||!examen.res) return h;
  var r=examen.res, pct=r.total?Math.round(100*r.bien.length/(r.bien.length+r.mal.length)):0;
  h+='<div class="panel"><b>Contesta '+r.bien.length+' de '+

  if(r.mal.length){

    r.mal.forEach(function(x,k){
      h+='<div class="opc"><button data-act="ir-a-ensenar" data-k="'+k+'">'+esc(x.q)+"</button>"+
         '<span class="meta"> '+esc(x.motivo)+"</span></div>";
    });
  }
  if(r.bien.length){
    h+='<p class="aviso">Estas sí:</p>';
    r.bien.forEach(function(x,k){
      h+='<div class="opc"><div class="opct">'+esc(x.q)+"</div>"+
         '<div class="meta">→ '+esc(x.r)+"  ["+x.punt+"]</div>";
      if(x.juicio) h+='<span class="meta">'+esc(x.juicio)+"</span>";
      else h+='<div class="acc"><button data-act="ex-bien" data-k="'+k+'">Bien</button>'+
              '<button data-act="ex-mal" data-k="'+k+'">Mal</button></div>';
      h+="</div>";
    });
  }
  return h+"</div>";
}

function pintar(){
  document.getElementById("nav").innerHTML=VISTAS.map(function(v){
    return '<button data-act="ir" data-v="'+v.id+'" aria-current="'+(v.id===vista)+'">'+esc(v.t)+"</button>";
  }).join("");
  var m=document.getElementById("main");
  m.innerHTML=(VISTAS.filter(function(v){return v.id===vista;})[0]).f();
  var barra;
  if(datos.contexto){
    barra='<div class="ctxbar">Contexto: <b>'+esc(datos.contexto)+'</b>'+
          '<button data-act="cerrar-ctx">Cerrar</button></div>';
  } else {
    /* Los contextos usados se guardan y se reabren de un toque. Si hay
       que teclearlos cada vez, "cocina" y "Cocina" acaban siendo dos
       cosas distintas y lo aprendido se parte por la mitad. */
    barra='<div class="ctxbar"><span class="aviso">Sin contexto</span>';
    (datos.contextos||[]).slice(-6).forEach(function(c){
      barra+='<button data-act="usar-ctx" data-c="'+esc(c)+'">'+esc(c)+"</button>";
    });
    barra+='<button data-act="abrir-ctx">+ nuevo</button></div>';
  }
  document.getElementById("pie").innerHTML = vista==="charla"
    ? barra+'<div class="linea"><input id="entrada" placeholder="Escribe…" autocomplete="off">'+
      '<button data-act="enviar">Enviar</button></div>' : "";
  if(vista==="charla"){ m.scrollTop=m.scrollHeight;
    var e=document.getElementById("entrada"); if(e && !ense && !corr) e.focus(); }
}

function enviar(){
  var e=document.getElementById("entrada"); if(!e) return;
  var txt=e.value.trim(); if(!txt) return;
  e.value="";
  meter(txt);
}

/* Meter una frase en el hilo como si la hubieras escrito. Lo usa el
   botón de enviar y también el examen. */
function meter(txt){
  var animo=animoActual();
  var a=analizar(txt);
  datos.charla.push({quien:"yo",texto:txt,t:Date.now(),animo:a.animo});
  var r=responder(txt);
  if(r.origen==="no-se"){
    datos.charla.push({quien:"casa",texto:"No sé qué decir aquí. ¿Qué te habría gustado oír?",
      t:Date.now(),origen:"no-se",bloques:[],intencion:r.a.intencion});
    ense={a:r.a, animo:animo, borrador:""};
  } else {
    datos.charla.push({quien:"casa",texto:r.bloques.join(" "),bloques:r.bloques,t:Date.now(),
      origen:r.origen, id:r.id, intencion:r.a.intencion,
      pregunta:txt, camino:r.camino||null, otras:r.otras||null, punt:r.punt||0,
      hechos:r.hechos||null,
      meta:r.origen==="grave"?"tema delicado: no aconsejo":
           (r.a.intencion? r.a.intencion.replace(/_/g," ").toLowerCase()+" · "+animo : animo)});
  }
  guardar().then(pintar);
}
