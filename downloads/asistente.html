<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<meta name="description" content="Asistente offline Les vencimos — privado, en tu aparato.">
<title>Asistente offline — Les vencimos</title>
<style>
:root {
  --bg: #0B1220; --bg2: #111827; --bg3: #1a2332; --card: #152033;
  --border: #243044; --text: #E8EDF7; --muted: #94A3B8;
  --accent: #C7D2FE; --accent2: #A5B4FC; --accent-dim: rgba(199,210,254,.12);
  --ok: #6EE7B7; --warn: #FCD34D; --danger: #FCA5A5;
  --radius: 14px; --tap: 48px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", sans-serif;
  --shadow: 0 8px 28px rgba(0,0,0,.35);
}
[data-theme="light"] {
  --bg: #F4F6FB; --bg2: #FFFFFF; --bg3: #EEF1F8; --card: #FFFFFF;
  --border: #D8DEEA; --text: #0B1220; --muted: #64748B;
  --accent: #4338CA; --accent2: #4F46E5; --accent-dim: rgba(67,56,202,.1);
  --ok: #059669; --warn: #B45309; --danger: #DC2626;
  --shadow: 0 8px 24px rgba(15,23,42,.08);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; min-height: 100%; }
body {
  font-family: var(--font); background: var(--bg); color: var(--text);
  line-height: 1.45; -webkit-font-smoothing: antialiased;
  padding-bottom: calc(72px + env(safe-area-inset-bottom));
}
button, input, select, textarea { font: inherit; color: inherit; }
button {
  cursor: pointer; border: none; background: var(--accent-dim); color: var(--accent);
  min-height: var(--tap); padding: .65rem 1rem; border-radius: 12px; font-weight: 600;
  transition: background .15s, transform .1s;
}
button:active { transform: scale(.98); }
button.primary { background: var(--accent); color: var(--bg); }
[data-theme="light"] button.primary { color: #fff; }
button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
button.danger { background: rgba(252,165,165,.15); color: var(--danger); }
button.icon { width: var(--tap); min-width: var(--tap); padding: 0; display: inline-flex; align-items: center; justify-content: center; font-size: 1.2rem; }
input, select, textarea {
  width: 100%; background: var(--bg3); border: 1px solid var(--border);
  border-radius: 12px; padding: .75rem .9rem; min-height: var(--tap); outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent2); box-shadow: 0 0 0 3px var(--accent-dim); }
textarea { min-height: 100px; resize: vertical; }
label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: .35rem; font-weight: 500; }
.field { margin-bottom: .9rem; }
.row { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
.row > * { flex: 1; min-width: 0; }
.hidden { display: none !important; }
.app-header {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
  padding: .75rem 1rem; display: flex; align-items: center; gap: .75rem;
}
.brand-mark {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(145deg, var(--accent), #818CF8);
  display: grid; place-items: center; color: #0B1220; font-weight: 800; font-size: .9rem; flex-shrink: 0;
}
.brand-text h1 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: -.01em; }
.brand-text p { margin: 0; font-size: .75rem; color: var(--muted); }
.header-actions { margin-left: auto; display: flex; gap: .4rem; }
main { max-width: 720px; margin: 0 auto; padding: 1rem; }
.panel { display: none; }
.panel.active { display: block; animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.section-title { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin: 1.1rem 0 .65rem; }
.section-title h2 { margin: 0; font-size: 1.05rem; }
.subtabs { display: flex; gap: .4rem; overflow-x: auto; padding-bottom: .25rem; margin-bottom: .75rem; }
.subtabs button { flex: 0 0 auto; min-height: 40px; padding: .45rem .9rem; background: transparent; border: 1px solid var(--border); color: var(--muted); font-size: .9rem; }
.subtabs button.active { background: var(--accent-dim); color: var(--accent); border-color: transparent; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; margin-bottom: .7rem; box-shadow: var(--shadow); }
.card h3 { margin: 0 0 .35rem; font-size: 1rem; }
.card .meta { font-size: .82rem; color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 2rem 1rem; border: 1px dashed var(--border); border-radius: var(--radius); margin: .5rem 0 1rem; }
.chip { display: inline-flex; align-items: center; gap: .3rem; background: var(--accent-dim); color: var(--accent); border-radius: 999px; padding: .2rem .65rem; font-size: .78rem; font-weight: 600; }
.check-item { display: flex; align-items: center; gap: .7rem; padding: .7rem 0; border-bottom: 1px solid var(--border); }
.check-item:last-child { border-bottom: none; }
.check-item input[type="checkbox"] { width: 22px; height: 22px; min-height: 22px; accent-color: var(--accent2); flex-shrink: 0; }
.check-item.done span { text-decoration: line-through; color: var(--muted); }
.actions { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .6rem; }
.actions button { min-height: 40px; padding: .4rem .75rem; font-size: .85rem; }
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--bg2);
  border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(5, 1fr);
  padding: .35rem .25rem calc(.35rem + env(safe-area-inset-bottom));
  max-width: 720px; margin: 0 auto;
}
.nav button {
  background: transparent; color: var(--muted); border-radius: 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: .15rem; min-height: 56px; padding: .35rem .2rem; font-size: .68rem; font-weight: 600;
}
.nav button .ico { font-size: 1.25rem; line-height: 1; }
.nav button.active { color: var(--accent); background: var(--accent-dim); }
.modal-backdrop { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; padding: 1rem; }
.modal-backdrop.center { align-items: center; }
.modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 18px 18px 14px 14px; width: min(480px, 100%); max-height: 90vh; overflow: auto; padding: 1.15rem; box-shadow: var(--shadow); }
.modal h3 { margin: 0 0 1rem; }
.modal-actions { display: flex; gap: .5rem; justify-content: flex-end; margin-top: 1rem; flex-wrap: wrap; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .85rem 0; border-bottom: 1px solid var(--border); }
.toggle:last-child { border-bottom: none; }
.switch { position: relative; width: 52px; height: 30px; flex-shrink: 0; background: var(--border); border-radius: 999px; transition: background .2s; }
.switch.on { background: var(--accent2); }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch.on::after { transform: translateX(22px); }
#alz-root { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; flex-direction: column; padding: 1.25rem 1.25rem calc(1.25rem + env(safe-area-inset-bottom)); overflow: auto; }
.alz-clock { text-align: center; margin: 1rem 0 .5rem; }
.alz-clock .time { font-size: clamp(3.5rem, 16vw, 6rem); font-weight: 700; letter-spacing: -.03em; line-height: 1; color: var(--accent); }
.alz-clock .date { font-size: clamp(1.15rem, 4.5vw, 1.6rem); color: var(--text); margin-top: .5rem; font-weight: 600; text-transform: capitalize; }
.alz-tip { text-align: center; background: var(--accent-dim); color: var(--accent); border-radius: 16px; padding: 1rem 1.2rem; font-size: 1.15rem; font-weight: 600; margin: .75rem 0 1.25rem; }
.alz-pills .pill-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.1rem; margin-bottom: .75rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.alz-pills .pill-card strong { font-size: 1.25rem; }
.alz-pills button { min-height: 56px; font-size: 1.05rem; padding: .75rem 1.1rem; background: var(--ok); color: #064E3B; flex-shrink: 0; }
[data-theme="light"] .alz-pills button { color: #fff; background: #059669; }
.alz-photos { display: flex; gap: .75rem; overflow-x: auto; padding: .5rem 0 1rem; scroll-snap-type: x mandatory; }
.alz-photos img, .alz-photos .ph { width: 120px; height: 120px; object-fit: cover; border-radius: 16px; scroll-snap-align: start; flex-shrink: 0; background: var(--bg3); border: 1px solid var(--border); }
.alz-photos .ph { display: grid; place-items: center; color: var(--muted); font-size: .85rem; text-align: center; padding: .5rem; }
.alz-gear { position: absolute; top: .75rem; right: .75rem; width: 44px; height: 44px; min-height: 44px; border-radius: 50%; opacity: .55; font-size: 1.1rem; background: var(--bg3); color: var(--muted); }
.alz-empty { text-align: center; color: var(--muted); padding: 1rem; font-size: 1.05rem; }
.pin-dots { display: flex; gap: .6rem; justify-content: center; margin: 1rem 0; }
.pin-dots span { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent); background: transparent; }
.pin-dots span.filled { background: var(--accent); }
.pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: .55rem; max-width: 280px; margin: 0 auto; }
.pin-pad button { min-height: 58px; font-size: 1.35rem; background: var(--bg3); color: var(--text); }
.toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--text); color: var(--bg); z-index: 90; padding: .7rem 1.1rem; border-radius: 999px; font-size: .9rem; font-weight: 600; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; }
.toast.show { opacity: 1; }
.welcome { text-align: center; padding: 1.5rem 1rem 1rem; }
.welcome h2 { margin: 0 0 .5rem; font-size: 1.4rem; }
.welcome p { color: var(--muted); margin: 0 0 1.25rem; }
@media (min-width: 640px) { .modal-backdrop { align-items: center; } .modal { border-radius: 18px; } }
</style>
</head>

<body>
<div id="app">
  <header class="app-header" id="main-header">
    <div class="brand-mark" aria-hidden="true">Lv</div>
    <div class="brand-text">
      <h1>Asistente offline</h1>
      <p id="home-label">Les vencimos · privado en este aparato</p>
    </div>
    <div class="header-actions">
      <button type="button" class="icon ghost" id="btn-mas" aria-label="Más opciones" title="Más">⋯</button>
    </div>
  </header>
  <main id="main">
    <section class="panel active" id="panel-hogar" data-panel="hogar"></section>
    <section class="panel" id="panel-salud" data-panel="salud"></section>
    <section class="panel" id="panel-agenda" data-panel="agenda"></section>
    <section class="panel" id="panel-ajustes" data-panel="ajustes"></section>
    <section class="panel" id="panel-mas" data-panel="mas"></section>
  </main>
  <nav class="nav" id="main-nav" aria-label="Navegación principal">
    <button type="button" data-nav="hogar" class="active" aria-current="page"><span class="ico" aria-hidden="true">🏠</span>Hogar</button>
    <button type="button" data-nav="salud"><span class="ico" aria-hidden="true">💊</span>Salud</button>
    <button type="button" data-nav="agenda"><span class="ico" aria-hidden="true">📅</span>Agenda</button>
    <button type="button" data-nav="ajustes"><span class="ico" aria-hidden="true">⚙️</span>Ajustes</button>
    <button type="button" data-nav="mas"><span class="ico" aria-hidden="true">✦</span>Más</button>
  </nav>
</div>
<div id="modal-root"></div>
<div id="alz-mount"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  'use strict';
  const STORAGE_KEY = 'lesvencimos-asistente-v1';
  const WEEKDAYS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const TIPS = {
    manana: 'Buenos días. Un vaso de agua y desayuno con calma.',
    mediodia: 'Es mediodía. Comida ligera y un poco de descanso.',
    tarde: 'Buena tarde. Si puedes, da un paseo corto.',
    noche: 'Buenas noches. Relájate y prepárate para dormir.'
  };

  function uid() {
    return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
  }

  function defaultState() {
    return {
      version: 1,
      settings: {
        homeName: '',
        theme: 'dark',
        alzheimerMode: false,
        carePin: '',
        onboarded: false
      },
      recipes: [],
      pantry: [],
      shopping: [],
      meds: [],
      doctors: [],
      reports: [],
      appointments: [],
      documents: [],
      passwords: [],
      photos: [],
      radio: [],
      takenLog: {}
    };
  }

  let state = load();
  let currentPanel = 'hogar';
  let hogarSub = 'recetas';
  let saludSub = 'medicamentos';
  let masSub = 'radio';
  let pinBuffer = '';
  let pinCallback = null;
  let clockTimer = null;

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      const data = JSON.parse(raw);
      const base = defaultState();
      return {
        ...base,
        ...data,
        settings: { ...base.settings, ...(data.settings || {}) },
        recipes: Array.isArray(data.recipes) ? data.recipes : [],
        pantry: Array.isArray(data.pantry) ? data.pantry : [],
        shopping: Array.isArray(data.shopping) ? data.shopping : [],
        meds: Array.isArray(data.meds) ? data.meds : [],
        doctors: Array.isArray(data.doctors) ? data.doctors : [],
        reports: Array.isArray(data.reports) ? data.reports : [],
        appointments: Array.isArray(data.appointments) ? data.appointments : [],
        documents: Array.isArray(data.documents) ? data.documents : [],
        passwords: Array.isArray(data.passwords) ? data.passwords : [],
        photos: Array.isArray(data.photos) ? data.photos : [],
        radio: Array.isArray(data.radio) ? data.radio : [],
        takenLog: data.takenLog && typeof data.takenLog === 'object' ? data.takenLog : {}
      };
    } catch (e) {
      return defaultState();
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      toast('No se pudo guardar (almacenamiento lleno o bloqueado).');
    }
  }

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function applyTheme() {
    document.documentElement.setAttribute('data-theme', state.settings.theme === 'light' ? 'light' : 'dark');
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', state.settings.theme === 'light' ? '#F4F6FB' : '#0B1220');
  }

  function updateHomeLabel() {
    const name = (state.settings.homeName || '').trim();
    document.getElementById('home-label').textContent = name
      ? name + ' · privado en este aparato'
      : 'Les vencimos · privado en este aparato';
  }

  function timeBand(d) {
    const h = d.getHours();
    if (h >= 5 && h < 12) return 'manana';
    if (h >= 12 && h < 16) return 'mediodia';
    if (h >= 16 && h < 21) return 'tarde';
    return 'noche';
  }

  function todayKey(d) {
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function formatDateES(iso) {
    if (!iso) return '';
    const p = iso.split('-');
    if (p.length !== 3) return iso;
    return p[2] + '/' + p[1] + '/' + p[0];
  }

  function openModal(html, opts) {
    const root = document.getElementById('modal-root');
    root.innerHTML = '<div class="modal-backdrop' + (opts && opts.center ? ' center' : '') + '" role="dialog" aria-modal="true"><div class="modal">' + html + '</div></div>';
    root.querySelector('.modal-backdrop').addEventListener('click', function (e) {
      if (e.target === e.currentTarget && !(opts && opts.force)) closeModal();
    });
  }

  function closeModal() {
    document.getElementById('modal-root').innerHTML = '';
    pinBuffer = '';
    pinCallback = null;
  }

  function dotsHtml() {
    const n = Math.max(4, Math.min(6, (state.settings.carePin || '0000').length || 4));
    let h = '';
    for (let i = 0; i < n; i++) h += '<span class="' + (i < pinBuffer.length ? 'filled' : '') + '"></span>';
    return h;
  }

  function askPin(onOk, title) {
    pinBuffer = '';
    pinCallback = onOk;
    openModal(
      '<h3>' + esc(title || 'PIN de cuidados') + '</h3>' +
      '<p style="color:var(--muted);margin:0;text-align:center;font-size:.9rem">Introduce el PIN (4–6 dígitos)</p>' +
      '<div class="pin-dots" id="pin-dots">' + dotsHtml() + '</div>' +
      '<div class="pin-pad" id="pin-pad">' +
        [1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(function (k) {
          if (k === '') return '<span></span>';
          return '<button type="button" data-k="' + k + '">' + k + '</button>';
        }).join('') +
      '</div>' +
      '<div class="modal-actions"><button type="button" class="ghost" id="pin-cancel">Cancelar</button></div>',
      { center: true, force: true }
    );
    document.getElementById('pin-cancel').onclick = closeModal;
    document.getElementById('pin-pad').onclick = function (e) {
      const btn = e.target.closest('button[data-k]');
      if (!btn) return;
      const k = btn.getAttribute('data-k');
      if (k === '⌫') pinBuffer = pinBuffer.slice(0, -1);
      else if (pinBuffer.length < 6) pinBuffer += k;
      document.getElementById('pin-dots').innerHTML = dotsHtml();
      if (pinBuffer.length >= 4 && state.settings.carePin) {
        if (pinBuffer === state.settings.carePin) {
          const cb = pinCallback;
          closeModal();
          if (cb) cb();
        } else if (pinBuffer.length >= state.settings.carePin.length) {
          toast('PIN incorrecto');
          pinBuffer = '';
          document.getElementById('pin-dots').innerHTML = dotsHtml();
        }
      }
    };
  }

  function confirmDialog(msg, onYes) {
    openModal(
      '<h3>Confirmar</h3><p style="margin:0;color:var(--muted)">' + esc(msg) + '</p>' +
      '<div class="modal-actions">' +
        '<button type="button" class="ghost" id="c-no">Cancelar</button>' +
        '<button type="button" class="danger" id="c-yes">Sí, continuar</button>' +
      '</div>',
      { center: true }
    );
    document.getElementById('c-no').onclick = closeModal;
    document.getElementById('c-yes').onclick = function () { closeModal(); onYes(); };
  }

  function setPanel(name) {
    currentPanel = name;
    document.querySelectorAll('.panel').forEach(function (p) {
      p.classList.toggle('active', p.getAttribute('data-panel') === name);
    });
    document.querySelectorAll('#main-nav button').forEach(function (b) {
      const on = b.getAttribute('data-nav') === name;
      b.classList.toggle('active', on);
      if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    render();
  }

  document.getElementById('main-nav').addEventListener('click', function (e) {
    const b = e.target.closest('button[data-nav]');
    if (b) setPanel(b.getAttribute('data-nav'));
  });
  document.getElementById('btn-mas').addEventListener('click', function () { setPanel('mas'); });

  function emptyMsg(text) {
    return '<div class="empty">' + esc(text) + '</div>';
  }

  function subBtn(group, id, label) {
    const cur = group === 'hogar' ? hogarSub : group === 'salud' ? saludSub : masSub;
    return '<button type="button" role="tab" data-sub="' + id + '" class="' + (cur === id ? 'active' : '') + '">' + label + '</button>';
  }

  function bindSub(group) {
    const root = document.getElementById('panel-' + group);
    root.querySelectorAll('[data-sub]').forEach(function (b) {
      b.onclick = function () {
        const id = b.getAttribute('data-sub');
        if (group === 'hogar') hogarSub = id;
        else if (group === 'salud') saludSub = id;
        else masSub = id;
        render();
      };
    });
  }
  function renderHogar() {
    const el = document.getElementById('panel-hogar');
    el.innerHTML =
      '<div class="subtabs" role="tablist">' +
        subBtn('hogar', 'recetas', 'Recetas') +
        subBtn('hogar', 'despensa', 'Alimentos') +
        subBtn('hogar', 'compra', 'Lista de la compra') +
      '</div><div id="hogar-body"></div>';
    bindSub('hogar');
    const body = document.getElementById('hogar-body');
    if (hogarSub === 'recetas') {
      body.innerHTML =
        '<div class="section-title"><h2>Recetas</h2><button type="button" class="primary" id="add-recipe">＋ Añadir</button></div>' +
        (state.recipes.length ? state.recipes.map(function (r) {
          return '<article class="card" data-id="' + esc(r.id) + '">' +
            '<h3>' + esc(r.title) + '</h3>' +
            (r.ingredients ? '<p class="meta">Ingredientes: ' + esc(r.ingredients) + '</p>' : '') +
            (r.steps ? '<p style="margin:.5rem 0 0;white-space:pre-wrap">' + esc(r.steps) + '</p>' : '') +
            '<div class="actions"><button type="button" data-edit-recipe="' + esc(r.id) + '">Editar</button>' +
            '<button type="button" class="danger" data-del-recipe="' + esc(r.id) + '">Borrar</button></div></article>';

  function dueMeds(now) {
    const band = timeBand(now);
    const ranges = { manana: [5, 12], mediodia: [12, 16], tarde: [16, 21], noche: [21, 29] };
    const lo = ranges[band][0], hi = ranges[band][1];
    const day = todayKey(now);
    const due = [];
    state.meds.forEach(function (m) {
      (m.times || []).forEach(function (t) {
        const parts = t.split(':');
        if (parts.length < 2) return;
        let h = parseInt(parts[0], 10);
        if (isNaN(h)) return;
        let hCmp = h;
        if (band === 'noche' && h < 5) hCmp = h + 24;
        if (hCmp >= lo && hCmp < hi) {
          const key = day + '|' + m.id + '|' + t;
          due.push({ med: m, time: t, key: key, taken: !!state.takenLog[key] });
        }
      });
    });
    return due;
  }

    document.getElementById('alz-mount').innerHTML = '';

  }

  function renderAlzheimerClock() {
    const timeEl = document.getElementById('alz-time');
    const dateEl = document.getElementById('alz-date');
    if (!timeEl || !dateEl) return;
    const now = new Date();
    timeEl.textContent = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    dateEl.textContent = WEEKDAYS[now.getDay()] + ', ' + now.getDate() + ' de ' + MONTHS[now.getMonth()];
    const tip = document.getElementById('alz-tip');
    if (tip) tip.textContent = TIPS[timeBand(now)];
  }

  function render() {
    updateHomeLabel();
    if (currentPanel === 'hogar') renderHogar();
    else if (currentPanel === 'salud') renderSalud();
    else if (currentPanel === 'agenda') renderAgenda();
    else if (currentPanel === 'ajustes') renderAjustes();
    else if (currentPanel === 'mas') renderMas();
  }

  applyTheme();
  updateHomeLabel();
  render();
  maybeOnboard();
  if (state.settings.alzheimerMode) enterAlzheimer();
})();
</script>
</body>
