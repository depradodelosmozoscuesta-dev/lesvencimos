 un reloj de arena: avisa de que algo espera.`,`Durante la guerra se usaba para todo. Por eso parece que vale para todo. No vale para la luz.`,`Un rollo, sí. Un cuadro eléctrico, no.`),U(`herramientas`,`Pintura y gotera`,`🎨`,`La gotera se repara arriba. Pintar el techo, abajo, es un disfraz.`,`Una mancha de humedad: se busca el agua (tejado, baño de arriba, ventana). Se deja secar. Luego se pinta con algo para humedad, si ya no entra agua. Pintar encima del agua es papel de regalo.`,[`Cubo bajo la gotera, ya. Luego el origen.`,`Pintura al agua, ventana abierta.`,`El vecino de arriba: una conversación, no un golpe de palo.`],`El agua es terca. La pintura, no.`,`El gotelé escondía pecados. Los techos lisos los confiesan. Mejor así.`,`Cubo. Origen. Secar. Pintar, al final.`),U(`herramientas`,`Cuándo se llama`,`👷`,`Luz, gas, carga, altura, agua a presión.`,`Cuadro eléctrico que salta y huele. Olor a gas. Un muro de carga. Subirse a un tejado. Calentador. Tele gorda. Esos no son «a ver si puedo». Un manitas de confianza o el servicio de la compañía. El orgullo es un yeso caro.`,[`Un vecino habilidoso: se paga o se invita, no se usa.`,`Presupuesto escrito.`,`El seguro del hogar a veces cubre. Se pregunta antes de romper.`],`Hay un valor en no saber. El de no romperse.`,`Los gremios existen porque la casa es un animal de mil oficios.`,`Lista en el cajón: electricista, fontanero, el de la caldera. Con número.`),U(`herramientas`,`El cuadro eléctrico`,`⚡`,`Se baja. No se investiga con un cuchillo.`,`Si salta, se baja todo, se sube el general, se suben uno a uno hasta que salta el culpable. Ese aparato se desenchufa. Si huele o chispea, se deja abajo y se llama. Linterna. Pies secos.`,[`Etiqueta los pequeños: cocina, lavadora, luces.`,`Un diferencial que salta a menudo: electricista, no un palo.`,`Niños: el cuadro no es un juego.`],`El cuadro es un portero, no un enemigo. Te corta para que no te corte a ti.`,`Las casas de los 60 tenían plomos de porcelana. El gesto de «se ha ido el plomo» es el mismo.`,`Linterna al lado. Y las manos secas.`),U(`herramientas`,`Gotera del grifo`,`💧`,`Una junta. O un fontanero. El cierra-paso, primero.`,`Antes de desmontar, la llave de paso del agua (bajo el fregadero o la general). Un trapo. A veces es el aireador de la boca (se desenrosca) lleno de cal: vinagre. Si el eje chorrea, ya es junta o cartucho. No se fuerza un caño de plástico.`,[`Llave de paso: mírala hoy, antes de que chorree.`,`Cal: vinagre, no lejía.`,`Goteo de un día: cubo. De una semana: agua en la factura y óxido.`],`Un goteo es un reloj que cobra en el recibo.`,`El gota a gota llenó cisternas y nervios. El aireador es un invento humilde que se obstruye de cal.`,`Cierra-paso. Vinagre en la boquilla. Si sigue, número del fontanero.`),U(`cuentas`,`El cambio en la tienda`,`💶`,`Se mira el ticket. Se cuenta despacio. No hay prisa en la cola que merezca un error.`,`Si pagas 10 y son 7,60, el cambio es 2,40. Cuenta las monedas en la mano, no en el bolsillo. El ticket se mira: a veces hay una línea de más. «Déjelo, total» es como se regalan dos euros todos los martes.`,[`Un euro son 100 céntimos. 50 céntimos son medio euro.`,`La tarjeta: el número de la pantalla, antes del PIN.`,`Redondeos «por la hucha»: se pide, no se supone.`],`La vergüenza de contar es más barata que la de no contar.`,`El dinero decimal llegó con la peseta moderna y el euro. Antes había reales y cálculos de feria.`,`Ticket al bolsillo. Un minuto en la puerta, si hace falta.`),U(`cuentas`,`Doblar una receta`,`🍳`,`Todo × 2. El tiempo, no siempre.`,`Huevos, harina, leche: el doble. La sal, casi. El tiempo de horno, no el doble: un poco más, y se mira. La sartén no cabe el doble: se hace en dos tandas. Un tercio: se divide, no se «echa a ojo» si es un bizcocho.`,[`3 huevos × 2 = 6. 100 g × 2 = 200 g.`,`La pizca no se dobla bien. Se prueba.`,`Un papel: la receta original a un lado, la nueva al otro.`],`El horno no entiende de prisas. Entiende de temperatura.`,`Las recetas de cuarterón y de «una copa» eran de un mundo sin báscula. Ahora hay báscula. Se usa.`,`Papel y lápiz. El doble de ingredientes. El tiempo, con el ojo.`),U(`cuentas`,`La hora y media hora`,`🕰️`,`De 10:50 a 11:20 hay media hora. No diez minutos.`,`60 minutos son una hora. 30, media. 15, un cuarto. Si la pasta son 11 minutos, no es «un rato». El reloj de Casa o el de la cocina. Restar horas: de 9:10 a 10:00 hay 50 minutos, no 90.`,[`Cita a las 10:00, salida de casa 9:20 si hay 30 de camino y 10 de margen.`,`El micro a 2 minutos no es 2:00 de reloj: es un 2:00 que se acaba.`,`Un cuarto de hora son 15, no 25.`],`«Un momento» no es una unidad. Un minuto, sí.`,`Los relojes de estación enseñaron a un país entero. El móvil lo ha vuelto blando.`,`Timer. Y salir con margen, no con un milagro de semáforos.`),U(`cuentas`,`El tanto por ciento, otra vez`,`٪`,`El 10 % se corre la coma. El 50 % es la mitad.`,`10 % de 80 son 8. 50 % de 80 son 40. 25 %, 20. Un 20 % de descuento en 15 € deja 12. Subir un 10 % y luego bajar un 10 % no vuelve al mismo sitio.`,[`IVA 21 %: 100 se vuelven 121. Quitar IVA: dividir por 1,21.`,`Oferta 3×2: pagas 2, te llevas 3. Solo si los ibas a usar.`,`Sal 30 % menos: sigue habiendo sal.`],`El cartel grande es el porcentaje. El pequeño es lo que pagas. Se mira el pequeño.`,`Los mercaderes de Italia pusieron el % para no escribir «de cada ciento».`,`Antes de la caja, un momento con el precio final.`),U(`cuentas`,`La media`,`📊`,`Se suma y se parte. Un pico no es la media.`,`Tensión 12, 13, 18: la media no es 18. Se suman, se parten por 3. El 18 se mira, pero no borra a los otros. Lo mismo una factura de luz de un mes de ola de calor: no es el año.`,[`Tres medidas de tensión, media. El pico del susto, aparte.`,`Gasto del súper: cuatro tickets, se parte por cuatro. Ese es tu martes tipo.`,`Una nota de un nieto de 10 y otra de 5: media 7,5. No un 10.`],`El cerebro se queda con el susto. La media, con la vida.`,`Las medias son de la estadística del XIX. Las abuelas decían «por lo regular». Es lo mismo.`,`Tres números, se parte. Un cuaderno gana a un día malo.`),U(`cuentas`,`Pesar y partir`,`⚖️`,`Medio kilo son 500 g. Un cuarto, 250. Un kilo, 1.000.`,`La báscula del súper cobra por kilo. 200 g de jamón a 20 €/kg son 4 €, no 20. En casa, 250 g de pasta son un plato abundante para dos, más o menos. Un vaso de agua son 200 ml, no un litro.`,[`Litro de agua ≈ kilo. Litro de aceite, un poco menos.`,`Una cucharada sopera de aceite ≈ 10 ml.`,`El «al puño» de arroz: un puño por persona, más o menos, en sopa.`],`El envase grande a veces es más caro por kilo. Se mira el cartelito pequeño.`,`El kilo nació para que un pueblo y el de al lado no pelearan por la libra.`,`Precio por kilo. Báscula en casa, si hay bizcochos.`),U(`cuentas`,`La factura de la luz`,`💡`,`Hay potencia (fija) y consumo (lo que usas). Se puede mirar, no solo pagar.`,`La potencia es lo que pagas por tener tantos aparatos a la vez. El consumo son los kWh. Una lavadora en hora valle, si tu tarifa lo tiene, ahorra. El stand-by suma. Un número de teléfono de la comercializadora está en la factura. El bono social existe, si se cumple.`,[`No se cambia de compañía por una llamada de miedo.`,`Una bombilla LED, de verdad, baja el recibo.`,`El horno y el termo: los grandes. El cargador, no.`],`El miedo a «se la vamos a cortar hoy» es un clásico de estafa. Se cuelga y se llama al número de la factura.`,`El contador digital puede leerse a distancia. Por eso a veces ya no viene el del salto.`,`Factura en la carpeta. Cualquier oferta, contra ese papel, no contra el susto.`),U(`cuentas`,`El banco, sin vergüenza`,`🏦`,`Una pregunta en ventanilla vale más que un menú de 12 teclas.`,`Se puede pedir que lo escriban. Se puede ir acompañado. Una transferencia: nombre, IBAN, cantidad, un euro de prueba si es la primera vez a esa cuenta. El cajero: se tapa el PIN. El SMS del banco no se lee a quien llama.`,[`Comisiones: se preguntan. A veces hay cuenta sin ellas, si se cobra la pensión ahí.`,`El extracto de papel se puede pedir.`,`Nadie en la cola tiene derecho a tu prisa.`],`El banco es un servicio. Tú no eres un estorbo. Eres el cliente.`,`Las cajas de ahorros eran de pueblo y de explicación. Queda gente que explica. Se busca.`,`Acompañado, si quieres. Papel. Y el PIN, cubierto.`),U(`cuentas`,`Propinas y redondeos`,`🪙`,`Si se da, se da a sabiendas. No por vergüenza.`,`Un café: unas monedas si quieres. Un restaurante: un 5–10 % si el servicio no iba incluido. El redondeo a favor de una causa: se lee. El «propina sugerida» de una pantalla se puede ignorar.`,[`Incluido el servicio: mira el ticket.`,`Un té céntimos de más todos los días son euros al mes.`,`La propina es un gracias, no un peaje.`],`La pantalla que pide un 20 % en un café no es la ley. Es un empujón.`,`En España la propina ha sido siempre un gesto, no un sueldo. Conviene que siga siéndolo a conciencia, no a empujón.`,`Ticket. Si das, das. Si no, no. Las dos valen.`),U(`cuentas`,`La pensión y el calendario`,`📅`,`El ingreso tiene fecha. Los recibos, otra. Un colchón de unos días.`,`Saber qué día cae la pensión y qué días se van la luz, el agua, la comunidad. Un margen. Si falta, se habla pronto (banco, servicios sociales, familia), no el día 28. Un papel con los recibos fijos, sumados. Ese es tu alquiler de vida.`,[`Domiciliar evita olvidos y a veces un recargo.`,`Un recibo raro se reclama. No se paga «porque saldrá».`,`Nadie de una llamada fría necesita tu número de cuenta para «regularizar la pensión».`],`El colchón de unos días no es lujo. Es sueño.`,`Las pensiones se pagaron en ventanilla y en sobre. El ingreso silencioso ha hecho más fácil el olvido y la estafa.`,`Un papel: qué entra, qué sale, qué día. En el cajón de los documentos.`),U(`cocina`,`El arroz, sin pegote`,`🍚`,`Un vaso de arroz, dos de agua, en muchos arroces de cazuela. La paella, menos.`,`Se enjuaga si quieres menos almidón. Sofrito. El grano se oye cuando está hecho: no está duro ni es papilla. Reposo tapado cinco minutos. El de paella se mide más justo, para el socarrat.`,[`Arroz bomba para paella. El largo, para guarnición.`,`No se remueve la paella como un risotto.`,`Sal en el caldo, no después.`],`El arroz se hincha. Por eso parece que «has puesto poco» al principio.`,`Llegó con los árabes. Se quedó en la Albufera y en cada domingo.`,`Vaso y dos, para el de cuchara. El de paella, receta aparte.`),U(`cocina`,`La legumbre y la noche`,`🫘`,`Remojo. Espuma fuera. Sal al final, si tu casa lo hace así.`,`Garbanzo y alubia: agua de la noche. Lenteja, a menudo no hace falta. Se cuece despacio. La sal al principio o al final es pelea de casas: lo que no se discute es el tiempo. Un laurel. No se añaden ácidos (tomate, vinagre) muy pronto si se ponen duras.`,[`El caldo de la legumbre es comida, no se tira.`,`Bote de cristal: se aclara. El de lata, también.`,`Un trozo de alga kombu o un chorro de aceite, según casa.`],`La espuma no es suciedad grave. Es albúmina. Se quita por limpio, no por miedo.`,`El cocido es un mapa: cada provincia le pone lo que tiene.`,`Remojo. Fuego lento. Paciencia. El bote, si no hay tiempo.`),U(`cocina`,`Freír sin sustos`,`🍳`,`Aceite caliente, no humeante. Lo húmedo salta.`,`Se seca el alimento. Un trozo de pan para ver si burbujea. No se llena la sartén. Tapa a mano por si salta. Agua en aceite ardiendo es una mala idea: se tapa y se apaga el fuego, no se riega.`,[`El aceite reutilizado, unas veces, no eternamente. Si amarga o está oscuro, se va.`,`Termómetro no hace falta: el pan y el oído.`,`Nunca el cubo de basura de plástico con aceite líquido a litros: se guarda y al punto limpio.`],`El fuego se apaga sin oxígeno. La tapa es un extinguidor.`,`Las freidoras de los 80 prometieron milagros. La sartén sigue mandando.`,`Tapa a mano. Y un tarro para el aceite usado.`),U(`cocina`,`El microondas`,`📡`,`Metal, no. Huevo cerrado, no. Un vaso de agua, sí.`,`El metal hace chispas. El huevo entero, explota. Un plato hondo, tapado con otro, calienta sin pintar el techo. Se remueve. El borde quema y el centro está frío: por eso se espera un momento y se mueve. El biberón y el tupper de un plástico raro: se mira si son de micro.`,[`El papel de aluminio, fuera.`,`Un poco de agua con el pan de ayer lo revive.`,`Nunca un tupper vacío a calentar: se maltrata el aparato.`],`El micro agita el agua de la comida. Por eso lo seco se queda de piedra y lo húmedo hierve.`,`Nació de un radar y un chocolate derretido, según el mito del ingeniero Spencer. El mito es mejor que el manual.`,`Plato hondo, sin metal, un minuto, se mira, se sigue.`),U(`casa`,`La lavadora`,`👕`,`No se atesta. Se mira el bolsillo. El filtro, a veces.`,`Los pañuelos de papel y las monedas salen caros. Media carga de toallas, no un bloque. El cajetín de jabón, poco. El filtro de abajo, de vez en cuando, con una toalla debajo. 30 o 40 grados bastan para lo de cada día. 90, para lo de verdad sucio.`,[`Toallas con toallas. Ropa interior, bolsa si se escapa.`,`El suavizante no es obligatorio.`,`Si huele a cerrado: un ciclo de limpia-máquina o un vaso de vinagre, y la puerta abierta al acabar.`],`El olor a cerrado es bacterias, no «falta de suavizante».`,`Las lavadoras domésticas se popularizaron aquí en los 60. Antes, el río y el gato.`,`Bolsillos. Puerta abierta al acabar. Filtro cada varios meses.`),U(`casa`,`La caldera y el calentador`,`🔥`,`Presión en el verde. Sin llama, no se insiste.`,`Un relojito suele marcar 1–1,5. Si está a cero, a veces hay que llenar (una llave de llenado, con el manual o un técnico). Si echa error y no hay agua caliente, no se pulsa cincuenta veces. Se anota el error y se llama. El gas, con revisión.`,[`El agua caliente no sale: mira el gas, el error, el interruptor.`,`Un ruido de kettling: hay cal. Técnico.`,`Nunca se tapa la entrada de aire del calentador.`],`La caldera es de las pocas cosas de casa que mezclan agua, gas y electricidad. Por eso no es un destornillador.`,`El termo eléctrico es más simple y más lento. La caldera, más viva y más quejosa.`,`Manual en un cajón. Número del servicio. Presión, un vistazo de vez en cuando.`),U(`casa`,`Plantas de patio`,`🪴`,`Poca agua, más veces no. Luz según la planta.`,`El dedo en la tierra: si está húmeda, no se riega. El platito de abajo no es un estanque. Un geranio quiere sol. Un poto, menos. Las raíces en agua estancada se ahogan. Abono, poco, en temporada.`,[`Vacía el platito a los diez minutos.`,`Invierno: casi no se riega.`,`Hojas con polvo: un paño. Respiran.`],`Matar una planta es, casi siempre, de amor: agua de más.`,`El patio mediterráneo es una escuela de poco riego y mucho sol.`,`Dedo en la tierra. Y un platito seco.`),U(`espana`,`El DNI y el padrón`,`🪪`,`El DNI es quién eres. El padrón, dónde vives.`,`El padrón se hace en el ayuntamiento y sirve para el médico, el voto, las ayudas. Si te mudas, se actualiza. El DNI caduca: la cita, en la policía, con foto si te la piden. No se envían datos de DNI por un enlace.`,[`Cita previa, casi siempre.`,`Fotocopia en el cajón.`,`El padrón colectivo: cada uno, si se independiza, se empadrona.`],`Sin padrón, el sistema te vuelve invisible. No es un capricho de ventanilla.`,`El padrón viene de contar vecinos. El DNI, de la posguerra. Juntos, te hacen ciudadano de un sitio.`,`Fecha de caducidad del DNI, en la agenda. Padrón, si has cambiado de casa.`),U(`espana`,`La farmacia de guardia`,`✚`,`Hay una. El papel está en la puerta de la tuya, o en internet, o 112 si es grave.`,`Cuando la tuya cierra, un cartel indica la de guardia. También se pregunta en el 112 si es una urgencia. No se espera a las nueve de la mañana con un dolor de verdad.`,[`Foto al cartel, por si acaso.`,`La de 24 horas, en ciudades, a veces es fija.`,`Un analgésico de casa, de tu dosis, evita algunas noches. No todas.`],`La cruz verde es un faro. La de guardia es el faro de noche.`,`El turno de guardia es tan viejo como el oficio. El cartel de la puerta, también.`,`Mira hoy el cartel de tu farmacia. Por si esta noche.`),U(`palabras`,`Tú, usted y vosotros`,`🗣️`,`Usted no es frío. Es un respeto que se puede pedir y se puede soltar.`,`Usted al médico, si quieres. Tú a un nieto. Vosotros, en España, para un grupo. En América, a menudo ustedes. No es una falta. Es otro mapa. Si alguien te tutea y no te gusta, se dice: «prefiero de usted». Se puede.`,[`Una carta formal: usted.`,`Un bar de pueblo: según el bar.`,`Los nietos: tú. Los médicos: como te dejen más claro.`],`El respeto no está solo en el pronombre. Está en no gritar y en no tratar de sordo.`,`El usted viene de «vuestra merced». Se desgastó hasta caber en dos sílabas.`,`Como te sientes mejor. Y lo dices, si hace falta.`),U(`palabras`,`IBAN, PIN, SMS, PDF`,`🔤`,`Siglas. Se pueden decir en cristiano.`,`IBAN: el número largo de la cuenta. PIN: la clave corta de la tarjeta o del móvil. SMS: el recado de texto. PDF: un papel en la pantalla que no se descuadra. WiFi: la red de casa. LED: la bombilla que no quema tanto.`,[`El IBAN se copia, no se inventa.`,`El PIN no se escribe en la tarjeta.`,`Un PDF se abre, se puede imprimir, no hay que «instalar» nada raro.`],`Las siglas intimidan porque parecen un club. Son abreviaturas de vago.`,`El XX se llenó de siglas (RENFE, DNI, IVA). El XXI, de estas otras.`,`Pregunta: «¿eso qué es, en cristiano?». Se puede.`),U(`naturaleza`,`El agua del grifo`,`🚰`,`En la mayor parte de España se puede beber. Si sabe a cloro, un rato en jarra.`,`El ayuntamiento la trata. Un sabor a cloro se va en una jarra abierta media hora. Si hay aviso de no beber, se obedece: eso sí es serio. Los filtros, si se ponen, se cambian: un filtro sucio es peor que el grifo.`,[`Nunca el agua del pozo de una casa vieja sin analizar.`,`El agua del váter y la de beber no se mezclan: por eso hay depósitos y normas.`,`En un pueblo con olor a tierra, se pregunta en el bar. El bar sabe.`],`El cloro no es veneno de novela. Es el motivo por el que no tenemos cólera cada mes.`,`Las traídas de agua del XIX y XX bajaron la muerte infantil más que muchos jarabes.`,`Jarra en la nevera, si el cloro te molesta. Y caso a los avisos de verdad.`),U(`naturaleza`,`El sol y la piel`,`☀️`,`Cinco minutos no son una tarde. A las tres, sombra.`,`La vitamina D sale de un rato de sol, no de un asado. Gorra, sombra, agua. Un lunar que cambia, el médico. Las nubes no anulan del todo. El de las cuatro de la tarde en julio, tampoco.`,[`Cuello y orejas, que se olvidan.`,`Medicinas que pegan con el sol: se pregunta.`,`Los nietos: camiseta. El entusiasmo no es un factor solar.`],`El sol de aquí no es el de un anuncio de yogur. Es el de siempre, y quema.`,`El bronceado de moda es del siglo XX. Antes, la piel clara era de quien no iba a la era. Ahora sabemos más: el sol, a dosis.`,`Gorra. Sombra a mediodía. Un lunar raro, consulta.`)],oo=[{id:`despiste-sistema`,titulo:`Un sistema para cuando la cabeza no alcanza`,dibujo:`🧭`,sirve:`No se trata de recordar más. Se trata de fiar menos de la memoria.`,partes:[{t:`Sitios, no recuerdos`,p:`Llaves, gafas, pastillas, papeles: cada uno un nido. La memoria es un mal cajón. El cajón es un buen cajón.`},{t:`Listas a la vista`,p:`Nevera, puerta, agenda de Casa. Lo escrito no se ofende si no lo usas un día. Lo recordado, sí se esfuma.`},{t:`Una persona`,p:`Alguien que sepa si no has salido, si hay cita, si el módem parpadea en rojo. No es dependencia. Es un sistema de dos.`}],ejemplos:[`Cinco toques en la puerta: fuego, llaves, móvil, monedero, gafas.`,`Pastillero o Casa, no «creo que la tomé».`,`Un papel en el monedero con tu calle y un teléfono.`],curiosidad:`Los aviones no se estrellan menos porque los pilotos recuerden más: se estrellan menos porque leen una lista.`,historia:`Las listas de comprobación nacen en la aviación cuando los aviones se volvieron demasiado buenos para fiarse del talento suelto. La casa, a cierta edad, también.`,enCasa:`Hoy un nido para las llaves. Mañana la lista de la puerta. Pasado, un número en grande.`},{id:`caja-luces`,titulo:`La cajita de las luces`,dibujo:`📡`,sirve:`Entender el módem es dejar de tenerle miedo.`,partes:[{t:`Qué hace`,p:`Reparte internet. Sin él, no hay wifi de casa. El móvil puede seguir con datos. El fijo de fibra, a menudo no.`},{t:`Qué se puede hacer`,p:`Mirar luces. Desenchufar 20 segundos. Enchufar. Esperar tres minutos. Llamar a la compañía con el número de la factura. Apagarlo de noche si te da la gana.`},{t:`Qué no`,p:`Abrirlo. Pagar a un desconocido. Dictar el PIN del banco a quien llama «por la avería».`}],ejemplos:[`Foto de las luces cuando va bien y de la pegatina de la clave.`,`Enchufe con interruptor, para no pelearte con el cable.`,`Si el vecino también está sin red, es la calle, no tu salón.`],curiosidad:`El aparato parece un adorno porque ya no chilla. Sigue siendo una puerta. Las puertas se pueden cerrar.`,historia:`Del chillido del 56k a la fibra silenciosa ha pasado una generación. El silencio nos ha hecho más torpes: no oímos el fallo.`,enCasa:`Mira ahora: luces, pegatina, enchufe. Tres minutos. Ya sabes más que ayer.`},{id:`mando-unico`,titulo:`El mando, la fuente y la calma`,dibujo:`📺`,sirve:`La tele no se ha roto. Casi nunca. Se ha perdido el camino.`,partes:[{t:`Dos mandos`,p:`Uno enciende y pone volumen. Otro cambia de canal o de app. Un color en cada uno.`},{t:`La fuente`,p:`HDMI 1, HDMI 2, TDT. «Sin señal» es, tantas veces, la ventana equivocada.`},{t:`Sin internet`,p:`Queda la TDT. El Telediario no se acaba porque se acabe la wifi. Se acaba YouTube.`}],ejemplos:[`Papel detrás del mando: «películas = HDMI 1».`,`Pilas nuevas antes de llamar.`,`Botón Back cuando aparece una tienda de alquiler.`],curiosidad:`El botón OK es un sí. En una tienda de películas, un sí que cobra.`,historia:`Se levantaba uno a cambiar el canal. Luego llegó el mando. Luego llegaron cuatro mandos y un menú en inglés. La calma es volver a dos botones y un papel.`,enCasa:`Etiqueta los mandos. Anota la fuente. Prueba el 888 de subtítulos un día.`},{id:`estafa-prisa`,titulo:`La prisa es el timo`,dibujo:`🔐`,sirve:`Todo lo que apremia a pagar, dictar o abrir, se puede hacer esperar.`,partes:[{t:`El cuento`,p:`Un nieto, una multa, un corte de luz, un premio, un virus. El argumento cambia. La prisa no.`},{t:`La regla`,p:`Cuelgas. Llamas tú al número de siempre (dorso de tarjeta, factura, hijo). Nadie de verdad se ofende por esa precaución.`},{t:`El cuerpo`,p:`El miedo calienta. Siéntate. Un vaso de agua. Luego el teléfono bueno. No el de la llamada.`}],ejemplos:[`El banco no pide el SMS ni el PIN.`,`Hacienda no cobra por Bizum.`,`Un técnico sin cita no entra.`],curiosidad:`Los timadores compran miedo. El miedo se nota en la voz. Por eso hablan rápido.`,historia:`El cuento del estafador es de feria y de carta nigeriana. El teléfono lo ha metido en la cocina, a la hora del café.`,enCasa:`Papel con teléfonos buenos. Y permiso para colgar.`},{id:`casa-cuerpo`,titulo:`La casa que no te tira`,dibujo:`🩹`,sirve:`Más caídas se evitan con luz y calzado que con un milagro.`,partes:[{t:`El suelo`,p:`Alfombras con alas, calcetines, el pasillo a oscuras. El baño, con asidero si hace falta. No es hospital: es oficio.`},{t:`El aire`,p:`Calor de más, frío de más, sin agua. Persianas. Un 20 ºC. Beber sin esperar la sed.`},{t:`El aviso`,p:`Pecho, aire, cara, un lado, golpe de cabeza: 112. El resto, médico de mañana. La duda, 112.`}],ejemplos:[`Luz de noche en el pasillo.`,`Teléfono en la mesilla.`,`Pastillero. No «creo que la tomé».`],curiosidad:`La caída es el accidente más de casa y el menos espectacular. Por eso no se teme, y debería.`,historia:`Los asideros y las luces de paso son de barco y de avión. La casa los merece.`,enCasa:`Una alfombra. Una luz. Un papel con el 112. Esta semana, no «algún día».`},{id:`numeros-sin-miedo`,titulo:`Los números que sí importan`,dibujo:`➗`,sirve:`No hace falta álgebra. Hace falta el ticket, el kilo y el reloj.`,partes:[{t:`Dinero`,p:`El cambio se cuenta. El precio por kilo se mira. El tanto por ciento es de cada cien. El cartel grande miente más que el pequeño.`},{t:`Tiempo`,p:`Un minuto es un minuto. La pasta, el horno, la cita. El margen de salida vale más que el milagro.`},{t:`Cuerpo`,p:`Dos números de tensión, una media de tres días, no un pico de un susto. Las pastillas las mueve el médico.`}],ejemplos:[`200 g a 20 €/kg son 4 €.`,`10 % de 80 son 8.`,`De 10:50 a 11:20 hay media hora.`],curiosidad:`La vergüenza de contar despacio es un impuesto que cobramos nosotros mismos.`,historia:`El kilo, el metro y el tanto por ciento se inventaron para que no hubiera una vara en cada pueblo. Usarlos es un derecho, no un examen.`,enCasa:`Ticket. Precio por kilo. Timer. Cuaderno de la tensión. Nada de esto pide un título.`}],so=[{id:`cocina`,nom:`Cocina`,meta:`Por qué funciona lo que hacemos`,dibujo:`🍳`},{id:`cuerpo`,nom:`Cuerpo`,meta:`Andar, dormir, beber`,dibujo:`🫀`},{id:`casa`,nom:`Casa`,meta:`Frío, humedad, luz`,dibujo:`🏠`},{id:`espana`,nom:`España`,meta:`Lo de siempre, de dónde viene`,dibujo:`🇪🇸`},{id:`palabras`,nom:`Palabras`,meta:`Lo que decimos y no sabemos`,dibujo:`📖`},{id:`naturaleza`,nom:`Naturaleza`,meta:`Árboles, luna, pájaros`,dibujo:`🌿`},{id:`numeros`,nom:`Números`,meta:`Precios, kilos, monedas`,dibujo:`🪙`}],co=[...io,...so],W=[{id:`sofrito`,materia:`cocina`,titulo:`El sofrito`,dibujo:`🧅`,sirve:`Es la base de casi todo lo que sabe a casa.`,texto:`El sofrito no es un adorno. Cebolla, ajo y tomate a fuego lento sueltan azúcares y un caldo propio. Si se quema, amarga. Si se queda crudo, el guiso sabe a agua. El punto es cuando la cebolla está transparente y el tomate ha perdido el rojo vivo.`,ejemplos:[`Unas lentejas sin sofrito saben a caldo de sobre. Con sofrito, a comida.`,`El pisto es un sofrito que se ha hecho grande.`,`La salsa de tomate de domingo empieza igual: aceite, ajo, tomate.`],curiosidad:`En Valencia se dice «sofregit»; en Cataluña, «sofregit» también. En Italia, el «soffritto» lleva apio y zanahoria. Aquí mandan la cebolla y el ajo.`,historia:`Hasta el siglo XVI no había tomate en España: llegó de América. Antes el sofrito era cebolla, ajo y, si había, pimiento. El tomate se tardó en fiar: se creía raro, casi ornamental. En el XVIII ya estaba en las cazuelas.`,enCasa:`Aceite de oliva, fuego más bajo de lo que apetece, y diez minutos de verdad. Si tienes prisa, mejor un huevo frito que un sofrito a medias.`},{id:`sal-pasta`,materia:`cocina`,titulo:`La sal del agua de la pasta`,dibujo:`🍝`,sirve:`Salamos el agua, no el plato después: así entra el sabor dentro.`,texto:`La pasta es almidón seco. El agua hirviendo la hincha. Si el agua está salada, la sal entra con el agua. Si sales el plato al final, la sal se queda fuera, a golpes. Un puñado por olla grande basta. El agua debe saber ligeramente a mar, no a salmuera.`,ejemplos:[`Espaguetis en agua sosa: por más queso que pongas, saben a cartón.`,`El arroz de paella también se sala en el caldo, no grano a grano.`,`Las patatas de ensalada, igual: agua salada al cocer.`],curiosidad:`La pasta no «coge más peso» por la sal. Coge sabor. El tiempo de cocción casi no cambia.`,historia:`En Nápoles, en el XIX, el agua de mar se usaba a veces para hervir. En el interior se salaba a mano. En España, los fideos de caldo ya salían del puchero salados: la costumbre es la misma.`,enCasa:`Cuando suelte el hervor, un puñado. Prueba una gota. Si no sabe a nada, falta sal.`},{id:`aceite`,materia:`cocina`,titulo:`El aceite de oliva`,dibujo:`🫒`,sirve:`No es un lujo: es grasa, sabor y cómo no se pega el huevo.`,texto:`El virgen extra es zumo de aceituna. El «aceite de oliva» a secas suele ser una mezcla refinada: más neutro, aguanta más el fuego. Para un crudo (ensalada, pan) el virgen. Para freír mucho rato, el de oliva normal o el de girasol, que cuestan menos y no se rompen tan pronto.`,ejemplos:[`Un tomate con sal y un hilo de virgen: ya es comida.`,`Freír croquetas en virgen extra es tirar dinero: el sabor se va con el calor.`,`El alioli es ajo y aceite, emulsionados. Si se corta, una gota de agua y paciencia.`],curiosidad:`España es el mayor productor de aceite de oliva del mundo. La mayor parte se vende a granel a Italia, que lo embotella con su nombre.`,historia:`Los fenicios y los romanos ya prensaban oliva en Hispania. El árabe nos dejó la palabra: al-zait, «zumo de oliva». De ahí aceite y aceituna. El lagar del pueblo era tan importante como el horno.`,enCasa:`Dos botellas: una buena para el pan y la ensalada, otra corriente para la sartén. Tapa siempre: el aire lo pone rancio.`},{id:`huevo-fresco`,materia:`cocina`,titulo:`Si el huevo está fresco`,dibujo:`🥚`,sirve:`Un truco de vaso te ahorra un mal flan.`,texto:`Mete el huevo en un vaso de agua fría. Si se queda en el fondo, tumbado, está muy fresco. Si se pone de pie, es de unos días: vale para tortilla. Si flota, no lo uses. Al envejecer, entra aire por la cáscara y el huevo se vuelve más ligero.`,ejemplos:[`Huevo pasado por agua: solo si está fresco. Si no, la clara no cuaja bien.`,`La mayonesa casera pide huevo a temperatura de cocina, no de nevera.`,`Un huevo de nevera en agua hirviendo se puede rajar: sácalo antes un rato.`],curiosidad:`La cáscara no es cerrada. Tiene poros. Por eso el huevo coge olores de la nevera si lo dejas al lado de un queso fuerte.`,historia:`Antes de las fechas impresas, en el pueblo se hacía esta prueba. En cuaresma, cuando se comían más huevos, las abuelas apartaban los que flotaban para las gallinas, no para la mesa.`,enCasa:`Nevera, en su huevera, punta hacia abajo. No hace falta lavarlos: el lavado quita la cera natural y entran más microbios.`},{id:`carne-reposo`,materia:`cocina`,titulo:`Por qué reposa la carne`,dibujo:`🥩`,sirve:`Si la cortas en caliente, el jugo se queda en el plato.`,texto:`Al asar o marcar, los jugos se van al centro. Si esperas cinco minutos fuera del fuego, se reparten. El filete no se enfría del todo: se asienta. Lo mismo un pollo asado. Tápalo con un plato, no con papel de aluminio apretado, que lo cuece.`,ejemplos:[`Un solomillo cortado al segundo parece seco. A los cinco minutos, no.`,`El asado de domingo: reposo mientras se hace la ensalada.`,`La tortilla de patata también mejora al reposar: se asienta el interior.`],curiosidad:`El «sellar la carne para que no pierda jugos» es un mito a medias. El sellado da sabor (la reacción de Maillard). El jugo se queda más por el reposo que por el sello.`,historia:`En las tabernas de Castilla el chuletón se servía en tabla y se esperaba. No era etiqueta: era oficio. El prisa de la plancha rápida es de cafetería.`,enCasa:`Cuenta despacio hasta 60. Mientras, sal y un chorro de aceite. Luego corta.`},{id:`patata-tomate`,materia:`cocina`,titulo:`Patata y tomate: dónde van`,dibujo:`🥔`,sirve:`Juntos en el pisto; separados en la despensa.`,texto:`La patata quiere oscuridad y fresco, no nevera. En frío el almidón se vuelve dulce y harinoso. El tomate, si está verde, fuera, para que madure. Si ya está blando, nevera. Juntos en un cajón, el tomate (que suelta etileno) hace que la patata brote antes.`,ejemplos:[`Patatas en un cajón con un periódico, lejos del horno.`,`Tomates en un plato, sin apilar, con el rabito hacia arriba.`,`Si la patata tiene brotes cortos, se quitan. Si está verde, se tira esa parte: es solanina.`],curiosidad:`En esta casa la patata vale 1 moneda: es el palo de medir el coste de los demás alimentos.`,historia:`La patata llegó de los Andes y en Europa se miró con recelo. En Galicia y Castilla se hizo pan de los pobres. El tomate tardó aún más. Hoy parecen de toda la vida.`,enCasa:`Dos sitios distintos. Y nunca en una bolsa de plástico cerrada.`},{id:`andar`,materia:`cuerpo`,titulo:`Andar`,dibujo:`🚶`,sirve:`Es el ejercicio que no pide ropa ni permiso.`,texto:`Media hora de andar al día mueve el corazón, las piernas y la cabeza. No hace falta correr. El paso que te permite hablar es el bueno. Si te falta el aire para una frase, baja un poco. El suelo irregular (pueblo, parque) vale más que la cinta, porque el pie trabaja.`,ejemplos:[`Ida al pan a pie, aunque haya coche.`,`Dos vueltas al parque después de comer, despacio.`,`Subir un piso andando y el resto en ascensor, si las rodillas lo permiten.`],curiosidad:`El corazón es un músculo. Andar es su gimnasio más barato. Los pasos del reloj no importan tanto como salir.`,historia:`Antes de los coches, un adulto andaba sin pensarlo: a la huerta, a misa, al trabajo. La silla y el mando han hecho el milagro inverso: vivir sin moverse.`,enCasa:`Zapato que no roce. Agua. Si hay vértigo o dolor de pecho, se habla con el médico, no con esta pantalla.`},{id:`siesta`,materia:`cuerpo`,titulo:`La siesta`,dibujo:`😴`,sirve:`Veinte minutos arreglan la tarde. Dos horas la estropean.`,texto:`Después de comer, la sangre se va al vientre y baja un poco la alerta. Un descanso corto (15 a 25 minutos) aclara. Dormir una hora entera entra en sueño profundo y al despertar hay borrachera de sueño. Mejor sillón que cama, si no quieres caer del todo.`,ejemplos:[`Ojos cerrados en el sillón, despertador a 20 minutos.`,`No siesta después de las cinco: luego cuesta el de la noche.`,`Un café solo no sustituye el descanso; a veces lo junta: el café tarda 20 minutos en hacer efecto.`],curiosidad:`La palabra viene de «sexta» hora romana: hacia mediodía. No es vagancia: es clima. En el norte de Europa casi no existe.`,historia:`En el campo se paraba porque el sol de las tres no deja trabajar. El urbanita lo heredó. Franco no inventó la siesta; el calor sí.`,enCasa:`Oscurece un poco, no del todo. Y avisa en casa: «veinte minutos».`},{id:`beber`,materia:`cuerpo`,titulo:`Beber agua`,dibujo:`💧`,sirve:`La sed llega tarde. Un vaso de más no hace daño; la falta, sí.`,texto:`No hace falta ir con botella de dos litros como un ciclista. Sí hace falta no esperar a tener la boca como papel. Con la edad, la sed avisa menos. El café y el caldo cuentan. El alcohol deshidrata. La orina clara es una buena señal; muy oscura, un aviso.`,ejemplos:[`Un vaso al levantarse, otro con cada comida.`,`En verano, botella en la nevera ya servida, a mano.`,`Si el médico ha dicho «poca agua» por el corazón o el riñón, se obedece al médico.`],curiosidad:`El mito de los ocho vasos viene de un papel americano de 1945 y no era una orden. La sed y el sentido común valen más.`,historia:`En los pueblos el botijo enfriaba por evaporación: el barro suda y el agua de dentro baja de temperatura. Física de patio.`,enCasa:`Agua del grifo, si es buena. Si no, jarra de filtro. El refresco no es agua.`},{id:`sueno`,materia:`cuerpo`,titulo:`Dormir`,dibujo:`🌙`,sirve:`La luz de noche le miente al cerebro.`,texto:`El cuerpo tiene reloj. La luz de la mañana lo pone en hora. La luz blanca del teléfono a las once lo retrasa. El alcohol puede tumbar, pero fragmenta el sueño. La cama es para dormir: si llevas una hora despierto, mejor levantarse un rato que pelear con la almohada.`,ejemplos:[`Cortina que deje entrar el día.`,`El reloj del pasillo, no el teléfono encima de la mesilla.`,`Cena pronto y no muy pesada. El picante y el vino tinto a deshora pasan factura.`],curiosidad:`Las personas mayores se despiertan más pronto: no es un fallo, es el reloj que se adelanta un poco con los años.`,historia:`Antes de la bombilla se dormía en dos trozos: un sueño al anochecer, un rato despierto a medianoche (para hablar, rezar, echar un hijo) y otro sueño hasta el alba. La noche de ocho horas seguidas es moderna.`,enCasa:`Esta pantalla no receta pastillas para dormir. Si no duermes semanas, el médico.`},{id:`tension`,materia:`cuerpo`,titulo:`Los dos números de la tensión`,dibujo:`🩺`,sirve:`Saber leerlos. No medicarse por lo que diga una app.`,texto:`El alto (sistólica) es cuando el corazón empuja. El bajo (diastólica) es cuando descansa. Se dicen «doce-ocho» por 120/80. Un susto, el café o hablar mientras se mide la suben. Se mide sentado, del brazo, en silencio, dos veces. Un número suelto no es un diagnóstico.`,ejemplos:[`Anota fecha, hora y los dos números. El médico quiere la serie, no el susto de un día.`,`El manguito flojo miente. El de la muñeca, también, si está mal puesto.`,`Sal de más, en mucha gente, empuja la tensión hacia arriba.`],curiosidad:`«Tener la tensión» se dice como si fuera una cosa. Son dos. Y cambian a lo largo del día.`,historia:`Scipione Riva-Rocci inventó el manguito en 1896. Korotkoff, un médico ruso, en 1905 oyó los ruidos con el fonendo y así nacieron los dos números.`,enCasa:`Si hay aparato, úsalo en paz. Las pastillas de la tensión las cambia el médico, no un vecino.`},{id:`nevera-zonas`,materia:`casa`,titulo:`El frío de la nevera`,dibujo:`❄️`,sirve:`Arriba no es igual que abajo. La carne va abajo.`,texto:`El aire frío baja. La zona más fría suele ser el fondo de abajo. Ahí: carne y pescado crudos, tapados, para que no goteen sobre lo demás. En la puerta, que es lo menos frío: salsas, huevos si tu nevera los trae ahí, bebidas. El cajón de verdura es más húmedo. El congelador no mata todo: para el tiempo.`,ejemplos:[`Un pollo crudo en la balda de arriba puede gotear sobre el yogur. Mal.`,`El tomate muy maduro, cajón. El pan, no: se pone de piedra.`,`Sobras: tapadas, fecha, tres días como mucho.`],curiosidad:`A 4 °C las bacterias van lentas, no muertas. Por eso «nunca se ha muerto nadie» no es un argumento: a veces sí.`,historia:`Hasta los años 60, en muchos pisos, el frío era el de la ventana en invierno y el de la despensa. La nevera eléctrica cambió la compra: de cada día, a una vez por semana.`,enCasa:`No la atestes. El aire tiene que correr. Si hace hielo a lo bruto, hay que descongelar.`},{id:`humedad`,materia:`casa`,titulo:`Humedad y salitre`,dibujo:`🧱`,sirve:`Abrir la ventana diez minutos gana a cualquier ambientador.`,texto:`Cocinar y ducharse llenan el aire de agua. Si no sale, se queda en la pared fría: moho negro, olor a cerrado, pintura que se hincha. El salitre de las casas de costa es sal que sube por el muro. Pintar encima sin dejar secar es esconderlo una temporada.`,ejemplos:[`Después de la ducha, puerta abierta y extractor. O ventana.`,`Detrás del armario pegado a un muro de fuera suele haber moho.`,`Un recipiente con sal gorda en un rincón absorbe un poco. No hace milagros.`],curiosidad:`El moho negro de las juntas de la ducha no se va con lejía para siempre. Se va con ventilación y juntas sanas.`,historia:`Las casas de adobe «respiraban». El cemento y el plástico cierran. Por eso pisos nuevos a veces humedecen más que un piso viejo con corrientes.`,enCasa:`Cinco minutos de corriente de aire, mañana y noche, aunque haga frío. Luego se cierra.`},{id:`luz-casa`,materia:`casa`,titulo:`Cuando se va la luz`,dibujo:`💡`,sirve:`Primero el diferencial. Luego el vecino. Luego la compañía.`,texto:`En el cuadro hay un interruptor general (el diferencial, el de la palanca que salta) y varios pequeños (los magnetotérmicos). Si salta uno pequeño, hay un aparato en esa línea. Si salta el general, hay un escape a tierra o un corte de la calle. No se meten los dedos. Se baja todo, se sube el general, se suben uno a uno.`,ejemplos:[`Salta al encender el radiador: esa línea va justa o el radiador está mal.`,`Se va la luz en todo el bloque: mira por la ventana. No es tu cuadro.`,`Linterna en un cajón, no en el móvil con el 1 %.`],curiosidad:`El diferencial salta para que no te pases la corriente por el cuerpo. Es un aparato de higiene, no un enemigo.`,historia:`La luz eléctrica en los pueblos de España llegó, en muchos, bien entrado el siglo XX. El interruptor de palanca del recibidor era un orgullo. El cuadro moderno es de los 80 y 90.`,enCasa:`Si salta a menudo, electricista. Si huele a quemado, se baja todo y se llama.`},{id:`vinagre-limpio`,materia:`casa`,titulo:`Limpiar con vinagre`,dibujo:`🧴`,sirve:`Quita cal y olores. No mezcla con lejía.`,texto:`El vinagre blanco es ácido. La cal del grifo es básica. Se neutralizan: por eso brilla el vaso y no queda el velo blanco. Sirve para la tetera, el plato de la ducha, el fregadero. Nunca con lejía: sale un gas que irrita la garganta. El olor a vinagre se va al secar.`,ejemplos:[`Taza de vinagre en la tetera, a hervir, a aclarar.`,`Paño con vinagre en la nevera para el olor a cerrado.`,`Las juntas: cepillo y vinagre. La lejía las deja blancas un día y las come a la larga.`],curiosidad:`El vinagre de vino también vale, pero mancha un poco. El de limpieza, más fuerte, no es para ensalada.`,historia:`Los romanos ya limpiaban con acetum. Antes de los anuncios de «multiusos», en la casa había jabón, lejía, vinagre y bicarbonato. Casi todo sigue saliendo de ahí.`,enCasa:`Una botella de vinagre blanco bajo el fregadero. Etiquetada, para que nadie la aliñe.`},{id:`paella`,materia:`espana`,titulo:`De dónde sale la paella`,dibujo:`🥘`,sirve:`No es un cajón de sastre. Es un arroz de huerta y albufera.`,texto:`La paella valenciana lleva arroz, agua, aceite, sal, pollo, conejo, bajoqueta (judía verde), garrofó (una judía ancha) y, a menudo, caracoles. No lleva chorizo, ni guisantes, ni gambas. Eso serán arroces, y pueden estar ricos, pero no son paella. El azafrán da color; el pimentón, fondo. El socarrat del fondo es premio, no quemado.`,ejemplos:[`Arroz de marisco: arroz a banda o del senyoret. Distinto plato.`,`El fuego tiene que ser parejo: por eso el anillo de gas y la paella ancha.`,`Reposar cinco minutos tapada con un paño: el grano acaba.`],curiosidad:`«Paella» es el recipiente (del latín patella, sartén). El plato tomó el nombre de la sartén, como «la cazuela».`,historia:`Nace en la huerta de Valencia, comida de domingo de labradores: lo que había en el corral y en la acequia. En el XX se hace bandera. Cada pueblo jura que la suya es la verdadera.`,enCasa:`Mejor poca y bien hecha que una paella para veinte con gamba de congelador y prisa.`},{id:`merienda`,materia:`espana`,titulo:`La merienda`,dibujo:`🍫`,sirve:`Puente entre la comida y la cena, que aquí es tarde.`,texto:`En España se come a las dos y se cena a las nueve o las diez. El cuerpo no aguanta ese hueco con un café. La merienda no es un capricho infantil: es un horario. Pan con chocolate, un yogur, un vaso de leche, un trozo de tortilla. Poco. Si meriendas un filete, luego no cenas.`,ejemplos:[`Pan, aceite y azúcar, de nieto.`,`Un café con un vaso de agua y cuatro galletas María.`,`En Andalucía, a veces, un mojete o un trozo de pescaito, si la cena va a ser ligera.`],curiosidad:`En muchos países se cena a las seis y no meriendan. No es que sean más serios: es que comen antes.`,historia:`La jornada partida (mañana, comida larga, tarde) viene del comercio y del calor. La merienda escolar, del siglo XX. El «almuerzo» en algunos sitios es la media mañana, no la comida.`,enCasa:`A las seis, algo. A las diez, poco. El cuerpo lo agradece más que un ayuno hasta la cena.`},{id:`camino`,materia:`espana`,titulo:`El Camino de Santiago`,dibujo:`🐚`,sirve:`Una ruta de pies, no solo de fe.`,texto:`Se camina hacia Santiago de Compostela, donde la tradición pone la tumba del apóstol. Hay muchos caminos: el Francés, el del Norte, el Portugués, la Vía de la Plata. La flecha amarilla y la concha marcan. Se duerme en albergue. El final es la plaza del Obradoiro. Aunque no se crea, el cuerpo entiende el rumbo.`,ejemplos:[`Una etapa de 20 kilómetros es un día entero, no una tarde.`,`Las ampollas se previenen con calcetín bueno y zapato ya usado.`,`La compostela es el papel que te dan si has hecho los últimos 100 km a pie.`],curiosidad:`La concha de vieira era el «ticket» de haber llegado al Finisterre: el mar. Se volvía a casa con ella, como prueba.`,historia:`En la Edad Media era una de las tres grandes peregrinaciones cristianas, con Roma y Jerusalén. Decayó. En los 80 se recuperó. Hoy van creyentes, viudos, estudiantes y gente que necesita andar hasta que se le quite algo.`,enCasa:`No hace falta ir a Galicia para entenderlo: una semana andando a alguna parte, con mochila pequeña, enseña lo mismo a escala.`},{id:`olivo-pais`,materia:`espana`,titulo:`El olivo`,dibujo:`🫒`,sirve:`Árbol de paciencia: da tarde y dura siglos.`,texto:`El olivo no tiene prisa. Un plantón tarda años en dar de verdad. Soporta el seco, el pobre, el calor. Se poda para que entre la luz. La aceituna se varea o se cosecha a máquina. Luego, al molino: limpia, muele, bate, decanta. Eso es el virgen. El árbol viejo es hueco por dentro y sigue vivo por la corteza.`,ejemplos:[`Jaén, Córdoba, Granada: mar de olivos.`,`En Mallorca, olivos torcidos de siglos, como esculturas.`,`La aceituna de mesa (manzanilla, gordal) no es la misma variedad que la de aceite.`],curiosidad:`Hay olivos en España a los que se les echan mil años. Nadie lo firma del todo, pero el tronco no miente: son de otro tiempo.`,historia:`Los romanos midieron Hispania también en ánforas de aceite. El olivo es más viejo que el nombre de España. Cuando un olivar se arranca para poner placas, se arranca un archivo.`,enCasa:`Un olivo en maceta grande vive en un patio. Poco riego, mucho sol, poda de enero.`},{id:`tapa-palabra`,materia:`palabras`,titulo:`Por qué se llama tapa`,dibujo:`🍷`,sirve:`Una palabra de taberna que se hizo costumbre de país.`,texto:`La explicación más contada: se tapaba el vaso de vino con un trozo de pan o una loncha para que no cayeran moscas, y de paso se picaba. Otra: el rey Alfonso XIII, en Cádiz, pidió que taparan el fino porque levantaba viento. Hay más leyendas que actas. Lo seguro: tapa es lo que cubre, y en el bar cubre el trago.`,ejemplos:[`Una tapa es un bocado. Un ración es para compartir. Un pincho, en el Norte, va con palillo.`,`En Granada, la tapa viene con la copa, sin pedirla.`,`«Ir de tapas» no es cenar: es andar.`],curiosidad:`En otros idiomas se ha copiado la palabra: tapas. Como siesta y fiesta. Exportamos horario y hambre pequeña.`,historia:`El tapeo moderno es del XX. Antes se picaba igual, pero no se llamaba así en todas partes. Cada ciudad tiene su orgullo: el pincho vasco, la montadito, la tapa libre.`,enCasa:`Un plato pequeño con lo que haya (queso, aceitunas, un huevo) y un vaso. Eso es tapa. No hace falta nombre extranjero.`},{id:`siesta-palabra`,materia:`palabras`,titulo:`Siesta, de la hora sexta`,dibujo:`🕕`,sirve:`Las horas romanas siguen en la boca.`,texto:`Los romanos partían el día en doce horas de luz. La sexta caía hacia el mediodía. De «hora sexta» sale siesta. Prima, tercia, sexta, nona eran también horas de rezo. El idioma guarda el reloj de gente que no tenía pulsera.`,ejemplos:[`«Nona» (nona hora) nos deja «nones» en algunos sitios, y el nombre de las nonas.`,`«Misa de tercia» ya no se dice. «Echar la siesta», sí.`,`En México y Argentina también se siesta, con el mismo origen.`],curiosidad:`Inglés y francés nos han tomado prestada la palabra porque no tenían una tan exacta. Nap es un cabezadita. Siesta es un rito.`,historia:`El latín de Hispania se hizo castellano andando. Las horas canónicas del monasterio pasaron al campo: se trabajaba por campanas, no por minutos.`,enCasa:`Cuando digas siesta, estás hablando un poco en latín. Sin darte cuenta.`},{id:`arabe-cocina`,materia:`palabras`,titulo:`Las palabras árabes de la cocina`,dibujo:`🕌`,sirve:`Aceite, aceituna, azúcar, naranja, arroz: un mismo principio.`,texto:`Lo que en castellano empieza por al- suele venir del árabe: el artículo «al» pegado al nombre. Al-zait (aceite), al-zaytuna (aceituna), al-sukkar (azúcar), nāranj (naranja), al-ruzz (arroz), albóndiga, albahaca, almohada. Ocho siglos no se van del puchero.`,ejemplos:[`Azúcar y aceituna: dulce y salado, los dos con al-.`,`Naranja era el fruto amargo; la dulce llegó después, de Portugal: por eso en algunos idiomas se llama «portuguesa».`,`Alcohol también es árabe (al-kuḥl). No es de cocina, pero está en la copa.`],curiosidad:`«Ojalá» es «wa-ša’ Allāh», si Dios quiere. Cada vez que lo dices, suena Córdoba.`,historia:`Al-Ándalus no es un adorno de libro. Es riego, noria, naranja, limón, arroz, azafrán. La Reconquista cambió reyes; no cambió el almuerzo del todo.`,enCasa:`Lee la lista de la compra en voz alta: la mitad de la despensa habla árabe.`},{id:`en-el-ajo`,materia:`palabras`,titulo:`Estar en el ajo`,dibujo:`🧄`,sirve:`Saber de qué va un asunto, estar metido.`,texto:`«Estar en el ajo» es estar enterado, a veces hasta demasiado. El ajo se mete en el sofrito y lo cambia todo: igual que quien está en el ajo cambia la conversación.`,ejemplos:[`«Yo no estoy en el ajo»: no me cuentes, o no me impliques.`,`«Meter el diente» es otra: empezar a probar un asunto.`,`«Importar un rábano»: lo contrario, no entrar ni por el olfato.`],curiosidad:`El ajo se ha usado para espantar el mal de ojo. Estar en el ajo, entonces, también era estar protegido. O delatado por el olor.`,historia:`Los dichos de comida son los que más duran: pan, ajo, aceite, cebolla. Porque todo el mundo los ha tocado. Los dichos de oficina se olvidan.`,enCasa:`Si alguien pregunta y no quieres lío: «no estoy en el ajo». Y a otra cosa.`},{id:`olivo-vida`,materia:`naturaleza`,titulo:`Un olivo dura más que una casa`,dibujo:`🌳`,sirve:`Cuidar el árbol es pensar más allá de uno mismo.`,texto:`El olivo puede vivir cientos de años. Echa brotes de la cepa si se corta. Resiste la sequía cerrando los estomas de la hoja. El hielo fuerte lo daña. La mosca del olivo pica el fruto. El aceite bueno nace de un árbol que alguien podó en enero.`,ejemplos:[`Hojas plateadas: es el envés, para no perder agua.`,`Un olivo abandonado se hace mata. Se puede recuperar, despacio.`,`La leña de olivo, densa, da lumbre larga. No se tira un árbol por eso.`],curiosidad:`En Atenas el olivo de la Acrópolis se replantaba como símbolo. Aquí, el de la abuela en el ribazo hace el mismo papel, sin estatua.`,historia:`Junto a la vid y el trigo, el olivo es la tríada mediterránea. Tres plantas que aguantan el verano y han dado de comer a este clima.`,enCasa:`Si hay un olivo al cuidado, poda con tijera limpia. La luna, si te hace ilusión.`},{id:`hojas`,materia:`naturaleza`,titulo:`Por qué caen las hojas`,dibujo:`🍂`,sirve:`El árbol no se muere: se quita un gasto.`,texto:`La hoja es una fábrica de azúcar con luz. En otoño hay menos luz y más riesgo de helada. El árbol corta el flujo a la hoja, recicla lo que puede (por eso amarillea) y la suelta. El suelo se cubre de mantillo.`,ejemplos:[`El plátano de sombra de la avenida: alfombra amarilla en noviembre.`,`La encina es de hoja perenne: las cambia poco a poco, no de golpe.`,`Barrer en seco. Las hojas mojadas en el desagüe son atasco.`],curiosidad:`El rojo de algunos árboles no es oxidación sucia: es un pigmento (antocianina). Todavía se discute para qué.`,historia:`El calendario campesino se leía en los árboles. San Miguel, la vendimia, la caída de la hoja, la matanza.`,enCasa:`Las hojas en el compost o al pie de un árbol. Quemarlas, donde está prohibido, ensucia el aire de todos.`},{id:`luna-mareas`,materia:`naturaleza`,titulo:`La luna y las mareas`,dibujo:`🌕`,sirve:`No es magia. Es un tirón.`,texto:`La luna tira de la Tierra, más del agua porque el agua se mueve. Hay dos pleamares al día, más o menos. Cuando luna y sol tiran en línea (luna llena y nueva), mareas vivas. Cuando tiran en ángulo (cuartos), mareas muertas. En el Mediterráneo se nota poco; en Galicia y Cádiz, mucho.`,ejemplos:[`Mariscador: va con la tabla de mareas, no con el horóscopo.`,`Un pueblo de ría cambia de cara cada seis horas.`,`Dormir peor en luna llena: a veces es la luz en la persiana, no el misterio.`],curiosidad:`El cuerpo humano es mucha agua, sí. De ahí no se sigue que la luna nos mueva como a una ría. Esa parte se cuenta mucho y se demuestra poco.`,historia:`Los griegos ya ligaban luna y mar. Newton, en el XVII, puso números. Los almanaques de pescadores eran el GPS de entonces.`,enCasa:`Si vas a la costa, mira la marea antes de dejar los zapatos «un momento» en una roca.`},{id:`golondrina`,materia:`naturaleza`,titulo:`Las golondrinas`,dibujo:`🕊️`,sirve:`Avisan la estación. Y limpian mosquitos.`,texto:`Vienen en primavera, se van al África en otoño. El nido de barro bajo el alero no es suciedad: es vecindad. Comen insectos al vuelo. Si un año no vuelven, a veces es que el alero se cerró, o que el viaje les ha ido mal.`,ejemplos:[`El vuelo en dientes de sierra, rozando el suelo antes de la lluvia.`,`No se tira un nido en uso. Es delito, además de feo.`,`El vencejo parece golondrina y no lo es: vuela aún más alto y casi no se posa.`],curiosidad:`Bécquer: «Volverán las oscuras golondrinas.» Volvían a su balcón. El poema es de pérdida; el pájaro, de calendario.`,historia:`Aristóteles pensó que las golondrinas se enterraban en el barro a dormir el invierno. Migrar tan lejos no se creía. Se tardó siglos en creerlo.`,enCasa:`Si anidan, un cartón debajo recoge. En otoño, se quita. Al año, si quieren, vuelven.`},{id:`moneda-patata`,materia:`numeros`,titulo:`La moneda de la patata`,dibujo:`🪙`,sirve:`Medir el precio de la comida con algo que todos conocemos.`,texto:`En Alimentos, 1 moneda es lo que vale la patata. No es un euro exacto: es una vara. Lo barato de verdad se queda en 1. Lo de cada día sube a 2. El aceite bueno y el pescado fresco, 3 o 4. El caviar y el bogavante, 5.`,ejemplos:[`Un kilo de patatas: 1. Un kilo de merluza: varias patatas.`,`El aceite de oliva virgen: más monedas que el de girasol.`,`Las 5 monedas no son pecado: son «de vez en cuando».`],curiosidad:`Antes se comparaba en jornales: «esto vale un día de trabajo». La patata es el jornal de la despensa.`,historia:`La peseta nació en 1868. El euro, en 2002. La gente mayor todavía traduce. Una vara de palo (la patata) no necesita cambio de moneda.`,enCasa:`Cuando dudes en el súper, pregunta: ¿cuántas patatas es esto? Si son 5 y no es fiesta, vuelve a la balda.`},{id:`kilo`,materia:`numeros`,titulo:`El kilo y el litro`,dibujo:`⚖️`,sirve:`Pesar es comparar con un acuerdo, no con el ojo.`,texto:`El kilo es mil gramos. Un litro de agua pesa, más o menos, un kilo. Por eso un litro de leche «pesa» como un kilo, y un litro de aceite un poco menos (flota). El cuarto (250 g) y el medio (500 g) salen de partir. En la báscula del súper, el precio es por kilo.`,ejemplos:[`Jamón a 20 €/kg. 100 g son 2 €, no 20.`,`Una cucharada sopera de aceite ronda los 10 ml.`,`Harina: 1 taza no es 1 peso. Mejor báscula para un bizcocho.`],curiosidad:`El kilo dejó de ser un cilindro de platino en París. Desde 2019 se define con una constante de la física. En la cocina, sigue siendo «un kilo».`,historia:`La Revolución francesa inventó el metro y el kilo para que no hubiera una vara en cada pueblo. España lo adoptó en el XIX.`,enCasa:`Mira el precio por kilo, no el del envase bonito. El envase es publicidad. El kilo es la verdad.`},{id:`iva`,materia:`numeros`,titulo:`El IVA de la compra`,dibujo:`🧾`,sirve:`Parte del precio no es el alimento: es el impuesto.`,texto:`El IVA es un porcentaje que se suma. El pan, la fruta, la leche suelen ir al reducido. Un cubo de fregar, al 21 %. El cartel del súper ya lo trae puesto. En una factura de un taller, a veces se ve desglosado: base y IVA.`,ejemplos:[`100 € de base al 21 % son 121 €. La cuenta: 100 × 1,21.`,`Para quitar el IVA del 21 %: precio ÷ 1,21. 121 ÷ 1,21 = 100.`,`El superreducido existe para que el pan no pague como un televisor.`],curiosidad:`IVA son siglas: Impuesto sobre el Valor Añadido. Se paga en cada paso, pero el particular lo ve una vez, al final.`,historia:`España lo implantó en 1986, al entrar en Europa. Antes estaba el IGTE, que nadie extraña.`,enCasa:`No hay que volverse contable. Sí hay que saber que un 21 % de 100 no es 21 céntimos.`},{id:`porcentaje`,materia:`numeros`,titulo:`Tanto por ciento, sin miedo`,dibujo:`٪`,sirve:`Descuentos, sal, alcohol y subidas de pensión se leen igual.`,texto:`Por ciento es «de cada cien». El 10 % de 200 es 20. El 50 % es la mitad. El 25 %, un cuarto. Un «30 % de descuento» en 10 € deja 7 €. Cuidado: bajar un 30 % y subir un 30 % no vuelve al mismo sitio.`,ejemplos:[`Jamón con 30 % menos de sal no es sin sal. Es menos, no cero.`,`Una subida del 4 % a 1.000 € son 40 €.`,`Alcohol 13 % en el vino: 13 ml de alcohol en cada 100 ml.`],curiosidad:`El signo % es un tanto por 100 dibujado. El número es el mismo en todos los idiomas.`,historia:`Los mercaderes italianos del Renacimiento pusieron el tanto por ciento para no escribir «de cada ciento».`,enCasa:`Antes de un descuento, mira el precio final. El cartel grande es el porcentaje. Lo que pagas es el pequeño.`}],G=[{id:`comer-espana`,titulo:`Por qué comemos lo que comemos`,dibujo:`🍲`,sirve:`La olla cuenta la geografía mejor que un mapa.`,partes:[{t:`Tres plantas y un mar`,p:`Trigo, vid y olivo aguantan el verano seco. Con eso hay pan, vino y aceite. El mar, donde se llega, pone pescado. Donde no se llega, mata el cerdo y lo sala.`},{t:`América en el puchero`,p:`Sin el XVI no hay tomate, patata, pimiento, maíz, chocolate, pimentón. Decir «comida de toda la vida» es verdad a medias: de las últimas vidas.`},{t:`El horario`,p:`Comer a las dos y cenar a las diez no es genética. Es calor, comercio y jornada partida. La merienda rellena.`}],ejemplos:[`Un desayuno de pan, aceite y café es mediterráneo de verdad.`,`El norte come más vaca y más nata; el sur, más frito y más tomate.`,`La paella, el cocido, el gazpacho y la fabada no salen del mismo huerto.`],curiosidad:`El tenedor tardó. Se comía con cuchara, navaja y pan. Por eso el pan sigue siendo cubierto.`,historia:`Los recetarios de la Edad Media mezclan medicina y cocina. El puchero, en medio, no se ha enterado.`,enCasa:`Come lo que hay cerca, en temporada, despacio, con pan. Eso es más tesis que cualquier dieta con nombre americano.`},{id:`tres-conservas`,titulo:`Fuego, sal y tiempo`,dibujo:`🔥`,sirve:`Conservar es la primera técnica. Cocinar vino después.`,partes:[{t:`El fuego`,p:`Cocer, asar, ahumar. El fuego mata bichos y ablanda lo duro.`},{t:`La sal`,p:`La sal saca el agua. Sin agua, mucha vida no puede. Por eso el bacalao, el jamón, las anchoas.`},{t:`El tiempo`,p:`Fermentar: vino, queso, yogur, pan. El tiempo frío retrasa a todos, buenos y malos.`}],ejemplos:[`Un tomate al sol en los tejados: tiempo y aire.`,`Las sardinas en lata: fuego y cierre.`,`El yogur de casa: leche tibia y una cucharada del anterior.`],curiosidad:`La palabra «salario» viene de sal. Se pagaba con ella, o se pagaba para ella.`,historia:`Appert embotó comida y la hirvió (1804). Luego vino la lata. La nevera hizo que se nos olvidara salar.`,enCasa:`Si sobra cocido, frío pronto y nevera. Si sobra tomate, sofrito y congelador.`},{id:`andar-tesis`,titulo:`Caminar como oficio`,dibujo:`👣`,sirve:`El cuerpo se hizo para el camino, no para el sillón.`,partes:[{t:`Máquina sencilla`,p:`Dos piernas, un corazón. Andar mueve más músculos de los que se nombran. La sangre vuelve de las piernas porque el paso la empuja.`},{t:`La cabeza`,p:`Pensar andando no es un dicho. El ritmo regular libera un tipo de atención que la silla no da.`},{t:`El pueblo`,p:`Un pueblo andable mantiene gente mayor mejor que un gimnasio a diez minutos en coche.`}],ejemplos:[`El médico de cabecera que receta «andar» no está despachando.`,`El Camino de Santiago es esa tesis andando.`,`Un perro es, para muchos, la única alarma de paseo que se obedece.`],curiosidad:`Se dice que un ser humano bien entrenado puede andar más kilómetros al día, de forma sostenida, que un caballo.`,historia:`Los romanos midieron el imperio en millas de paso. Antes del metro, el cuerpo era la regla.`,enCasa:`Diez minutos ahora. No «cuando haga bueno». El médico manda si hay vértigo, pecho o cadera nueva.`},{id:`mesa`,titulo:`La mesa`,dibujo:`🪑`,sirve:`No es un mueble. Es el sitio donde una casa se reconoce.`,partes:[{t:`Sentarse`,p:`Comer de pie es de feria. Sentarse iguala: el niño, el abuelo, el que llega tarde.`},{t:`El mantel y el pan`,p:`El pan en el centro, el vaso a la derecha. No es snobismo: es no discutir cada día por el sitio.`},{t:`La tele`,p:`La tele en la comida ahorra conversación y gasta compañía. La mesa con pantallas es una sala de espera.`}],ejemplos:[`Un domingo con mantel, aunque el plato sea tortilla, cambia el día.`,`Poner un plato de más «por si viene alguien» es hospitalidad antigua.`,`Las migas en el mantel: en algunos sitios se recogen y se dan a los pájaros.`],curiosidad:`«Compañero» viene de cum panis: el que comparte el pan.`,historia:`El triclinio romano se recostaba. La silla individual es un lujo que se hizo normal.`,enCasa:`Un horario, aunque sea flexible. Que exista «la hora de comer».`},{id:`idioma`,titulo:`Latín, árabe y pueblo`,dibujo:`📜`,sirve:`El castellano es un palimpsesto: se lee una lengua y debajo hay otras.`,partes:[{t:`Latín que se gastó`,p:`De «filium» a hijo, de «oculum» a ojo. Eso es desgaste de siglos, no un decreto.`},{t:`El árabe que se quedó`,p:`Almohada, alcalde, almacén, acequia, naranja. Una lengua vencedora que guarda tantas palabras del vencido es que el vencido sabía hacer cosas.`},{t:`Lo que no se ve`,p:`El vasco no es latín. El catalán y el gallego son primos. El español de América nos ha devuelto palabras.`}],ejemplos:[`Cuenta hasta diez: casi todo latín. Nombra el azúcar y el aceite: árabe.`,`«Izquierda» no es latín. Viene del vasco.`,`Un dicho de pueblo aguanta más que una moda de Madrid.`],curiosidad:`Nebrija, en 1492, publica la primera gramática de una lengua vulgar en Europa.`,historia:`Los reyes no inventan lenguas. Quien hace la lengua es la madre, el mercado y la canción.`,enCasa:`Hablar claro a los nietos es más escuela que una app.`},{id:`nevera-cambio`,titulo:`La nevera cambió la casa`,dibujo:`🧊`,sirve:`Un electrodoméstico que reescribió el día, la compra y el sobrar.`,partes:[{t:`Antes`,p:`Se compraba cada día. El hielo se vendía en bloques. El verano era una carrera contra el agrio.`},{t:`Después`,p:`La compra semanal, el súper, el congelado. Se gana seguridad y se pierde el pulso de lo fresco.`},{t:`El medio`,p:`La nevera gasta luz las 24 horas. Abrirla a pensar es dejar salir el frío que has pagado.`}],ejemplos:[`Un cajón de verdura olvidado es el nuevo gallinero.`,`El congelador es una despensa de tiempo.`,`La leche UHT no necesita nevera hasta que se abre.`],curiosidad:`En España, en muchos pisos, llega en los 60 y 70, con la tele y la lavadora.`,historia:`Clarence Birdseye vio a los inuit congelar pescado muy rápido y copió la idea.`,enCasa:`Lista antes de abrir. Lo viejo delante. Tres días para las sobras.`},{id:`precio-super`,titulo:`Cómo se hace un precio`,dibujo:`🛒`,sirve:`El cartel no es el coste. Es una historia de camión, sueldo e impuesto.`,partes:[{t:`Del campo al camión`,p:`Una naranja vale el agua, el jornal, el abono y el ánimo de quien la recoge.`},{t:`La tienda`,p:`Luz, alquiler, merma. El súper gana poco en cada yogur y mucho en que entres «a por leche» y salgas con tres cosas más.`},{t:`La vara`,p:`Por eso en esta casa medimos en patatas. 1 moneda es el alimento que casi siempre hay y casi nunca es lujo.`}],ejemplos:[`Un tomate en enero ha viajado o ha vivido en invernadero.`,`El precio por kilo, no el del envase.`,`Marca blanca: a menudo la misma fábrica, otro papel.`],curiosidad:`«Oferta» quiere decir que alguien ha calculado que, a ese precio, te llevas más de lo que ibas a llevar.`,historia:`El mercado del pueblo tenía precio a gritos. El súper tiene precio fijo.`,enCasa:`Lista. Hambre antes, no en el pasillo. Patata = 1.`},{id:`reloj-cuerpo`,titulo:`El reloj que no se ve`,dibujo:`🕰️`,sirve:`Luz por la mañana, oscuridad por la noche. El resto es comentario.`,partes:[{t:`El núcleo`,p:`En el cerebro hay un grupo de células que cuentan el día. Las pone en hora la luz que entra por el ojo.`},{t:`La digestión`,p:`El estómago también tiene hora. Cenas a las doce y le pides a un órgano que trabaje en su noche.`},{t:`La edad`,p:`De mayor, el reloj se adelanta. Madrugar un poco y salir a la luz arregla más que un somnífero, en muchos casos. En otros, médico.`}],ejemplos:[`Un viaje a América: el cuerpo tarda un día por cada huso, más o menos.`,`El móvil a un palmo de la cara a las once es un sol pequeño, a deshora.`,`Los geranios también tienen reloj: se orientan.`],curiosidad:`Hay una proteína (melatonina) que sube de noche. La luz azul la calla.`,historia:`Hasta la bombilla, la noche era de verdad. El siglo XX ha inventado la madrugada productiva.`,enCasa:`Cortina. Paseo de mañana. Cena decente. Pantalla lejos de la almohada.`}],lo=[...W,...ao],uo=[...G,...oo];function fo(e){return lo.filter(t=>t.materia===e)}function po(e){return lo.find(t=>t.id===e)}function mo(e){return uo.find(t=>t.id===e)}function ho(e){return co.find(t=>t.id===e)}function go(){let e=j(e=>e.extra),t=M(e,`proId`),n=M(e,`proMat`);if(t&&n===`tesis`){let e=mo(t);if(e)return(0,N.jsx)(So,{t:e})}if(t){let e=po(t);if(e)return(0,N.jsx)(xo,{l:e})}return n===`tesis`?(0,N.jsx)(yo,{}):n?(0,N.jsx)(vo,{materia:n}):(0,N.jsx)(_o,{})}function _o(){let e=j(e=>e.mergeExtra);return(0,N.jsxs)(P,{titulo:`Profesor`,children:[(0,N.jsx)(`p`,{className:`ficha-leyenda`,children:`Lecciones cortas y tesis más largas. Ejemplos, historia y para qué sirve.`}),(0,N.jsxs)(An,{children:[co.map(t=>{let n=fo(t.id).length;return(0,N.jsxs)(`button`,{type:`button`,className:`ficha-grupo`,onClick:()=>e({proMat:t.id}),children:[(0,N.jsx)(`span`,{className:`ficha-dibujo`,"aria-hidden":!0,children:t.dibujo}),(0,N.jsxs)(`span`,{className:`ficha-grupo-txt`,children:[(0,N.jsx)(`strong`,{children:t.nom}),(0,N.jsxs)(`em`,{children:[n,` lecciones · `,t.meta]})]})]},t.id)}),(0,N.jsxs)(`button`,{type:`button`,className:`ficha-grupo`,onClick:()=>e({proMat:`tesis`}),children:[(0,N.jsx)(`span`,{className:`ficha-dibujo`,"aria-hidden":!0,children:`📚`}),(0,N.jsxs)(`span`,{className:`ficha-grupo-txt`,children:[(0,N.jsx)(`strong`,{children:`Tesis`}),(0,N.jsxs)(`em`,{children:[uo.length,` textos largos · para leer con calma`]})]})]})]})]})}function vo({materia:e}){let t=j(e=>e.mergeExtra),n=ho(e),r=fo(e);return(0,N.jsx)(P,{titulo:n?.nom||`Lecciones`,children:(0,N.jsx)(An,{children:r.map(n=>(0,N.jsxs)(`button`,{type:`button`,className:`ficha-grupo`,onClick:()=>t({proMat:e,proId:n.id}),children:[(0,N.jsx)(`span`,{className:`ficha-dibujo`,"aria-hidden":!0,children:n.dibujo}),(0,N.jsxs)(`span`,{className:`ficha-grupo-txt`,children:[(0,N. <script>
/* Les vencimos — módulos offline (IndexedDB + file:// / https) */
(function () {
  var DB = 'lesvencimos-modulos-v1';
  var STORE = 'modulos';

  function openDb() {
    return new Promise(function (resolve, reject) {
      var r = indexedDB.open(DB, 1);
      r.onupgradeneeded = function () {
        var db = r.result;
        if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: 'id' });
      };
      r.onsuccess = function () { resolve(r.result); };
      r.onerror = function () { reject(r.error); };
    });
  }

  function all() {
    return openDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(STORE, 'readonly');
        var req = tx.objectStore(STORE).getAll();
        req.onsuccess = function () { resolve(req.result || []); };
        req.onerror = function () { reject(req.error); };
      });
    });
  }

  function put(mod) {
    return openDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put(mod);
        tx.oncomplete = function () { resolve(mod); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }

  function del(id) {
    return openDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).delete(id);
        tx.oncomplete = function () { resolve(); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }

  function toast(msg) {
    try {
      var el = document.createElement('div');
      el.textContent = msg;
      el.setAttribute('role', 'status');
      el.style.cssText = 'position:fixed;left:50%;bottom:1.25rem;transform:translateX(-50%);z-index:99999;background:#121A2B;color:#E8EEF8;border:1px solid rgba(199,210,254,.35);padding:.65rem 1rem;border-radius:12px;font:650 0.92rem system-ui;box-shadow:0 8px 24px rgba(0,0,0,.35)';
      document.body.appendChild(el);
      setTimeout(function () { el.remove(); }, 2600);
    } catch (e) {}
  }

  function openBlobHtml(html, title) {
    var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var w = window.open(url, '_blank');
    if (!w) {
      location.href = url;
    }
    setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) {} }, 60000);
  }

  function openBuiltinProfesor() {
    var protocol = location.protocol;
    var candidates;
    if (protocol === 'file:') {
      candidates = ['Profesor.html', 'profesor.html', './Profesor.html', './profesor.html'];
    } else {
      var base = location.pathname.replace(/[^/]+$/, '');
      candidates = ['/profesor.html', 'profesor.html', 'Profesor.html', base + 'profesor.html', base + 'Profesor.html'];
    }
    var i = 0;
    function tryNext() {
      if (i >= candidates.length) {
        toast('No encuentro Profesor.html. Añádelo como módulo o descárgalo.');
        return;
      }
      var href = candidates[i++];
      // For http(s), navigate directly to known good path first
      if (protocol !== 'file:' && href === '/profesor.html') {
        location.assign(href);
        return;
      }
      if (protocol === 'file:') {
        location.assign(href);
        return;
      }
      fetch(href, { method: 'HEAD' }).then(function (r) {
        if (r.ok) location.assign(href);
        else tryNext();
      }).catch(tryNext);
    }
    tryNext();
  }

  function slug(name) {
    return String(name || 'modulo')
      .toLowerCase()
      .replace(/\.html?$/i, '')
      .replace(/[^a-z0-9áéíóúñü]+/gi, '-')
      .replace(/^-|-$/g, '') || 'modulo';
  }

  function add() {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = '.html,text/html';
    input.style.display = 'none';
    document.body.appendChild(input);
    input.onchange = function () {
      var file = input.files && input.files[0];
      input.remove();
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        var html = String(reader.result || '');
        if (!/<\s*html/i.test(html)) {
          toast('Ese archivo no parece un HTML de módulo');
          return;
        }
        var id = slug(file.name) + '-' + Date.now().toString(36);
        var mod = {
          id: id,
          nombre: file.name.replace(/\.html?$/i, ''),
          archivo: file.name,
          html: html,
          addedAt: Date.now()
        };
        put(mod).then(function () {
          toast('Módulo «' + mod.nombre + '» añadido');
          openBlobHtml(html, mod.nombre);
        }).catch(function () {
          toast('No pude guardar el módulo (¿almacenamiento lleno?)');
        });
      };
      reader.onerror = function () { toast('No pude leer el archivo'); };
      reader.readAsText(file);
    };
    input.click();
  }

  function list() {
    all().then(function (mods) {
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;z-index:99998;background:rgba(8,10,18,.72);display:flex;align-items:center;justify-content:center;padding:1rem';
      var card = document.createElement('div');
      card.style.cssText = 'background:#121A2B;color:#E8EEF8;border:1px solid rgba(232,238,248,.12);border-radius:16px;max-width:22rem;width:100%;padding:1.1rem;max-height:80vh;overflow:auto;font:400 0.95rem system-ui';
      card.innerHTML = '<h3 style="margin:0 0 .75rem;font-size:1.1rem">Mis módulos</h3>';
      if (!mods.length) {
        var p = document.createElement('p');
        p.style.cssText = 'color:#8B9BB8;margin:0 0 1rem';
        p.textContent = 'Aún no hay ninguno. Usa «Añadir módulo» y elige un HTML (por ejemplo Profesor.html).';
        card.appendChild(p);
      } else {
        mods.sort(function (a, b) { return (b.addedAt || 0) - (a.addedAt || 0); });
        mods.forEach(function (m) {
          var row = document.createElement('div');
          row.style.cssText = 'display:flex;gap:.5rem;align-items:center;margin:0 0 .55rem';
          var open = document.createElement('button');
          open.type = 'button';
          open.textContent = m.nombre || m.archivo || m.id;
          open.style.cssText = 'flex:1;text-align:left;padding:.65rem .8rem;border-radius:10px;border:1px solid rgba(199,210,254,.28);background:rgba(199,210,254,.08);color:#E8EEF8;font-weight:650';
          open.onclick = function () { openBlobHtml(m.html, m.nombre); };
          var rm = document.createElement('button');
          rm.type = 'button';
          rm.textContent = 'Quitar';
          rm.style.cssText = 'padding:.55rem .7rem;border-radius:10px;border:1px solid rgba(232,238,248,.12);background:transparent;color:#8B9BB8';
          rm.onclick = function () {
            del(m.id).then(function () { overlay.remove(); list(); toast('Módulo quitado'); });
          };
          row.appendChild(open);
          row.appendChild(rm);
          card.appendChild(row);
        });
      }
      var close = document.createElement('button');
      close.type = 'button';
      close.textContent = 'Cerrar';
      close.style.cssText = 'margin-top:.5rem;width:100%;padding:.7rem;border-radius:10px;border:none;background:#C7D2FE;color:#0B1220;font-weight:800';
      close.onclick = function () { overlay.remove(); };
      card.appendChild(close);
      overlay.appendChild(card);
      overlay.addEventListener('click', function (e) { if (e.target === overlay) overlay.remove(); });
      document.body.appendChild(overlay);
    }).catch(function () { toast('No pude leer los módulos guardados'); });
  }

  window.LesModulos = {
    add: add,
    list: list,
    openBuiltin: function (name) {
      if (name === 'profesor') openBuiltinProfesor();
      else toast('Módulo desconocido');
    },
    openHtml: openBlobHtml
  };
})();
</script>

</body>
</html>
