igeramente con mantequilla las caras exteriores.`,`Rellena con jamón y queso.`,`Tuesta en sartén o sandwichera hasta que el queso se funda.`]},{titulo:`Ensalada de pasta`,tiempo:20,dificultad:`fácil`,ingredientes:[`250 g de pasta corta`,`atún en lata`,`tomate cherry`,`maíz`,`aceitunas`,`huevo duro`,`aceite y vinagre`],pasos:[`Cuece la pasta, enfríala bajo el grifo y escúrrela bien.`,`Mezcla con todo lo demás troceado.`,`Aliña y sirve fría.`,`Aguanta 2 días en la nevera.`]},{titulo:`Ensalada de garbanzos`,tiempo:10,dificultad:`fácil`,ingredientes:[`1 bote de garbanzos cocidos`,`1 tomate`,`1/2 cebolla morada`,`pepino`,`perejil`,`aceite`,`limón`,`comino`],pasos:[`Escurre y lava los garbanzos.`,`Mezcla con las verduras picadas.`,`Aliña con aceite, limón, sal y una pizca de comino.`,`Mejor tras 30 min de nevera.`]},{titulo:`Ensalada de lentejas`,tiempo:10,dificultad:`fácil`,ingredientes:[`1 bote de lentejas cocidas`,`pimiento rojo`,`cebolleta`,`pepinillos`,`aceite`,`vinagre de Jerez`,`sal`],pasos:[`Escurre las lentejas y lávalas.`,`Pica las verduras finito.`,`Mezcla y aliña.`,`Un plato completo sin encender el fuego.`]},{titulo:`Arroz blanco perfecto`,tiempo:18,dificultad:`fácil`,ingredientes:[`1 taza de arroz`,`2 tazas de agua`,`sal`,`una cucharada de aceite`,`(1 diente de ajo opcional)`],pasos:[`Sofríe el ajo en el aceite, añade el arroz 1 minuto, luego el agua hirviendo con sal.`,`Fuego medio-alto 10 min y bajo 8 min.`,`Reposar 5 min tapado.`,`No remover nunca.`]},{titulo:`Arroz con huevo y tomate`,tiempo:20,dificultad:`fácil`,ingredientes:[`Arroz blanco`,`1 huevo por persona`,`tomate frito casero o de bote bueno`],pasos:[`Haz arroz blanco.`,`Fríe el huevo dejando la yema líquida.`,`Sirve el arroz con tomate caliente y el huevo encima: al romper la yema hace de salsa.`]},{titulo:`Pasta al ajo y guindilla`,tiempo:15,dificultad:`fácil`,ingredientes:[`320 g de espaguetis`,`4 dientes de ajo`,`guindilla`,`80 ml de aceite de oliva`,`perejil`],pasos:[`Cuece la pasta.`,`Mientras, dora los ajos en láminas con la guindilla a fuego suave.`,`Escurre la pasta guardando un vaso de agua de cocción y saltea todo junto 1 minuto.`]},{titulo:`Pasta con tomate casero`,tiempo:25,dificultad:`fácil`,ingredientes:[`320 g de pasta`,`500 g de tomate triturado`,`1/2 cebolla`,`1 diente de ajo`,`aceite`,`sal`,`orégano`,`una pizca de azúcar`],pasos:[`Sofríe cebolla y ajo 8 minutos.`,`Añade el tomate, sal, orégano y la pizca de azúcar (quita la acidez).`,`Cocina 15 min.`,`Mezcla con la pasta cocida.`]},{titulo:`Pasta con atún y limón`,tiempo:15,dificultad:`fácil`,ingredientes:[`320 g de pasta`,`2 latas de atún`,`ralladura y zumo de 1/2 limón`,`ajo`,`perejil`,`aceite`],pasos:[`Cuece la pasta.`,`Sofríe el ajo, añade el atún desmigado 1 minuto.`,`Mezcla con la pasta, el limón y el perejil.`,`Rápido y completo.`]},{titulo:`Macarrones con queso`,tiempo:20,dificultad:`fácil`,ingredientes:[`300 g de macarrones`,`300 ml de leche`,`30 g de mantequilla`,`30 g de harina`,`150 g de queso rallado`,`nuez moscada`],pasos:[`Bechamel rápida: funde mantequilla, añade harina 1 min, luego la leche poco a poco removiendo.`,`Fuera del fuego, el queso.`,`Mezcla con la pasta cocida y gratina 5 min si quieres.`]},{titulo:`Sopa de ajo (castellana)`,tiempo:20,dificultad:`fácil`,ingredientes:[`4 dientes de ajo`,`pan duro`,`1 cucharadita de pimentón`,`1 litro de caldo o agua`,`2 huevos`,`aceite`],pasos:[`Dora los ajos, añade el pimentón fuera del fuego (que no se queme), el pan troceado y el caldo.`,`Hierve 10 min.`,`Aparta y echa los huevos batidos en hilo removiendo.`]},{titulo:`Crema de calabacín`,tiempo:25,dificultad:`fácil`,ingredientes:[`3 calabacines`,`1 patata`,`1 puerro o cebolla`,`quesitos o nata (opcional)`,`sal`,`aceite`],pasos:[`Sofríe el puerro, añade calabacín y patata troceados, cubre de agua y cuece 15 min.`,`Tritura fino.`,`Rectifica de sal.`,`Un chorrito de aceite crudo al servir.`]},{titulo:`Puré de patata`,tiempo:25,dificultad:`fácil`,ingredientes:[`800 g de patatas` ja precalentada.`]},{titulo:`Quiche de verduras`,tiempo:50,dificultad:`media`,ingredientes:[`1 lámina de masa quebrada`,`3 huevos`,`200 ml de nata`,`queso rallado`,`puerro`,`calabacín`,`sal`,`pimienta`],pasos:[`Forra el molde con la masa y pincha la base.`,`Saltea las verduras.`,`Bate huevos con nata, sal y queso, mezcla con las verduras y vierte.`,`Horno 180°C 30-35 min.`]},{titulo:`Crepes`,tiempo:30,dificultad:`media`,ingredientes:[`250 g de harina`,`500 ml de leche`,`3 huevos`,`30 g de mantequilla fundida`,`una pizca de sal`],pasos:[`Mezcla todo sin grumos y reposa 30 min.`,`Sartén antiadherente con una gota de aceite: un cucharón fino, 1-2 min por cara.`,`Dulces (azúcar, limón, cacao) o saladas.`]},{titulo:`Risotto de setas`,tiempo:40,dificultad:`media`,ingredientes:[`320 g de arroz arborio`,`300 g de setas variadas`,`1 chalota`,`100 ml de vino blanco`,`1 l de caldo caliente`,`mantequilla`,`parmesano`],pasos:[`Saltea las setas y reserva.`,`Sofríe la chalota, nacara el arroz 2 min, añade el vino.`,`Caldo cazo a cazo, removiendo, 18 min.`,`Fuera del fuego: mantequilla fría y parmesano (mantecatura).`,`Setas encima.`]},{titulo:`Fideuá`,tiempo:45,dificultad:`media`,ingredientes:[`350 g de fideos nº4`,`300 g de calamares`,`200 g de gambas`,`1 cebolla`,`2 tomates`,`pimentón`,`azafrán`,`1 l de caldo de pescado`,`alioli`],pasos:[`Dora calamares y gambas, reserva.`,`Sofrito de cebolla y tomate, pimentón y fideos 2 min.`,`Caldo caliente con azafrán: 12-14 min sin apenas remover.`,`El marisco vuelve al final.`,`Con alioli.`]},{titulo:`Merluza en salsa verde`,tiempo:30,dificultad:`media`,ingredientes:[`4 lomos de merluza`,`4 ajos`,`1 vaso de vino blanco`,`1/2 vaso de caldo de pescado`,`perejil`,`harina`,`guisantes o almejas (opcional)`],pasos:[`Salpimienta y enharina la merluza, dórala 1 min por cara.`,`En el aceite, ajos laminados; harina, vino y caldo.`,`Vuelve el pescado y cocina 5 min moviendo la cazuela en vaivén para que ligue.`]},{titulo:`Salmón al horno con limón`,t ón`,`azafrán`,`romero`,`750 ml de caldo de verduras`],pasos:[`Sofríe las verduras en la paellera, añade tomate y pimentón.`,`Arroz 1 min, caldo caliente con azafrán.`,`Fuego fuerte 10 min y suave 8.`,`Romero los últimos 5 min.`,`Reposa 5 tapada.`,`Socarrat opcional: 1 min de fuego fuerte final.`]},{titulo:`Cocido madrileño (versión casera)`,tiempo:180,dificultad:`difícil`,ingredientes:[`300 g de garbanzos (remojados la noche antes)`,`morcillo`,`jarrete o pollo`,`tocino`,`chorizo`,`morcilla`,`2 patatas`,`2 zanahorias`,`1 puerro`,`repollo`,`fideos`],pasos:[`Cuece las carnes y tocino 90 min; añade garbanzos en redecilla 60 min más.`,`Sofríe el repollo aparte.`,`Con el caldo: sopa de fideos (primer vuelco).`,`Luego garbanzos con verduras, y las carnes troceadas (segundo y tercero).`]},{titulo:`Fabada asturiana`,tiempo:150,dificultad:`difícil`,ingredientes:[`500 g de fabes (remojo 12 h)`,`2 chorizos`,`2 morcillas`,`200 g de panceta`,`1 cebolla`,`2 ajos`,`pimentón dulce`,`azafrán`],pasos:[`Cubre las fabes de agua con el compango (chorizo, morcilla, panceta).`,`Espuma y cuece a fuego muy suave 2-2,5 h, 'asustándolas' con agua fría 3 veces.`,`Sofrito de cebolla, ajo y pimentón a mitad.`,`Reposa 30 min antes de servir.`]},{titulo:`Bacalao al pil-pil`,tiempo:45,dificultad:`difícil`,ingredientes:[`4 lomos de bacalao desalado (36 h)`,`200 ml de aceite de oliva`,`6 ajos en láminas`,`1 guindilla`],pasos:[`Confíta el bacalao en el aceite a 60-70°C 8 min y sácalo.`,`Deja el aceite a 40°C y bátelo moviendo la cazuela en vaivén con un colador dentro, hasta que emulsione la gelatina: salsa blanca y ligada.`,`Vuelve el pescado 3 min.`,`Ajos y guindilla dorados aparte.`]},{titulo:`Rabo de toro`,tiempo:210,dificultad:`difícil`,ingredientes:[`1`,`2 kg de rabo de toro en trozos`,`2 cebollas`,`2 zanahorias`,`1 puerro`,`4 ajos`,`250 ml de vino tinto`,`500 ml de caldo`,`laurel`,`clavo`,`pimienta negra`,`harina`],pasos:[`Salpimienta, enharina y dora el rabo.`,`Sofríe las verduras 15 min.`,`Vino: reduce 5 min.`,`Caldo hasta cubrir, especias y 2,5-3 h a fuego mínimo hasta que se desprenda del hueso.`,`Tritura la salsa y reduce.`,`Mejor de un día para otro.`]},{titulo:`Croquetas de jamón`,tiempo:90,dificultad:`difícil`,ingredientes:[`100 g de mantequilla`,`100 g de aceite`,`140 g de harina`,`1 l de leche`,`150 g de jamón picado finísimo`,`nuez moscada; huevo y pan rallado para rebozar`],pasos:[`Bechamel muy espesa: tuesta la harina en las grasas 3 min, leche caliente poco a poco, jamón y nuez moscada, 15 min removiendo.`,`Enfriar en fuente con film a piel: mínimo 4 h.`,`Formar, rebozar (huevo + pan) y freír a 180°C hasta doradas.`]},{titulo:`Calamares en su tinta`,tiempo:75,dificultad:`difícil`,ingredientes:[`800 g de calamares limpios con sus bolsas de tinta`,`2 cebollas`,`2 ajos`,`tomate`,`vino blanco`,`pan frito`,`1 ñora`,`arroz blanco para acompañar`],pasos:[`Sofrito muy lento de cebolla (25 min), ajo y tomate.`,`Majado de pan, ñora y la tinta desleída.`,`Añade los calamares troceados con el majado y el vino; cuece 45 min a fuego suave hasta tiernos.`,`Con arroz blanco.`]},{titulo:`Zarzuela de pescado y marisco`,tiempo:90,dificultad:`difícil`,ingredientes:[`Merluza`,`rape`,`gambas`,`almejas`,`mejillones`,`calamares; sofrito de cebolla`,`tomate y ñoras; majado de almendras`,`ajo y pan; vino blanco`,`caldo de pescado`,`azafrán`],pasos:[`Abre los mejillones y almejas al vapor.`,`Sofrito completo, majado y vino.`,`Caldo con azafrán.`,`Pescados por orden de dureza, marisco al final.`,`10 min de cocción suave total, moviendo la cazuela.`,`Plato de fiesta.`]},{titulo:`Arroz negro`,tiempo:60,dificultad:`difícil`,ingredientes:[`300 g de arroz`,`400 g de sepia o calamar`,`gambas`,`2 bolsas de tinta`,`1 cebolla`,`tomate`,`pimentón`,`800 ml de caldo de pescado`,`alioli`],pasos:[`Sofríe la sepia y la cebolla, añade tomate y pimentón.`,`Desleí la tinta en el caldo caliente.`,`Arroz 2 min en el sofrito, caldo y 18 min sin remover.`,`Gambas los últimos 5 min.`,`Reposa itulo:`Curry de garbanzos y espinacas`,tiempo:30,dificultad:`media`,ingredientes:[`400 g de garbanzos cocidos`,`1 cebolla`,`2 ajos`,`jengibre`,`2 cucharadas de curry`,`tomate triturado`,`200 ml de leche de coco`,`espinacas`,`arroz basmati`],pasos:[`Sofrito de cebolla, ajo y jengibre; curry 1 min; tomate 10 min; garbanzos y leche de coco 10 min; espinacas al final.`,`Con arroz basmati.`]},{titulo:`Hamburguesa casera`,tiempo:25,dificultad:`media`,ingredientes:[`500 g de carne picada de ternera`,`sal`,`pimienta`,`pan de hamburguesa`,`queso`,`lechuga`,`tomate`,`cebolla caramelizada`],pasos:[`Forma hamburguesas gruesas solo con sal y pimienta, sin amasar mucho.`,`Plancha fuerte 3-4 min por cara.`,`Queso encima el último minuto, tapado.`,`Monta con el pan tostado.`]},{titulo:`Alitas de pollo al horno`,tiempo:50,dificultad:`media`,ingredientes:[`1 kg de alitas`,`1 cucharadita de levadura (truco de piel crujiente)`,`sal`,`ajo en polvo`,`pimentón; salsa: miel`,`mostaza y limón`],pasos:[`Seca muy bien las alitas y mezcla con levadura, sal y especias.`,`Horno 120°C 30 min en rejilla y luego 220°C 20 min.`,`Mezcla con la salsa al salir.`]},{titulo:`Salteado de verduras con fideos`,tiempo:20,dificultad:`fácil`,ingredientes:[`200 g de fideos de arroz o trigo`,`brócoli`,`zanahoria`,`pimiento`,`2 ajos`,`jengibre`,`salsa de soja`,`aceite de sésamo`,`(huevo opcional)`],pasos:[`Cuece los fideos.`,`Wok o sartén muy caliente: verduras duras primero, 3-4 min.`,`Fideos, soja y sésamo; saltea 2 min.`,`Un huevo revuelto dentro si quieres más proteína.`]},{titulo:`Ensaladilla rusa`,tiempo:40,dificultad:`media`,ingredientes:[`4 patatas`,`2 zanahorias`,`150 g de guisantes`,`2 huevos`,`aceitunas`,`atún (opcional)`,`mayonesa casera`,`sal`],pasos:[`Cuece patatas y zanahorias enteras con piel 25-30 min; los huevos aparte 10 min.`,`Pela y trocea frío.`,`Mezcla con guisantes, huevo, aceitunas y atún.`,`Mayonesa al gusto.`,`2 h de nevera.`]},{titulo:`Ensalada César`,tiempo:20,dificultad:`fácil`,ingredientes:[`Lechuga romana`,`pechuga de pollo a la plancha`,`pan tostado en dados`,`parmesano. Salsa: mayonesa`,`ajo`,`limón`,`anchoas`,`mostaza`],pasos:[`Salsa: mezcla todos sus ingredientes.`,`Pollo a la plancha en tiras.`,`Lechuga troceada, picatostes, pollo y parmesano en lascas.`,`Aliña generosamente.`]},{titulo:`Sopa castellana de ajo con jamón`,tiempo:20,dificultad:`fácil`,ingredientes:[`La sopa de ajo de siempre + 100 g de jamón serrano en taquitos`],pasos:[`Haz la sopa de ajo y añade el jamón junto al pan.`,`Los huevos escalfados enteros dentro de la sopa los últimos 4 min en vez de batidos: versión de fiesta.`]},{titulo:`Pan casero rápido`,tiempo:120,dificultad:`media`,ingredientes:[`500 g de harina de fuerza`,`325 ml de agua templada`,`7 g de levadura seca`,`10 g de sal`],pasos:[`Mezcla y amasa 10 min.`,`Leva 1 h tapado.`,`Forma la hogaza, leva 30 min más.`,`Horno 230°C con un cuenco de agua dentro: 30-35 min, golpeando la base debe sonar hueca.`]},{titulo:`Rosquillas de anís`,tiempo:60,dificultad:`media`,ingredientes:[`3 huevos`,`150 g de azúcar`,`100 ml de aceite`,`anís dulce`,`ralladura de limón`,`400 g de harina`,`1 sobre de levadura; azúcar para rebozar`],pasos:[`Mezcla húmedos y azúcar, luego harina con levadura.`,`Forma rosquillas, fríe en aceite medio hasta dorar por dentro y fuera.`,`Reboza en azúcar.`]},{titulo:`Leche frita`,tiempo:120,dificultad:`difícil`,ingredientes:[`1 l de leche`,`100 g de maicena`,`40 g de harina`,`150 g de azúcar`,`cáscara de limón`,`canela en rama`,`3 yemas; rebozado: harina`,`huevo; azúcar y canela`],pasos:[`Espesa la leche infusionada con maicena, harina, yemas y azúcar a fuego suave 10 min removiendo.`,`Vierte en fuente 2 cm de alto y enfría 3 h.`,`Corta cuadrados, reboza y fríe.`,`Azúcar y canela.`]},{titulo:`Buñuelos de viento`,tiempo:60,dificultad:`difícil`,ingredientes:[`250 ml de agua`,`50 g de mantequilla`,`150 g de harina`,`4 huevos`,`una pizca de sal`,`azúcar`,`aceite para freír`],pasos:[`Hierve agua con mantequilla y sal, echa la harina de golpe y seca la masa 2 min al fuego.`,`Fuera, los huevos de uno en uno.`,`Fríe cucharadas en aceite medio: se hinchan solos.`,`Azúcar por encima.`]},L(`Huevos rotos con jamón`,20,`fácil`,[`4 patatas medianas`,`4 huevos`,`100 g de jamón serrano en tacos o lonchas`,`aceite de oliva`,`sal`],[`Pela las patatas y córtalas en gajos no muy gruesos. Sécalas con un paño.`,`Fríelas en aceite de oliva a fuego medio, 12–15 minutos, hasta que estén tiernas y doradas.`,`Escúrrelas y ponlas en una fuente. Sal justa.`,`En el mismo aceite, a fuego suave, cuaja los huevos: la clara hecha y la yema blanda.`,`Ponlos encima de las patatas y rómpelos con una cuchara para que la yema bañe.`,`Reparte el jamón por encima. Sirve al momento, bien caliente.`]),L(`Migas extremeñas`,40,`media`,[`400 g de pan del día anterior`,`4 dientes de ajo`,`100 g de panceta o torrezno`,`100 g de chorizo`,`1 pimiento verde`,`aceite de oliva`,`sal`,`pimiento choricero o pimentón (opcional)`],[`Corta el pan en dados pequeños. Rocíalo con un poco de agua y sal. Déjalo reposar 20 minutos tapado con un paño: debe quedar húmedo, no empapado.`,`Sofríe los ajos enteros, aplastados, en aceite abundante. Sácalos cuando doren.`,`En el mismo aceite, dora la panceta y el chorizo en rodajas. Reserva.`,`Pocha el pimiento en tiras. Añade el pan y revuelve sin parar 10–12 minutos, a fuego medio, hasta que las migas se suelten y doren.`,`Devuelve ajos, panceta y chorizo. Rectifica de sal.`,`Sirve con uvas o un huevo frito si te gusta.`]),L(`Patatas a lo pobre`,35,`fácil`,[`5 patatas`,`2 cebollas`,`1 pimiento verde`,`3 dientes de ajo`,`aceite de oliva`,`sal`,`perejil`],[`Corta las patatas en rodajas de medio centímetro, la cebolla en pluma y el pimiento en tiras.`,`En una sartén ancha con aceite, pocha primero la cebolla y el pimiento 8 minutos a fuego medio.`,`Añade las patatas y los ajos laminados. Sal.`,`Tapa y cocina 20 minutos a fuego medio-bajo, removiendo de vez en cuando para que no se peguen. Deben quedar tiernas, no fritas duras.`,`Si quieres, sube el fuego 2 minutos al final para que doren un poco por debajo.`,`Perejil picado y a la mesa. Van bien con huevo frito o un lomo.`]),L(`Patatas panaderas`,70,`fácil`,[`1 kg de patatas`,`2 cebollas`,`4 dientes de ajo`,`un vaso de caldo o agua`,`aceite de oliva`,`sal`,`tomillo o romero`],[`Calienta el horno a 190 °C.`,`Pela y corta las patatas en rodajas de 1 cm. La cebolla, en pluma.`,`Unta una fuente con aceite. Haz una cama de cebolla, luego las patatas, ajos enteros aplastados, sal, tomillo y un chorro de aceite.`,`Echa el caldo hasta que asome, sin cubrir del todo.`,`Hornea 55–60 minutos, hasta que las patatas estén blandas y doradas por encima.`,`Si se secan, añade un chorrito de caldo a mitad de cocción.`]),L(`Coliflor gratinada`,45,`fácil`,[`1 coliflor`,`500 ml de leche`,`40 g de harina`,`40 g de mantequilla`,`100 g de queso rallado`,`nuez moscada`,`sal`],[`Separa la coliflor en ramilletes. Cuécelos 8 minutos en agua con sal. Escurre bien.`,`Haz una bechamel: derrite la mantequilla, echa la harina y cuece 1 minuto removiendo.`,`Añade la leche caliente poco a poco, sin grumos. 8 minutos a fuego suave. Sal y nuez moscada.`,`Pon la coliflor en una fuente, cubre con bechamel y el queso.`,`Gratín 12 minutos a 200 °C, hasta que dore.`,`Deja reposar 3 minutos antes de servir: quema.`]),L(`Acelgas con patata y ajo`,30,`fácil`,[`1 manojo de acelgas`,`2 patatas`,`3 dientes de ajo`,`aceite de oliva`,`sal`,`pimentón dulce`],[`Lava las acelgas. Separa pencas y hojas. Corta las pencas en trozos.`,`Cuece las patatas en trozos con las pencas 12 minutos en agua con sal. Añade las hojas 4 minutos más.`,`Escurre, reservando medio cazo de agua de cocción.`,`En una sartén, sofríe los ajos laminados. Aparta del fuego, echa una cucharadita de pimentón y un chorro del agua de cocción para que no se queme.`,`Vuelve las verduras y las patatas a la sartén. Da unas vueltas 3 minutos.`,`Prueba la sal. Sirve caliente, con un huevo si quieres.`]),L(`Habas con jamón`,25,`fácil`,[`500 g de habas (frescas o congeladas)`,`80 g de jamón serrano en tacos`,`2 dientes de ajo`,`aceite de oliva`,`sal`,`un huevo (opcional)`],[`Si las habas son frescas, quítales la vaina. Las congeladas, directas a la sartén.`,`Sofríe el ajo laminado y el jamón 2 minutos en aceite, sin que el jamón se ponga de piedra.`,`Añade las habas y un chorrito de agua. Tapa 10–12 minutos a fuego medio.`,`Sal poca: el jamón ya sala. Remueve.`,`Si quieres, cuaja un huevo en el centro los últimos 3 minutos, tapado.`,`Sirve con pan para mojar.`]),L(`Guisantes con jamón`,20,`fácil`,[`400 g de guisantes (frescos o congelados)`,`80 g de jamón serrano`,`1 cebolleta o ½ cebolla`,`1 diente de ajo`,`aceite de oliva`,`sal`,`huevo (opcional)`],[`Pocha la cebolla picada y el ajo en aceite, 5 minutos, sin que doren de más.`,`Añade el jamón en tacos 1 minuto.`,`Echa los guisantes y medio vaso de agua. Tapa 10 minutos.`,`Sal justa. Si se seca, otro chorrito de agua: deben quedar jugosos.`,`Opcional: un huevo revuelto al final, fuera del fuego fuerte.`,`Pan y listo.`]),L(`Espárragos a la plancha con huevo`,15,`fácil`,[`1 manojo de espárragos verdes`,`2 huevos`,`aceite de oliva`,`sal`,`un poco de limón`],[`Corta la parte dura del palo (la que no parte fácil). Lava.`,`Plancha o sartén bien caliente con un hilo de aceite.`,`Los espárragos 4–5 minutos, dándoles la vuelta, hasta que tomen color y queden al dente.`,`Sal y unas gotas de limón.`,`En la misma plancha, cuaja los huevos al gusto.`,`Sirve los huevos encima o al lado. Un poco de jamón va muy bien.`]),L(`Alcachofas al horno con jamón`,40,`fácil`,[`8 alcachofas`,`80 g de jamón serrano`,`3 dientes de ajo`,`aceite de oliva`,`zumo de medio limón`,`sal`,`perejil`],[`Calienta el horno a 190 °C.`,`Quita las hojas duras de fuera, corta el palo y las puntas. Abre un poco el corazón. Pásalas por agua con limón para que no ennegrezcan.`,`Ponlas en una fuente, corazón hacia arriba. Dentro: ajo picado, jamón, sal, aceite y un chorrito de agua.`,`Tapa con papel de aluminio 20 minutos.`,`Quita el papel y hornea 10 minutos más para que doren.`,`Perejil y a la mesa.`]),L(`Escalivada`,55,`fácil`,[`2 berenjenas`,`2 pimientos rojos`,`2 cebollas`,`2 tomates`,`aceite de oliva`,`sal`,`vinagre (opcional)`],[`Horno a 200 °C. Pon las verduras enteras en una bandeja, con un hilo de aceite.`,`Asa 40–45 minutos, hasta que la piel se arrugue y se pueda pelar. Da la vuelta a mitad.`,`Deja templar tapadas con un paño: así se pelan mejor.`,`Pela, quita semillas y corta en tiras largas.`,`Aliña con aceite abundante, sal y, si quieres, cuatro gotas de vinagre.`,`Sirve templada o fría, con anchoas o atún. Aguanta 3 días en nevera.`]),L(`Ajo blanco malagueño`,15,`fácil`,[`100 g de almendras crudas`,`100 g de pan del día anterior, sin corteza`,`1 diente de ajo (o 2 si te gusta fuerte)`,`100 ml de aceite de oliva`,`2 cucharadas de vinagre de vino`,`agua fría`,`sal`,`uvas o manzana para servir`],[`Remoja el pan 5 minutos en agua. Escúrrelo.`,`Tritura almendras, ajo, pan, vinagre y sal.`,`Añade el aceite en hilo, como una mayonesa, y agua fría hasta que quede como un gazpacho espeso.`,`Prueba: debe picar el ajo, acidito y con cuerpo.`,`Enfría al menos 1 hora.`,`Sirve con uvas moscatel o daditos de manzana.`]),L(`Pipirrana jaenera`,20,`fácil`,[`3 tomates maduros`,`1 pimiento verde italiano`,`½ cebolla tierna`,`1 pepino (opcional)`,`1 huevo duro`,`aceite de oliva`,`vinagre`,`sal`],[`Pica el tomate, el pimiento y la cebolla en daditos pequeños, todos del mismo tamaño.`,`El pepino, si lo usas, pelado y en daditos. El huevo, picado.`,`Aliña con aceite generoso, un chorrito de vinagre y sal.`,`Remueve y deja 10 minutos: suelta jugo.`,`Prueba y rectifica.`,`Pan para mojar el fondo. En nevera, 1 día.`]),L(`Pulpo a la gallega`,60,`media`,[`1 pulpo congelado (ya ablandado, 1–1,5 kg)`,`1 kg de patatas`,`pimentón dulce`,`sal gorda`,`aceite de oliva`],[`El pulpo congelado, descongélalo en nevera. No hace falta golpearlo: el frío lo ablanda.`,`Olla grande con agua. Cuando hierva, «asusta» el pulpo: mételo y sácalo 3 veces para que se rize.`,`Déjalo cocer 35–40 minutos (cuenta 1 minuto por cada 100 g, más o menos). Apaga y deja 10 minutos en el agua.`,`Cuece las patatas con piel en otra olla. Pela y córtalas en rodajas. Ponlas de cama en una fuente.`,`Corta el pulpo en rodajas de 1 cm. Encima de las patatas.`,`Sal gorda, pimentón dulce y un buen chorro de aceite. No lo calientes después: se pone chicle.`]),L(`Dorada a la sal`,40,`fácil`,[`1 dorada grande, limpia, entera`,`1,5 kg de sal gorda`,`2 claras de huevo (opcional, para la costra)`,`limón`,`aceite de oliva`],[`Horno a 200 °C.`,`Mezcla la sal con las claras: queda como nieve húmeda. Si no, solo sal gorda bien apretada.`,`Cama de sal en una bandeja. Pon el pescado encima (entero, con escamas: la sal no debe tocar la carne).`,`Cubre del todo con sal, como un sarcófago, sin huecos.`,`Hornea 25–30 minutos (cuenta unos 20 min por kilo).`,`Rompe la costra en la mesa, retira la piel y sirve con aceite y limón.`]),L(`Lubina al horno con patatas`,45,`fácil`,[`1 lubina de 800 g, limpia`,`4 patatas`,`1 cebolla`,`1 limón`,`3 dientes de ajo`,`perejil`,`aceite de oliva`,`sal`,`vino blanco (un chorrito)`],[`Horno a 190 °C. Corta las patatas y la cebolla en rodajas. Ponlas de cama en una fuente, con aceite y sal.`,`Hornea la cama 15 minutos.`,`Salpimenta el pescado por dentro. Mete rodajas de limón, ajo y perejil en la tripa.`,`Ponlo sobre las patatas. Aceite por encima y un chorrito de vino.`,`Hornea 20–25 minutos más. La carne se separa del lomo cuando está.`,`Sirve con el jugo de la fuente.`]),L(`Trucha a la navarra`,25,`fácil`,[`4 truchas limpias`,`8 lonchas de jamón serrano`,`harina para enharinar`,`aceite de oliva`,`sal`,`ajos y perejil (opcional)`],[`Seca las truchas. Sal suave por dentro. Mete 1 o 2 lonchas de jamón en cada tripa.`,`Enharina por fuera, sacude el resto.`,`Fríe en sartén con aceite caliente, 4–5 minutos por lado, hasta que la piel dore y la carne esté opaca.`,`Saca a una fuente. Si quieres, en el mismo aceite sofríe ajo laminado y perejil 20 segundos y riégalas.`,`No las pases: se secan.`,`Patata cocida o ensalada al lado.`]),L(`Merluza a la romana`,25,`fácil`,[`4 lomos de merluza`,`2 huevos`,`harina`,`aceite de oliva para freír`,`sal`,`limón`],[`Seca los lomos. Sal.`,`Pásalos por harina, sacude, y luego por huevo batido.`,`Aceite caliente pero no humeante (si quema, el huevo se pone negro y el pescado crudo).`,`Fríe 3–4 minutos por lado, hasta que el rebozado esté dorado.`,`Escurre en papel de cocina.`,`Limón al lado. Ensalada o patatas.`]),L(`Pollo con tomate`,50,`fácil`,[`1 pollo troceado (o 8 muslos)`,`800 g de tomate triturado`,`1 cebolla`,`3 dientes de ajo`,`1 hoja de laurel`,`aceite de oliva`,`sal`,`pimienta`,`un vaso de vino blanco (opcional)`],[`Salpimienta el pollo. Dóralo en una cazuela con aceite, por tandas. Reserva.`,`En la misma cazuela, pocha la cebolla picada 8 minutos. Añade el ajo 1 minuto.`,`Echa el vino si lo usas y deja que evapore 2 minutos.`,`Tomate, laurel, sal. Vuelve el pollo. El tomate debe casi cubrir.`,`Tapa y cocina 30 minutos a fuego medio-bajo. Remueve de vez en cuando.`,`Si la salsa está clara, destapa 5 minutos. Sirve con patata o arroz blanco.`]),L(`Pollo en pepitoria`,70,`media`,[`1 pollo troceado`,`2 cebollas`,`3 dientes de ajo`,`100 g de almendras tostadas`,`2 huevos duros`,`1 hoja de laurel`,`azafrán o colorante`,`un vaso de vino blanco`,`aceite de oliva`,`sal`,`perejil`],[`Dora el pollo salpimentado. Reserva.`,`Pocha la cebolla y 1 ajo. Echa el vino y el laurel. Vuelve el pollo y cubre con agua. 35 minutos a fuego medio.`,`Picada: almendras, yemas de los huevos duros, el ajo que queda, perejil y un cazo de caldo del pollo. Tritura fino.`,`Añade la picada a la cazuela. Azafrán. 10 minutos más, removiendo: la salsa espesa.`,`Las claras picadas por encima.`,`Reposa 5 minutos. Pan para la salsa.`]),L(`Conejo al ajillo`,50,`fácil`,[`1 conejo troceado`,`8 dientes de ajo`,`1 hoja de laurel`,`un vaso de vino blanco`,`perejil`,`aceite de oliva`,`sal`,`pimienta`],[`Seca el conejo. Salpimienta. Dóralo bien en cazuela con aceite: el color da el sabor.`,`Añade los ajos enteros, aplastados, y el laurel. 2 minutos.`,`Echa el vino. Deja 2 minutos que olvide el alcohol.`,`Cubre a medias con agua. Tapa 30 minutos a fuego medio.`,`Destapa y reduce 5 minutos si queda muy caldoso.`,`Perejil picado. Patatas fritas o panaderas.`]),L(`Cordero al horno con patatas`,90,`media`,[`1,5 kg de pierna o paletilla de cordero`,`1 kg de patatas`,`1 cebolla`,`1 cabeza de ajos`,`romero o tomillo`,`aceite de oliva`,`sal`,`un vaso de vino blanco o agua`],[`Horno a 180 °C. Salpimienta el cordero. Haz unos cortes y mete ajos.`,`Cama de patatas en rodajas y cebolla en una fuente grande, con aceite y sal.`,`El cordero encima, romero, un chorro de aceite y el vaso de vino.`,`Tapa con aluminio 50 minutos.`,`Quita el papel, sube a 200 °C y dora 20–25 minutos más. Riega con el jugo a mitad.`,`Reposa 10 minutos antes de trinchar. El jugo, en salsera.`]),L(`Chuletas de cerdo a la sidra`,35,`fácil`,[`4 chuletas de cerdo`,`1 cebolla`,`1 vaso de sidra`,`1 manzana`,`aceite de oliva`,`sal`,`pimienta`],[`Salpimienta las chuletas. Dóralas 3 minutos por lado en sartén. Reserva.`,`En la misma grasa, pocha la cebolla 6 minutos. Añade la manzana en gajos 3 minutos.`,`Echa la sidra y rasca el fondo. 3 minutos.`,`Vuelve las chuletas. Tapa 8–10 minutos a fuego medio: el cerdo no debe quedar crudo ni de piedra.`,`Si la salsa está clara, saca las chuletas y reduce 2 minutos.`,`Sirve con el jugo y la manzana encima. Puré o pan.`]),L(`Carrilleras en salsa`,150,`media`,[`1 kg de carrilleras de ternera o cerdo`,`2 cebollas`,`2 zanahorias`,`3 dientes de ajo`,`1 vaso de vino tinto`,`1 cucharada de tomate frito`,`1 hoja de laurel`,`aceite de oliva`,`sal`,`pimienta`,`harina para enharinar`],[`Limpia las carrilleras de telillas. Salpimienta y enharina. Dóralas. erda el color rosa.`,`Echa el tomate, sal y la leche. Fuego bajo 30 minutos, removiendo. Debe espesar.`,`Cuece la pasta al dente.`,`Mezcla pasta y salsa en la cazuela 1 minuto.`,`Queso en la mesa.`]),L(`Canelones de carne`,70,`media`,[`12 placas de canelones`,`400 g de carne picada (o resto de asado picado)`,`1 cebolla`,`1 diente de ajo`,`bechamel: 50 g de mantequilla, 50 g de harina, 700 ml de leche`,`tomate frito (4 cucharadas)`,`queso rallado`,`sal`,`nuez moscada`],[`Sofríe cebolla, ajo y carne. Sal. Un poco de tomate. Deja enfriar.`,`Cuece las placas según el paquete. Extiéndelas en un paño húmedo para que no se peguen.`,`Bechamel: mantequilla, harina 1 minuto, leche caliente, 8 minutos. Sal y nuez moscada.`,`Rellena cada placa, enróllala y ponla en una fuente untada.`,`Cubre con bechamel y queso.`,`Horno 200 °C, 20 minutos, hasta gratinar. Reposa 5 minutos.`]),L(`Huevos rellenos`,30,`fácil`,[`6 huevos`,`2 latas de atún`,`4 cucharadas de mayonesa`,`10 aceitunas`,`pimiento del piquillo o tomate`,`sal`,`perejil`],[`Cuece los huevos 10 minutos. Enfría en agua. Péla y párte por la mitad.`,`Saca las yemas a un bol. Añade atún escurrido, mayonesa, aceitunas picadas y sal.`,`Machaca con tenedor hasta crema.`,`Rellena las claras. Una tira de piquillo o una gota de tomate encima.`,`Perejil. Enfría 20 minutos.`,`Aguantan 1 día en nevera, tapados.`]),L(`Magdalenas de limón`,40,`fácil`,[`3 huevos`,`180 g de azúcar`,`180 g de harina`,`80 ml de aceite de oliva suave o girasol`,`ralladura de 1 limón`,`1 sobre de levadura química (16 g)`,`un pellizco de sal`,`cápsulas de magdalena`],[`Horno a 180 °C. Capsulas en el molde.`,`Bate huevos y azúcar hasta que blanqueen y doblen, 4 minutos.`,`Añade el aceite en hilo y la ralladura.`,`Tamiza harina, levadura y sal. Mezcla con una espátula, sin pasarte, hasta que no se vea harina.`,`Llena las cápsulas a 3/4. Un pellizco de azúcar encima ayuda a la copeta.`,`20–22 minutos. Están cuando al pinchar salga limpio. Enfrían en rejilla.`]),L(` es, devolver la llamada. Se tacha. No hace falta una app. Si se cae el papel, hay otro debajo con un imán.`,[`Cita médica: día, hora, planta, qué llevar (ayunas, DNI, tarjeta).`,`Lo que falta en la cocina, en cuanto se acaba, no el domingo.`,`Un teléfono de hijo, grande.`],`La lista no es de olvidadizos: es de gente que tiene más de tres cosas que hacer.`,`Las amas de casa llevaban la lista en el bolso. La nevera es el bolso de la casa.`,`Un imán, un boli que escriba, un papel que no sea el de las galletas.`),U(`despiste`,`Si no recuerdas una calle`,`🗺️`,`No hace falta el nombre. Hace falta volver.`,`Si sales y se te va el nombre de la calle, busca un sitio fijo: una iglesia, un banco, un bar de siempre. Pregunta «¿hacia la plaza?» no «¿dónde estoy yo?». El DNI en el bolsillo. Un papel con tu dirección y un teléfono.`,[`Tarjeta en el monedero: nombre, calle, teléfono.`,`Si hay mareo, siéntate. No corras.`,`112 si no puedes volver y hay mal cuerpo.`],`Perder el nombre no es perder la casa. El cuerpo recuerda el camino más de lo que crees.`,`Antes se preguntaba al sereno. Ahora, a cualquiera con cara de pueblo. La mayoría ayuda.`,`Una nota en el monedero, hoy. No es de niños. Es de listos.`),U(`despiste`,`El fuego y la cazuela`,`🔥`,`Si dudas, apaga. Se puede volver a calentar.`,`Si no recuerdas si apagaste el fuego, vuelve. No «seguro que sí». El vitrocerámico se mira: si hay H, está caliente. El gas se huele. Un reloj de cocina (el de Casa) es más fiel que la memoria.`,[`Nunca aceite al fuego y a otra habitación.`,`Tetera: silba por algo.`,`Si huele a quemado, ventanas y nada de agua en aceite.`],`La mayoría de los sustos de cocina son de un minuto de despiste, no de un aparato malo.`,`Las abuelas no se iban con el puchero. El teléfono nos ha sacado de la cocina con el fuego puesto.`,`Timer de Casa al poner algo. Y si dudas, apaga.`),U(`despiste`,`Pastillas de hoy`,`💊`,`El pastillero habla. La memoria, no.`,`Un pastillero de la semana, o las tomas en Casa, en Salud. No se deja «a ver si me acuerdo después de merendar». Si no sabes si la tomaste, no tomes otra a ciegas: mira el pastillero o el historial. El médico manda el cambio, no el vecino.`,[`Mañana, mediodía, tarde, noche: cuatro cajitas.`,`Si se cae una pastilla al fregadero, no se recupera.`,`La caja original guarda el nombre feo que el médico entiende.`],`«Me la tomé, creo» es la frase más cara de la farmacia.`,`El pastillero semanal es de los 80. Sigue siendo el invento más barato de la casa.`,`Casa apunta las tomas. Si hay duda, se mira, no se apuesta.`),U(`despiste`,`Llamar a un hijo y no saber qué decir`,`📞`,`Di una sola cosa. El resto sobra.`,`«Estoy bien. Te llamo porque no encuentro las llaves / porque me ha venido un recado / porque me he mareado un poco.» Un asunto por llamada. Si es mareo o pecho, 112 primero, hijo después.`,[`Escribe antes: tres palabras en un papel.`,`Si no coge, mensaje de voz corto.`,`Hora: no a las once de la noche por el pan.`],`Los hijos temen el silencio y el rollo. Una frase clara los deja dormir.`,`El teléfono era de pasillo y se hablaba de pie. Por eso se iba al grano.`,`Un papel junto al teléfono: 112, hijo, médico, vecinos.`),U(`despiste`,`El nombre que no sale`,`💬`,`No es el principio del fin. Es un cajón atascado.`,`El nombre de la vecina a veces no sale. Se espera. Se describe: «la del tercero, la del perro blanco». No hace falta disculparse tres veces. Si pasa a menudo con cosas de hoy (qué comiste, si tomaste la pastilla), se habla con el médico. Una vez a la semana, no.`,[`Listín con fotos pequeñas de familia, nombres grandes.`,`No examinares a nadie en la mesa.`,`Sudokus no evitan esto; hablar y andar, más.`],`El cerebro busca por el lado. Por eso sale «empieza por M» antes que el nombre.`,`Cicerón ya se quejaba de la memoria. No es un invento de ahora.`,`Un cuaderno de nombres junto al teléfono. Se escribe cuando se sabe, no cuando se olvida.`),U(`despiste`,`Salir de casa: un repaso`,`🚪`,`Fuego, llaves, luces, ventana, bolso.`,`En la puerta, siempre el mismo orden: fuego, llaves, móvil, monedero, gafas. Cinco toques. Si sales con prisa, igual. La prisa es la que deja el gas.`,[`Un cartel pequeño detrás de la puerta, de tu letra.`,`Abrigo en el mismo perchero.`,`Si vuelves por las llaves, aprovecha y mira el fuego.`],`Los pilotos tienen lista. Tú también vuelas: sales a la calle.`,`Las listas de comprobación vienen de la aviación de los años 30. Funcionan porque no fían de la memoria.`,`Cinco palabras en la puerta. Hoy.`),U(`despiste`,`Si te encuentras mal y estás solo`,`🆘`,`Siéntate. Agua. 112 si empeora.`,`Mareo, pecho, falta de aire, cara torcida, un lado que no responde: no se espera a que «se me pase». 112. Di calle y número. Abre la puerta si puedes. Si es un susto pequeño, siéntate, no te quedes en el plato de ducha.`,[`112 es gratis y no se enfadan por «una tontería» que era un infarto.`,`Vecino del rellano: un pacto de timbre.`,`No conduzcas a urgencias si estás mal: te recogen.`],`El orgullo mata más que el teléfono. Llamar no es molestar.`,`El 061 y el 112 se unificaron para no tener que recordar tres números. Uno basta.`,`En el teléfono, 112 el primero. De memoria y en un papel.`),U(`despiste`,`El reloj y las citas`,`⏰`,`La cita se apunta el día que te la dan.`,`Al salir del médico, se apunta: día, hora, planta, ayunas sí o no. En Casa, en la agenda. Un aviso el día antes. No se fía del «ya me acordaré» ni del papelito de la bata que se lava.`,[`Foto al volante si no tienes ganas de escribir. Luego se pasa a Casa.`,`Llegar 15 minutos antes, no una hora (cansas) ni en punto (corres).`,`Tarjeta sanitaria y DNI en el mismo bolsillo.`],`Perder una cita no es solo el hueco: es otro mes de espera.`,`Las cartillas de citas del ambulatorio eran un librillo. El móvil las escondió en un SMS que nadie guarda.`,`Agenda de Casa el mismo día. No esa noche.`),U(`despiste`,`Gafas, audífono, bastón`,`👓`,`Cada cosa, un nido.`,`Las gafas: mesilla y un segundo par en el bolso. El audífono de noche, en su cajita, no en el plato. El bastón junto a la puerta, no detrás de una silla. Lo que no tiene sitio, se pierde.`,[`Pilas de audífono en un cajón etiquetado.`,`Gafas de sol aparte, para no mezclar.`,`Una cinta al cuello si te las dejas en cada banco.`],`Buscar las gafas con las gafas en la cabeza es clásico porque es verdad.`,`Franklin llevaba dos pares. No por vanidad: por vista.`,`Dos nidos por objeto. Uno cerca de la cama, otro cerca de la puerta.`),U(`despiste`,`Cuando el día se mezcla`,`🌫️`,`Luz, agua, alguien al otro lado.`,`Si el día no encaja (no sabes si es mañana, te cuesta nombrar la cocina), siéntate a la luz, bebe agua, llama a alguien y di cómo te encuentras. No conduzcas. No te encierres. Un episodio suelto puede ser calor, tensión, una pastilla nueva. Varios, médico.`,[`Un calendario grande tachando el día.`,`La radio por la mañana pone hora al día.`,`No tomes otra pastilla «por si acaso».`],`El desconcierto da vergüenza. La vergüenza retrasa la ayuda.`,`Las casas antiguas tenían reloj de pared y campanas. El tiempo se oía. Ahora hay que ponerlo a la vista.`,`Calendario grande. Radio. Teléfono a mano.`),U(`modem`,`Qué es el módem`,`📦`,`La cajita de luces es la puerta a internet.`,`El módem (o router) es el aparato que te da la wifi y, si hay cable, el internet de la tele y el teléfono fijo. Suele estar en la entrada o el salón, con un cable gordo de la pared (fibra) y luces. Sin esa caja, el móvil puede tener datos; el wifi de casa, no.`,[`No lo tapones detrás de un sillón: se calienta.`,`El cable de la pared no se tira «porque estorba».`,`Pegatina con la clave wifi: no se tira.`],`Router quiere decir «el que reparte». Reparte internet a los aparatos.`,`Antes el módem chillaba. La fibra es silenciosa. Por eso se olvida que existe, hasta que falla.`,`Míralo hoy: dónde está, si respira, dónde está la clave.`),U(`modem`,`Las luces del router`,`💡`,`Verde o blanca fija suele ser «va». Roja o parpajeo raro, no.`,`Cada marca pinta distinto, pero: luz de corriente (power) encendida; luz de fibra o internet encendida; wifi encendida. Si internet parpadea en rojo o está apagada y las demás no, hay corte o el aparato se ha colgado. No se abre. Se reinicia.`,[`Foto a las luces cuando va bien. Así comparas el día malo.`,`Naranja a veces es «está pensando». Espera un minuto.`,`Sin luces: mira el enchufe primero.`],`Las luces son el único idioma del aparato. No hace falta el manual si tienes una foto del día bueno.`,`Los módems de los 90 tenían un ojo rojo que daba miedo. Ahora parecen un adorno. Siguen hablando con luces.`,`Una foto en el teléfono: «luces bien».`),U(`modem`,`No hay internet`,`🚫`,`Enchufe, espera, apaga, enciende. Luego la compañía.`,`Orden: 1) ¿Hay luz en casa? 2) ¿El módem tiene luces? 3) Espera dos minutos. 4) Desenchufa el módem, cuenta hasta 20, enchufa. Espera tres minutos. 5) Si sigue muerto, prueba el móvil con datos (sin wifi) para ver si es tu casa o el mundo. 6) Llama a la compañía, el número de la factura.`,[`Reiniciar no es capricho: es lo que te pedirán igual.`,`El móvil en wifi y sin wifi se cambia en el icono de abanico.`,`Avería general: el vecino también está sin red. Pregunta.`],`El 80 % de «no va internet» se cura con un apagado. El aparato se ahoga, no se rompe.`,`El soporte técnico inventó «¿ha reiniciado?» porque funciona. No para tomarte el pelo.`,`Papel con el teléfono de la fibra, junto al módem.`),U(`modem`,`Apagar el módem`,`⏻`,`Se puede. De noche, incluso se agradece.`,`Apagar el módem de noche corta wifi, a veces el teléfono fijo si va por internet, y la tele si es «smart» y necesita red. El móvil sigue con datos si los hay. Apagar ahorra un poco y da paz. Encender por la mañana: tres minutos hasta que vuelve.`,[`Un enchufe con interruptor evita pelearte con el cable.`,`Si el fijo es de fibra, apagar = sin fijo. El 112 del móvil sigue.`,`No apagues y enciendas cada diez minutos: déjalo respirar.`],`Internet no se «gasta» por dejarlo abierto, como el agua. Pero el aparato vive más si descansa y no se cuece.`,`En los 90 se desconectaba el teléfono para que no llamaran. El gesto es el mismo.`,`Si te da igual el fijo de noche, apágalo al acostarte.`),U(`modem`,`Wifi o datos`,`📶`,`El abanico es casa. Las rayas o LTE son la calle.`,`Wifi: internet del módem, no gasta la tarifa del móvil (o casi). Datos: internet del teléfono, por antena, sí gasta tarifa. En casa, wifi. En la calle, datos. Si en casa usas datos sin querer, se acaba el bono y va lento.`,[`Elige tu wifi (el nombre de la pegatina), no la del vecino.`,`«Wifi pública» del bar: no entres al banco por ahí.`,`Avión: corta todo. Útil en el médico.`],`Wifi no es «gratis mágico». Lo pagas en la factura de la fibra.`,`La palabra wifi ni siquiera quiere decir nada claro. Se quedó porque se podía decir.`,`En casa, comprueba el abanico. Si no está, te estás comiendo los datos.`),U(`modem`,`La clave de la wifi`,`🔑`,`Está en una pegatina. No en la cabeza.`,`En el reverso o debajo del módem hay un nombre (SSID) y una clave larga. Esa es la de casa. Si alguien la pide para el móvil, se la das tú, no un desconocido. Se puede cambiar, pero entonces hay que volver a meterla en la tele y en todo.`,[`Foto a la pegatina.`,`No la digas en voz alta en el portal.`,`Si la cambió un técnico, que la escriba grande.`],`La clave de fábrica es fea a propósito: para que no sea «1234».`,`Las primeras wifis se abrían sin clave. Por eso el vecino se colaba. Ya no.`,`Foto y un papel en el cajón del módem.`),U(`modem`,`El cable de la fibra`,`🧵`,`Fino, de la pared al módem. No se dobla del todo.`,`Es el cable que trae internet. Si se pisa, se dobla en ángulo vivo o se arranca al pasar la aspiradora, se va la red y a veces la tele. No es el cable de la luz. Si se suelta, se encaja en el clic, sin fuerza de más.`,[`Pasa la aspiradora con la mano en el cable.`,`No lo escondas bajo una alfombra gruesa.`,`Si se rompe, técnico: no cinta aislante.`],`La fibra es un hilo de vidrio. El vidrio no se anuda.`,`Sustituyó al ADSL de cobre, el de las cajas de teléfono en la calle.`,`Mira ahora que no esté tenso como una cuerda de tender.`),U(`modem`,`Internet va lento`,`🐢`,`Un aparato a full, o el vecindario a la misma hora.`,`Si va lento: cierra el vídeo de la tele, mira si hay una actualización colgada, acércate al módem, reinicia. De 8 a 11 de la noche va peor en muchos edificios. Un móvil viejo también «ve» mal la wifi.`,[`Dos metros del módem valen más que un amuleto.`,`El microondas a veces come wifi si están juntos.`,`Reinicia el teléfono, no solo el módem.`],`Lento no es lo mismo que caído. Caído: no abre nada. Lento: abre, pero bosteza.`,`El horario de prime time televisivo es también el de las redes. Coincidimos todos.`,`Prueba junto al módem. Si ahí va bien, el problema es la distancia, no la factura.`),U(`modem`,`El técnico de la compañía`,`👷`,`DNI, cita, y no se lleva el módem «para revisar» sin papel.`,`Vienen con cita. Enseña DNI. No pagas en mano una «cuota extra». No dan la clave del banco. Si llaman por teléfono pidiendo datos de la tarjeta para «no cortarte la línea», cuelga: es cuento.`,[`El número bueno está en la factura, no en el recado.`,`Acompáñalos al módem, no a los cajones.`,`Pide que te dejen escrito lo que han tocado.`],`El uniforme se fabrica. La factura, no.`,`Las estafas de «su internet se va a cortar» crecieron con la fibra, porque nadie entiende del todo el aparato.`,`Factura a mano cuando vengan. Y ningún PIN.`),U(`modem`,`Apagón y el módem`,`🕯️`,`Sin luz, sin wifi. El móvil puede seguir un rato.`,`El módem se apaga con el corte. Al volver la luz, dale tres o cinco minutos. Si no vuelve, reinicio. El móvil, si tiene batería y datos, sigue. El fijo de fibra, no. Una linterna no es internet, pero ayuda a no tropezar con el aparato.`,[`Regleta con interruptor: todo el rincón en un gesto.`,`Tras un apagón largo, a veces hay que reiniciar también la tele.`,`No enchufes el módem a un enchufe que chispotea.`],`Internet parece un aire. Es electricidad. Sin una, sin lo otro.`,`Las centrales tienen baterías. Tu salón, no.`,`Linterna cerca. Al volver la luz, espera antes de enfadarte con el aparato.`),U(`tele`,`El mando de verdad`,`📡`,`Uno para la tele. Otro, si acaso, para el descodificador.`,`Si hay dos mandos, uno suele ser de la tele (volumen, encender) y otro de la plataforma (Movistar, Orange, el de las películas). El volumen casi siempre es el de la tele. Cambiar de canal, el otro. Si mezclas, «no va» y sí va.`,[`Una goma o una cinta de color en el de la tele.`,`Pilas nuevas antes de echarle la culpa al aparato.`,`No apiles mandos en el sofá: el que queda abajo se pisa y se va el canal.`],`La mitad de las averías de tele son pilas o el mando apuntando al armario.`,`El primer mando a distancia de salón es de los 50. Antes se levantaba.`,`Dos mandos, dos colores. Hoy.`),U(`tele`,`Sin señal`,`📴`,`HDMI, fuente, cable. Por ese orden.`,`«Sin señal» o «no hay input» suele ser que la tele está mirando por el agujero equivocado. En el mando: botón Fuente, Source, HDMI o AV. Elige HDMI 1 o 2, el del descodificador. Mira el cable de detrás, el plano, que esté clicado.`,[`Foto de la trasera cuando va bien.`,`No tires del cable: del conector.`,`Si hay tormentas, a veces se va y vuelve sola.`],`La tele puede estar perfecta y mirando al HDMI vacío. Es como abrir la ventana equivocada.`,`Antes había un botón de «AV» y se entendía. Ahora hay cinco HDMI y un menú en inglés.`,`Anota en un papel: «películas = HDMI 1». Lo pegas detrás del mando.`),U(`tele`,`La tele no enciende`,`🔌`,`Luz de la tele, enchufe, mando, espera.`,`Una lucecita en el marco: si está, hay corriente. Prueba el botón de la tele, no solo el mando. Enchufe. Si hubo apagón, espera. No abras detrás. Si huele a quemado, se desenchufa y se llama.`,[`El botón físico suele estar abajo, en el centro, o atrás a la derecha.`,`Una regleta apagada parece una tele rota.`,`Pantalla negra con sonido: brillo al mínimo o HDMI malo.`],`Muchas teles «muertas» estaban en reposo y el m
