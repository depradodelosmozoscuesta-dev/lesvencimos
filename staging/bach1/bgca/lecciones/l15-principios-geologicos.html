<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>L15 · Laboratorio · Reconstruye el corte</title>
<style>
:root{--bg:#FAF7F0;--ink:#2A2620;--muted:#5C564C;--card:#fff;--gold:#C4A15A;--gold-soft:#F5EDD8;--gold-deep:#8A6B2F;--green:#3D6B4F;--green-soft:#E4F0E8;--blue:#2F5D7A;--blue-soft:#E3EEF4;--rose:#9B3A4A;--rose-soft:#F8E8EB;--line:#E0D0A8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;line-height:1.45}
body{padding:14px 12px 32px}
.wrap{max-width:860px;margin:0 auto}
.badge{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--gold-deep);background:var(--gold-soft);padding:4px 10px;border-radius:999px}
h1{font-size:1.45rem;line-height:1.25;margin:.4rem 0 .3rem}
.lead{color:var(--muted);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.q{font-weight:750;margin:0 0 8px}
.opts{display:grid;gap:8px}
button.opt,button.chip{font:inherit;text-align:left;background:#fff;border:2px solid #D9D0C0;border-radius:12px;padding:10px 12px;cursor:pointer;font-weight:650}
button.opt:hover,button.chip:hover{border-color:var(--gold)}
button.opt.ok,button.chip.ok{border-color:var(--green);background:var(--green-soft)}
button.opt.bad{border-color:var(--rose);background:var(--rose-soft)}
button.opt:disabled{cursor:default}
.why{margin:8px 0 0;font-size:.95rem}
.why strong{color:var(--gold-deep)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.slot{min-height:42px;border:2px dashed #C4B8A0;border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;background:#FFFcf5}
.bar{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:8px 0}
.score{font-weight:800;color:var(--gold-deep)}
button.action{font:inherit;font-weight:800;border:0;border-radius:999px;background:var(--gold);color:#1A160E;padding:8px 14px;cursor:pointer}
footer{color:var(--muted);font-size:.8rem;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="badge">Lección 15 · bloque C · sin red</div>
  <h1>Reconstruye el corte</h1>
  <p class="lead">El mismo corte de la lección. Ordena y elige el principio que decide cada contacto. No hay edades numéricas escondidas.</p>
  <div class="bar"><span class="score" id="score">0</span><button type="button" class="action" id="reset">Reiniciar</button></div>
  <div id="lab"></div>
  <footer>Les vencimos · laboratorio autónomo · sin red · corrección inmediata</footer>
</div>
<script>

function boot(ITEMS){
  var root=document.getElementById("lab");
  var score=0, done=0;
  var sc=document.getElementById("score");
  function paint(){ sc.textContent=score+" / "+ITEMS.length; }
  ITEMS.forEach(function(it,i){
    var card=document.createElement("section");
    card.className="card";
    var h=document.createElement("p");
    h.className="q";
    h.textContent=(i+1)+". "+it.q;
    card.appendChild(h);
    if(it.tipo==="orden"){
      var slot=document.createElement("div");
      slot.className="slot";
      var pool=document.createElement("div");
      pool.className="row";
      var picked=[];
      function judge(){
        var ok=picked.length===it.correcto.length && picked.every(function(p,k){return p===it.correcto[k];});
        done++; if(ok) score++;
        paint();
        var w=document.createElement("p");
        w.className="why";
        w.innerHTML=(ok?"<strong>Correcto.</strong> ":"<strong>No es esa secuencia.</strong> Orden: "+it.correcto.join(" → ")+". ")+it.porque;
        card.appendChild(w);
        pool.querySelectorAll("button").forEach(function(b){b.disabled=true;});
      }
      it.piezas.forEach(function(txt){
        var b=document.createElement("button");
        b.type="button"; b.className="chip"; b.textContent=txt;
        b.addEventListener("click", function(){
          if(b.disabled) return;
          b.disabled=true; b.className="chip ok";
          picked.push(txt); slot.appendChild(b);
          if(picked.length===it.correcto.length) judge();
        });
        pool.appendChild(b);
      });
      var hint=document.createElement("p");
      hint.className="why";
      hint.textContent="Pulsa en orden, del primero al último.";
      card.appendChild(hint); card.appendChild(slot); card.appendChild(pool);
    } else {
      var opts=document.createElement("div");
      opts.className="opts";
      it.opciones.forEach(function(op){
        var b=document.createElement("button");
        b.type="button"; b.className="opt"; b.textContent=op.t;
        b.addEventListener("click", function(){
          if(card.dataset.done) return;
          card.dataset.done="1"; done++;
          opts.querySelectorAll("button").forEach(function(x){x.disabled=true;});
          if(op.ok){ b.classList.add("ok"); score++; }
          else {
            b.classList.add("bad");
            opts.querySelectorAll("button").forEach(function(x,idx){ if(it.opciones[idx].ok) x.classList.add("ok"); });
          }
          paint();
          var w=document.createElement("p");
          w.className="why";
          w.innerHTML=(op.ok?"<strong>Correcto.</strong> ":"<strong>No.</strong> ")+it.porque;
          card.appendChild(w);
        });
        opts.appendChild(b);
      });
      card.appendChild(opts);
    }
    root.appendChild(card);
  });
  paint();
  document.getElementById("reset").addEventListener("click", function(){ location.reload(); });
  window.addEventListener("message", function(ev){
    var d=ev.data||{};
    if(d.type==="maestro:reset") location.reload();
    if(d.type==="maestro:highlight"){
      var c=root.querySelector(".card"); if(c) c.style.outline="3px solid #C4A15A";
    }
  });
}

boot([{"tipo": "orden", "q": "Ordena el corte del ejemplo, del suceso más antiguo al más moderno.", "piezas": ["Falla F que desplaza también a E", "Conglomerado E con cantos", "Erosión que bisela el dique", "Dique D", "Arenisca C", "Lutita B", "Caliza A con trilobites"], "correcto": ["Caliza A con trilobites", "Lutita B", "Arenisca C", "Dique D", "Erosión que bisela el dique", "Conglomerado E con cantos", "Falla F que desplaza también a E"], "porque": "Superposición en serie normal para A-B-C. Corte para el dique. La erosión lo bisela. Inclusiones en E. La falla es la última porque mueve E."}, {"tipo": "test", "q": "¿Qué principio obliga a poner el dique después de la arenisca C?", "opciones": [{"t": "La relación de corte: D atraviesa C.", "ok": true}, {"t": "La superposición, porque todo lo vertical es más antiguo.", "ok": false}, {"t": "La sucesión faunística del dique, que contiene trilobites.", "ok": false}, {"t": "La semivida del carbono-14.", "ok": false}], "porque": "El dique no es una capa de encima. Es posterior a todo lo que atraviesa, y no lleva la fauna de A."}, {"tipo": "test", "q": "Los cantos de material del dique dentro de E demuestran que…", "opciones": [{"t": "El dique es anterior al conglomerado.", "ok": true}, {"t": "El dique es posterior al conglomerado.", "ok": false}, {"t": "E y D tienen la misma edad.", "ok": false}, {"t": "La falla es anterior a A.", "ok": false}], "porque": "Una inclusión es más antigua que la roca huésped. El canto ya era fragmento cuando E se depositó."}, {"tipo": "test", "q": "Si E cubriera la falla sin estar desplazado, la falla sería…", "opciones": [{"t": "Anterior a E y posterior a lo que sí desplaza.", "ok": true}, {"t": "El suceso más moderno, igual que en el dibujo.", "ok": false}, {"t": "Anterior a la caliza A.", "ok": false}, {"t": "Una inclusión dentro de A.", "ok": false}], "porque": "Lo que sella sin heredar el salto es posterior. Es el cambio que pide el reto."}, {"tipo": "test", "q": "La horizontalidad original no afirma que…", "opciones": [{"t": "Un arrecife o una duna nazcan como un plano perfecto.", "ok": true}, {"t": "Una lutita marina tiende a depositarse en capas tendidas.", "ok": false}, {"t": "Una capa que hoy está vertical fue deformada después, si nació plana.", "ok": false}, {"t": "La gravedad actúa sobre el sedimento.", "ok": false}], "porque": "El principio vale para el depósito desde un fluido que tiende a la horizontal. Hay relieves primarios."}, {"tipo": "test", "q": "Correlacionar la caliza A a los dos lados de la falla usa, además del fósil,…", "opciones": [{"t": "La continuidad lateral: era una capa, luego separada y desplazada.", "ok": true}, {"t": "La semivida, porque los dos bloques tienen el mismo color.", "ok": false}, {"t": "Que todo lo que está a la derecha es siempre más joven.", "ok": false}, {"t": "Que los trilobites datan la falla en años.", "ok": false}], "porque": "Reconocer el mismo cuerpo a ambos lados es continuidad más el salto de la falla. El color solo no bastaría."}, {"tipo": "test", "q": "¿Qué no está autorizado por este corte?", "opciones": [{"t": "Poner un millón de años a la erosión previa a E.", "ok": true}, {"t": "Decir que B es posterior a A en serie normal.", "ok": false}, {"t": "Decir que F es posterior a E.", "ok": false}, {"t": "Decir que los trilobites están en A y no fechan el dique.", "ok": false}], "porque": "El hueco erosivo se ordena, no se numera. No hay isótopo ni espesor que valga como cronómetro."}, {"tipo": "test", "q": "La sucesión faunística, tal como la usó Smith, es ante todo…", "opciones": [{"t": "Un orden de conjuntos de fósiles útil para correlacionar.", "ok": true}, {"t": "Una medida de semivida en el fósil.", "ok": false}, {"t": "La prueba de que las capas nacen verticales.", "ok": false}, {"t": "Un mapa de Pangea.", "ok": false}], "porque": "El orden empírico de faunas correlaciona. La lectura evolutiva es posterior y compatible, pero el principio no calcula años."}]);
</script>
</body>
</html>
