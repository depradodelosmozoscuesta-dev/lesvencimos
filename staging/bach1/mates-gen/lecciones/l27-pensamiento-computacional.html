<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Lab L27 · Euclides paso a paso</title>
<link rel="stylesheet" href="../leccion-shell.css"/>
<style>body{margin:0;padding:1rem;background:#0E0E0C;color:#E6E1D6;font-family:system-ui,sans-serif}
h1{font-size:1.15rem;color:#C4A15A} .panel{background:#161512;border:1px solid #C4A15A;border-radius:10px;padding:.8rem;margin:.6rem 0}
button{font:inherit;font-weight:700;padding:.35rem .75rem;border-radius:999px;border:1px solid #C4A15A;background:transparent;color:#E6E1D6;cursor:pointer;margin:.2rem}
canvas{display:block;width:100%;max-width:640px;background:#12100e;border:1px solid #9A9488;border-radius:8px}
input,select{background:#161512;color:#E6E1D6;border:1px solid #C4A15A;border-radius:6px;padding:.3rem .5rem}
.out{min-height:2rem;color:#8F9A72;margin-top:.5rem}</style></head>
<body>
<p><a href="leccion-27-pensamiento-computacional.html" style="color:#C4A15A">← Volver a la lección 27</a></p>
<h1>Laboratorio · L27 · Euclides paso a paso</h1>

<div class="panel">
<p>Algoritmo de Euclides, el del ejemplo: mientras el segundo número no sea 0, se sustituye el par por (divisor, resto). Prueba 48 y 18, y después otro par.</p>
<label>a <input id="a" type="number" value="48" min="1" max="9999"/></label>
<label>b <input id="b" type="number" value="18" min="0" max="9999"/></label>
<button id="go" type="button">Calcular restos</button>
<div class="out" id="out"></div>
<canvas id="c" width="640" height="200"></canvas>
</div>
<script>
function pintar(pares){
  var cv=document.getElementById('c'), ctx=cv.getContext('2d');
  ctx.fillStyle='#12100e'; ctx.fillRect(0,0,640,200);
  ctx.strokeStyle='#9A9488'; ctx.beginPath(); ctx.moveTo(40,170); ctx.lineTo(600,170); ctx.stroke();
  var n=Math.max(1, pares.length);
  pares.forEach(function(p,i){
    var x=60+i*(520/n);
    var h=Math.min(130, p[0]);
    ctx.fillStyle='#C4A15A'; ctx.fillRect(x,170-h,18,h);
    ctx.fillStyle='#8F9A72'; ctx.fillRect(x+22,170-Math.min(130,p[1]),18,Math.min(130,p[1]));
    ctx.fillStyle='#E6E1D6'; ctx.font='12px sans-serif';
    ctx.fillText(p[0]+','+p[1], x, 188);
  });
}
document.getElementById('go').onclick=function(){
  var a=parseInt(document.getElementById('a').value,10);
  var b=parseInt(document.getElementById('b').value,10);
  if(!(a>0) || b<0){ document.getElementById('out').textContent='a debe ser positivo y b no negativo.'; return; }
  var pares=[[a,b]], lineas=[];
  var guard=0;
  while(b!==0 && guard<30){
    var q=Math.floor(a/b), r=a%b;
    lineas.push(a+' = '+q+' · '+b+' + '+r);
    a=b; b=r; pares.push([a,b]); guard++;
  }
  document.getElementById('out').textContent=lineas.join('  →  ')+'  →  mcd = '+a;
  pintar(pares);
};
document.getElementById('go').onclick();
</script>

</body></html>
