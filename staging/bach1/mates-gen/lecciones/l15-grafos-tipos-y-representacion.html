<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Lab L15 · Grados de un grafo dirigido</title>
<link rel="stylesheet" href="../leccion-shell.css"/>
<style>body{margin:0;padding:1rem;background:#0E0E0C;color:#E6E1D6;font-family:system-ui,sans-serif}
h1{font-size:1.15rem;color:#C4A15A} .panel{background:#161512;border:1px solid #C4A15A;border-radius:10px;padding:.8rem;margin:.6rem 0}
button{font:inherit;font-weight:700;padding:.35rem .75rem;border-radius:999px;border:1px solid #C4A15A;background:transparent;color:#E6E1D6;cursor:pointer;margin:.2rem}
canvas{display:block;width:100%;max-width:640px;background:#12100e;border:1px solid #9A9488;border-radius:8px}
input,select{background:#161512;color:#E6E1D6;border:1px solid #C4A15A;border-radius:6px;padding:.3rem .5rem}
.out{min-height:2rem;color:#8F9A72;margin-top:.5rem}</style></head>
<body>
<p><a href="leccion-15-grafos-tipos-y-representacion.html" style="color:#C4A15A">← Volver a la lección 15</a></p>
<h1>Laboratorio · L15 · Grados de un grafo dirigido</h1>

<div class="panel">
<p>Grafo dirigido del ejemplo: arcos A→B, B→C, C→A y A→C. Pulsa para ver grados de salida y de entrada.</p>
<button id="go" type="button">Calcular grados</button>
<div class="out" id="out"></div>
<canvas id="c" width="640" height="220"></canvas>
</div>
<script>
function dib(){
  var cv=document.getElementById('c'), ctx=cv.getContext('2d');
  ctx.fillStyle='#12100e'; ctx.fillRect(0,0,640,220);
  var P={A:[120,110],B:[320,40],C:[320,180]};
  var E=[['A','B'],['B','C'],['C','A'],['A','C']];
  ctx.strokeStyle='#C4A15A'; ctx.lineWidth=2;
  E.forEach(function(e){var a=P[e[0]], b=P[e[1]]; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();});
  ctx.fillStyle='#E6E1D6'; ctx.font='16px sans-serif';
  Object.keys(P).forEach(function(k){ctx.beginPath(); ctx.arc(P[k][0],P[k][1],16,0,6.3); ctx.fillStyle='#1C1A16'; ctx.fill(); ctx.stroke(); ctx.fillStyle='#E6E1D6'; ctx.fillText(k,P[k][0]-5,P[k][1]+5);});
}
document.getElementById('go').onclick=function(){
  document.getElementById('out').textContent='Salida: A=2, B=1, C=1. Entrada: A=1, B=1, C=2. En un dirigido no coinciden.';
};
dib();
</script>

</body></html>
