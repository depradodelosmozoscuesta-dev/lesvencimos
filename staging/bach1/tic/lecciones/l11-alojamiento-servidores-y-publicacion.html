<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Laboratorio L11 · Alojamiento, servidores y publicación</title>
<style>
:root{--ink:#0E0E0C;--amber:#C4A15A;--paper:#FAF7F0;--line:rgba(14,14,12,.14);--blue:#2F5D7A;--green:#3D6B4F;--bad:#A85A3C}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.45}
header{padding:.7rem 1rem;border-bottom:2px solid var(--amber);background:#fff}
header h1{margin:0;font-size:1.05rem;font-family:Palatino,Georgia,serif}
header p{margin:.2rem 0 0;font-size:.8rem;color:#5C564C}
main{padding:.75rem 1rem 2rem;max-width:62rem}
label{display:block;font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#5C564C;margin:.55rem 0 .2rem}
textarea,input[type=text],input[type=number],select{width:100%;font:14px/1.4 ui-monospace,monospace;border:1px solid var(--line);border-radius:6px;padding:.4rem .5rem;background:#fff;color:var(--ink)}
textarea{min-height:11rem;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0}
button{background:var(--amber);color:#1A160E;border:0;border-radius:4px;padding:.45rem .75rem;font-weight:700;cursor:pointer}
button.sec{background:#fff;border:1px solid var(--line)}
.grid{display:grid;gap:.75rem}
@media(min-width:800px){.grid.dos{grid-template-columns:1fr 1fr}}
iframe.pv,.pv{width:100%;min-height:280px;border:1px solid var(--line);border-radius:8px;background:#fff}
.out{font-size:.9rem;background:#fff;border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem}
.ok{color:var(--green);font-weight:700}.bad{color:var(--bad);font-weight:700}
canvas{width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
.nota{font-size:.82rem;color:#5C564C}
.lab-row{display:flex;flex-wrap:wrap;gap:.4rem;margin:.45rem 0}
.lab-out{font-size:.9rem;background:#fff;border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem;margin-top:.35rem}
.lab-canvas{width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;display:block}
.lab-preview{width:100%;min-height:260px;border:1px solid var(--line);border-radius:8px;background:#fff}
h2{font-family:Palatino,Georgia,serif;font-size:1.05rem}
</style>
</head>
<body>
<header>
  <h1>Laboratorio · L11 · Alojamiento, servidores y publicación</h1>
  <p>Offline, en esta página. No se envía nada a un servidor. Carbón + ámbar.</p>
</header>
<main>

<p class="nota">Publicar, aquí, es empaquetar archivos y entender la ruta. No hay alta en un hosting real.</p>
<label for="fname">Archivo</label>
<select id="fname"><option>index.html</option><option>estilos.css</option><option>LEEME.txt</option></select>
<label for="body">Contenido</label>
<textarea id="body" spellcheck="false"></textarea>
<div class="lab-row">
  <button type="button" id="bLoad" class="sec">Cargar</button>
  <button type="button" id="bKeep">Guardar en el paquete</button>
  <button type="button" id="bMap" class="sec">Ver mapa de rutas</button>
  <button type="button" id="bZip">Descargar ZIP</button>
</div>
<label for="dom">Nombre de dominio (solo explicación)</label>
<input id="dom" type="text" value="cienciaduero.ies.edu.es" placeholder="ejemplo.dominio"/>
<div id="out" class="lab-out"></div>

</main>
<script>

function byId(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function say(html){var o=byId("out"); if(o) o.innerHTML=html;}



function crc32(bytes){
  if(!crc32.t){
    crc32.t=[];
    for(var n=0;n<256;n++){var c=n; for(var k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); crc32.t[n]=c>>>0;}
  }
  var crc=0xFFFFFFFF;
  for(var i=0;i<bytes.length;i++) crc=crc32.t[(crc^bytes[i])&255]^(crc>>>8);
  return (crc^0xFFFFFFFF)>>>0;
}
function u16(n){return [n&255,(n>>>8)&255];}
function u32(n){return [n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];}
function zipStore(files){
  var enc=new TextEncoder();
  var locals=[], centrals=[], offset=0;
  files.forEach(function(f){
    var name=enc.encode(f.name), data=enc.encode(f.text), crc=crc32(data);
    var lh=u32(0x04034b50).concat(u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0));
    var lb=new Uint8Array(lh.length+name.length+data.length);
    lb.set(lh,0); lb.set(name,lh.length); lb.set(data,lh.length+name.length);
    locals.push(lb);
    var ch=u32(0x02014b50).concat(u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset));
    var cb=new Uint8Array(ch.length+name.length);
    cb.set(ch,0); cb.set(name,ch.length); centrals.push(cb);
    offset+=lb.length;
  });
  var csize=centrals.reduce(function(a,b){return a+b.length;},0);
  var eocd=u32(0x06054b50).concat(u16(0),u16(0),u16(files.length),u16(files.length),u32(csize),u32(offset),u16(0));
  var parts=locals.concat(centrals,[new Uint8Array(eocd)]);
  var total=parts.reduce(function(a,b){return a+b.length;},0);
  var out=new Uint8Array(total), o=0;
  parts.forEach(function(p){out.set(p,o); o+=p.length;});
  return new Blob([out],{type:"application/zip"});
}
function saveBlob(name, blob){
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name; a.click();
}

var files={
"index.html":"<!DOCTYPE html>\n<html lang=\"es\">\n<head><meta charset=\"utf-8\"/><title>IES Duero</title><link rel=\"stylesheet\" href=\"estilos.css\"/></head>\n<body><h1>Semana de la Ciencia</h1><p>Página estática.</p></body></html>\n",
"estilos.css":"body{font-family:Georgia,serif;background:#FAF7F0;color:#0E0E0C;margin:2rem}\nh1{border-bottom:3px solid #C4A15A}\n",
"LEEME.txt":"Paquete local de la Semana de la Ciencia.\nAbrir index.html con el navegador (file://) o descomprimir en la carpeta pública de un hosting estático.\nNo incluye base de datos.\n"
};
function load(){ byId("body").value=files[byId("fname").value]; }
byId("bLoad").onclick=load;
byId("fname").onchange=load;
byId("bKeep").onclick=function(){ files[byId("fname").value]=byId("body").value; say("<span class='ok'>Actualizado en el paquete de esta página.</span>"); };
byId("bMap").onclick=function(){
  var dom=(byId("dom").value||"ejemplo.local").replace(/^https?:\/\//,"").split("/")[0];
  var rows=Object.keys(files).map(function(name){
    return "<li><code>https://"+esc(dom)+"/"+esc(name)+"</code> ← archivo <code>"+esc(name)+"</code> en la carpeta pública</li>";
  }).join("");
  say("<p>Un dominio no es el servidor: el DNS traduce el nombre a una IP, y el servidor entrega la carpeta.</p><ul>"+rows+"</ul><p class='nota'>Esta página no consulta ningún DNS. El nombre de arriba es un ejemplo didáctico.</p>");
};
byId("bZip").onclick=function(){
  files[byId("fname").value]=byId("body").value;
  var list=Object.keys(files).map(function(k){return {name:k, text:files[k]};});
  saveBlob("sitio-ies-duero.zip", zipStore(list));
  say("<span class='ok'>ZIP método store (sin comprimir, sí empaquetado). Ábrelo en local y comprueba que index.html enlaza estilos.css con ruta relativa.</span>");
};
load();

</script>
</body>
</html>
