<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Laboratorio L07 · Maquetación: folleto e infografía</title>
<style>
:root{--ink:#0E0E0C;--amber:#C4A15A;--paper:#FAF7F0;--line:rgba(14,14,12,.14);--blue:#2F5D7A;--green:#3D6B4F;--bad:#A85A3C}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.45}
header{padding:.7rem 1rem;border-bottom:2px solid var(--amber);background:#fff}
header h1{margin:0;font-size:1.05rem;font-family:Palatino,Georgia,serif}
header p{margin:.2rem 0 0;font-size:.8rem;color:#5C564C}
main{padding:.75rem 1rem 2rem;max-width:62rem}
label{display:block;font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#5C564C;margin:.55rem 0 .2rem}
textarea,input[type=text],input[type=number],select{width:100%;font:14px/1.4 ui-monospace,monospace;border:1px solid var(--line);border-radius:6px;padding:.4rem .5rem;background:#fff;color:var(--ink)}
textarea{min-height:11rem;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0}
button{background:var(--amber);color:#1A160E;border:0;border-radius:4px;padding:.45rem .75rem;font-weight:700;cursor:pointer}
button.sec{background:#fff;border:1px solid var(--line)}
.grid{display:grid;gap:.75rem}
@media(min-width:800px){.grid.dos{grid-template-columns:1fr 1fr}}
iframe.pv,.pv{width:100%;min-height:280px;border:1px solid var(--line);border-radius:8px;background:#fff}
.out{font-size:.9rem;background:#fff;border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem}
.ok{color:var(--green);font-weight:700}.bad{color:var(--bad);font-weight:700}
canvas{width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
.nota{font-size:.82rem;color:#5C564C}
.lab-row{display:flex;flex-wrap:wrap;gap:.4rem;margin:.45rem 0}
.lab-out{font-size:.9rem;background:#fff;border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem;margin-top:.35rem}
.lab-canvas{width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;display:block}
.lab-preview{width:100%;min-height:260px;border:1px solid var(--line);border-radius:8px;background:#fff}
h2{font-family:Palatino,Georgia,serif;font-size:1.05rem}
</style>
</head>
<body>
<header>
  <h1>Laboratorio · L07 · Maquetación: folleto e infografía</h1>
  <p>Offline, en esta página. No se envía nada a un servidor. Carbón + ámbar.</p>
</header>
<main>

<p class="nota">Folleto en el lienzo de esta página. No abre otro programa.</p>
<label for="tit">Titular</label><input id="tit" type="text" value="Semana de la Ciencia"/>
<label for="sub">Subtítulo</label><input id="sub" type="text" value="IES Duero · Aranda de Duero"/>
<label for="cuando">Fecha y lugar</label><input id="cuando" type="text" value="Jueves 16 · salón de actos · 17:00"/>
<label for="bg">Fondo</label><input id="bg" type="text" value="#0E0E0C"/>
<label for="fg">Tinta</label><input id="fg" type="text" value="#FAF7F0"/>
<div class="lab-row">
  <button type="button" id="bDraw">Maquetar</button>
  <button type="button" id="bPng" class="sec">Descargar PNG</button>
</div>
<canvas id="cv" class="lab-canvas" width="640" height="400"></canvas>
<div id="out" class="lab-out">Zonas: franja ámbar, titular, dato práctico, pie.</div>

</main>
<script>

function byId(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function say(html){var o=byId("out"); if(o) o.innerHTML=html;}


function draw(){
  var c=byId("cv"), g=c.getContext("2d");
  var bg=byId("bg").value||"#0E0E0C", fg=byId("fg").value||"#FAF7F0";
  g.fillStyle=bg; g.fillRect(0,0,640,400);
  g.fillStyle="#C4A15A"; g.fillRect(0,0,18,400);
  g.fillStyle=fg; g.font="700 42px Palatino, Georgia, serif";
  wrap(g, byId("tit").value, 48, 90, 520, 48);
  g.font="22px Palatino, Georgia, serif"; g.fillStyle="#C4A15A";
  g.fillText(byId("sub").value, 48, 230);
  g.font="20px Segoe UI, sans-serif"; g.fillStyle=fg;
  g.fillText(byId("cuando").value, 48, 290);
  g.font="14px Segoe UI, sans-serif"; g.fillStyle="#C4A15A";
  g.fillText("Entrada libre hasta completar aforo", 48, 350);
  say("<span class='ok'>Folleto horizontal. El PNG se genera en el navegador, no en un servidor.</span>");
}
function wrap(g, text, x, y, max, lh){
  var words=text.split(/\s+/), line="";
  words.forEach(function(w){
    var t=line?line+" "+w:w;
    if(g.measureText(t).width>max){ g.fillText(line,x,y); y+=lh; line=w; }
    else line=t;
  });
  if(line) g.fillText(line,x,y);
}
byId("bDraw").onclick=draw;
byId("bPng").onclick=function(){
  draw();
  var a=document.createElement("a");
  a.href=byId("cv").toDataURL("image/png");
  a.download="folleto-ies-duero.png"; a.click();
};
draw();

</script>
</body>
</html>
