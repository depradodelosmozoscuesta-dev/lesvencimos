<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <!-- VitaInk HUD: tower eye (Sheikah-like inspired, ORIGINAL stylized) -->
  <!-- Outer eye almond -->
  <path
    d="M18 64
       Q40 28 64 28
       Q88 28 110 64
       Q88 100 64 100
       Q40 100 18 64 Z"
    fill="#A8DADC"
    stroke="#1D3557"
    stroke-width="3"
    stroke-linejoin="round"/>
  <!-- Iris -->
  <circle cx="64" cy="64" r="22"
    fill="#457B9D"
    stroke="#1D3557"
    stroke-width="2.5"/>
  <!-- Pupil -->
  <circle cx="64" cy="64" r="10"
    fill="#1D3557"/>
  <!-- Highlight -->
  <circle cx="56" cy="56" r="5" fill="#FFFFFF" opacity="0.85"/>
  <!-- Upper lid crease -->
  <path d="M28 58 Q64 40 100 58" fill="none" stroke="#1D3557" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <!-- Tear-mark accent (original, not trademark tear) — small chevron below -->
  <path d="M64 100 L58 112 L64 108 L70 112 Z"
    fill="#457B9D"
    stroke="#1D3557"
    stroke-width="1.5"
    stroke-linejoin="round"/>
</svg>
