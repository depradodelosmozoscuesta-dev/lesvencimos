<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <!-- VitaInk currency: hexagonal crystal leaf / ink-drop gem — ORIGINAL (not rupee) -->
  <!-- Outer hex crystal -->
  <path
    d="M64 16 L98 36 L98 76 L64 112 L30 76 L30 36 Z"
    fill="#2A9D8F"
    stroke="#1B4332"
    stroke-width="3"
    stroke-linejoin="round"/>
  <!-- Inner facet (leaf vein diamond) -->
  <path
    d="M64 28 L86 42 L86 70 L64 96 L42 70 L42 42 Z"
    fill="#3DB8A8"
    stroke="#1B4332"
    stroke-width="1.5"
    stroke-linejoin="round"
    opacity="0.95"/>
  <!-- Gold highlight facet (top-left) -->
  <path
    d="M64 28 L86 42 L64 52 L42 42 Z"
    fill="#E9C46A"
    stroke="#B08900"
    stroke-width="1.2"
    stroke-linejoin="round"
    opacity="0.9"/>
  <!-- Ink-drop core -->
  <ellipse cx="64" cy="62" rx="10" ry="14" fill="#1B4332" opacity="0.35"/>
  <path d="M64 48 C58 56 58 66 64 74 C70 66 70 56 64 48 Z"
    fill="#E9C46A" opacity="0.75"/>
  <!-- Soft shine -->
  <path d="M48 40 Q52 34 58 36" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
</svg>
