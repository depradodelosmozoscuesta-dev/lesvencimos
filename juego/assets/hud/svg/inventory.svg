<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <!-- VitaInk HUD: inventory satchel pouch — ORIGINAL -->
  <!-- Bag body -->
  <path
    d="M28 52
       Q26 52 26 56
       L26 96
       Q26 108 40 108
       L88 108
       Q102 108 102 96
       L102 56
       Q102 52 100 52
       Z"
    fill="#8B5E3C"
    stroke="#5C4033"
    stroke-width="3"
    stroke-linejoin="round"/>
  <!-- Flap -->
  <path
    d="M24 52
       Q24 36 40 32
       L64 28
       L88 32
       Q104 36 104 52
       L24 52 Z"
    fill="#D4A373"
    stroke="#5C4033"
    stroke-width="3"
    stroke-linejoin="round"/>
  <!-- Strap / handle -->
  <path
    d="M44 32 Q44 16 64 14 Q84 16 84 32"
    fill="none"
    stroke="#5C4033"
    stroke-width="4"
    stroke-linecap="round"/>
  <!-- Stitch line on flap -->
  <path
    d="M36 46 L92 46"
    stroke="#5C4033"
    stroke-width="2"
    stroke-dasharray="4 3"
    stroke-linecap="round"
    opacity="0.7"/>
  <!-- Buckle / clasp -->
  <rect x="56" y="48" width="16" height="12" rx="3"
    fill="#E9C46A"
    stroke="#5C4033"
    stroke-width="2"/>
  <!-- Side stitch accents -->
  <path d="M38 64 L38 96" stroke="#5C4033" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.55"/>
  <path d="M90 64 L90 96" stroke="#5C4033" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.55"/>
</svg>
