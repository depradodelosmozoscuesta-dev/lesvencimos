<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VitaInk / Atenas</title>
    <style>*{box-sizing:border-box;margin:0;padding:0}html,body{color:#e8ecd8;background:#1a1f16;width:100%;height:100%;font-family:system-ui,sans-serif;overflow:hidden}#app{width:100%;height:100%;position:relative}canvas#game{cursor:crosshair;background:#2a3528;width:100%;height:100%;display:block}#hud{pointer-events:none;z-index:4;background:#0c100ac7;border:1px solid #b4c88c59;border-radius:10px;flex-direction:column;gap:5px;max-width:min(380px,88vw);padding:8px 12px;font-size:13px;line-height:1.35;display:flex;position:absolute;top:10px;left:10px;box-shadow:0 8px 24px #00000059}#hud #inv,#hud #inv *{pointer-events:auto}#hearts{pointer-events:none;align-items:center;gap:4px;display:flex}#hearts img{width:24px;height:24px;image-rendering:pixelated;filter:drop-shadow(0 1px 2px #00000080)}#objective{color:#e8f0c8;pointer-events:none;font-size:13.5px;font-weight:600}#inv{flex-wrap:wrap;align-items:center;gap:6px;min-height:26px;display:flex}#inv:empty:after{content:"Inventario vacío";color:#c8d2b473;pointer-events:none;font-size:12px;font-style:italic}#inv .slot{color:#d8e4b8;cursor:pointer;background:#283020e6;border:1px solid #b4c88c66;border-radius:6px;align-items:center;gap:4px;padding:3px 8px 3px 4px;font-size:12px;display:inline-flex}#inv .slot:hover{background:#374428f2;border-color:#c8e090}#inv .slot img{object-fit:contain;width:22px;height:22px;image-rendering:pixelated}#inv .slot .count{color:#a8c070;font-weight:600}#hint{color:#b8d078;pointer-events:none;min-height:1.2em;font-size:12.5px}#hint.speech{color:#e8ecd8;background:#12160eb8;border:1px solid #c8e09059;border-radius:8px;max-width:min(420px,92vw);padding:6px 10px;line-height:1.35}#hint:empty{display:none}#status.debug{color:#c8d2b4bf;white-space:pre-wrap;word-break:break-word;pointer-events:none;border-top:1px solid #b4c88c33;margin-top:4px;padding-top:6px;font-size:11px;line-height:1.35}#status.debug[hidden]{display:none!important}#touch-controls{z-index:5;pointer-events:none;display:none;position:absolute;inset:0}#touch-controls .pad{pointer-events:auto;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 118px);left:max(10px,env(safe-area-inset-left));-webkit-user-select:none;user-select:none;width:min(112px,15vh);height:min(112px,15vh);position:absolute}#touch-controls button{appearance:none;color:#e8ecd8;touch-action:none;-webkit-tap-highlight-color:transparent;background:#0c100a6b;border:1.5px solid #c8e09073;border-radius:12px;width:min(42px,5.5vh);height:min(42px,5.5vh);font:700 13px/1 system-ui,sans-serif}#touch-controls button:active,#touch-controls button.held{background:#c8e09059;border-color:#c8e090}#touch-controls .pad button{position:absolute}#btn-up{top:0;left:50%;transform:translate(-50%)}#btn-down{bottom:0;left:50%;transform:translate(-50%)}#btn-left{top:50%;left:0;transform:translateY(-50%)}#btn-right{top:50%;right:0;transform:translateY(-50%)}#touch-bar{z-index:6;padding:8px 10px calc(8px + env(safe-area-inset-bottom));pointer-events:none;background:linear-gradient(#0000,#080a06c7 28%);display:none;position:absolute;bottom:0;left:0;right:0}#touch-bar .row{pointer-events:auto;flex-wrap:wrap;justify-content:center;align-items:stretch;gap:8px;max-width:100%;display:flex}#touch-bar button{appearance:none;color:#e8f0c8;touch-action:manipulation;-webkit-tap-highlight-color:transparent;background:#0c100ab8;border:2px solid #c8e09080;border-radius:14px;flex:100px;min-width:calc(33.33% - 8px);min-height:52px;padding:12px 14px;font:700 clamp(15px,4.2vw,18px)/1.15 system-ui,sans-serif;box-shadow:0 4px 14px #00000059}#touch-bar button:active,#touch-bar button.held{background:#c8e09052;border-color:#c8e090}#inv.inv-collapsed{display:none!important}@media (pointer:coarse),(width<=900px){#touch-controls,#touch-bar{display:block}}#boot-tap,#boot-intro{z-index:30;pointer-events:auto;-webkit-tap-highlight-color:transparent;justify-content:center;align-items:center;display:flex;position:absolute;inset:0}#boot-tap[hidden],#boot-intro[hidden]{display:none!important}#boot-tap{cursor:pointer;background:#080a06c7}#boot-tap .msg{text-align:center;color:#e8f0c8;letter-spacing:.04em;text-shadow:0 2px 14px #000000a6;font-size:clamp(20px,5vw,32px);font-weight:700}#boot-tap .sub{opacity:.7;margin-top:10px;font-size:clamp(12px,3vw,15px);font-weight:500}#boot-intro{background:#080a068c}#boot-intro .panel{flex-direction:column;align-items:center;gap:14px;width:min(360px,90vw);display:flex;position:relative}#boot-intro .panel>img{filter:drop-shadow(0 12px 28px #0000008c);pointer-events:none;width:100%;height:auto}#boot-intro .copy{text-align:center;color:#2a2418;pointer-events:none;flex-direction:column;justify-content:center;font-size:clamp(13px,3.4vw,15.5px);font-weight:600;line-height:1.4;display:flex;position:absolute;inset:16% 12% 28%}#boot-intro .copy .title{margin-bottom:6px;font-size:1.1em}#boot-intro .next{appearance:none;color:#f0e8d0;cursor:pointer;touch-action:manipulation;z-index:1;background:#282012e0;border:2px solid #3c301c8c;border-radius:12px;min-width:140px;min-height:48px;padding:12px 22px;font:700 16px/1 system-ui,sans-serif;position:relative;box-shadow:0 6px 18px #0006}#boot-intro .next:active{background:#46381ef2}</style>
    <script type="module" crossorigin src="./_bundle/index-BlNlHs09.js"></script>
  </head>
  <body>
    <div id="app">
      <canvas id="game" width="1280" height="720"></canvas>
      <div id="hud">
        <div id="hearts" aria-label="Salud"></div>
        <div id="objective">Lee el mural · busca pistas</div>
        <div id="inv" aria-label="Inventario"></div>
        <div id="hint"></div>
        <div id="status" class="debug" hidden></div>
      </div>

      <div id="touch-controls" aria-label="Controles táctiles">
        <div class="pad">
          <button type="button" id="btn-up" data-code="KeyW" aria-label="Arriba">▲</button>
          <button type="button" id="btn-left" data-code="KeyA" aria-label="Izquierda">◀</button>
          <button type="button" id="btn-right" data-code="KeyD" aria-label="Derecha">▶</button>
          <button type="button" id="btn-down" data-code="KeyS" aria-label="Abajo">▼</button>
        </div>
      </div>

      <div id="touch-bar" aria-label="Acciones">
        <div class="row">
          <button type="button" id="btn-coger" data-action="coger" aria-label="Coger">Coger</button>
          <button type="button" id="btn-hablar" data-action="hablar" aria-label="Hablar">Hablar</button>
          <button type="button" id="btn-accion" data-action="accion" aria-label="Acción">Acción</button>
          <button type="button" id="btn-inventario" data-action="inventario" aria-label="Inventario">Inventario</button>
          <button type="button" id="btn-leer" data-action="leer" aria-label="Leer el pergamino">Leer el pergamino</button>
        </div>
      </div>

      <div id="boot-tap" role="button" tabindex="0" aria-label="Pulsa para jugar">
        <div>
          <div class="msg">Pulsa para jugar</div>
          <div class="sub">VitaInk · Atenas</div>
        </div>
      </div>

      <div id="boot-intro" hidden role="dialog" aria-modal="true" aria-label="Nota del piloto">
        <div class="panel">
          <img src="./assets/hud/png/256/parchment.png" alt="" width="256" height="256" />
          <div class="copy">
            <div class="title">Objetivo piloto</div>
            <div>Llave / anillo → puerta → 0·1·2 → tiempo</div>
            <div style="margin-top:8px;font-size:.92em;opacity:.85">Pulsa «Jugar» cuando hayas leído</div>
          </div>
          <button type="button" class="next" id="boot-next">Jugar</button>
        </div>
      </div>
    </div>

    <script>
(function () {
  function fire(type, code) {
    window.dispatchEvent(new KeyboardEvent(type, { code: code, key: code, bubbles: true, cancelable: true }));
  }
  function bindPad(btn) {
    var code = btn.getAttribute('data-code');
    if (!code) return;
    var down = false;
    function start(ev) {
      ev.preventDefault();
      if (down) return;
      down = true;
      btn.classList.add('held');
      fire('keydown', code);
    }
    function end(ev) {
      if (ev) ev.preventDefault();
      if (!down) return;
      down = false;
      btn.classList.remove('held');
      fire('keyup', code);
    }
    btn.addEventListener('pointerdown', start);
    btn.addEventListener('pointerup', end);
    btn.addEventListener('pointercancel', end);
    btn.addEventListener('pointerleave', end);
    btn.addEventListener('lostpointercapture', end);
  }
  function bindAction(btn) {
    var action = btn.getAttribute('data-action');
    if (!action) return;
    function tap(ev) {
      ev.preventDefault();
      window.dispatchEvent(new CustomEvent('vitaink-action', { detail: { action: action } }));
    }
    btn.addEventListener('pointerdown', tap);
  }
  document.querySelectorAll('#touch-controls button').forEach(bindPad);
  document.querySelectorAll('#touch-bar button[data-action]').forEach(bindAction);
})();
    </script>
  </body>
</html>
