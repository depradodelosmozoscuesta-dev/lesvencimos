<!doctype html>
<html lang="es">
  <head>

    <title>VitaInk Juego — Berlin pilot</title>
    <style>*{box-sizing:border-box;margin:0;padding:0}html,body{color:#e8ecd8;background:#1a1f16;width:100%;height:100%;font-family:system-ui,sans-serif;overflow:hidden}#app{width:100%;height:100%;position:relative}canvas#game{cursor:crosshair;background:#2a3528;width:100%;height:100%;display:block}#hud{pointer-events:none;background:#0c100ac7;border:1px solid #b4c88c59;border-radius:10px;flex-direction:column;gap:6px;max-width:min(420px,92vw);padding:10px 14px;font-size:13px;line-height:1.4;display:flex;position:absolute;top:12px;left:12px;box-shadow:0 8px 24px #00000059}#hud #inv,#hud #inv *{pointer-events:auto}#hearts{pointer-events:none;align-items:center;gap:4px;display:flex}#hearts img{width:26px;height:26px;image-rendering:pixelated;filter:drop-shadow(0 1px 2px #00000080)}#objective{color:#e8f0c8;pointer-events:none;font-size:14px;font-weight:600}#inv{flex-wrap:wrap;align-items:center;gap:6px;min-height:28px;display:flex}#inv:empty:after{content:"Inventario vacío";color:#c8d2b473;pointer-events:none;font-size:12px;font-style:italic}#inv .slot{color:#d8e4b8;cursor:pointer;background:#283020e6;border:1px solid #b4c88c66;border-radius:6px;align-items:center;gap:4px;padding:3px 8px 3px 4px;font-size:12px;display:inline-flex}#inv .slot:hover{background:#374428f2;border-color:#c8e090}#inv .slot img{object-fit:contain;width:22px;height:22px;image-rendering:pixelated}#inv .slot .count{color:#a8c070;font-weight:600}#hint{color:#b8d078;pointer-events:none;min-height:1.2em;font-size:12.5px}#hint:empty{display:none}#status.debug{color:#c8d2b4bf;white-space:pre-wrap;word-break:break-word;pointer-events:none;border-top:1px solid #b4c88c33;margin-top:4px;padding-top:6px;font-size:11px;line-height:1.35}#status.debug[hidden]{display:none!important}
#touch-controls{display:none;position:absolute;inset:0;z-index:5;pointer-events:none}
#touch-controls .pad{pointer-events:auto;position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:max(12px,env(safe-area-inset-left));width:168px;height:168px;user-select:none;-webkit-user-select:none}
#touch-controls .action{pointer-events:auto;position:absolute;bottom:max(28px,env(safe-area-inset-bottom));right:max(16px,env(safe-area-inset-right));display:flex;flex-direction:column;gap:10px}
#touch-controls button{appearance:none;border:2px solid #c8e09099;background:#0c100acc;color:#e8ecd8;font:700 16px/1 system-ui,sans-serif;border-radius:16px;width:56px;height:56px;touch-action:none;-webkit-tap-highlight-color:transparent}
#touch-controls button:active,#touch-controls button.held{background:#c8e09055;border-color:#c8e090}
#touch-controls .pad button{position:absolute}#btn-up{left:56px;top:0}#btn-down{left:56px;bottom:0}#btn-left{left:0;top:56px}#btn-right{right:0;top:56px}
#btn-e,#btn-t{width:64px;height:48px;font-size:14px;border-radius:24px}
@media (pointer:coarse),(max-width:900px){#touch-controls{display:block}}
    </style>
    <script type="module" crossorigin src="./_bundle/index-BEAQ8_kv.js"></script>
  </head>
  <body>
    <div id="app">
      <canvas id="game" width="1280" height="720"></canvas>
      <div id="hud">
        <div id="hearts" aria-label="Salud"></div>
        <div id="objective">Encuentra la llave/anillo y ábrelo</div>
        <div id="inv" aria-label="Inventario"></div>
        <div id="hint"></div>
        <div id="status" class="debug" hidden></div>
      </div>

      <div id="touch-controls" aria-label="Controles táctiles">
        <div class="pad">
          <button type="button" id="btn-up" data-code="KeyW" aria-label="Arriba">▲</button>
          <button type="button" id="btn-left" data-code="KeyA" aria-label="Izquierda">◀</button>
          <button type="button" id="btn-right" data-code="KeyD" aria-label="Derecha">▶</button>
          <button type="button" id="btn-down" data-code="KeyS" aria-label="Abajo">▼</button>
        </div>
        <div class="action">
          <button type="button" id="btn-e" data-code="KeyE" data-tap="1" aria-label="Cambiar etapa">E</button>
          <button type="button" id="btn-t" data-code="KeyT" data-tap="1" aria-label="Cambiar estilo">T</button>
        </div>
      </div>
    </div>

    <script>
(function () {
  function fire(type, code) { window.dispatchEvent(new KeyboardEvent(type, { code: code, key: code, bubbles: true, cancelable: true })); }
  function bind(btn) {
    var code = btn.getAttribute('data-code'), tap = btn.getAttribute('data-tap') === '1', down = false;
    function start(ev) { ev.preventDefault(); if (tap) { fire('keydown', code); setTimeout(function () { fire('keyup', code); }, 40); return; } if (down) return; down = true; btn.classList.add('held'); fire('keydown', code); }
    function end(ev) { if (ev) ev.preventDefault(); if (tap || !down) return; down = false; btn.classList.remove('held'); fire('keyup', code); }
    btn.addEventListener('pointerdown', start); btn.addEventListener('pointerup', end); btn.addEventListener('pointercancel', end); btn.addEventListener('pointerleave', end); btn.addEventListener('lostpointercapture', end);
  }
  document.querySelectorAll('#touch-controls button').forEach(bind);
  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function (err) { console.warn('SW register failed', err); }); });
})();
    </script>
  </body>
</html>
