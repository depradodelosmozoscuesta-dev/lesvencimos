<title>Casa</title>
<style>
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
html { font-size: calc(18px * var(--tam, 1)); }
body {
  background: var(--fondo);
  color: var(--tinta);
  font-family: "Segoe UI", system-ui, Roboto, sans-serif;
  line-height: 1.4;
}
button:not(:disabled), [role="button"]:not(:disabled) { cursor: pointer; }
:focus { outline: none; }
:focus-visible { outline: 3px solid var(--ambar); outline-offset: 3px; }
button, input { font: inherit; }

:root, [data-tema="noche"] {
  --fondo: #0d1017;
  --fondo2: #10141d;
  --panel: #171b25;
  --claro: #232936;
  --tinta: #e6ebf2;
  --suave: #9aa6b8;
  --ambar: #fbbf24;
  --verde: #34d399;
  --rojo: #f87171;
  --papel: #ece7dc;
  --luz: inset 0 1px 0 rgba(255,255,255,.09);
  --sombra: 0 0 0 1px rgba(230,235,242,.08), 0 10px 22px rgba(0,0,0,.28);
  --hundida: inset 0 2px 6px rgba(0,0,0,.42);
}
[data-tema="media"] {
  --fondo: #2a303a; --fondo2: #323844; --panel: #3a4250; --claro: #4a5364;
  --tinta: #eef2f6; --suave: #b8c2d0;
}
[data-tema="dia"] {
  --fondo: #dde3ea; --fondo2: #d3dae2; --panel: #ffffff; --claro: #c3ccd6;
  --tinta: #12212e; --suave: #3d5163; --ambar: #b45309; --verde: #047857; --rojo: #be123c;
  --luz: inset 0 1px 0 #fff;
  --sombra: 0 1px 0 rgba(18,33,46,.06), 0 2px 7px rgba(18,33,46,.08);
  --hundida: inset 0 2px 4px rgba(18,33,46,.16);
}
[data-acento="indigo"] { --acento: #818cf8; --acento2: #12141c; }
[data-acento="cielo"] { --acento: #38bdf8; --acento2: #0b1c28; }
[data-acento="verde"] { --acento: #34d399; --acento2: #0b1f16; }
[data-acento="ambar"] { --acento: #fbbf24; --acento2: #1c1408; }
[data-acento="naranja"] { --acento: #fb923c; --acento2: #1c1008; }
[data-acento="rosa"] { --acento: #f9a8d4; --acento2: #1c1016; }
[data-tema="dia"][data-acento="indigo"] { --acento: #4338ca; --acento2: #fff; }
[data-tema="dia"][data-acento="cielo"] { --acento: #0e7490; --acento2: #fff; }
[data-tema="dia"][data-acento="verde"] { --acento: #047857; --acento2: #fff; }
[data-tema="dia"][data-acento="ambar"] { --acento: #b45309; --acento2: #fff; }
[data-tema="dia"][data-acento="naranja"] { --acento: #c2410c; --acento2: #fff; }
[data-tema="dia"][data-acento="rosa"] { --acento: #be185d; --acento2: #fff; }

#raiz {
  height: 100%;
  background: linear-gradient(180deg, var(--fondo) 0%, var(--fondo2) 100%);
  overflow: hidden;
}

.marco { height: 100%; display: flex; flex-direction: column; padding: 10px 14px 16px; gap: 10px; overflow: hidden; }
.cab { display: flex; align-items: center; gap: 10px; min-height: 56px; flex-shrink: 0; }
.cab h1 { font-size: 1.45rem; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 800; letter-spacing: -.03em; }
.cuerpo { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px; }

.icono, .btn, .fila, .esq, .mini, .flecha, .pastilla, .sexo {
  appearance: none; border: none;
  background: var(--panel); color: var(--tinta);
  box-shadow: var(--luz), var(--sombra);
}
.icono { width: 52px; height: 52px; min-width: 52px; border-radius: 16px; display: grid; place-items: center; padding: 0; }
.icono svg { width: 24px; height: 24px; }
.btn { border-radius: 16px; min-height: 52px; padding: 0 18px; font-weight: 800; }
.btn-acento { background: var(--acento); color: var(--acento2); }
.btn-suave { color: var(--suave); font-weight: 400; }
.btn:active:not(:disabled), .icono:active, .fila:active, .esq:active, .mini:active { box-shadow: var(--hundida); transform: scale(.97); }
.btn:disabled, .flecha:disabled { opacity: .4; }

.lista { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; }
.fila {
  width: 100%; min-height: 72px; border-radius: 18px; padding: 10px 16px;
  display: flex; align-items: center; gap: 12px; text-align: left;
}
.fila.activa { outline: 2px solid var(--acento); }
.fila-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.fila-txt strong { font-size: 1.2rem; font-weight: 800; letter-spacing: -.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fila-txt em { font-style: normal; color: var(--suave); font-size: .92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.punto { width: 36px; height: 36px; border-radius: 12px; flex-shrink: 0; background: var(--claro); }

.escena { flex: 1; min-height: 0; display: grid; grid-template-columns: 3.2rem minmax(0,1fr) 3.2rem; gap: 8px; align-items: stretch; }
.escena.sola { grid-template-columns: minmax(0,1fr); }
.centro { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.flecha {
  align-self: center; width: 3.2rem; height: 6.2rem; border-radius: 18px;
  display: grid; place-items: center; color: var(--acento);
}

.carta { flex: 1; min-height: 0; border-radius: 22px; background: var(--panel); box-shadow: var(--luz), var(--sombra); padding: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; overflow: hidden; }
.cifra { font-size: 3rem; font-weight: 800; margin: 0; letter-spacing: -.05em; line-height: .9; }
.nom { font-size: 1.35rem; font-weight: 800; margin: 0; }
.meta { margin: 0; color: var(--suave); }
.aviso { margin: 0; font-size: .78rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--acento); }
.pastilla { min-height: 64px; width: 100%; max-width: 22rem; border-radius: 18px; background: var(--acento); color: var(--acento2); font-weight: 800; }

input {
  width: 100%; min-height: 52px; border-radius: 12px; padding: 12px 14px;
  background: var(--fondo); color: var(--tinta); border: 1.5px solid var(--claro);
}

.inicio {
  height: 100%; display: grid; grid-template-columns: 1fr 1fr;
  grid-template-rows: auto auto minmax(0,1fr) auto;
  gap: 10px 12px; padding: 12px 14px 20px;
}
.inicio-top { grid-column: 1 / -1; display: flex; justify-content: space-between; }
.mini { min-height: 64px; min-width: 4.8rem; width: 5.6rem; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-weight: 800; font-size: .78rem; }
.esq {
  width: min(46vw, 11.2rem); min-height: 6.6rem; border-radius: 26px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 6px; font-weight: 800; font-size: 1.08rem;
}
.esq-agenda { grid-column: 1; grid-row: 2; justify-self: start; }
.esq-gym { grid-column: 2; grid-row: 2; justify-self: end; }
.esq-cocina { grid-column: 1; grid-row: 4; justify-self: start; }
.esq-mas { grid-column: 2; grid-row: 4; justify-self: end; }
.centro-casa { grid-column: 1 / -1; grid-row: 3; min-height: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 6px; }
.marca { font-weight: 800; font-size: clamp(1.4rem, 5vw, 2rem); letter-spacing: -.05em; }
.reloj { font-size: clamp(3.6rem, 22vw, 7.5rem); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.06em; line-height: 1; }
.fecha { color: var(--suave); margin: 0; }
.caja-pild { width: min(100%, 22rem); border-radius: 22px; background: var(--panel); padding: 14px 16px; box-shadow: var(--luz), var(--sombra); }
.caja-pild .nom { font-size: 1.5rem; }

.gim-escena { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.gim-lienzo { flex: 1; min-height: 0; position: relative; border-radius: 22px; overflow: hidden; background: #fde3c6; box-shadow: var(--luz), var(--sombra); }
.gim-lienzo canvas { width: 100%; height: 100%; display: block; }
.gim-hud { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); text-align: center; pointer-events: none; }
.gim-rep { font-size: 3rem; font-weight: 800; margin: 0; line-height: .9; color: #5a4334; }
.gim-de { margin: 0; font-size: .72rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #9a8468; }
.gim-cue { margin: 0; text-align: center; font-weight: 800; color: var(--acento); min-height: 2.4em; }
.gim-mandos { display: flex; gap: 8px; }
.gim-mandos .pastilla { flex: 1; width: auto; }
.sexo { min-height: 44px; padding: 0 14px; border-radius: 999px; font-weight: 800; }

.wordle-caja { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.wordle-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: min(280px, 100%); }
.celda { aspect-ratio: 1; border-radius: 10px; border: 2px solid var(--claro); display: grid; place-items: center; font-weight: 800; font-size: 1.3rem; }
.celda.verde { background: var(--verde); color: #052e1c; border-color: transparent; }
.celda.ambar { background: var(--ambar); color: #1c1408; border-color: transparent; }
.celda.gris { background: var(--claro); border-color: transparent; }
.teclado { width: 100%; display: grid; gap: 5px; }
.teclado-fila { display: flex; justify-content: center; gap: 4px; }
.tecla { min-width: 28px; flex: 1; max-width: 46px; min-height: 48px; border-radius: 8px; border: 0; background: var(--claro); color: var(--tinta); font-weight: 800; }
.tecla.verde { background: var(--verde); color: #052e1c; }
.tecla.ambar { background: var(--ambar); color: #1c1408; }
.tecla.gris { opacity: .45; }
.tecla.larga { max-width: 76px; font-size: .75rem; }

.modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 24px; z-index: 20; }
.modal-caja { width: min(520px, 100%); background: var(--panel); color: var(--tinta); border-radius: 28px; padding: 22px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--sombra); }
.timer-num { font-size: 3.4rem; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; margin: 0; }

.nota { background: var(--papel); color: #1c1408; padding: 14px 16px; border-radius: 4px 4px 12px 8px; font-size: 1.25rem; width: min(100%, 22rem); }

.lista.poca .fila { flex: 0 0 auto; height: calc((100% - 8px) / 2); min-height: 72px; }
.fila.hueca { opacity: 0.95; }
.fila img.ilu-mini { width: 36px; height: 36px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }

.ilu-escena { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.ilu-papel { flex: 1; min-height: 0; position: relative; border-radius: 22px; overflow: hidden; background: var(--papel); box-shadow: var(--luz), var(--sombra); }
.ilu-papel canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.ilu-papel.con-rejilla::after {
  content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background-image:
    repeating-linear-gradient(to bottom, rgba(80,55,30,.32) 0 1px, transparent 1px 40px),
    repeating-linear-gradient(to right, rgba(80,55,30,.32) 0 1px, transparent 1px 40px);
}
.ilu-barra { flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px; }
.ilu-colores { display: flex; gap: 6px; justify-content: space-between; }
.ilu-tinta {
  flex: 1 1 0; max-width: 52px; min-width: 36px; min-height: 44px; aspect-ratio: 1;
  border-radius: 50%; border: 3px solid rgba(230,235,242,.18); padding: 0;
  box-shadow: var(--luz), var(--sombra);
}
.ilu-tinta.activa { border-color: var(--acento); outline: 3px solid var(--ambar); outline-offset: 2px; }
.ilu-herramientas { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ilu-herramientas .btn { min-height: 48px; padding: 0 12px; }
.ilu-grosor {
  width: 48px; height: 48px; min-width: 48px; border: none; border-radius: 16px;
  background: var(--panel); color: var(--tinta); box-shadow: var(--luz), var(--sombra);
  display: grid; place-items: center; padding: 0;
}
.ilu-grosor span { display: block; border-radius: 50%; background: var(--tinta); }
.ilu-grosor.activa { background: var(--acento); color: var(--acento2); }
.ilu-grosor.activa span { background: var(--acento2); }
.icono.activo { background: var(--acento); color: var(--acento2); }
.btn.activa { background: var(--acento); color: var(--acento2); }
.ilu-aviso { margin: 0; text-align: center; color: var(--verde); font-weight: 800; min-height: 1.2em; }
.ilu-aviso.consejo { color: var(--suave); font-weight: 700; }

.doc-cuerpo { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.doc-titulo { flex: 0 0 auto; width: 100%; min-height: 52px; font-weight: 800; font-size: 1.2rem; background: var(--panel); }
.doc-area {
  flex: 1; min-height: 0; width: 100%; resize: none; overflow-y: auto;
  border-radius: 18px; background: var(--papel); color: #1c1408;
  font-size: 1.15rem; line-height: 1.55; padding: 16px 18px;
  border: 1.5px solid var(--claro); font: inherit;
}
.doc-mandos { flex: 0 0 auto; display: flex; gap: 8px; }
.doc-mandos .btn { flex: 1; min-height: 52px; }

@media print {
  body { overflow: auto; background: #fff; color: #111; }
  .cab, .inicio-top, .esq, .mini, .cuerpo, .ilu-escena, .doc-cuerpo, .gim-escena, .centro-casa { display: none !important; }
  .hoja-print { display: block !important; padding: 24px; color: #111; }
  .hoja-print h1 { font-size: 22pt; margin: 0 0 12px; }
  .hoja-print p { margin: .4em 0; }
}

@media (max-width: 520px) {
  .esq { width: min(44vw, 9.5rem); min-height: 5.8rem; font-size: 1rem; }
  .reloj { font-size: clamp(3rem, 18vw, 5rem); }
}

</style>

function pintarPalabra(intento, secreto) {
  var res = ["gris", "gris", "gris", "gris", "gris"];
  var resto = secreto.split("");
  var i, j;
  for (i = 0; i < 5; i++) {
    if (intento[i] === secreto[i]) {
      res[i] = "verde";
      resto[i] = "";
    }
  }
  for (i = 0; i < 5; i++) {
    if (res[i] === "verde") continue;
    j = resto.indexOf(intento[i]);
    if (j >= 0) {
      res[i] = "ambar";
      resto[j] = "";
    }
  }
  return res;
}

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    var rr = typeof r === "number" ? r : 8;
    this.beginPath();
    this.moveTo(x + rr, y);
    this.arcTo(x + w, y, x + w, y + h, rr);
    this.arcTo(x + w, y + h, x, y + h, rr);
    this.arcTo(x, y + h, x, y, rr);
    this.arcTo(x, y, x + w, y, rr);
    this.closePath();
    return this;
  };
}

function pad(n) { return (n < 10 ? "0" : "") + n; }
function hoyIso() {
  var d = new Date();
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}
function isoMas(dias) {
  var d = new Date();
  d.setDate(d.getDate() + dias);
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}
function horaAhora() {
  var d = new Date();
  return pad(d.getHours()) + ":" + pad(d.getMinutes());
}
function franjaAhora() {
  var h = new Date().getHours();
  if (h >= 6 && h < 12) return "mañana";
  if (h >= 12 && h < 16) return "mediodía";
  if (h >= 16 && h < 20) return "tarde";
  return "noche";
}
function saludo() {
  var h = new Date().getHours();
  if (h < 6 || h >= 20) return "Buenas noches";
  if (h < 12) return "Buenos días";
  return "Buenas tardes";
}
function fechaLarga(iso) {
  var p = iso.split("-");
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return DIAS[d.getDay()] + " " + d.getDate() + " de " + MESES[d.getMonth()];
}
function fechaCorta(iso) {
  var p = iso.split("-");
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return d.getDate() + " " + MESES[d.getMonth()].slice(0, 3);
}

  return String(s)
    .replace(/&/g, "&" + "amp;")
    .replace(/</g, "&" + "lt;")
    .replace(/>/g, "&" + "gt;")
    .replace(/"/g, "&" + "quot;");
}

function cargar() {

    if (!g.dibujos) g.dibujos = [];

function paginar(items) {
  var total = Math.max(1, Math.ceil(items.length / POR_PAGINA));
  var p = Math.min(Math.max(0, pagina), total - 1);
  pagina = p;
  return { total: total, pagina: p, trozo: items.slice(p * POR_PAGINA, p * POR_PAGINA + POR_PAGINA) };
}
function escena(items, pintarItem, vacia) {

  var sola = pg.total <= 1;

function htmlWordle() {
  var hoy = hoyIso();
  if (datos.wordleDia !== hoy) {
    datos.wordleDia = hoy;

    datos.wordleOk = false;
    guardar();
  }
  var secreto = palabraDelDia(hoy);
  var filas = datos.wordleFilas;
  var ganado = datos.wordleOk;
  var perdido = !ganado && filas.length >= 6;
  var huecos = filas.slice();
  if (!ganado && !perdido) huecos.push((wordleActual + "     ").slice(0, 5));
  while (huecos.length < 6) huecos.push("     ");
  var grid = '<div class="wordle-grid">';
  for (var r = 0; r < 6; r++) {
    var cols = r < filas.length ? pintarPalabra(filas[r], secreto) : ["", "", "", "", ""];
    for (var c = 0; c < 5; c++) {
      grid += '<div class="celda ' + (cols[c] || "") + '">' + escapar((huecos[r][c] || "").trim()) + "</div>";
    }
  }
  grid += "</div>";
  var colores = {};
  for (var i = 0; i < filas.length; i++) {
    var cs = pintarPalabra(filas[i], secreto);
    for (var k = 0; k < 5; k++) {
      var L = filas[i][k];
      if (colores[L] === "verde") continue;
      if (cs[k] === "verde" || colores[L] !== "ambar") colores[L] = cs[k];
    }
  }
  function filaTeclas(s, extraBtn) {
    var h = '<div class="teclado-fila">';
    for (var i = 0; i < s.length; i++) {
      var cl = colores[s[i]] || "";
      h += '<button type="button" class="tecla ' + cl + '" data-a="w:' + s[i] + '">' + s[i] + "</button>";
    }
    if (extraBtn) h += extraBtn;
    return h + "</div>";
  }
  var teclado = '<div class="teclado">' +
    filaTeclas("QWERTYUIOP") +
    filaTeclas("ASDFGHJKL") +
    filaTeclas("ZXCVBNM", '<button type="button" class="tecla larga" data-a="w:BORRAR">←</button><button type="button" class="tecla larga" data-a="w:ENVIAR">OK</button>') +
    "</div>";
  var msg = wordleMsg || (ganado ? "Esa es." : perdido ? "Era " + secreto + "." : "");
  return marco("Palabra", "", '<div class="wordle-caja">' + grid + '<p class="meta">' + escapar(msg) + "</p>" + teclado + "</div>");
}

function volver() {
  if (vista === "gym" && extra.ex) { extra.ex = null; gym.playing = false; pintarPantalla(); return; }
  if (vista === "gym" && extra.grupo) { extra.grupo = null; pagina = 0; pintarPantalla(); return; }
  if (vista === "salud" && extra.alta) { extra.alta = false; extra.nombre = null; pintarPantalla(); return; }
  if (vista === "salud" && extra.franja) { extra.franja = null; pintarPantalla(); return; }
  if (vista === "agenda" && extra.form) { extra.form = null; pintarPantalla(); return; }
  if (vista === "agenda" && extra.sel) { extra.sel = null; pintarPantalla(); return; }
  if (vista === "hijo" && extra.escribir) { extra.escribir = false; pintarPantalla(); return; }
  if (vista === "cocina" && extra.plato && extra.paso != null) { extra.paso = null; pintarPantalla(); return; }
  if (vista === "cocina" && extra.plato) { extra.plato = null; pintarPantalla(); return; }
  if (vista === "cocina" && extra.ficha) { extra.ficha = null; pintarPantalla(); return; }
  if (vista === "cocina" && extra.altaSuper) { extra.altaSuper = false; pintarPantalla(); return; }
  if (vista === "cocina" && extra.zona) { extra.zona = null; pintarPantalla(); return; }
  if (vista === "cocina" && extra.grupo) { extra.grupo = null; pagina = 0; pintarPantalla(); return; }
  if (vista === "cocina" && extra.tab) { extra.tab = null; pintarPantalla(); return; }
  if (vista === "ilustrador" && extra.lienzo) {
    if (ilu.historial.length) guardarDibujo();
    extra.lienzo = false;
    extra.dibujoId = null;
    extra.tip = "";
    extra.foto = null;
    pagina = 0;
    pintarPantalla();
    return;
  }
  if (vista === "ilustrador") { ir("mas"); return; }
  if (vista === "escribir" && extra.folio) {
    guardarDocumento();
    extra.folio = null;
    pagina = 0;
    pintarPantalla();
    return;
  }
  if (vista === "escribir") { ir("mas"); return; }
  if (vista === "inicio") return;
  ir("inicio");
}

function onAccion(a, formEl) {
  var p = a.split(":");
  var k = p[0];
  var v = p.slice(1).join(":");
  if (k === "ir") {
    if (v.indexOf("hijo:") === 0) ir("hijo", { hijo: v.slice(5) });
    else ir(v);
    return;
  }
  if (k === "noop") return;
  if (k === "volver") { volver(); return; }
  if (k === "pag") { pagina += Number(v); pintarPantalla(); return; }
  if (k === "imprimir") {
    if (vista === "escribir") syncFolioDesdeForm();
    window.print();
    return;
  }
  if (k === "tomar") {
    datos.tomas[hoyIso() + "|" + v + "|" + franjaAhora()] = horaAhora();
    guardar(); pintarPantalla(); return;
  }
  if (k === "salud") { extra.franja = v; pagina = 0; pintarPantalla(); return; }
  if (k === "saludalta") { extra.alta = true; extra.nombre = null; pagina = 0; pintarPantalla(); return; }
  if (k === "mednom") {
    if (v === "Otro") {
      extra.nombre = "Caja";
    } else extra.nombre = v;
    pagina = 0; pintarPantalla(); return;
  }
  if (k === "medfra") {
    datos.medicamentos.push({ id: uid("m"), nombre: extra.nombre, dosis: "1", franjas: [v], notas: "", colorCaja: "#5b8def" });
    extra.alta = false; extra.nombre = null; guardar(); pintarPantalla(); return;
  }
  if (k === "togglemed") {
    var parts = v.split(":");
    var clave = hoyIso() + "|" + parts[1] + "|" + parts[0];
    if (datos.tomas[clave]) delete datos.tomas[clave];
    else datos.tomas[clave] = horaAhora();
    guardar(); pintarPantalla(); return;
  }
  if (k === "agendaalta") { extra.form = {}; extra.sel = null; pagina = 0; pintarPantalla(); return; }
  if (k === "agtipo") { extra.form.tipo = v; pintarPantalla(); return; }
  if (k === "agfecha") { extra.form.fecha = v; pintarPantalla(); return; }

  }

function teclaWordle(k) {
  var hoy = hoyIso();
  if (datos.wordleDia !== hoy) return;
  if (datos.wordleOk || datos.wordleFilas.length >= 6) return;
  if (k === "BORRAR") { wordleActual = wordleActual.slice(0, -1); wordleMsg = ""; pintarPantalla(); return; }
  if (k === "ENVIAR") {
    var w = wordleActual.toUpperCase();
    if (w.length !== 5) { wordleMsg = "Cinco letras."; pintarPantalla(); return; }
    if (!DICCIONARIO[w]) { wordleMsg = "Esa no la tengo."; pintarPantalla(); return; }
    datos.wordleFilas = datos.wordleFilas.concat([w]);
    datos.wordleOk = w === palabraDelDia(hoy);
    wordleActual = "";
    wordleMsg = datos.wordleOk ? "Esa es." : (datos.wordleFilas.length >= 6 ? "Era " + palabraDelDia(hoy) + "." : "");
    guardar(); pintarPantalla(); return;
  }
  if (wordleActual.length < 5) wordleActual += k;
  pintarPantalla();
}

/* ——— Gimnasio: el lienzo no se reconstruye en cada tick, solo se pinta ——— */
function pararGym() {
  gym.playing = false;
  if (gym.raf) { cancelAnimationFrame(gym.raf); gym.raf = 0; }
  if (window.speechSynthesis) speechSynthesis.cancel();
}
function pintarFrame() {
  var lienzo = document.getElementById("lienzo");
  if (!lienzo || !extra.ex) return;
  var g = lienzo.getContext("2d");
  if (!g) return;
  pintar(g, extra.ex, gym.animT, performance.now(), gym.playing && !gym.done, datos.ajustes.figura || "chica");
}
function prepararLienzo() {
  var lienzo = document.getElementById("lienzo");
  if (!lienzo || !extra.ex) return;
  var g = lienzo.getContext("2d");
  if (!g) return;
  ajustarLienzo(lienzo, g);
  pintarFrame();
  if (window.ResizeObserver) {
    if (gym.ro) gym.ro.disconnect();
    gym.ro = new ResizeObserver(function () {
      if (ajustarLienzo(lienzo, g)) pintarFrame();
    });
    gym.ro.observe(lienzo);
  }
}
function hablar(t) {
  if (!gym.voz || !window.speechSynthesis || !t) return;
  var u = new SpeechSynthesisUtterance(t);
  u.lang = "es-ES";
  u.rate = gym.lento ? 0.85 : 1;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
function pitar(hz, ms, vol) {
  if (!gym.voz || !gym.audio) return;
  try {
    var t = gym.audio.currentTime;
    var o = gym.audio.createOscillator();
    var g = gym.audio.createGain();
    o.type = "sine";
    o.frequency.value = hz;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
    o.connect(g); g.connect(gym.audio.destination);
    o.start(t); o.stop(t + ms / 1000 + 0.02);
  } catch (e) {}
}
function onRep() {
  if (!gym.playing || gym.done || !extra.ex) return;
  gym.reps += 1;
  var n = gym.reps;
  var meta = typeof repsDe === "function" ? repsDe(extra.ex) : (extra.ex.reps || 8);
  var el = document.getElementById("gimrep");
  if (el) el.textContent = String(n);
  if (n < meta) {
    pitar(880, 120, 0.22);
    hablar(decirNumero(n));
    var cue = document.getElementById("gimcue");
    if (cue) cue.textContent = decirNumero(n).toUpperCase();
  } else {
    gym.done = true; gym.playing = false;
    var cue2 = document.getElementById("gimcue");
    if (cue2) cue2.textContent = "Serie completa";
    var play = document.getElementById("gymplay");
    if (play) play.innerHTML = ICO.play + "Otra serie";
    hablar("Serie completa. " + meta + " repeticiones de " + extra.ex.name + ".");
  }
}
function frameGym(now) {
  var dt = (now - gym.last) / 1000;
  gym.last = now;
  if (dt > 0.05) dt = 0.05;
  if (gym.playing && !gym.done && extra.ex) {
    var cycle = extra.ex.cycle * (gym.lento ? 1.6 : 1);
    var prev = gym.animT;
    gym.animT += dt / cycle;
    if (!gym.mid && prev < 0.45 && gym.animT >= 0.45) {
      gym.mid = true;
      pitar(660, 90, 0.12);
      var cue = document.getElementById("gimcue");
      if (cue && extra.ex.cueUp) cue.textContent = extra.ex.cueUp;
    }
    if (gym.animT >= 1) {
      gym.animT -= 1;
      gym.mid = false;
      var cue2 = document.getElementById("gimcue");
      if (cue2 && extra.ex.cueDown) cue2.textContent = extra.ex.cueDown;
      onRep();
    }
  }
  pintarFrame();
  if (!gym.playing || gym.done) { gym.raf = 0; return; }
  gym.raf = requestAnimationFrame(frameGym);
}
function toggleGym() {
  if (!extra.ex) return;
  try {
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (!gym.audio && Ctor) gym.audio = new Ctor();
    if (gym.audio && gym.audio.state === "suspended") gym.audio.resume();
  } catch (e) { gym.audio = null; }
  var meta = typeof repsDe === "function" ? repsDe(extra.ex) : (extra.ex.reps || 8);
  if (gym.done) {
    gym.reps = 0; gym.done = false; gym.animT = 0; gym.mid = false;
    var el = document.getElementById("gimrep");
    if (el) el.textContent = "0";
  }
  gym.playing = !gym.playing;
  var play = document.getElementById("gymplay");
  if (play) play.innerHTML = (gym.playing ? ICO.pausa + "Pausar" : ICO.play + "Empezar");
  if (gym.playing) {
    if (!gym.announced) {
      hablar(extra.ex.intro + " " + meta + " repeticiones.");
      gym.announced = true;
    }
    gym.last = performance.now();
    if (!gym.raf) gym.raf = requestAnimationFrame(frameGym);
  } else if (window.speechSynthesis) speechSynthesis.cancel();
}

function posIlustrador(ev, el) {
  var r = el.getBoundingClientRect();
  return { x: ev.clientX - r.left, y: ev.clientY - r.top };
}
function snapshotIlustrador() {
  var el = document.getElementById("ilulienzo");
  var g = el && el.getContext("2d");
  if (!el || !g) return;
  try {
    ilu.historial.push(g.getImageData(0, 0, el.width, el.height));
    if (ilu.historial.length > 20) ilu.historial.shift();
  } catch (e) {}
}
function pintarPapelIlustrador(g, w, h) {
  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = PAPEL_ILU;
  g.fillRect(0, 0, w, h);
  g.restore();
}
function prepararIlustrador() {
  var el = document.getElementById("ilulienzo");
  var caja = document.getElementById("ilupapel");
  if (!el || !caja) return;
  var g = el.getContext("2d");
  if (!g) return;
  var dpr = Math.max(1, window.devicePixelRatio || 1);
  var w = Math.max(1, Math.round(caja.clientWidth));
  var h = Math.max(1, Math.round(caja.clientHeight));
  el.width = Math.round(w * dpr);
  el.height = Math.round(h * dpr);
  el.style.width = w + "px";
  el.style.height = h + "px";
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.lineCap = "round";
  g.lineJoin = "round";
  pintarPapelIlustrador(g, el.width, el.height);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (extra.foto) {
    var img = new Image();
    img.onload = function () {
      var esc = Math.min(w / img.width, h / img.height);
      var dw = img.width * esc;
      var dh = img.height * esc;
      g.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
    };
    img.src = extra.foto;
  }
  ilu.dibujando = false;
  el.onpointerdown = function (ev) {
    if (ev.button != null && ev.button !== 0) return;
    ev.preventDefault();
    snapshotIlustrador();
    ilu.dibujando = true;
    try { el.setPointerCapture(ev.pointerId); } catch (e2) {}
    var p = posIlustrador(ev, el);
    g.beginPath();
    g.moveTo(p.x, p.y);
  };
  el.onpointermove = function (ev) {
    if (!ilu.dibujando) return;
    ev.preventDefault();
    var p = posIlustrador(ev, el);
    g.lineCap = "round";
    g.lineJoin = "round";
    g.lineWidth = ilu.grosor;
    g.globalCompositeOperation = "source-over";
    g.strokeStyle = ilu.herramienta === "goma" ? PAPEL_ILU : ilu.tinta;
    g.lineTo(p.x, p.y);
    g.stroke();
    g.beginPath();
    g.moveTo(p.x, p.y);
  };
  el.onpointerup = el.onpointercancel = function (ev) {
    ilu.dibujando = false;
    try { el.releasePointerCapture(ev.pointerId); } catch (e3) {}
    g.beginPath();
  };
}
function marcarIlustrador() {
  var botones = raiz.querySelectorAll("[data-a]");
  for (var i = 0; i < botones.length; i++) {
    var a = botones[i].getAttribute("data-a") || "";
    if (a.indexOf("ilutinta:") === 0) {
      var hex = a.slice(9);
      botones[i].className = "ilu-tinta" + (ilu.tinta === hex && ilu.herramienta === "lapiz" ? " activa" : "");
    } else if (a.indexOf("ilugrosor:") === 0) {
      botones[i].className = "ilu-grosor" + (ilu.grosor === Number(a.slice(10)) ? " activa" : "");
    } else if (a === "iluherr:lapiz") {
      botones[i].className = "icono" + (ilu.herramienta === "lapiz" ? " activo" : "");
    } else if (a === "iluherr:goma") {
      botones[i].className = "icono" + (ilu.herramienta === "goma" ? " activo" : "");
    } else if (a === "ilurejilla") {
      botones[i].className = "btn" + (ilu.rejilla ? " activa" : "");
    }
  }
}
function deshacerIlustrador() {
  var last = ilu.historial.pop();
  var el = document.getElementById("ilulienzo");
  var g = el && el.getContext("2d");
  if (!last || !el || !g) return;
  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.putImageData(last, 0, 0);

}
function limpiarIlustrador() {
  var el = document.getElementById("ilulienzo");

  if (!el || !g) return;
  snapshotIlustrador();
  pintarPapelIlustrador(g, el.width, el.height);

}
function guardarDibujo() {
  var el = document.getElementById("ilulienzo");
  if (!el) return;
  var tmp = document.createElement("canvas");
  var max = 900;
  var escala = Math.min(1, max / Math.max(el.width, el.height));
  tmp.width = Math.max(1, Math.round(el.width * escala));
  tmp.height = Math.max(1, Math.round(el.height * escala));
  var tg = tmp.getContext("2d");
  if (!tg) return;
  tg.fillStyle = PAPEL_ILU;
  tg.fillRect(0, 0, tmp.width, tmp.height);
  tg.drawImage(el, 0, 0, tmp.width, tmp.height);
  var src = tmp.toDataURL("image/jpeg", 0.72);
  var titulo = "Dibujo " + ((datos.dibujos || []).length + 1);
  if (extra.dibujoId) {
    var viejo = (datos.dibujos || []).filter(function (x) { return x.id === extra.dibujoId; })[0];
    if (viejo) titulo = viejo.titulo;
    datos.dibujos = (datos.dibujos || []).filter(function (x) { return x.id !== extra.dibujoId; });
  }
  datos.dibujos = [{ id: uid("dibu"), titulo: titulo, src: src, fecha: hoyIso() }].concat(datos.dibujos || []).slice(0, 10);
  guardar();
}

  if (extra.folio.id) {
    datos.documentos = (datos.documentos || []).map(function (x) {
      return x.id === extra.folio.id ? { id: x.id, titulo: titulo, texto: texto, plantilla: extra.folio.plantilla, fecha: hoyIso() } : x;
    });
  } else {
    var id = uid("doc");
    extra.folio.id = id;
    extra.folio.titulo = titulo;
    datos.documentos = [{ id: id, titulo: titulo, texto: texto, plantilla: extra.folio.plantilla, fecha: hoyIso() }].concat(datos.documentos || []).slice(0, 24);
  }
  guardar();
}

raiz.addEventListener("click", function (ev) {
  var el = ev.target.closest("[data-a]");
  if (!el) return;
  if (el.tagName === "FORM") return;
  ev.preventDefault();
  onAccion(el.getAttribute("data-a"));
});
raiz.addEventListener("submit", function (ev) {
  var el = ev.target.closest("form[data-a]");
  if (!el) return;
  ev.preventDefault();
  onAccion(el.getAttribute("data-a"), el);
});

setInterval(function () {
  var r = document.getElementById("reloj");
  if (r) r.textContent = horaAhora();
  if (timer.corre) {
    timer.restante -= 1;
    if (timer.restante <= 0) {
      timer.corre = false; timer.restante = 0;
      pitar(880, 400, 0.3);
      if (window.speechSynthesis) {
        var u = new SpeechSynthesisUtterance("Ya está.");
        u.lang = "es-ES";
        speechSynthesis.speak(u);
      }
      if (vista === "timer") pintarPantalla();
    } else {
      var n = document.getElementById("timernum");
      if (n) n.textContent = minSeg(timer.restante);
    }
  }
}, 1000);

aplicarTema();
pintarPantalla();

})();
</script>
