<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FAF7F0"><title>L17 · El Credo</title><style>:root{--bg:#FAF7F0;--ink:#2A2620;--muted:#625B50;--card:#fff;--gold:#C4A15A;--soft:#F6ECD5;--blue:#315E78;--bs:#E5F0F5;--green:#3F7655;--gs:#E5F2E8;--rose:#9C3E4D;--rs:#F9E7EB;--line:#DED4C3;--shadow:0 8px 26px #2a262014}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{padding:14px 10px 34px}.wrap{max-width:960px;margin:auto}header{text-align:center;margin:4px 0 14px}.badge{display:inline-block;padding:5px 12px;border-radius:999px;background:var(--soft);color:#76591e;font-weight:800;font-size:.78rem;text-transform:uppercase}h1{font-size:clamp(1.35rem,4vw,2rem);margin:9px 0 3px}.sub{color:var(--muted);margin:0}.tools{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px 0}.btn{border:0;border-radius:999px;padding:10px 15px;background:var(--gold);color:#fff;font-weight:800;cursor:pointer}.btn.alt{background:#fff;color:#76591e;border:2px solid var(--gold)}.card{background:var(--card);box-shadow:var(--shadow);border-radius:18px;padding:16px;margin:12px 0}.card h2{font-size:1.2rem;margin:0 0 8px}.card p{line-height:1.5}.parts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.part{border:2px solid var(--line);border-radius:13px;padding:12px;background:#fffdf8;cursor:pointer;text-align:left}.part:hover,.part.on{border-color:var(--blue);background:var(--bs)}.part b{display:block;color:var(--blue)}.part small{display:block;color:var(--muted);line-height:1.3;margin-top:4px}.info{min-height:3em;padding:11px 13px;background:#fffdf8;border:2px solid var(--line);border-radius:12px;line-height:1.45;margin-top:10px}.words{display:flex;flex-wrap:wrap;gap:7px}.word{border:2px solid var(--line);border-radius:10px;padding:9px;background:#fff;cursor:pointer;font-weight:700}.word:hover,.word.on{border-color:var(--blue);background:var(--bs)}.q{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.q:first-child{border-top:0;margin-top:0}.q p{font-weight:800}.opts{display:grid;gap:7px}.opt{border:2px solid var(--line);border-radius:11px;background:#fff;padding:10px 12px;text-align:left;cursor:pointer;font-weight:650}.opt.ok{background:var(--gs);border-color:var(--green)}.opt.bad{background:var(--rs);border-color:var(--rose)}.result{display:none;margin-top:8px;padding:10px;border-radius:10px;font-weight:800}.result.show{display:block}.result.ok{background:var(--gs);color:#285337}.result.bad{background:var(--rs);color:#762d38}.note{border-left:4px solid var(--gold);background:var(--soft);padding:10px 13px;border-radius:0 12px 12px 0;line-height:1.45}footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:16px}@media(max-width:650px){.parts{grid-template-columns:1fr}.card{padding:14px}}</style></head><body><main class="wrap"><header><span class="badge">Lección 17 · Bloque B</span><h1>El Credo</h1><p class="sub">Síntesis de la fe cristiana</p></header><div class="tools"><button class="btn" id="full">⛶ Abrir a pantalla completa</button><button class="btn alt" onclick="location.reload()">Reiniciar</button></div><section class="card"><h2>Tres partes principales</h2><p>Pulsa una parte para leer su idea.</p><div class="parts"><button class="part" data-t="Creo en Dios Padre: origen, creador y fuente de vida y cuidado."><b>Padre</b><small>Origen y vida</small></button><button class="part" data-t="Creo en Jesucristo: Hijo de Dios, nacido de María, muerto y resucitado para la salvación."><b>Jesucristo</b><small>Vida y salvación</small></button><button class="part" data-t="Creo en el Espíritu Santo: presencia de Dios que anima y santifica a la Iglesia."><b>Espíritu Santo</b><small>Presencia y comunidad</small></button></div><div class="info" id="info">Elige una tarjeta.</div></section><section class="card"><h2>Palabras que necesitan glosa</h2><div class="words"><button class="word" data-t="Trinidad: un solo Dios en tres personas, según la fe cristiana.">Trinidad</button><button class="word" data-t="Iglesia: comunidad convocada; también puede nombrar institución o edificio.">Iglesia</button><button class="word" data-t="Resurrección: esperanza cristiana de que la muerte no tiene la última palabra.">Resurrección</button><button class="word" data-t="Vida eterna: plenitud de vida junto a Dios, no solo vivir muchos años.">Vida eterna</button></div><div class="info" id="wordInfo">Elige una palabra.</div></section><section class="card"><h2>Mini-quiz</h2><div class="q"><p>1. ¿Qué es un credo?</p><div class="opts"><button class="opt">Un examen de opiniones privadas.</button><button class="opt" data-ok="1">Una síntesis compartida de convicciones de fe.</button><button class="opt">Una lista de normas civiles.</button></div><div class="result"></div></div><div class="q"><p>2. Trinidad significa…</p><div class="opts"><button class="opt" data-ok="1">Un solo Dios en tres personas.</button><button class="opt">Tres dioses independientes.</button><button class="opt">Tres partes físicas de Dios.</button></div><div class="result"></div></div></section><footer>Offline · sin CDN · 1º ESO Religión Católica</footer></main><script>(function(){document.getElementById('full').onclick=function(){document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.()};document.querySelectorAll('.part').forEach(function(b){b.onclick=function(){document.querySelectorAll('.part').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('info').textContent=b.dataset.t}});document.querySelectorAll('.word').forEach(function(b){b.onclick=function(){document.querySelectorAll('.word').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.getElementById('wordInfo').textContent=b.dataset.t}});document.querySelectorAll('.q').forEach(function(q){var r=q.querySelector('.result');q.querySelectorAll('.opt').forEach(function(o){o.onclick=function(){q.querySelectorAll('.opt').forEach(function(x){x.classList.remove('ok','bad')});var ok=o.dataset.ok==='1';o.classList.add(ok?'ok':'bad');r.className='result show '+(ok?'ok':'bad');r.textContent=ok?'✓ Correcto.':'Aún no. Relee la glosa.'}})})})();</script></body></html>
