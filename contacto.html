<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https://formsubmit.co; form-action 'self' mailto: https://formsubmit.co; upgrade-insecure-requests">
  <meta name="description" content="Sugerencias anónimas — Les vencimos.">
  <meta name="theme-color" content="#0E0E0C">
  <title>Sugerencias — Les vencimos</title>
  <link rel="icon" href="/brand/favicon/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/brand/favicon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/brand/favicon/apple-touch-icon.png">
  <link rel="stylesheet" href="/brand/site.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="/" aria-label="Les vencimos">
        <img src="/brand/mark.svg" width="28" height="28" alt="">
        <span class="wordmark">Les vencimos</span>
      </a>
      <nav class="nav" aria-label="Secciones">
        <a href="/">Inicio</a>
        <a href="/estanteria.html">Estantería</a>
        <a href="/descargas.html">Descargas</a>
      </nav>
    </header>

    

    <div id="lv-main">
      <h1>Sugerencias</h1>
      <p class="lead">Sin nombre, sin correo, sin cuenta. Solo el mensaje. Si el formulario falla, se abre el correo en tu dispositivo.</p>
      <p class="note">No pidas datos personales aquí. Ideas de módulos, fallos, mejoras tipográficas: todo vale.</p>

      <form id="f" class="form-card" action="https://formsubmit.co/ajax/jorge.de.prado@gmail.com" method="POST">
        <input type="hidden" name="_subject" value="Les vencimos — sugerencia anónima">
        <input type="hidden" name="_template" value="table">
        <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
        <label for="msg">Tu mensaje</label>
        <textarea id="msg" name="message" required maxlength="4000" placeholder="Escribe sin firmar…"></textarea>
        <div class="row">
          <button type="submit" class="btn btn-primary">Enviar</button>
        </div>
        <p class="err" id="form-err" aria-live="polite"></p>
        <p class="ok" id="form-ok" aria-live="polite"></p>
      </form>
    </div>

    <footer class="site-foot">lesvencimos.com · anónimo</footer>
  </div>
<script>
  (function(){
    var f=document.getElementById('f');
    if(!f) return;
    var err=document.getElementById('form-err');
    var ok=document.getElementById('form-ok');
    f.addEventListener('submit', function(e){
      e.preventDefault();
      if(err) err.textContent='';
      if(ok) ok.textContent='';
      var msg=document.getElementById('msg').value.trim();
      if(!msg){ if(err) err.textContent='Escribe algo.'; return; }
      var body=new FormData(f);
      fetch(f.action, { method:'POST', body: body, headers: { 'Accept': 'application/json' } })
        .then(function(r){ if(!r.ok) throw new Error('fail'); return r.json().catch(function(){return {};}); })
        .then(function(){ if(ok) ok.textContent='Enviado. Gracias.'; f.reset(); })
        .catch(function(){
          var a=document.createElement('a');
          a.href='mailto:jorge.de.prado@gmail.com?subject='+encodeURIComponent('Les vencimos — sugerencia')+'&body='+encodeURIComponent(msg);
          a.click();
          if(err) err.textContent='Formulario no disponible; se abrió el correo.';
        });
    });
  })();
  </script>
</body>
</html>
