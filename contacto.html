  <style>
    :root {
      --fondo: #0E0E0C; --fondo-2: #161512; --fondo-3: #1C1A16;
      --tinta: #E6E1D6; --suave: #9A9488; --acento: #C4A15A; --acento-texto: #1A160E;
      --linea: rgba(230, 225, 214, 0.14); --peligro: #C46A4A; --ok: #8F9A72;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
      --radio: 2px; --max: 44rem;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    html { color-scheme: dark; }
    body {
      color: var(--tinta); background: var(--fondo);
      font-family: var(--sans); font-size: 1.05rem; font-weight: 400; line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--acento); text-decoration-thickness: 1px; text-underline-offset: 0.18em; }
    a:hover { color: var(--tinta); }
    .wrap { max-width: var(--max); margin: 0 auto; padding: 1.75rem 1.25rem 4rem; }
    @media (min-width: 880px) { .wrap { padding: 2.5rem 2rem 5rem 3.25rem; } }
    header.top {
      display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
      padding-bottom: 1.25rem; border-bottom: 1px solid var(--linea); margin-bottom: 2rem;
    }
    .brand { display: inline-flex; align-items: center; gap: .7rem; color: var(--tinta); text-decoration: none; }
    .brand svg { width: 28px; height: 28px; display: block; }
    .wordmark { font-family: var(--serif); font-size: 1.15rem; font-weight: 600; }
    .nav a { color: var(--suave); text-decoration: none; font-size: .85rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin-left: 1rem; }
    .nav a:hover { color: var(--acento); }
    h1 {
      margin: 0 0 .65rem; font-family: var(--serif); font-size: clamp(1.85rem, 4.5vw, 2.4rem);
      font-weight: 600; line-height: 1.12;
    }
    .lead { margin: 0 0 1.75rem; color: var(--suave); max-width: 36rem; }
    .lead strong { color: var(--tinta); font-weight: 600; }
    .num {
      font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--suave);
      font-weight: 600; margin: 0 0 .35rem;
    }
    .card {
      background: var(--fondo-2); border: 1px solid var(--linea); border-radius: var(--radio);
      padding: 1.25rem 1.15rem 1.35rem; margin: 0 0 1rem;
    }
    .card h2 { margin: 0 0 .35rem; font-family: var(--serif); font-size: 1.35rem; font-weight: 600; }
    .card .meta { margin: 0 0 .75rem; color: var(--acento); font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .card p { margin: 0 0 1rem; color: var(--suave); font-size: .95rem; }
    .btns { display: flex; flex-wrap: wrap; gap: .5rem; }
    .btn {
      appearance: none; display: inline-flex; align-items: center; justify-content: center;
      min-height: 44px; padding: .65rem 1.05rem; border-radius: var(--radio);
      border: 1px solid var(--linea); background: transparent; color: var(--tinta);
      font: 600 .9rem var(--sans); text-decoration: none; cursor: pointer;
    }
    .btn:hover { border-color: rgba(196,161,90,.55); color: var(--acento); }
    .btn-primary { background: var(--acento); color: var(--acento-texto); border-color: var(--acento); }
    .btn-primary:hover { color: var(--acento-texto); filter: brightness(1.05); }
    .modulos { margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--linea); }
    .modulos h2 {
      margin: 0 0 1rem; font-size: .72rem; letter-spacing: .16em; text-transform: uppercase;
      color: var(--suave); font-weight: 600;
    }
    footer {
      margin-top: 2.5rem; padding-top: 1.1rem; border-top: 1px solid var(--linea);
      color: var(--suave); font-size: .78rem; letter-spacing: .08em; text-transform: uppercase;
    }
    label { display: block; font-size: .85rem; color: var(--suave); margin: 0 0 .35rem; font-weight: 600; }
    input, textarea {
      width: 100%; padding: .7rem .85rem; border-radius: var(--radio); border: 1px solid var(--linea);
      background: var(--fondo-3); color: var(--tinta); font: inherit; margin: 0 0 .85rem;
    }
    textarea { min-height: 9rem; resize: vertical; }
    .note { color: var(--suave); font-size: .85rem; margin: 0 0 1rem; }
    .err { color: var(--peligro); font-size: .9rem; }
    .ok { color: var(--ok); font-size: .9rem; }
</style>

<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="/" aria-label="Les vencimos">

    <path d="M25.5 11.5 V19"/>
    <path d="M38.5 11.5 V19"/>

  <path fill="#E6E1D6" d="M32 8c-0.85 7.2-7.1 10.8-12.4 12.6C25.9 22.4 31.15 26 32 33.2c0.85-7.2 7.1-10.8 12.4-12.6C38.1 18.8 32.85 15.2 32 8z"/>
  <path fill="none" stroke="#9A9488" stroke-width="1.75" stroke-linecap="round" d="M12 36.5 H52"/>
  <path fill="none" stroke="#9A9488" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M18 36.5 C18 48 24.8 55.4 32 58.5 C39.2 55.4 46 48 46 36.5"/>
</svg>
        <span class="wordmark">Les vencimos</span>
      </a>
      <nav class="nav" aria-label="Secciones">
        <a href="/">Inicio</a>
        <a href="/descargas.html">Descargas</a>
      </nav>
    </header>

    <h1>Sugerencias</h1>
    <p class="lead">Sin nombre, sin correo, sin cuenta. Solo el mensaje. Si el formulario falla, se abre el correo en tu dispositivo.</p>
    <p class="note">No pidas datos personales aquí. Ideas de módulos, fallos, mejoras tipográficas: todo vale.</p>

    <form id="f" class="card" action="https://formsubmit.co/ajax/jorge.de.prado@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="Les vencimos — sugerencia anónima">
      <input type="hidden" name="_template" value="table">
      <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
      <label for="msg">Tu mensaje</label>
      <textarea id="msg" name="message" required maxlength="4000" placeholder="Escribe sin firmar…"></textarea>
      <div class="btns">
        <button type="submit" class="btn btn-primary">Enviar</button>
      </div>
      <p class="err" id="err" aria-live="polite"></p>
      <p class="ok" id="ok" aria-live="polite"></p>
    </form>

    <footer>lesvencimos.com · anónimo</footer>
  </div>
  <script>
  (function(){
    var f=document.getElementById('f');
    var err=document.getElementById('err');
    var ok=document.getElementById('ok');
    f.addEventListener('submit', function(e){
      e.preventDefault();
      err.textContent=''; ok.textContent='';
      var msg=document.getElementById('msg').value.trim();
      if(!msg){ err.textContent='Escribe algo.'; return; }
      var body=new FormData(f);
      fetch(f.action, { method:'POST', body: body, headers: { 'Accept': 'application/json' } })
        .then(function(r){ if(!r.ok) throw new Error('fail'); return r.json().catch(function(){return {}}); })
        .then(function(){ ok.textContent='Enviado. Gracias.'; f.reset(); })
        .catch(function(){
          var a=document.createElement('a');
          a.href='mailto:jorge.de.prado@gmail.com?subject='+encodeURIComponent('Les vencimos — sugerencia')+'&body='+encodeURIComponent(msg);
          a.click();
          err.textContent='Formulario no disponible; se abrió el correo.';
        });
    });
  })();
  </script>
</body>
